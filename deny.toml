[graph]
all-features = true

[advisories]
# PMAT-1347: `deny`, not `warn`. A yanked dependency is a publish-time hazard,
# not an ecosystem-health note — `cargo publish` resolves against the live
# index, so a dep yanked between the dry-run and the Friday batch fails the
# upload partway through a 31-crate DAG (release abort rule A4: no retry at the
# same version, fix forward at the next patch). No dep is yanked today, so this
# lands green and only ever fires BEFORE a publish, which is the whole point.
yanked = "deny"
# Unmaintained-but-not-vulnerable advisories pulled in via rustpython-parser
# (depyler-frontend's parser). All are upstream ecosystem health warnings,
# not security vulnerabilities. Revisit when rustpython-parser modernizes
# its dep graph or when xpile switches to a different Python parser.
# PMAT-2120: every id below carries an entry in docs/audits/advisory-ignores.yaml
# with a crate, a named owner, an owner ticket and a removed_by date, enforced by
# crates/xpile/tests/advisory_expiry.rs under the required workspace-test context.
# That gate also refuses a DEAD exemption — one whose removal leaves cargo-deny at
# exit 0 — by running the removal test PER EXEMPTION. Five of these lines used to
# read only "unmaintained ecosystem dep" (a first draft said three; the diff says
# five — 0075, 0080, 0090, 0098, 0100); the crate names came from cargo-deny.
ignore = [
    "RUSTSEC-2024-0436",  # paste (via malachite-bigint)
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0090",  # unic-emoji-char
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
