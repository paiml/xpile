[workspace]
resolver = "2"
members = [
    # ── code-lane core ─────────────────────────────────────────────
    "crates/xpile",
    "crates/xpile-agent",
    "crates/xpile-contracts",
    "crates/xpile-core",
    "crates/xpile-ffi-manifest",
    "crates/xpile-frontend",
    "crates/xpile-backend",                   # added 2026-05-15
    "crates/xpile-llm",
    "crates/xpile-mcp",
    "crates/xpile-meta-hir",
    "crates/xpile-oracle",
    "crates/xpile-bigint",                    # added 2026-05-17 (PMAT-012)
    # ── code-lane frontends ───────────────────────────────────────
    "crates/depyler-frontend",
    "crates/decy-frontend",
    "crates/ruchy-frontend",
    "crates/bashrs-frontend",                 # added 2026-05-17 (PMAT-037 / XPILE-BASHRS-MERGER-001)
    "crates/xpile-wasm-frontend",             # added 2026-06-25 (PMAT-954 WASM LIFT half)
    # ── code-lane backends ────────────────────────────────────────
    "crates/xpile-rust-codegen",
    "crates/xpile-ruchy-codegen",             # added 2026-05-15
    "crates/xpile-ptx-codegen",               # added 2026-05-15
    "crates/xpile-wgsl-codegen",              # added 2026-05-15
    "crates/xpile-spirv-codegen",             # added 2026-06-25 (PMAT-960 SPIR-V via WGSL→naga→spv)
    "crates/xpile-wasm-codegen",              # added 2026-06-25 (PMAT-951 native WASM emit)
    "crates/xpile-forjar-codegen",            # added 2026-06-25 (PMAT-953 forjar.yaml backend-only)
    "crates/xpile-lean-codegen",              # added 2026-05-15
    "crates/bashrs-backend",                  # added 2026-05-17 (PMAT-037 / XPILE-BASHRS-MERGER-001)
    # ── proof-lane trait abstractions ─────────────────────────────
    "crates/xpile-contract-frontend",         # added 2026-05-15
    "crates/xpile-contract-backend",          # added 2026-05-15
    # ── proof-lane frontends + backends ───────────────────────────
    "crates/latex-contract-frontend",         # added 2026-05-15
    "crates/xpile-lean-contract-backend",     # added 2026-05-15
    "crates/xpile-latex-contract-backend",    # added 2026-05-15
]

[workspace.package]
version = "0.1.602"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["PAIML Engineering"]
repository = "https://github.com/paiml/xpile"
homepage = "https://github.com/paiml/xpile"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

# GPU execution lane (PMAT-950): wgpu compute backend that RUNS emitted
# WGSL on a real Vulkan/Metal/DX12 adapter — the executed half of the §29
# WGSL DiffExec quorum (`xpile-wgsl-codegen`). default-features off + an
# explicit cross-vendor backend set so the crate compiles on free CI
# (no adapter → graceful-skip) and runs the witness on any GPU box.
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"
bytemuck = "1"

# SPIR-V lane (PMAT-960): naga is the WGSL→SPIR-V compiler — parse the
# (reused) `xpile-wgsl-codegen` WGSL via `wgsl-in`, validate, then emit
# SPIR-V binary words via the `spv-out` backend. naga 29.0.3 is ALREADY in
# the lockfile (pulled transitively by wgpu), so this is a feature-set
# pin, not a new crate / new advisory surface. We do NOT hand-write a
# SPIR-V assembler — naga's `spv` backend is the emitter.
naga = { version = "29", default-features = false, features = ["wgsl-in", "spv-out"] }

# External: aprender's provable-contracts framework (`aprender-contracts`
# on crates.io). Pinned to a fixed minor — bump when adopting new pv
# features. Resolves on CI and crates.io without any sibling checkout.
#
# For local development against an in-progress aprender-contracts at
# ../aprender, add to your personal config (not committed):
#   # .cargo/config.toml
#   [patch.crates-io]
#   aprender-contracts = { path = "../aprender/crates/aprender-contracts" }
provable-contracts = { version = "0.33", package = "aprender-contracts" }

# Code lane: core
xpile-agent          = { version = "0.1.12", path = "crates/xpile-agent" }
xpile-contracts      = { version = "0.1.12", path = "crates/xpile-contracts" }
xpile-core           = { version = "0.1.12", path = "crates/xpile-core" }
xpile-ffi-manifest   = { version = "0.1.12", path = "crates/xpile-ffi-manifest" }
xpile-frontend       = { version = "0.1.12", path = "crates/xpile-frontend" }
xpile-backend        = { version = "0.1.12", path = "crates/xpile-backend" }
xpile-llm            = { version = "0.1.12", path = "crates/xpile-llm" }
xpile-mcp            = { version = "0.1.12", path = "crates/xpile-mcp" }
xpile-meta-hir       = { version = "0.1.12", path = "crates/xpile-meta-hir" }
xpile-oracle         = { version = "0.1.12", path = "crates/xpile-oracle" }
xpile-bigint         = { version = "0.1.12", path = "crates/xpile-bigint" }

# Code lane: frontends
depyler-frontend = { version = "0.1.12", path = "crates/depyler-frontend" }
decy-frontend    = { version = "0.1.12", path = "crates/decy-frontend" }
ruchy-frontend   = { version = "0.1.12", path = "crates/ruchy-frontend" }
bashrs-frontend  = { version = "0.1.12", path = "crates/bashrs-frontend" }
xpile-wasm-frontend = { version = "0.1.12", path = "crates/xpile-wasm-frontend" }

# Code lane: backends
xpile-rust-codegen  = { version = "0.1.12", path = "crates/xpile-rust-codegen" }
xpile-ruchy-codegen = { version = "0.1.12", path = "crates/xpile-ruchy-codegen" }
xpile-ptx-codegen   = { version = "0.1.12", path = "crates/xpile-ptx-codegen" }
xpile-wgsl-codegen  = { version = "0.1.12", path = "crates/xpile-wgsl-codegen" }
xpile-spirv-codegen = { version = "0.1.12", path = "crates/xpile-spirv-codegen" }
xpile-wasm-codegen  = { version = "0.1.12", path = "crates/xpile-wasm-codegen" }
xpile-forjar-codegen = { version = "0.1.12", path = "crates/xpile-forjar-codegen" }
xpile-lean-codegen  = { version = "0.1.12", path = "crates/xpile-lean-codegen" }
bashrs-backend      = { version = "0.1.12", path = "crates/bashrs-backend" }

# Proof lane
xpile-contract-frontend     = { version = "0.1.12", path = "crates/xpile-contract-frontend" }
xpile-contract-backend      = { version = "0.1.12", path = "crates/xpile-contract-backend" }
latex-contract-frontend     = { version = "0.1.12", path = "crates/latex-contract-frontend" }
xpile-lean-contract-backend = { version = "0.1.12", path = "crates/xpile-lean-contract-backend" }
xpile-latex-contract-backend = { version = "0.1.12", path = "crates/xpile-latex-contract-backend" }

# ── aprender-pattern aliases ──────────────────────────────────────
# Preserve the historic crate names from sibling repos so that
# `cargo install depyler` / `cargo install decy` / `cargo install ruchy`
# (paiml/depyler etc. as ~50-line shim repos) keep importing under the
# old names. Decision recorded 2026-05-15; see project-xpile-vision memory
# and aprender's Cargo.toml lines 254-273 for the originating pattern.
depyler = { version = "0.1.12", path = "crates/depyler-frontend", package = "depyler-frontend" }
decy    = { version = "0.1.12", path = "crates/decy-frontend",    package = "decy-frontend" }
ruchy   = { version = "0.1.12", path = "crates/ruchy-frontend",   package = "ruchy-frontend" }
bashrs  = { version = "0.1.12", path = "crates/bashrs-frontend",  package = "bashrs-frontend" }

[profile.release]
lto = "thin"
codegen-units = 1
