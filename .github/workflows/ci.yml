name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Required check: ci / gate ─────────────────────────────────
  # Runs the xpile pre-push checklist (CLAUDE.md):
  #   cargo fmt --check, cargo check --workspace,
  #   cargo clippy --workspace --all-targets -- -D warnings,
  #   pv lint contracts/, cargo deny check advisories
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install pv (aprender-contracts-cli)
        run: cargo install aprender-contracts-cli --locked

      - name: pv lint contracts/
        run: pv lint contracts/

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # NOTE (PMAT-1409): `advisories` is the only check kind this REQUIRED job
      # runs. `licenses`, `bans` and `sources` are configured in deny.toml and
      # run in the ADVISORY `license-scan` job below — deliberately not here,
      # because `licenses` exits 4 today and would wedge every merge. Which
      # kinds run where is machine-checked by
      # `crates/xpile/tests/dependency_license_policy.rs`: a check kind that is
      # configured but executed by NO job reds that gate.
      - name: cargo deny check advisories
        run: cargo deny check advisories

  # ── workspace-test (REQUIRED — see enforcement note) ─────────
  # Runs the full test suite, INCLUDING the WASM execution witnesses
  # (795 `#[test]`s across 138 `*_witness.rs` files as of 2026-07-26 —
  # a dated snapshot; the authoritative count is whatever
  # `cargo test -p xpile --test witness_floor -- --nocapture` prints,
  # and its floor is the anti-deletion ratchet). WABT is installed below
  # and `XPILE_REQUIRE_WASM_RUNTIME=1` makes a missing WABT a hard
  # failure instead of a silent skip (XPILE-WITNESS-001). Kept a
  # separate job so the failure mode is visible at a glance
  # (gate vs tests).
  #
  # ENFORCEMENT NOTE (PMAT-1347, CORRECTED 2026-07-30 by PMAT-1501 — measured
  # against the LIVE API on the day of writing, not carried forward).
  #
  # ⛔ TWO rulesets protect `main`, and NEITHER ALONE requires the blocking set.
  # The authoritative question is "what blocks a merge on `main`", and its
  # authoritative answer is the UNION endpoint
  #   gh api repos/paiml/xpile/rules/branches/main
  # which on 2026-07-30 returns, per ruleset:
  #   13878864 "Green Main — unified gate enforcement"      -> gate
  #   19814559 "workspace-test — repos that emit it (…)"    -> workspace-test
  # So the merge-blocking set is {gate, workspace-test} as the UNION over both.
  # Every OTHER job in this file is ADVISORY: it runs on every PR and goes red
  # on a real regression, but a red advisory job does NOT block a merge. Do not
  # describe them as merge-blocking.
  #
  # ⛔ NEVER CITE ONE RULESET ID AS THE SOURCE OF THAT SET. Until PMAT-1501 this
  # note read
  #     "The paiml org branch-protection ruleset 13878864 requires EXACTLY two
  #      contexts."
  # which was true when PMAT-1347 measured it and false from 2026-07-27, when
  # the org MOVED `workspace-test` out of 13878864 into the new 19814559 in an
  # 18-second refactor. Effective protection on `main` never changed. But a
  # reader who ran that citation got a one-context answer and re-derived
  # "`workspace-test` was dropped" — which is not hypothetical: it cost two
  # days, six documents edited to agree with a weakening that never happened,
  # an owner decision that did not exist, and a falsehood published to
  # crates.io in the packaged `contracts/README.md` (PMAT-1475, PMAT-1476).
  #
  # The two marker lines below are MACHINE-READ by
  # `crates/xpile/tests/ruleset_drift.rs` (XPILE-RULESET-DRIFT-001). It reads
  # the UNION endpoint above — deliberately not a ruleset id, see its
  # `BRANCH_RULES_ENDPOINT` — and cross-checks the markers against EVERY
  # committed receipt DISCOVERED by glob from `docs/status/ruleset-*.json`
  # (two today: 13878864 and 19814559), refusing to run on fewer than one.
  # A third ruleset is covered the day its receipt lands, with no call site to
  # update. Editing a marker without the receipts REDS the gate. Keep both
  # lists sorted.
  #
  # XPILE-ENFORCEMENT REQUIRED-CONTEXTS: gate, workspace-test
  # XPILE-ENFORCEMENT ADVISORY-CONTEXTS: docs, kani, lake-build, lean-models, license-scan, shader-validate, wasi
  #
  # ⚠️ THIS PROSE IS NOT GATED, AND THAT IS WHY IT ROTTED (PMAT-1501, measured).
  # `enforcement_prose_witness.rs` (XPILE-ENFORCE-PROSE-001) exists for exactly
  # the defect above and could not see it, for TWO independent reasons:
  #   1. CORPUS — it is quantified over `git ls-files "*.md"`. No gate in this
  #      repo discovers a `*.yml` PROSE corpus, so all ~180 comment lines in
  #      `.github/workflows/` are unswept, including this block, which HOSTS the
  #      markers that gate machine-reads eleven lines above.
  #   2. SPELLING — and this one bites INSIDE its corpus. Its screen matches a
  #      CONTEXT NAME in the citing paragraph; the retired sentence stated the
  #      set as a CARDINALITY ("EXACTLY two contexts"), which names nothing, so
  #      the paragraph is skipped. Executed as a tracked `.md` file: the
  #      verbatim sentence PASSES, and rewriting only the spelling to name the
  #      context reds instantly. A count-shaped attribution evades the gate in
  #      any Markdown file today.
  # Both holes are gate work, frozen out of the v0.1.618 window; specified as
  # XPILE-WORKFLOW-PROSE-001 in `docs/roadmaps/queue.yaml` `next_lane`. Until
  # it lands this correction is a MEASUREMENT, not an invariant.
  #
  # HISTORY, because the failure mode is the point: this note ALSO once read
  # "`workspace-test` is NOT yet GitHub-enforced" — the exact INVERSE of the
  # live state — while `docs/status/ruleset-13878864.json` simultaneously
  # claimed a four-context set `[gate, kani, lake-build, workspace-test]`.
  # Both were wrong in OPPOSITE directions and both survived three weeks
  # unnoticed. The 2026-07-05 four-context flip was reverted six hours after
  # it landed (snapshot `updated_at` 17:35 vs live 23:50, same day), so the
  # committed snapshot was stale while LOOKING authoritative. Restoring `kani`
  # + `lake-build` as required is an ORG-ADMIN action and is OWNER-GATED (the
  # repo-level rulesets endpoint 404s for an org-sourced ruleset); it is
  # recorded as the `ruleset-reflip` owner decision, not as a task.
  workspace-test:
    name: workspace-test
    runs-on: ubuntu-latest
    env:
      # Declare that this host MUST execute the WASM witnesses. Combined with
      # the WABT install step, this turns `wasm_runtime_available()` into a
      # tripwire: drop the install and the witnesses panic red, never skip green.
      XPILE_REQUIRE_WASM_RUNTIME: "1"
      # Same contract for the forjar witness (GH-2117): xpile-forjar-codegen
      # emits forjar.yaml TEXT with no runtime forjar dependency, so nothing
      # here proves forjar will accept it. Shape-checking the YAML cannot see
      # forjar's semantic rules (field co-occurrence, required sub-keys), and
      # those tighten over time. Declaring this makes a missing forjar fail RED
      # rather than skip green, so deleting the install step cannot silently
      # retire the check.
      XPILE_REQUIRE_FORJAR: "1"
    steps:
      # fetch-depth: 0 (full history AND tags) is load-bearing, not cosmetic:
      # `crates/xpile/tests/roadmap_registration.rs` (XPILE-LEDGER-001, PMAT-1345)
      # compares the PMAT ids cited in commit subjects since the last `v*` tag
      # against the ids registered in docs/roadmaps/roadmap.yaml. Under the
      # default depth-1 checkout there is no history and no tag, so that half of
      # the gate would skip-with-reason and the id drift it exists to catch
      # would go unnoticed in CI exactly as it did for PMAT-1268/1269/1277/
      # 1281/1283. The repo is ~27 MiB packed, so the full fetch is cheap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install forjar for the emitted-manifest witness (GH-2117)
        # Pinned deliberately. An unpinned install would make this job flap the
        # day forjar tightens a rule, instead of reporting the actual news:
        # "forjar <version> added a rule our emitter violates". Bump on purpose.
        run: cargo install forjar --locked --version 1.12.5

      - name: Install WABT (wat2wasm + wasm-interp) for the WASM execution witnesses
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wat2wasm --version
          wasm-interp --version

      - name: cargo test --workspace
        run: cargo test --workspace

  # ── Optional check: kani (Symbolic stratum / XPILE-QUORUM-003)
  # Runs `cargo kani` against every harness in contracts/kani/ via
  # the `crates/xpile/tests/kani_verify.rs` gate (which materialises
  # a temp crate per harness and parses the verifier output).
  #
  # Kept as a SEPARATE job (not bundled with workspace-test) because:
  #   - Kani install is heavy (CBMC + solvers, ~5 minutes on cold
  #     cache). Folding into workspace-test would slow the
  #     fast-feedback gate.
  #   - Kani failures should be diagnosable at a glance — surfacing
  #     them as a distinct job rather than buried in test output is
  #     the same posture as `gate` vs `workspace-test`.
  # NOT marked as a required status check at the GitHub branch-
  # protection layer (yet); flip required once Kani has bedded in.
  # XPILE-QUORUM-003 / PMAT-021.
  kani:
    name: kani
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from gate/workspace-test so the heavy
          # Kani toolchain doesn't bloat their caches.
          prefix-key: "kani-v0"

      - name: Install kani-verifier
        run: cargo install --locked kani-verifier

      # Kani ≥ 0.67 auto-bootstraps its toolchain (CBMC + solvers)
      # on the first `cargo kani` invocation rather than via a
      # separate `kani-setup` step. We do a no-op invocation here
      # to surface bootstrap errors before the verification step,
      # since the bootstrap is the slowest part (~5 min cold cache).
      - name: bootstrap kani toolchain
        run: cargo kani --version

      - name: cargo test -p xpile --test kani_verify
        # Anti-vacuity tripwire (XPILE-RULESET-002 / F9): arm kani_verify.rs to
        # PANIC (not skip) if `cargo kani` is missing here — so a broken install
        # reds this job instead of passing vacuously. Scoped to THIS job only;
        # the required `workspace-test` job runs the same test without kani by
        # design and must keep skipping (hence an env var, not CI=true).
        #
        # This comment used to read "now that `kani` is a REQUIRED status
        # context" (PMAT-1370 corrects it). `kani` is ADVISORY — see the
        # XPILE-ENFORCEMENT ADVISORY-CONTEXTS marker above and `ruleset_drift.rs`.
        # The claim dated from the six-hour 2026-07-05 four-context flip. The
        # tripwire is still worth having: it makes a red kani job MEAN something
        # even though a red kani job does not block a merge.
        env:
          XPILE_REQUIRE_KANI: "1"
        run: cargo test -p xpile --test kani_verify -- --nocapture

  # ── Optional check: lake-build (Proof lane / PMAT-903) ────────
  # Elaborates the machine-checked PILOT set in `contracts/lean/`
  # via `lake build` against the pinned `lean-toolchain` (v4.15.0).
  #
  # Kept as a SEPARATE ADVISORY job (mirroring `kani`), deliberately
  # NOT folded into the blocking `gate`/publish path, so Lean weight
  # can never stall the fast gate or the crates.io window
  # (sprint cadence rule).
  #
  # Hermetic + fast: PMAT-903 verified NOT ONE contracts/lean module
  # imports Mathlib (the "Mathlib" mentions are docstring lemma
  # names), so there is no Mathlib cache to fetch. The lakefile sets
  # `warningAsError := true`, so a real `sorry` (→ `sorryAx`) cannot
  # survive a green build — this job is the check that makes
  # "provable" un-falsifiable by `grep sorry` for the pilot contracts.
  # NOT a required status check at the branch-protection layer (yet).
  lake-build:
    name: lake-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan is the Lean toolchain manager (the rustup of Lean). With
      # `--default-toolchain none` it installs nothing up front; the
      # first `lake` invocation reads contracts/lean/lean-toolchain and
      # pulls exactly the pinned v4.15.0.
      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # Verify in-step by absolute path (PMAT-1370): an installer that prints
          # an error and exits 0 must red HERE naming elan, not one step later as
          # a bare `lake: command not found`. $GITHUB_PATH applies to later steps.
          "$HOME/.elan/bin/elan" --version

      - name: lake build (advisory proof lane)
        working-directory: contracts/lean
        run: lake build

  # ── Optional check: docs (README/documentation quality) ───────
  # Grades and enforces the documentation with `pmat`:
  #   - validate-docs --fail-on-error : every relative + external
  #     link in the docs tree must resolve (490 links at time of
  #     writing, 0 broken).
  #   - demo-score : the presentation grade (quick-start, examples,
  #     error-gracefulness, badges). Enforced against a floor so a
  #     regression — stripping examples/ or reverting the README to
  #     a stream-of-consciousness dump — fails the job.
  #
  # Kept as a SEPARATE ADVISORY job (mirroring kani/lake-build), NOT
  # a required status check: validate-docs makes live HTTP requests
  # to verify external links, so a transient network hiccup must
  # never block an unrelated merge. Flip required once it has bedded
  # in and external-link checking is proven stable.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      # Pinned prebuilt musl binary: no `cargo install` (pmat needs rustc
      # ≥1.95 while this repo's toolchain is 1.93), no compile time, and a
      # fixed version so the demo-score floor can't drift under a pmat update.
      PMAT_VERSION: v3.21.0
    steps:
      - uses: actions/checkout@v4

      - name: Install pmat (pinned prebuilt binary)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.pmat"
          curl -fsSL "https://github.com/paiml/paiml-mcp-agent-toolkit/releases/download/${PMAT_VERSION}/pmat-${PMAT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.pmat"
          echo "$HOME/.pmat/pmat-${PMAT_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          # Verify in-step by absolute path (PMAT-1370).
          "$HOME/.pmat/pmat-${PMAT_VERSION}-x86_64-unknown-linux-musl/pmat" --version

      - name: pmat validate-docs (link integrity)
        run: pmat validate-docs -r . --fail-on-error

      - name: pmat demo-score (README presentation grade >= 6.0)
        run: |
          score=$(pmat demo-score --path . --format json | jq -r '.score')
          echo "demo-score: ${score} / 10.0 (floor 6.0)"
          awk -v s="${score}" 'BEGIN { exit !(s + 0 >= 6.0) }' || {
            echo "::error::README demo-score ${score} is below the 6.0 floor"
            exit 1
          }

  # ── Optional check: wasi (universal-binary path) ──────────────
  # Proves the "works everywhere" claim end to end: xpile emits a proven model
  # as a buildable crate (`transpile --emit-crate`), that crate builds to a
  # single `wasm32-wasip1` binary, runs under wasmtime, and matches the CPython
  # reference byte-for-byte. Advisory tier (installs a wasm target + a WASI
  # runtime, both network-fetched) — not a required status check, mirroring
  # kani/lake-build/docs.
  wasi:
    name: wasi
    runs-on: ubuntu-latest
    env:
      # Pinned prebuilt release asset, mirroring the `docs` job's PMAT_VERSION
      # pattern. PMAT-1370: this job used to run
      # `curl -fsSL https://wasmtime.dev/install.sh | bash`, whose
      # `get_latest_release()` resolves the version by scraping
      # `api.github.com/repos/bytecodealliance/wasmtime/releases/latest` with an
      # UNAUTHENTICATED request. Actions runners share egress IPs, so that call
      # is rate-limited in bursts; the error body has no `tag_name`, the
      # installer's `sed` pipeline degrades it to the literal `{`, it prints
      # `Could not download Wasmtime version '{'` — and EXITS 0. The install step
      # went green with no wasmtime installed, and the job failed one step later
      # with `wasmtime: command not found` (exit 127), naming neither the real
      # cause nor the installer. Observed live on `ccb95a04` (the v0.1.617
      # release SHA) while the same job was green on `ef53c281` an hour earlier —
      # i.e. FLAKY, not broken, which is worse. Release-asset downloads are not
      # API-rate-limited, so fetching the pinned tarball directly removes the
      # dependency entirely.
      WASMTIME_VERSION: v47.0.2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "wasi-v0"

      - name: Install wasmtime (pinned prebuilt binary)
        run: |
          set -euo pipefail
          DIR="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          mkdir -p "$HOME/.wasmtime"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${DIR}.tar.xz" \
            | tar xJ -C "$HOME/.wasmtime"
          echo "$HOME/.wasmtime/${DIR}" >> "$GITHUB_PATH"
          # Verify IN THIS STEP, by absolute path: a failed install must red HERE,
          # naming wasmtime, not one step later as a bare `command not found`.
          # $GITHUB_PATH only takes effect in SUBSEQUENT steps, hence the path.
          "$HOME/.wasmtime/${DIR}/wasmtime" --version

      - name: emit crate -> wasm32-wasip1 -> wasmtime, diff vs CPython
        run: |
          set -euo pipefail
          MODEL=examples/proven-model/model.py
          CRATE="$(mktemp -d)/model-crate"
          # 1. xpile emits a complete, buildable crate
          cargo run --quiet -p xpile -- transpile "$MODEL" --emit-crate "$CRATE"
          # 2. build the single portable .wasm (explicit --target-dir so the
          #    output path is deterministic regardless of ambient cargo config)
          ( cd "$CRATE" && cargo build --release --target wasm32-wasip1 --target-dir "$CRATE/target" )
          WASM="$CRATE/target/wasm32-wasip1/release/model.wasm"
          # 3. run under wasmtime and diff against the CPython reference
          wasm_out="$(wasmtime run "$WASM")"
          py_out="$(python3 -c "exec(open('$MODEL').read()); main()")"
          echo "wasm:"; echo "$wasm_out"
          echo "cpython:"; echo "$py_out"
          if [ "$wasm_out" != "$py_out" ]; then
            echo "::error::the universal .wasm diverged from CPython"
            exit 1
          fi
          echo "OK — the universal .wasm matches CPython byte-for-byte"

  # ── Optional check: lean-models (Mathlib model-proof lane / PMAT-956) ──
  # The deliberate, walled-off Mathlib lane: elaborates the OLS-uniqueness
  # certificate in `contracts/lean-models/` against Mathlib (fetched as prebuilt
  # oleans via `lake exe cache get`). `warningAsError := true` makes a green
  # build an un-fakeable "no `sorry`" claim.
  #
  # SEPARATE from the hermetic core `lake-build` job on purpose: the multi-GB
  # Mathlib cache must never touch the fast core lane. Advisory / non-required
  # tier (mirrors kani/lake-build/docs/wasi) — a Mathlib CDN hiccup can't block
  # an unrelated merge.
  lean-models:
    name: lean-models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # Verify in-step by absolute path (PMAT-1370): an installer that prints
          # an error and exits 0 must red HERE naming elan, not one step later as
          # a bare `lake: command not found`. $GITHUB_PATH applies to later steps.
          "$HOME/.elan/bin/elan" --version

      # Fetch Mathlib's prebuilt oleans (resolves the pinned deps from
      # lake-manifest.json first) so the lane builds in minutes, not the hours a
      # from-source Mathlib compile would take.
      - name: lake exe cache get (Mathlib oleans)
        working-directory: contracts/lean-models
        run: lake exe cache get

      - name: lake build (advisory model-proof lane)
        working-directory: contracts/lean-models
        run: lake build

  # ── Optional check: shader-validate (offline WGSL+SPIR-V corpus / PMAT-482) ──
  # Converts the GPU-lane SKIP into a VALIDATED gate on free CI. `naga` is the
  # SINGLE shared oracle for the WGSL lane (front-end parse+validate) AND the
  # SPIR-V lane (WGSL->naga->spv), so a naga regression can silently break
  # SPIR-V. This job emits the full supported-shape WGSL corpus and runs it
  # through the CPU-only naga front-end, then compiles the compute-shaped
  # shaders through the naga WGSL->SPIR-V backend and checks the words with
  # the in-crate `validate_spirv` header gate — NO GPU adapter, NO wgpu
  # device, NO external spirv-val binary. There is NO skip path (unlike the
  # gpu_witness / gpu_real_kernel tests), so every naga bump re-validates the
  # whole corpus for BOTH lanes in one named place.
  #
  # Kept a SEPARATE ADVISORY job (mirroring kani/lake-build/docs/wasi/
  # lean-models) so the shader lane is diagnosable at a glance rather than
  # buried in the workspace-test output. NOT a required status check at the
  # branch-protection layer (yet).
  shader-validate:
    name: shader-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key so the wgpu/naga build tree doesn't bloat the
          # gate/workspace-test caches.
          prefix-key: "shader-validate-v0"

      - name: offline WGSL naga-validate + WGSL->SPIR-V corpus (no GPU)
        run: cargo test -p xpile-spirv-codegen --test offline_validate -- --nocapture

  # ── license-scan (ADVISORY — PMAT-1409) ──────────────────────
  # deny.toml has configured `[licenses]`, `[bans]` and `[graph]` since the
  # file was written. Until this job existed NONE of them had ever executed:
  # ci.yml ran exactly `cargo deny check advisories`, so `cargo deny check
  # licenses` had never once run in this repo's history. Its first run exits 4.
  #
  # MEASURED (2026-07-27, at c0ff1263): NINE rejections — 5x LGPL-3.0-only
  # (the malachite family, reached as NORMAL deps via rustpython-parser ->
  # depyler-frontend -> xpile-core -> xpile, i.e. statically linked into the
  # shipped `xpile` binary), 2x Zlib (foldhash 0.1.5/0.2.0 via hashbrown ->
  # wgpu), 1x CC0-1.0 linked (hexf-parse via naga -> wgpu) and 1x CC0-1.0
  # build-only (tiny-keccak, a rustpython-parser build script). Every one is
  # enumerated with its linkage in `NOTICE.md`.
  #
  # WHY THE RAW CHECK IS `continue-on-error` AND THE TRIPWIRE IS NOT:
  # what to DO about the LGPL is an OWNER DECISION (`lgpl-in-shipped-binary`
  # in docs/roadmaps/queue.yaml), not a decision this job may make. A job whose
  # verdict is "still 9 rejections" would be red on every commit forever, and
  # this repo has already recorded what that buys: `wasi` was RED on ccb95a04,
  # the exact SHA tagged v0.1.617, and the release was cut anyway (PMAT-1370).
  # A permanently-red advisory job is exactly as invisible as no job at all.
  # So the raw check RUNS and its full output is in the log every time, while
  # the job's PASS/FAIL verdict is the DRIFT tripwire below: the set of
  # rejected (crate, version, license) triples must equal the set NOTICE.md
  # enumerates, and each row's `linkage:` claim is re-derived from `cargo
  # tree`. A tenth rejection, or a documented one vanishing, reds this job.
  license-scan:
    name: license-scan
    runs-on: ubuntu-latest
    env:
      # Turns the "cargo-deny is not installed" skip in
      # dependency_license_policy.rs into a hard failure. Without this the
      # tripwire would skip-green on a runner where the install step was
      # deleted — the skip-as-green shape XPILE-WITNESS-002 exists to kill.
      # Scoped to THIS job: workspace-test has no cargo-deny and must keep
      # skipping the live half by design.
      XPILE_REQUIRE_DENY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "license-scan-v0"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: drift tripwire — NOTICE.md equals the live rejection set
        run: cargo test -p xpile --test dependency_license_policy -- --nocapture

      - name: report — cargo deny check licenses bans sources (advisory)
        # Exits 4 today BY DESIGN; see the block comment above. The output is
        # the point, not the exit code.
        continue-on-error: true
        run: cargo deny check licenses bans sources
