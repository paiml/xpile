name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Required check: ci / gate ─────────────────────────────────
  # Runs the xpile pre-push checklist (CLAUDE.md):
  #   cargo fmt --check, cargo check --workspace,
  #   cargo clippy --workspace --all-targets -- -D warnings,
  #   pv lint contracts/, cargo deny check advisories
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xpile
        uses: actions/checkout@v4
        with:
          path: xpile

      # xpile's workspace Cargo.toml has a path-dep on
      # ../aprender/crates/aprender-contracts (per the comment in
      # Cargo.toml). Check out aprender as a sibling so the path
      # resolves on the runner.
      - name: Checkout aprender (workspace path-dep)
        uses: actions/checkout@v4
        with:
          repository: paiml/aprender
          path: aprender

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xpile

      - name: cargo fmt --check
        working-directory: xpile
        run: cargo fmt --all -- --check

      - name: cargo check --workspace
        working-directory: xpile
        run: cargo check --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: xpile
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install pv (aprender-contracts-cli)
        run: cargo install aprender-contracts-cli --locked

      - name: pv lint contracts/
        working-directory: xpile
        run: pv lint contracts/

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check advisories
        working-directory: xpile
        run: cargo deny check advisories

  # ── Required check: workspace-test ────────────────────────────
  # Runs the test suite. Kept as a separate job so the failure
  # mode is visible at a glance (gate vs tests).
  workspace-test:
    name: workspace-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xpile
        uses: actions/checkout@v4
        with:
          path: xpile

      - name: Checkout aprender (workspace path-dep)
        uses: actions/checkout@v4
        with:
          repository: paiml/aprender
          path: aprender

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xpile

      - name: cargo test --workspace
        working-directory: xpile
        run: cargo test --workspace
