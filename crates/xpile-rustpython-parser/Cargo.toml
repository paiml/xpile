[package]
name = "xpile-rustpython-parser"
version = "0.4.0"
edition = "2021"
rust-version = "1.72.1"
authors = ["RustPython Team", "PAIML"]
build = "build.rs"
description = "Fork of rustpython-parser 0.4.0 on unicode-ident (drops the unmaintained unic-* crates); lib name stays rustpython_parser"
readme = "README.md"
license = "MIT"
repository = "https://github.com/RustPython/Parser"
publish = false

[lib]
name = "rustpython_parser"
path = "src/lib.rs"

[dependencies]
is-macro = "0.3.0"
itertools = "0.11.0"
lalrpop-util = { version = "0.20.0", default-features = false }
log = "0.4.16"
num-bigint = { version = "0.4.3", optional = true }
num-traits = "0.2"
phf = "0.11.1"
rustc-hash = "1.1.0"
rustpython-ast = { version = "0.4.0", default-features = false }
rustpython-parser-core = { version = "0.4.0", features = [] }
unicode-ident = "1"
unicode_names2 = "1.1.0"

[build-dependencies]
phf_codegen = "0.11.1"

[features]
default = ["location", "num-bigint"]
location = ["rustpython-ast/location", "rustpython-parser-core/location"]
num-bigint = ["dep:num-bigint", "rustpython-ast/num-bigint"]
full-lexer = []

[lints.rust]
mismatched_lifetime_syntaxes = "allow"
