[package]
name = "xpile-wasm-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly text (WAT) frontend for xpile — lifts the WAT scalar/control subset (the image of xpile-wasm-codegen) back to meta-HIR via stack→expression-tree reconstruction. The LIFT half of first-class bidirectional native WASM (PMAT-954); lossy decompilation, pinned by a round-trip fixed-point witness."

[dependencies]
xpile-frontend = { workspace = true }
xpile-meta-hir = { workspace = true }

[dev-dependencies]
# The emit half — the round-trip fixed-point witness checks that
# `emit(lift(emit(M))) == emit(M)` (the lift is a right-inverse of emit on
# the part of its WAT image the lift accepts). PMAT-1423 re-measured that
# hole over a corpus reaching every scalar construct the emit accepts;
# PMAT-1422's "exactly `not` and float `/`" was measured over 7 fixtures
# with no float builtin, no unary float `-` and no `F32` in them, and the
# real hole is 8 mnemonics plus the un-armed `$__wasm_*` prelude helpers.
# Dev-only: the frontend itself has no codegen dep.
xpile-wasm-codegen = { workspace = true }
xpile-backend = { workspace = true }
# PMAT-1423, dev-only: the lift used to reconstruct a `call $__wasm_sqrt_f64`
# as an `Expr::Call` to a function pass 2 had just DROPPED. `--target wasm`
# refused that dangling call, which is why it read as caught — so the witness
# pins the half that did NOT catch it, emitting the same module as Rust and
# showing the callee is referenced but never defined, at exit 0.
xpile-rust-codegen = { workspace = true }
