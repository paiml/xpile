[package]
name = "xpile-wgsl-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WGSL backend — lowers Rust meta-HIR to WebGPU Shading Language; runs emitted WGSL on a real wgpu adapter for the §29 DiffExec witness. Phase 6."

[dependencies]
xpile-backend = { workspace = true }
xpile-contracts = { workspace = true }
xpile-meta-hir = { workspace = true }
# GPU execution lane (PMAT-950): the executed half of the WGSL §29
# DiffExec quorum. wgpu RUNS emitted WGSL on a real Vulkan/Metal/DX12
# adapter; pollster blocks on its async API from the sync DiffExecEngine
# trait; bytemuck casts the f32 fixture/result buffers.
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
# PMAT-970: CPU-only WGSL front-end parse + validate for the meta-HIR →
# WGSL lowering gate. `naga::front::wgsl::parse_str` + `naga::valid::Validator`
# prove the emitted WGSL well-formed WITHOUT a GPU — the same naga pin the
# sibling xpile-spirv-codegen crate already uses (`wgsl-in`).
naga = { workspace = true }
