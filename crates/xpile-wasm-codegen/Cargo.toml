[package]
name = "xpile-wasm-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native WebAssembly backend — lowers meta-HIR (scalar/control subset) directly to WAT text, NOT via the Ruchy WasmEmitter hop. The EMIT half of first-class bidirectional native WASM (PMAT-951). String-emitter shape, no runtime dependency."

[dependencies]
xpile-backend = { workspace = true }
xpile-contracts = { workspace = true }
xpile-meta-hir = { workspace = true }

# Dev-only: the Python frontend, so the E2E witnesses can drive the FULL
# pipeline (Python source → meta-HIR → WASM) and guard against a
# frontend-vs-codegen shape drift (the PMAT-1244 failure mode). No cycle:
# neither frontend crate depends on this backend.
[dev-dependencies]
depyler-frontend = { workspace = true }
xpile-frontend = { workspace = true }
# PMAT-1395: the C frontend, so `c_scalar_abi_witness.rs` can drive the C→WASM
# lane. `Type::CUInt` / `Type::F32` / `Type::CLong` are produced ONLY by decy —
# no Python annotation reaches them — so a Python-only witness corpus left the
# whole C scalar-ABI return path untested, which is how a `--target wasm` exit-0
# emitting WAT that `wat2wasm` rejects survived. No cycle: decy-frontend depends
# on xpile-frontend + xpile-meta-hir, never on this backend.
decy-frontend = { workspace = true }
