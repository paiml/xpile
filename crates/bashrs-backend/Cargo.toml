description = "POSIX shell backend (sh/bash/zsh) for xpile (XPILE-BASHRS-MERGER-001). Renders real POSIX shell for the supported meta-HIR Stmt set — commands, pipelines and assignment with quoting, variables and command substitution, plus the control-flow statements the shell lane models — under `C-BASHRS-POSIX-IDEMPOTENCE`. A ShellCheck-compatible verifier remains v0.2.0 work."

