[package]
name = "xpile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/paiml/xpile"
documentation = "https://docs.rs/xpile"
readme = "README.md"
description = "Polyglot transpile workbench (Python/C/C++/Rust/Ruchy/Lean ↔ Rust/Ruchy/PTX/WGSL/SPIR-V) with provable contracts at every layer."
keywords = ["transpile", "polyglot", "compiler", "verification", "rust"]
categories = ["development-tools", "command-line-utilities", "compilers"]

[[bin]]
name = "xpile"
path = "src/main.rs"

[dependencies]
xpile-core     = { workspace = true }
xpile-backend  = { workspace = true }
xpile-meta-hir = { workspace = true }
# PMAT-897 (Sprint-2 Tier 2): the `xpile hybrid <dir>` command reconciles the
# dispatched modules' FFI boundaries into a manifest (Phase 1 + Phase 2).
xpile-ffi-manifest = { workspace = true }
# PMAT-902 (Sprint Day 3): `xpile hybrid --verify` differential-checks the
# executed hybrid artifact against the CPython reference (ctypes-bound C).
xpile-oracle       = { workspace = true }
# PMAT-1024: `transpile` resolves the target BEFORE lowering and passes the
# target's AliasSemantics to the frontend (reference-semantics targets skip
# the value-semantics alias dispositions).
xpile-frontend     = { workspace = true }
anyhow         = { workspace = true }
clap           = { version = "4", features = ["derive"] }

[dev-dependencies]
# PMAT-484: contract_via_roles.rs parses the PTX contract YAML to
# validate the structured compile_targets.via_roles records.
serde_yaml              = { workspace = true }
# PMAT-1350: wasm_contract_surface.rs deserializes the WASM contract's
# `emit_surface` block into typed rows (serde_yaml already depends on serde,
# so this adds no crate to the dependency graph — only the derive).
serde                   = { workspace = true }
# PMAT-475 (R6): diamond_coverage.rs parses the per-contract Diamond
# depth report to grandfather the depth-13 gate (new contracts join at
# depth-1+ without the depth-13 treadmill).
serde_json              = { workspace = true }
# PMAT-270: trait_runtime_properties.rs exercises ContractBackend +
# ContractFrontend traits directly against the live default_session().
xpile-contract-backend  = { workspace = true }
xpile-contract-frontend = { workspace = true }
xpile-contracts         = { workspace = true }
# PMAT-890 (Sprint-2 Tier 1): oracle_differential.rs uses the PythonOracle to
# auto-diff CPython vs transpiled-Rust stdout over self-contained oracle fixtures.
# (xpile-oracle is a regular dependency above — used by main.rs `--verify` too.)
# PMAT-896 (Sprint-2 Tier 2): hybrid_reconcile.rs drives the Python + C frontends
# through FfiManifest::reconcile end-to-end (Phase 1 boundary detection → Phase 2).
# (xpile-ffi-manifest is a regular dependency above — used by main.rs too.)
xpile-frontend          = { workspace = true }
depyler-frontend        = { workspace = true }
decy-frontend           = { workspace = true }
# PMAT-932: hybrid_shell_producer.rs drives the Python + Shell frontends through
# FfiManifest::reconcile to prove the Python→Shell boundary (the `emit_shell_shim`
# producer) reconciles by the shell program name end-to-end.
bashrs-frontend         = { workspace = true }
# PMAT-274: notation_runtime.rs parses notation_demo.tex through the
# real LatexContractFrontend (the test asserts the C-NOTATION three-
# form equivalence claim against on-disk evidence).
latex-contract-frontend = { workspace = true }
