  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Inline fixture demonstrating a minimal contract-YAML shape
    for ContractBackend determinism testing.
  references:
    - docs/specifications/sub/contract-backend-trait.md
  depends_on: []

equations:
  identity:
    formula: |
      input == input
    domain: "any input value"
    invariants:
