metadata:
  id: C-XLATE-LEAN-TO-RUST
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Translation contract: how ALL Lean 4 constructs (`def`, `partial def`,
    `theorem`, `lemma`, `inductive`, `structure`, `instance`, `axiom`,
    `noncomputable def`) lower to Rust through xpile-lean-codegen (Backend).

    Layer 2 of the xpile contract taxonomy (translation), code-lane.
    Bidirectional partner is C-XLATE-RUST-FN-TO-LEAN-THM, which covers
    the proof-lane direction (Rust + contract → Lean theorem).

    Foundational design decision (2026-05-15 #3): ALL Lean functions are
    in scope from the beginning, not just total `def`. `partial def` and
    `noncomputable def` translate with explicit annotations; `theorem`
    survives as a Lean sidecar (not converted to Rust); `axiom` becomes
    `extern` with a banner comment.
  xpile:
    layer: translation
    lane: code
  references:
    - "Lean 4 documentation §3 (declarations) and §6 (inductive types)"
    - "Lean 4 Reference Manual, partial def section"
    - "Mathlib4 instance / typeclass conventions"
    - contracts/xpile-backend-trait-v1.yaml
    - contracts/xpile-frontend-trait-v1.yaml
    - docs/specifications/sub/backend-trait.md
  depends_on:
    - C-XPILE-FRONTEND-TRAIT
    - C-XPILE-BACKEND-TRAIT

equations:
  def_to_rust_fn:
    # PMAT-070: Lean refinement theorem locks in the body-
    # preservation modelling commitment for def_to_rust_fn. See
    # contracts/lean/XlateLeanToRust.lean for the proof.
    lean_theorem: "XpileContracts.CXlateLeanToRust.def_to_rust_fn"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-071: Kani harness completes the §14.4 quorum. Symbolic
    # counterpart to the Lean theorem — proves body preservation
    # at the byte level over all 4-byte symbolic inputs.
    kani_harness: "def_to_rust_fn"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(def f (args : T1) ... : R := body) ==
        fn f(args: T1_rust, ...) -> R_rust { body_rust }
    domain: |
      A total Lean `def` whose body uses only constructs with a Rust
      counterpart (arithmetic, pattern matching, recursion on a
      structurally-decreasing argument, calls to other lowered defs).
    invariants:
      - "Lean def name preserved in Rust (no mangling for simple identifiers)"
      - "termination proof in Lean ⟹ Rust function is provably total (lowered as #[must_terminate])"
      - "type parameters preserve order and bounds (Decidable, etc. become Rust trait bounds)"
    preconditions:
      - "def is total (Lean accepted it without `partial`)"
      - "all referenced types have Rust counterparts"
    postconditions:
      - "Rust function name equals the source Lean def name byte-for-byte"
      - "Rust parameter list preserves source parameter order"
      - "the lowered Rust body is panic-free for all inputs in the declared `domain` (load-bearing for the Bronze-tier body-preservation theorem PMAT-070)"

  name_preserved_silver:
    # PMAT-165: Silver-tier refinement theorem locks in name
    # preservation as a separate structural field of the typed
    # LeanDefSilver / RustFnSilver model. This is the second
    # multi-equation contract Silver upgrade (after PMAT-164's
    # iteration_order_preserved_polymorphic on
    # C-XLATE-PY-LIST-TO-VEC). Bronze (def_to_rust_fn above)
    # smushed name/args/return_type/body into a single
    # byte-array payload; Silver splits them and proves each
    # preservation claim separately.
    lean_theorem: "XpileContracts.CXlateLeanToRust.name_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-278: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat for this equation. Bronze
    # def_to_rust_fn was a single 4-byte payload (would pass if the
    # emitter swapped name and body); Silver decomposes into 4
    # fields (name/args/return_type/body). Companion harnesses
    # body_preserved_silver, args_preserved_silver,
    # return_type_preserved_silver in the same Kani file. Fourth
    # Path α contract closed.
    kani_harness: "name_preserved_silver"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(def f (args : T1) ... : R := body).name == f
    domain: |
      Same as `def_to_rust_fn` — a total Lean `def` with a Rust-
      compatible body. The Silver upgrade narrows the modelling
      from "body bytes preserved" to "name AND body AND args AND
      return type each preserved as a separate structural field".
    invariants:
      - "Lean def name preserved byte-for-byte as a separate field of the Rust fn (no mangling, no snake_case normalisation, no prefix stripping)"
      - "args, return_type, and body are preserved as separate structural fields (companion theorems body_preserved_silver, args_preserved_silver, return_type_preserved_silver in the same Lean file)"
    preconditions:
      - "def is total (Lean accepted it without `partial`)"
      - "the Silver model assumes the source name fits in an opaque byte payload (Gold tier replaces this with Lean.Name with universe levels)"
    postconditions:
      - "the Rust function's name field equals the Lean def's name field byte-for-byte"
      - "no other field is silently merged into the name (e.g., name + qualifier prefix is rejected at Silver tier)"

  partial_def_to_rust_fn:
    # PMAT-133: Bronze-tier refinement theorem locks in body +
    # partial-marker preservation. See contracts/lean/XlateLeanToRust.lean.
    lean_theorem: "XpileContracts.CXlateLeanToRust.partial_def_to_rust_fn"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem at byte level.
    kani_harness: "partial_def_to_rust_fn"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(partial def f (args) : R := body) ==
        #[partial_translation]
        fn f(args) -> Result<R_rust, NonTermination> { body_rust }
    domain: |
      A Lean `partial def` — explicitly non-terminating or non-decidable
      recursion. Lean does not prove termination; xpile cannot pretend
      it does in Rust.
    invariants:
      - "the lowered Rust function returns Result<_, NonTermination> by default"
      - "an iteration budget is wired through (configurable via #[partial_budget = N])"
      - "the `#[partial_translation]` attribute is mandatory and not stripped at any optimizer level"
    preconditions:
      - "user has acknowledged the partiality (a Layer-4 contract review)"
    postconditions:
      - "the emitted Rust function returns `Result<R_rust, NonTermination>` (never plain `R_rust`)"
      - "the `#[partial_translation]` attribute appears on the lowered function"
      - "any call site of the partial function in lowered Rust uses `?` or explicit `Err` handling (never `.unwrap()` without a justification comment)"

  partial_marker_preserved_silver:
    # PMAT-177 / XPILE-REFINE-XLATE-LEAN-002: Silver-tier
    # promotion of partial_def_to_rust_fn. Replicates PMAT-165
    # typed-AST pattern with a 5th field — partial_marker —
    # that the Bronze single-payload model couldn't separate.
    # Three companion theorems (partial_name, partial_return_type,
    # the marker itself) preserve provenance of the partial-
    # translation flag across lowering.
    lean_theorem: "XpileContracts.CXlateLeanToRust.partial_marker_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_partial_def_to_fn(d).partial_marker == d.partial_marker
    domain: |
      Same as partial_def_to_rust_fn — a Lean `partial def`.
    invariants:
      - "the partial_marker byte is preserved as a separate structural field of the Rust fn — not folded into the body, args, or return type"
      - "companion theorems partial_name_preserved_silver and partial_return_type_preserved_silver in the same Lean file lock in name + return type preservation in the typed model"
    preconditions:
      - "user has acknowledged the partiality (a Layer-4 contract review)"
      - "the Silver model assumes the partial-marker fits in a UInt8 (Gold tier promotes to the full attribute payload with budget hint + termination-proof ref)"
    postconditions:
      - "an emitter that lowers the marker as a Rust attribute payload instead of preserving it byte-for-byte would falsify the rfl claim — Gold tier introduces an equivalence relation that admits the attribute-payload representation"

  theorem_carried_as_lean_sidecar:
    # PMAT-133: Bronze-tier refinement theorem locks in
    # byte-identity copy of theorem text into the sidecar.
    lean_theorem: "XpileContracts.CXlateLeanToRust.theorem_carried_as_lean_sidecar"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem at byte level.
    kani_harness: "theorem_carried_as_lean_sidecar"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(theorem t : P := proof) ==
        // Rust file: empty (no lowering)
        // Sidecar: t.lean preserved verbatim, citation comment added
    domain: |
      Any Lean `theorem` or `lemma` declaration. Theorems are not
      executable — they have no runtime semantics. They lower to a Lean
      sidecar artifact, NOT to a Rust function.
    invariants:
      - "no Rust output is emitted for theorem declarations"
      - "the Lean sidecar carries a `-- cited by xpile contract C-X` comment"
      - "if the theorem's name is referenced by an executable def, the Rust output emits a doc-comment referencing the Lean theorem's fully-qualified path"
    preconditions:
      - "the source declaration is `theorem` or `lemma` (not `def` or `partial def`)"
      - "the theorem's proof body is well-formed Lean 4 (not just a `sorry`)"
    postconditions:
      - "the Rust output contains no function corresponding to the theorem"
      - "the Lean sidecar artifact carries the theorem text verbatim plus a `-- cited by xpile contract` comment"
      - "any Rust def referencing the theorem name carries a doc-comment pointing to the sidecar's fully-qualified path"

  citation_comment_preserved_silver:
    # PMAT-178: Silver-tier promotion of
    # theorem_carried_as_lean_sidecar. Bronze proved byte-
    # identity of theorem text; Silver adds a separate
    # has_citation_comment boolean that locks in the
    # "-- cited by xpile contract" comment as a structural
    # invariant. Companion theorem sidecar_text_preserved_silver
    # captures byte-identity of text in the Silver model.
    lean_theorem: "XpileContracts.CXlateLeanToRust.citation_comment_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_theorem_to_sidecar(t).has_citation_comment == t.has_citation_comment
    domain: |
      Same as theorem_carried_as_lean_sidecar — any Lean
      `theorem` or `lemma` declaration.
    invariants:
      - "has_citation_comment is preserved as a separate structural field"
      - "an emitter that drops the citation comment to tidy up the sidecar would falsify this — captures the 'comment must be added to sidecar' invariant Bronze couldn't model separately"
    preconditions:
      - "the source declaration is `theorem` or `lemma`"
    postconditions:
      - "the citation comment marker survives sidecar emission regardless of theorem shape"

  inductive_to_rust_enum:
    # PMAT-133: Bronze-tier refinement theorem locks in
    # variant-count preservation.
    lean_theorem: "XpileContracts.CXlateLeanToRust.inductive_to_rust_enum"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "inductive_to_rust_enum"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(inductive T : Type | C1 (x : A) | C2 (x : B) (y : C)) ==
        enum T { C1(A_rust), C2(B_rust, C_rust) }
    domain: |
      A Lean inductive type with constructors taking explicit arguments.
      Constructor names map directly; argument names are dropped (Lean
      keeps them; Rust enums are positional).
    invariants:
      - "constructor ordering preserved"
      - "constructor arity preserved"
      - "indexed inductives (those with type indices) lower to generic enums with PhantomData where needed"
    preconditions:
      - "no constructor has an implicit/instance argument that requires elaboration"
    postconditions:
      - "the emitted Rust `enum` has exactly the same number of variants as the source inductive"
      - "variant ordering matches source-declaration order"
      - "every variant's positional fields preserve source argument order (Lean argument names are dropped)"

  variant_names_preserved_silver:
    # PMAT-177: Silver-tier promotion of inductive_to_rust_enum.
    # Bronze recorded just variant_count; Silver adds per-variant
    # names + arities as separate structural fields. Captures
    # the load-bearing claim that an emitter cannot rename
    # variants during enum emission. Companion theorem
    # variant_arities_preserved_silver in the same Lean file.
    lean_theorem: "XpileContracts.CXlateLeanToRust.variant_names_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_inductive_to_enum(i).variant_names == i.variant_names
    domain: |
      Same as inductive_to_rust_enum — a Lean inductive with explicit
      constructors.
    invariants:
      - "per-variant names are preserved byte-for-byte (no PascalCase normalisation from Lean's lowerCamelCase convention)"
      - "per-variant arities preserved (companion theorem variant_arities_preserved_silver)"
      - "the Silver model captures per-variant structure that Bronze's variant_count couldn't see"
    preconditions:
      - "no constructor has an implicit/instance argument that requires elaboration"
      - "the Silver model assumes variant names fit in opaque byte payloads (Gold tier introduces Lean.Name with namespace path)"
    postconditions:
      - "an emitter that auto-renames variants for Rust convention conformance would falsify the rfl claim — caught at the typed-AST level"

  variant_count_additive_platinum:
    # PMAT-207 / XPILE-REFINE-XLATE-LEAN-005: EIGHTH Platinum-
    # tier refinement in the substrate. Extends Platinum to
    # C-XLATE-LEAN-TO-RUST (first Layer-2 forward-translation
    # Platinum). Captures additivity of variant_count under
    # inductive composition + concatenation of arity vectors.
    # Second demonstration of functoriality/homomorphism
    # pattern (PMAT-202 was first on list lowering), on a
    # different monoid. Companion theorems
    # variant_arities_homomorphism_platinum (Array-monoid) and
    # inductive_lowering_homomorphism_platinum (cross-layer
    # functoriality of the lowering itself).
    lean_theorem: "XpileContracts.CXlateLeanToRust.variant_count_additive_platinum"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      compose(i1, i2).variant_count == i1.variant_count + i2.variant_count
      (variant-count additivity)
    domain: |
      Any two LeanInductiveSilver values. The Platinum upgrade
      captures the algebraic structure of inductive-type
      assembly via monoid homomorphism over (Nat, +, 0).
    invariants:
      - "EIGHTH Platinum theorem; second demonstration of functoriality / homomorphism pattern after PMAT-202"
      - "variant_count is a MONOID HOMOMORPHISM into (Nat, +, 0)"
      - "variant_arities is a MONOID HOMOMORPHISM into (Array Nat, ++, #[])"
      - "the lowering itself is FUNCTORIAL: lower(i1 + i2) = lower(i1) + lower(i2) (companion theorem)"
      - "captures cross-layer consistency: PMAT-202 proved this for Python list lowering, PMAT-207 proves it for Lean inductive lowering"
    preconditions:
      - "two well-formed LeanInductiveSilver values"
      - "no special preconditions — additivity is universal over Nat addition"
    postconditions:
      - "an emitter that does variant deduplication during composition would falsify additivity — caught at the Platinum theorem level"
      - "the substrate has now demonstrated functoriality on TWO different lowerings (PMAT-202 list, PMAT-207 inductive), confirming the pattern is portable across Layer-2 contract domains"

  inductive_monoid_diamond:
    # PMAT-222 / XPILE-REFINE-XLATE-LEAN-006: EIGHTH Diamond-tier
    # refinement. Combines PMAT-207 variant_count additivity +
    # variant_arities homomorphism + identity into the INDUCTIVE
    # MONOID axiomatization. Eighth distinct Diamond category —
    # structural algebraic for inductive types.
    lean_theorem: "XpileContracts.CXlateLeanToRust.inductive_monoid_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      inductive composition forms a MONOID:
        (a) variant_count additivity: compose(i1, i2).count = i1.count + i2.count
        (b) variant_arities homomorphism: compose(i1, i2).arities = i1.arities ++ i2.arities
        (c) left identity: compose(empty, i) = i
        (d) right identity: compose(i, empty) = i
    domain: |
      Any two LeanInductiveSilver values under compose_inductive_silver.
      The Diamond upgrade captures the FULL inductive-monoid
      axiomatization.
    invariants:
      - "EIGHTH Diamond-tier theorem; combines PMAT-207 additivity + homomorphism + identity"
      - "INDUCTIVE MONOID — structural algebraic for Lean inductives"
      - "captures (LeanInductiveSilver, compose, empty) monoid structure for inductive-type assembly"
    preconditions:
      - "two well-formed LeanInductiveSilver values"
      - "no special preconditions — monoid axioms hold universally"
    postconditions:
      - "an emitter that deduplicates variants during composition or reorders arities would falsify this Diamond"
      - "compositional reasoning about inductive-type assembly is now fully type-level"

  variant_count_cardinality_functor_diamond:
    # PMAT-237 / XPILE-REFINE-XLATE-LEAN-TO-RUST-006: SECOND
    # Diamond on this contract — Layer 2 depth-2 alt. Distinct
    # algebraic category from PMAT-222 inductive-monoid (structural
    # composition) vs cardinality-functor (variant_count as a
    # Nat-monoid homomorphism). The cardinality functor captures
    # an ORTHOGONAL property: the count projection could be
    # broken (e.g., via double-counting) while the structural
    # monoid remains valid.
    lean_theorem: "XpileContracts.CXlateLeanToRust.variant_count_cardinality_functor_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      variant_count is a MONOID HOMOMORPHISM
      (LeanInductiveSilver, compose, empty) → (Nat, +, 0):
        (a) additivity: count(compose(i1, i2)) = count(i1) + count(i2)
        (b) identity preservation: count(empty) = 0
        (c) non-negativity: count(i) ≥ 0
        (d) cardinality consistency: count = arities.size in model
    domain: |
      Any two LeanInductiveSilver values. The Diamond captures
      the FUNCTORIAL projection from the inductive-monoid to the
      Nat-monoid via variant_count.
    invariants:
      - "SECOND Diamond category on C-XLATE-LEAN-TO-RUST — Layer 2 depth-2 alt"
      - "distinct algebraic category from PMAT-222 inductive-monoid (structural vs cardinality)"
      - "captures FUNCTORIAL monoid homomorphism into (Nat, +, 0)"
    preconditions:
      - "two well-formed LeanInductiveSilver values; the cardinality-consistency clause requires count = arities.size at the model level"
    postconditions:
      - "an emitter that doubles variant counts during composition (e.g., via dedup-then-restore) would falsify (a)"
      - "an emitter that lifts the empty inductive to a non-zero count would falsify (b)"

  structure_to_rust_struct:
    # PMAT-133: Bronze-tier refinement theorem locks in
    # field-count preservation.
    lean_theorem: "XpileContracts.CXlateLeanToRust.structure_to_rust_struct"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "structure_to_rust_struct"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(structure S where (a : A) (b : B)) ==
        struct S { a: A_rust, b: B_rust }
    domain: |
      A Lean structure with named fields. Anonymous structures (Lean
      `⟨...⟩` literal syntax) become positional tuple structs.
    invariants:
      - "field name and order preserved"
      - "structure extending (Lean `extends`) lowers to composition (field of struct type), NOT inheritance"
      - "default field values (Lean := ...) lower to a Default impl"
    preconditions:
      - "every field type has a Rust counterpart (no `Type` / `Sort u` fields)"
      - "the structure is not parameterized over a Lean universe variable that has no Rust equivalent"
    postconditions:
      - "the emitted Rust struct has the same field names and order as the source"
      - "Lean `extends`-derived fields appear as composition (a typed field), never as inheritance"
      - "Lean default values (`field := value`) produce a `Default` impl with the same default expression"

  field_names_preserved_silver:
    # PMAT-177: Silver-tier promotion of structure_to_rust_struct.
    # Bronze recorded just field_count; Silver adds per-field
    # names + types as separate structural fields. Composes with
    # companion theorem field_types_preserved_silver to give
    # the (name, type) pair for each field.
    lean_theorem: "XpileContracts.CXlateLeanToRust.field_names_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_structure_to_struct(s).field_names == s.field_names
    domain: |
      Same as structure_to_rust_struct — a Lean structure with named fields.
    invariants:
      - "per-field names preserved byte-for-byte (no snake_case → camelCase normalisation)"
      - "per-field types preserved (companion theorem field_types_preserved_silver)"
      - "Silver model captures per-field structural detail that Bronze's field_count couldn't see"
    preconditions:
      - "every field type has a Rust counterpart (no `Type` / `Sort u` fields)"
      - "the structure is not parameterized over a Lean universe variable that has no Rust equivalent"
      - "the Silver model assumes field names + types fit in opaque byte payloads (Gold tier introduces typed AST nodes)"
    postconditions:
      - "an emitter that does dependent-type erasure (replacing typed fields with Box<dyn Any>) would falsify field_types_preserved_silver"
      - "an emitter that renames fields for Rust convention conformance would falsify field_names_preserved_silver"

  instance_to_rust_impl:
    # PMAT-133: Bronze-tier refinement theorem locks in
    # method-count preservation.
    lean_theorem: "XpileContracts.CXlateLeanToRust.instance_to_rust_impl"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "instance_to_rust_impl"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(instance : C T where method := body) ==
        impl C for T { fn method() { body_rust } }
    domain: |
      A Lean typeclass instance whose typeclass has a Rust trait
      counterpart (registered in the FFI manifest or built-in for
      Eq/Ord/Hash/Default/etc.).
    invariants:
      - "method names preserved"
      - "default methods in the typeclass map to default methods in the trait"
      - "instance priority (Lean) does not lower; Rust uses orphan rules instead"
    preconditions:
      - "the Lean typeclass is registered as a Rust trait equivalence"
    postconditions:
      - "the emitted Rust `impl` provides every method declared in the trait"
      - "method names match between Lean and Rust (no mangling)"
      - "Lean default method bodies in the typeclass map to Rust default method bodies in the trait (not duplicated per impl)"

  method_names_preserved_silver:
    # PMAT-178: Silver-tier promotion of instance_to_rust_impl.
    # Bronze recorded just method_count; Silver adds per-method
    # names + default-method flags as separate structural fields.
    # Companion theorem default_method_flags_preserved_silver
    # captures the trait-default vs per-instance-override
    # distinction.
    lean_theorem: "XpileContracts.CXlateLeanToRust.method_names_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_instance_to_impl(i).method_names == i.method_names
    domain: |
      Same as instance_to_rust_impl.
    invariants:
      - "per-method names preserved byte-for-byte (no mangling)"
      - "per-method default-flag preserved (companion theorem) — emitter cannot turn class-default into per-instance override"
    preconditions:
      - "the Lean typeclass is registered as a Rust trait equivalence"
    postconditions:
      - "an emitter that mangles method names for Rust convention conformance would falsify method_names_preserved_silver"
      - "an emitter that re-implements default methods per-instance would silently change trait-resolution semantics — caught by default_method_flags_preserved_silver"

  axiom_to_extern_fn:
    # PMAT-133: Bronze-tier refinement theorem locks in signature
    # preservation AND the ≥5-line WARNING comment floor.
    lean_theorem: "XpileContracts.CXlateLeanToRust.axiom_to_extern_fn"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "axiom_to_extern_fn"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(axiom name : T) ==
        // WARNING comment block
        unsafe extern "Rust" {
            fn name() -> T_rust;
        }
    domain: |
      A Lean `axiom` — an assumed-true declaration with no proof. These
      are dangerous; xpile lowers them as `extern` declarations with a
      MANDATORY warning comment.
    invariants:
      - "the emitted Rust has at least 5 lines of WARNING comment above the extern"
      - "the extern is in an `unsafe extern` block"
      - "the contract citing the axiom is named in the comment"
    preconditions:
      - "the user supplied a corresponding implementation in another crate, OR the contract explicitly notes the axiom is for-proof-only"
    postconditions:
      - "the emitted Rust block contains at least 5 lines of `// WARNING:` comment above the extern declaration"
      - "the extern block is qualified `unsafe extern \"Rust\"` (never plain `extern`)"
      - "the warning comment names at least one citing contract ID"

  cited_contracts_preserved_silver:
    # PMAT-178: Silver-tier promotion of axiom_to_extern_fn.
    # Bronze captured signature + warning-lines floor; Silver
    # adds the cited-contract-IDs list as a separate structural
    # field. Captures the invariant "warning comment names at
    # least one citing contract ID" at the type level.
    lean_theorem: "XpileContracts.CXlateLeanToRust.cited_contracts_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_axiom_to_extern(a).cited_contract_ids == a.cited_contract_ids
    domain: |
      Same as axiom_to_extern_fn — a Lean `axiom` declaration.
    invariants:
      - "cited-contract-IDs list preserved as a separate structural field"
      - "an emitter that drops citation list to save vertical space would falsify this — reviewers cannot trace axiom to motivating contract"
      - "axiom_signature_preserved_silver companion theorem preserves signature in the Silver model"
    preconditions:
      - "the user supplied a corresponding implementation in another crate, OR the contract explicitly notes the axiom is for-proof-only"
    postconditions:
      - "the emitted extern block's warning comment contains every contract ID from the source axiom's citation list"

  warning_lines_preserved_gold:
    # PMAT-188 / XPILE-REFINE-XLATE-LEAN-004: FOURTH Gold-tier
    # refinement in the substrate. Promotes Silver's
    # warning_lines : Nat (with ≥ 5 invariant as separate
    # proof) to WarningLineCount := { n : Nat // n ≥ 5 }
    # refinement subtype. The floor is encoded at the TYPE
    # level. Demonstrates Gold pattern on Layer-2 translation
    # contracts (after PMAT-185 Layer-1 arithmetic, PMAT-186
    # Layer-4 FFI, PMAT-187 Layer-5 compile-time). Together
    # they span the contract taxonomy at Gold tier. Companion
    # theorems warning_lines_witness_gold and
    # gold_warning_lines_agrees_with_silver_floor.
    lean_theorem: "XpileContracts.CXlateLeanToRust.warning_lines_preserved_gold"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_axiom_to_extern_gold(a).warning_lines.val == a.warning_lines.val
      WITH floor warning_lines.val ≥ 5
    domain: |
      Same as axiom_to_extern_fn — a Lean axiom declaration.
    invariants:
      - "the ≥ 5 floor is encoded at the TYPE level — emitter receiving a WarningLineCount cannot pass < 5"
      - "the floor witness travels with the value through lowering — companion theorem warning_lines_witness_gold"
      - "a downstream module receiving an emitted extern can rely on the ≥ 5 bound without re-verifying — Gold-tier compositional safety"
      - "companion theorem gold_warning_lines_agrees_with_silver_floor bridges Gold to PMAT-133's Silver model"
    preconditions:
      - "the axiom's warning_lines is constructed with a proof of ≥ 5 (Gold-tier well-formedness obligation)"
      - "an emitter that omits the warning block (or trims it to a 1-liner) would not type-check against lower_axiom_to_extern_gold"
    postconditions:
      - "emitted extern always has ≥ 5 warning lines BY TYPE — no runtime check needed downstream"
      - "this is the archetype Gold-tier pattern applied to Layer-2 translation contracts, completing the cross-taxonomy Gold demonstration"

  noncomputable_def_to_rust_panic:
    # PMAT-133: Bronze-tier refinement theorem locks in the
    # canonical panic-marker body AND the #[doc(hidden)] attribute.
    lean_theorem: "XpileContracts.CXlateLeanToRust.noncomputable_def_to_rust_panic"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "noncomputable_def_to_rust_panic"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(noncomputable def f := body) ==
        fn f() -> R_rust { panic!("noncomputable Lean def has no runtime equivalent") }
    domain: |
      Lean `noncomputable def` — uses classical reasoning (choice, excluded
      middle on uncountable sets). Has no executable semantics.
    invariants:
      - "Rust emission is a `panic!` with the source filename and Lean def name"
      - "the function is marked `#[doc(hidden)]` to avoid accidental use"
      - "a corresponding Layer-1 contract MUST exist documenting why the construct appears"
    preconditions:
      - "the Lean source declaration is keyword-marked `noncomputable def`"
      - "a Layer-1 contract documenting the construct exists in `contracts/`"
    postconditions:
      - "the lowered Rust function body is exactly `panic!(\"noncomputable Lean def has no runtime equivalent\")` with the Lean source location interpolated"
      - "the function carries `#[doc(hidden)]` attribute"
      - "any caller in the lowered Rust crate gets a `clippy::pedantic` warning via a deny lint pointing at the contract"

  panic_message_preserved_silver:
    # PMAT-178: Silver-tier promotion of
    # noncomputable_def_to_rust_panic. Bronze captured body bytes
    # + doc_hidden; Silver splits the panic message from the
    # canonical marker for type-level lock-in. Companion theorem
    # noncomputable_name_preserved_silver in same Lean file.
    lean_theorem: "XpileContracts.CXlateLeanToRust.panic_message_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_noncomputable_to_panic(d).panic_message == d.panic_message
    domain: |
      Same as noncomputable_def_to_rust_panic — Lean
      `noncomputable def`.
    invariants:
      - "panic_message preserved byte-for-byte as separate structural field"
      - "an emitter using todo!() or unimplemented!() instead of the canonical panic message would falsify this — captures runtime-semantics distinction Bronze couldn't see"
    preconditions:
      - "the Lean source declaration is keyword-marked `noncomputable def`"
    postconditions:
      - "the panic message string survives lowering at the structural level, not just as part of the body payload"

  citation_in_emitted_rust:
    # PMAT-133: Bronze-tier refinement theorem locks in
    # byte-for-byte contract-ID preservation in the citation
    # doc-comment.
    lean_theorem: "XpileContracts.CXlateLeanToRust.citation_in_emitted_rust"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    # PMAT-147: Kani harness mirrors the Lean theorem.
    kani_harness: "citation_in_emitted_rust"
    kani_file: "contracts/kani/xlate_lean_to_rust.rs"
    formula: |
      xlate(any Lean decl D with contract C) emits Rust with
        /// Contract: <C.id>
        /// Lean source: <file>:<line>
      doc-comment above the lowered Rust item.
    domain: |
      Every emitted Rust item produced by lowering a Lean declaration
      cited in any xpile contract.
    invariants:
      - "doc-comment cites at least one contract ID"
      - "doc-comment includes the Lean source location for audit"
      - "if multiple contracts cite the same Lean decl, all are listed"
    preconditions:
      - "the Lean source declaration appears in at least one xpile contract's citation list"
      - "the Rust emission target supports doc-comments (every codegen does)"
    postconditions:
      - "every emitted Rust item produced from a cited Lean decl carries `/// Contract: <C.id>` above its declaration"
      - "the Lean source location (`<file>:<line>`) appears in the doc-comment"
      - "multi-contract citations enumerate all cited IDs (set-union semantics, no drops)"

  multi_citation_preserved_silver:
    # PMAT-178: Silver-tier promotion of citation_in_emitted_rust.
    # Bronze captured byte-identity of single contract_id; Silver
    # adds source_location and multi_citation_set as separate
    # structural fields. Captures the set-union semantics for
    # multi-contract citations that Bronze's single contract_id
    # couldn't model. Companion theorem
    # citation_source_location_preserved_silver in same file.
    # COMPLETES Silver coverage on C-XLATE-LEAN-TO-RUST (9/9).
    lean_theorem: "XpileContracts.CXlateLeanToRust.multi_citation_preserved_silver"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      lower_decl_with_citation(d).multi_citation_set == d.multi_citation_set
    domain: |
      Same as citation_in_emitted_rust.
    invariants:
      - "multi_citation_set preserved through lowering (set-union semantics, no drops)"
      - "source_location preserved (companion theorem citation_source_location_preserved_silver)"
      - "the typed Silver model captures the multi-citation invariant that Bronze's single contract_id could not"
    preconditions:
      - "the Lean source declaration appears in at least one xpile contract's citation list"
    postconditions:
      - "every emitted Rust item produced from a cited Lean decl carries the full multi-citation set in its doc-comment"
      - "the source-location string survives lowering as a separate field, not folded into the citation text"

  rust_fn_struct_extensionality_diamond:
    # PMAT-335: THIRD Diamond on this contract — BROADENS DEPTH-3
    # from 10 to 11 contracts. EIGHTH substrate-wide demonstration
    # of structure-extensionality pattern. Substrate now only 1
    # contract away from depth-3 UNIVERSAL.
    lean_theorem: "XpileContracts.CXlateLeanToRust.rust_fn_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      RustFn admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two RustFn records (body : Array UInt8).
    invariants:
      - "THIRD Diamond category — BROADENS DEPTH-3 from 10 to 11 contracts"
      - "EIGHTH substrate-wide demonstration of structure-extensionality pattern"
    preconditions:
      - "two RustFn records"
    postconditions:
      - "Diamond depth-3 broadened: 11 contracts at depth-3+"

  variant_count_nat_structure_diamond:
    # PMAT-343: FOURTH Diamond on this contract — BROADENS DEPTH-4
    # from 10 to 11 contracts. LeanInductive / RustEnum
    # variant_count Nat structure (non-negativity + successor
    # strict-ordering).
    lean_theorem: "XpileContracts.CXlateLeanToRust.variant_count_nat_structure_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      LeanInductive / RustEnum variant_count Nat structure:
        (a) i.variant_count ≥ 0
        (b) i.variant_count < i.variant_count + 1
        (c) e.variant_count ≥ 0
        (d) e.variant_count < e.variant_count + 1
    domain: |
      Any LeanInductive and RustEnum.
    invariants:
      - "FOURTH Diamond category — BROADENS DEPTH-4 from 10 to 11 contracts"
    preconditions:
      - "one LeanInductive, one RustEnum"
    postconditions:
      - "Diamond depth-4 broadened: 11 contracts at depth-4+"

  rust_fn_body_array_size_diamond:
    # PMAT-351: FIFTH Diamond on this contract — BROADENS DEPTH-5
    # from 8 to 9 contracts. Pushes XlateLeanToRust (Layer 5) from
    # depth-4 to depth-5, adding a THIRD Layer 5 contract at depth-5
    # (CompileRustToPtxMma was first via PMAT-287, Notation second
    # via PMAT-350). RUST-FN BODY ARRAY.SIZE STRUCTURE: the body
    # Array.size satisfies non-negativity, empty-base, and
    # field-replacement invariants. Sixth substrate-wide
    # demonstration of the Array.size template (after PMAT-340/341/
    # 344/348).
    lean_theorem: "XpileContracts.CXlateLeanToRust.rust_fn_body_array_size_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      RustFn.body Array.size structure:
        (a) body.size >= 0 (trivially for Nat)
        (b) empty body has size-0
        (c) field-replacement preserves body size
        (d) self-equal size (reflexivity)
    domain: |
      Any RustFn value (body : Array UInt8). The four properties
      together axiomatize the body-field Array.size structure as a
      well-behaved natural-number measure.
    invariants:
      - "FIFTH Diamond category on C-XLATE-LEAN-TO-RUST — BROADENS DEPTH-5 from 8 to 9 contracts"
      - "ARRAY.SIZE STRUCTURE — distinct from PMAT-222 monoid, PMAT-237 functor, PMAT-335 struct-ext, PMAT-343 Nat-structure"
      - "sixth substrate-wide demonstration of the Array.size template"
    preconditions:
      - "one RustFn record with body : Array UInt8"
    postconditions:
      - "Diamond depth-5 broadened: 9 contracts at depth-5+ (3 Layer 5 contracts at depth-5)"

  rust_item_with_citation_silver_struct_extensionality_diamond:
    # PMAT-363: SIXTH Diamond on this contract — BROADENS DEPTH-6
    # substrate-wide. Pushes XlateLeanToRust (Layer 5) from depth-5
    # to depth-6. RUST-ITEM-WITH-CITATION-SILVER STRUCTURE
    # EXTENSIONALITY: the 3-field record (contract_id,
    # source_location, multi_citation_set) is field-extensional with
    # decidable equality. Nineteenth substrate-wide demonstration of
    # the structure-extensionality pattern.
    lean_theorem: "XpileContracts.CXlateLeanToRust.rust_item_with_citation_silver_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      RustItemWithCitationSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq (contract_id, source_location, multi_citation_set) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two RustItemWithCitationSilver records with 3 fields and
      derived DecidableEq.
    invariants:
      - "SIXTH Diamond category on C-XLATE-LEAN-TO-RUST — BROADENS DEPTH-6 substrate-wide"
      - "STRUCTURE EXTENSIONALITY — nineteenth substrate-wide demonstration of this pattern"
    preconditions:
      - "two RustItemWithCitationSilver records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-6 broadened: 8 contracts at depth-6+"

  lean_inductive_struct_extensionality_diamond:
    # PMAT-373: SEVENTH Diamond on this contract — BROADENS DEPTH-7
    # substrate-wide. Pushes XlateLeanToRust (Layer 5) from depth-6
    # to depth-7 as the third L5 contract at depth-7+. LEAN-INDUCTIVE
    # STRUCTURE EXTENSIONALITY: the single-field LeanInductive record
    # (variant_count : Nat) is field-extensional. Twenty-fifth
    # substrate-wide demonstration. Captures the Lean-side INPUT
    # record, distinct from PMAT-335 (RustFn output) and PMAT-363
    # (RustItemWithCitationSilver Rust-side citation record).
    lean_theorem: "XpileContracts.CXlateLeanToRust.lean_inductive_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      LeanInductive admits STRUCTURE EXTENSIONALITY:
        (a) field eq (variant_count) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two LeanInductive records (variant_count : Nat) with derived
      DecidableEq.
    invariants:
      - "SEVENTH Diamond category on C-XLATE-LEAN-TO-RUST — BROADENS DEPTH-7 substrate-wide"
      - "STRUCTURE EXTENSIONALITY — twenty-fifth substrate-wide demonstration"
    preconditions:
      - "two LeanInductive records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-7 broadened: 3 L5 contracts at depth-7"

  rust_enum_struct_extensionality_diamond:
    # PMAT-384: EIGHTH Diamond on this contract — BROADENS DEPTH-8
    # substrate-wide. Pushes XlateLeanToRust (Layer 5) from depth-7
    # to depth-8 as the third L5 contract at depth-8+. RUST-ENUM
    # STRUCTURE EXTENSIONALITY: single-field record (variant_count :
    # Nat). Thirty-first substrate-wide demonstration. Mirror of
    # PMAT-373 (LeanInductive) — closes Lean↔Rust inductive/enum
    # structural pair.
    lean_theorem: "XpileContracts.CXlateLeanToRust.rust_enum_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      RustEnum admits STRUCTURE EXTENSIONALITY:
        (a) field eq (variant_count) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two RustEnum records (variant_count : Nat) with derived
      DecidableEq.
    invariants:
      - "EIGHTH Diamond category on C-XLATE-LEAN-TO-RUST — BROADENS DEPTH-8 substrate-wide"
      - "STRUCTURE EXTENSIONALITY — thirty-first substrate-wide demonstration"
      - "Mirror of PMAT-373 (LeanInductive) — closes Lean↔Rust inductive/enum struct pair"
    preconditions:
      - "two RustEnum records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-8 broadened"

  warning_line_count_subtype_extensionality_diamond:
    # PMAT-396: NINTH Diamond on this contract — BROADENS DEPTH-9
    # substrate-wide. Pushes XlateLeanToRust (Layer 5) from depth-8
    # to depth-9. First L5 contract at depth-9 in the broadening
    # wave. WARNING-LINE-COUNT SUBTYPE EXTENSIONALITY: the Gold-tier
    # subtype `{ n : Nat // n ≥ warning_lines_floor }` admits
    # subtype extensionality. EIGHTH substrate-wide
    # subtype-extensionality demonstration (Template 9 Gold-tier
    # subtype-ext). Mirror of PMAT-311 (BoundedSmem `≤`) — both
    # bounded-Nat subtypes with dual-direction bound predicates.
    lean_theorem: "XpileContracts.CXlateLeanToRust.warning_line_count_subtype_extensionality_diamond"
    lean_file: "contracts/lean/XlateLeanToRust.lean"
    formula: |
      WarningLineCount admits SUBTYPE EXTENSIONALITY:
        (a) val eq -> subtype eq (Subtype.ext)
        (b) subtype eq -> val eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two WarningLineCount values (Gold-tier Nat-subtype with
      lower-bound witness n ≥ warning_lines_floor = 5).
    invariants:
      - "NINTH Diamond category on C-XLATE-LEAN-TO-RUST — BROADENS DEPTH-9 substrate-wide"
      - "SUBTYPE EXTENSIONALITY — eighth substrate-wide demonstration (Template 9 Gold-tier subtype-ext)"
      - "Mirror of PMAT-311 (BoundedSmem) — both bounded-Nat subtypes, dual-direction bound predicates"
    preconditions:
      - "two WarningLineCount values"
    postconditions:
      - "Diamond depth-9 broadened: first L5 contract at depth-9 in broadening wave"

proof_obligations:
  - type: postcondition
    property: total def lowers to a panic-free Rust fn
    formal: "xlate(def f) is panic-free under any valid input"
    applies_to: def_to_rust_fn

  - type: postcondition
    property: partial def is annotated and returns Result
    formal: "xlate(partial def f).attrs contains 'partial_translation' ∧
             returns Result<_, NonTermination>"
    applies_to: partial_def_to_rust_fn

  - type: invariant
    property: theorem declarations produce NO Rust output
    formal: "∀ thm ∈ input.theorems : xlate(thm).rust == ∅"
    applies_to: theorem_carried_as_lean_sidecar

  - type: postcondition
    property: inductive constructor arity is preserved
    formal: "∀ ctor ∈ inductive : arity(rust_variant(ctor)) == arity(ctor)"
    applies_to: inductive_to_rust_enum

  - type: postcondition
    property: instance methods map 1:1 to trait impl methods
    formal: "methods(rust_impl) == methods(lean_instance)"
    applies_to: instance_to_rust_impl

  - type: invariant
    property: axioms get a multi-line warning comment
    formal: "line_count(comment_above(extern_block_for_axiom)) ≥ 5"
    applies_to: axiom_to_extern_fn

  - type: postcondition
    property: noncomputable def lowers to panic, not silent stub
    formal: "body(xlate(noncomputable def f)) contains 'panic!'"
    applies_to: noncomputable_def_to_rust_panic

  - type: invariant
    property: emitted Rust cites at least one contract
    formal: "∀ item ∈ emitted : doc_comments_of(item) cite ≥ 1 ContractId"
    applies_to: citation_in_emitted_rust

  - type: frame
    property: lowering does not mutate input Lean AST
    formal: "modifies() == ∅"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XLATE-LEAN-001
    rule: |
      Total `def` emits a Rust fn returning the inner type R, NOT
      Result<R, _> (which is reserved for partial def).
    prediction: |
      `def f : Nat := 42` → `fn f() -> u64 { 42 }` (not Result<_,_>).
    test: |
      cargo test -p xpile-lean-codegen --test total_def_returns_r
    if_fails: |
      Translation conflates totality with partiality; needless wrapper noise.
    ship_blocking: true
    counter_example_classes:
      - all_returns_result
      - missing_termination_recognition

  - id: FALSIFY-XLATE-LEAN-002
    rule: |
      `partial def` MUST emit a function returning
      Result<_, NonTermination> AND carry the #[partial_translation]
      attribute.
    prediction: |
      `partial def loop : Unit := loop` → `#[partial_translation] fn loop()
      -> Result<(), NonTermination> { ... }`.
    test: |
      cargo test -p xpile-lean-codegen --test partial_def_wraps_result
    if_fails: |
      Partial Lean def silently lowered as total Rust fn — non-termination
      becomes UB-equivalent (infinite loop, no budget).
    ship_blocking: true
    counter_example_classes:
      - silent_partial
      - missing_attribute

  - id: FALSIFY-XLATE-LEAN-003
    rule: |
      `theorem` declarations produce NO Rust output (zero items in
      the emitted Rust file for theorems alone).
    prediction: |
      A Lean input containing only `theorem foo : 1 + 1 = 2 := rfl`
      produces a Rust file with zero `fn`/`struct`/`impl`/`const` items.
    test: |
      cargo test -p xpile-lean-codegen --test theorem_emits_no_rust
    if_fails: |
      Theorems incorrectly treated as executable; bloat in emitted Rust.
    ship_blocking: true
    counter_example_classes:
      - theorem_as_fn
      - theorem_as_const

  - id: FALSIFY-XLATE-LEAN-004
    rule: |
      Lean inductive constructor arity equals Rust enum variant arity.
    prediction: |
      `inductive T | A (x : Nat) (y : Nat) | B (z : String)` →
      `enum T { A(u64, u64), B(String) }` with arities 2 and 1.
    test: |
      cargo test -p xpile-lean-codegen --test inductive_arity_preserved
    if_fails: |
      Pattern-match exhaustiveness checks misalign; data corruption.
    ship_blocking: true
    counter_example_classes:
      - dropped_field
      - extra_phantom_field

  - id: FALSIFY-XLATE-LEAN-005
    rule: |
      `axiom` MUST be lowered with at least 5 lines of WARNING comment
      above the resulting `unsafe extern` block.
    prediction: |
      `axiom choice : ∀ T, (T → Prop) → T` → emitted Rust file has
      ≥ 5 lines of `///` or `//` comment containing the substring
      "AXIOM" before the `unsafe extern` block.
    test: |
      cargo test -p xpile-lean-codegen --test axiom_has_warning
    if_fails: |
      Axioms slip into Rust as ordinary externs; reviewers miss them.
    ship_blocking: true
    counter_example_classes:
      - silent_axiom
      - missing_warning_block

  - id: FALSIFY-XLATE-LEAN-006
    rule: |
      `noncomputable def` MUST lower to a function body containing
      `panic!`, never to a silent stub or `unimplemented!`.
    prediction: |
      `noncomputable def f := Classical.choice ...` → fn body contains
      `panic!("noncomputable ...")`.
    test: |
      cargo test -p xpile-lean-codegen --test noncomputable_panics
    if_fails: |
      Noncomputable def silently lowered as default value — wrong
      runtime behavior on accidental call.
    ship_blocking: true
    counter_example_classes:
      - default_value_stub
      - unimplemented_macro

  - id: FALSIFY-XLATE-LEAN-007
    rule: |
      Every emitted Rust item MUST have a doc-comment citing at least
      one xpile contract ID.
    prediction: |
      grep -c '/// Contract: C-' target/rust/lean_out.rs >=
      count of fn/struct/enum/impl items in the file.
    test: |
      cargo test -p xpile-lean-codegen --test every_item_cites_contract
    if_fails: |
      Citation bridge incomplete on code-lane side; reviewer cannot
      trace emitted Rust back to a contract.
    ship_blocking: true
    counter_example_classes:
      - missing_citation
      - bare_item

  - id: FALSIFY-XLATE-LEAN-008
    rule: |
      Translation MUST NOT mutate the input Lean AST.
    prediction: |
      hash(lean_ast) before == hash(lean_ast) after xlate().
    test: |
      cargo test -p xpile-lean-codegen --test xlate_no_mutation
    if_fails: |
      Hidden side effects; cache key invalidates spuriously.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect

  - id: FALSIFY-XLATE-LEAN-009
    rule: |
      A Lean `instance` MUST produce a Rust `impl <Trait> for <Type>`
      whose methods are in 1:1 correspondence with the instance's
      methods, preserving names.
    prediction: |
      `instance : Ord Nat where compare := Nat.compare` →
      `impl Ord for u64 { fn compare(...) { ... } }` — exactly one
      `compare` method, no extras, no renames.
    test: |
      cargo test -p xpile-lean-codegen --test instance_method_1to1
    if_fails: |
      Methods dropped, renamed, or added — Rust impl doesn't satisfy
      the trait contract that the Lean typeclass promised.
    ship_blocking: true
    counter_example_classes:
      - dropped_method
      - extra_method
      - renamed_method

kani_harnesses:
  - id: KANI-XLATE-LEAN-001
    obligation: frame
    bound: 3
    property: |
      For a bounded Lean AST (up to 3 top-level declarations), xlate
      does not mutate its input.
    harness: |
      #[kani::proof]
      fn xlate_lean_is_frame_safe() {
          let n: usize = kani::any();
          kani::assume(n <= 3);
          let decls: [LeanDecl; 3] = kani::any();
          let module = LeanModule { decls: decls[..n].to_vec() };
          let snapshot = module.clone();
          let _ = xlate_lean_module(&module);
          assert_eq!(module, snapshot);
      }

  - id: KANI-XLATE-LEAN-002
    obligation: invariant
    bound: 2
    property: |
      For a Lean module containing only `theorem` declarations (up to
      2 of them), the emitted Rust has zero items.
    harness: |
      #[kani::proof]
      fn theorems_emit_no_rust() {
          let n: usize = kani::any();
          kani::assume(n <= 2);
          let thms: [LeanTheorem; 2] = kani::any();
          let module = LeanModule::of_theorems(&thms[..n]);
          let rust_out = xlate_lean_module(&module);
          assert_eq!(rust_out.items.len(), 0);
      }

  - id: KANI-XLATE-LEAN-003
    obligation: postcondition
    bound: 4
    property: |
      For an inductive with up to 4 constructors, each with bounded
      arity, the Rust enum has matching variant count and arity.
    harness: |
      #[kani::proof]
      fn inductive_arity_matches() {
          let n_ctors: usize = kani::any();
          kani::assume(n_ctors <= 4);
          let ctors: [LeanCtor; 4] = kani::any();
          let ind = LeanInductive { ctors: ctors[..n_ctors].to_vec() };
          let rust_enum = xlate_inductive(&ind);
          assert_eq!(rust_enum.variants.len(), n_ctors);
          for i in 0..n_ctors {
              assert_eq!(rust_enum.variants[i].arity(), ctors[i].arity());
          }
      }

qa_gate:
  id: QA-XLATE-LEAN-TO-RUST
  name: "Lean → Rust translation contract"
  min_coverage: 0.50
  max_complexity: 20
  required_tests:
    - every_referenced_lean_theorem_exists_in_its_file
    - every_referenced_kani_harness_exists_in_its_file
