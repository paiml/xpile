metadata:
  id: C-XLATE-RUST-FN-TO-LEAN-THM
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Translation contract: how a Rust function and its associated contract
    obligations lift to a Lean 4 theorem statement, with the contract ID
    embedded in the Lean namespace path (citation bridge per the 2026-05-15
    foundational design decision #4).

    Layer 2 of the xpile contract taxonomy (translation), proof-lane side.
    Consumed by `xpile-lean-contract-backend`. Falsification asserts the
    Lean output's syntactic shape — not just that *some* Lean was emitted,
    but that the theorem is named, scoped, and proven about the right
    Rust function.

    Co-load with C-XLATE-LEAN-TO-RUST: that contract handles the
    code-lane direction (Lean executable → Rust); this one handles the
    proof-lane lifting (Rust + contract → Lean theorem).
  xpile:
    layer: translation
    lane: proof
  references:
    - "Lean 4 documentation §3 (Definitions, theorems, namespaces)"
    - "Mathlib4 naming conventions"
    - contracts/xpile-contract-backend-trait-v1.yaml
    - docs/specifications/sub/contract-backend-trait.md
  depends_on:
    - C-XPILE-CONTRACT-BACKEND-TRAIT

equations:
  rust_fn_to_lean_def:
    # PMAT-072: Lean refinement theorem locks in the body-
    # preservation modelling commitment for rust_fn_to_lean_def.
    # See contracts/lean/XlateRustFnToLeanThm.lean for the proof.
    # Bidirectional partner of PMAT-070 — together they bracket
    # the full Rust ↔ Lean translation at Bronze tier.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.rust_fn_to_lean_def"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-073: Kani harness completes the §14.4 quorum and
    # closes the Rust ↔ Lean translation bracket at full paired-
    # discharge coverage (with PMAT-071 for the reverse
    # direction).
    kani_harness: "rust_fn_to_lean_def"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      lift(rust_fn(args: T1, ...) -> R, contract_C) ==
        def <fn_name> (args : T1_lean) ... : R_lean := <body_lean>
    domain: |
      A pure Rust function whose contract C declares only postconditions
      reachable from the function's return value. Generic parameters lift
      to Lean type-variable binders.
    invariants:
      - "Lean def name matches Rust fn name (no mangling)"
      - "type parameter ordering preserved"
      - "no side-effect declared in the Lean type — pure functions only"
    preconditions:
      - "rust_fn is marked `#[pure]` or contract C declares no side-effects"
      - "every Rust type T1..Tn appearing in rust_fn's signature has a canonical Lean lift (T_lean) defined by xpile-lean-contract-backend"
    postconditions:
      - "the emitted Lean def's name equals rust_fn's name byte-for-byte (no mangling, no namespace prefixing of the def itself)"
      - "the generic parameter list, in source order, lifts to Lean type-variable binders in the same order"
      - "the def's Lean type signature contains no `IO`, `StateM`, or other monadic wrapper — pure Rust → pure Lean"
      - "lean --check succeeds on the emitted def in isolation (no dangling references to un-lifted helpers)"

  name_preserved_silver:
    # PMAT-166: Silver-tier refinement — symmetric counterpart to
    # PMAT-165 on C-XLATE-LEAN-TO-RUST. Together they close the
    # bidirectional Rust ↔ Lean Silver bracket. Bronze rust_fn_to_lean_def
    # smushed name/generics/args/return_type/body into a single
    # byte-array payload; Silver splits Rust → 5 fields, Lean → 4
    # fields (Lean unifies generics+args into a single `binders`
    # payload via concat). This wired theorem proves the name
    # field is preserved byte-for-byte; companion theorems
    # body_preserved_silver, return_type_preserved_silver,
    # binders_concat_generics_args_silver live in the same Lean
    # file. Third multi-eq contract Silver upgrade (after PMAT-164
    # and PMAT-165).
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.name_preserved_silver"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-277: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat for this equation. Bronze harness on
    # `rust_fn_to_lean_def` was a single 4-byte payload (would pass
    # if the emitter swapped name and body bytes); Silver decomposes
    # into 5 source fields (name, generics, args, return_type, body)
    # and 4 target fields (binders = generics ++ args). Companion
    # harnesses body_preserved_silver, return_type_preserved_silver,
    # binders_concat_generics_args_silver in the same Kani file
    # exhaust per-field preservation. The binders concat order is
    # load-bearing — Lean's dependent-binder elaboration requires
    # generics-first.
    kani_harness: "name_preserved_silver"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      lift(rust_fn(name := n, ...), C).name == n
    domain: |
      Same as `rust_fn_to_lean_def` — a pure Rust function with a
      contract-declared no-side-effect property. The Silver upgrade
      narrows the modelling from "body bytes preserved" to "name
      AND generics AND args AND return type AND body each preserved
      as a separate structural field".
    invariants:
      - "Rust fn name preserved byte-for-byte as a separate field of the Lean def (no snake_case → lowerCamelCase normalisation, no Mathlib-style namespace prefixing of the def itself)"
      - "generics, args, return_type, and body are preserved as separate structural fields (companion theorems body_preserved_silver, return_type_preserved_silver, binders_concat_generics_args_silver in the same Lean file)"
      - "Lean's binders payload equals `generics ++ args` (generics first — required for dependent-binder elaboration)"
    preconditions:
      - "rust_fn is marked `#[pure]` or contract C declares no side-effects"
      - "the Silver model assumes the source name fits in an opaque byte payload (Gold tier replaces this with Lean.Name with universe levels and Mathlib namespacing rules)"
    postconditions:
      - "the emitted Lean def's name field equals the source Rust fn's name field byte-for-byte"
      - "no other Rust field is silently merged into the Lean def's name (the only allowed merge is generics ++ args → binders)"

  rust_postcondition_to_lean_theorem:
    # PMAT-136: Bronze-tier refinement theorem locks in 1:1 / 1:N
    # obligation → theorem expansion rule.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.rust_postcondition_to_lean_theorem"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-148: Kani harness mirrors the Lean theorem.
    kani_harness: "rust_postcondition_to_lean_theorem"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      lift(contract_C.proof_obligations[i] of type postcondition)
        produces a theorem carrying @[xpile_contract "<C.id>", xpile_equation "<applies_to>"]
        with theorem name equal to the equation_name the obligation applies_to
    domain: |
      A postcondition proof obligation in contract C, citing an equation
      by name via `applies_to:`.
    invariants:
      - "theorem's stated goal corresponds to the postcondition's `formal:` field"
      - "all `applies_to: all` obligations produce one theorem per equation"
      - "theorem carries an @[xpile_contract <C.id>, xpile_equation <eq_name>] attribute parseable by Lean's elaborator"
    preconditions:
      - "contract C is well-typed under `pv lint`"
      - "the emitted Lean file imports XpileContracts.Attr"
      - "the postcondition obligation's `applies_to:` field names an equation that exists in C.equations (otherwise the obligation has no anchor)"
    postconditions:
      - "exactly one Lean theorem is emitted per postcondition obligation when `applies_to:` names a single equation (1:1 ratio)"
      - "exactly N Lean theorems are emitted per postcondition obligation when `applies_to: all` and C has N equations (1:N ratio)"
      - "each emitted theorem's name equals the `applies_to:` equation name (no mangling, no compound naming like `theorem_for_<eq>`)"
      - "each emitted theorem carries `@[xpile_contract \"<C.id>\", xpile_equation \"<eq_name>\"]` parseable by Lean's elaborator (see citation_bridge_via_attribute)"
      - "the theorem's stated goal corresponds 1:1 with the obligation's `formal:` field — no weakening, no strengthening"

  expansion_count_preserved_silver:
    # PMAT-179 / XPILE-REFINE-XLATE-RUST-TO-LEAN-002: Silver-tier
    # promotion of rust_postcondition_to_lean_theorem. Adds
    # ContractObligationSilver { applies_to_all, source_index,
    # expansion_count } typed model. Proves expansion_count is
    # preserved as a separable field. Captures the bug class of
    # an emitter that merges obligations during 1:N expansion.
    # Companion theorem applies_to_all_preserved_silver locks
    # in the flag distinction.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.expansion_count_preserved_silver"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      lift_obligation(obl).lifted_count == obl.expansion_count
    domain: |
      Same as rust_postcondition_to_lean_theorem — a postcondition
      proof obligation citing an equation by name.
    invariants:
      - "expansion_count survives lifting as a separate typed field — no silent zeroing, no off-by-one"
      - "applies_to_all flag preserved (companion theorem) — captures semantic distinction between single-eq and applies_to: all"
    preconditions:
      - "the obligation's applies_to field names a real equation or is `all`"
    postconditions:
      - "an emitter that merges N obligations into a single theorem (losing provenance) would falsify expansion_count_preserved_silver"

  rust_precondition_to_lean_hypothesis:
    # PMAT-136: Bronze-tier refinement theorem locks in count +
    # source-order preservation of preconditions.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.rust_precondition_to_lean_hypothesis"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-148: Kani harness mirrors the Lean theorem.
    kani_harness: "rust_precondition_to_lean_hypothesis"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      lift(contract_C.proof_obligations[i] of type precondition)
        produces a Lean ∀-binder or `(h : P)` hypothesis in the relevant
        theorem(s)
    domain: |
      A precondition proof obligation in contract C citing an equation.
    invariants:
      - "preconditions appear in theorem goals BEFORE the postcondition"
      - "multiple preconditions chain as conjunctions or sequential binders"
      - "the equation's stated `preconditions:` array agrees with what's lifted"
    preconditions:
      - "the equation referenced by the precondition obligation has at least one entry in its `preconditions:` field"
      - "every Rust predicate in the precondition has a Lean-expressible counterpart (predicates over translated types lift via `Lift.lift`)"
    postconditions:
      - "the precondition is emitted as a Lean `∀`-binder or hypothesis `(h : P_lean)` in the relevant theorem's signature"
      - "the precondition appears BEFORE the postcondition in the implication chain (`P → Q`, not `Q` with `P` assumed in tactic body)"
      - "multiple preconditions chain as left-associated implications or conjunctions, preserving source order"
      - "no precondition is silently dropped — the count of lifted hypotheses matches the count of `preconditions:` entries"

  source_indices_preserved_silver:
    # PMAT-179: Silver-tier promotion of
    # rust_precondition_to_lean_hypothesis. Bronze proved
    # count + list-identity; Silver adds the source_indices
    # vector as a separate structural field. Captures the
    # source-order invariant at the type level — Bronze
    # couldn't catch an emitter using an unordered Set
    # intermediate representation. Companion theorem
    # hypothesis_payloads_preserved_silver.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.source_indices_preserved_silver"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      lift_preconditions(pl).source_indices == pl.source_indices
    domain: |
      Same as rust_precondition_to_lean_hypothesis.
    invariants:
      - "source_indices Array Nat preserved as separate structural field"
      - "payloads Array preserved (companion theorem)"
      - "captures source-order invariant Bronze couldn't see at the typed level"
    preconditions:
      - "the equation has at least one precondition entry"
    postconditions:
      - "an emitter using HashSet (or any unordered IR) for preconditions would falsify source_indices_preserved_silver — caught at the typed-vector level"

  non_empty_preconditions_preserves_indices_gold:
    # PMAT-191 / XPILE-REFINE-XLATE-RUST-TO-LEAN-003: SIXTH
    # Gold-tier refinement in the substrate. Extends Gold to
    # the Layer-2 reverse-translation direction (after PMAT-185
    # Layer-1, PMAT-186 Layer-4, PMAT-187 Layer-5, PMAT-188
    # Layer-2 forward direction, PMAT-189 Layer-2 notation).
    # Second demonstration of the collection-cardinality
    # subtype pattern (after PMAT-189 NonEmptyDefinition).
    # NonEmptyPreconditionList := { pl : PreconditionListSilver
    # // pl.source_indices.size > 0 } encodes precondition list
    # non-emptiness at type level. Companion theorems
    # non_empty_preconditions_witness_gold and
    # gold_non_empty_preconditions_agrees_with_silver.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.non_empty_preconditions_preserves_indices_gold"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      lower_non_empty_preconditions(n).source_indices == n.val.source_indices
      WITH n.val.source_indices.size > 0
    domain: |
      Same as rust_precondition_to_lean_hypothesis — but narrowed
      to non-empty precondition lists at the type level.
    invariants:
      - "non-emptiness witness travels with the value through lowering"
      - "downstream can iterate the source_indices without an empty-check"
      - "the NonEmptyPreconditionList subtype rules out empty-list inputs at CONSTRUCTION time"
      - "second demonstration of the collection-cardinality Gold pattern (after PMAT-189) — confirms the pattern is portable across contract domains"
    preconditions:
      - "the precondition list has at least one entry — encoded as a refinement subtype, not as an external proof obligation"
    postconditions:
      - "an emitter that constructs a PreconditionListSilver from a zero-entry list would not type-check against lower_non_empty_preconditions_gold"
      - "cross-contract pattern reuse confirms non-empty-list refinement is a portable Gold-tier idiom"

  precondition_lift_homomorphism_platinum:
    # PMAT-209 / XPILE-REFINE-XLATE-RUST-TO-LEAN-004: TENTH
    # Platinum-tier refinement in the substrate. Extends
    # Platinum to C-XLATE-RUST-FN-TO-LEAN-THM (eighth contract).
    # FOURTH demonstration of functoriality / monoid-
    # homomorphism pattern (after PMAT-202 list, PMAT-207
    # inductive, PMAT-208 citation). Establishes pattern is
    # LANE-AGNOSTIC — works on code lane AND proof lane.
    # Companion theorems precondition_payloads_homomorphism_platinum
    # and precondition_lift_preserves_empty_platinum.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.precondition_lift_homomorphism_platinum"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      lift(compose(pl1, pl2)).source_indices
        == lift(pl1).source_indices ++ lift(pl2).source_indices
      (functoriality / monoid homomorphism over (Array Nat, ++, #[]))
    domain: |
      Any two PreconditionListSilver values composed via per-
      component array concatenation. The Platinum upgrade
      captures the homomorphism property over the (Array Nat,
      ++, #[]) and (Array (Array UInt8), ++, #[]) monoids.
    invariants:
      - "TENTH Platinum theorem; FOURTH demonstration of functoriality / monoid-homomorphism pattern"
      - "establishes the functoriality pattern is LANE-AGNOSTIC: works on code (PMAT-202/207), notation (PMAT-208), and proof (PMAT-209) lanes"
      - "payloads array also forms a homomorphism (companion theorem)"
      - "empty list is preserved (companion theorem) → strict monoid homomorphism"
    preconditions:
      - "two well-formed PreconditionListSilver values"
      - "no special preconditions — Array concatenation is universal"
    postconditions:
      - "an emitter that processes preconditions piecewise produces the same observable result as monolithic emission"
      - "substrate has now demonstrated functoriality on FOUR distinct contract domains across all lanes — confirming the pattern is universal"

  precondition_list_monoid_diamond:
    # PMAT-223 / XPILE-REFINE-XLATE-RUST-TO-LEAN-005: NINTH
    # Diamond-tier refinement. Combines PMAT-209 functoriality
    # + payloads homomorphism + identity + associativity into
    # the PRECONDITION LIST MONOID axiomatization on the proof
    # lane direction.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.precondition_list_monoid_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      precondition list lift forms a MONOID:
        (a) source_indices homomorphism (PMAT-209 lifted)
        (b) payloads homomorphism (PMAT-209 companion lifted)
        (c) empty preservation (identity)
        (d) associativity (Array.append_assoc)
    domain: |
      Any three PreconditionListSilver values composed via
      array concatenation. The Diamond upgrade captures the
      FULL precondition-list-monoid axiomatization on the
      proof lane.
    invariants:
      - "NINTH Diamond-tier theorem; combines PMAT-209 + payloads + identity + associativity"
      - "PRECONDITION LIST MONOID — proof-lane equivalent of free list-monoid"
      - "completes monoid demonstration across both lanes (PMAT-221 list/code, PMAT-223 precondition/proof)"
    preconditions:
      - "three well-formed PreconditionListSilver values"
    postconditions:
      - "precondition lifting respects monoid structure — emitter pipelines that concat preconditions piecewise produce the same observable result as monolithic emission"
      - "proof-lane and code-lane both demonstrate monoid Diamond at the algebraic level"

  nonempty_preconditions_section_retraction_diamond:
    # PMAT-236 / XPILE-REFINE-XLATE-RUST-TO-LEAN-006: SECOND
    # Diamond on this contract — depth-2. Mirror of PMAT-229's
    # NonEmpty section-retraction Diamond pattern, applied to
    # the PROOF LANE (precondition lists). Fundamentally distinct
    # algebraic category from PMAT-223's free precondition-list-
    # monoid: monoid (composition) vs section-retraction (subtype
    # refinement preservation).
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.nonempty_preconditions_section_retraction_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      NonEmpty precondition list lifting forms a SECTION
      with retraction structure:
        (a) source_indices preservation (PMAT-191 lifted)
        (b) non-emptiness preserved: size > 0 ⇒ size > 0 after lift
        (c) Gold-Silver bridge: agrees with Silver lift
        (d) injectivity-on-content: same source_indices ⇒ same output
    domain: |
      Any NonEmptyPreconditionList value. The Diamond upgrade
      captures the FULL subtype-preservation axiomatization on
      the proof lane.
    invariants:
      - "SECOND Diamond category on C-XLATE-RUST-FN-TO-LEAN-THM — proof-lane depth-2"
      - "distinct algebraic category from PMAT-223 precondition-list-monoid"
      - "mirror of PMAT-229's NonEmpty section-retraction pattern on the proof lane"
    preconditions:
      - "a NonEmptyPreconditionList value (non-empty source_indices array)"
    postconditions:
      - "an emitter that constructs a proof-lane lift from a zero-entry NonEmpty witness would not type-check"
      - "Diamond depth-2 extends to proof-lane contracts — substrate now has TWO Layer-2 contracts with depth-2 (XlatePyListToVec PMAT-229, this PR)"

  citation_bridge_via_attribute:
    # PMAT-136: Bronze-tier refinement theorem locks in byte-for-byte
    # contract_id + equation_name preservation in @[xpile_contract,
    # xpile_equation] attribute payload (no dash-to-underscore
    # mangling, no case folding).
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.citation_bridge_via_attribute"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-148: Kani harness mirrors the Lean theorem.
    kani_harness: "citation_bridge_via_attribute"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      ∀ theorem T emitted from contract C :
        ∃ attr ∈ attributes_of(T) :
          attr.name == "xpile_contract" ∧
          attr.args[0] == C.metadata.id (verbatim — no dash->underscore mangling)
    domain: |
      Every Lean theorem rendered by xpile-lean-contract-backend.
      Revised post-2026-05-15 audit (audit-design.md §4 "Citation Bridge
      Fragility") to use Lean attributes parseable by the elaborator,
      rather than namespace-string conventions parseable only by regex.
    invariants:
      - "the @[xpile_contract] attribute is parsed by Lean's elaborator at compile time — malformed citation fails the build, not silently"
      - "contract ID is preserved VERBATIM (dashes intact); no dash-to-underscore mangling"
      - "the attribute is recoverable via Lean.Meta API (`Lean.getDecl`, `Lean.Attribute.find?`) — no regex needed"
      - "no two distinct contracts produce theorems whose attribute carries the same (contract_id, equation_name) tuple"
    preconditions:
      - "the emitted Lean file imports XpileContracts.Attr (vendored by xpile-lean-contract-backend)"
      - "Contract.metadata.id matches /^C-[A-Z0-9-]+$/"
      - "the backend was invoked with a contract whose equations have unique names (the (contract_id, equation_name) tuple is the citation key)"
    postconditions:
      - "every emitted theorem carries `@[xpile_contract \"<C.id>\", xpile_equation \"<eq_name>\"]` immediately preceding the `theorem` keyword"
      - "the contract ID is preserved VERBATIM in attribute arg 0: dashes intact, no dash-to-underscore mangling, no case folding"
      - "the attribute is recoverable via `Lean.Meta.getAttribute? declName \"xpile_contract\"` — auditor uses the Lean API, not regex"
      - "no two distinct contracts produce theorems whose (xpile_contract, xpile_equation) attribute tuple collides (citation key is globally unique)"
      - "if Contract.metadata.id violates `^C-[A-Z0-9-]+$/`, lifting fails with a structured error before any Lean is written"

  attribute_source_location_preserved_silver:
    # PMAT-179: Silver-tier promotion of citation_bridge_via_attribute.
    # Bronze had contract_id + equation_name; Silver adds
    # source_location as a separate structural field for audit
    # traceability. Captures the "<file>:<line>" requirement at
    # the type level — Bronze couldn't model where in Lean source
    # the cited declaration appeared.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.attribute_source_location_preserved_silver"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      emit_attribute(cid, eq_name, src_loc).source_location == src_loc
    domain: |
      Same as citation_bridge_via_attribute.
    invariants:
      - "source_location preserved as separate structural field in the attribute payload"
      - "audit traceability: a downstream tool seeing @[xpile_contract] can recover the source location via Lean.Meta API"
    preconditions:
      - "the source location string follows `<file>:<line>` format"
    postconditions:
      - "an emitter that drops source_location to save attribute-payload size would falsify this — caught at the structural field level"

  frame_translation_is_textual:
    # PMAT-136: Bronze-tier refinement theorem locks in input-hash
    # bit-identity before/after lift() — cache-determinism guarantee.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.frame_translation_is_textual"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    # PMAT-148: Kani harness mirrors the Lean theorem.
    kani_harness: "frame_translation_is_textual"
    kani_file: "contracts/kani/xlate_rust_fn_to_lean_thm.rs"
    formula: |
      lift(rust_fn, C) does not mutate rust_fn's meta-HIR or contract C
    domain: |
      Any input to lift().
    invariants:
      - "module hash before == module hash after"
      - "contract YAML hash before == contract YAML hash after"
    preconditions:
      - "the lift() entry point receives `&Module` and `&Contract` (read-only borrows), not owned values"
      - "any internal buffers (Lean source string, attribute table) are allocated fresh per call — no caller-shared mutable state"
    postconditions:
      - "blake3-hash(module) before == blake3-hash(module) after lift() — bit-identical"
      - "blake3-hash(contract) before == blake3-hash(contract) after lift() — bit-identical"
      - "the same (module, contract) input pair produces byte-identical Lean output across calls (deterministic, no nondet-iteration over HashMap)"
      - "if lift() fails (e.g., malformed contract ID), neither input is mutated and no partial Lean file is left behind"

  produced_lean_source_preserved_silver:
    # PMAT-179: Silver-tier promotion of frame_translation_is_textual.
    # Bronze captured input-hash bit-identity; Silver adds a
    # produced_lean_source boolean tracking whether the lift call
    # actually emitted any Lean source. Captures the observable-
    # determinism claim that Bronze couldn't see (Bronze only
    # proved inputs unchanged; Silver also proves output-status
    # flag is preserved). Companion theorem
    # silver_module_hash_preserved.
    # COMPLETES Silver coverage on C-XLATE-RUST-FN-TO-LEAN-THM
    # (5/5) — THIRD contract at full Silver.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.produced_lean_source_preserved_silver"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      lift_frame_preserving(inputs).produced_lean_source == inputs.produced_lean_source
    domain: |
      Same as frame_translation_is_textual — any input to lift().
    invariants:
      - "produced_lean_source flag preserved through lift — captures observable-determinism Bronze couldn't see"
      - "module_hash preserved (companion theorem silver_module_hash_preserved)"
