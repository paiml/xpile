    postconditions:
      - "the produced-source flag is observably-deterministic: same inputs produce same flag value across calls"
      - "an emitter that silently elides the side-output marker (e.g., to skip Lean-file write on no-op calls) would falsify this"

  rust_fn_silver_struct_extensionality_diamond:
    # PMAT-336: THIRD Diamond on this contract — COMPLETES DEPTH-3
    # UNIVERSAL ACROSS ALL 12 CONTRACTS. SUBSTRATE MILESTONE: every
    # contract now has ≥3 distinct Diamond categories. NINTH
    # substrate-wide demonstration of structure-extensionality
    # pattern (after PMAT-311/329/330/331/332/333/334/335).
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.rust_fn_silver_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      RustFnSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq (all 5 fields)
        (b) record eq → field eq (name field shown; congruence on all)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two RustFnSilver records (name, generics, args, return_type,
      body : Array UInt8).
    invariants:
      - "THIRD Diamond category — COMPLETES DEPTH-3 UNIVERSAL ACROSS ALL 12 CONTRACTS"
      - "NINTH substrate-wide demonstration of structure-extensionality pattern"
      - "Substrate milestone: every contract has ≥3 distinct Diamond categories"
    preconditions:
      - "two RustFnSilver records"
    postconditions:
      - "DEPTH-3 UNIVERSAL achieved: 12 contracts at depth-3+"

  rust_fn_silver_body_size_diamond:
    # PMAT-344: FOURTH Diamond on this contract — COMPLETES DEPTH-4
    # UNIVERSAL ACROSS ALL 12 CONTRACTS. SUBSTRATE MILESTONE: every
    # contract now has ≥4 distinct Diamond categories.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.rust_fn_silver_body_size_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      RustFnSilver.body and .name Array.size structure:
        (a) body.size ≥ 0
        (b) body.size < body.size + 1
        (c) name.size ≥ 0
        (d) name.size < name.size + 1
    domain: |
      Any RustFnSilver record.
    invariants:
      - "FOURTH Diamond category — COMPLETES DEPTH-4 UNIVERSAL ACROSS ALL 12 CONTRACTS"
      - "Substrate milestone: every contract has ≥4 distinct Diamond categories"
    preconditions:
      - "one RustFnSilver record"
    postconditions:
      - "DEPTH-4 UNIVERSAL achieved: 12 contracts at depth-4+"

  lean_def_silver_struct_extensionality_diamond:
    # PMAT-352: FIFTH Diamond on this contract — BROADENS DEPTH-5
    # from 9 to 10 contracts. Pushes XlateRustFnToLeanThm (Layer 5)
    # from depth-4 to depth-5, making it the FOURTH Layer 5
    # contract at depth-5+. LEAN-DEF-SILVER STRUCTURE
    # EXTENSIONALITY: the 4-field LeanDefSilver record is
    # field-extensional. Eleventh substrate-wide demonstration of
    # the structure-extensionality pattern. Closes the Rust ↔ Lean
    # translation pair at the structure level (mirror of PMAT-336
    # which captured RustFnSilver).
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.lean_def_silver_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      LeanDefSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq (4 fields) → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two LeanDefSilver records with 4 fields (name, binders,
      return_type, body) — each Array UInt8 at Silver tier.
    invariants:
      - "FIFTH Diamond category on C-XLATE-RUST-FN-TO-LEAN-THM — BROADENS DEPTH-5 from 9 to 10 contracts"
      - "STRUCTURE EXTENSIONALITY — eleventh substrate-wide demonstration of this pattern"
      - "closes the Rust ↔ Lean translation pair at the structure level (mirror of PMAT-336 on RustFnSilver)"
    preconditions:
      - "two LeanDefSilver records (DecidableEq derived)"
    postconditions:
      - "an emitter that drops or adds fields to LeanDefSilver would falsify the structure"
      - "Diamond depth-5 broadened: 10 contracts at depth-5+ (4 Layer 5 contracts at depth-5)"

  lean_def_silver_body_size_diamond:
    # PMAT-365: SIXTH Diamond on this contract — COMPLETES DEPTH-6
    # UNIVERSAL ACROSS ALL 12 CONTRACTS. SUBSTRATE MILESTONE: every
    # contract now has ≥6 distinct Diamond categories. Pushes
    # XlateRustFnToLeanThm (Layer 5) from depth-5 to depth-6 — last
    # contract at depth-5 only. Parallel to PMAT-336 (depth-3
    # UNIVERSAL), PMAT-344 (depth-4 UNIVERSAL), and PMAT-354
    # (depth-5 UNIVERSAL). LEAN-DEF-SILVER BODY ARRAY.SIZE
    # STRUCTURE: mirrors PMAT-344 (RustFnSilver) on the Lean side —
    # closes Rust↔Lean Array.size invariant on both sides.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.lean_def_silver_body_size_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      LeanDefSilver.body and .name Array.size structure:
        (a) body.size >= 0
        (b) body.size < body.size + 1
        (c) name.size >= 0
        (d) name.size < name.size + 1
    domain: |
