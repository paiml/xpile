  contract_obligation_silver_struct_extensionality_diamond:
    # PMAT-374: SEVENTH Diamond on this contract — BROADENS DEPTH-7
    # substrate-wide. Pushes XlateRustFnToLeanThm (Layer 5) from
    # depth-6 to depth-7 as the fourth L5 contract at depth-7+.
    # CONTRACT-OBLIGATION-SILVER STRUCTURE EXTENSIONALITY: the
    # 3-field ContractObligationSilver input record (applies_to_all,
    # source_index, expansion_count) is field-extensional with
    # decidable equality. Twenty-sixth substrate-wide demonstration.
    lean_theorem: "XpileContracts.CXlateRustFnToLeanThm.contract_obligation_silver_struct_extensionality_diamond"
    lean_file: "contracts/lean/XlateRustFnToLeanThm.lean"
    formula: |
      ContractObligationSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq (applies_to_all, source_index, expansion_count) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
