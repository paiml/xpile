metadata:
  id: C-NOTATION-LATEX-MATH-TO-EQUATION
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Notation contract: how LaTeX source — math mode AND theorem-class
    environments — lowers to xpile contract YAML.

    Math mode (`$...$`, `\[...\]`, `equation`, `align`, `gather`) lowers
    to `equations:` entries. Theorem-class environments (`theorem`,
    `lemma`, `corollary`, `proposition`, `definition`, `remark`) lower
    to `proof_obligations:` entries. `\begin{proof}...\end{proof}`
    lowers to a Lean theorem pointer (the proof body itself lives in
    the Lean lane, not the contract YAML).

    Layer 2 of the xpile contract taxonomy (translation), proof-lane
    side. Consumed by `latex-contract-frontend`. Bidirectional partner
    is `xpile-latex-contract-backend`, which renders contracts back to
    publication-quality LaTeX.

    Foundational design decision (2026-05-15 #2): LaTeX support covers
    both math mode and theorem environments from the beginning, not
    math-mode-only.
  xpile:
    layer: translation
    lane: proof
  references:
    - "LaTeX: A Document Preparation System (Lamport, 2nd ed.) §3.3 (math)"
    - "amsthm package documentation (theorem environments)"
    - "KaTeX supported functions reference"
    - contracts/xpile-contract-frontend-trait-v1.yaml
    - docs/specifications/sub/contract-frontend-trait.md
  depends_on:
    - C-XPILE-CONTRACT-FRONTEND-TRAIT

equations:
  inline_math_to_equation:
    # PMAT-134: Bronze-tier refinement theorem locks in
    # byte-identity normalization of the inline math span.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.inline_math_to_equation"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem at byte level.
    kani_harness: "inline_math_to_equation"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse($formula$) ==
        EquationsBlock.equations[autogenerated_name] = Equation {
          formula: ascii_normalize(formula),
          domain: enclosing_paragraph_text or "",
          ...
        }
    domain: |
      Any `$...$` or `\(...\)` math span outside a theorem-class
      environment. The autogenerated name uses a snake_case rendering
      of the first 3-5 identifier tokens in the formula.
    invariants:
      - "no information loss — every TeX token round-trips through render()"
      - "autogenerated equation name is deterministic and collision-free"
      - "domain field captures surrounding paragraph for human context"
    preconditions:
      - "math span is well-formed (matching delimiters)"
      - "the math span is not embedded inside a LaTeX comment or verbatim block"
    postconditions:
      - "output `EquationsBlock.equations` gains exactly one entry per parsed math span"
      - "every output `formula` field is the ASCII-normalized form of the span's content"
      - "every autogenerated equation name is collision-free across the document (deterministic via snake_case of first 3-5 identifier tokens)"

  display_math_to_equation:
    # PMAT-057: Lean refinement theorem locks in the modelling
    # commitment that all three display-math forms produce the
    # same EquationFormula on the same input. See
    # contracts/lean/Notation.lean for the proof.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.display_math_eq_equation_env_eq_align_env"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-059: Kani harness completes the §14.4 quorum (Sem + Sym +
    # Ext = ≥3 strata). Symbolic counterpart to the Lean theorem —
    # proves the same three-way equivalence at the Rust level.
    kani_harness: "display_math_eq_equation_env_eq_align_env"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(\[ formula \])
        == parse(\begin{equation} formula \end{equation})
        == parse(\begin{align} formula \end{align})
    domain: |
      Any display-math environment producing one or more equations.
      `align` and `gather` may produce multiple `equations:` entries
      keyed off `\\` line breaks and `&` alignment columns.
    invariants:
      - "align/gather: N rows produce N equation entries"
      - "row labels (\\tag, \\label) preserved as equation metadata"
      - "blank rows skipped, not lowered as empty equations"
    preconditions:
      - "input LaTeX source has matching display-math delimiters (well-formed `\\[ ... \\]` or balanced `\\begin{env}` / `\\end{env}` pair)"
      - "the display-math environment is not embedded inside a LaTeX comment (`% ... \\n`) or a verbatim block"
    postconditions:
      - "output `EquationsBlock.equations` contains at least one entry per non-empty display-math source span"
      - "every output `formula` field is the ASCII-normalized form of the source's inner content (per the Bronze-tier model in PMAT-057 / PMAT-059)"
      - "all three display-math forms (`\\[ ... \\]`, `equation`, `align`) produce structurally-equal `EquationFormula` values on the same `formula` input (locked in by `display_math_eq_equation_env_eq_align_env` in contracts/lean/Notation.lean)"

  display_math_equiv_under_normaliser_silver:
    # PMAT-167: Silver-tier refinement upgrade. The Bronze theorem
    # display_math_eq_equation_env_eq_align_env above proves all
    # three display-math forms produce STRUCTURALLY-EQUAL
    # EquationFormula values by *anonymising* the source kind. The
    # Silver model retains the source kind as a discriminator
    # (LatexDisplayKind: displayMath | equation | align) and proves
    # equivalence under a normaliser instead. Strictly stronger:
    # catches emitters that silently relabel one form as another.
    # Fourth multi-eq contract Silver upgrade (after PMAT-164,
    # PMAT-165, PMAT-166) and the first on the notation lane.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.display_math_equiv_under_normaliser_silver"
    lean_file: "contracts/lean/Notation.lean"
    formula: |
      normalise(lower_display_math_silver f)
        == normalise(lower_equation_env_silver f)
        == normalise(lower_align_env_silver f)
      ∧ kinds(displayMath, equation, align) are distinct
    domain: |
      Same as `display_math_to_equation` — any well-formed
      display-math environment. The Silver upgrade narrows the
      modelling from "structural anonymisation" to "kind-tagged
      retention with normaliser-mediated equivalence".
    invariants:
      - "the source environment kind is recorded as a discriminator field in the emitted EquationFormulaSilver value (DisplayMath | Equation | Align)"
      - "the three kinds are pairwise distinct in the typed model (a downstream tool seeing `display_kind: align` can trust the source was \\begin{align})"
      - "normalised content of the three forms is equal on the same formula input — equivalence is recovered under the normaliser, not at the structural level"
    preconditions:
      - "same as `display_math_to_equation` — well-formed delimiters, not inside a LaTeX comment"
      - "the Silver model assumes the formula content fits in a single normalised string at this tier (Gold tier introduces a typed math-expression AST)"
    postconditions:
      - "every emitted EquationFormulaSilver carries an audit-traceable kind field matching its source environment"
      - "kind retention enables falsification of an emitter that quietly relabels `\\[ ... \\]` as `align` (or vice versa) — a transformation Bronze could not detect"

  theorem_env_to_obligation:
    # PMAT-134: Bronze-tier refinement theorem locks in the
    # precondition-flag → obligation-type polarity mapping.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.theorem_env_to_obligation"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem.
    kani_harness: "theorem_env_to_obligation"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(\begin{theorem}[label] ... \end{theorem})
        == EquationsBlock.proof_obligations += [{
          type: postcondition,
          property: stripped_text,
          formal: extracted_math_or_TBD,
          applies_to: resolve_label_to_equation_name(label),
        }]
    domain: |
      Any `theorem`, `lemma`, `corollary`, `proposition`, `claim`
      environment. The optional `[label]` argument (from amsthm) names
      the obligation; the body is the human-readable statement; embedded
      math spans become the `formal:` field.
    invariants:
      - "theorem environment ALWAYS produces obligation type 'postcondition' unless preceded by \\textbf{Precondition:}"
      - "label argument maps 1:1 to an equation name in the same document"
      - "embedded math is extracted as `formal:`; surrounding prose is `property:`"
    preconditions:
      - "the theorem environment is registered (via \\newtheorem) or matches one of the standard names"
      - "the theorem environment is not nested inside another theorem-class environment"
    postconditions:
      - "output `EquationsBlock.proof_obligations` gains exactly one entry per theorem-class environment in source order"
      - "each entry's `type` field is `postcondition` (default) unless the body is preceded by `\\textbf{Precondition:}`"
      - "the `[label]` argument, when present, becomes the obligation's `applies_to` field after `resolve_label_to_equation_name` resolution"

  proof_env_to_lean_pointer:
    # PMAT-134: Bronze-tier refinement theorem locks in
    # stub/claimed classification AND the body-never-leaks
    # lane-separation invariant.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.proof_env_to_lean_pointer"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem.
    kani_harness: "proof_env_to_lean_pointer"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(\begin{proof} ... \end{proof})
        == metadata.lean_pointer = {
          target: nearest_preceding_theorem_label,
          location: "lean/<file>.lean",
          status: "stub" if body matches "(omitted|TODO|XXX|sorry)" else "claimed",
        }
    domain: |
      Any `\begin{proof}...\end{proof}` environment. The body of the
      proof is NOT translated to YAML — it goes to the Lean lane via
      `xlate-rust-fn-to-lean-thm` or hand-authored Lean. The contract
      YAML only carries a pointer.
    invariants:
      - "proof body text never appears in EquationsBlock"
      - "lean_pointer references the *nearest preceding* theorem-class environment"
      - "status accurately classifies stub vs claimed (regex on body)"
    preconditions:
      - "the preceding theorem-class environment exists within the same section"
      - "the `\\begin{proof}...\\end{proof}` environment is well-formed (balanced begin/end)"
    postconditions:
      - "output `metadata.lean_pointer.target` matches the *nearest preceding* theorem-class environment's label"
      - "output `metadata.lean_pointer.status` is `\"stub\"` if the body matches /omitted|TODO|XXX|sorry/i, else `\"claimed\"`"
      - "the proof body text never appears in `EquationsBlock` — it stays in the Lean lane only"

  definition_env_to_equation:
    # PMAT-134: Bronze-tier refinement theorem locks in
    # byte-identity extraction of the first math span.
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.definition_env_to_equation"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem.
    kani_harness: "definition_env_to_equation"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(\begin{definition}[label] ... \end{definition})
        == EquationsBlock.equations[label] = Equation {
          formula: extracted_math,
          domain: stripped_text,
          ...
        }
    domain: |
      Any `\begin{definition}` environment. Definitions are treated as
      equations (mathematical objects being introduced), not as proof
      obligations.
    invariants:
      - "definition body's first math span is the equation's `formula:`"
      - "definition label, if present, names the equation"
    preconditions:
      - "the `\\begin{definition}...\\end{definition}` environment is well-formed (balanced begin/end)"
      - "the definition body contains at least one math span (to be extracted as `formula`)"
    postconditions:
      - "output `EquationsBlock.equations` gains exactly one entry per `\\begin{definition}` in source order"
      - "the entry's key is the definition's `[label]` argument when present, otherwise an autogenerated snake_case name"
      - "the entry's `formula` field is the first math span extracted from the definition body"

  remark_env_to_falsification:
    # PMAT-134: Bronze-tier refinement theorem locks in the
    # RFC-2119 keyword → ship_blocking decision table
    # (MUST NOT > MUST > SHOULD precedence).
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.remark_env_to_falsification"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem.
    kani_harness: "remark_env_to_falsification"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(\begin{remark} ... \end{remark} when body matches /(MUST|SHALL|MUST NOT)/i)
        == EquationsBlock.falsification_tests += [{
          rule: stripped_text,
          ship_blocking: extracted_from("blocking|advisory"),
          ...
        }]
    domain: |
      Remarks containing normative (RFC 2119 style) language are lifted
      as falsification tests. Remarks without normative language are
      preserved as plain commentary in the equation's `notes:` field.
    invariants:
      - "MUST/SHALL → ship_blocking: true"
      - "SHOULD → ship_blocking: false"
      - "MUST NOT/SHALL NOT → ship_blocking: true with inverted predicate"
    preconditions:
      - "the `\\begin{remark}...\\end{remark}` environment is well-formed (balanced begin/end)"
      - "the remark body is non-empty (after stripping whitespace)"
    postconditions:
      - "output `EquationsBlock.falsification_tests` gains an entry iff the body contains normative language matching `/(MUST|SHALL|MUST NOT|SHALL NOT|SHOULD)/i`"
      - "the entry's `ship_blocking` field follows the MUST/SHALL→true, SHOULD→false, MUST NOT/SHALL NOT→true-with-inverted-predicate mapping"
      - "remarks without normative language preserve their text in the enclosing equation's `notes:` field (no falsification entry)"

  citation_preservation:
    # PMAT-134: Bronze-tier refinement theorem locks in
    # byte-for-byte contract-ID preservation across the
    # LaTeX→YAML lowering (companion to citation_in_emitted_rust
    # in XlateLeanToRust.lean, PMAT-133).
    lean_theorem: "XpileContracts.CNotationLatexMathToEquation.citation_preservation"
    lean_file: "contracts/lean/Notation.lean"
    # PMAT-150: Kani harness mirrors the Lean theorem.
    kani_harness: "citation_preservation"
    kani_file: "contracts/kani/notation.rs"
    formula: |
      parse(LaTeX containing \cite{C-X} or \href{...}{C-X})
        == EquationsBlock.citations includes ContractId("C-X")
    domain: |
      Any LaTeX source that textually references another xpile contract
      via `\cite{}`, `\href`, `\url`, or a comment of the form
      `% xpile-cite: C-X`.
    invariants:
      - "ALL citation forms are recognized (BibTeX-style, hyperref-style, comment-style)"
      - "duplicate citations dedupe to a single entry"
      - "unknown citation keys (not matching xpile contract ID regex) are reported as warnings, not errors"
    preconditions:
      - "the input LaTeX source contains at least one `\\cite{}`, `\\href{}`, `\\url{}`, or `% xpile-cite: ...` construct"
      - "every cited identifier matches the xpile contract ID regex `/^C-[A-Z0-9-]+$/`"
    postconditions:
      - "output `EquationsBlock.citations` contains every ContractId textually present in the source (no drops)"
      - "duplicate citations in the source dedupe to a single entry in the output (set semantics)"
      - "unknown citation keys (not matching the contract ID regex) emit `pv lint` warnings but do NOT cause parse failure"

proof_obligations:
  - type: postcondition
    property: math-mode round-trips through render() losslessly
    formal: "∀ s ∈ math_spans : render(parse(s)) ≡_LaTeX s"
    applies_to: inline_math_to_equation

  - type: postcondition
    property: align environment produces N entries from N rows
    formal: "rows(align_env) == |equations entries| + |empty rows skipped|"
    applies_to: display_math_to_equation

  - type: postcondition
    property: theorem environments lower to typed obligations
    formal: "∀ thm ∈ theorem_envs : obligation_for(thm).type ∈ {postcondition, precondition}"
    applies_to: theorem_env_to_obligation

  - type: postcondition
    property: proof bodies are NOT serialized in YAML
    formal: "∀ p ∈ proof_envs : body(p) ∉ EquationsBlock"
    applies_to: proof_env_to_lean_pointer

  - type: invariant
    property: citations are preserved across formats
    formal: "∀ c ∈ tex.citations : c ∈ output.citations"
    applies_to: citation_preservation

  - type: frame
    property: parse() does not mutate its input string
    formal: "modifies() == ∅"
    applies_to: all

  - type: bound
    property: emitted YAML size is within 5× the LaTeX input size
    formal: "len(yaml_output) ≤ 5 * len(latex_input)"
    applies_to: all

falsification_tests:
  - id: FALSIFY-NOTATION-LATEX-001
    rule: |
      `$x + y = z$` and `\(x + y = z\)` MUST produce equivalent
      equation entries (delimiter style is not semantic).
    prediction: |
      parse("Let $x + y = z$.") and parse("Let \(x + y = z\).") yield
      the same `equations:` map.
    test: |
      cargo test -p latex-contract-frontend --test inline_math_delimiter_equiv
    if_fails: |
      Parser is delimiter-sensitive — author has to pick one style.
    ship_blocking: true
    counter_example_classes:
      - delimiter_specific_parser

  - id: FALSIFY-NOTATION-LATEX-002
    rule: |
      `\begin{align}` rows separated by `\\` MUST produce one
      equation entry per non-empty row.
    prediction: |
      A 3-row align env produces 3 equations entries (assuming no
      blank rows).
    test: |
      cargo test -p latex-contract-frontend --test align_rows_to_equations
    if_fails: |
      Multi-row math collapsed into a single equation — author loses
      per-row granularity (and per-row falsification testing).
    ship_blocking: true
    counter_example_classes:
      - collapsed_align
      - missed_separator

  - id: FALSIFY-NOTATION-LATEX-003
    rule: |
      `\begin{theorem}` MUST produce a `proof_obligations:` entry,
      NOT an `equations:` entry.
    prediction: |
      A document with one theorem environment and zero math spans
      yields `len(equations) == 0` and `len(proof_obligations) == 1`.
    test: |
      cargo test -p latex-contract-frontend --test theorem_env_is_obligation
    if_fails: |
      Theorems treated as equations — contract structure broken.
    ship_blocking: true
    counter_example_classes:
      - theorem_misclassified
      - merged_with_equations

  - id: FALSIFY-NOTATION-LATEX-004
    rule: |
      `\begin{proof}` body text MUST NOT appear in EquationsBlock.
    prediction: |
      The string content between `\begin{proof}` and `\end{proof}`
      cannot be substring-matched in serialized YAML.
    test: |
      cargo test -p latex-contract-frontend --test proof_body_not_serialized
    if_fails: |
      Proof prose leaks into contract YAML; cross-format provenance
      breaks; Lean lane and YAML lane diverge.
    ship_blocking: true
    counter_example_classes:
      - proof_text_inlined
      - mistaken_remark_lift

  - id: FALSIFY-NOTATION-LATEX-005
    rule: |
      `\cite{C-X-Y}` MUST preserve C-X-Y in citations.
    prediction: |
      `parse("see \cite{C-XLATE-PY-LIST-TO-VEC}").citations` contains
      `ContractId("C-XLATE-PY-LIST-TO-VEC")`.
    test: |
      cargo test -p latex-contract-frontend --test cite_preserved
    if_fails: |
      Citation bridge broken on the LaTeX side — audit chain incomplete.
    ship_blocking: true
    counter_example_classes:
      - cite_dropped
      - cite_mangled

  - id: FALSIFY-NOTATION-LATEX-006
    rule: |
      A remark containing "MUST" lowers to a falsification test with
      `ship_blocking: true`.
    prediction: |
      `\begin{remark}Output MUST be sorted.\end{remark}` →
      falsification_tests entry with ship_blocking: true.
    test: |
      cargo test -p latex-contract-frontend --test remark_must_is_blocking
    if_fails: |
      Normative language not recognized — important constraints lost.
    ship_blocking: false
    counter_example_classes:
      - keyword_miss
      - severity_swap

  - id: FALSIFY-NOTATION-LATEX-007
    rule: |
      parse() must be referentially transparent on its input.
    prediction: |
      hash(input_str) before == hash(input_str) after parse().
    test: |
      cargo test -p latex-contract-frontend --test parse_no_mutation
    if_fails: |
      Parser holds shared mutable state — multi-doc invocations corrupt.
    ship_blocking: true
    counter_example_classes:
      - shared_mut_state

kani_harnesses:
  - id: KANI-NOTATION-LATEX-001
    obligation: frame
    bound: 32
    property: |
      For any ASCII input ≤ 32 bytes, parse_inline_math() does not
      mutate its input.
    harness: |
      #[kani::proof]
      fn parse_does_not_mutate() {
          let input: [u8; 32] = kani::any();
          kani::assume(input.iter().all(|c| c.is_ascii()));
          let owned = input.to_vec();
          let snapshot = owned.clone();
          let _ = parse_inline_math(std::str::from_utf8(&owned).unwrap_or(""));
          assert_eq!(owned, snapshot);
      }

  - id: KANI-NOTATION-LATEX-002
    obligation: invariant
    bound: 4
    property: |
      For up to 4 `\cite{...}` calls in a bounded input, citations
      preserve every ID textually present in the source.
    harness: |
      #[kani::proof]
      fn cites_are_preserved() {
          let n_cites: usize = kani::any();
          kani::assume(n_cites <= 4);
          let ids: [ContractId; 4] = kani::any();
          let tex = build_doc_with_cites(&ids[..n_cites]);
          let parsed = parse_latex(&tex);
          for i in 0..n_cites {
              assert!(parsed.citations.contains(&ids[i]));
          }
      }

qa_gate:
  id: QA-NOTATION-LATEX-MATH-TO-EQUATION
  name: "LaTeX math/theorem environments → xpile contract YAML"
  min_coverage: 0.50
  max_complexity: 20
  required_tests:
    - every_referenced_lean_theorem_exists_in_its_file
    - every_referenced_kani_harness_exists_in_its_file
