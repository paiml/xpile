  equation_formula_ascii_length_nat_diamond:
    # PMAT-350: FIFTH Diamond on this contract — BROADENS DEPTH-5
    # from 7 to 8 contracts. Pushes NotationLatexMathToEquation
    # (Layer 5) from depth-4 to depth-5, adding a SECOND Layer 5
