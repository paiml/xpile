metadata:
  id: C-XPILE-CONTRACT-FRONTEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile ContractFrontend trait
    must satisfy. ContractFrontend is the proof-lane sibling of Frontend:
    it parses notation (LaTeX, Lean theorem text, mdBook) into contract
    equation YAML. Where Frontend produces meta-HIR for the code lane,
    ContractFrontend produces an EquationsBlock for the contract substrate.

    Layer 3 of the contract taxonomy (architectural / xpile-internal),
    proof-lane.
  references:
    - docs/specifications/sub/contract-frontend-trait.md
    - docs/specifications/sub/contract-taxonomy.md
    - contracts/xpile-frontend-trait-v1.yaml
  depends_on:
    - C-XPILE-FRONTEND-TRAIT

equations:
  format_ownership:
    formula: |
      forall fmt in registered_formats: exists exactly one cf: fmt in cf.formats()
    domain: |
      registered_formats is the union of formats() across all
      ContractFrontend implementations registered with a TranspileSession.
    invariants:
      - "no two contract frontends declare the same ContractFormat variant"
      - "every dispatched format reaches exactly one parse_to_equations call"
    preconditions:
      - "TranspileSession::register_contract_frontend has been called for every active impl"

  parse_idempotency:
    # PMAT-066: Lean refinement theorem locks in the determinism
    # modelling commitment for parse_to_equations. See
    # contracts/lean/XpileContractFrontendTrait.lean for the
    # proof. Pairs with PMAT-062 to close both code-lane and
    # proof-lane parse determinism.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.parse_idempotency"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    # PMAT-067: Kani harness completes the §14.4 quorum. Symbolic
    # counterpart to the Lean theorem — proves determinism over
    # all 4-byte symbolic sources.
    kani_harness: "parse_idempotency"
    kani_file: "contracts/kani/xpile_contract_frontend_trait.rs"
    formula: |
      forall source: hash(cf.parse_to_equations(source).unwrap()) == hash(cf.parse_to_equations(source).unwrap())
    domain: |
      Two parses of the same source string yield identical EquationsBlock
      when run in the same process with no intervening mutation of cf.
    invariants:
      - "ContractFrontend impls hold no mutable state across parse calls"
      - "EquationsBlock serialization is canonical (BTreeMap-ordered, no HashMap)"
      - "autogenerated equation names (from anonymous math spans) are deterministic"
    preconditions:
      - "source is valid UTF-8"

  equations_only:
    # PMAT-158 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-001: Silver-tier
    # refinement theorem. Introduces TranspileSession with disjoint
    # modules + equations storage. Proves parse_to_equations leaves
    # the modules array unchanged at the type level.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.equations_only_silver"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    # PMAT-284: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat. Different pattern from PMAT-275..283
    # — instead of per-field equality, this is FRAME PRESERVATION
    # (parse_to_equations must leave the modules side unchanged).
    # Bronze byte-payload model couldn't catch a ContractFrontend
    # that creates meta-HIR Modules on the side; Silver TranspileSession
    # shape makes the frame invariant explicit. Companion harness
    # equations_advance_silver characterizes what DOES change.
    kani_harness: "equations_only_silver"
    kani_file: "contracts/kani/xpile_contract_frontend_trait.rs"
    formula: |
      forall cf, source: cf.parse_to_equations(source) produces no xpile_meta_hir::Module
        and does not mutate any Module reachable from the call site
    domain: |
      ContractFrontend operates exclusively on the proof lane. The code
      lane (Frontend → meta-HIR) is a separate dispatch path.
    invariants:
      - "no Module is created or mutated by ContractFrontend"
      - "EquationsBlock and Module remain in disjoint storage in TranspileSession"
      - "a single source file (e.g., .lean) may be parsed by BOTH a Frontend and a ContractFrontend; both must succeed independently"
    preconditions: []

  frame_safe_transition_gold:
    # PMAT-196 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-002: ELEVENTH
    # Gold-tier refinement in the substrate. Demonstrates FIFTH
    # Gold pattern variant: frame-safe transition refinement —
    # FrameSafeTransition := { p : Session × Session //
    # p.fst.modules = p.snd.modules } — encodes frame-preservation
    # at the type level. Distinct from cross-field equality
    # (PMAT-194/195) because both sides are the SAME type and
    # the preserved field has the SAME name (before/after
    # invariant rather than across-domain). Load-bearing for
    # modifies()/frame invariants in separation-logic style.
    # Companion theorems frame_safety_witness_gold and
    # gold_contract_frontend_agrees_with_silver.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.frame_safe_transition_gold"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      parse_to_equations_gold(session, source).before.modules
        == parse_to_equations_gold(session, source).after.modules
      BY TYPE  (frame witness travels with the pair)
    domain: |
      Same as equations_only — every ContractFrontend impl. The
      Gold upgrade encodes the frame-preservation invariant at
      the type level via a before/after-pair refinement subtype.
    invariants:
      - "FrameSafeTransition pairs before/after TranspileSession under a TYPE-LEVEL proof that modules is preserved"
      - "frame-safety witness travels with the pair through extraction — no per-call-site re-proof needed"
      - "fifth Gold pattern variant: frame-safety refinement (before.field = after.field for same-type sides)"
      - "distinct from cross-field equality (PMAT-194/195) — here both sides are the SAME type, the field name is SAME, and the proof is a frame invariant rather than an across-domain consistency claim"
    preconditions:
      - "the ContractFrontend impl is well-formed (Silver model preconditions inherited)"
    postconditions:
      - "an emitter returning a (before, after) pair where modules differ would not type-check against parse_to_equations_gold"
      - "this pattern is the building block for `modifies()` frame conditions throughout the codebase"

  frame_safety_transitive_platinum:
    # PMAT-203 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-003: FIFTH
    # Platinum-tier refinement in the substrate. Demonstrates
    # the FIFTH distinct Platinum algebraic shape: transitivity
    # / chain-rule. Distinct from PMAT-199 commutativity,
    # PMAT-200 associativity, PMAT-201 idempotence, PMAT-202
    # functoriality. Frame-safety (PMAT-196's FrameSafeTransition)
    # captures modifies()-style invariants per call; PMAT-203
    # proves this invariant COMPOSES across sequenced calls —
    # the classic chain-rule for Hoare-style frame conditions.
    # Companion theorems frame_safety_reflexive_platinum
    # (reflexivity → equivalence-like structure) and
    # frame_safety_chain_parse_platinum (compositional structure
    # under chained source-parsing).
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.frame_safety_transitive_platinum"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      ∀ t1, t2 : FrameSafeTransition,
        t1.after = t2.before ⟹
          t1.before.modules = t2.after.modules
      (transitivity / chain-rule of frame-safety)
    domain: |
      Any two FrameSafeTransition values whose intermediate
      states match (t1.after = t2.before). The Platinum upgrade
      captures the chain-rule for frame conditions at the type
      level.
    invariants:
      - "FIFTH Platinum algebraic shape: transitivity / chain-rule"
      - "frame-safety is reflexive (companion theorem) + transitive + symmetric → equivalence-like structure over sessions"
      - "load-bearing for sequenced emitter pipelines: composing N parse_to_equations operations preserves the frame invariant overall, not just per-step"
      - "captures the classic separation-logic composition law: safe(a,b) ∧ safe(b,c) ⟹ safe(a,c)"
    preconditions:
      - "two FrameSafeTransition values exist with t1.after = t2.before (the chaining precondition)"
      - "frame-safety reflexivity is unconditional (companion theorem frame_safety_reflexive_platinum)"
    postconditions:
      - "the COMPOSED transition is frame-safe — the modules field is preserved from t1.before to t2.after"
      - "this enables emitter implementations to compose frame-safe operations into pipelines without re-verifying the frame condition at each step"

  modules_equivalence_relation_diamond:
    # PMAT-217 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-004: FOURTH
    # Diamond-tier refinement. Combines PMAT-203 transitivity +
    # reflexivity + symmetry into the EQUIVALENCE RELATION
    # axiomatization for modules_equiv on TranspileSession.
    # Distinct from prior Diamond axiomatizations (commutative-
    # monoid PMAT-214, pure-function PMAT-215, abelian-group
    # PMAT-216) — this is the RELATIONAL algebraic structure.
    # Companion theorem parse_preserves_equivalence_class_diamond
    # connects the Diamond to the contract's primary operation.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.modules_equivalence_relation_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      modules_equiv s1 s2 := s1.modules = s2.modules
      forms an EQUIVALENCE RELATION:
        (a) reflexivity: modules_equiv s s
        (b) symmetry: modules_equiv s1 s2 → modules_equiv s2 s1
        (c) transitivity: modules_equiv s1 s2 → modules_equiv s2 s3 → modules_equiv s1 s3
    domain: |
      Any TranspileSession values under the modules_equiv
      relation. The Diamond upgrade captures the FULL
      equivalence-relation axiomatization.
    invariants:
      - "FOURTH Diamond-tier theorem; combines PMAT-203 transitivity + reflexivity + symmetry"
      - "modules_equiv is a proper EQUIVALENCE RELATION → can be quotiented to form equivalence classes"
      - "RELATIONAL algebraic structure, distinct from PMAT-214 algebraic, PMAT-215 functional, PMAT-216 group-theoretic"
      - "companion theorem parse_preserves_equivalence_class_diamond proves parse_to_equations is INVARIANT-PRESERVING under the equivalence"
    preconditions:
      - "three well-formed TranspileSession values"
      - "no special preconditions — equivalence relation axioms hold universally"
    postconditions:
      - "an emitter satisfying transitivity (PMAT-203) but failing symmetry (e.g., directional refinement rather than true equivalence) would falsify this Diamond"
      - "Diamond axiomatizes modules-preservation as a proper algebraic equivalence on sessions — load-bearing for quotient-based reasoning about session state"

  parse_preserves_equivalence_class_diamond:
    # PMAT-250 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-005: SECOND
    # Diamond wired equation on this contract — closes the
    # depth-2 gap the PMAT-249 `xpile diamond` reporter revealed.
    # The companion theorem was already defined in Lean at
    # PMAT-217 but had not been wired as a separate YAML
    # equation. This PR completes UNIVERSAL Diamond depth-2
    # across ALL 12 contracts at the YAML-equation level.
    # Captures the FUNCTORIAL preservation of equivalence
    # classes under parse_to_equations — distinct algebraic
    # category from PMAT-217's equivalence-relation Diamond.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.parse_preserves_equivalence_class_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      parse_to_equations is INVARIANT-PRESERVING under
      modules_equiv:
        s1 ≡_modules s2 ⇒ parse(s1).equations ≡ parse(s2).equations
      (functorial preservation of equivalence classes)
    domain: |
      TranspileSession pairs related by modules_equiv. The
      Diamond captures FUNCTORIAL preservation of the
      equivalence relation through parse_to_equations.
    invariants:
      - "SECOND wired Diamond on C-XPILE-CONTRACT-FRONTEND-TRAIT"
      - "distinct algebraic category from PMAT-217 equivalence-relation (RELATIONAL vs FUNCTORIAL preservation)"
      - "captures the functor parse_to_equations preserving the modules_equiv equivalence relation"
    preconditions:
      - "two well-formed TranspileSession values related by modules_equiv"
    postconditions:
      - "an emitter that introduces session-instance-specific differences during parse would falsify this Diamond"
      - "C-XPILE-CONTRACT-FRONTEND-TRAIT reaches depth-2 at the YAML-equation level — 2 distinct Diamond categories on THIS contract"

  citation_preservation:
    formula: |
      forall cf, source: contract_ids_textually_in(source) subset EquationsBlock.citations
    domain: |
      Every ContractId that textually appears in source (via \cite{},
      \href, % xpile-cite:, or a Lean -- C-X comment) must be carried
      forward into the EquationsBlock's citations field.
    invariants:
      - "no citation textually present in source is dropped"
      - "duplicate citations dedupe to a single entry"
      - "citation form (BibTeX, hyperref, comment) is normalized but the ID itself is preserved verbatim"
    preconditions:
      - "ContractId regex is fixed: /^C-[A-Z0-9-]+$/"

  transpile_session_struct_extensionality_diamond:
    # PMAT-332: THIRD Diamond on this contract — BROADENS DEPTH-3
    # from 7 to 8 contracts. Pushes XpileContractFrontendTrait
    # (Layer 3) from depth-2 to depth-3, adding a THIRD Layer 3
    # contract at depth-3. TranspileSession STRUCTURE EXTENSIONALITY:
    # record type is field-extensional with decidable equality.
    # Fifth substrate-wide demonstration of this pattern (after
    # PMAT-311 BoundedSmem, PMAT-329 OutcomeSilver, PMAT-330
    # MetaHirModuleSilver, PMAT-331 ArtifactSilver).
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.transpile_session_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      TranspileSession admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two TranspileSession records (modules : Array MetaHirModule,
      equations : Array EquationsBlock). The four properties
      together axiomatize the record-type structure.
    invariants:
      - "THIRD Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-3 from 7 to 8 contracts"
      - "FIFTH substrate-wide demonstration of structure-extensionality pattern"
      - "distinct from PMAT-217 equivalence-relation and PMAT-250 congruence — captures RECORD TYPE structure"
    preconditions:
      - "two TranspileSession records (with derived DecidableEq)"
    postconditions:
      - "an emitter introducing phantom fields or stripping fields would falsify (a)"
      - "Diamond depth-3 broadened: 8 contracts at depth-3+"

  transpile_session_array_size_diamond:
    # PMAT-340: FOURTH Diamond on this contract — BROADENS DEPTH-4
    # from 7 to 8 contracts. Pushes XpileContractFrontendTrait
    # (Layer 3) from depth-3 to depth-4, adding THIRD Layer 3
    # contract at depth-4. TRANSPILE-SESSION ARRAY SIZE STRUCTURE.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.transpile_session_array_size_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      TranspileSession.modules and .equations Array.size structure:
        (a) modules.size ≥ 0 (Nat non-negative)
        (b) Empty session has size-0 modules
        (c) Field-replacement preserves modules size
        (d) modules and equations fields independent
    domain: |
      Any TranspileSession record.
    invariants:
      - "FOURTH Diamond category — BROADENS DEPTH-4 from 7 to 8 contracts"
      - "Captures FIELD-VALUE SIZE PROPERTIES — distinct from equivalence, congruence, record structure"
    preconditions:
      - "one TranspileSession record"
    postconditions:
      - "Diamond depth-4 broadened: 8 contracts at depth-4+"

  equations_block_struct_extensionality_diamond:
    # PMAT-353: FIFTH Diamond on this contract — BROADENS DEPTH-5
    # from 10 to 11 contracts. Pushes XpileContractFrontendTrait
    # (Layer 3) from depth-4 to depth-5, adding a THIRD Layer 3
    # contract at depth-5. EQUATIONS-BLOCK STRUCTURE EXTENSIONALITY:
    # the inner EquationsBlock record (bytes : Array UInt8) is
    # field-extensional with decidable equality. Twelfth substrate-
    # wide demonstration of the structure-extensionality pattern.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.equations_block_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      EquationsBlock admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two EquationsBlock records (bytes : Array UInt8) — the INNER
      record stored inside TranspileSession.equations.
    invariants:
      - "FIFTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-5 from 10 to 11 contracts"
      - "STRUCTURE EXTENSIONALITY — twelfth substrate-wide demonstration of this pattern"
      - "distinct from PMAT-332 (outer TranspileSession record) — captures the INNER EquationsBlock structure"
    preconditions:
      - "two EquationsBlock records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-5 broadened: 11 contracts at depth-5+ (3 Layer 3 contracts at depth-5)"

  metahir_module_struct_extensionality_diamond:
    # PMAT-361: SIXTH Diamond on this contract — BROADENS DEPTH-6
    # post-ALL 5 LAYERS milestone. After PMAT-358 completed depth-6
    # ACROSS ALL 5 TAXONOMY LAYERS, PMAT-361 pushes
    # XpileContractFrontendTrait (Layer 3) from depth-5 to depth-6.
    # METAHIR-MODULE (Bronze) STRUCTURE EXTENSIONALITY: the inner
    # MetaHirModule record (bytes : Array UInt8) is field-extensional.
    # Seventeenth substrate-wide demonstration of the structure-
    # extensionality pattern, complementing PMAT-353
    # (EquationsBlock inner-equations side) — together PMAT-353/361
    # close inner-record extensionality on both equations and modules
    # sides of TranspileSession.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.metahir_module_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      MetaHirModule (Bronze) admits STRUCTURE EXTENSIONALITY:
        (a) field eq (bytes) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two MetaHirModule records (bytes : Array UInt8) — the INNER
      modules-side record stored inside TranspileSession.modules.
    invariants:
      - "SIXTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-6 post-ALL 5 LAYERS milestone"
      - "STRUCTURE EXTENSIONALITY — seventeenth substrate-wide demonstration of this pattern"
      - "complementary to PMAT-353 (EquationsBlock equations-side inner record) — together close inner-record extensionality on both sides of TranspileSession"
    preconditions:
      - "two MetaHirModule records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-6 broadened: contracts at depth-6+ (3 L3 contracts at depth-6)"

  equations_block_bytes_array_size_diamond:
    # PMAT-375: SEVENTH Diamond on this contract — BROADENS DEPTH-7
    # substrate-wide. Pushes XpileContractFrontendTrait (Layer 3) from
    # depth-6 to depth-7 as the third L3 contract at depth-7+.
    # EQUATIONS-BLOCK BYTES ARRAY.SIZE STRUCTURE: Nat-measure
    # invariants on EquationsBlock.bytes field. Eighth substrate-wide
    # demonstration of the Array.size template.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.equations_block_bytes_array_size_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      EquationsBlock.bytes Array.size structure:
        (a) bytes.size >= 0
        (b) empty bytes has size-0
        (c) field-replacement preserves bytes size
        (d) self-equal size
    domain: |
      Any EquationsBlock record with bytes : Array UInt8 field.
    invariants:
      - "SEVENTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-7 substrate-wide"
      - "ARRAY.SIZE STRUCTURE — eighth substrate-wide demonstration"
      - "distinct from PMAT-340 (Array.size on TranspileSession arrays) and PMAT-353 (struct-ext of EquationsBlock)"
    preconditions:
      - "one EquationsBlock record"
    postconditions:
      - "Diamond depth-7 broadened: 3 L3 contracts at depth-7"

  metahir_module_bytes_array_size_diamond:
    # PMAT-386: EIGHTH Diamond on this contract — BROADENS DEPTH-8
    # substrate-wide. Pushes XpileContractFrontendTrait (Layer 3) from
    # depth-7 to depth-8 as the third L3 contract at depth-8+.
    # METAHIR-MODULE BYTES ARRAY.SIZE STRUCTURE: mirror of PMAT-375
    # (EquationsBlock.bytes Array.size) on the modules side. Together
    # they close inner-record Array.size on both sides of
    # TranspileSession (equations + modules). Eleventh substrate-wide
    # Array.size demonstration.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.metahir_module_bytes_array_size_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      MetaHirModule.bytes Array.size structure:
        (a) bytes.size >= 0
        (b) empty bytes has size-0
        (c) field-replacement preserves bytes size
        (d) self-equal size
    domain: |
      Any MetaHirModule record with bytes : Array UInt8 field.
    invariants:
      - "EIGHTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-8 substrate-wide"
      - "ARRAY.SIZE STRUCTURE — eleventh substrate-wide demonstration"
      - "Mirror of PMAT-375 (EquationsBlock.bytes) — closes inner-record Array.size on both TranspileSession sides"
    preconditions:
      - "one MetaHirModule record"
    postconditions:
      - "Diamond depth-8 broadened: 3 L3 contracts at depth-8"

  frame_safe_transition_subtype_extensionality_diamond:
    # PMAT-391: NINTH Diamond on this contract — BROADENS DEPTH-9
    # substrate-wide. Pushes XpileContractFrontendTrait (Layer 3)
    # from depth-8 to depth-9 as the first L3 contract at depth-9.
    # FRAME-SAFE-TRANSITION SUBTYPE EXTENSIONALITY: the Gold-tier
    # subtype `{ p : TranspileSession × TranspileSession //
    # p.fst.modules = p.snd.modules }` admits subtype extensionality.
    # THIRD substrate-wide subtype-extensionality demonstration
    # after PMAT-311 (BoundedSmem on C-COMPILE-RUST-TO-PTX-MMA) and
    # PMAT-390 (SuccessfulOutcome on C-BASHRS-POSIX-IDEMPOTENCE).
    # Together these three form an emerging Template 9 pattern
    # (Gold-tier subtype-ext) on the substrate.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.frame_safe_transition_subtype_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      FrameSafeTransition admits SUBTYPE EXTENSIONALITY:
        (a) val eq -> subtype eq (Subtype.ext)
        (b) subtype eq -> val eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two FrameSafeTransition values (subtype of
      TranspileSession × TranspileSession with the
      modules-preservation witness).
    invariants:
      - "NINTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-9 substrate-wide"
      - "SUBTYPE EXTENSIONALITY — third substrate-wide demonstration after PMAT-311 (BoundedSmem) and PMAT-390 (SuccessfulOutcome)"
      - "Gold-tier refinement-subtype pattern emerging as Template 9 (3 substrate instances now)"
    preconditions:
      - "two FrameSafeTransition values"
    postconditions:
      - "Diamond depth-9 broadened: first L3 contract at depth-9"

  session_to_equations_view_projection_diamond:
    # PMAT-404: TENTH Diamond on this contract — BROADENS DEPTH-10
    # substrate-wide. Pushes XpileContractFrontendTrait (Layer 3)
    # from depth-9 to depth-10. Third L3 contract at depth-10.
    # SILVER→BRONZE TIER PROJECTION on TranspileSession: define the
    # canonical proof-lane forgetful map session_to_equations_view :
    # TranspileSession → Array EquationsBlock that drops the modules
    # field. FOURTH instance of Template 10 (Tier-projection
    # homomorphism). Captures the proof-lane-only refinement
    # direction on the multi-field Silver record.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.session_to_equations_view_projection_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      Silver→Bronze proof-lane projection homomorphism on TranspileSession:
        (a) session_to_equations_view(s) = s.equations
        (b) projection is independent of modules (forgetful)
        (c) empty equations maps to empty Array
        (d) self-equality
    domain: |
      The forgetful map session_to_equations_view : TranspileSession
      → Array EquationsBlock that drops the modules field while
      retaining the equations side.
    invariants:
      - "TENTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-10 substrate-wide"
      - "TIER-PROJECTION HOMOMORPHISM — fourth instance of Template 10"
      - "Captures proof-lane axis of Silver→Bronze projection on multi-field Silver TranspileSession"
    preconditions:
      - "one TranspileSession record"
    postconditions:
      - "Diamond depth-10 broadened: third L3 contract at depth-10"

  empty_session_canonical_diamond:
    # PMAT-415: ELEVENTH Diamond on this contract — BROADENS DEPTH-11
    # substrate-wide. Pushes XpileContractFrontendTrait (Layer 3)
    # from depth-10 to depth-11. Third L3 contract at depth-11.
    # CANONICAL EMPTY TranspileSession: define the canonical empty
    # TranspileSession with both modules and equations arrays empty
    # — the initial state before any parsing.
    # **FIFTH instance of Template 11 (Canonical identity element)**.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.empty_session_canonical_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      Canonical identity element on TranspileSession:
        (a) empty_session.modules = #[]
        (b) empty_session.equations = #[]
        (c) empty_session.modules.size = 0
        (d) empty_session.equations.size = 0
    domain: |
      The canonical empty TranspileSession (modules and equations
      both empty) — initial state before any parsing.
    invariants:
      - "ELEVENTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-11 substrate-wide"
      - "CANONICAL IDENTITY ELEMENT — fifth instance of Template 11"
    preconditions: []
    postconditions:
      - "Diamond depth-11 broadened: third L3 contract at depth-11"

  equations_block_to_session_lift_diamond:
    # PMAT-426: TWELFTH Diamond on this contract — BROADENS DEPTH-12.
    # BRONZE→SILVER LIFT on EquationsBlock: wraps Bronze EquationsBlock
    # into a singleton TranspileSession with empty modules.
    # **FIFTH instance of Template 12**.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.equations_block_to_session_lift_diamond"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      Bronze→Silver lift on EquationsBlock to TranspileSession:
        (a) lift produces empty modules
        (b) lift produces singleton equations
        (c) wrapped equation equals lifted EquationsBlock
        (d) self-equality
    domain: |
      The lift equations_block_to_session : EquationsBlock →
      TranspileSession that wraps Bronze into a singleton Silver.
    invariants:
      - "TWELFTH Diamond category on C-XPILE-CONTRACT-FRONTEND-TRAIT — BROADENS DEPTH-12 substrate-wide"
      - "BRONZE→SILVER LIFT HOMOMORPHISM — fifth instance of Template 12"
    preconditions: []
    postconditions:
