metadata:
  id: C-XPILE-CONTRACT-FRONTEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile ContractFrontend trait
    must satisfy. ContractFrontend is the proof-lane sibling of Frontend:
    it parses notation (LaTeX, Lean theorem text, mdBook) into contract
    equation YAML. Where Frontend produces meta-HIR for the code lane,
    ContractFrontend produces an EquationsBlock for the contract substrate.

    Layer 3 of the contract taxonomy (architectural / xpile-internal),
    proof-lane.
  references:
    - docs/specifications/sub/contract-frontend-trait.md
    - docs/specifications/sub/contract-taxonomy.md
    - contracts/xpile-frontend-trait-v1.yaml
  depends_on:
    - C-XPILE-FRONTEND-TRAIT

equations:
  format_ownership:
    formula: |
      forall fmt in registered_formats: exists exactly one cf: fmt in cf.formats()
    domain: |
      registered_formats is the union of formats() across all
      ContractFrontend implementations registered with a TranspileSession.
    invariants:
      - "no two contract frontends declare the same ContractFormat variant"
      - "every dispatched format reaches exactly one parse_to_equations call"
    preconditions:
      - "TranspileSession::register_contract_frontend has been called for every active impl"

  parse_idempotency:
    # PMAT-066: Lean refinement theorem locks in the determinism
    # modelling commitment for parse_to_equations. See
    # contracts/lean/XpileContractFrontendTrait.lean for the
    # proof. Pairs with PMAT-062 to close both code-lane and
    # proof-lane parse determinism.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.parse_idempotency"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    # PMAT-067: Kani harness completes the §14.4 quorum. Symbolic
    # counterpart to the Lean theorem — proves determinism over
    # all 4-byte symbolic sources.
    kani_harness: "parse_idempotency"
    kani_file: "contracts/kani/xpile_contract_frontend_trait.rs"
    formula: |
      forall source: hash(cf.parse_to_equations(source).unwrap()) == hash(cf.parse_to_equations(source).unwrap())
    domain: |
      Two parses of the same source string yield identical EquationsBlock
      when run in the same process with no intervening mutation of cf.
    invariants:
      - "ContractFrontend impls hold no mutable state across parse calls"
      - "EquationsBlock serialization is canonical (BTreeMap-ordered, no HashMap)"
      - "autogenerated equation names (from anonymous math spans) are deterministic"
    preconditions:
      - "source is valid UTF-8"

  equations_only:
    # PMAT-158 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-001: Silver-tier
    # refinement theorem. Introduces TranspileSession with disjoint
    # modules + equations storage. Proves parse_to_equations leaves
    # the modules array unchanged at the type level.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.equations_only_silver"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      forall cf, source: cf.parse_to_equations(source) produces no xpile_meta_hir::Module
        and does not mutate any Module reachable from the call site
    domain: |
      ContractFrontend operates exclusively on the proof lane. The code
      lane (Frontend → meta-HIR) is a separate dispatch path.
    invariants:
      - "no Module is created or mutated by ContractFrontend"
      - "EquationsBlock and Module remain in disjoint storage in TranspileSession"
      - "a single source file (e.g., .lean) may be parsed by BOTH a Frontend and a ContractFrontend; both must succeed independently"
    preconditions: []

  frame_safe_transition_gold:
    # PMAT-196 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-002: ELEVENTH
    # Gold-tier refinement in the substrate. Demonstrates FIFTH
    # Gold pattern variant: frame-safe transition refinement —
    # FrameSafeTransition := { p : Session × Session //
    # p.fst.modules = p.snd.modules } — encodes frame-preservation
    # at the type level. Distinct from cross-field equality
    # (PMAT-194/195) because both sides are the SAME type and
    # the preserved field has the SAME name (before/after
    # invariant rather than across-domain). Load-bearing for
    # modifies()/frame invariants in separation-logic style.
    # Companion theorems frame_safety_witness_gold and
    # gold_contract_frontend_agrees_with_silver.
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.frame_safe_transition_gold"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      parse_to_equations_gold(session, source).before.modules
        == parse_to_equations_gold(session, source).after.modules
      BY TYPE  (frame witness travels with the pair)
    domain: |
      Same as equations_only — every ContractFrontend impl. The
      Gold upgrade encodes the frame-preservation invariant at
      the type level via a before/after-pair refinement subtype.
    invariants:
      - "FrameSafeTransition pairs before/after TranspileSession under a TYPE-LEVEL proof that modules is preserved"
      - "frame-safety witness travels with the pair through extraction — no per-call-site re-proof needed"
      - "fifth Gold pattern variant: frame-safety refinement (before.field = after.field for same-type sides)"
      - "distinct from cross-field equality (PMAT-194/195) — here both sides are the SAME type, the field name is SAME, and the proof is a frame invariant rather than an across-domain consistency claim"
    preconditions:
      - "the ContractFrontend impl is well-formed (Silver model preconditions inherited)"
    postconditions:
      - "an emitter returning a (before, after) pair where modules differ would not type-check against parse_to_equations_gold"
      - "this pattern is the building block for `modifies()` frame conditions throughout the codebase"

  frame_safety_transitive_platinum:
    # PMAT-203 / XPILE-REFINE-CONTRACT-FRONTEND-TRAIT-003: FIFTH
    # Platinum-tier refinement in the substrate. Demonstrates
    # the FIFTH distinct Platinum algebraic shape: transitivity
    # / chain-rule. Distinct from PMAT-199 commutativity,
    # PMAT-200 associativity, PMAT-201 idempotence, PMAT-202
    # functoriality. Frame-safety (PMAT-196's FrameSafeTransition)
    # captures modifies()-style invariants per call; PMAT-203
    # proves this invariant COMPOSES across sequenced calls —
    # the classic chain-rule for Hoare-style frame conditions.
    # Companion theorems frame_safety_reflexive_platinum
    # (reflexivity → equivalence-like structure) and
    # frame_safety_chain_parse_platinum (compositional structure
    # under chained source-parsing).
    lean_theorem: "XpileContracts.CXpileContractFrontendTrait.frame_safety_transitive_platinum"
    lean_file: "contracts/lean/XpileContractFrontendTrait.lean"
    formula: |
      ∀ t1, t2 : FrameSafeTransition,
        t1.after = t2.before ⟹
          t1.before.modules = t2.after.modules
      (transitivity / chain-rule of frame-safety)
    domain: |
      Any two FrameSafeTransition values whose intermediate
      states match (t1.after = t2.before). The Platinum upgrade
      captures the chain-rule for frame conditions at the type
      level.
    invariants:
      - "FIFTH Platinum algebraic shape: transitivity / chain-rule"
      - "frame-safety is reflexive (companion theorem) + transitive + symmetric → equivalence-like structure over sessions"
      - "load-bearing for sequenced emitter pipelines: composing N parse_to_equations operations preserves the frame invariant overall, not just per-step"
      - "captures the classic separation-logic composition law: safe(a,b) ∧ safe(b,c) ⟹ safe(a,c)"
    preconditions:
      - "two FrameSafeTransition values exist with t1.after = t2.before (the chaining precondition)"
      - "frame-safety reflexivity is unconditional (companion theorem frame_safety_reflexive_platinum)"
    postconditions:
      - "the COMPOSED transition is frame-safe — the modules field is preserved from t1.before to t2.after"
      - "this enables emitter implementations to compose frame-safe operations into pipelines without re-verifying the frame condition at each step"

  citation_preservation:
    formula: |
      forall cf, source: contract_ids_textually_in(source) subset EquationsBlock.citations
    domain: |
      Every ContractId that textually appears in source (via \cite{},
      \href, % xpile-cite:, or a Lean -- C-X comment) must be carried
      forward into the EquationsBlock's citations field.
    invariants:
      - "no citation textually present in source is dropped"
      - "duplicate citations dedupe to a single entry"
      - "citation form (BibTeX, hyperref, comment) is normalized but the ID itself is preserved verbatim"
    preconditions:
      - "ContractId regex is fixed: /^C-[A-Z0-9-]+$/"

proof_obligations:
  - type: invariant
    property: Every registered format is owned by exactly one ContractFrontend
    formal: "∀ fmt ∈ registered_formats: |{ cf | fmt ∈ cf.formats() }| == 1"
    applies_to: format_ownership

  - type: invariant
    property: parse_to_equations is deterministic per source
    formal: "∀ s: hash(parse(s)) == hash(parse(s))"
    applies_to: parse_idempotency

  - type: invariant
    property: ContractFrontend produces no Module and does not mutate Module
    formal: "modifies(Module) == ∅ ∧ produces(Module) == ∅"
    applies_to: equations_only

  - type: invariant
    property: Citations textually present in source survive into EquationsBlock
    formal: "∀ c ∈ textual_cites(source): c ∈ EquationsBlock.citations"
    applies_to: citation_preservation

  - type: frame
    property: parse_to_equations does not mutate the source string
    formal: "modifies(source) == ∅"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XPILE-CFRONT-001
    rule: |
      Two distinct ContractFrontends MUST NOT both claim the same
      ContractFormat variant.
    prediction: |
      A TranspileSession that registers two ContractFrontends with
      overlapping formats() either rejects the second or panics in test.
    test: |
      cargo test -p xpile-core --test contract_frontend_dispatch -- duplicate_format
    if_fails: |
      Dispatch is ambiguous. The proof lane cannot decide which parser
      to invoke for `.tex` (or `.lean`, or any registered extension).
    ship_blocking: true
    counter_example_classes:
      - duplicate_format
      - aliased_format

  - id: FALSIFY-XPILE-CFRONT-002
    rule: |
      parse_to_equations MUST be deterministic for a fixed source string.
    prediction: |
      Hashing two consecutive results of parse_to_equations on the same
      input yields identical hashes.
    test: |
      cargo test -p xpile-contract-frontend --test idempotency
    if_fails: |
      A contract frontend holds mutable state, or autogenerated equation
      names depend on iteration order (HashMap) or timing.
    ship_blocking: true
    counter_example_classes:
      - hashmap_iteration_order
      - hidden_mutable_state
      - autogen_name_nondeterminism

  - id: FALSIFY-XPILE-CFRONT-003
    rule: |
      ContractFrontend MUST NOT produce or mutate any xpile_meta_hir::Module.
    prediction: |
      Running parse_to_equations on any source leaves the session's
      Module store byte-identical (hash comparison before/after).
    test: |
      cargo test -p xpile-contract-frontend --test equations_only_no_module
    if_fails: |
      Proof lane and code lane are crossing wires. A LaTeX or Lean-theorem
      parser is creating meta-HIR; that's Frontend's job, not
      ContractFrontend's.
    ship_blocking: true
    counter_example_classes:
      - module_cross_pollution
      - shared_storage_aliasing

  - id: FALSIFY-XPILE-CFRONT-004
    rule: |
      Every ContractId textually present in the source MUST appear in
      EquationsBlock.citations after parsing.
    prediction: |
      For source containing `\cite{C-XLATE-PY-LIST-TO-VEC}` and
      `\cite{C-PY-INT-ARITH}`, the citations field contains both IDs.
    test: |
      cargo test -p xpile-contract-frontend --test citation_preservation
    if_fails: |
      Audit chain incomplete. A paper cites a contract, the parsed YAML
      drops it, re-rendering loses the reference. Provenance broken.
    ship_blocking: true
    counter_example_classes:
      - cite_dropped
      - cite_mangled
      - cite_form_not_recognized

kani_harnesses:
  - id: KANI-XPILE-CFRONT-001
    obligation: format_ownership
    bound: 4
    property: |
      For up to 4 registered contract frontends with up to 2 formats each,
      no ContractFormat appears in more than one frontend's formats() list.
    harness: |
      #[kani::proof]
      fn format_ownership_harness() {
          let frontends: [Vec<ContractFormat>; 4] = kani::any();
          let union: Vec<ContractFormat> = frontends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for fmt in union {
              kani::assume(seen.insert(fmt));
          }
      }

  - id: KANI-XPILE-CFRONT-002
    obligation: invariant
    bound: 3
    property: |
      For a bounded source containing up to 3 \cite{} calls, all
      cited IDs appear in the parsed citations field.
    harness: |
      #[kani::proof]
      fn citations_survive_parse() {
          let n: usize = kani::any();
          kani::assume(n <= 3);
          let ids: [ContractId; 3] = kani::any();
          let source = build_latex_with_cites(&ids[..n]);
          let parsed = parse_to_equations(&source);
          for i in 0..n {
              assert!(parsed.citations.contains(&ids[i]));
          }
      }
