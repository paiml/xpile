proof_obligations:
  - type: invariant
    property: Every registered format is owned by exactly one ContractFrontend
    formal: "∀ fmt ∈ registered_formats: |{ cf | fmt ∈ cf.formats() }| == 1"
    applies_to: format_ownership

  - type: invariant
    property: parse_to_equations is deterministic per source
    formal: "∀ s: hash(parse(s)) == hash(parse(s))"
    applies_to: parse_idempotency

  - type: invariant
    property: ContractFrontend produces no Module and does not mutate Module
    formal: "modifies(Module) == ∅ ∧ produces(Module) == ∅"
    applies_to: equations_only

  - type: invariant
    property: Citations textually present in source survive into EquationsBlock
    formal: "∀ c ∈ textual_cites(source): c ∈ EquationsBlock.citations"
    applies_to: citation_preservation

  - type: frame
    property: parse_to_equations does not mutate the source string
    formal: "modifies(source) == ∅"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XPILE-CFRONT-001
    rule: |
      Two distinct ContractFrontends MUST NOT both claim the same
      ContractFormat variant.
    prediction: |
      A TranspileSession that registers two ContractFrontends with
      overlapping formats() either rejects the second or panics in test.
    test: |
      cargo test -p xpile-core --test contract_frontend_dispatch -- duplicate_format
    if_fails: |
      Dispatch is ambiguous. The proof lane cannot decide which parser
      to invoke for `.tex` (or `.lean`, or any registered extension).
    ship_blocking: true
    counter_example_classes:
      - duplicate_format
      - aliased_format

  - id: FALSIFY-XPILE-CFRONT-002
    rule: |
      parse_to_equations MUST be deterministic for a fixed source string.
    prediction: |
      Hashing two consecutive results of parse_to_equations on the same
      input yields identical hashes.
    test: |
      cargo test -p xpile-contract-frontend --test idempotency
    if_fails: |
      A contract frontend holds mutable state, or autogenerated equation
      names depend on iteration order (HashMap) or timing.
    ship_blocking: true
    counter_example_classes:
      - hashmap_iteration_order
      - hidden_mutable_state
      - autogen_name_nondeterminism

  - id: FALSIFY-XPILE-CFRONT-003
    rule: |
      ContractFrontend MUST NOT produce or mutate any xpile_meta_hir::Module.
    prediction: |
      Running parse_to_equations on any source leaves the session's
      Module store byte-identical (hash comparison before/after).
    test: |
      cargo test -p xpile-contract-frontend --test equations_only_no_module
    if_fails: |
      Proof lane and code lane are crossing wires. A LaTeX or Lean-theorem
      parser is creating meta-HIR; that's Frontend's job, not
      ContractFrontend's.
    ship_blocking: true
    counter_example_classes:
      - module_cross_pollution
      - shared_storage_aliasing

  - id: FALSIFY-XPILE-CFRONT-004
    rule: |
      Every ContractId textually present in the source MUST appear in
      EquationsBlock.citations after parsing.
    prediction: |
      For source containing `\cite{C-XLATE-PY-LIST-TO-VEC}` and
      `\cite{C-PY-INT-ARITH}`, the citations field contains both IDs.
    test: |
      cargo test -p xpile-contract-frontend --test citation_preservation
    if_fails: |
      Audit chain incomplete. A paper cites a contract, the parsed YAML
      drops it, re-rendering loses the reference. Provenance broken.
    ship_blocking: true
    counter_example_classes:
      - cite_dropped
      - cite_mangled
      - cite_form_not_recognized

kani_harnesses:
  - id: KANI-XPILE-CFRONT-001
    obligation: format_ownership
    bound: 4
    property: |
      For up to 4 registered contract frontends with up to 2 formats each,
      no ContractFormat appears in more than one frontend's formats() list.
    harness: |
      #[kani::proof]
      fn format_ownership_harness() {
          let frontends: [Vec<ContractFormat>; 4] = kani::any();
          let union: Vec<ContractFormat> = frontends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for fmt in union {
              kani::assume(seen.insert(fmt));
          }
      }

  - id: KANI-XPILE-CFRONT-002
    obligation: invariant
    bound: 3
    property: |
      For a bounded source containing up to 3 \cite{} calls, all
      cited IDs appear in the parsed citations field.
    harness: |
      #[kani::proof]
      fn citations_survive_parse() {
          let n: usize = kani::any();
          kani::assume(n <= 3);
          let ids: [ContractId; 3] = kani::any();
          let source = build_latex_with_cites(&ids[..n]);
          let parsed = parse_to_equations(&source);
          for i in 0..n {
              assert!(parsed.citations.contains(&ids[i]));
          }
      }
