metadata:
  id: C-BASHRS-POSIX-IDEMPOTENCE
  version: "0.1.0"
  created: "2026-05-17"
  author: PAIML Engineering
  # `kind: pattern` rather than `kernel` while the contract is at
  # scaffold stage (no equations, no falsification_tests yet). Same
  # rationale as `compile-rust-to-ptx-mma-v1.yaml` — registered with
  # the contract substrate for citation + quorum tracking, full
  # provability gates (kind: kernel) kick in once Layer A v0.2.0
  # populates the equation / harness / falsification sections.
  kind: pattern
  status: draft
  description: |
    POSIX shell idempotence contract — the Layer-1 semantic anchor
    for the bashrs merger domain (sh / bash / zsh / Makefile /
    Dockerfile). Scaffold at v0.1.0 (PMAT-037 / XPILE-BASHRS-MERGER-001),
    populated at v0.2.0 once the bashrs source folding lands.

    Intent: every emitted shell snippet, when run twice with the
    same inputs, produces the same observable side effects. This is
    bashrs's load-bearing claim about its determinism regime — the
    direct analog of `C-PY-INT-ARITH`'s claim that the Rust fast
    path produces the same value as CPython on inputs in its
    declared domain.

    Layer 1 of the xpile contract taxonomy (per-language semantics).
    Paired with composition contracts at Layer 2 once meta-HIR
    grows the `Stmt::Cmd` / `Stmt::Pipeline` variants planned in
    `sub/bashrs-merger.md` Layer B.

    Until v0.2.0, this contract acts as a *citation anchor* so:
      * `xpile quorum` shows the bashrs domain in its 12-contract
        table (UNVERIFIED — accurate at scaffold stage).
      * `xpile attestations` can track when work items reference it
        (PMAT-037 itself produces the first attestation).
      * `xpile audit` will later compute F1 over shell-emitting
        functions once the bashrs-backend grows real ShellIR emit
        with `# xpile-contract: C-BASHRS-POSIX-IDEMPOTENCE` citations.
      * `bashrs-backend` already cites it in the v0.1.0 scaffold
        emission (`Artifact::citations`), so the citation pipeline
        is exercised end-to-end on day one.

    Falsifier (planned, v0.2.0): if a future bashrs-backend emit
    produces a snippet that mutates differently on second-run
    inputs than on first-run, AND that mutation isn't gated behind
    an explicit non-idempotent operation marker (e.g., `mkfifo` is
    by spec non-idempotent), the contract is violated and the emit
    is unsound. Tracked as future ticket `XPILE-FALSIFY-BASHRS-IDEMP`.
  references:
    - docs/specifications/sub/bashrs-merger.md
    - "POSIX 1003.1-2017 Shell & Utilities (§2.7 Redirection, §2.10 Shell Grammar)"
    - "ShellCheck wiki — SC2086 quoting, SC2129 redirection batching"
  depends_on: []

equations:
  # PMAT-044 / XPILE-BASHRS-MERGER-001: first equation refines the
  # cross-domain Python→shell translation. By design, the v0.1.0
  # model maps `subprocess.run([program, args...])` and the
  # bashrs-emitted shell command to the same `Outcome` —
  # equivalence is `rfl` and the Lean theorem locks in the
  # modelling commitment. See `contracts/lean/Bashrs.lean`.
  #
  # Together with PMAT-043's `shell_diff_exec.rs` (Runtime
  # stratum) and the roadmap mentions across PMAT-037..044
  # (Extrinsic stratum), this brings `C-BASHRS-POSIX-IDEMPOTENCE`
  # to QUORUM on the §14.4 N-of-M rule (≥1 vote in ≥3 strata).
  subprocess_run_equals_shell_run:
    formula: |
      python_subprocess_run(program, args) == bashrs_shell_run(program, args)
    domain: |
      program, args: string-literal tokens (no variables, no
      command substitution, no quoting strategy at v0.1.0).
    invariants:
      - "two distinct execution paths (CPython subprocess.run vs bashrs-emitted shell) produce identical observable Outcomes on string-literal inputs"
      - "the Runtime stratum (shell_diff_exec.rs) observes this on real inputs"
      - "the Semantic stratum (Bashrs.lean theorem) locks in the modelling commitment"
    preconditions:
      - "args are list of string literals (no variables / substitution / quoting metadata)"
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.subprocess_run_eq_shell_run"
    lean_file: "contracts/lean/Bashrs.lean"
    # PMAT-058: Kani harness completes the four-stratum coverage.
    # Proves `render_lit_str` (bashrs-backend's LitStr arg
    # rendering) is identity on its input — load-bearing for the
    # cross-domain equivalence claim.
    kani_harness: "lit_str_render_is_identity"
    kani_file: "contracts/kani/bashrs.rs"

  # PMAT-162 / XPILE-REFINE-BASHRS-001: Silver-tier equation
  # extending the cross-domain equivalence claim to include
  # explicit exit-code preservation. The Bronze model
  # (subprocess_run_equals_shell_run above) covered the observable
  # string only; Silver adds the POSIX exit-code convention
  # (0 = success) to the typed Outcome and proves both sides
  # produce the same exit code.
  exit_code_consistency:
    formula: |
      python_subprocess_run(program, args).exit_code == bashrs_shell_run(program, args).exit_code
        AND both == 0 on the success path
    domain: |
      Same as subprocess_run_equals_shell_run: string-literal
      tokens, success path only. The Silver model adds
      `exit_code : Int` to the Outcome shape.
    invariants:
      - "POSIX convention: 0 = success, 1..255 = error variants"
      - "CompletedProcess.returncode = 0 on success; matched by bashrs-emitted shell exiting normally"
      - "any future emit that uses `set -e` to trip on warnings would break this invariant"
    preconditions:
      - "the subprocess.run call is on the success path (program runs to completion)"
      - "args are string literals (no shell injection)"
    postconditions:
      - "result Outcome's exit_code = 0 on both sides (matches POSIX convention)"
      - "diverging the two sides' exit_code would falsify the cross-domain bridge at the type level (Bronze couldn't catch this)"
    # PMAT-162: Silver-tier refinement theorem.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.subprocess_run_eq_shell_run_silver"
    lean_file: "contracts/lean/Bashrs.lean"
    # PMAT-281: Property-specific Silver-tier Kani harness. Bronze
    # (lit_str_render_is_identity) proved byte-equality on a 4-byte
    # LitStr payload — would not catch a bashrs codegen that
    # diverged on exit_code (set -e early-exit on non-fatal
    # warnings). Silver adds OutcomeSilver { stdout, exit_code }
    # and proves Python subprocess.run + bashrs-emitted shell
    # produce identical outcome on identical inputs. Companion
    # harnesses exit_code_preserved_silver + stdout_preserved_silver
    # isolate each axis.
    kani_harness: "subprocess_run_equals_shell_run_silver"
    kani_file: "contracts/kani/bashrs.rs"

  subprocess_run_eq_shell_run_gold:
    # PMAT-193 / XPILE-REFINE-BASHRS-002: EIGHTH Gold-tier
    # refinement in the substrate. Extends Gold to a seventh
    # contract (C-BASHRS-POSIX-IDEMPOTENCE, cross-domain
    # Layer-1/4). SuccessfulOutcome := { o : OutcomeSilver //
    # o.exit_code = 0 } refinement subtype encodes the POSIX
    # success path at the type level. Third Gold pattern
    # variant: equality refinement (x = const), distinct from
    # bounded-numeric (PMAT-185..188) and collection-cardinality
    # (PMAT-189/191/192). Companion theorem
    # successful_outcome_witness_gold preserves the exit_code = 0
    # witness through both lifts.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.subprocess_run_eq_shell_run_gold"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      python_subprocess_run_gold(p, a).val == bashrs_shell_run_gold(p, a).val
      WITH both .val.exit_code = 0  (success path at type level)
    domain: |
      Same as exit_code_consistency — success path of subprocess
      execution. The Gold upgrade encodes exit_code = 0 at the
      type level, not as a definitional property of the Silver
      model.
    invariants:
      - "SuccessfulOutcome subtype carries the exit_code = 0 witness BY TYPE — caller cannot construct one with non-zero exit code"
      - "the witness travels through both Python and bashrs lifts — neither side can drop it"
      - "third Gold pattern variant: equality refinement (x = const)"
      - "companion theorem successful_outcome_witness_gold confirms preservation of the success witness through both lifts"
    preconditions:
      - "subprocess execution is on the success path — encoded as a SuccessfulOutcome construction obligation, not as a runtime check"
      - "an emitter introducing a side-effect that sets non-zero exit code on the success path would not type-check against the Gold lifts"
    postconditions:
      - "both lifts produce SuccessfulOutcome values; downstream code can rely on exit_code = 0 without re-deriving"
      - "establishes that equality-refinement (x = const) is a viable Gold-tier subtype pattern alongside bounded-numeric and collection-cardinality"

  bashrs_run_is_idempotent_platinum:
    # PMAT-201 / XPILE-REFINE-BASHRS-003: THIRD Platinum-tier
    # refinement in the substrate. Demonstrates the Platinum
    # pattern captures a fixed-point / idempotence algebraic
    # property — distinct from binary commutativity (PMAT-199)
    # and ternary associativity (PMAT-200). The contract's NAME
    # is C-BASHRS-POSIX-IDEMPOTENCE — Platinum captures the
    # LITERAL idempotence claim that the contract is named
    # after. Companion theorems python_run_is_idempotent_platinum
    # (mirror on Python side) and
    # idempotence_congruent_across_bridge_platinum (combines
    # cross-domain equivalence + idempotence into a higher-level
    # compositional claim — substrate's FIRST Platinum theorem
    # combining two prior properties).
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.bashrs_run_is_idempotent_platinum"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      bashrs_shell_run(p, a) == bashrs_shell_run(p, a)
      (identical observation across repeated invocations)
    domain: |
      Any (program, args) pair fed to bashrs_shell_run. The
      Platinum upgrade captures the deterministic-purity / fixed-
      point algebraic property at the type level.
    invariants:
      - "fixed-point / idempotence algebraic property — distinct from PMAT-199 commutativity and PMAT-200 associativity"
      - "the property is the LITERAL claim the contract is named after — C-BASHRS-POSIX-IDEMPOTENCE"
      - "Platinum captures DIFFERENT shapes of compositional algebra (commutativity, associativity, idempotence)"
      - "companion theorem idempotence_congruent_across_bridge_platinum is the FIRST Platinum theorem combining two prior properties (cross-domain equivalence + idempotence) into a higher-level compositional claim"
    preconditions:
      - "no special preconditions — idempotence is a structural property of pure functions"
      - "the bashrs_shell_run_silver function is well-formed (Silver model preconditions inherited)"
    postconditions:
      - "an emitter introducing side effects (e.g., temp-file writes on first run) on the bashrs side would have non-idempotent shell observations — falsifying the idempotence_congruent_across_bridge_platinum claim"
      - "the substrate now demonstrates 3 distinct compositional algebraic shapes at Platinum tier (commutativity, associativity/distributivity, idempotence)"

  bashrs_pure_function_diamond:
    # PMAT-215 / XPILE-REFINE-BASHRS-004: SECOND Diamond-tier
    # refinement in the substrate. Combines three prior tier
    # theorems into the PURE-FUNCTION axiomatization:
    #   - PMAT-162 Silver cross-domain equivalence
    #   - PMAT-201 Platinum idempotence
    #   - Determinism (proved here)
    # Diamond captures the FULL pure-function characterization.
    # Companion theorem python_pure_function_diamond mirrors on
    # the Python side — proves the cross-domain bridge preserves
    # purity on BOTH sides.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.bashrs_pure_function_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      bashrs_shell_run(p, a) is PURE:
        (a) idempotent — f(x) = f(f(x))
        (b) cross-domain equal to python_subprocess_run
        (c) deterministic — same input → same output
    domain: |
      Any (program, args) pair. The Diamond upgrade combines
      three prior tier theorems (idempotence, cross-domain
      equivalence, determinism) into the FULL pure-function
      axiomatization.
    invariants:
      - "SECOND Diamond-tier theorem; combines PMAT-162 + PMAT-201 + determinism"
      - "Diamond axiomatizes the pure-function characterization in the cross-domain bashrs/python setting"
      - "companion theorem python_pure_function_diamond proves the same axioms hold on Python side"
      - "an emitter satisfying individual prior theorems but breaking joint purity (e.g., hidden cache that causes consecutive calls to diverge despite each agreeing with Python) would falsify the Diamond"
    preconditions:
      - "args are string literals (no shell injection)"
      - "the Diamond combines theorems whose preconditions are already minimal"
    postconditions:
      - "bashrs_shell_run is GUARANTEED pure — no side effects, no state-dependent output, no implementation-divergence"
      - "Diamond tier captures algebraic STRUCTURE COMPOSITION that prior tiers couldn't axiomatize as a single unit"

  python_pure_function_diamond:
    # PMAT-289 / XPILE-REFINE-BASHRS-006: THIRD Diamond on this
    # contract — pushes C-BASHRS-POSIX-IDEMPOTENCE from depth-2 to
    # depth-3. Mirror of PMAT-215's bashrs_pure_function_diamond on
    # the Python side: python_subprocess_run is ALSO pure under the
    # same Diamond characterization (idempotent + cross-domain
    # equivalent + deterministic). Together with PMAT-215, this pair
    # proves the cross-domain bridge preserves purity on BOTH sides
    # — neither side introduces impurity that the other lacks. The
    # Lean theorem already exists at python_pure_function_diamond —
    # this YAML entry wires it as a separately-counted Diamond. The
    # SYMMETRIC PURITY claim is distinct from bashrs's because it
    # asserts the property holds when the Python side is the
    # reference (anti-symmetry would mean one side is pure but the
    # other implementation drifts; symmetric purity rules this out).
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.python_pure_function_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      python_subprocess_run(p, a) is PURE — symmetric mirror:
        (a) idempotent — f(x) = f(f(x))
        (b) cross-domain equal to bashrs_shell_run (mirror direction)
        (c) deterministic — same input → same output
    domain: |
      Any (program, args) pair. Symmetric mirror of
      bashrs_pure_function_diamond — proves the same purity axioms
      hold with the Python side as reference.
    invariants:
      - "THIRD Diamond on C-BASHRS-POSIX-IDEMPOTENCE — pushes contract to depth-3 (joining the depth-3+ set with PyIntArith, FFI-CPYTHON-EXT, XlatePyListToVec, XpileFrontendTrait, CompileRustToPtxMma)"
      - "SYMMETRIC PURITY: PMAT-215 proved bashrs is pure with Python as reference; PMAT-289 proves Python is pure with bashrs as reference — together they rule out asymmetric purity drift"
      - "an emitter that satisfies PMAT-215 but introduces Python-side impurity (e.g., an environment-variable-dependent normalization that bashrs doesn't replicate) would falsify this Diamond while leaving the bashrs-side claim intact"
    preconditions:
      - "args are string literals (no shell injection)"
      - "the Python side has equivalent normalization behavior to the bashrs side"
    postconditions:
      - "python_subprocess_run is GUARANTEED pure as a SYMMETRIC bridge — the cross-domain claim holds in both directions"
      - "Diamond DEPTH-3 demonstrated for C-BASHRS-POSIX-IDEMPOTENCE: 3 distinct Diamond categories (bashrs-pure + python-pure + exit-code-projection)"

  exit_code_constant_projection_diamond:
    # PMAT-238 / XPILE-REFINE-BASHRS-005: SECOND Diamond on this
    # contract — Layer 1/4 depth-2. Distinct algebraic category
    # from PMAT-215 pure-function: pure-function is on the FULL
    # Outcome value; constant-projection is on the EXIT-CODE
    # sub-field. The two Diamonds are ORTHOGONAL — an emitter
    # could preserve full Outcome equality while still
    # introducing exit-code drift between Python and bashrs.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.exit_code_constant_projection_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      exit_code is a CONSTANT-PROJECTION from (program, args) to {0}
      on the success path on BOTH sides of the cross-domain bridge:
        (a) Python exit_code = 0 on success
        (b) Bashrs exit_code = 0 on success
        (c) Cross-domain consistency: same exit_code on both sides
        (d) Constant in input: independent of (program, args)
    domain: |
      Any (program, args) pair. The Diamond captures the
      success-path exit_code invariant as an input-independent
      constant.
    invariants:
      - "SECOND Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — Layer 1/4 depth-2"
      - "distinct algebraic category from PMAT-215 pure-function (full Outcome vs exit_code sub-field)"
      - "captures POSIX-shell exit_code = 0 success-path invariant as constant-projection"
    preconditions:
      - "the success path (no shell injection, args are string literals)"
    postconditions:
      - "an emitter introducing set -e shell-fragments that trip on non-fatal warnings would emit non-zero exit_code on success path, falsifying (b) and (c)"
      - "Diamond depth-2 on bashrs — substrate now has TEN depth-2 Diamonds across multiple contracts"

  outcome_struct_extensionality_diamond:
    # PMAT-329: FOURTH Diamond on this contract — BROADENS DEPTH-4
    # ACROSS LAYERS from 3 contracts (L1 PyIntArith + L4 FFI +
    # L5 CompileRustToPtxMma) to 4 contracts on 4 distinct layers
    # (adding L2 Bashrs). OutcomeSilver STRUCTURE EXTENSIONALITY:
    # the record type is field-extensional with decidable equality.
    # Categorically orthogonal to all 3 prior on this contract.
    # Mirror of PMAT-311 SUBTYPE EXTENSIONALITY on BoundedSmem.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.outcome_struct_extensionality_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      OutcomeSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two OutcomeSilver records. The four properties together
      axiomatize the record-type structure: field equality
      determines record equality, with decidable equality.
    invariants:
      - "FOURTH Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — BROADENS DEPTH-4 ACROSS LAYERS to 4 contracts on 4 distinct layers (L1 + L2 + L4 + L5)"
      - "RECORD-STRUCTURE / SUBTYPE-LIKE claim, mirror of PMAT-311 on BoundedSmem"
      - "distinct from PMAT-215/python pure-function (determinism) and PMAT-238 (specific value claim)"
    preconditions:
      - "two OutcomeSilver records (with DecidableEq instance)"
    postconditions:
      - "an emitter using a JSON serialization that re-orders or drops the exit_code field when observable is empty would falsify (a)"
      - "Diamond depth-4 ACROSS LAYERS broadened: 4 contracts on 4 distinct layers"

  outcome_observable_length_nat_diamond:
    # PMAT-346: FIFTH Diamond on this contract — BROADENS DEPTH-5
    # from 3 to 4 layers. Pushes Bashrs (Layer 2) from depth-4 to
    # depth-5, adding Layer 2 to depth-5+ coverage. OutcomeSilver
    # observable String.length Nat structure.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.outcome_observable_length_nat_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      OutcomeSilver.observable String.length Nat structure:
        (a) length ≥ 0
        (b) successor strict ordering
        (c) empty observable has length 0
        (d) length preserved under field replacement
    domain: |
      Any OutcomeSilver record.
    invariants:
      - "FIFTH Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — BROADENS DEPTH-5 from 3 to 4 layers"
      - "First post-PMAT-328 depth-5 broadening — adds Layer 2 to depth-5+ coverage"
    preconditions:
      - "one OutcomeSilver record"
    postconditions:
      - "Diamond depth-5 broadened: 4 contracts on 4 distinct layers"

  outcome_exit_code_int_sign_diamond:
    # PMAT-357: SIXTH Diamond on this contract — BROADENS DEPTH-6
    # from 3 to 4 LAYERS. After PMAT-356 opened depth-6 on Layer 4
    # (FFI-CPYTHON-EXT) — making depth-6 ACROSS 3 LAYERS
    # (L1+L4+L5) — PMAT-357 pushes Bashrs (Layer 2) from depth-5 to
    # depth-6. Depth-6 now spans 4 of 5 taxonomy layers
    # (L1+L2+L4+L5; only L3 remains at depth-5). OutcomeSilver
    # exit_code Int sign structure — cross-substrate parallel with
    # PMAT-328 (refcount_delta sign decomp on FFI-CPYTHON-EXT).
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.outcome_exit_code_int_sign_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      OutcomeSilver.exit_code Int sign structure:
        (a) sign trichotomy:        0 < c ∨ c = 0 ∨ c < 0
        (b) absolute value non-negativity
        (c) zero exit_code has zero absolute value
        (d) reflexivity
    domain: |
      Any OutcomeSilver record with its Int-valued exit_code field.
      The four properties together axiomatize the SEMANTIC SIGN
      STRUCTURE of exit_code — distinguishing success (zero) from
      non-zero failure modes.
    invariants:
      - "SIXTH Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — BROADENS DEPTH-6 from 3 to 4 LAYERS"
      - "INT-SIGN STRUCTURE template — cross-substrate parallel with PMAT-328 (refcount_delta on FFI-CPYTHON-EXT)"
      - "depth-6 now spans 4 of 5 taxonomy layers (L1+L2+L4+L5); only L3 remains at depth-5"
    preconditions:
      - "one OutcomeSilver record with Int-valued exit_code"
    postconditions:
      - "an emitter that conflated success (0) and failure (non-zero) modes would falsify (a) and (c)"
      - "Diamond depth-6 broadened: 4 contracts on 4 distinct layers"

  outcome_struct_extensionality_bronze_diamond:
    # PMAT-368: SEVENTH Diamond on this contract — BROADENS DEPTH-7
    # substrate-wide. Pushes Bashrs (Layer 2) from depth-6 to depth-7
    # as the second L2/non-L1-L5 contract at depth-7+. OUTCOME
    # (Bronze) STRUCTURE EXTENSIONALITY: the single-field Outcome
    # Bronze record (observable : String) is field-extensional with
    # decidable equality. Twenty-second substrate-wide demonstration
    # of the structure-extensionality pattern, captured on the
    # BRONZE-tier model (distinct from PMAT-329 which captured
    # OutcomeSilver, the Silver-tier model).
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.outcome_struct_extensionality_bronze_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      Outcome (Bronze) admits STRUCTURE EXTENSIONALITY:
        (a) field eq (observable) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two Outcome (Bronze) records (observable : String) with
      derived DecidableEq.
    invariants:
      - "SEVENTH Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — BROADENS DEPTH-7 substrate-wide"
      - "STRUCTURE EXTENSIONALITY — twenty-second substrate-wide demonstration of this pattern; captured on the BRONZE-tier model"
      - "distinct from PMAT-329 (struct-ext of OutcomeSilver, the Silver-tier record) — PMAT-368 captures the BRONZE Outcome record"
    preconditions:
      - "two Outcome records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-7 broadened"

  outcome_observable_length_bronze_nat_diamond:
    # PMAT-379: EIGHTH Diamond on this contract — BROADENS DEPTH-8
    # substrate-wide. Pushes Bashrs (Layer 2) from depth-7 to depth-8.
    # OUTCOME (Bronze) OBSERVABLE STRING.LENGTH NAT STRUCTURE: Nat
    # measure on the Bronze Outcome.observable field, distinct from
    # PMAT-346 (Silver-tier String.length on OutcomeSilver.observable).
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.outcome_observable_length_bronze_nat_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
      Outcome.observable (Bronze) String.length Nat structure:
        (a) length >= 0
        (b) empty observable has length 0
        (c) field-replacement preserves length
        (d) self-equal length
    domain: |
      Any Bronze Outcome record (observable : String).
    invariants:
      - "EIGHTH Diamond category on C-BASHRS-POSIX-IDEMPOTENCE — BROADENS DEPTH-8 substrate-wide"
      - "STRING.LENGTH NAT-MEASURE on Bronze Outcome (distinct from PMAT-346 on Silver OutcomeSilver)"
    preconditions:
      - "one Outcome record"
    postconditions:
      - "Diamond depth-8 broadened"

  successful_outcome_subtype_extensionality_diamond:
    # PMAT-390: NINTH Diamond on this contract — BROADENS DEPTH-9
    # substrate-wide. Pushes Bashrs (Layer 2) from depth-8 to depth-9.
    # SUCCESSFUL-OUTCOME SUBTYPE EXTENSIONALITY: the Gold-tier
    # SuccessfulOutcome := { o : OutcomeSilver // o.exit_code = 0 }
    # admits subtype extensionality. SECOND substrate-wide
    # subtype-extensionality demonstration after PMAT-311
    # (BoundedSmem on C-COMPILE-RUST-TO-PTX-MMA). Captures the
    # Gold-tier refinement-subtype pattern on Bashrs.
    lean_theorem: "XpileContracts.CBashrsPosixIdempotence.successful_outcome_subtype_extensionality_diamond"
    lean_file: "contracts/lean/Bashrs.lean"
    formula: |
