metadata:
  id: C-XPILE-CONTRACT-BACKEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile ContractBackend trait
    must satisfy. ContractBackend is the proof-lane sibling of Backend:
    it renders contracts into notation (LaTeX, Lean theorems, mdBook).
    Where Backend lowers meta-HIR to target code/IR (code lane), the
    ContractBackend renders the contract substrate to proof artifacts.

    Layer 3 of the contract taxonomy (architectural / xpile-internal),
    proof-lane.

    Citation-bridge invariant (lean_theorem_name_embeds_contract_id)
    encodes foundational design decision #4 (2026-05-15): every Lean
    theorem rendered from a contract must be wrapped in a namespace
    whose path encodes the contract ID, making theorem ↔ contract
    regex-recoverable in either direction.
  references:
    - docs/specifications/sub/contract-backend-trait.md
    - docs/specifications/sub/contract-taxonomy.md
    - contracts/xpile-frontend-trait-v1.yaml
    - contracts/xpile-contract-frontend-trait-v1.yaml
  depends_on:
    - C-XPILE-CONTRACT-FRONTEND-TRAIT

equations:
  format_ownership:
    formula: |
      forall fmt in registered_formats: exists exactly one cb: fmt in cb.formats()
    domain: |
      registered_formats is the union of formats() across all
      ContractBackend implementations registered with a TranspileSession.
    invariants:
      - "no two contract backends declare the same ContractFormat variant"
      - "every dispatched format reaches exactly one render call"
    preconditions:
      - "TranspileSession::register_contract_backend has been called for every active impl"

  render_idempotency:
    formula: |
      forall (contract, config): hash(cb.render(contract, config).unwrap()) == hash(cb.render(contract, config).unwrap())
    domain: |
      Two renders of the same (contract, config) yield byte-identical
      RenderedDoc when run in the same process.
    invariants:
      - "no timestamps in the default rendered output"
      - "no random salts in autogenerated labels"
      - "BTreeMap ordering throughout"
    preconditions:
      - "config.format is supported by this ContractBackend"
      - "config.lean_version, when set, is (4, _) (decision #1)"

  citation_round_trip:
    formula: |
      forall (contract, config): contract.depends_on union contract.references subset RenderedDoc.citations
    domain: |
      Every ContractId in the input contract's depends_on or references
      fields must appear in the rendered document's citations field,
      AND (when config.embed_citation is true) textually in primary.
    invariants:
      - "no dependency dropped"
      - "no reference dropped"
      - "when embed_citation == true: every cited ID is parseable from primary via the host format's STRUCTURED parser (Lean attribute table, LaTeX \\label/\\ref, mdBook structured-comment preprocessor) — NOT by regex over body text"
    preconditions: []

  citation_via_structured_attribute:
    formula: |
      forall theorem T in rendered.primary when config.format == LeanTheorem:
        exists attr in attributes_of(T):
          attr.name == "xpile_contract" AND attr.args[0] == contract.metadata.id (verbatim, no dash->underscore mangling)
      AND
      forall theorem env E in rendered.primary when config.format == LatexMath:
        exists \xpileContract{contract.metadata.id}{eq} preceding E
      AND
      forall theorem block B in rendered.primary when config.format == MdBook:
        exists <!-- xpile-contract: contract.metadata.id --> preceding B
    domain: |
      Every theorem, lemma, or theorem-class environment emitted by any
      ContractBackend for the supported formats (LeanTheorem, LatexMath,
      MdBook). Revised post-2026-05-15 audit (audit-design.md §4
      "Citation Bridge Fragility") to use format-native structured
      constructs in place of regex over text.
    invariants:
      - "Lean: @[xpile_contract] attribute is parsed by Lean's elaborator; malformed citation fails at compile time"
      - "LaTeX: \\xpileContract{}{} expands to a \\label parseable by latexmk/biblatex; manual rename of theorem env does not lose citation"
      - "mdBook: <!-- xpile-contract: ID --> uses a fixed grammar parsed by xpile-mdbook-preprocessor; bare-regex misuse rejected at preprocess time"
      - "contract ID is preserved verbatim across all formats (no dash->underscore mangling)"
      - "no two distinct contracts produce attributes / labels / comments with the same (id, equation) tuple"
    preconditions:
      - "config.format ∈ {ContractFormat::LeanTheorem, ContractFormat::LatexMath, ContractFormat::MdBook}"
      - "contract.metadata.id matches /^C-[A-Z0-9-]+$/"

  falsification_render_optional:
    formula: |
      config.include_falsification == false => no FALSIFY-* artifacts in rendered.primary
      config.include_falsification == true  => every falsification_test surfaces as a \\begin{remark} (LaTeX) or `-- FALSIFY-<ID>` block (Lean) or > **Falsification:** block (mdBook)
    domain: |
      Any rendering of a contract that has at least one falsification_test.
    invariants:
      - "the boolean flag is honored — no partial rendering"
      - "when true: 1-to-1 surface coverage (no test dropped silently)"
    preconditions: []

proof_obligations:
  - type: invariant
    property: Every registered format is owned by exactly one ContractBackend
    formal: "∀ fmt ∈ registered_formats: |{ cb | fmt ∈ cb.formats() }| == 1"
    applies_to: format_ownership

  - type: invariant
    property: render is deterministic per (contract, config)
    formal: "∀ c, cfg: hash(render(c, cfg)) == hash(render(c, cfg))"
    applies_to: render_idempotency

  - type: invariant
    property: All declared citations survive into rendered output
    formal: "contract.depends_on ∪ contract.references ⊆ rendered.citations"
    applies_to: citation_round_trip

  - type: postcondition
    property: Citations are parseable via structured host-format parser, not regex
    formal: "config.embed_citation ⟹ ∀ c ∈ rendered.citations : c is recoverable via structured_parse(rendered.primary, config.format)"
    applies_to: citation_round_trip

  - type: invariant
    property: Lean theorems carry an @[xpile_contract] attribute with verbatim contract ID
    formal: "config.format == LeanTheorem ⟹ ∀ thm ∈ rendered : ∃ attr ∈ thm.attributes : attr.name == 'xpile_contract' ∧ attr.args[0] == C.id"
    applies_to: citation_via_structured_attribute

  - type: invariant
    property: LaTeX theorem environments are preceded by \xpileContract{}{} macro
    formal: "config.format == LatexMath ⟹ ∀ env ∈ theorem_envs(rendered) : ∃ macro_call preceding env : macro_call == \\xpileContract{C.id}{eq_name}"
    applies_to: citation_via_structured_attribute

  - type: invariant
    property: mdBook theorem blocks are preceded by structured xpile-contract comment
    formal: "config.format == MdBook ⟹ ∀ block ∈ theorem_blocks(rendered) : ∃ comment preceding block : comment matches /<!-- xpile-contract: C.id -->/"
    applies_to: citation_via_structured_attribute

  - type: postcondition
    property: Falsification flag is honored 1:1
    formal: "config.include_falsification == true ⟺ |FALSIFY blocks in rendered| == |contract.falsification_tests|"
    applies_to: falsification_render_optional

  - type: frame
    property: render does not mutate the input contract or config
    formal: "modifies() == ∅"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XPILE-CBACK-001
    rule: |
      Two distinct ContractBackends MUST NOT both claim the same
      ContractFormat variant.
    prediction: |
      A TranspileSession that registers two ContractBackends with
      overlapping formats() either rejects the second or panics in test.
    test: |
      cargo test -p xpile-core --test contract_backend_dispatch -- duplicate_format
    if_fails: |
      Dispatch is ambiguous. The proof lane cannot decide which renderer
      to invoke for ContractFormat::LeanTheorem (or LatexMath).
    ship_blocking: true
    counter_example_classes:
      - duplicate_format
      - aliased_format

  - id: FALSIFY-XPILE-CBACK-002
    rule: |
      render MUST be deterministic for fixed (contract, config).
    prediction: |
      Two consecutive renders of the same (contract, config) hash equal.
    test: |
      cargo test -p xpile-contract-backend --test idempotency
    if_fails: |
      Timestamp or random salt leaked into output. Cache hits become
      false negatives; paper diffs noisy across regenerations.
    ship_blocking: true
    counter_example_classes:
      - embedded_timestamp
      - random_label_salt
      - hashmap_iteration_order

  - id: FALSIFY-XPILE-CBACK-003
    rule: |
      Every ContractId in contract.depends_on or contract.references
      MUST appear in RenderedDoc.citations.
    prediction: |
      Render a contract with 2 depends_on and 3 references; resulting
      citations list has at least 5 distinct ContractId entries.
    test: |
      cargo test -p xpile-contract-backend --test citation_round_trip
    if_fails: |
      Audit chain broken on the rendering side. A contract depends on
      another contract; the rendered paper / Lean file does not show it.
    ship_blocking: true
    counter_example_classes:
      - dependency_dropped
      - reference_dropped

  - id: FALSIFY-XPILE-CBACK-004
    rule: |
      When config.embed_citation is true, every cited ContractId MUST be
      recoverable from RenderedDoc.primary via the host format's
      STRUCTURED parser (not by regex over text body). Revised
      post-2026-05-15 audit (audit-design.md §4 "Citation Bridge
      Fragility").
    prediction: |
      Rendering a contract that cites C-X with embed_citation: true:
        - Lean: parse_lean_attributes(rendered.primary) yields an
          attribute table containing `xpile_contract` with arg "C-X"
        - LaTeX: parse_labels(rendered.primary) contains a label
          starting with "xpile:C-X:"
        - mdBook: xpile-mdbook-preprocessor's index contains "C-X"
    test: |
      cargo test -p xpile-contract-backend --test citation_structurally_parseable
    if_fails: |
      A reader CAN find the cite by regex, but the structural parser
      (Lean elaborator, LaTeX label, mdBook preprocessor) cannot.
      That means an audit tool walking the structured table will miss
      it — audit chain breaks silently on refactor.
    ship_blocking: true
    counter_example_classes:
      - metadata_only_citation
      - text_only_no_attribute
      - regex_recoverable_but_not_structurally_parseable

  - id: FALSIFY-XPILE-CBACK-005
    rule: |
      For ContractFormat::LeanTheorem, every emitted theorem MUST carry
      an `@[xpile_contract "C-X", xpile_equation "name"]` attribute with
      the contract ID as the first argument (verbatim — no
      dash-to-underscore mangling). The attribute MUST be parseable by
      Lean's elaborator. Revised post-2026-05-15 audit.
    prediction: |
      Rendering contract C-XLATE-PY-LIST-TO-VEC to Lean produces output
      where `lake env lean --print-attributes <file>` lists every
      emitted theorem with `xpile_contract` attribute, args[0] == the
      string "C-XLATE-PY-LIST-TO-VEC" (verbatim).
    test: |
      cargo test -p xpile-lean-contract-backend --test theorem_attribute_present
    if_fails: |
      Citation bridge for Lean is broken. Either the attribute is
      missing, or the contract ID was mangled (e.g., dash-to-underscore).
      Tooling cannot recover provenance via Lean.Meta API.
    ship_blocking: true
    counter_example_classes:
      - missing_attribute
      - mangled_contract_id
      - attribute_args_swapped
      - attribute_unparseable_by_elaborator

  - id: FALSIFY-XPILE-CBACK-006
    rule: |
      When include_falsification is false, NO falsification artifacts
      appear in rendered output. When true, EACH falsification_test
      surfaces (1:1).
    prediction: |
      For a contract with N falsification_tests:
        - render with include_falsification=false → 0 FALSIFY blocks
        - render with include_falsification=true  → N FALSIFY blocks
    test: |
      cargo test -p xpile-contract-backend --test falsification_flag_honored
    if_fails: |
      Flag is ignored or partially honored. Either falsification tests
      bleed into "clean" paper rendering, or they get silently dropped
      from the audit-targeted rendering.
    ship_blocking: true
    counter_example_classes:
      - flag_ignored
      - partial_render
      - leaked_falsification

  - id: FALSIFY-XPILE-CBACK-007
    rule: |
      render MUST NOT mutate the input Contract or ContractRenderConfig.
    prediction: |
      hash(contract, config) before == hash(contract, config) after render().
    test: |
      cargo test -p xpile-contract-backend --test render_no_mutation
    if_fails: |
      Hidden side effects break render-caching and multi-backend pipelines.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect
      - in_place_normalization

kani_harnesses:
  - id: KANI-XPILE-CBACK-001
    obligation: format_ownership
    bound: 4
    property: |
      For up to 4 registered contract backends with up to 2 formats each,
      no ContractFormat appears in more than one backend's formats() list.
    harness: |
      #[kani::proof]
      fn cback_format_ownership() {
          let backends: [Vec<ContractFormat>; 4] = kani::any();
          let union: Vec<ContractFormat> = backends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for fmt in union {
              kani::assume(seen.insert(fmt));
          }
      }

  - id: KANI-XPILE-CBACK-002
    obligation: invariant
    bound: 1
    property: |
      For a contract whose id is a bounded uppercase-with-dash string,
      every theorem in the rendered Lean output carries an
      @[xpile_contract "<id>"] attribute with the contract ID preserved
      VERBATIM (no dash->underscore mangling). Revised post-2026-05-15
      audit to use Kani-side attribute introspection instead of
      namespace-string matching.
    harness: |
      #[kani::proof]
      fn lean_attribute_carries_verbatim_id() {
          let id_bytes: [u8; 16] = kani::any();
          kani::assume(id_bytes.iter().all(|c| c.is_ascii_uppercase() || *c == b'-'));
          let id = std::str::from_utf8(&id_bytes).unwrap_or("");
          let contract = Contract::stub_with_id(id);
          let cfg = ContractRenderConfig {
              format: ContractFormat::LeanTheorem,
              embed_citation: true,
              include_falsification: false,
              lean_version: Some((4, 0)),
          };
          let rendered = render_to_lean(&contract, &cfg);
          // Parse Lean attributes from rendered output (does NOT use regex).
          for thm in extract_theorems_via_lean_parser(&rendered.primary) {
              let attrs = thm.attributes();
              let xc = attrs.iter().find(|a| a.name == "xpile_contract");
              assert!(xc.is_some(), "every theorem must carry @[xpile_contract ...]");
              let first_arg = xc.unwrap().args.get(0).expect("attribute must have args");
              // Verbatim equality — no mangling.
              assert_eq!(first_arg.as_str(), id);
          }
      }
