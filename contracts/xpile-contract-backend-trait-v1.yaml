metadata:
  id: C-XPILE-CONTRACT-BACKEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile ContractBackend trait
    must satisfy. ContractBackend is the proof-lane sibling of Backend:
    it renders contracts into notation (LaTeX, Lean theorems, mdBook).
    Where Backend lowers meta-HIR to target code/IR (code lane), the
    ContractBackend renders the contract substrate to proof artifacts.

    Layer 3 of the contract taxonomy (architectural / xpile-internal),
    proof-lane.

    Citation-bridge invariant (lean_theorem_name_embeds_contract_id)
    encodes foundational design decision #4 (2026-05-15): every Lean
    theorem rendered from a contract must be wrapped in a namespace
    whose path encodes the contract ID, making theorem ↔ contract
    regex-recoverable in either direction.
  references:
    - docs/specifications/sub/contract-backend-trait.md
    - docs/specifications/sub/contract-taxonomy.md
    - contracts/xpile-frontend-trait-v1.yaml
    - contracts/xpile-contract-frontend-trait-v1.yaml
  depends_on:
    - C-XPILE-CONTRACT-FRONTEND-TRAIT

equations:
  format_ownership:
    formula: |
      forall fmt in registered_formats: exists exactly one cb: fmt in cb.formats()
    domain: |
      registered_formats is the union of formats() across all
      ContractBackend implementations registered with a TranspileSession.
    invariants:
      - "no two contract backends declare the same ContractFormat variant"
      - "every dispatched format reaches exactly one render call"
    preconditions:
      - "TranspileSession::register_contract_backend has been called for every active impl"

  render_idempotency:
    # PMAT-068: Lean refinement theorem locks in the determinism
    # modelling commitment for ContractBackend::render. See
    # contracts/lean/XpileContractBackendTrait.lean for the proof.
    # Completes the 2×2 trait-determinism matrix with
    # PMAT-062/064/066.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.render_idempotency"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    # PMAT-069: Kani harness completes the §14.4 quorum. Final
    # corner of the 2×2 trait-determinism matrix at QUORUM:
    # paired Lean+Kani discharges for every trait method.
    kani_harness: "render_idempotency"
    kani_file: "contracts/kani/xpile_contract_backend_trait.rs"
    formula: |
      forall (contract, config): hash(cb.render(contract, config).unwrap()) == hash(cb.render(contract, config).unwrap())
    domain: |
      Two renders of the same (contract, config) yield byte-identical
      RenderedDoc when run in the same process.
    invariants:
      - "no timestamps in the default rendered output"
      - "no random salts in autogenerated labels"
      - "BTreeMap ordering throughout"
    preconditions:
      - "config.format is supported by this ContractBackend"
      - "config.lean_version, when set, is (4, _) (decision #1)"

  citation_round_trip:
    # PMAT-159 / XPILE-REFINE-CONTRACT-BACKEND-TRAIT-001: Silver-tier
    # refinement theorem. Introduces typed Contract + RenderedDocSilver
    # with explicit citations field. Proves
    # `RenderedDoc.citations = depends_on ++ references` structurally.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.citation_round_trip_silver"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    # PMAT-285: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat — TENTH Path α contract. Citation-set
    # preservation property with concat order (depends_on ++
    # references). Bronze byte-payload model couldn't catch a backend
    # that filters self-citations, drops IDs by regex, or swaps the
    # depends_on/references order. Silver introduces explicit
    # citations field and proves no drop + correct order. Companion
    # harness render_idempotency_silver re-proves idempotency at the
    # structured level.
    kani_harness: "citation_round_trip_silver"
    kani_file: "contracts/kani/xpile_contract_backend_trait.rs"
    formula: |
      forall (contract, config): contract.depends_on union contract.references subset RenderedDoc.citations
    domain: |
      Every ContractId in the input contract's depends_on or references
      fields must appear in the rendered document's citations field,
      AND (when config.embed_citation is true) textually in primary.
    invariants:
      - "no dependency dropped"
      - "no reference dropped"
      - "when embed_citation == true: every cited ID is parseable from primary via the host format's STRUCTURED parser (Lean attribute table, LaTeX \\label/\\ref, mdBook structured-comment preprocessor) — NOT by regex over body text"
    preconditions: []

  citation_complete_contract_gold:
    # PMAT-197 / XPILE-REFINE-CONTRACT-BACKEND-TRAIT-002: TWELFTH
    # Gold-tier refinement in the substrate. COMPLETES the 2×2
    # trait matrix at Gold tier (4/4 trait contracts now Gold)
    # AND brings Gold coverage to 12/12 across the entire
    # substrate. Uses cross-field equality Gold pattern from
    # PMAT-194/195. CitationCompleteContract := { p : Contract ×
    # RenderedDocSilver // p.snd.citations = p.fst.depends_on ++
    # p.fst.references } pairs contract with rendered doc under
    # type-level proof of citation completeness. Companion
    # theorems citation_completeness_witness_gold and
    # gold_contract_backend_agrees_with_silver.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.citation_complete_contract_gold"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      render_gold(c).doc.citations
        == render_gold(c).contract.depends_on
            ++ render_gold(c).contract.references
      BY TYPE  (citation-completeness witness travels with the pair)
    domain: |
      Same as citation_round_trip — every ContractBackend impl.
      The Gold upgrade encodes the citation-completeness invariant
      at the type level via a pair-with-witness refinement subtype.
    invariants:
      - "CitationCompleteContract pairs Contract with RenderedDocSilver under a TYPE-LEVEL proof that citations = depends_on ++ references"
      - "citation-completeness witness travels with the pair — no per-call-site re-proof"
      - "PMAT-197 closes the 2×2 trait matrix at Gold (PMAT-194 frontend, PMAT-195 backend, PMAT-196 contract-frontend, PMAT-197 contract-backend)"
      - "with PMAT-197 landed, ALL 12 contracts in the substrate have at least one Gold-tier refinement theorem — Gold-tier universally established"
    preconditions:
      - "the ContractBackend impl is well-formed (Silver model preconditions inherited)"
    postconditions:
      - "an emitter returning a (contract, doc) pair where citations ≠ depends_on ++ references would not type-check against render_gold"
      - "Gold-tier coverage is now universal across the substrate (12/12 contracts)"

  render_homomorphism_platinum:
    # PMAT-212 / XPILE-REFINE-CONTRACT-BACKEND-TRAIT-003:
    # THIRTEENTH Platinum-tier refinement in the substrate.
    # Extends Platinum coverage to 11 of 12 contracts. FIFTH
    # demonstration of the functoriality / monoid-homomorphism
    # Platinum pattern (after PMAT-202/207/208/209). Captures
    # the render function as a monoid homomorphism over the
    # (Array ContractId, ++, #[]) composition. Companion
    # theorems render_preserves_empty_platinum (identity)
    # and contract_composition_associative_platinum
    # (associativity).
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.render_homomorphism_platinum"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      render(compose(c1, c2)).citations
        == (c1.depends_on ++ c2.depends_on)
            ++ (c1.references ++ c2.references)
      (functoriality / monoid homomorphism)
    domain: |
      Any two Contract values composed via per-component array
      concatenation. The Platinum upgrade captures the
      homomorphism property over the (Array ContractId, ++, #[])
      monoid.
    invariants:
      - "THIRTEENTH Platinum theorem; FIFTH demonstration of functoriality / monoid-homomorphism pattern"
      - "render is a STRICT MONOID HOMOMORPHISM (preserves identity + associativity + binary operation)"
      - "completes functoriality demonstration across FIVE distinct contract-lane types: code (PMAT-202/207), notation (PMAT-208), proof (PMAT-209), Layer-3 trait (PMAT-212)"
      - "establishes the functoriality Platinum pattern is UNIVERSAL across the contract taxonomy"
    preconditions:
      - "two well-formed Contract values"
      - "no special preconditions — Array concatenation is universal"
    postconditions:
      - "an emitter that does citation deduplication during contract composition would falsify the homomorphism — caught at the Platinum theorem level"
      - "the substrate has now demonstrated functoriality on FIVE distinct contract domains, confirming the pattern's universality"

  citation_render_monoid_diamond:
    # PMAT-226 / XPILE-REFINE-CONTRACT-BACKEND-TRAIT-004: TWELFTH
    # Diamond-tier refinement. UNIVERSAL Diamond milestone — all
    # 12 contracts now have Diamond coverage. Combines PMAT-212
    # render homomorphism + associativity + left/right identity
    # into the CITATION RENDER MONOID axiomatization.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.citation_render_monoid_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      citation rendering forms a MONOID:
        (a) homomorphism (PMAT-212 lifted)
        (b) associativity (PMAT-212 companion)
        (c) left identity (empty contract on depends_on)
        (d) right identity
    domain: |
      Any three Contract values composed via per-component array
      concatenation. The Diamond upgrade captures the FULL
      citation-render-monoid axiomatization.
    invariants:
      - "TWELFTH Diamond-tier theorem — UNIVERSAL Diamond milestone"
      - "every one of the 12 contracts in the substrate now has at least one Diamond theorem"
      - "tier progression Bronze → Silver → Gold → Platinum → Diamond is now UNIVERSAL across the substrate"
    preconditions:
      - "three well-formed Contract values"
    postconditions:
      - "citation render monoid structure is captured fully at the Diamond level"
      - "the substrate has achieved UNIVERSAL refinement-tier coverage at all 5 tiers"

  contract_product_monoid_diamond:
    # PMAT-239 / XPILE-REFINE-CONTRACT-BACKEND-TRAIT-005: SECOND
    # Diamond on this contract — Layer 3 contract-lane depth-2.
    # COMPLETES UNIVERSAL Diamond depth-2 across ALL 12
    # CONTRACTS in the substrate. Distinct algebraic category
    # from PMAT-226 citation render-monoid (single-field) vs
    # contract product-monoid (both depends_on × references
    # fields as free product of two array-monoids).
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.contract_product_monoid_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      contract composition forms a PRODUCT MONOID across
      (depends_on × references) fields:
        (a) depends_on homomorphism (PMAT-212 lifted)
        (b) references homomorphism (companion)
        (c) Left identity on depends_on (empty contract)
        (d) Left identity on references (empty contract)
    domain: |
      Any two Contract values c1, c2. The Diamond upgrade
      captures the FULL product-monoid structure simultaneously
      on both array fields.
    invariants:
      - "SECOND Diamond category on C-XPILE-CONTRACT-BACKEND-TRAIT — completes UNIVERSAL Diamond depth-2 across ALL 12 contracts"
      - "distinct algebraic category from PMAT-226 single-field render-monoid"
      - "captures PRODUCT-MONOID structure: component-wise operations on (depends_on × references)"
    preconditions:
      - "two well-formed Contract values"
    postconditions:
      - "an emitter that lowers depends_on correctly but introduces hidden coupling (e.g., always setting references = depends_on) would falsify (b)"
      - "UNIVERSAL Diamond depth-2 milestone: every contract in the substrate now has at least 2 distinct Diamond categories"

  citation_via_structured_attribute:
    formula: |
      forall theorem T in rendered.primary when config.format == LeanTheorem:
        exists attr in attributes_of(T):
          attr.name == "xpile_contract" AND attr.args[0] == contract.metadata.id (verbatim, no dash->underscore mangling)
      AND
      forall theorem env E in rendered.primary when config.format == LatexMath:
        exists \xpileContract{contract.metadata.id}{eq} preceding E
      AND
      forall theorem block B in rendered.primary when config.format == MdBook:
        exists <!-- xpile-contract: contract.metadata.id --> preceding B
    domain: |
      Every theorem, lemma, or theorem-class environment emitted by any
      ContractBackend for the supported formats (LeanTheorem, LatexMath,
      MdBook). Revised post-2026-05-15 audit (audit-design.md §4
      "Citation Bridge Fragility") to use format-native structured
      constructs in place of regex over text.
    invariants:
      - "Lean: @[xpile_contract] attribute is parsed by Lean's elaborator; malformed citation fails at compile time"
      - "LaTeX: \\xpileContract{}{} expands to a \\label parseable by latexmk/biblatex; manual rename of theorem env does not lose citation"
      - "mdBook: <!-- xpile-contract: ID --> uses a fixed grammar parsed by xpile-mdbook-preprocessor; bare-regex misuse rejected at preprocess time"
      - "contract ID is preserved verbatim across all formats (no dash->underscore mangling)"
      - "no two distinct contracts produce attributes / labels / comments with the same (id, equation) tuple"
    preconditions:
      - "config.format ∈ {ContractFormat::LeanTheorem, ContractFormat::LatexMath, ContractFormat::MdBook}"
      - "contract.metadata.id matches /^C-[A-Z0-9-]+$/"

  falsification_render_optional:
    formula: |
      config.include_falsification == false => no FALSIFY-* artifacts in rendered.primary
      config.include_falsification == true  => every falsification_test surfaces as a \\begin{remark} (LaTeX) or `-- FALSIFY-<ID>` block (Lean) or > **Falsification:** block (mdBook)
    domain: |
      Any rendering of a contract that has at least one falsification_test.
    invariants:
      - "the boolean flag is honored — no partial rendering"
      - "when true: 1-to-1 surface coverage (no test dropped silently)"
    preconditions: []

  contract_struct_extensionality_diamond:
    # PMAT-333: THIRD Diamond on this contract — BROADENS DEPTH-3
    # from 8 to 9 contracts. Pushes XpileContractBackendTrait
    # (Layer 3) from depth-2 to depth-3, adding a FOURTH Layer 3
    # contract at depth-3. Sixth substrate-wide demonstration of
    # structure-extensionality pattern.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.contract_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      Contract admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two Contract records (depends_on, references : Array ContractId).
    invariants:
      - "THIRD Diamond category — BROADENS DEPTH-3 from 8 to 9 contracts"
      - "SIXTH substrate-wide demonstration of structure-extensionality pattern"
    preconditions:
      - "two Contract records"
    postconditions:
      - "Diamond depth-3 broadened: 9 contracts at depth-3+"

  contract_array_size_diamond:
    # PMAT-341: FOURTH Diamond on this contract — BROADENS DEPTH-4
    # from 8 to 9 contracts. Pushes XpileContractBackendTrait
    # (Layer 3) from depth-3 to depth-4, adding FOURTH Layer 3
    # contract at depth-4. CONTRACT.depends_on/references ARRAY
    # SIZE STRUCTURE.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.contract_array_size_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      Contract.depends_on and .references Array.size structure:
        (a) depends_on.size ≥ 0
        (b) Empty Contract has size-0 depends_on
        (c) Field-replacement preserves depends_on size
        (d) references is independent
    domain: |
      Any Contract record.
    invariants:
      - "FOURTH Diamond category — BROADENS DEPTH-4 from 8 to 9 contracts"
    preconditions:
      - "one Contract record"
    postconditions:
      - "Diamond depth-4 broadened: 9 contracts at depth-4+"

  contract_id_struct_extensionality_diamond:
    # PMAT-354: FIFTH Diamond on this contract — COMPLETES DEPTH-5
    # UNIVERSAL ACROSS ALL 12 CONTRACTS. SUBSTRATE MILESTONE: every
    # contract now has ≥5 distinct Diamond categories. Pushes
    # XpileContractBackendTrait (Layer 3) from depth-4 to depth-5,
    # which was the LAST contract at depth-4 only. CONTRACT-ID
    # STRUCTURE EXTENSIONALITY: the inner ContractId record (bytes :
    # Array UInt8) is field-extensional with decidable equality.
    # Thirteenth substrate-wide demonstration of the
    # structure-extensionality pattern.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.contract_id_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      ContractId admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two ContractId records (bytes : Array UInt8) — the INNER
      identifier record stored inside Contract.depends_on and
      Contract.references arrays.
    invariants:
      - "FIFTH Diamond category on C-XPILE-CONTRACT-BACKEND-TRAIT — COMPLETES DEPTH-5 UNIVERSAL ACROSS ALL 12 CONTRACTS"
      - "Substrate milestone: every contract has ≥5 distinct Diamond categories"
      - "STRUCTURE EXTENSIONALITY — thirteenth substrate-wide demonstration of this pattern"
      - "distinct from PMAT-333 (outer Contract record) — captures the INNER ContractId structure"
      - "mirror of PMAT-353 (EquationsBlock on the Frontend-trait side) — closes inner-record extensionality on both sides of the trait pair"
    preconditions:
      - "two ContractId records (DecidableEq derived)"
    postconditions:
      - "DEPTH-5 UNIVERSAL achieved: 12 contracts at depth-5+"

  rendered_doc_silver_struct_extensionality_diamond:
    # PMAT-364: SIXTH Diamond on this contract — BROADENS DEPTH-6
    # substrate-wide. Pushes XpileContractBackendTrait (Layer 3) from
    # depth-5 to depth-6. RENDERED-DOC-SILVER STRUCTURE EXTENSIONALITY:
    # the 2-field RenderedDocSilver record (bytes, citations) is
    # field-extensional with decidable equality. Twentieth
    # substrate-wide demonstration of the structure-extensionality
    # pattern.
    lean_theorem: "XpileContracts.CXpileContractBackendTrait.rendered_doc_silver_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileContractBackendTrait.lean"
    formula: |
      RenderedDocSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq (bytes, citations) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two RenderedDocSilver records (bytes : Array UInt8, citations :
      Array ContractId) with derived DecidableEq.
    invariants:
      - "SIXTH Diamond category on C-XPILE-CONTRACT-BACKEND-TRAIT — BROADENS DEPTH-6 substrate-wide"
      - "STRUCTURE EXTENSIONALITY — twentieth substrate-wide demonstration of this pattern"
    preconditions:
      - "two RenderedDocSilver records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-6 broadened: contracts at depth-6+"

proof_obligations:
  - type: invariant
    property: Every registered format is owned by exactly one ContractBackend
    formal: "∀ fmt ∈ registered_formats: |{ cb | fmt ∈ cb.formats() }| == 1"
    applies_to: format_ownership

  - type: invariant
    property: render is deterministic per (contract, config)
    formal: "∀ c, cfg: hash(render(c, cfg)) == hash(render(c, cfg))"
    applies_to: render_idempotency

  - type: invariant
    property: All declared citations survive into rendered output
    formal: "contract.depends_on ∪ contract.references ⊆ rendered.citations"
    applies_to: citation_round_trip

  - type: postcondition
    property: Citations are parseable via structured host-format parser, not regex
    formal: "config.embed_citation ⟹ ∀ c ∈ rendered.citations : c is recoverable via structured_parse(rendered.primary, config.format)"
    applies_to: citation_round_trip

  - type: invariant
    property: Lean theorems carry an @[xpile_contract] attribute with verbatim contract ID
    formal: "config.format == LeanTheorem ⟹ ∀ thm ∈ rendered : ∃ attr ∈ thm.attributes : attr.name == 'xpile_contract' ∧ attr.args[0] == C.id"
    applies_to: citation_via_structured_attribute

  - type: invariant
    property: LaTeX theorem environments are preceded by \xpileContract{}{} macro
    formal: "config.format == LatexMath ⟹ ∀ env ∈ theorem_envs(rendered) : ∃ macro_call preceding env : macro_call == \\xpileContract{C.id}{eq_name}"
    applies_to: citation_via_structured_attribute

  - type: invariant
    property: mdBook theorem blocks are preceded by structured xpile-contract comment
    formal: "config.format == MdBook ⟹ ∀ block ∈ theorem_blocks(rendered) : ∃ comment preceding block : comment matches /<!-- xpile-contract: C.id -->/"
    applies_to: citation_via_structured_attribute

  - type: postcondition
    property: Falsification flag is honored 1:1
    formal: "config.include_falsification == true ⟺ |FALSIFY blocks in rendered| == |contract.falsification_tests|"
    applies_to: falsification_render_optional

  - type: frame
    property: render does not mutate the input contract or config
    formal: "modifies() == ∅"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XPILE-CBACK-001
    rule: |
      Two distinct ContractBackends MUST NOT both claim the same
      ContractFormat variant.
    prediction: |
      A TranspileSession that registers two ContractBackends with
      overlapping formats() either rejects the second or panics in test.
    test: |
      cargo test -p xpile-core --test contract_backend_dispatch -- duplicate_format
    if_fails: |
      Dispatch is ambiguous. The proof lane cannot decide which renderer
      to invoke for ContractFormat::LeanTheorem (or LatexMath).
    ship_blocking: true
    counter_example_classes:
      - duplicate_format
      - aliased_format

  - id: FALSIFY-XPILE-CBACK-002
    rule: |
      render MUST be deterministic for fixed (contract, config).
    prediction: |
      Two consecutive renders of the same (contract, config) hash equal.
    test: |
      cargo test -p xpile-contract-backend --test idempotency
    if_fails: |
      Timestamp or random salt leaked into output. Cache hits become
      false negatives; paper diffs noisy across regenerations.
    ship_blocking: true
    counter_example_classes:
      - embedded_timestamp
      - random_label_salt
      - hashmap_iteration_order

  - id: FALSIFY-XPILE-CBACK-003
    rule: |
      Every ContractId in contract.depends_on or contract.references
      MUST appear in RenderedDoc.citations.
    prediction: |
      Render a contract with 2 depends_on and 3 references; resulting
      citations list has at least 5 distinct ContractId entries.
    test: |
      cargo test -p xpile-contract-backend --test citation_round_trip
    if_fails: |
      Audit chain broken on the rendering side. A contract depends on
      another contract; the rendered paper / Lean file does not show it.
    ship_blocking: true
    counter_example_classes:
      - dependency_dropped
      - reference_dropped

  - id: FALSIFY-XPILE-CBACK-004
    rule: |
      When config.embed_citation is true, every cited ContractId MUST be
      recoverable from RenderedDoc.primary via the host format's
      STRUCTURED parser (not by regex over text body). Revised
      post-2026-05-15 audit (audit-design.md §4 "Citation Bridge
      Fragility").
    prediction: |
      Rendering a contract that cites C-X with embed_citation: true:
        - Lean: parse_lean_attributes(rendered.primary) yields an
          attribute table containing `xpile_contract` with arg "C-X"
        - LaTeX: parse_labels(rendered.primary) contains a label
          starting with "xpile:C-X:"
        - mdBook: xpile-mdbook-preprocessor's index contains "C-X"
    test: |
      cargo test -p xpile-contract-backend --test citation_structurally_parseable
    if_fails: |
      A reader CAN find the cite by regex, but the structural parser
      (Lean elaborator, LaTeX label, mdBook preprocessor) cannot.
      That means an audit tool walking the structured table will miss
      it — audit chain breaks silently on refactor.
    ship_blocking: true
    counter_example_classes:
      - metadata_only_citation
      - text_only_no_attribute
      - regex_recoverable_but_not_structurally_parseable

  - id: FALSIFY-XPILE-CBACK-005
    rule: |
      For ContractFormat::LeanTheorem, every emitted theorem MUST carry
      an `@[xpile_contract "C-X", xpile_equation "name"]` attribute with
      the contract ID as the first argument (verbatim — no
      dash-to-underscore mangling). The attribute MUST be parseable by
      Lean's elaborator. Revised post-2026-05-15 audit.
    prediction: |
      Rendering contract C-XLATE-PY-LIST-TO-VEC to Lean produces output
      where `lake env lean --print-attributes <file>` lists every
      emitted theorem with `xpile_contract` attribute, args[0] == the
      string "C-XLATE-PY-LIST-TO-VEC" (verbatim).
    test: |
      cargo test -p xpile-lean-contract-backend --test theorem_attribute_present
    if_fails: |
      Citation bridge for Lean is broken. Either the attribute is
      missing, or the contract ID was mangled (e.g., dash-to-underscore).
      Tooling cannot recover provenance via Lean.Meta API.
    ship_blocking: true
    counter_example_classes:
      - missing_attribute
      - mangled_contract_id
      - attribute_args_swapped
      - attribute_unparseable_by_elaborator

  - id: FALSIFY-XPILE-CBACK-006
    rule: |
      When include_falsification is false, NO falsification artifacts
      appear in rendered output. When true, EACH falsification_test
      surfaces (1:1).
    prediction: |
      For a contract with N falsification_tests:
        - render with include_falsification=false → 0 FALSIFY blocks
        - render with include_falsification=true  → N FALSIFY blocks
    test: |
      cargo test -p xpile-contract-backend --test falsification_flag_honored
    if_fails: |
      Flag is ignored or partially honored. Either falsification tests
      bleed into "clean" paper rendering, or they get silently dropped
      from the audit-targeted rendering.
    ship_blocking: true
    counter_example_classes:
      - flag_ignored
      - partial_render
      - leaked_falsification

  - id: FALSIFY-XPILE-CBACK-007
    rule: |
      render MUST NOT mutate the input Contract or ContractRenderConfig.
    prediction: |
      hash(contract, config) before == hash(contract, config) after render().
    test: |
      cargo test -p xpile-contract-backend --test render_no_mutation
    if_fails: |
      Hidden side effects break render-caching and multi-backend pipelines.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect
      - in_place_normalization

kani_harnesses:
  - id: KANI-XPILE-CBACK-001
    obligation: format_ownership
    bound: 4
    property: |
      For up to 4 registered contract backends with up to 2 formats each,
      no ContractFormat appears in more than one backend's formats() list.
    harness: |
      #[kani::proof]
      fn cback_format_ownership() {
          let backends: [Vec<ContractFormat>; 4] = kani::any();
          let union: Vec<ContractFormat> = backends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for fmt in union {
              kani::assume(seen.insert(fmt));
          }
      }

  - id: KANI-XPILE-CBACK-002
    obligation: invariant
    bound: 1
    property: |
      For a contract whose id is a bounded uppercase-with-dash string,
      every theorem in the rendered Lean output carries an
      @[xpile_contract "<id>"] attribute with the contract ID preserved
      VERBATIM (no dash->underscore mangling). Revised post-2026-05-15
      audit to use Kani-side attribute introspection instead of
      namespace-string matching.
    harness: |
      #[kani::proof]
      fn lean_attribute_carries_verbatim_id() {
          let id_bytes: [u8; 16] = kani::any();
          kani::assume(id_bytes.iter().all(|c| c.is_ascii_uppercase() || *c == b'-'));
          let id = std::str::from_utf8(&id_bytes).unwrap_or("");
          let contract = Contract::stub_with_id(id);
          let cfg = ContractRenderConfig {
              format: ContractFormat::LeanTheorem,
              embed_citation: true,
              include_falsification: false,
              lean_version: Some((4, 0)),
          };
          let rendered = render_to_lean(&contract, &cfg);
          // Parse Lean attributes from rendered output (does NOT use regex).
          for thm in extract_theorems_via_lean_parser(&rendered.primary) {
              let attrs = thm.attributes();
              let xc = attrs.iter().find(|a| a.name == "xpile_contract");
              assert!(xc.is_some(), "every theorem must carry @[xpile_contract ...]");
              let first_arg = xc.unwrap().args.get(0).expect("attribute must have args");
              // Verbatim equality — no mangling.
              assert_eq!(first_arg.as_str(), id);
          }
      }
