proof_obligations:
  - type: precondition
    property: both Python and C frontends produced meta-HIR
    formal: "python_module.is_some() ∧ c_module.is_some()"
    applies_to: all
  - type: precondition
    property: FFI manifest reconciliation ran successfully
    formal: "manifest_complete == true ∧ unresolved_symbols == ∅"
    applies_to: manifest_completeness
  - type: postcondition
    property: end-to-end oracle pass on the fixture
    formal: "∀ x ∈ fixture: equal(hybrid(x), transpiled(x))"
    applies_to: oracle_endtoend_equivalence
  - type: postcondition
    property: no refcount leaks visible to a leak-tracker
    formal: "leaks_after_run() == ∅"
    applies_to: all
  - type: frame
    property: the original Python and C source files are not modified
    formal: "modifies() ⊆ {generated_rust_files, manifest, cache}"
    applies_to: all
  - type: invariant
    property: GIL is held wherever CPython API is touched
    formal: "∀ call ∈ python_to_c: gil_held(call)"
    applies_to: gil_invariant
  - type: bound
    property: ndarray passthrough is zero-copy
    formal: "∀ a ∈ ndarray_passthrough: copies(transpile(a)) == 0"
    applies_to: buffer_protocol_zero_copy

falsification_tests:
  - id: FALSIFY-FFI-CPY-001
    rule: |
      An error path that leaks refcount MUST be detected by the oracle.
    prediction: |
      A C extension whose error path forgets to DECREF an owned reference
      causes the leak tracker to report a non-empty leak set.
    test: |
      NO RUNNABLE FALSIFIER (PMAT-1459, measured 2026-07-29). This entry
      published `cargo test -p xpile-oracle --test
      ffi_refcount_leak_detection`. That test target does not exist in
      xpile-oracle, and no `#[test] fn ffi_refcount_leak_detection` exists
      anywhere in the workspace, so the command hard-errored at target
      resolution (`error: no test target named `ffi_refcount_leak_detection`
      in `xpile-oracle``) and never ran. The rule above is unchanged and may
      well be exercised by tests elsewhere in the tree; what was false is
      this command. Re-pointing this entry at a real falsifier is open work.
    if_fails: |
      Oracle is not instrumenting refcounts — the entire safety story
      for hybrid transpile depends on this catching leaks.
    ship_blocking: true
    counter_example_classes:
      - error_path_leak

  - id: FALSIFY-FFI-CPY-002
    rule: |
      Transpilation that copies a 1GB ndarray MUST violate the zero-copy
      contract and be rejected by CI.
    prediction: |
      copies(transpile(passthrough(ndarray_1GB))) == 0 must hold.
    test: |
      NO RUNNABLE FALSIFIER (PMAT-1459, measured 2026-07-29). This entry
      published `cargo test -p xpile-oracle --test ffi_ndarray_zero_copy`.
      That test target does not exist in xpile-oracle, and no `#[test] fn
      ffi_ndarray_zero_copy` exists anywhere in the workspace, so the
      command hard-errored at target resolution (`error: no test target
      named `ffi_ndarray_zero_copy` in `xpile-oracle``) and never ran. The
      rule above is unchanged and may well be exercised by tests elsewhere
      in the tree; what was false is this command. Re-pointing this entry at
      a real falsifier is open work.
    if_fails: |
      The translation introduced a defensive clone. Performance contract
      broken — this would make NumPy-heavy code unusably slow.
    ship_blocking: true
    counter_example_classes:
      - defensive_clone

  - id: FALSIFY-FFI-CPY-003
    rule: |
      Transpile missing a manifest entry for a Python→C call MUST fail
      manifest completeness.
    prediction: |
      Running the agent with an incomplete manifest exits with
      AgentError::ManifestIncomplete or budget-exhausted.
    test: |
      NO RUNNABLE FALSIFIER (PMAT-1459, measured 2026-07-29). This entry
      published `cargo test -p xpile-agent --test ffi_manifest_incomplete`.
      That test target does not exist in xpile-agent, and no `#[test] fn
      ffi_manifest_incomplete` exists anywhere in the workspace, so the
      command hard-errored at target resolution (`error: no test target
      named `ffi_manifest_incomplete` in `xpile-agent``) and never ran. The
      rule above is unchanged and may well be exercised by tests elsewhere
      in the tree; what was false is this command. Re-pointing this entry at
      a real falsifier is open work.
    if_fails: |
      The reconciliation step missed a call site — silent miscompile risk.
    ship_blocking: true
    counter_example_classes:
      - missed_call_site

  - id: FALSIFY-FFI-CPY-004
    rule: |
      A call site missing the GIL guard MUST be rejected.
    prediction: |
      Translation emits a #[pyo3::pyfunction] or equivalent that holds
      the GIL for the duration of the CPython API touch.
    test: |
      NO RUNNABLE FALSIFIER (PMAT-1459, measured 2026-07-29). This entry
      published `cargo test -p xpile-rust-codegen --test ffi_gil_held`. That
      test target does not exist in xpile-rust-codegen, and no `#[test] fn
      ffi_gil_held` exists anywhere in the workspace, so the command
      hard-errored at target resolution (`error: no test target named
      `ffi_gil_held` in `xpile-rust-codegen``) and never ran. The rule above
      is unchanged and may well be exercised by tests elsewhere in the tree;
      what was false is this command. Re-pointing this entry at a real
      falsifier is open work.
    if_fails: |
      Some translation path emitted bare extern "C" without a GIL guard.
    ship_blocking: true
    counter_example_classes:
      - missing_gil_guard

  - id: FALSIFY-FFI-CPY-005
    rule: |
      End-to-end oracle MUST detect output divergence between hybrid and
      transpiled.
    prediction: |
      For any input where hybrid(x) != transpiled(x), oracle returns
      ComparisonResult::Divergence.
    test: |
      NO RUNNABLE FALSIFIER (PMAT-1459, measured 2026-07-29). This entry
      published `cargo test -p xpile-oracle --test ffi_endtoend_divergence`.
      That test target does not exist in xpile-oracle, and no `#[test] fn
      ffi_endtoend_divergence` exists anywhere in the workspace, so the
      command hard-errored at target resolution (`error: no test target
      named `ffi_endtoend_divergence` in `xpile-oracle``) and never ran. The
