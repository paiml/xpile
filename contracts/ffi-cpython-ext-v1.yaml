metadata:
  id: C-FFI-CPYTHON-EXT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    End-to-end pattern for hybrid transpiles where a Python module
    imports and calls into a CPython C extension (the most common
    case for NumPy / SciPy / Pandas etc.). The boundary semantics
    (refcounting, GIL, error propagation, buffer protocol) MUST be
    preserved when both sides are translated to Rust.

    Layer 4 of the xpile contract taxonomy (hybrid pipeline). This
    contract's existence justifies the entire xpile monorepo — it is
    impossible to discharge with depyler or decy alone.
  references:
    - "PEP 7 / PEP 384 (CPython C API stability)"
    - "Python/C API Reference Manual: Reference counting"
    - "Python/C API Reference Manual: Buffer Protocol"
    - docs/specifications/xpile-architecture-v1.md
    - docs/specifications/xpile-contract-driven-design-v1.md
    - contracts/xpile-frontend-trait-v1.yaml
    - contracts/xlate-py-list-to-vec-v1.yaml
  depends_on:
    - C-XPILE-FRONTEND-TRAIT

equations:
  manifest_completeness:
    # PMAT-076: Lean refinement theorem locks in the manifest-
    # completeness modelling commitment. See
    # contracts/lean/FfiCpythonExt.lean for the proof. TWELFTH
    # and FINAL contract Lean theorem — completes the
    # substrate.
    lean_theorem: "XpileContracts.CFfiCpythonExt.manifest_completeness"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    # PMAT-077: Kani harness completes the §14.4 quorum and
    # makes the ENTIRE xpile substrate (12 contracts) reach
    # 100% QUORUM coverage — every contract has paired Lean +
    # Kani Bronze-tier discharges.
    kani_harness: "manifest_completeness"
    kani_file: "contracts/kani/ffi_cpython_ext.rs"
    formula: |
      forall call in python_module.calls_into(c_extension): exists entry in ffi_manifest: entry.symbol == call.symbol
    domain: |
      A hybrid session containing a parsed Python module and one or
      more parsed C extension modules.
    invariants:
      - "no call site is omitted from the manifest"
      - "manifest entries are deduplicated by (symbol, from_lang, to_lang)"
    preconditions:
      - "both Python and C frontends have run"

  symbol_preserved_silver:
    # PMAT-168: Silver-tier refinement theorem promotes the
    # Bronze byte-array payload model of manifest_completeness
    # to a structured FFI-call AST. The Bronze model smushed
    # symbol + langs + args + return + refcount into one
    # payload; Silver splits them into 6 named fields. This
    # wired theorem proves the SYMBOL field (primary lookup
    # key) is preserved byte-for-byte; companion theorems
    # language_tags_preserved_silver, signature_preserved_silver,
    # refcount_delta_preserved_in_structured_silver live in the
    # same Lean file. SECOND Silver theorem on this contract
    # (after PMAT-160's refcount_balance_on_success_silver) —
    # broadens Silver coverage within a single multi-eq contract.
    # Fifth multi-eq contract Silver upgrade overall (after
    # PMAT-164/165/166/167).
    lean_theorem: "XpileContracts.CFfiCpythonExt.symbol_preserved_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      lower(call).symbol == call.symbol
    domain: |
      Same as `manifest_completeness` — a hybrid session with
      parsed Python and C modules. The Silver upgrade narrows the
      modelling from "payload preserved" to "every CPython-ABI
      field (symbol, from_lang, to_lang, args, return_type,
      refcount_delta) preserved as a separate structural field".
    invariants:
      - "the symbol field is preserved byte-for-byte (no CPython name-mangling rewriting, no source-module prefixing)"
      - "from_lang, to_lang, args, return_type, refcount_delta are preserved as separate fields (companion theorems language_tags_preserved_silver, signature_preserved_silver, refcount_delta_preserved_in_structured_silver in the same Lean file)"
      - "the structured Silver model composes with PMAT-160's FfiCallSilver — both Silver theorems are load-bearing for full ABI safety"
    preconditions:
      - "the Silver model assumes the symbol fits in an opaque byte payload (Gold tier introduces validated CPython symbol-name regex matching)"
      - "the hybrid session has run both Python and C frontends to populate the structured fields"
    postconditions:
      - "the manifest entry's symbol field equals the source call's symbol field byte-for-byte"
      - "the structured model rules out an emitter that records calls without symbol provenance (a deduplication failure at Bronze, since payload encoded everything together)"

  refcount_balance_on_success:
    # PMAT-160 / XPILE-REFINE-FFI-CPYTHON-002: Silver-tier
    # refinement theorem. Introduces typed FfiCallSilver and
    # FfiManifestEntrySilver with explicit refcount_delta : Int
    # field. Proves `manifest.refcount_delta = call.refcount_delta`
    # at the type level (no silent drift across the FFI boundary).
    lean_theorem: "XpileContracts.CFfiCpythonExt.refcount_balance_on_success_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      pre_call_refcount(obj) == post_call_refcount(obj)  WHEN call returns non-error
    domain: |
      Any PyObject* passed across the FFI boundary by reference.
    invariants:
      - "CPython convention: borrowed references stay borrowed, new references decremented by caller"
      - "Rust output preserves the same balance via explicit Drop / clone semantics"
      - "no refcount leaks and no double-decrements"
    preconditions:
      - "C extension follows CPython refcounting conventions correctly in the original"

  refcount_delta_additive_platinum:
    # PMAT-204 / XPILE-REFINE-FFI-CPYTHON-009: SIXTH Platinum-tier
    # refinement in the substrate. Demonstrates SIXTH distinct
    # Platinum algebraic shape: additivity / linearity for
    # resource semantics. delta(c1; c2) = c1.delta + c2.delta.
    # Captures monoidal composition law for refcount accounting.
    # Companion theorems refcount_composition_associative_platinum
    # (monoid structure) and balanced_calls_zero_delta_platinum
    # (captures the load-bearing balanced-references invariant).
    lean_theorem: "XpileContracts.CFfiCpythonExt.refcount_delta_additive_platinum"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      compose(c1, c2).refcount_delta == c1.refcount_delta + c2.refcount_delta
      (additivity / linear composition law)
    domain: |
      Any two FfiCallSilver values c1, c2 sequenced together.
      The Platinum upgrade captures the linear composition law
      for refcount accounting at the type level.
    invariants:
      - "SIXTH Platinum algebraic shape: additivity / linearity"
      - "delta is a MONOID HOMOMORPHISM into (Int, +, 0) — captures the LINEAR composition law"
      - "companion theorem refcount_composition_associative_platinum proves the (FfiCallSilver, compose, zero) monoid is associative"
      - "companion theorem balanced_calls_zero_delta_platinum captures the load-bearing BALANCED-REFERENCES invariant: sequences summing to zero have zero cumulative delta"
    preconditions:
      - "two well-formed FfiCallSilver values exist (Silver model preconditions inherited)"
      - "no special precondition on the deltas themselves — additivity holds for any deltas"
    postconditions:
      - "an emitter that produces a SEQUENCE of FFI calls preserves the total refcount-delta as the sum of per-call deltas"
      - "this enables refcount safety analysis to be DECOMPOSED into per-call analyses + summing — load-bearing for compositional refcount verification"

  refcount_abelian_group_diamond:
    # PMAT-216 / XPILE-REFINE-FFI-CPYTHON-010: THIRD Diamond-tier
    # refinement in the substrate. Combines PMAT-204 additivity
    # + commutativity + associativity + identity + inverses
    # into the ABELIAN GROUP axiomatization for refcount-delta
    # semantics under (Int, +, 0, -). Companion theorem
    # refcount_inverse_diamond captures the load-bearing
    # Py_INCREF/Py_DECREF pairing claim at the group level.
    lean_theorem: "XpileContracts.CFfiCpythonExt.refcount_abelian_group_diamond"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      refcount-delta forms an ABELIAN GROUP under (Int, +, 0, -):
        (a) closure: compose(c1, c2).delta = c1.delta + c2.delta
        (b) commutativity: compose(c1, c2).delta = compose(c2, c1).delta
        (c) associativity: compose(compose(c1,c2),c3).delta = compose(c1,compose(c2,c3)).delta
        (d) identity: zero-delta call is the additive identity
        (e) inverses (companion): every call has a counterpart with negated delta
    domain: |
      Any FfiCallSilver values under compose_ffi_calls_silver
      sequencing. The Diamond upgrade captures the FULL
      abelian-group structure at the refcount-delta level.
    invariants:
      - "THIRD Diamond-tier theorem; combines PMAT-204 + commutativity + associativity + identity + inverses"
      - "STRONGER than PMAT-214's commutative-monoid (Nat doesn't have inverses, Int does)"
      - "companion theorem refcount_inverse_diamond captures Py_INCREF/Py_DECREF pairing at the group level"
      - "an emitter producing unmatched refcount changes (no inverse exists) would falsify the group structure at compile time"
    preconditions:
      - "all FfiCallSilver values are well-formed (Silver model preconditions inherited)"
    postconditions:
      - "Diamond axiomatizes refcount-delta as forming a mathematically PROPER algebraic group (not just a monoid)"
      - "load-bearing for compositional refcount safety: every modifying call has a CANCELING counterpart"

  gil_invariant_preservation_diamond:
    # PMAT-230 / XPILE-REFINE-FFI-CPYTHON-011: SECOND Diamond on
    # this contract — Layer 4 depth-2 Diamond. Following
    # PMAT-228 (depth-2 on Layer 1) and PMAT-229 (depth-2 on
    # Layer 2), this extends Diamond breadth to Layer 4. The
    # GIL-INVARIANT-PRESERVATION Diamond is a fundamentally
    # distinct algebraic category from PMAT-216 abelian-group:
    # abelian-group captures HOW refcount-deltas compose under
    # +; GIL-invariant captures HOW the (held, released) state
    # pair is PRESERVED through the CPython ABI boundary.
    lean_theorem: "XpileContracts.CFfiCpythonExt.gil_invariant_preservation_diamond"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      GIL-state preservation across the CPython ABI boundary:
        (a) c.enter = c.exit ⇒ lower(c).enter = lower(c).exit
        (b) Held in ⇒ Held out
        (c) Released in ⇒ Released out
        (d) lower(c).enter = c.enter ∧ lower(c).exit = c.exit
            (identity on GIL state pointwise)
    domain: |
      Any FfiCallWithGilSilver values under the
      lower_call_preserving_gil lowering. The Diamond upgrade
      captures the FULL GIL-state-preservation axiomatization.
    invariants:
      - "SECOND Diamond category on C-FFI-CPYTHON-EXT — Diamond breadth on Layer 4"
      - "distinct algebraic category from PMAT-216 abelian-group (refcount-delta composition)"
      - "captures GIL-state preservation across CPython ABI boundary"
      - "pyo3's Python<'_> guard encodes the same invariant in Rust — this Diamond is the formal-semantics counterpart"
    preconditions:
      - "an FfiCallWithGilSilver value with well-formed GIL state pair"
    postconditions:
      - "an emitter that drops Py_BEGIN_ALLOW_THREADS / Py_END_ALLOW_THREADS pairing would falsify (d) at compile time"
      - "Diamond depth-2 demonstrated on Layer 4 — substrate now has THREE depth-2 Diamond contracts (Layers 1, 2, 4)"

  zero_copy_pointer_functor_diamond:
    # PMAT-243 / XPILE-REFINE-FFI-CPYTHON-012: THIRD Diamond on
    # this contract — Layer 4 DEPTH-3. FfiCpythonExt joins
    # PyIntArith (PMAT-241 depth-3 on Layer 1) and
    # CompileRustToPtxMma (PMAT-242 depth-3 on Layer 5) as the
    # THIRD contract at depth-3 in the substrate. Distinct
    # algebraic category from PMAT-216 abelian-group and
    # PMAT-230 GIL-invariant — captures BUFFER OWNERSHIP
    # functorial semantics (memory pointer preservation).
    lean_theorem: "XpileContracts.CFfiCpythonExt.zero_copy_pointer_functor_diamond"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      Zero-copy passthrough forms a FUNCTOR preserving pointer
      identity and length, with mode-dependent pointer behavior:
        (a) ZeroCopy preserves pointer (PMAT-173 lifted)
        (b) Length preserved unconditionally
        (c) Materialised mode produces sentinel pointer (= 0)
        (d) Length is mode-independent
    domain: |
      Any NdarrayPassthrough with ZeroCopy mode (PMAT-173
      precondition). The Diamond combines the ZeroCopy pointer-
      identity claim with universal length preservation and
      mode-dependent pointer behavior as a single algebraic
      statement.
    invariants:
      - "THIRD DEPTH-3 Diamond in substrate (after PMAT-241, PMAT-242)"
      - "distinct algebraic category from PMAT-216 abelian-group AND PMAT-230 GIL-invariant"
      - "captures buffer-ownership functorial semantics"
      - "three orthogonal CPython safety invariants now axiomatized: refcount, locks, memory ownership"
    preconditions:
      - "NdarrayPassthrough with mode = ZeroCopy for the (a) clause"
    postconditions:
      - "an emitter that always materialises while claiming ZeroCopy would falsify (a) at the type level"
      - "Diamond depth-3 now extends to Layer 4 — substrate has depth-3 on three layers (Layer 1 PyIntArith, Layer 4 FfiCpython, Layer 5 CompileRustToPtx)"

  bounded_refcount_delta_preserved_gold:
    # PMAT-186 / XPILE-REFINE-FFI-CPYTHON-008: SECOND Gold-tier
    # refinement in the substrate (after PMAT-185 PyIntFast on
    # C-PY-INT-ARITH). Promotes Silver's refcount_delta : Int
    # to BoundedRefcountDelta := { d : Int // -8 ≤ d ≤ 8 }
    # refinement subtype. The CPython ABI's per-call refcount-
    # delta bound is now encoded at the TYPE level — emitter
    # receiving a BoundedRefcountDelta cannot pass an unbounded
    # Int. Companion theorems bounded_refcount_witness_gold
    # and gold_subtype_agrees_with_silver_refcount in same file.
    lean_theorem: "XpileContracts.CFfiCpythonExt.bounded_refcount_delta_preserved_gold"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      lower_call_to_manifest_gold(c).bounded_delta.val == c.bounded_delta.val
      WITH bound  -8 ≤ delta ≤ 8
    domain: |
      Same as refcount_balance_on_success — a PyObject* passed
      across the FFI boundary. The Gold upgrade narrows the
      modelling from "delta is Int" to "delta is BoundedRefcount-
      Delta with |delta| ≤ 8".
    invariants:
      - "the ±8 bound is the realistic upper bound for CPython C extensions — a single function rarely touches more than a few refcounts"
      - "the bound witness travels with the value at the type level — no proof re-discharge downstream"
      - "Kani BMC search space is exponentially smaller at Gold than Silver — bounded delta vs unbounded Int"
      - "companion theorem gold_subtype_agrees_with_silver_refcount bridges Gold to PMAT-160's Silver model"
    preconditions:
      - "the source delta has been proven to fit within ±refcount_delta_bound at construction time (Gold-tier well-formedness)"
      - "the BoundedRefcountDelta subtype rules out unbounded deltas at compile time — a caller without a proof cannot create the value"
    postconditions:
      - "an emitter accepting raw Int values is upgradeable to BoundedRefcountDelta by inserting bound-proof construction at the boundary"
      - "downstream code can chain BoundedRefcountDelta operations without re-proving the bound at every step — the type system enforces it"
      - "this is the archetype Gold-tier subtype pattern per ruchy 5.0 §14.10.5, applied to FFI semantics rather than arithmetic semantics (PMAT-185 covered the arithmetic case on PyIntFast)"

  refcount_balance_on_error:
    # PMAT-172 / XPILE-REFINE-FFI-CPYTHON-005: Silver-tier
    # refinement wires the previously-unwired
    # refcount_balance_on_error equation. FOURTH Silver theorem
    # on C-FFI-CPYTHON-EXT (after PMAT-160 success-path refcount,
    # PMAT-168 structured manifest, PMAT-171 GIL state). Models
    # CallOutcome { Success | Error } and a borrowed-ref
    # refcount pair (before, after). Proves that for the
    # balanced borrowed-ref case on the error path, lowering
    # preserves the refcount balance — exposing the most common
    # CPython C extension bug class to the oracle.
    lean_theorem: "XpileContracts.CFfiCpythonExt.refcount_balance_on_error_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      pre_call_refcount(obj) == post_call_refcount(obj)  WHEN call returns error AND obj is borrowed
    domain: |
      Error path. Errors in CPython C API are signaled by returning NULL
      and setting a Python exception.
    invariants:
      - "the most common CPython C extension bug — error-path refcount leak — must be detected by oracle"
      - "Rust translation must use ? / Result idioms that auto-drop on error"
      - "the BorrowedRef model carries the (refcount_before, refcount_after, outcome) triple; lowering must preserve all three so the oracle can detect imbalance"
      - "companion theorem outcome_preserved_silver locks in the CallOutcome (Success | Error) tag's survival through lowering — falsification target: emitters that 'summarise' outcomes to a single bit"
    preconditions:
      - "the Silver model's well-formedness assumption: refcount_before = refcount_after at input (a balanced borrowed-ref pattern). The load-bearing claim is that lowering preserves balance, not that it CREATES balance."
      - "the call outcome is Error (NULL return + PyErr_Occurred — the standard CPython error-signalling convention)"

  gil_invariant:
    # PMAT-171 / XPILE-REFINE-FFI-CPYTHON-004: Silver-tier
    # refinement wires the previously-unwired gil_invariant
    # equation. THIRD Silver theorem on C-FFI-CPYTHON-EXT
    # (after PMAT-160 refcount_balance_on_success_silver and
    # PMAT-168 symbol_preserved_silver). Models the CPython GIL
    # as a typed 2-state value (Held | Released) observed at
    # both ends of the FFI call boundary, and proves the
    # lowering preserves the (enter, exit) pair. Captures the
    # load-bearing CPython-ABI safety invariant that the GIL is
    # held across every PyObject access — pyo3's Python<'_>
    # guard encodes this rule statically in Rust.
    lean_theorem: "XpileContracts.CFfiCpythonExt.gil_invariant_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      gil_held(t) for t in [enter_call, exit_call]
    domain: |
      Any FFI call that touches CPython API state.
    invariants:
      - "Rust output uses pyo3's GIL guards (or equivalent) to preserve this"
      - "transpiled extensions that explicitly release the GIL must mark that in the manifest entry"
      - "the (gil_at_enter, gil_at_exit) pair is preserved by lowering — emitters cannot drop the GIL pair from the manifest entry"
      - "specialization theorem gil_held_implies_held_silver locks in the default case (no Py_BEGIN_ALLOW_THREADS) — caller observes GIL=Held at both ends"
    preconditions:
      - "Python frontend identified the call site as Python→C"
      - "the gil_invariant_silver theorem assumes balanced GIL state at input (gil_at_enter = gil_at_exit) — an unbalanced input represents an already-broken caller and is out of domain"

  buffer_protocol_zero_copy:
    # PMAT-173 / XPILE-REFINE-FFI-CPYTHON-006: Silver-tier
    # refinement wires the previously-unwired
    # buffer_protocol_zero_copy equation. FIFTH Silver theorem on
    # C-FFI-CPYTHON-EXT (after PMAT-160/168/171/172). Models the
    # NumPy/buffer-protocol zero-copy invariant as typed pointer-
    # identity preservation: when mode = ZeroCopy, the lowered
    # Rust view's data_ptr equals the ndarray's data_ptr.
    # Captures the performance-safety claim that O(1)
    # passthrough is provable at the type level — emitters that
    # default to materialise-mode (allocating fresh Vec<u8>) are
    # caught structurally.
    lean_theorem: "XpileContracts.CFfiCpythonExt.pointer_identity_on_zero_copy_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      ndarray_passthrough(a) implies same_pointer(a.data, rust_view.as_ptr())
    domain: |
      A NumPy ndarray (or similar buffer-protocol object) passed across
      the boundary.
    invariants:
      - "performance contract: passing a 1GB ndarray must be O(1), not O(N)"
      - "if a copy is forced, that's a manifest annotation that must be explicit"
      - "the typed Silver model BufferPassthroughMode { ZeroCopy | Materialised } makes the passthrough decision auditable — Bronze couldn't distinguish the two modes"
      - "companion theorem length_preserved_in_view_silver locks in unconditional length preservation (both modes); an emitter that drops length falsifies this regardless of mode"
    preconditions:
      - "object implements __buffer__ protocol"
      - "the pointer_identity_on_zero_copy_silver theorem assumes mode = ZeroCopy at input — the Materialised case is out of domain (pointer divergence is permitted but must be flagged in manifest per the contract invariant)"

  oracle_endtoend_equivalence:
    # PMAT-174 / XPILE-REFINE-FFI-CPYTHON-007: Silver-tier
    # refinement wires the last previously-unwired equation on
    # this contract — SIXTH and FINAL Silver theorem on
    # C-FFI-CPYTHON-EXT. With this landed, every equation in
    # the contract has Silver-tier coverage; C-FFI-CPYTHON-EXT
    # becomes the first contract in the substrate at FULL
    # Silver tier. Models typed OracleObservation { output,
    # refcount_delta, exception_kind } and proves both sides
    # (Python-baseline + Rust-transpiled) produce structurally-
    # equal observations on the same input — capturing the
    # composition of the prior 5 Silver theorems (PMAT-160/
    # 168/171/172/173).
    lean_theorem: "XpileContracts.CFfiCpythonExt.oracle_endtoend_equivalence_silver"
    lean_file: "contracts/lean/FfiCpythonExt.lean"
    formula: |
      forall input in fixture: hybrid_python_module(input) == transpiled_rust(input)
    domain: |
      The full fixture of inputs captured by xpile-oracle.
    invariants:
      - "this is the agent's exit condition"
      - "equality propagates through alias chains, refcounts, AND ndarray views"
      - "the typed OracleObservation triple (output, refcount_delta, exception_kind) survives both lifts — companion theorem oracle_observation_fields_preserved_silver locks in field-level preservation"
      - "the Silver theorem captures the COMPOSITION of PMAT-160/168/171/172/173 — an emitter satisfying each individual Silver claim but breaking their composition falsifies oracle_endtoend_equivalence_silver"
    preconditions:
      - "fixture is non-empty"
      - "both sides built clean"
      - "the Silver theorem assumes both lifts receive the SAME OracleObservation input — the agent's exit condition is conditional on input equivalence (a fixture-driver invariant, not an emitter responsibility)"

proof_obligations:
  - type: precondition
    property: both Python and C frontends produced meta-HIR
    formal: "python_module.is_some() ∧ c_module.is_some()"
    applies_to: all
  - type: precondition
    property: FFI manifest reconciliation ran successfully
    formal: "manifest_complete == true ∧ unresolved_symbols == ∅"
    applies_to: manifest_completeness
  - type: postcondition
    property: end-to-end oracle pass on the fixture
    formal: "∀ x ∈ fixture: equal(hybrid(x), transpiled(x))"
    applies_to: oracle_endtoend_equivalence
  - type: postcondition
    property: no refcount leaks visible to a leak-tracker
    formal: "leaks_after_run() == ∅"
    applies_to: all
  - type: frame
    property: the original Python and C source files are not modified
    formal: "modifies() ⊆ {generated_rust_files, manifest, cache}"
    applies_to: all
  - type: invariant
    property: GIL is held wherever CPython API is touched
    formal: "∀ call ∈ python_to_c: gil_held(call)"
    applies_to: gil_invariant
  - type: bound
    property: ndarray passthrough is zero-copy
    formal: "∀ a ∈ ndarray_passthrough: copies(transpile(a)) == 0"
    applies_to: buffer_protocol_zero_copy

falsification_tests:
  - id: FALSIFY-FFI-CPY-001
    rule: |
      An error path that leaks refcount MUST be detected by the oracle.
    prediction: |
      A C extension whose error path forgets to DECREF an owned reference
      causes the leak tracker to report a non-empty leak set.
    test: |
      cargo test -p xpile-oracle --test ffi_refcount_leak_detection
    if_fails: |
      Oracle is not instrumenting refcounts — the entire safety story
      for hybrid transpile depends on this catching leaks.
    ship_blocking: true
    counter_example_classes:
      - error_path_leak

  - id: FALSIFY-FFI-CPY-002
    rule: |
      Transpilation that copies a 1GB ndarray MUST violate the zero-copy
      contract and be rejected by CI.
    prediction: |
      copies(transpile(passthrough(ndarray_1GB))) == 0 must hold.
    test: |
      cargo test -p xpile-oracle --test ffi_ndarray_zero_copy
    if_fails: |
      The translation introduced a defensive clone. Performance contract
      broken — this would make NumPy-heavy code unusably slow.
    ship_blocking: true
    counter_example_classes:
      - defensive_clone

  - id: FALSIFY-FFI-CPY-003
    rule: |
      Transpile missing a manifest entry for a Python→C call MUST fail
      manifest completeness.
    prediction: |
      Running the agent with an incomplete manifest exits with
      AgentError::ManifestIncomplete or budget-exhausted.
    test: |
      cargo test -p xpile-agent --test ffi_manifest_incomplete
    if_fails: |
      The reconciliation step missed a call site — silent miscompile risk.
    ship_blocking: true
    counter_example_classes:
      - missed_call_site

  - id: FALSIFY-FFI-CPY-004
    rule: |
      A call site missing the GIL guard MUST be rejected.
    prediction: |
      Translation emits a #[pyo3::pyfunction] or equivalent that holds
      the GIL for the duration of the CPython API touch.
    test: |
      cargo test -p xpile-rust-codegen --test ffi_gil_held
    if_fails: |
      Some translation path emitted bare extern "C" without a GIL guard.
    ship_blocking: true
    counter_example_classes:
      - missing_gil_guard

  - id: FALSIFY-FFI-CPY-005
    rule: |
      End-to-end oracle MUST detect output divergence between hybrid and
      transpiled.
    prediction: |
      For any input where hybrid(x) != transpiled(x), oracle returns
      ComparisonResult::Divergence.
    test: |
      cargo test -p xpile-oracle --test ffi_endtoend_divergence
    if_fails: |
      Oracle equality is too loose (likely using == on float without
      tolerance) — semantic divergence going undetected.
    ship_blocking: true
    counter_example_classes:
      - oracle_too_loose

  - id: FALSIFY-FFI-CPY-006
    rule: |
      No generated file outside {generated_rust_files, manifest, cache}
      is modified by the transpile session.
    prediction: |
      stat(orig_python) and stat(orig_c) before == after the session.
    test: |
      cargo test -p xpile-core --test ffi_frame_invariant
    if_fails: |
      Transpile is touching the source — destructive, blocks user trust.
    ship_blocking: true
    counter_example_classes:
      - source_mutation

  - id: FALSIFY-FFI-CPY-007
    rule: |
      Total leak-tracker output after a successful run is empty.
    prediction: |
      leaks_after_run() == ∅ for every passing fixture.
    test: |
      cargo test -p xpile-oracle --test ffi_leak_tracker_clean
    if_fails: |
      A refcount or memory leak survived oracle exit — likely a borrowed-
      vs-new-reference confusion in the translation.
    ship_blocking: true
    counter_example_classes:
      - borrowed_new_ref_confusion

kani_harnesses:
  - id: KANI-FFI-CPY-001
    obligation: manifest_completeness
    bound: 3
    property: |
      For a hybrid session with up to 3 Python→C call sites, the FFI
      manifest reconciliation routine registers all of them.
    harness: |
      #[kani::proof]
      fn manifest_complete_bounded() {
          let n: usize = kani::any();
          kani::assume(n <= 3);
          let calls: [&str; 3] = kani::any();
          let manifest = reconcile(&calls[..n]);
          for c in &calls[..n] {
              assert!(manifest.contains_symbol(c));
          }
      }
