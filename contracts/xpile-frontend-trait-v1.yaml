metadata:
  id: C-XPILE-FRONTEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile Frontend trait must
    satisfy. The Frontend trait is the load-bearing abstraction of the
    polyglot architecture (XPILE-ARCH-V1): every source language plugs
    in by implementing exactly this trait.

    Layer 3 of the contract taxonomy (architectural / xpile-internal).
  references:
    - docs/specifications/xpile-architecture-v1.md
    - docs/specifications/xpile-contract-driven-design-v1.md
    - crates/xpile-frontend/src/lib.rs
  depends_on: []

equations:
  extension_ownership:
    formula: |
      forall ext in registered_extensions: exists exactly one frontend f: ext in f.extensions()
    domain: |
      registered_extensions is the union of extensions() across all
      Frontend implementations registered with a TranspileSession.
    invariants:
      - "no two frontends declare the same extension (else dispatch is ambiguous)"
      - "every dispatched extension reaches exactly one parse_and_lower call"
    preconditions:
      - "TranspileSession::register_frontend has been called for every active frontend"

  parse_idempotency:
    # PMAT-062: Lean refinement theorem locks in the determinism
    # modelling commitment for parse_and_lower. See
    # contracts/lean/XpileFrontendTrait.lean for the proof.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.parse_idempotency"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    # PMAT-063: Kani harness completes the §14.4 quorum (Sem + Sym +
    # Ext = ≥3 strata). Symbolic counterpart to the Lean theorem —
    # proves determinism over all 4-byte (path, source) pairs.
    kani_harness: "parse_idempotency"
    kani_file: "contracts/kani/xpile_frontend_trait.rs"
    formula: |
      forall (path, source): hash(f.parse_and_lower(path, source).unwrap()) == hash(f.parse_and_lower(path, source).unwrap())
    domain: |
      Two parses of the same (path, source) yield identical meta-HIR
      when run in the same process with no intervening mutation of f.
    invariants:
      - "Frontend impls hold no mutable state across parse calls"
      - "MetaHir Module serialization is canonical (BTreeMap-ordered, no HashMap)"
    preconditions:
      - "source is valid UTF-8"
      - "path is canonicalized"

  source_lang_consistency:
    # PMAT-156 / XPILE-REFINE-FRONTEND-TRAIT-001: Silver-tier
    # refinement theorem. Introduces a typed `SourceLang` enum +
    # `MetaHirModuleSilver` carrying both bytes and source_lang
    # tag, plus a `Frontend` struct with a `declared_lang` field.
    # Proves `result.source_lang = f.declared_lang` at the type
    # level — promoted from Bronze placeholder to Silver-tier
    # structural claim.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.source_lang_consistency_silver"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    # PMAT-282: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat for this equation. Bronze
    # parse_idempotency proved byte-equality on (path, source) ->
    # MetaHirModule { bytes } — a buggy Python frontend that auto-
    # detected shell scripts and stamped SourceLang::Shell would
    # still pass the Bronze idempotency test (different bytes, but
    # idempotent). Silver introduces explicit source_lang +
    # declared_lang fields and proves equality. Companion harness
    # parse_idempotency_silver re-proves idempotency at the
    # structured level. Path α extension — seventh contract.
    kani_harness: "source_lang_consistency_silver"
    kani_file: "contracts/kani/xpile_frontend_trait.rs"
    formula: |
      forall f, (path, source): f.parse_and_lower(path, source).unwrap().source_lang == f.declared_lang()
    domain: |
      Every Frontend has an implicit declared_lang() returning its SourceLang variant.
    invariants:
      - "no frontend produces meta-HIR claiming a different source language"
    preconditions: []

  consistent_frontend_output_gold:
    # PMAT-194 / XPILE-REFINE-FRONTEND-TRAIT-002: NINTH Gold-tier
    # refinement in the substrate. First Gold theorem on a
    # Layer-3 trait contract. ConsistentFrontendOutput :=
    # { p : Frontend × MetaHirModuleSilver
    #   // p.snd.source_lang = p.fst.declared_lang } pairs a
    # frontend with its lowered module under a type-level proof
    # of consistency. Fourth Gold pattern variant unlocked —
    # cross-field equality refinement (x.fst.field = y.snd.field),
    # distinct from bounded-numeric (PMAT-185..188),
    # collection-cardinality (PMAT-189/191/192), and equality
    # to constant (PMAT-193). Companion theorems
    # consistent_output_witness_gold and gold_frontend_agrees_
    # with_silver.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.consistent_frontend_output_gold"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      parse_and_lower_gold(f, p, s).module.source_lang
        == parse_and_lower_gold(f, p, s).frontend.declared_lang
      BY TYPE  (witness travels with the pair)
    domain: |
      Same as source_lang_consistency — every Frontend impl. The
      Gold upgrade encodes the consistency invariant at the type
      level via a pair-with-witness refinement subtype.
    invariants:
      - "ConsistentFrontendOutput pairs a Frontend with its lowered MetaHirModuleSilver under a TYPE-LEVEL proof that source_lang = declared_lang"
      - "consistency witness travels with the pair through extraction — no per-call-site re-proof needed"
      - "fourth Gold pattern variant unlocked: cross-field equality refinement (x.fst.field = y.snd.field)"
      - "this pattern is load-bearing for paired-value consistency invariants: lifter/lowerer pairs, before/after states, request/response pairs"
    preconditions:
      - "the Frontend impl is well-formed (Silver model preconditions inherited)"
      - "the Gold subtype carries the proof obligation by construction — caller cannot create a ConsistentFrontendOutput with mismatched fields"
    postconditions:
      - "an emitter returning a (frontend, module) pair where source_lang ≠ declared_lang would not type-check against parse_and_lower_gold"
      - "downstream consumers receiving a ConsistentFrontendOutput can rely on field consistency without runtime checks"

  source_lang_deterministic_platinum:
    # PMAT-210 / XPILE-REFINE-FRONTEND-TRAIT-003: ELEVENTH
    # Platinum-tier refinement in the substrate. First Platinum
    # on Layer-3 trait contracts. Demonstrates SEVENTH distinct
    # Platinum algebraic shape — input-determinism / output-
    # independence. For a fixed Frontend, the source_lang is
    # INDEPENDENT of path/source content. Distinct from
    # commutativity (199), associativity (200), idempotence
    # (201), functoriality (202/207/208/209), transitivity
    # (203), additivity (204). Companion theorems
    # source_lang_class_congruent_platinum (equivalence-class
    # structure via declared_lang) and consistency_universal_platinum
    # (universal-quantifier closure).
    lean_theorem: "XpileContracts.CXpileFrontendTrait.source_lang_deterministic_platinum"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      forall f, p1 s1 p2 s2:
        parse_and_lower(f, p1, s1).source_lang
          == parse_and_lower(f, p2, s2).source_lang
      (input-determinism / output-independence)
    domain: |
      Any Frontend impl, evaluated on any two (path, source)
      input pairs. The Platinum upgrade captures that the
      source_lang is INDEPENDENT of input content.
    invariants:
      - "ELEVENTH Platinum theorem; SEVENTH distinct algebraic shape (input-determinism)"
      - "captures Hoare-style 'result depends only on fixed parameters' determinism"
      - "load-bearing for any contract where output structure should be invariant under content variation"
      - "source_lang_class_congruent_platinum (companion) extends determinism to equivalence-class structure via declared_lang"
      - "consistency_universal_platinum (companion) is the universal-quantifier closure of PMAT-156's per-call result"
    preconditions:
      - "the Frontend impl is well-formed (Silver model preconditions inherited)"
      - "no precondition on the input variation — determinism holds for ANY pair of inputs"
    postconditions:
      - "any Frontend impl that auto-detects the language from source content (changing the source_lang tag accordingly) would falsify this theorem"
      - "the contract's modelling commitment is that source_lang comes from declared_lang, NOT from input introspection — Platinum locks this in compositionally"

  frontend_equivalence_class_diamond:
    # PMAT-224 / XPILE-REFINE-FRONTEND-TRAIT-004: TENTH
    # Diamond-tier refinement. Combines PMAT-210 determinism +
    # reflexivity + symmetry + transitivity into the FRONTEND
    # EQUIVALENCE CLASS axiomatization on declared_lang.
    # Captures the substrate's commitment that Frontend impls
    # are CLASSIFIED by their declared_lang with full
    # equivalence-relation algebraic structure.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.frontend_equivalence_class_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      lang_equiv forms an EQUIVALENCE RELATION on Frontend:
        (a) reflexivity: lang_equiv f f
        (b) symmetry: lang_equiv f1 f2 → lang_equiv f2 f1
        (c) transitivity: lang_equiv f1 f2 → lang_equiv f2 f3 → lang_equiv f1 f3
        (d) PMAT-210 determinism preserved: same-lang frontends
            produce modules with the same source_lang
    domain: |
      Any Frontend values under the lang_equiv relation. The
      Diamond upgrade captures the equivalence-class structure
      on declared_lang with full preservation of determinism.
    invariants:
      - "TENTH Diamond-tier theorem; combines PMAT-210 determinism + 3 equivalence axioms"
      - "FRONTEND EQUIVALENCE CLASS — algebraic classification by declared_lang"
      - "preserves PMAT-210's determinism through the equivalence relation"
    preconditions:
      - "three well-formed Frontend values"
    postconditions:
      - "Frontend impls are now classifiable by their declared_lang — load-bearing for quotient-based reasoning about language-specific behavior"
      - "an emitter that auto-detects language would break BOTH PMAT-210 determinism AND the Diamond equivalence-class structure"

  source_lang_constant_projection_diamond:
    # PMAT-232 / XPILE-REFINE-FRONTEND-TRAIT-005: SECOND Diamond
    # on this contract — Layer 3 depth-2 Diamond. Following
    # PMAT-228 (Layer 1), PMAT-229 (Layer 2), PMAT-230 (Layer 4),
    # PMAT-231 (Layer 5), this completes Diamond depth-2 across
    # ALL FIVE LAYERS — Diamond depth-2 UNIVERSAL milestone.
    # The CONSTANT-PROJECTION Diamond is a fundamentally distinct
    # algebraic category from PMAT-224 equivalence-class:
    # equivalence-class captures ABOUT-NESS of two frontends;
    # constant-projection captures INVARIANCE OF OUTPUT under
    # input variation.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.source_lang_constant_projection_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      source_lang is a CONSTANT-PROJECTION from Frontend to lang:
        (a) constant in path: source_lang(p,s) = source_lang(p',s)
        (b) constant in source: source_lang(p,s) = source_lang(p,s')
        (c) projection: source_lang = f.declared_lang
        (d) jointly constant: source_lang fixed across all inputs
    domain: |
      Any Frontend f and Array UInt8 inputs (p, s, p', s'). The
      Diamond upgrade captures the FUNCTORIAL property that the
      source_lang projection is fully determined by the frontend
      choice — inputs cannot override it.
    invariants:
      - "SECOND Diamond category on C-XPILE-FRONTEND-TRAIT — completes Diamond depth-2 UNIVERSAL across all 5 layers"
      - "distinct algebraic category from PMAT-224 equivalence-relation"
      - "captures FUNCTORIAL constant-projection from (Frontend, inputs) onto declared_lang"
    preconditions:
      - "well-formed Frontend f with four arbitrary path/source byte arrays"
    postconditions:
      - "an emitter that introspects source content and re-tags source_lang based on heuristic detection (e.g., shebang lines) would falsify this Diamond"
      - "Diamond depth-2 UNIVERSAL milestone: substrate now has depth-2 Diamonds across ALL 5 layers (1, 2, 3, 4, 5)"

  parse_and_lower_function_diamond:
    # PMAT-245 / XPILE-REFINE-FRONTEND-TRAIT-006: THIRD Diamond
    # on this contract — Layer 3 DEPTH-3. COMPLETES UNIVERSAL
    # Diamond depth-3 across ALL 5 LAYERS. Distinct algebraic
    # category from PMAT-224 equivalence-relation AND PMAT-232
    # constant-projection — captures FUNCTION-AXIOM properties
    # (totality + uniqueness + congruence) on the FULL output
    # structure rather than on a sub-field or relation between
    # frontends.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.parse_and_lower_function_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      parse_and_lower_silver is a TOTAL FUNCTION:
        (a) existence: source_lang = declared_lang
        (b) reflexivity: f f same args ⇒ same output
        (c) frontend congruence: f1 = f2 ⇒ outputs equal
        (d) input congruence: equal inputs ⇒ equal outputs
    domain: |
      Any Frontend f and Array UInt8 inputs (p, s). The Diamond
      captures function-axiom laws (totality + uniqueness +
      congruence) for parse_and_lower_silver as a third
      orthogonal algebraic category.
    invariants:
      - "FIFTH DEPTH-3 Diamond in substrate — completes UNIVERSAL Diamond depth-3 across ALL 5 layers"
      - "distinct algebraic category from PMAT-224 equiv-rel AND PMAT-232 constant-projection"
      - "captures set-theoretic FUNCTION AXIOMS on full output structure"
    preconditions:
      - "well-formed Frontend f with byte-array inputs"
    postconditions:
      - "an emitter adding non-determinism (random module reordering, time-dependent metadata) would falsify (c) and (d)"
      - "UNIVERSAL Diamond depth-3 across all 5 layers: substrate now has depth-3 Diamonds on Layer 1, 2, 3, 4, AND 5"

  metahir_module_struct_extensionality_diamond:
    # PMAT-330: FOURTH Diamond on this contract — COMPLETES DEPTH-4
    # ACROSS ALL 5 TAXONOMY LAYERS. After PMAT-329 broadened depth-4
    # to 4 layers (L1+L2+L4+L5), only Layer 3 was missing. PMAT-330
    # pushes XpileFrontendTrait (Layer 3) from depth-3 to depth-4,
    # making depth-4 ACROSS LAYERS reach EVERY xpile taxonomy layer.
    # MetaHirModuleSilver STRUCTURE EXTENSIONALITY: the record type
    # is field-extensional with decidable equality. Mirror of
    # PMAT-311 (BoundedSmem subtype) and PMAT-329 (OutcomeSilver
    # record) — this "record-structure extensionality" pattern is
    # now a recurring substrate-wide theme on 3 distinct contracts.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.metahir_module_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      MetaHirModuleSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two MetaHirModuleSilver records (bytes : Array UInt8,
      source_lang : SourceLang). The four properties together
      axiomatize the record-type structure: field equality
      determines record equality, with decidable equality.
    invariants:
      - "FOURTH Diamond category on C-XPILE-FRONTEND-TRAIT — COMPLETES DEPTH-4 ACROSS ALL 5 TAXONOMY LAYERS (L1+L2+L3+L4+L5)"
      - "RECORD-STRUCTURE / SUBTYPE-LIKE claim, mirror of PMAT-311 (BoundedSmem) and PMAT-329 (OutcomeSilver)"
      - "distinct from the prior 3 Diamonds (equivalence, projection, function axioms) — captures the OUTPUT RECORD TYPE structure"
      - "completes a recurring substrate-wide theme: structure-extensionality demonstrated on 3 distinct record/subtype contracts"
    preconditions:
      - "two MetaHirModuleSilver records (with derived DecidableEq instance)"
    postconditions:
      - "an emitter introducing a phantom field (e.g., cached_ast_hash) or stripping fields would falsify (a)"
      - "Diamond depth-4 ACROSS ALL 5 TAXONOMY LAYERS demonstrated: 5 contracts on 5 distinct layers"

  source_lang_enum_distinctness_diamond:
    # PMAT-347: FIFTH Diamond on this contract — COMPLETES DEPTH-5
    # ACROSS ALL 5 TAXONOMY LAYERS. Mirror of PMAT-330 (depth-4 ALL
    # 5 LAYERS milestone). Pushes XpileFrontendTrait (Layer 3) from
    # depth-4 to depth-5, adding Layer 3 to depth-5+ coverage.
    # SourceLang enum distinctness (6-variant inductive).
    lean_theorem: "XpileContracts.CXpileFrontendTrait.source_lang_enum_distinctness_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      SourceLang is a 6-variant decidable enumeration:
        (a) python ≠ rust
        (b) ruchy ≠ lean
        (c) self-equality
        (d) decidable equality
    domain: |
      Any SourceLang value (6-variant: python/c/rust/ruchy/shell/lean).
    invariants:
      - "FIFTH Diamond category on C-XPILE-FRONTEND-TRAIT — COMPLETES DEPTH-5 ACROSS ALL 5 TAXONOMY LAYERS"
      - "Mirror of PMAT-330 depth-4 ALL 5 LAYERS milestone"
    preconditions:
      - "SourceLang inductive type with derived DecidableEq"
    postconditions:
      - "Diamond depth-5 ACROSS ALL 5 TAXONOMY LAYERS demonstrated: 5 contracts on 5 distinct layers"

  metahir_module_silver_bytes_array_size_diamond:
    # PMAT-358: SIXTH Diamond on this contract — COMPLETES DEPTH-6
    # ACROSS ALL 5 TAXONOMY LAYERS. Mirror of PMAT-330 (depth-4 ALL
    # 5 LAYERS milestone) and PMAT-347 (depth-5 ALL 5 LAYERS
    # milestone). After PMAT-356 opened depth-6 on Layer 4
    # (FFI-CPYTHON-EXT) and PMAT-357 broadened it to Layer 2
    # (Bashrs) — making depth-6 ACROSS 4 LAYERS — PMAT-358 pushes
    # XpileFrontendTrait (Layer 3) from depth-5 to depth-6,
    # COMPLETING depth-6 ACROSS ALL 5 TAXONOMY LAYERS.
    # MetaHirModuleSilver bytes Array.size structure — seventh
    # substrate-wide Array.size demonstration.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.metahir_module_silver_bytes_array_size_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      MetaHirModuleSilver.bytes Array.size structure:
        (a) bytes.size >= 0 (trivially for Nat)
        (b) empty record has size-0 bytes
        (c) field-replacement preserves bytes size
        (d) source_lang field is independent (size unchanged by lang swap)
    domain: |
      Any MetaHirModuleSilver record with bytes : Array UInt8 and
      source_lang : SourceLang fields.
    invariants:
      - "SIXTH Diamond category on C-XPILE-FRONTEND-TRAIT — COMPLETES DEPTH-6 ACROSS ALL 5 TAXONOMY LAYERS"
      - "Mirror of PMAT-330 (depth-4 ALL 5 LAYERS) and PMAT-347 (depth-5 ALL 5 LAYERS) milestones"
      - "Seventh substrate-wide demonstration of the Array.size template"
    preconditions:
      - "one MetaHirModuleSilver record"
    postconditions:
      - "Diamond depth-6 ACROSS ALL 5 TAXONOMY LAYERS demonstrated: 5 contracts on 5 distinct layers"

  ffi_boundaries_are_outgoing_only:
    formula: |
      forall b in module.ffi_boundaries: b.from_lang == module.source_lang
    domain: |
      module: a parsed Module; b: an FfiBoundary recorded by the frontend.
    invariants:
      - "frontends record outgoing calls (Python module calling C) but not incoming ones"
      - "incoming-call boundaries are reconciled by the FFI manifest, not by frontends"
    preconditions: []

  frontend_struct_extensionality_diamond:
    # PMAT-369: SEVENTH Diamond on this contract — COMPLETES DEPTH-7
    # ACROSS ALL 5 TAXONOMY LAYERS. Mirror of PMAT-330 (depth-4 ALL
    # 5 LAYERS), PMAT-347 (depth-5), and PMAT-358 (depth-6)
    # milestones. Pushes XpileFrontendTrait (Layer 3) from depth-6
    # to depth-7. FRONTEND STRUCTURE EXTENSIONALITY: the single-field
    # Frontend record (declared_lang : SourceLang) is field-extensional.
    # Mirror of PMAT-359 on the Backend side (Backend INPUT record).
    # Twenty-third substrate-wide demonstration.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.frontend_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      Frontend admits STRUCTURE EXTENSIONALITY:
        (a) field eq (declared_lang) -> record eq
        (b) record eq -> field eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two Frontend records (declared_lang : SourceLang) — the INPUT
      record of the parse_and_lower trait method.
    invariants:
      - "SEVENTH Diamond category on C-XPILE-FRONTEND-TRAIT — COMPLETES DEPTH-7 ACROSS ALL 5 TAXONOMY LAYERS"
      - "STRUCTURE EXTENSIONALITY — twenty-third substrate-wide demonstration"
      - "Mirror of PMAT-359 on Backend side (Backend INPUT record)"
    preconditions:
      - "two Frontend records (DecidableEq derived)"
    postconditions:
      - "Diamond depth-7 ACROSS ALL 5 TAXONOMY LAYERS demonstrated: 5 contracts on 5 distinct layers"

  source_lang_enum_completeness_diamond:
    # PMAT-380: EIGHTH Diamond on this contract — COMPLETES DEPTH-8
    # ACROSS ALL 5 TAXONOMY LAYERS. Parallel to PMAT-330 (depth-4),
    # PMAT-347 (depth-5), PMAT-358 (depth-6), and PMAT-369 (depth-7)
    # ALL 5 LAYERS milestones. SOURCE-LANG ENUM COMPLETENESS: every
    # SourceLang value matches one of 6 known variants. Mirror of
    # PMAT-370 (Target completeness on Backend trait). Third instance
    # of Template 8 (enum completeness) substrate-wide.
    lean_theorem: "XpileContracts.CXpileFrontendTrait.source_lang_enum_completeness_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      SourceLang admits FINITE ENUMERATION COMPLETENESS:
        (a) total coverage: every SourceLang = one of 6 variants
        (b) self-equality
        (c) decidable membership
        (d) constructor distinctness sample
    domain: |
      Any SourceLang value (6-variant inductive).
    invariants:
      - "EIGHTH Diamond category on C-XPILE-FRONTEND-TRAIT — COMPLETES DEPTH-8 ACROSS ALL 5 TAXONOMY LAYERS"
      - "FINITE ENUMERATION COMPLETENESS — Template 8; third substrate-wide instance after PMAT-370/372"
      - "Mirror of PMAT-370 (Target completeness on Backend trait)"
    preconditions:
      - "SourceLang inductive type with derived DecidableEq"
    postconditions:
      - "Diamond depth-8 ACROSS ALL 5 TAXONOMY LAYERS demonstrated: 5 contracts on 5 distinct layers"

  consistent_frontend_output_subtype_extensionality_diamond:
    # PMAT-393: NINTH Diamond on this contract — BROADENS DEPTH-9
    # substrate-wide. Pushes XpileFrontendTrait (Layer 3) from
    # depth-8 to depth-9. Third L3 contract at depth-9.
    # CONSISTENT-FRONTEND-OUTPUT SUBTYPE EXTENSIONALITY: the
    # Gold-tier subtype `{ p : Frontend × MetaHirModuleSilver //
    # p.snd.source_lang = p.fst.declared_lang }` admits subtype
    # extensionality. FIFTH substrate-wide subtype-extensionality
    # demonstration after PMAT-311 (BoundedSmem), PMAT-390
    # (SuccessfulOutcome), PMAT-391 (FrameSafeTransition), and
    # PMAT-392 (ConsistentBackendInput). Template 9 (Gold-tier
    # subtype-ext) expands to 5 contracts.
    # CLOSES Frontend↔Backend Gold-tier subtype-ext symmetry pair
    # with PMAT-392 (ConsistentBackendInput).
    lean_theorem: "XpileContracts.CXpileFrontendTrait.consistent_frontend_output_subtype_extensionality_diamond"
    lean_file: "contracts/lean/XpileFrontendTrait.lean"
    formula: |
      ConsistentFrontendOutput admits SUBTYPE EXTENSIONALITY:
        (a) val eq -> subtype eq (Subtype.ext)
        (b) subtype eq -> val eq (congruence)
        (c) decidable equality
        (d) self-equality
    domain: |
      Two ConsistentFrontendOutput values (Gold-tier subtype of
      Frontend × MetaHirModuleSilver with source_lang/declared_lang
      consistency witness).
    invariants:
      - "NINTH Diamond category on C-XPILE-FRONTEND-TRAIT — BROADENS DEPTH-9 substrate-wide"
      - "SUBTYPE EXTENSIONALITY — fifth substrate-wide demonstration (Template 9 Gold-tier subtype-ext)"
      - "Closes Frontend↔Backend Gold-tier subtype-ext symmetry pair with PMAT-392"
    preconditions:
      - "two ConsistentFrontendOutput values"
    postconditions:
      - "Diamond depth-9 broadened: third L3 contract at depth-9"

proof_obligations:
  - type: invariant
    property: Every registered extension is owned by exactly one frontend
    formal: "∀ ext ∈ registered_extensions: |{ f | ext ∈ f.extensions() }| == 1"
    applies_to: dispatch
  - type: invariant
    property: parse_and_lower is deterministic per (path, source)
    formal: "∀ p, s: hash(parse(p, s)) == hash(parse(p, s))"
    applies_to: all
  - type: invariant
    property: Result module's source_lang matches the producing frontend
    formal: "result.is_ok() ⟹ result.unwrap().source_lang == frontend.declared_lang()"
    applies_to: all
  - type: invariant
    property: All recorded FFI boundaries are outgoing from the parsed language
    formal: "∀ b ∈ module.ffi_boundaries: b.from_lang == module.source_lang"
    applies_to: all

falsification_tests:
  - id: FALSIFY-XPILE-FRONTEND-001
    rule: |
      Two distinct frontends MUST NOT both claim the same extension.
    prediction: |
      A TranspileSession that registers two frontends with overlapping
      extensions() either rejects the second registration or panics in test.
    test: |
      cargo test -p xpile-core --test frontend_dispatch -- duplicate_extension
    if_fails: |
      Dispatch is ambiguous. Either reject overlap at register time or
      enforce a single-frontend-per-extension invariant in TranspileSession.
    ship_blocking: true
    counter_example_classes:
      - duplicate_extension
      - aliased_extension

  - id: FALSIFY-XPILE-FRONTEND-002
    rule: |
      parse_and_lower MUST be deterministic for fixed (path, source).
    prediction: |
      Hashing two consecutive results of parse_and_lower on the same
      input yields identical hashes.
    test: |
      cargo test -p xpile-frontend --test idempotency
    if_fails: |
      Some frontend holds mutable state across calls or uses a
      non-canonical serialization (HashMap iteration order).
    ship_blocking: true
    counter_example_classes:
      - hashmap_iteration_order
      - hidden_mutable_state

  - id: FALSIFY-XPILE-FRONTEND-003
    rule: |
      A frontend MUST NOT emit meta-HIR claiming a language other than its declared one.
    prediction: |
      For all (frontend, path, source): result.source_lang == frontend.declared_lang().
    test: |
      cargo test -p xpile-frontend --test source_lang_consistency
    if_fails: |
      A frontend was copy-pasted without updating its SourceLang tag.
    ship_blocking: true
    counter_example_classes:
      - copy_paste_bug

  - id: FALSIFY-XPILE-FRONTEND-004
    rule: |
      Every recorded FFI boundary MUST originate from the parsed module's language.
    prediction: |
      For all parsed modules m, all b ∈ m.ffi_boundaries: b.from_lang == m.source_lang.
    test: |
      cargo test -p xpile-frontend --test outgoing_only_ffi
    if_fails: |
      Frontend is recording an incoming boundary, which should be the
      job of the FFI manifest reconciliation step in xpile-core.
    ship_blocking: true
    counter_example_classes:
      - incoming_boundary_in_frontend

kani_harnesses:
  - id: KANI-XPILE-FRONTEND-001
    obligation: extension_ownership
    bound: 4
    property: |
      For up to 4 registered frontends with up to 3 extensions each,
      no extension appears in more than one frontend's extensions() list.
    harness: |
      #[kani::proof]
      fn extension_ownership_harness() {
          let frontends: [Vec<&'static str>; 4] = kani::any();
          let union: Vec<&'static str> = frontends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for ext in union {
              kani::assume(seen.insert(ext));
          }
      }

