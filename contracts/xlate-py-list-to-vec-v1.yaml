metadata:
  id: C-XLATE-PY-LIST-TO-VEC
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Translation contract: how Python `list` lowers to Rust `Vec<T>`.

    The naïve "list → Vec" mapping breaks on two semantic boundaries:
      1. Reference semantics — Python lists are reference types;
         translation must insert clones at observation points where
         CPython would observe alias-mediated mutation.
      2. Heterogeneous element types — translation must reject (with
         a typed error) lists that escape the homogeneous fast path.

    Layer 2 of the xpile contract taxonomy (translation).
  references:
    - "Python Language Reference §3.3.7.1 (Sequence types)"
    - contracts/py-int-arith-v1.yaml
    - docs/specifications/xpile-contract-driven-design-v1.md
  depends_on:
    - C-PY-INT-ARITH

equations:
  homogeneous_list_to_vec:
    # PMAT-135: Bronze-tier refinement theorem locks in element-bytes
    # + element-type-tag preservation.
    lean_theorem: "XpileContracts.CXlatePyListToVec.homogeneous_list_to_vec"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    # PMAT-149: Kani harness mirrors the Lean theorem at byte level.
    kani_harness: "homogeneous_list_to_vec"
    kani_file: "contracts/kani/xlate_py_list_to_vec.rs"
    formula: |
      xlate(list[T] for T in {int, float, str, bool, bytes}) == Vec<T_rust>
    domain: |
      A Python list literal or comprehension whose elements all have
      the same inferred Python type T with a canonical Rust counterpart.
    invariants:
      - "preserves element order"
      - "preserves length exactly"
      - "no implicit type coercion at element boundaries"
    preconditions:
      - "type inference succeeded with a single T for all elements"
      - "T is one of {int, float, str, bool, bytes} with a canonical Rust counterpart"
    postconditions:
      - "the emitted Rust `Vec<T_rust>` has exactly the same length as the source Python list"
      - "element ordering is preserved index-by-index"
      - "no implicit type coercion occurs at element boundaries (homogeneous source → homogeneous Vec)"

  homogeneous_element_type_preserved_silver:
    # PMAT-182 / XPILE-REFINE-XLATE-PY-LIST-002: Silver-tier
    # promotion of homogeneous_list_to_vec. Adds polymorphic
    # HomogeneousListSilver α / TypedRustVecSilver α with
    # element_type_tag preserved as separate structural field.
    # Companion theorem homogeneous_elements_preserved_silver
    # captures the polymorphic element-list preservation claim.
    lean_theorem: "XpileContracts.CXlatePyListToVec.homogeneous_element_type_preserved_silver"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    formula: |
      lower_homogeneous_list(l).element_type_tag == l.element_type_tag
    domain: |
      Same as homogeneous_list_to_vec — a homogeneous Python list.
    invariants:
      - "element_type_tag preserved byte-for-byte as separate structural field"
      - "polymorphic element list preserved (companion theorem)"
    preconditions:
      - "type inference succeeded with a single T for all elements"
    postconditions:
      - "an emitter that uses Box<dyn Any> erasure for homogeneous lists would falsify element_type_tag_preserved_silver"

  heterogeneous_list_rejected:
    # PMAT-135: Bronze-tier refinement theorem locks in error-with-types
    # outcome (no silent boxing); proof excludes the `ok` arm by construction.
    lean_theorem: "XpileContracts.CXlatePyListToVec.heterogeneous_list_rejected"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    # PMAT-149: Kani harness mirrors the Lean theorem.
    kani_harness: "heterogeneous_list_rejected"
    kani_file: "contracts/kani/xlate_py_list_to_vec.rs"
    formula: |
      xlate(list[T1 | T2 | ...]) == TranslationError::Heterogeneous{found_types}
    domain: |
      A Python list whose elements have inferred types that don't unify
      to a single Rust type.
    invariants:
      - "no silent fallback to Vec<Box<dyn Any>> — that would defeat the type contract"
      - "the error includes the set of conflicting types for user repair"
    preconditions:
      - "the Python source contains a list whose inferred element types do not unify"
      - "the meta-HIR's type-inference pass produced ≥2 distinct types for the list's elements"
    postconditions:
      - "translation returns `Err(TranslationError::Heterogeneous { found_types })` (never `Ok(Vec<...>)`)"
      - "the `found_types` set contains every distinct type observed (no drops)"
      - "no Rust code is emitted for the offending list — the error short-circuits emission"

  heterogeneous_rejection_reason_preserved_silver:
    # PMAT-182: Silver-tier promotion of heterogeneous_list_rejected.
    # Bronze captured binary rejected/accepted; Silver adds typed
    # RejectionReason enum { MixedNumericNonNumeric |
    # MixedSignedUnsigned | UnknownDynamicType |
    # MultipleTypesAtSameDepth } explaining WHY the rejection.
    # Companion theorem heterogeneous_always_rejected_silver
    # locks in totality (never silently accepted with implicit
    # casts).
    lean_theorem: "XpileContracts.CXlatePyListToVec.heterogeneous_rejection_reason_preserved_silver"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    formula: |
      lower_heterogeneous_list(l).reason == some l.reason
    domain: |
      Same as heterogeneous_list_rejected.
    invariants:
      - "rejection reason preserved as typed enum (not collapsed to single category)"
      - "rejection is total — companion theorem heterogeneous_always_rejected_silver"
    preconditions:
      - "the list has multiple distinct types"
    postconditions:
      - "an emitter that collapses all rejection reasons into a single category would lose diagnostic information — caught at the enum level"

  alias_observation_inserts_clone:
    # PMAT-135: Bronze-tier refinement theorem locks in
    # never-move-semantics-when-alias-flagged invariant.
    lean_theorem: "XpileContracts.CXlatePyListToVec.alias_observation_inserts_clone"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    # PMAT-149: Kani harness mirrors the Lean theorem.
    kani_harness: "alias_observation_inserts_clone"
    kani_file: "contracts/kani/xlate_py_list_to_vec.rs"
    formula: |
      observable_mutation_via_alias(a, b) WHEN b = a; mutate(b); observe(a)
        ==> xlate emits explicit clone or shared-mutable reference
    domain: |
      A Python program fragment where two variables are bound to the
      same list, one is mutated, and the other is observed afterward.
    invariants:
      - "CPython execution and Rust output produce identical observable mutations"
      - "the alias-graph annotation produced by Python frontend is sufficient input"
    preconditions:
      - "Python frontend produced an alias-graph annotation in the meta-HIR"
      - "the alias graph identifies at least one (binder, observer) pair where mutation crosses the boundary"
    postconditions:
      - "the emitted Rust inserts an explicit `.clone()` or wraps the list in `Rc<RefCell<...>>` (per the alias-graph annotation)"
      - "the runtime mutation observed via the second binding matches the CPython behavior bit-for-bit"
      - "no move-semantics are used where Python uses reference-semantics (which would change observable behavior)"

  in_function_alias_emits_clone_silver:
    # PMAT-182: Silver-tier promotion of
    # alias_observation_inserts_clone. Bronze used a single Bool
    # has_observable_alias; Silver promotes to AliasKind enum
    # { InFunctionLocal | CrossFunction | CrossModule } that
    # determines the dispatch (Clone vs Rc<RefCell>). Companion
    # theorem no_alias_emits_none_silver distinguishes the
    # no-alias case from Bronze's collapsed "no special wrapping"
    # category.
    lean_theorem: "XpileContracts.CXlatePyListToVec.in_function_alias_emits_clone_silver"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    formula: |
      lower_alias_observation(a) WHEN a.kind = InFunctionLocal == CloneEmitted
    domain: |
      Same as alias_observation_inserts_clone.
    invariants:
      - "alias scope is a typed enum (InFunctionLocal | CrossFunction | CrossModule)"
      - "the dispatch picks Clone for in-function aliases (no shared mutable state) — load-bearing for emitting cheap Clone instead of Rc<RefCell> in the common case"
      - "no_alias_emits_none_silver distinguishes none-alias from in-function alias (Bronze collapsed both into a single 'no wrapping' category)"
    preconditions:
      - "the alias-graph annotation has determined the alias scope"
    postconditions:
      - "an emitter that defaults to Rc<RefCell> for in-function aliases would emit unnecessary heap allocations — caught by the dispatch theorem"

  iteration_order_preserved:
    # PMAT-060: Lean refinement theorem locks in the modelling
    # commitment that lowering Python list → Rust Vec preserves
    # iteration order (and length, separately). See
    # contracts/lean/XlatePyListToVec.lean for the proof.
    lean_theorem: "XpileContracts.CXlatePyListToVec.iteration_order_preserved"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    # PMAT-061: Kani harness completes the §14.4 quorum (Sem + Sym +
    # Ext = ≥3 strata). Symbolic counterpart to the Lean theorem —
    # proves byte-level identity of the lowered RustVec on every
    # 4-byte symbolic input.
    kani_harness: "iteration_order_preserved"
    kani_file: "contracts/kani/xlate_py_list_to_vec.rs"
    formula: |
      for x in py_list: f(x)  ≡  for x in rust_vec.iter() { f(x) }
    domain: |
      Any iteration over a Python list, including comprehensions and
      generator expressions.
    invariants:
      - "no reordering even when iteration order doesn't seem to matter"
    preconditions:
      - "the source Python iteration uses the standard list-iteration protocol (`for x in py_list`, list comprehension, or generator over a list)"
      - "the iteration is not interleaved with mutation of the same list (that would be an alias_observation case)"
    postconditions:
      - "the emitted Rust iteration yields elements in source-order, position-by-position"
      - "no reordering is introduced even when the iteration body appears to be order-independent (the contract is conservative)"
      - "byte-level identity of the lowered RustVec holds (locked in by `iteration_order_preserved` in contracts/lean/XlatePyListToVec.lean and contracts/kani/xlate_py_list_to_vec.rs)"

  length_method:
    # PMAT-135: Bronze-tier refinement theorem locks in usize-result
    # AND consumer-expectation-driven cast decision (no silent truncation).
    lean_theorem: "XpileContracts.CXlatePyListToVec.length_method"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    # PMAT-149: Kani harness mirrors the Lean theorem.
    kani_harness: "length_method"
    kani_file: "contracts/kani/xlate_py_list_to_vec.rs"
    formula: |
      len(py_list) == rust_vec.len()
    domain: |
      Any `len()` call on a Python list.
    invariants:
      - "Python `len()` returns int; Rust `.len()` returns usize — cast must be explicit"
    preconditions:
      - "the source code calls `len(py_list)` where py_list is a translated `Vec<T_rust>`"
      - "the surrounding Rust code expects a usize or has an explicit cast to i64/u64"
    postconditions:
      - "the emitted Rust evaluates `rust_vec.len()` which returns usize"
      - "if the consumer expects i64 (Python-int compatibility), the codegen inserts an explicit `as i64` or `i64::try_from(...).expect(...)` cast"
      - "no silent usize → i64 truncation; on platforms where usize > i64 the cast must be checked"

  cast_target_preserved_silver:
    # PMAT-182: Silver-tier promotion of length_method. Bronze
    # used a single Bool i64_cast_inserted; Silver promotes to
    # CastTarget enum { None | I64 | Usize } that captures WHICH
    # platform target the cast was inserted for. Companion theorem
    # silver_length_preserved keeps the usize-length claim in the
    # typed model. COMPLETES Silver coverage on C-XLATE-PY-LIST-
    # TO-VEC (6/6) — FIFTH contract at full Silver.
    lean_theorem: "XpileContracts.CXlatePyListToVec.cast_target_preserved_silver"
    lean_file: "contracts/lean/XlatePyListToVec.lean"
    formula: |
      lower_length_method(vec_len, target).cast_target == target
    domain: |
      Same as length_method.
    invariants:
      - "cast target is a typed enum (None | I64 | Usize) — captures which target type was requested"
      - "usize length preserved in the typed model (companion theorem)"
    preconditions:
      - "the consumer expects either usize, i64, or no cast (the three valid target states)"
    postconditions:
      - "an emitter that defaults to usize cast when i64 is requested would silently truncate on 32-bit platforms — caught at the typed-enum level"

  # PMAT-164 / XPILE-REFINE-XLATE-PY-LIST-001: Silver-tier equation
  # extending `iteration_order_preserved` to polymorphic element
  # types. The Bronze theorem fixed elements at Array UInt8;
  # Silver uses PyListSilver α / RustVecSilver α (polymorphic) and
  # proves order preservation generically — a stronger structural
  # claim that catches lowerings specialised to bytes (e.g., SIMD
  # u8-lane shortcuts) that would silently break on other types.
  iteration_order_preserved_polymorphic:
    formula: |
      forall (α : Type), forall (l : PyListSilver α):
        (lower_py_list_to_rust_vec_silver l).elems == l.elems
    domain: |
      Same as iteration_order_preserved, but generic over the
      element type α (any supported element type, not just bytes).
    invariants:
      - "order preservation holds for any element type, not just u8"
      - "lowerings specialised for byte-elements (e.g., SIMD u8 lanes) cannot satisfy this if they break on other types"
    preconditions:
      - "the source list's element type has a canonical Rust counterpart"
    postconditions:
      - "the emitted Rust Vec preserves element ordering for any α"
      - "the Silver claim subsumes the Bronze byte-level claim (specialising α := UInt8 recovers the original)"
    # PMAT-164: Silver-tier refinement theorem.
    lean_theorem: "XpileContracts.CXlatePyListToVec.iteration_order_preserved_silver"
    lean_file: "contracts/lean/XlatePyListToVec.lean"

proof_obligations:
  - type: precondition
    property: meta-HIR carries a list type with inferred element type
    formal: "item.type == List ∧ item.element_type ∈ SupportedTypes"
    applies_to: homogeneous_list_to_vec
  - type: postcondition
    property: order and length are preserved
    formal: "len(input) == len(output) ∧ ∀ i: input[i] ≡ output[i]"
    applies_to: homogeneous_list_to_vec
  - type: postcondition
    property: aliasing is preserved per the alias graph
    formal: "∀ aliasing pair (a, b) in alias_graph: rust_output preserves alias semantics"
    applies_to: alias_observation_inserts_clone
  - type: frame
    property: no mutation of the meta-HIR module during translation
    formal: "modifies() == ∅"
    applies_to: all
  - type: invariant
    property: heterogeneous lists never silently lower to Box<dyn Any>
    formal: "¬homogeneous(input) ⟹ result == TranslationError::Heterogeneous"
    applies_to: heterogeneous_list_rejected
  - type: bound
    property: emitted Rust does not exceed 2× source line count for literals
    formal: "lines(emit(list_literal)) ≤ 2 * lines(literal)"
    applies_to: homogeneous_list_to_vec

falsification_tests:
  - id: FALSIFY-XLATE-LIST-001
    rule: |
      A heterogeneous list MUST yield TranslationError::Heterogeneous,
      not Vec<Box<dyn Any>>.
    prediction: |
      xlate([1, "a"]) returns Err(Heterogeneous { found_types: {int, str} }).
    test: |
      cargo test -p depyler-frontend --test xlate_list_hetero_rejected
    if_fails: |
      Translation is silently boxing — defeats the type contract.
    ship_blocking: true
    counter_example_classes:
      - silent_box_dyn_any

  - id: FALSIFY-XLATE-LIST-002
    rule: |
      Aliased mutation observed via a second name MUST be preserved.
    prediction: |
      `b = a; b.append(x); a == b after mutation` translates to Rust where
      the same observation holds (via clone-on-divergence or Rc<RefCell>).
    test: |
      cargo test -p depyler-frontend --test xlate_list_alias_mutation
    if_fails: |
      Rust output uses move semantics where Python uses reference semantics.
    ship_blocking: true
    counter_example_classes:
      - move_instead_of_alias

  - id: FALSIFY-XLATE-LIST-003
    rule: |
      Iteration order MUST be preserved.
    prediction: |
      Rust iteration over a translated list yields elements in the same
      order as Python iteration over the original.
    test: |
      cargo test -p depyler-frontend --test xlate_list_iter_order
    if_fails: |
      Translation used a HashSet/HashMap as the intermediate, losing order.
    ship_blocking: true
    counter_example_classes:
      - hashset_intermediate
      - reverse_iter_bug

  - id: FALSIFY-XLATE-LIST-004
    rule: |
      Length method must return identical values.
    prediction: |
      len(py_list) == rust_vec.len() as i64 for all inputs.
    test: |
      cargo test -p depyler-frontend --test xlate_list_len
    if_fails: |
      Likely cast bug: usize → i64 truncation on very long lists.
    ship_blocking: false
    counter_example_classes:
      - usize_truncation

  - id: FALSIFY-XLATE-LIST-005
    rule: |
      Translation MUST NOT mutate the meta-HIR module.
    prediction: |
      hash(module) before == hash(module) after xlate.
    test: |
      cargo test -p depyler-frontend --test xlate_no_mutation
    if_fails: |
      Translation has hidden side effects — breaks composability.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect

  - id: FALSIFY-XLATE-LIST-006
    rule: |
      Emitted Rust for a list literal is within 2× source line count.
    prediction: |
      lines(emit) ≤ 2 * lines(literal).
    test: |
      cargo test -p depyler-frontend --test xlate_list_size_budget
    if_fails: |
      Generated code is bloated — likely macro-expansion regression.
    ship_blocking: false
    counter_example_classes:
      - macro_expansion_bloat

kani_harnesses:
  - id: KANI-XLATE-LIST-001
    obligation: iteration_order_preserved
    bound: 5
    property: |
      For lists of length up to 5, the emitted Rust iteration produces
      elements in the same order as the input list.
    harness: |
      #[kani::proof]
      fn iteration_order_bounded() {
          let len: usize = kani::any();
          kani::assume(len <= 5);
          let input: [i32; 5] = kani::any();
          let translated = xlate_list_i32(&input[..len]);
          for i in 0..len {
              assert_eq!(input[i], translated[i]);
          }
      }

  - id: KANI-XLATE-LIST-002
    obligation: heterogeneous_list_rejected
    bound: 3
    property: |
      Mixing an int and a str in a list of length 3 MUST yield
      TranslationError::Heterogeneous (not a successful translation).
    harness: |
      #[kani::proof]
      fn hetero_rejected() {
          let positions: [bool; 3] = kani::any();
          kani::assume(positions.iter().any(|p| *p) && positions.iter().any(|p| !*p));
          let result = xlate_mixed_list(positions);
          assert!(matches!(result, Err(TranslationError::Heterogeneous { .. })));
      }

qa_gate:
  id: QA-XLATE-PY-LIST-TO-VEC
  name: "Python list → Rust Vec translation contract"
  min_coverage: 0.50
  max_complexity: 20
  required_tests:
    - every_referenced_lean_theorem_exists_in_its_file
    - every_referenced_kani_harness_exists_in_its_file
