metadata:
  id: C-XPILE-BACKEND-TRAIT
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Invariants every implementation of the xpile Backend trait must
    satisfy. The Backend trait is the code-lane's emission abstraction,
    parallel to Frontend (C-XPILE-FRONTEND-TRAIT). Where Frontend lowers
    source to meta-HIR, Backend lowers meta-HIR to a target artifact
    (Rust, Ruchy, PTX, WGSL, SPIR-V, Lean executable). Each new target
    is a new Backend impl — no architecture changes.

    Layer 3 of the contract taxonomy (architectural / xpile-internal),
    code-lane.

    The `compile_contract_citation` invariant is load-bearing for the
    audit chain established by Layer 5 compile contracts: a backend
    cannot emit a hardware instruction (mma.sync, cp.async,
    @workgroup_size, etc.) without naming a Layer-5 contract that
    sanctions it. This closes the "Oracle blind spots" gap that
    audit-design.md §4 flags — UB and hardware misuse now have a
    contract chain rather than an Oracle hope.
  references:
    - docs/specifications/sub/backend-trait.md
    - docs/specifications/sub/contract-taxonomy.md
    - contracts/xpile-frontend-trait-v1.yaml
    - contracts/compile-rust-to-ptx-mma-v1.yaml
  depends_on:
    - C-XPILE-FRONTEND-TRAIT

equations:
  target_ownership:
    formula: |
      forall t in registered_targets: exists exactly one b: t in b.targets()
    domain: |
      registered_targets is the union of targets() across all Backend
      implementations registered with a TranspileSession.
    invariants:
      - "no two backends declare the same Target variant (else dispatch is ambiguous)"
      - "every requested target reaches exactly one lower() call"
    preconditions:
      - "TranspileSession::register_backend has been called for every active backend"

  lower_idempotency:
    # PMAT-064: Lean refinement theorem locks in the determinism
    # modelling commitment for lower. See
    # contracts/lean/XpileBackendTrait.lean for the proof.
    lean_theorem: "XpileContracts.CXpileBackendTrait.lower_idempotency"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    # PMAT-065: Kani harness completes the §14.4 quorum. Symbolic
    # counterpart to the Lean theorem — proves determinism over
    # all 4-byte (module, config) pairs.
    kani_harness: "lower_idempotency"
    kani_file: "contracts/kani/xpile_backend_trait.rs"
    formula: |
      forall (module, config): hash(b.lower(module, config).unwrap()) == hash(b.lower(module, config).unwrap())
    domain: |
      Two lowerings of the same (module, config) yield byte-identical
      Artifact when run in the same process with no intervening mutation
      of the backend.
    invariants:
      - "Backend impls hold no mutable state across lower calls"
      - "Artifact.primary serialization is canonical (no timestamps, no random salts)"
      - "Artifact.sidecars ordering is deterministic (BTreeMap, not HashMap)"
    preconditions:
      - "module is a well-formed meta-HIR Module"
      - "config.target is in this backend's targets()"

  target_consistency:
    # PMAT-157 / XPILE-REFINE-BACKEND-TRAIT-001: Silver-tier
    # refinement theorem. Mirror of PMAT-156's Frontend-side
    # source_lang_consistency_silver. Introduces a typed `Target`
    # enum + `ArtifactSilver` carrying both bytes and target tag,
    # plus a `Backend` struct with a `declared_target` field.
    # Proves `result.target = b.declared_target` at the type level.
    lean_theorem: "XpileContracts.CXpileBackendTrait.target_consistency_silver"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    # PMAT-283: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 caveat. Bronze lower_idempotency proved
    # determinism on (module, config) -> Artifact { bytes } — a buggy
    # Rust backend that detected GPU intrinsics and switched targets
    # (Rust -> PTX) silently would still pass Bronze idempotency
    # (deterministic per input). Silver introduces explicit target +
    # declared_target fields and proves consistency. Companion
    # harness lower_idempotency_silver re-proves idempotency at the
    # structured level. Mirror of PMAT-282 (Frontend side).
    kani_harness: "target_consistency_silver"
    kani_file: "contracts/kani/xpile_backend_trait.rs"
    formula: |
      forall b, (module, config): b.lower(module, config).unwrap().primary
        parses or links cleanly under config.target's reference toolchain
    domain: |
      The reference toolchain per target:
        - Target::Rust  → rustc --edition 2024 (parse only)
        - Target::Ruchy → ruchy parse
        - Target::Ptx   → ptxas --gpu-name <hw>
        - Target::Wgsl  → naga validate
        - Target::Spirv → spirv-val
        - Target::Lean  → lake env lean --check
    invariants:
      - "emitted Artifact.primary is not just syntactically a String — it must validate as the declared target"
      - "validation is a structural check (parse/link), not a regex pattern match"
      - "validation failure is a hard backend bug, not advisory"
    preconditions:
      - "the reference toolchain for config.target is available in the test environment"

  consistent_backend_input_gold:
    # PMAT-195 / XPILE-REFINE-BACKEND-TRAIT-002: TENTH Gold-tier
    # refinement in the substrate. Mirror of PMAT-194's
    # ConsistentFrontendOutput on the Backend side. Together
    # they close both ends of the 2×2 trait matrix at Gold tier
    # for typed-target/source_lang consistency. Uses the same
    # cross-field equality pattern (a.field = b.field) introduced
    # in PMAT-194. Companion theorems consistent_input_witness_gold
    # and gold_backend_agrees_with_silver.
    lean_theorem: "XpileContracts.CXpileBackendTrait.consistent_backend_input_gold"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      lower_gold(b, m, c).artifact.target
        == lower_gold(b, m, c).backend.declared_target
      BY TYPE  (witness travels with the pair)
    domain: |
      Same as target_consistency — every Backend impl. The Gold
      upgrade encodes the consistency invariant at the type
      level via a pair-with-witness refinement subtype.
    invariants:
      - "ConsistentBackendInput pairs a Backend with its lowered ArtifactSilver under a TYPE-LEVEL proof that target = declared_target"
      - "consistency witness travels with the pair through extraction — no per-call-site re-proof needed"
      - "mirror of PMAT-194's frontend Gold — together they close both ends of the 2×2 trait matrix at Gold tier"
      - "demonstrates cross-field equality Gold pattern is portable across both forward (frontend) and reverse (backend) trait directions"
    preconditions:
      - "the Backend impl is well-formed (Silver model preconditions inherited)"
      - "the Gold subtype carries the proof obligation by construction"
    postconditions:
      - "an emitter returning a (backend, artifact) pair where target ≠ declared_target would not type-check against lower_gold"
      - "downstream consumers receiving a ConsistentBackendInput can rely on field consistency without runtime checks"

  target_deterministic_platinum:
    # PMAT-211 / XPILE-REFINE-BACKEND-TRAIT-003: TWELFTH
    # Platinum-tier refinement. Mirror of PMAT-210's source-lang
    # determinism on Frontend side — together they close the
    # 2×2 trait matrix at Platinum tier for typed-tag
    # determinism. Same algebraic shape as PMAT-210 (input-
    # determinism / output-independence). Companion theorems
    # target_class_congruent_platinum (equivalence-class
    # structure) and target_consistency_universal_platinum
    # (universal-quantifier closure).
    lean_theorem: "XpileContracts.CXpileBackendTrait.target_deterministic_platinum"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      forall b, m1 c1 m2 c2:
        lower(b, m1, c1).target == lower(b, m2, c2).target
      (input-determinism / output-independence)
    domain: |
      Any Backend impl, evaluated on any two (module, config)
      input pairs. The Platinum upgrade captures that the
      target tag is INDEPENDENT of input content.
    invariants:
      - "TWELFTH Platinum theorem; mirrors PMAT-210 on the Backend side"
      - "together PMAT-210/211 close the 2×2 trait matrix at Platinum tier for determinism"
      - "captures Hoare-style 'result depends only on fixed parameters' determinism on the reverse-direction lift"
      - "target_class_congruent_platinum companion captures equivalence-class structure via declared_target"
      - "target_consistency_universal_platinum companion is the universal-quantifier closure of PMAT-157"
    preconditions:
      - "the Backend impl is well-formed (Silver model preconditions inherited)"
      - "no precondition on input variation — determinism holds for ANY pair of inputs"
    postconditions:
      - "a Backend that auto-selects target via IR introspection (e.g., emitting PTX when GPU-intrinsics appear) would falsify this theorem"
      - "the contract's modelling commitment is that target comes from declared_target, NOT from module introspection"

  backend_equivalence_class_diamond:
    # PMAT-225 / XPILE-REFINE-BACKEND-TRAIT-004: ELEVENTH
    # Diamond-tier refinement. Mirror of PMAT-224 on Backend
    # side. Together PMAT-224 + PMAT-225 close the 2×2 trait
    # matrix at Diamond tier for equivalence-class structure.
    lean_theorem: "XpileContracts.CXpileBackendTrait.backend_equivalence_class_diamond"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      target_equiv forms an EQUIVALENCE RELATION on Backend +
      PMAT-211 determinism preservation
    domain: |
      Any Backend values under target_equiv. The Diamond upgrade
      captures the equivalence-class structure on declared_target.
    invariants:
      - "ELEVENTH Diamond-tier theorem; mirror of PMAT-224 on Backend side"
      - "BACKEND EQUIVALENCE CLASS — algebraic classification by declared_target"
      - "together PMAT-224 + PMAT-225 close the 2×2 trait matrix at Diamond tier"
    preconditions:
      - "three well-formed Backend values"
    postconditions:
      - "Backend impls are classifiable by their declared_target"
      - "an emitter that auto-selects target would break BOTH PMAT-211 determinism AND the Diamond equivalence-class structure"

  target_constant_projection_diamond:
    # PMAT-235 / XPILE-REFINE-BACKEND-TRAIT-005: SECOND Diamond
    # on this contract — Layer 3 depth-2. Mirror of PMAT-232 on
    # the Frontend side. Together with PMAT-232, this CLOSES the
    # 2x2 trait matrix at depth-2 for the constant-projection
    # pattern. The TARGET-CONSTANT-PROJECTION Diamond is a
    # fundamentally distinct algebraic category from PMAT-225's
    # equivalence-relation Diamond.
    lean_theorem: "XpileContracts.CXpileBackendTrait.target_constant_projection_diamond"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      target is a CONSTANT-PROJECTION from Backend to lang:
        (a) constant in module: target(m, c) = target(m', c)
        (b) constant in config: target(m, c) = target(m, c')
        (c) projection: target = b.declared_target
        (d) jointly constant: target fixed across all input pairs
    domain: |
      Any Backend b and Array UInt8 inputs (m, c, m', c'). The
      Diamond upgrade captures the FUNCTORIAL property that the
      target projection is fully determined by the backend
      choice — inputs cannot override it.
    invariants:
      - "SECOND Diamond category on C-XPILE-BACKEND-TRAIT — mirrors PMAT-232 on Frontend side"
      - "distinct algebraic category from PMAT-225 equivalence-relation"
      - "together with PMAT-232 closes the 2x2 trait matrix at depth-2 for constant-projection"
    preconditions:
      - "well-formed Backend b with four arbitrary module/config byte arrays"
    postconditions:
      - "an emitter that introspects module bytes and re-tags target based on heuristic detection (e.g., emitting PTX on CUDA intrinsics) would falsify this Diamond"
      - "2x2 trait matrix at depth-2: complete with both Frontend (PMAT-232) and Backend (this PR) constant-projection Diamonds"

  compile_contract_citation:
    formula: |
      forall b, (module, config), instr in ir_constructs(Artifact.primary):
        exists C5 in Artifact.citations:
          C5.xpile.layer == "compile" AND
          C5.compile_targets covers config.target AND
          instr is sanctioned by C5.equations
    domain: |
      Every IR-level construct in Artifact.primary that is target-specific
      (e.g., mma.sync in PTX, @workgroup_size in WGSL, asm! in Rust)
      must cite a Layer-5 compile contract that sanctions emitting it.
      Pure language-level constructs (function definitions, structs,
      arithmetic) do NOT require a citation — they fall under the source
      language's Layer-1/2 contracts via meta-HIR.
    invariants:
      - "every target-specific IR construct has a Layer-5 citation"
      - "the citation chain is structural (Artifact.citations: Vec<ContractId>) — NOT regex over Artifact.primary text"
      - "no citation = no emission: if a backend wants to emit a new hardware instruction, it must add a Layer-5 contract first"
      - "this invariant is what closes the Oracle blind spot for hardware misuse (per audit-design.md §3 'Formal Hardware Sanctioning')"
    preconditions:
      - "the Layer-5 contract corpus is loaded into the session"

  frame_lower_is_pure:
    formula: |
      lower(module, config) does not mutate module or config or any
      shared state reachable from the backend
    domain: |
      Any invocation of lower(). Backends must be functionally pure
      with respect to their inputs.
    invariants:
      - "hash(module) before == hash(module) after"
      - "hash(config) before == hash(config) after"
      - "no backend-internal mutable cache is permitted to escape lower()"
    preconditions: []

  artifact_struct_extensionality_diamond:
    # PMAT-331: THIRD Diamond on this contract — BROADENS DEPTH-3
    # from 6 to 7 contracts. Pushes XpileBackendTrait (Layer 3)
    # from depth-2 to depth-3, adding a SECOND Layer 3 contract at
    # depth-3 (XpileFrontendTrait was first). ArtifactSilver
    # STRUCTURE EXTENSIONALITY: the record type is field-extensional
    # with decidable equality. Mirror of PMAT-311 (BoundedSmem),
    # PMAT-329 (OutcomeSilver), PMAT-330 (MetaHirModuleSilver) —
    # fourth substrate-wide demonstration of this structural pattern.
    lean_theorem: "XpileContracts.CXpileBackendTrait.artifact_struct_extensionality_diamond"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      ArtifactSilver admits STRUCTURE EXTENSIONALITY:
        (a) field eq → record eq
        (b) record eq → field eq (congruence)
        (c) decidable equality
        (d) self-equality (reflexivity)
    domain: |
      Two ArtifactSilver records (bytes : Array UInt8, target : Target).
      The four properties together axiomatize the record-type structure.
    invariants:
      - "THIRD Diamond category on C-XPILE-BACKEND-TRAIT — BROADENS DEPTH-3 from 6 to 7 contracts"
      - "RECORD-STRUCTURE / SUBTYPE-LIKE claim, fourth substrate-wide demonstration of this pattern (after PMAT-311, PMAT-329, PMAT-330)"
      - "distinct from PMAT-225 equivalence-class and PMAT-235 constant-projection — captures the OUTPUT RECORD TYPE structure"
    preconditions:
      - "two ArtifactSilver records (with derived DecidableEq instance)"
    postconditions:
      - "an emitter introducing phantom fields (e.g., compiler_version_hash) or stripping fields would falsify (a)"
      - "Diamond depth-3 broadened: 7 contracts at depth-3+"

  target_enum_distinctness_diamond:
    # PMAT-339: FOURTH Diamond on this contract — BROADENS DEPTH-4
    # from 6 to 7 contracts. Pushes XpileBackendTrait (Layer 3)
    # from depth-3 to depth-4, adding SECOND Layer 3 contract at
    # depth-4 (XpileFrontendTrait was first via PMAT-330). TARGET
    # ENUM DISTINCTNESS: the 7-variant Target enumeration has
    # pairwise distinct constructors with decidable equality.
    lean_theorem: "XpileContracts.CXpileBackendTrait.target_enum_distinctness_diamond"
    lean_file: "contracts/lean/XpileBackendTrait.lean"
    formula: |
      Target is a 7-variant decidable enumeration with distinct constructors:
        (a) rust ≠ ruchy
        (b) ptx ≠ shell
        (c) self-equality (reflexivity)
        (d) decidable equality
    domain: |
      Any Target value. The four properties together axiomatize
      Target as a finite, decidable, pairwise-distinct enumeration.
    invariants:
      - "FOURTH Diamond category on C-XPILE-BACKEND-TRAIT — BROADENS DEPTH-4 from 6 to 7 contracts"
      - "FINITE ENUMERATION DECIDABILITY — distinct from value-level claims (PMAT-225/235/331)"
      - "captures symbolic structure of Target enumeration (7 distinct constructors)"
    preconditions:
      - "Target inductive type with derived DecidableEq"
    postconditions:
      - "an emitter conflating two Target constructors (e.g., emitting PTX when WGSL declared) would falsify enumeration distinctness"
      - "Diamond depth-4 broadened: 7 contracts at depth-4+"

proof_obligations:
  - type: invariant
    property: Every registered Target is owned by exactly one Backend
    formal: "∀ t ∈ registered_targets: |{ b | t ∈ b.targets() }| == 1"
    applies_to: target_ownership

  - type: invariant
    property: lower is deterministic per (module, config)
    formal: "∀ m, cfg: hash(lower(m, cfg)) == hash(lower(m, cfg))"
    applies_to: lower_idempotency

  - type: postcondition
    property: Emitted Artifact.primary validates under the declared target's reference toolchain
    formal: "validates(Artifact.primary, config.target.reference_toolchain) == OK"
    applies_to: target_consistency

  - type: invariant
    property: Every target-specific IR construct cites a Layer-5 compile contract
    formal: "∀ instr ∈ ir_constructs(Artifact.primary): ∃ C5 ∈ Artifact.citations : C5.xpile.layer == 'compile' ∧ sanctions(C5, instr)"
    applies_to: compile_contract_citation

  - type: invariant
    property: Citation chain is structural, not text-grep
    formal: "Artifact.citations is of type Vec<ContractId>; recovery does NOT depend on regex over Artifact.primary"
    applies_to: compile_contract_citation

  - type: frame
    property: lower does not mutate its inputs
    formal: "hash(module) before == hash(module) after ∧ hash(config) before == hash(config) after"
    applies_to: frame_lower_is_pure

falsification_tests:
  - id: FALSIFY-XPILE-BACKEND-001
    rule: |
      Two distinct backends MUST NOT both claim the same Target variant.
    prediction: |
      A TranspileSession that registers two backends with overlapping
      targets() either rejects the second or panics in test.
    test: |
      cargo test -p xpile-core --test backend_dispatch -- duplicate_target
    if_fails: |
      Dispatch is ambiguous. The session cannot decide which backend
      to invoke for Target::Ptx (or Target::Rust, etc.).
    ship_blocking: true
    counter_example_classes:
      - duplicate_target
      - aliased_target

  - id: FALSIFY-XPILE-BACKEND-002
    rule: |
      lower MUST be deterministic for fixed (module, config).
    prediction: |
      Two consecutive lowerings of the same (module, config) hash equal.
    test: |
      cargo test -p xpile-backend --test idempotency
    if_fails: |
      A backend holds mutable state, uses non-canonical serialization
      (HashMap iteration order), or embeds a timestamp. Cache hits
      become false misses; reproducibility across the Kaizen fleet breaks.
    ship_blocking: true
    counter_example_classes:
      - hashmap_iteration_order
      - hidden_mutable_state
      - embedded_timestamp
      - random_label_salt

  - id: FALSIFY-XPILE-BACKEND-003
    rule: |
      Emitted Artifact.primary MUST validate under the declared target's
      reference toolchain (rustc parse, naga validate, ptxas assemble,
      spirv-val, lake env lean --check, etc.).
    prediction: |
      For each Target variant, lowering a representative meta-HIR
      module produces an Artifact.primary that the reference toolchain
      accepts with exit status 0.
    test: |
      cargo test -p xpile-backend --test target_consistency_all
    if_fails: |
      Backend emits a String that LOOKS like Rust (or PTX, or WGSL)
      but isn't parseable by the real tool. Downstream cargo build
      / nvcc / naga / spirv-val will fail with confusing errors far
      from the actual emission site.
    ship_blocking: true
    counter_example_classes:
      - syntax_error_in_emission
      - missing_imports
      - wrong_dialect

  - id: FALSIFY-XPILE-BACKEND-004
    rule: |
      Every target-specific IR construct in Artifact.primary MUST be
      sanctioned by a Layer-5 compile contract referenced from
      Artifact.citations. No citation, no emission.
    prediction: |
      For a backend that emits `mma.sync.aligned`, Artifact.citations
      contains a ContractId pointing at a Layer-5 contract with
      `xpile.layer: compile` and a `compile_targets:` block whose
      `target` includes PTX, AND with at least one equation whose
      invariants permit `mma.sync.aligned` emission for the declared
      hardware (sm_80 or higher).
    test: |
      cargo test -p xpile-backend --test every_ir_construct_cites_contract
    if_fails: |
      Backend is emitting a hardware instruction without contractual
      sanction. Audit chain broken at the load-bearing point — the
      Oracle blind spots for hardware misuse re-emerge in full. This
      is the failure mode that audit-design.md §3 "Formal Hardware
      Sanctioning" relies on Layer 5 to prevent.
    ship_blocking: true
    counter_example_classes:
      - bare_hardware_emission
      - missing_layer5_citation
      - silent_codegen
      - citation_pointing_at_wrong_layer

  - id: FALSIFY-XPILE-BACKEND-005
    rule: |
      Citation recovery from Artifact MUST be structural
      (Artifact.citations: Vec<ContractId>), NOT regex over
      Artifact.primary text. The audit (§4 "Citation Bridge Fragility")
      established this principle for the proof lane; the code lane
      inherits it for symmetry.
    prediction: |
      For a freshly-lowered Artifact, the call
      `Artifact::citations(&artifact)` returns the same set as
      `parse_citation_attributes_via_target_parser(&artifact.primary)`
      — and neither relies on regex over the primary string.
    test: |
      cargo test -p xpile-backend --test citation_is_structural
    if_fails: |
      Citation recovery is regex-based; manual renames in emission
      silently break the audit chain. This is the same failure mode
      the audit identified for the proof lane.
    ship_blocking: true
    counter_example_classes:
      - regex_based_citation_recovery
      - missing_citations_field

  - id: FALSIFY-XPILE-BACKEND-006
    rule: |
      lower MUST NOT mutate the input module or config.
    prediction: |
      hash(module, config) before == hash(module, config) after lower().
    test: |
      cargo test -p xpile-backend --test lower_no_mutation
    if_fails: |
      Hidden side effects break the cache-determinism invariant; cache
      keys become stale; multi-backend pipelines see inconsistent state.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect
      - in_place_normalization

kani_harnesses:
  - id: KANI-XPILE-BACKEND-001
    obligation: target_ownership
    bound: 5
    property: |
      For up to 5 registered backends with up to 3 targets each, no
      Target variant appears in more than one backend's targets() list.
    harness: |
      #[kani::proof]
      fn backend_target_ownership() {
          let backends: [Vec<Target>; 5] = kani::any();
          let union: Vec<Target> = backends.iter().flatten().copied().collect();
          let mut seen = std::collections::BTreeSet::new();
          for t in union {
              kani::assume(seen.insert(t));
          }
      }

  - id: KANI-XPILE-BACKEND-002
    obligation: invariant
    bound: 3
    property: |
      For a bounded Artifact with up to 3 IR-level target-specific
      constructs and up to 3 citations, every construct has a matching
      citation whose xpile.layer is "compile". Validates the structural
      citation chain end-to-end without regex.
    harness: |
      #[kani::proof]
      fn every_construct_has_compile_citation() {
          let n_constructs: usize = kani::any();
          kani::assume(n_constructs <= 3);
          let n_cites: usize = kani::any();
          kani::assume(n_cites <= 3 && n_cites >= n_constructs);
          let artifact: Artifact = kani::any();
          kani::assume(artifact.target_specific_constructs.len() == n_constructs);
          kani::assume(artifact.citations.len() == n_cites);
          for instr in &artifact.target_specific_constructs {
              let cited = artifact.citations.iter()
                  .any(|c| c.xpile_layer() == XpileContractLayer::CompileTime
                       && c.sanctions(instr));
              assert!(cited, "every target-specific construct must cite a Layer-5 contract");
          }
      }
