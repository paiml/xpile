kani_harnesses:
  - id: KANI-PY-INT-ARITH-001
    obligation: addition_no_overflow
    bound: 8
    property: |
      At i8 bit width (256² pairs, exhaustive), addition_no_overflow
      holds: when (a + b) fits in i8, python_int_add(a, b) equals
      wrapping_add(a, b). Lifts algebraically to i64 via Lean.
    harness: |
      #[kani::proof]
      fn addition_no_overflow_i8() {
          let a: i8 = kani::any();
          let b: i8 = kani::any();
          let fits = (a as i16).checked_add(b as i16)
              .map(|s| s >= i8::MIN as i16 && s <= i8::MAX as i16)
              .unwrap_or(false);
          if fits {
              assert_eq!(a.wrapping_add(b), python_int_add_i8(a, b));
          }
      }

  - id: KANI-PY-INT-ARITH-002
    obligation: multiplication_quadratic_promotion
    bound: 8
    property: |
      i8::MIN * -1 must report "promotion required" (not wrap to i8::MIN).
    harness: |
      #[kani::proof]
      fn mul_min_neg_one_promotes() {
          let a: i8 = i8::MIN;
          let b: i8 = -1;
          assert!(needs_promotion_i8_mul(a, b));
      }

