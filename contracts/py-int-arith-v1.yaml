metadata:
  id: C-PY-INT-ARITH
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Operational semantics of Python `int` arithmetic, as observed
    behaviorally in CPython 3.12+. Python's int is mathematically
    unbounded; xpile must preserve that across the Rust output, with
    a fast path through machine integers when the result fits.

    Layer 1 of the xpile contract taxonomy (per-language semantics).
    Paired with `C-XLATE-PY-LIST-TO-VEC-V1` and similar translation
    contracts at Layer 2.
  xpile:
    layer: semantics
  references:
    - "Python Language Reference §6.7 (Binary arithmetic operations)"
    - "CPython Objects/longobject.c"
    - docs/specifications/xpile-contract-driven-design-v1.md
  depends_on: []

equations:
  addition_no_overflow:
    formula: |
      python_int_add(a, b) == rust_i64::wrapping_add(a, b)  WHEN  fits_i64(a + b)
    domain: |
      a, b: Python int values whose mathematical sum fits in i64.
    invariants:
      - "no observable difference between CPython and Rust output when fits_i64(a+b)"
      - "no allocation in the fits_i64 fast path"
    preconditions:
      - "a and b are both Python int (not float, not bool, not bigint-required)"
    postconditions:
      - "the result is bit-identical to CPython `int.__add__(a, b)` evaluated on the same operands"
      - "no heap allocation occurs (the i64 result lives on the stack)"
      - "the emitted Rust uses `.wrapping_add` or equivalent — never `.unchecked_add` or raw `+` that could be optimized to silent UB"
    # XPILE-REFINE-001 / PMAT-017: refinement proof in Lean (Semantic
    # stratum). Statement IS the equation, formalised. v0.1.0 ships
    # the claim with `sorry`; XPILE-REFINE-002 discharges.
    lean_theorem: "XpileContracts.CPyIntArith.fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # XPILE-QUORUM-001 / PMAT-019: Kani BMC harness (Symbolic stratum).
    # `addition_no_overflow` function in the harness file; Kani
    # discharges this automatically via bit-blasted i64 arithmetic.
    # Together with the Lean theorem above and the diff_exec runtime
    # check (PMAT-018), this equation now has ≥1 Symbolic + ≥1
    # Semantic vote per the ruchy 5.0 §14.4 quorum rule.
    kani_harness: "addition_no_overflow"
    kani_file: "contracts/kani/py_int_arith.rs"
    # PMAT-267: FIRST Runtime stratum oracle vote. The proptest-style
    # sweep in `crates/xpile/tests/runtime_strata.rs` transpiles
    # `add.py` end-to-end, compiles it through `rustc -O`, and
    # *executes* the binary against a 4096-pair LCG-generated sweep
    # plus an overflow boundary case. Closes the audit-design.md §4
    # "Run=1 demo fixture" caveat for C-PY-INT-ARITH and makes this
    # the FIRST contract with full §14.4 Sem + Sym + Run stratum
    # coverage. (Run stratum was previously "Run=1 from CI smoke
    # test" — now an independent oracle with 4096 votes.)
    runtime_fixture: "py_int_arith_runtime_stratum_add_matches_python_semantics"
    runtime_fixture_overflow: "py_int_arith_runtime_stratum_overflow_panics"
    runtime_fixture_file: "crates/xpile/tests/runtime_strata.rs"

  add_dispatch_commutative_platinum:
    # PMAT-199 / XPILE-REFINE-PY-INT-ARITH-006: FIRST Platinum-tier
    # refinement in the entire xpile substrate. Opens the next
    # tier beyond Gold per ruchy 5.0 §14.10.5. Platinum captures
    # COMPOSITIONAL ALGEBRAIC PROPERTIES (commutativity,
    # associativity, distributivity, identity) — properties that
    # Bronze/Silver/Gold couldn't express because they're about
    # how multiple call sites COMPOSE, not single-call correctness.
    # Real proof using Int.add_comm — not provable by rfl. Companion
    # theorems mul_dispatch_commutative_platinum and
    # and_dispatch_commutative_platinum extend the pattern across
    # multiplication and bitwise-AND.
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_commutative_platinum"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      forall path, a, b: add_dispatch(path, a, b) == add_dispatch(path, b, a)
    domain: |
      Any path (FastPath | SlowPath) and any Int operands a, b.
      The Platinum upgrade captures the algebraic property that
      addition is commutative — which holds uniformly across the
      dispatch decision.
    invariants:
      - "compositional algebraic property: dispatcher commutes with operand swap"
      - "holds for FastPath (i64 wrapping arithmetic) via Int.add_comm and Int.bmod"
      - "holds for SlowPath (BigInt arithmetic) via Int.add_comm directly"
      - "not provable by rfl — requires the Int.add_comm structural lemma"
      - "first compositional property in the substrate — beyond pointwise (Bronze), structural (Silver), subtype (Gold)"
    preconditions:
      - "no operand-shape preconditions — commutativity is a universal algebraic property of Int addition"
      - "the dispatcher is well-formed (Silver model preconditions inherited via the dispatcher's definition)"
    postconditions:
      - "an emitter that uses a non-commutative representation (e.g., string concatenation before parsing) would falsify the commutativity claim — a real semantic bug class Bronze/Silver/Gold couldn't catch"
      - "Platinum tier captures algebraic STRUCTURE that prior tiers couldn't model"

  add_dispatch_commutative_monoid_diamond:
    # PMAT-214 / XPILE-REFINE-PY-INT-ARITH-008: FIRST Diamond-
    # tier refinement in the entire substrate. Opens the next
    # tier beyond Platinum per ruchy 5.0 §14.10.5. Diamond
    # captures COMBINED algebraic axiomatizations (monoids,
    # rings, semirings) by combining multiple Platinum
    # theorems into single tier-defining theorems. PMAT-214
    # combines PMAT-199 commutativity + PMAT-200 associativity
    # + identity into the commutative-monoid axiomatization
    # for slow-path addition. Companion theorems
    # mul_dispatch_commutative_monoid_diamond and
    # slow_path_semiring_diamond extend to multiplication and
    # the full SEMIRING structure.
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_commutative_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      ∀ a b c : Int.
        (add(a,b) = add(b,a))                 -- commutativity
        ∧ (add(add(a,b),c) = add(a,add(b,c))) -- associativity
        ∧ (add(0, a) = a)                     -- left identity
      (commutative monoid)
    domain: |
      Any Int operands a, b, c on the SlowPath. The Diamond
      upgrade captures the FULL commutative-monoid axiomatization
      combining commutativity + associativity + identity.
    invariants:
      - "FIRST Diamond-tier theorem in the substrate"
      - "COMBINED algebraic axiomatization: commutativity + associativity + identity"
      - "captures the (Int, +, 0) commutative monoid at the type level"
      - "companion theorem mul_dispatch_commutative_monoid_diamond extends to (Int, *, 1)"
      - "companion theorem slow_path_semiring_diamond combines both monoids with distributivity (PMAT-200) into the full SEMIRING axiomatization"
    preconditions:
      - "the dispatcher path is SlowPath (Diamond combines Platinum theorems that hold on SlowPath only — associativity does not hold on FastPath under wrap-around)"
    postconditions:
      - "an emitter satisfying individual Platinum theorems but breaking the joint structure (e.g., position-dependent reductions) would falsify the Diamond conjunction"
      - "Diamond tier captures algebraic STRUCTURE COMPOSITION that prior tiers couldn't axiomatize as a single unit"

  add_dispatch_slow_path_associative_platinum:
    # PMAT-200 / XPILE-REFINE-PY-INT-ARITH-007: SECOND Platinum-tier
    # refinement in the substrate. Demonstrates that the Platinum
    # pattern captures TERNARY compositional properties
    # (associativity), not just binary ones (commutativity from
    # PMAT-199). Slow-path-only because bigint_add (unbounded Int)
    # is genuinely associative, while i64_wrap_add (FastPath) is
    # NOT associative under wrap-around — that asymmetry is itself
    # a Platinum-level observation. Companion theorems
    # mul_dispatch_slow_path_associative_platinum (Int.mul_assoc)
    # and mul_distributes_over_add_slow_path_platinum
    # (Int.mul_add, the first cross-operation distributivity
    # theorem in the substrate).
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_slow_path_associative_platinum"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      add_dispatch(SlowPath, add_dispatch(SlowPath, a, b), c)
        == add_dispatch(SlowPath, a, add_dispatch(SlowPath, b, c))
    domain: |
      Any Int operands a, b, c on the SlowPath. The FastPath is
      NOT associative under wrapping arithmetic — this theorem
      claims the property ONLY for SlowPath / BigInt mode.
    invariants:
      - "ternary compositional property: associativity on the unbounded BigInt path"
      - "fast-path is NOT associative — asymmetry is itself a Platinum-level observation about dispatch"
      - "companion theorem mul_dispatch_slow_path_associative_platinum extends the pattern to multiplication"
      - "companion theorem mul_distributes_over_add_slow_path_platinum is the FIRST cross-operation distributivity theorem in the substrate — ties together additive and multiplicative algebraic structures"
    preconditions:
      - "the dispatcher path is SlowPath (BigInt mode) — associativity does NOT hold on FastPath"
      - "operands are unbounded Int (no fits_i64 constraints needed for SlowPath)"
    postconditions:
      - "an emitter that produces a non-associative slow-path implementation (e.g., truncating at intermediate steps) would falsify this theorem"
      - "monoid/ring algebraic axioms are now structurally captured at the dispatcher level"

  pyint_fast_add_returns_fast_gold:
    # PMAT-185 / XPILE-REFINE-PY-INT-ARITH-005: FIRST Gold-tier
    # refinement in the entire substrate. Promotes Silver's
    # fits_i64-as-hypothesis to a refinement subtype
    # PyIntFast := { n : Int // fits_i64 n }. The fits_i64
    # invariant is carried by the value, not by an external
    # hypothesis. An emitter receiving a PyIntFast cannot pass
    # an out-of-range Int — the type system rules it out at
    # compile time. Companion theorems pyint_fast_witness_gold
    # and gold_subtype_agrees_with_silver_dispatch.
    lean_theorem: "XpileContracts.CPyIntArith.pyint_fast_add_returns_fast_gold"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      PyIntFast.add_with_fits_proof(a, b, h_sum).val == a.val + b.val
    domain: |
      Two PyIntFast operands (each carries its own fits_i64
      witness) plus a proof that their sum also fits. The Gold
      upgrade captures what Silver couldn't model — the fits_i64
      proof TRAVELS WITH the value through subsequent calls.
    invariants:
      - "PyIntFast values carry their fits_i64 witness with them (witness theorem pyint_fast_witness_gold)"
      - "downstream code can chain PyIntFast additions without re-proving fits_i64 at every step — the type system enforces it"
      - "Gold-tier refinement subtype rules out invalid inputs at CONSTRUCTION time (caller without a fits_i64 proof can't create the PyIntFast)"
      - "bridges to the Silver model via gold_subtype_agrees_with_silver_dispatch — both Silver and Gold agree on the fits domain"
    preconditions:
      - "both operands are PyIntFast (carry their own fits_i64 witness)"
      - "h_sum : fits_i64 (a.val + b.val) — the carry-out check that addition can introduce a witness that the operands don't have alone"
    postconditions:
      - "the result is a PyIntFast (the fits_i64 proof is preserved at the type level for subsequent calls)"
      - "an emitter accepting raw Int values is upgradeable to PyIntFast by inserting fits_i64-proof construction at the boundary — once inside the typed region, no precondition propagation needed"
      - "this is the archetype Gold-tier refinement pattern per ruchy 5.0 §14.10.5: structural typing + subtype-encoded preconditions"

  dispatch_correct_on_fits_silver:
    # PMAT-169 / XPILE-REFINE-PY-INT-ARITH-001: Silver-tier
    # refinement promotes the Bronze pointwise-equality model of
    # addition_no_overflow to a typed-dispatch model. Introduces
    # PyIntPath { FastPath | SlowPath } and proves that the
    # dispatcher selects either path correctly: fast/slow agree on
    # fits_i64, slow path always returns the mathematical sum,
    # dispatcher is total. Captures the load-bearing emission
    # decision xpile-rust-codegen makes at codegen time (which
    # Bronze couldn't model since it only had per-operation
    # equality). SIXTH multi-eq contract Silver upgrade (after
    # PMAT-164/165/166/167/168) and the FIRST Silver on a
    # substantive Bronze base (the previous Silver upgrades
    # promoted byte-array Bronze; this one promotes already-
    # substantive Int-level Bronze to a typed-dispatch Silver).
    lean_theorem: "XpileContracts.CPyIntArith.dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      add_dispatch(FastPath, a, b) == add_dispatch(SlowPath, a, b)  WHEN  fits_i64(a + b)
    domain: |
      Same as addition_no_overflow — a, b Python int values whose
      mathematical sum fits in i64. The Silver upgrade lifts the
      Bronze pairwise-equality claim into a typed dispatcher.
    invariants:
      - "the dispatcher is total: every (path, a, b) yields a defined value (no stuck state at codegen time)"
      - "fast and slow paths agree on the fits_i64 domain — the load-bearing soundness condition for emitting i64 wrapping arithmetic"
      - "the slow path returns the mathematical sum on EVERY input (subsumes add_slow_path_eq_python at the dispatcher level)"
    preconditions:
      - "for the fast-path agreement claim: fits_i64(a + b) must hold (the contract precondition for emitting i64_wrap_add)"
      - "the slow-path soundness claim has no precondition (the safety net branch)"
    postconditions:
      - "an emitter that selects FastPath when fits_i64 fails would falsify dispatch_correct_on_fits_silver — captures the path-selection error that Bronze couldn't detect"
      - "the dispatch model is what xpile-rust-codegen actually encodes; companion theorems dispatch_slow_path_eq_python_silver and dispatch_total_silver in the same Lean file complete the structural Silver story"

  addition_overflow_promotion:
    formula: |
      python_int_add(a, b) == bigint::add(a, b)  WHEN  not fits_i64(a + b)
    domain: |
      a, b: Python ints whose mathematical sum does not fit in i64.
    invariants:
      - "the result equals the mathematically exact a + b"
      - "no information loss compared to CPython"
      - "exactly one heap allocation (the BigInt result)"
    preconditions:
      - "a and b are both Python int (BigInt-eligible)"
      - "the function is lowered in BigInt mode (return-type annotation `-> BigInt`, per PMAT-013)"
    postconditions:
      - "the result equals the mathematically exact `a + b` (no truncation, no wrapping)"
      - "the result equals CPython `int.__add__(a, b)` evaluated on the same operands (bit-identical via the value's BigInt encoding)"
      - "the BigInt allocation uses `xpile_bigint::BigInt` (the canonical runtime, not a hand-rolled type)"
    # XPILE-REFINE-006 / PMAT-034: slow-path soundness theorem. Both
    # CPython's `int.__add__` and our model of `xpile_bigint::BigInt::add`
    # are unbounded mathematical addition; the theorem reduces to `rfl`
    # by our definitional choice (`bigint_add a b := a + b`). The
    # `¬ fits_i64` hypothesis is the operational trigger, not a math
    # precondition — it documents which equation this theorem refines.
    lean_theorem: "XpileContracts.CPyIntArith.add_slow_path_eq_python"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "addition_overflow_promotion"
    kani_file: "contracts/kani/py_int_arith.rs"

  bigint_addition_is_heap_allocated_silver:
    # PMAT-183 / XPILE-REFINE-PY-INT-ARITH-004: Silver-tier
    # refinement wires the slow-path-only companion equation.
    # Bronze (add_slow_path_eq_python) proved the slow path
    # returns the mathematical sum; Silver adds a typed
    # BigIntResult { value, allocation : Heap | Stack } that
    # captures the load-bearing allocation semantics. Companion
    # theorem bigint_addition_value_eq_math_silver keeps the
    # Bronze sum-equality claim in the Silver model. PMAT-183
    # completed Silver coverage on the nine equations
    # C-PY-INT-ARITH then carried, as the sixth multi-equation
    # contract to reach that state. PMAT-1457: this comment used
    # to add "(9/9)" and to claim finality; the contract now
    # carries 42 equations, nine of them still Bronze, and no
    # multi-equation contract in the substrate is discharged at
    # Silver-or-better on every equation.
    lean_theorem: "XpileContracts.CPyIntArith.bigint_addition_is_heap_allocated_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      bigint_add_with_allocation(a, b).allocation == Heap
    domain: |
      Same as addition_overflow_promotion — a, b Python ints whose
      mathematical sum does not fit in i64.
    invariants:
      - "the slow-path result is HEAP-ALLOCATED (Allocation::Heap), never stack-allocated as a wrapped i64"
      - "the result value equals the mathematical sum (companion theorem bigint_addition_value_eq_math_silver)"
      - "captures the load-bearing 'exactly one heap allocation' invariant at the type level — Bronze couldn't model allocation strategy"
    preconditions:
      - "the function is lowered in BigInt mode"
      - "the Silver model assumes a 2-state allocation enum (Stack | Heap); Gold tier introduces refinement subtypes for allocator tracking"
    postconditions:
      - "an emitter that optimises small BigInt values onto the stack as wrapped i64 (SmallVec-style representation) would falsify the Silver theorem — caught at the typed-enum level"
      - "the heap-allocation contract is structurally locked-in regardless of value magnitude"

  multiplication_quadratic_promotion:
    formula: |
      python_int_mul(a, b) == if fits_i64(a * b) { rust_i64::wrapping_mul(a, b) } else { bigint::mul(a, b) }
    domain: |
      a, b: Python ints. Special case: i64::MIN * -1 always promotes.
    invariants:
      - "result matches CPython for all (a, b) including i64::MIN * -1 which CPython promotes to bigint"
      - "i64::MIN.wrapping_mul(-1) == i64::MIN — Rust wraps; CPython promotes; we MUST follow CPython"
    preconditions:
      - "a and b are both Python int"
    postconditions:
      - "the result equals CPython `int.__mul__(a, b)` evaluated on the same operands"
      - "the i64::MIN * -1 case is handled via promotion to BigInt (not a silent wrap)"
      - "the dispatch between fast (i64) and slow (BigInt) path is deterministic on (a, b) — no run-to-run variance"
    # XPILE-REFINE-003 / PMAT-029: refinement proof for the *fast path*
    # half of the equation. The slow-path / promotion half is
    # XPILE-REFINE-004+.
    lean_theorem: "XpileContracts.CPyIntArith.mul_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "multiplication_quadratic_promotion"
    kani_file: "contracts/kani/py_int_arith.rs"

  mul_dispatch_correct_on_fits_silver:
    # PMAT-175 / XPILE-REFINE-PY-INT-ARITH-002: Silver-tier
    # dispatcher for multiplication. Replicates the PMAT-169
    # pattern (typed PyIntPath { FastPath | SlowPath } +
    # mul_dispatch_silver). Captures the path-selection decision
    # xpile-rust-codegen makes per `*` call site. Composes with
    # the Bronze mul_fast_path_eq_slow_path at the dispatcher
    # level. Companion theorems mul_dispatch_slow_path_eq_python_
    # silver and mul_dispatch_total_silver in same file.
    lean_theorem: "XpileContracts.CPyIntArith.mul_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      mul_dispatch(FastPath, a, b) == mul_dispatch(SlowPath, a, b)  WHEN  fits_i64(a * b)
    domain: |
      Same as multiplication_quadratic_promotion — a, b Python int values whose
      mathematical product fits in i64. The Silver upgrade lifts
      the Bronze pairwise-equality claim into a typed dispatcher.
    invariants:
      - "fast and slow multiplication paths agree on the fits_i64-of-product domain"
      - "the slow path returns the mathematical product on EVERY input (companion theorem)"
      - "the multiplication dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a * b) — the contract precondition for emitting i64_wrap_mul"
    postconditions:
      - "an emitter that selects FastPath when fits_i64(a*b) fails would falsify the dispatch claim — captures the i64::MIN * -1 silent-wrap bug class"

  division_floor_semantics:
    formula: |
      python_int_floordiv(a, b) == floor(a / b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `//` is FLOOR division;
      Rust `/` is TRUNCATING.
    invariants:
      - "for mixed-sign operands Python and Rust diverge by one — must be corrected in translation"
      - "div_euclid is closer to floor but still diverges when remainder is zero — handle that case"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fdiv a b` (floor division) for all (a, b) with b != 0"
      - "for mixed-sign operands, the result diverges from Rust's truncating `/` — the emitted code uses `checked_div_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__floordiv__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: refinement proof. Both fast and
    # slow path model floor-div as `Int.fdiv`, so the theorem reduces
    # to `rfl`; the load-bearing claim is that this *identity*
    # observation is recorded next to the equation rather than
    # implicit in the prose.
    lean_theorem: "XpileContracts.CPyIntArith.floor_div_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "division_floor_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  floor_div_dispatch_correct_on_fits_silver:
    # PMAT-175: Silver-tier dispatcher for floor-division.
    # Replicates PMAT-169's pattern. Even though fast and slow
    # paths reduce to the same Int.fdiv operation, the SELECTION
    # decision is what the Silver theorem captures (Bronze
    # couldn't model the dispatcher itself).
    lean_theorem: "XpileContracts.CPyIntArith.floor_div_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      floor_div_dispatch(FastPath, a, b) == floor_div_dispatch(SlowPath, a, b)
        WHEN b != 0 AND fits_i64(Int.fdiv a b)
    domain: |
      Same as division_floor_semantics — a, b Python ints with b != 0.
    invariants:
      - "fast and slow floor-div paths agree on the fits_i64-of-quotient domain with b != 0"
      - "the slow path returns Int.fdiv on every input (b != 0) — companion theorem"
      - "the floor-div dispatcher is total (companion theorem)"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
      - "fits_i64(Int.fdiv a b) for the fast-path agreement claim"
    postconditions:
      - "an emitter that uses Rust's truncating `/` instead of checked_div_euclid would diverge from CPython on mixed-sign operands — caught by the dispatcher's slow-path soundness claim"

  modulo_floor_semantics:
    formula: |
      python_int_mod(a, b) == floor_mod(a, b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `%` is FLOOR mod
      (sign of result matches sign of divisor); Rust `%` is
      TRUNCATING mod (sign matches sign of dividend).
    invariants:
      - "for mixed-sign operands Python and Rust diverge — must use rem_euclid or equivalent in translation"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fmod a b` (sign matches divisor) for all (a, b) with b != 0"
      - "for mixed-sign operands the result diverges from Rust's truncating `%` — the emitted code uses `checked_rem_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__mod__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: same `rfl` structure as floor div.
    # Both paths model mod as `Int.fmod`.
    lean_theorem: "XpileContracts.CPyIntArith.mod_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "modulo_floor_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  mod_dispatch_correct_on_fits_silver:
    # PMAT-175: Silver-tier dispatcher for modulo. Replicates
    # PMAT-169's pattern. Same domain story as floor-division —
    # both paths reduce to Int.fmod; the Silver claim is on the
    # path-selection decision.
    lean_theorem: "XpileContracts.CPyIntArith.mod_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      mod_dispatch(FastPath, a, b) == mod_dispatch(SlowPath, a, b)
        WHEN b != 0 AND fits_i64(Int.fmod a b)
    domain: |
      Same as modulo_floor_semantics — a, b Python ints with b != 0.
    invariants:
      - "fast and slow modulo paths agree on the fits_i64-of-remainder domain with b != 0"
      - "the slow path returns Int.fmod on every input (b != 0) — companion theorem"
      - "the modulo dispatcher is total (companion theorem)"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError)"
      - "fits_i64(Int.fmod a b) for the fast-path agreement claim"
    postconditions:
      - "an emitter that uses Rust's truncating `%` instead of checked_rem_euclid would diverge from CPython on mixed-sign operands"
    kani_file: "contracts/kani/py_int_arith.rs"

  division_algorithm_diamond:
    # PMAT-228 / XPILE-REFINE-PY-INT-ARITH-009: SECOND Diamond-
    # tier refinement on C-PY-INT-ARITH. First DEPTH-2 Diamond in
    # the entire substrate — opens Diamond breadth. Previously,
    # every contract had at most one Diamond category; PMAT-228
    # adds the EUCLIDEAN-DOMAIN Diamond on the same contract that
    # already has the commutative-monoid / semiring Diamond
    # (PMAT-214). The two Diamonds capture distinct algebraic
    # categories: PMAT-214 is (Int, +, 0, *, 1) as semiring;
    # PMAT-228 is (Int, fdiv, fmod) satisfying the canonical
    # division algorithm.
    lean_theorem: "XpileContracts.CPyIntArith.division_algorithm_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      ∀ a b : Int.
        (a fmod b + b * (a fdiv b) = a)                 -- division algorithm
        ∧ (floor_div_dispatch SlowPath a b = Int.fdiv a b)
        ∧ (mod_dispatch SlowPath a b = Int.fmod a b)
        ∧ (mod_dispatch SlowPath a b
            + b * floor_div_dispatch SlowPath a b = a)   -- composed
      (Euclidean-domain axiomatization)
    domain: |
      Any Int operands a, b on the SlowPath. The Diamond upgrade
      captures the FULL Euclidean-domain axiomatization, including
      the canonical division algorithm and slow-path dispatcher
      soundness. b = 0 is admitted in the algebraic statement
      because Int.fdiv / Int.fmod default to 0 at b = 0 in Lean,
      satisfying the identity trivially; runtime emission still
      enforces b ≠ 0 via Python's ZeroDivisionError semantics.
    invariants:
      - "SECOND Diamond-tier theorem on C-PY-INT-ARITH — opens Diamond breadth (first DEPTH-2 Diamond in the substrate)"
      - "fundamentally distinct algebraic category from PMAT-214 (semiring vs Euclidean-domain)"
      - "captures (Int, fdiv, fmod) as a Euclidean domain at the type level"
      - "the division algorithm holds when both dispatchers are read on the slow path"
    preconditions:
      - "Lean's Int.fdiv / Int.fmod default to 0 at b = 0 — the algebraic identity holds for ALL b including 0"
    postconditions:
      - "an emitter that uses C-style truncating div instead of Python floor-div would falsify the division algorithm on negative dividends"
      - "Diamond BREADTH demonstrated: 2 distinct Diamond categories on the same contract is possible"
      - "the substrate's Diamond tier can now demonstrate algebraic depth-2 — multiple categories per contract"

  shift_monoid_diamond:
    # PMAT-241 / XPILE-REFINE-PY-INT-ARITH-010: THIRD Diamond on
    # this contract — first DEPTH-3 Diamond in the substrate.
    # SHIFT-MONOID Diamond: (Int × Nat, shl, 0) forms a monoid
    # action of (Nat, +, 0) on Int via powers of 2. Distinct
    # algebraic category from PMAT-214 semiring and PMAT-228
    # Euclidean-domain — captures exponent-indexed multiplicative
    # structure via shift composition law shl(shl(a, b1), b2) =
    # shl(a, b1 + b2).
    lean_theorem: "XpileContracts.CPyIntArith.shift_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Left-shift forms a MONOID action of (Nat, +, 0) on Int:
        (a) slow-path semantics: shl(a, b) = a * 2^b
        (b) exponent additivity: shl(shl(a, b1), b2)
                                   = shl(a, b1 + b2)
        (c) identity: shl(a, 0) = a
        (d) zero on zero input: shl(0, b) = 0
    domain: |
      Any Int operand a and Nat shift amounts b1, b2 on the
      SlowPath. The Diamond captures the full shift-monoid
      axiomatization as a third orthogonal algebraic structure
      on top of the semiring (PMAT-214) and Euclidean-domain
      (PMAT-228) Diamonds.
    invariants:
      - "FIRST DEPTH-3 Diamond in the substrate — three orthogonal algebraic categories on the same contract"
      - "distinct from PMAT-214 semiring (additive/multiplicative) and PMAT-228 Euclidean-domain (division)"
      - "captures (Nat, +, 0) → Int shift-action as a monoid homomorphism"
    preconditions:
      - "SlowPath dispatcher (shift-monoid axioms hold under unbounded Int, not FastPath wrap-around)"
    postconditions:
      - "an emitter that uses wrap-around shift on the slow path would falsify the exponent-additivity composition law"
      - "Diamond DEPTH-3 demonstrated: three distinct algebraic categories on PyIntArith — opens new dimension of refinement"

  power_monoid_diamond:
    # PMAT-247 / XPILE-REFINE-PY-INT-ARITH-011: FOURTH Diamond on
    # this contract — FIRST DEPTH-4 Diamond in substrate. Opens
    # Diamond depth-4. POWER-MONOID Diamond captures (Int × Nat,
    # pow, 0) Nat-action via exponentiation a^b. Distinct from
    # PMAT-214 semiring (additive/multiplicative), PMAT-228
    # Euclidean-domain (division), and PMAT-241 shift-monoid
    # (multiplication by 2^b — fixed base).
    lean_theorem: "XpileContracts.CPyIntArith.power_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      pow forms a MONOID ACTION of (Nat, +, 0) on Int via
      exponentiation:
        (a) slow-path semantics: pow(a, b) = a^b
        (b) identity: pow(a, 0) = 1
        (c) single application: pow(a, 1) = a
        (d) exponent additivity: pow(a, b1+b2)
                                   = pow(a, b1) * pow(a, b2)
    domain: |
      Any Int base a and Nat exponents b1, b2 on the SlowPath.
      The Diamond captures the FULL power-monoid axiomatization
      as a fourth orthogonal algebraic structure on PyIntArith.
    invariants:
      - "FIRST DEPTH-4 Diamond in the substrate — four orthogonal algebraic categories on PyIntArith"
      - "distinct from PMAT-214 semiring AND PMAT-228 Euclidean-domain AND PMAT-241 shift-monoid (fixed-base power)"
      - "captures (Nat, +, 0) → Int power-action as a monoid homomorphism with arbitrary base"
    preconditions:
      - "SlowPath dispatcher (power-monoid axioms hold under unbounded Int, not FastPath wrap-around)"
    postconditions:
      - "an emitter that truncates exponents > 63 to zero on the slow path would falsify the exponent-additivity law"
      - "Diamond DEPTH-4 demonstrated: four distinct algebraic categories on PyIntArith — opens depth-4 dimension"

  bitwise_and_commutative_monoid_diamond:
    # PMAT-286 / XPILE-REFINE-PY-INT-ARITH-012: FIFTH Diamond on this
    # contract — FIRST DEPTH-5 Diamond in substrate. Opens Diamond
    # depth-5. BITWISE-AND-COMMUTATIVE-MONOID Diamond captures the
    # (Int, &, ...) bitwise structure via the Nat.land kernel and
    # the 2's-complement encoding. Distinct from PMAT-214 semiring,
    # PMAT-228 Euclidean-domain, PMAT-241 shift-monoid, PMAT-247
    # power-monoid — bitwise AND lives on BITS of the 2's-complement
    # encoding, NOT on arithmetic structure.
    lean_theorem: "XpileContracts.CPyIntArith.bitwise_and_commutative_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      bitwise AND forms a COMMUTATIVE MONOID via the Nat.land kernel:
        (a) dispatcher commutativity: and(a, b) = and(b, a)
        (b) slow-path = bigint_and (kernel correspondence)
        (c) kernel commutativity: bigint_and(a, b) = bigint_and(b, a)
        (d) modelling commitment: bigint_and = i64_and (shared kernel)
    domain: |
      Any Int operands a, b on any PyIntPath. The Diamond captures
      the bitwise-AND structural axiomatization as a fifth orthogonal
      algebraic category on PyIntArith.
    invariants:
      - "FIRST DEPTH-5 Diamond in the substrate — five orthogonal algebraic categories on PyIntArith"
      - "distinct from PMAT-214 semiring AND PMAT-228 Euclidean-domain AND PMAT-241 shift-monoid AND PMAT-247 power-monoid"
      - "captures (Int, &) as a commutative monoid via the Nat.land kernel — orthogonal to (Int, +) and (Int, *) since bitwise AND does not distribute over addition"
      - "the modelling commitment bigint_and = i64_and (XPILE-REFINE-005 / PMAT-138) is part of the Diamond claim — an emitter that swaps either kernel would falsify (d)"
    preconditions:
      - "the dispatcher and kernels are well-formed (Silver / Platinum preconditions inherited via PMAT-202 and_dispatch_commutative_platinum)"
    postconditions:
      - "an emitter that uses a distinct unbounded bit-AND for bigint_and (e.g., Python-native sign-magnitude AND that disagrees with the 2's-complement-via-i64 kernel) would falsify (d) and break the bitwise-AND-monoid structure"
      - "Diamond DEPTH-5 demonstrated: five distinct algebraic categories on PyIntArith — opens depth-5 dimension"

  negation_involution_abelian_group_diamond:
    # PMAT-290 / XPILE-REFINE-PY-INT-ARITH-013: SIXTH Diamond on this
    # contract — FIRST DEPTH-6 Diamond in substrate. Opens Diamond
    # depth-6. The NEGATION-INVOLUTION / ABELIAN-GROUP-ENRICHMENT
    # Diamond captures the (Int, +, 0, -) abelian-group structure
    # via Int.neg, distinct from PMAT-214's additive commutative
    # monoid (which doesn't include inverses; that's what
    # distinguishes Int from Nat). Distinct from the other 5
    # categories because it specifically captures the INVERSE
    # structure enrichment from monoid to group.
    lean_theorem: "XpileContracts.CPyIntArith.negation_involution_abelian_group_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Int negation forms an ABELIAN GROUP enriching the additive
      monoid:
        (a) involution: -(-a) = a
        (b) right inverse: a + (-a) = 0
        (c) left inverse: (-a) + a = 0
        (d) distributivity: -(a + b) = (-a) + (-b)
    domain: |
      Any Int operands a, b. The Diamond captures the abelian-group
      enrichment of the additive monoid via Int.neg.
    invariants:
      - "FIRST DEPTH-6 Diamond in the substrate — six orthogonal algebraic categories on PyIntArith"
      - "distinct from all five prior categories: semiring, Euclidean-domain, shift-monoid, power-monoid, bitwise-AND-monoid"
      - "captures INVERSE structure enriching the additive monoid to abelian group — the structural difference between (Nat, +, 0) monoid and (Int, +, 0, -) abelian group"
      - "load-bearing for Python int negation semantics — emitters that use truncated or path-divergent negation would falsify the involution and inverse laws"
    preconditions:
      - "the dispatcher and kernels are well-formed (Silver / Platinum preconditions inherited)"
    postconditions:
      - "an emitter that uses a NON-INVOLUTION negation would falsify (a)"
      - "an emitter that fails to maintain cancellation across a SUB → ADD-NEG rewrite would falsify (b)/(c)"
      - "Diamond DEPTH-6 demonstrated: six distinct algebraic categories on PyIntArith — opens depth-6 dimension"

  order_distributive_lattice_diamond:
    # PMAT-292 / XPILE-REFINE-PY-INT-ARITH-014: SEVENTH Diamond on
    # this contract — FIRST DEPTH-7 Diamond in substrate. Opens
    # Diamond depth-7. The ORDER-LATTICE Diamond captures the
    # (Int, min, max) DISTRIBUTIVE LATTICE structure via Int's
    # natural ordering — genuinely orthogonal to the prior six
    # categories because they all sit inside the algebraic
    # (Int, +, *, &, neg) structure; this one is about the
    # (Int, ≤) ORDER structure. Parallels PMAT-291 on BoundedSmem
    # (Nat) but applied to Int.
    lean_theorem: "XpileContracts.CPyIntArith.order_distributive_lattice_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, min, max) is a DISTRIBUTIVE LATTICE via the natural
      ordering on Int:
        (a) max commutativity: max(a, b) = max(b, a)
        (b) min commutativity: min(a, b) = min(b, a)
        (c) max distributes over min: max(a, min(b, c)) = min(max(a, b), max(a, c))
        (d) min distributes over max: min(a, max(b, c)) = max(min(a, b), min(a, c))
    domain: |
      Any Int operands a, b, c. The Diamond captures the order-
      theoretic distributive-lattice structure orthogonal to all
      six prior algebraic categories.
    invariants:
      - "FIRST DEPTH-7 Diamond in the substrate — seven orthogonal algebraic categories on PyIntArith"
      - "distinct from all six prior categories: semiring, Euclidean-domain, shift-monoid, power-monoid, bitwise-AND-monoid, abelian-group-enrichment"
      - "captures the ORDER structure (Int, ≤) as an algebraic lattice — distinct from arithmetic/bitwise/group structure on (Int, +, *, &, neg)"
      - "load-bearing for compile-time range-bounded arithmetic reasoning: saturating ops, clamps, monotone folds — all rest on min/max satisfying the distributive lattice laws"
    preconditions:
      - "the standard order on Int is well-defined (Mathlib's Int instance)"
    postconditions:
      - "an emitter that breaks monotonicity of min/max (e.g., SIMD min that's NOT order-preserving on signed integers) would falsify (c)/(d)"
      - "Diamond DEPTH-7 demonstrated: seven distinct algebraic categories on PyIntArith — opens depth-7 dimension"

  divisibility_preorder_diamond:
    # PMAT-294 / XPILE-REFINE-PY-INT-ARITH-015: EIGHTH Diamond on
    # this contract — FIRST DEPTH-8 Diamond in substrate. Opens
    # Diamond depth-8. The DIVISIBILITY-PREORDER Diamond captures
    # the (Int, ∣) preorder structure — genuinely orthogonal to the
    # prior 7 categories because they all use binary OPERATIONS on
    # Int (+, *, fdiv, shl, pow, &, neg, min, max); this one is
    # about a binary RELATION (a ∣ b). The shift in abstraction
    # layer from operations to relations is what makes this
    # categorically distinct.
    lean_theorem: "XpileContracts.CPyIntArith.divisibility_preorder_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, ∣) is a PREORDER with universal absorbers:
        (a) reflexivity: a ∣ a
        (b) transitivity: a ∣ b → b ∣ c → a ∣ c
        (c) universal divisor 1: 1 ∣ a
        (d) universal multiple 0: a ∣ 0
    domain: |
      Any Int operands a, b, c. The Diamond captures the
      divisibility preorder as a relational (not operational)
      structure orthogonal to all seven prior algebraic categories.
    invariants:
      - "FIRST DEPTH-8 Diamond in the substrate — eight orthogonal algebraic categories on PyIntArith"
      - "distinct from all seven prior categories: shifts abstraction layer from binary OPERATIONS (+, *, fdiv, shl, pow, &, neg, min, max) to a binary RELATION (∣)"
      - "captures the divisibility STRUCTURE — a preorder, NOT a partial order (antisymmetry fails on Int up to sign)"
      - "universal absorbers (1 divides everything, everything divides 0) are the preorder's structural boundary elements"
    preconditions:
      - "Int.dvd is well-defined (Mathlib's Int instance)"
    postconditions:
      - "an emitter that breaks reflexivity (e.g., a self-divisibility test that returns false for 0) would falsify (a)"
      - "Diamond DEPTH-8 demonstrated: eight distinct algebraic categories on PyIntArith — opens depth-8 dimension"

  linear_order_trichotomy_diamond:
    # PMAT-298: NINTH Diamond on this contract — FIRST DEPTH-9 in
    # substrate. LINEAR-ORDER/TRICHOTOMY captures the (Int, <)
    # total-order structure. Distinct from PMAT-292 ORDER-LATTICE
    # (lattice laws on min/max ≠ totality; lattices can be
    # non-linear) and PMAT-294 DIVISIBILITY-PREORDER (preorder
    # via ∣, not strict order via <). Trichotomy is the defining
    # axiom that makes Int's order LINEAR.
    lean_theorem: "XpileContracts.CPyIntArith.linear_order_trichotomy_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, <) is a LINEAR ORDER via trichotomy:
        (a) trichotomy: ∀ a b, a < b ∨ a = b ∨ b < a
        (b) irreflexivity: ¬ (a < a)
        (c) asymmetry: a < b → ¬ (b < a)
        (d) transitivity
    domain: |
      Any Int operands a, b, c.
    invariants:
      - "FIRST DEPTH-9 Diamond in the substrate — nine orthogonal algebraic categories on PyIntArith"
      - "distinct from PMAT-292 ORDER-LATTICE (lattice ≠ linear) and PMAT-294 DIVISIBILITY-PREORDER (preorder ≠ strict order)"
      - "captures TRICHOTOMY as the defining axiom of linear order"
    preconditions:
      - "Int.lt is well-defined (Mathlib's linear-order instance)"
    postconditions:
      - "an emitter using partial-order comparisons (e.g., signed-magnitude with incomparable -0/+0) would falsify trichotomy"
      - "Diamond DEPTH-9 demonstrated: nine distinct algebraic categories — opens depth-9 dimension"

  bitwise_and_signed_semantics:
    formula: |
      python_int_and(a, b) == rust_i64::bitand(a, b)  WHEN  both_fit_i64(a, b)
    domain: |
      a, b: Python ints that fit in i64.
    invariants:
      - "Python ints have INFINITE-PRECISION two's complement representation"
      - "for negative bigint operands, the Rust output must match this — separate bigint contract"
    preconditions:
      - "both operands fit in i64 (the BigInt extension is the separate-contract follow-on)"
      - "a and b are both Python int (not float, not bool)"
    postconditions:
      - "the result equals `Int.land a b` over the two's-complement i64 representation"
      - "the result equals CPython `int.__and__(a, b)` bit-for-bit in the i64 domain"
      - "no heap allocation in the fits_i64 fast path"
    # PMAT-138 / XPILE-REFINE-005: Bronze-tier refinement theorem
    # via hand-rolled cast-through-Nat encoding. Both fast and slow
    # paths invoke the shared `i64_and` kernel; proof is `rfl` by
    # construction. Silver tier replaces the encoding with a precise
    # BitVec 64 model.
    lean_theorem: "XpileContracts.CPyIntArith.and_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "bitwise_and_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  and_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for bitwise-AND.
    # Replicates PMAT-169 pattern. Even though Bronze had both
    # paths reduce to the same shared-kernel i64_and, the Silver
    # claim is on the path-selection — a future emitter swapping
    # bigint_and for GMP's mpz_and would falsify path-correctness
    # without touching the Bronze theorem.
    lean_theorem: "XpileContracts.CPyIntArith.and_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      and_dispatch(FastPath, a, b) == and_dispatch(SlowPath, a, b)
        WHEN fits_i64(a) AND fits_i64(b)
    domain: |
      Same as bitwise_and_signed_semantics — a, b Python ints that fit in i64.
    invariants:
      - "fast and slow bitwise-AND paths agree when both operands fit in i64"
      - "the slow path returns bigint_and on every input (companion theorem)"
      - "the bitwise-AND dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a) AND fits_i64(b) — the contract precondition for emitting i64 bit-AND"
    postconditions:
      - "a future emitter swapping bigint_and for GMP's mpz_and would falsify path-correctness — caught at the dispatcher level"

  shift_left_signed_semantics:
    formula: |
      python_int_shl(a, b) == rust_i64::wrapping_shl(a, b)  WHEN  0 <= b < 64 AND fits_i64(a * 2^b)
    domain: |
      a: Python int that fits in i64; b: Nat exponent.
    invariants:
      - "Python `<<` is mathematical: result = a * 2^b on unbounded ints"
      - "Rust `(a as i64).checked_shl(b)` panics on b >= 64; we cite C-PY-INT-ARITH there"
      - "in the fits_i64 domain both paths agree via `Int.bmod` reduction"
    preconditions:
      - "0 <= b < 64 (else Rust panics — separate contract slot)"
      - "the mathematical product `a * 2^b` fits in i64 (else BigInt promotion required — separate contract)"
    postconditions:
      - "the result equals `Int.shiftLeft a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__lshift__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_shl` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shl reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.shl_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "shift_left_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  shl_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for left-shift.
    # Replicates PMAT-169 pattern. Captures the path-selection
    # decision per `<<` call site.
    lean_theorem: "XpileContracts.CPyIntArith.shl_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      shl_dispatch(FastPath, a, b) == shl_dispatch(SlowPath, a, b)
        WHEN fits_i64(a * 2^b)
    domain: |
      Same as shift_left_signed_semantics — a Python int that fits in i64; b Nat.
    invariants:
      - "fast and slow left-shift paths agree on the fits_i64-of-product domain"
      - "the slow path returns a * 2^b on every input (companion theorem)"
      - "the left-shift dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a * 2^b) — the contract precondition for emitting i64_wrap_shl"
      - "b : Nat (negative shifts are out of domain per Rust's u32 API match)"
    postconditions:
      - "an emitter that emits raw `<<` instead of `checked_shl` for out-of-domain inputs would silently wrap rather than panic"

  shift_right_signed_semantics:
    formula: |
      python_int_shr(a, b) == rust_i64::checked_shr(a, b)  WHEN  0 <= b < 64
    domain: |
      a: Python int that fits in i64; b: Nat exponent in [0, 64).
    invariants:
      - "Python `>>` and Rust `>>` on signed i64 are both arithmetic (sign-preserving)"
      - "both paths model the shift as `Int.fdiv a (2^b)` — pointwise equal under fits_i64 precondition"
    preconditions:
      - "0 <= b < 64 (else Rust panics)"
    postconditions:
      - "the result equals `Int.fdiv a (2^b)` (arithmetic shift, sign-preserving)"
      - "the result equals CPython `int.__rshift__(a, b)` bit-for-bit"
      - "the emission uses `checked_shr` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shr is `rfl` (Int.fdiv on both sides).
    lean_theorem: "XpileContracts.CPyIntArith.shr_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "shift_right_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  shr_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for right-shift.
    # Replicates PMAT-169 pattern. Both paths reduce to Int.fdiv
    # — the Silver claim captures the path-selection decision.
    lean_theorem: "XpileContracts.CPyIntArith.shr_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      shr_dispatch(FastPath, a, b) == shr_dispatch(SlowPath, a, b)
        WHEN fits_i64(Int.fdiv a (2^b))
    domain: |
      Same as shift_right_signed_semantics — a Python int that fits in i64; b Nat in [0, 64).
    invariants:
      - "fast and slow right-shift paths agree on the fits_i64 domain"
      - "the slow path returns Int.fdiv a (2^b) on every input (companion theorem)"
      - "the right-shift dispatcher is total (companion theorem)"
    preconditions:
      - "0 <= b < 64 (else Rust panics)"
      - "fits_i64(Int.fdiv a (2^b)) for the fast-path agreement claim"
    postconditions:
      - "the dispatch claim is preserved even when both paths' underlying ops are identical — captures the selection-decision Bronze couldn't model"

  power_signed_semantics:
    formula: |
      python_int_pow(a, b) == rust_i64::wrapping_pow(a, b)  WHEN  b >= 0 AND fits_i64(a^b)
    domain: |
      a: Python int that fits in i64; b: Nat (non-negative exponent).
    invariants:
      - "Python `**` with non-negative integer exponent stays in int domain"
      - "Negative exponent always promotes to Float in Python — separate contract"
      - "Rust `(a as i64).checked_pow(b as u32)` panics on overflow; cited as C-PY-INT-ARITH"
    preconditions:
      - "b >= 0 (else Python promotes to Float — out of scope)"
      - "the mathematical result `a^b` fits in i64 (else BigInt promotion required)"
    postconditions:
      - "the result equals `Int.pow a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__pow__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_pow(u32::try_from(rhs).expect(...))` so overflow panics with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: pow reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.pow_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "power_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  pow_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for power (`a ** b`).
    # Replicates PMAT-169 pattern. With this, C-PY-INT-ARITH has
    # Silver dispatchers on ALL 8 fast/slow-path equations
    # (addition_overflow_promotion is the slow-path-only
    # companion that doesn't have its own dispatcher; its
    # slow-path soundness is covered by
    # dispatch_slow_path_eq_python_silver from PMAT-169).
    lean_theorem: "XpileContracts.CPyIntArith.pow_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      pow_dispatch(FastPath, a, b) == pow_dispatch(SlowPath, a, b)
        WHEN fits_i64(a^b)
    domain: |
      Same as power_signed_semantics — a Python int that fits in i64; b Nat (non-negative).
    invariants:
      - "fast and slow power paths agree on the fits_i64-of-result domain"
      - "the slow path returns a^b on every input (companion theorem)"
      - "the power dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a^b) — the contract precondition for emitting checked_pow"
      - "b : Nat (negative exponent promotes to Float — separate contract)"
    postconditions:
      - "an emitter that uses unchecked pow for out-of-domain inputs would overflow silently — caught by the dispatcher's selection claim"

  ring_neg_mul_distrib_diamond:
    # PMAT-300: TENTH Diamond on this contract — opens FIRST DEPTH-10
    # in the substrate. RING-DISTRIBUTIVITY of negation over
    # multiplication via Int.neg_mul, Int.mul_neg, Int.neg_mul_neg,
    # Int.sub_mul. Categorically orthogonal to all prior 9 categories:
    #   - PMAT-214 SEMIRING: has no negation
    #   - PMAT-290 ABELIAN-GROUP-ENRICHMENT: has no multiplication
    #   - PMAT-300 RING: BRIDGES the two via (-a)*b = -(a*b)
    # This is exactly Mathlib's `Ring` typeclass shape — the axiom
    # that separates "semiring + group on disjoint operations" from
    # a true RING. An emitter that lowered (-a)*b to a separate
    # dispatch path that did NOT cancel back to -(a*b) would
    # falsify (a) — a real bug class invisible to the prior 9
    # categories.
    lean_theorem: "XpileContracts.CPyIntArith.ring_neg_mul_distrib_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, +, *, neg, 0, 1) is a RING:
        (a) left negation:   (-a) * b = -(a * b)
        (b) right negation:  a * (-b) = -(a * b)
        (c) sign cancel:     (-a) * (-b) = a * b
        (d) sub distrib:     (a - b) * c = a * c - b * c
    domain: |
      Any three Int values. The four properties together axiomatize
      the RING structure — Mathlib's `Ring` / `CommRing` typeclass
      shape. (Int, +, *) is a commutative ring with unit.
    invariants:
      - "TENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-10 in the substrate"
      - "BRIDGES PMAT-214 SEMIRING and PMAT-290 ABELIAN-GROUP-ENRICHMENT into a full RING"
      - "the axiom (-a)*b = -(a*b) cannot be derived from semiring axioms (no neg) nor from abelian-group axioms (no mul) — it is genuinely orthogonal"
      - "load-bearing for any emitter that lowers negation as a separate dispatch step: failure to cancel back to -(a*b) would falsify left-distribution"
    preconditions:
      - "three Int values; theorem stated on the standard Int.add, Int.mul, Int.neg, Int.sub operations"
    postconditions:
      - "an emitter with a non-canonical (-a)*b implementation that does not reduce to -(a*b) would falsify (a)"
      - "Diamond DEPTH-10 opened — 1 contract at depth-10+"

  integral_domain_diamond:
    # PMAT-302: ELEVENTH Diamond on this contract — opens FIRST
    # DEPTH-11 in the substrate. INTEGRAL DOMAIN axioms: no zero
    # divisors (a*b=0 → a=0 ∨ b=0), multiplicative cancellation on
    # the nonzero domain, nontrivial multiplicative identity (1≠0),
    # and product-of-nonzeros-is-nonzero. Categorically orthogonal
    # to PMAT-300 RING: rings CAN have zero divisors (e.g., Z/6Z
    # where 2*3=0), but integral domains forbid them. Mathlib's
    # `IsDomain` / `NoZeroDivisors` typeclass encodes this
    # SEPARATELY from `Ring`. An emitter that lowered multiplication
    # through a modular path (mod 2^31 i32 fast-path) would have
    # spurious zero divisors and fail (a) — invisible to all 10
    # prior categories.
    lean_theorem: "XpileContracts.CPyIntArith.integral_domain_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, +, *) is an INTEGRAL DOMAIN:
        (a) no zero divisors:           a * b = 0 → a = 0 ∨ b = 0
        (b) mul cancellation (nonzero): a ≠ 0 → a*b = a*c → b = c
        (c) nontrivial identity:        (1 : Int) ≠ 0
        (d) nonzero product:            a ≠ 0 → b ≠ 0 → a * b ≠ 0
    domain: |
      Any three Int values. The four properties together axiomatize
      the INTEGRAL DOMAIN structure — Mathlib's `IsDomain` typeclass
      shape. (Int, +, *) is a commutative integral domain.
    invariants:
      - "ELEVENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-11 in the substrate"
      - "STRENGTHENS PMAT-300 RING with the no-zero-divisors axiom"
      - "distinct from PMAT-300 RING: Z/6Z satisfies all ring axioms but has zero divisors (2*3=0) — falsifies (a)"
      - "load-bearing for modular-arithmetic emitters: an i32 mod-2^32 fast-path would have spurious zero divisors (e.g., 2^16 * 2^16 = 0 mod 2^32)"
    preconditions:
      - "three Int values; theorem stated on the standard Int.mul, Int.zero, Int.one"
    postconditions:
      - "an emitter with modular-arithmetic multiplication (mod 2^N) would falsify (a) for inputs whose product crosses the modulus"
      - "Diamond DEPTH-11 opened — 1 contract at depth-11+"

  ordered_ring_diamond:
    # PMAT-305: TWELFTH Diamond on this contract — opens FIRST
    # DEPTH-12 in the substrate. ORDERED RING sign rules: nonneg ×
    # nonneg ≥ 0, nonpos × nonpos ≥ 0, nonneg × nonpos ≤ 0,
    # strictpos × strictpos > 0. Categorically orthogonal:
    #   - PMAT-298 LINEAR-ORDER: no multiplication
    #   - PMAT-300 RING: no order
    #   - PMAT-302 INTEGRAL DOMAIN: no signs
    #   - PMAT-305 ORDERED RING: bridges order × ring multiplication
    # Mathlib's `OrderedRing` / `LinearOrderedCommRing` typeclass
    # encodes this BRIDGE separately. Non-ordered-ring example: the
    # Gaussian integers Z[i] form a ring with no compatible total
    # order, so the sign rules genuinely require BOTH the order and
    # multiplication structures to be present AND compatible.
    lean_theorem: "XpileContracts.CPyIntArith.ordered_ring_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, +, *, ≤) is an ORDERED RING:
        (a) nonneg × nonneg:        0 ≤ a → 0 ≤ b → 0 ≤ a * b
        (b) nonpos × nonpos:        a ≤ 0 → b ≤ 0 → 0 ≤ a * b
        (c) nonneg × nonpos:        0 ≤ a → b ≤ 0 → a * b ≤ 0
        (d) strictpos × strictpos:  0 < a → 0 < b → 0 < a * b
    domain: |
      Any two Int values. The four sign rules together axiomatize
      the ORDERED RING structure — Mathlib's `OrderedRing` /
      `LinearOrderedCommRing` typeclass shape. (Int, +, *, ≤) is a
      linearly-ordered commutative ring with sign rules.
    invariants:
      - "TWELFTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-12 in the substrate"
      - "BRIDGES PMAT-298 LINEAR-ORDER and PMAT-300 RING into an ordered-ring structure"
      - "distinct from PMAT-300 RING: ring axioms don't constrain signs; Z[i] is a ring with no compatible order"
      - "distinct from PMAT-298 LINEAR-ORDER: linear-order axioms don't mention multiplication"
      - "distinct from PMAT-302 INTEGRAL DOMAIN: no-zero-divisors doesn't say what signs do under multiplication"
      - "load-bearing for saturating-to-nonneg emitters: a saturating multiplication that clamped (-1)*(-1) to 0 would falsify (b)"
    preconditions:
      - "two Int values; theorem stated on the standard Int.mul, Int.zero, Int.lt, Int.le"
    postconditions:
      - "an emitter with saturating-to-nonneg arithmetic would falsify (b)"
      - "Diamond DEPTH-12 opened — 1 contract at depth-12+"

  abs_value_norm_diamond:
    # PMAT-307: THIRTEENTH Diamond on this contract — opens FIRST
    # DEPTH-13 in the substrate. ABSOLUTE VALUE / NORM axioms:
    # non-negativity (0 ≤ |a|), definiteness (|a| = 0 ↔ a = 0),
    # triangle inequality (|a + b| ≤ |a| + |b|), multiplicativity
    # (|a * b| = |a| * |b|). Categorically orthogonal to all 12
    # prior categories — none mentions a UNARY OPERATION capturing
    # "size" / "magnitude". Mathlib's `AbsoluteValue` typeclass
    # encodes this. The four axioms together characterize Int as
    # a NORMED RING — strictly richer than just an ordered ring.
    lean_theorem: "XpileContracts.CPyIntArith.abs_value_norm_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      (Int, |·|) is a NORMED RING:
        (a) non-negativity:      0 ≤ |a|
        (b) definiteness:        |a| = 0 ↔ a = 0
        (c) triangle inequality: |a + b| ≤ |a| + |b|
        (d) multiplicativity:    |a * b| = |a| * |b|
    domain: |
      Any two Int values. The four properties together axiomatize
      |·| as an ABSOLUTE VALUE / NORM on the ring Int — Mathlib's
      `AbsoluteValue` typeclass shape.
    invariants:
      - "THIRTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-13 in the substrate"
      - "captures (Int, |·|) as a NORMED RING — Mathlib's AbsoluteValue shape"
      - "none of the prior 12 categories defines or constrains a UNARY size operation"
      - "load-bearing for saturating-abs emitters: an abs that wrapped around for Int.minValue would falsify the triangle inequality"
    preconditions:
      - "two Int values; theorem stated on the standard Int.add, Int.mul, abs (|·|) operations"
    postconditions:
      - "an emitter with non-canonical abs that violates one of the four norm axioms would falsify the corresponding conjunct"
      - "Diamond DEPTH-13 opened — 1 contract at depth-13+"

  nat_cast_ring_hom_diamond:
    # PMAT-310: FOURTEENTH Diamond on this contract — opens FIRST
    # DEPTH-14 in the substrate. NAT-TO-INT RING HOMOMORPHISM
    # axioms: preserves zero (Nat.cast_zero), preserves one
    # (Nat.cast_one), preserves + (Nat.cast_add), preserves *
    # (Nat.cast_mul). Categorically orthogonal to all 13 prior
    # categories — they all live INSIDE the ring Int. PMAT-310 is
    # an EXTERNAL category-theoretic claim about the structure-
    # preserving map Nat → Int. The four axioms together encode
    # `RingHom Nat Int`, establishing Int as a NAT-ALGEBRA with
    # CHARACTERISTIC ZERO. An emitter that lowered the non-negative
    # fast path through a sentinel zero representation would
    # falsify (a) — a real bug class invisible to the 13 prior
    # INTERNAL categories.
    lean_theorem: "XpileContracts.CPyIntArith.nat_cast_ring_hom_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Nat.cast : Nat → Int is a RING HOMOMORPHISM:
        (a) preserves zero:  ((0 : Nat) : Int) = 0
        (b) preserves one:   ((1 : Nat) : Int) = 1
        (c) preserves +:     ((m + n : Nat) : Int) = (m : Int) + (n : Int)
        (d) preserves *:     ((m * n : Nat) : Int) = (m : Int) * (n : Int)
    domain: |
      Any two Nat values m, n. The four homomorphism axioms
      together encode Nat.cast as a `RingHom Nat Int` in Mathlib's
      typeclass shape.
    invariants:
      - "FOURTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-14 in the substrate"
      - "EXTERNAL category-theoretic claim (Nat → Int structure preservation), distinct from all 13 prior INTERNAL algebraic claims"
      - "establishes Int as a NAT-ALGEBRA with CHARACTERISTIC ZERO via the canonical inclusion"
      - "load-bearing for non-negative fast-path emitters: a sentinel zero representation (Nat.zero → sentinel ≠ Int.zero) would falsify (a)"
    preconditions:
      - "two Nat values; theorem stated on Nat.cast : Nat → Int"
    postconditions:
      - "an emitter mapping (0 : Nat) to anything other than (0 : Int) would falsify zero-preservation"
      - "Diamond DEPTH-14 opened — 1 contract at depth-14+"

  int_emod_quotient_hom_diamond:
    # PMAT-312: FIFTEENTH Diamond on this contract — opens FIRST
    # DEPTH-15 in the substrate. INT-EMOD QUOTIENT RING HOMOMORPHISM:
    # Int.emod is the SURJECTIVE projection Int → Z/nZ (demonstrated
    # for n=2, PARITY/Z/2Z quotient). Mirror of PMAT-310 which was
    # the INJECTIVE embedding Nat → Int. Together they capture:
    #   Nat ──cast──> Int ──emod n──> Z/nZ
    #       injective         surjective
    # Categorically orthogonal to all 14 prior categories — none
    # captures the QUOTIENT-RING structure. Falsification surface:
    # C-style signed modulo (where (-1) % 2 = -1) violates the
    # non-negativity axiom (c). Python's % matches Lean's Int.emod
    # (always non-negative).
    lean_theorem: "XpileContracts.CPyIntArith.int_emod_quotient_hom_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Int.emod (· % 2) : Int → Z/2Z is a RING HOMOMORPHISM (quotient projection):
        (a) preserves +:           (a + b) % 2 = (a%2 + b%2) % 2
        (b) preserves *:           (a * b) % 2 = (a%2 * b%2) % 2
        (c) non-negative result:   0 ≤ a % 2
        (d) less than 2 (Z/2Z):    a % 2 < 2
    domain: |
      Any two Int values a, b. The four homomorphism axioms
      together encode Int.emod (· % 2) as a SURJECTIVE
      `RingHom Int (ZMod 2)` (quotient projection). Demonstrated
      for n=2 (parity/Z/2Z); generalizes to arbitrary n.
    invariants:
      - "FIFTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-15 in the substrate"
      - "FIRST QUOTIENT-RING structure claim in the substrate (Int → Z/nZ)"
      - "mirror of PMAT-310 (Nat → Int INJECTIVE embedding): PMAT-312 is the SURJECTIVE quotient direction"
      - "load-bearing for Python `%` lowering: C-style signed modulo violates (c) for negative dividends; Python's % matches Lean Int.emod"
    preconditions:
      - "two Int values; theorem stated on standard Int.emod (· % 2)"
    postconditions:
      - "an emitter using C-style signed modulo would falsify (c) for negative dividends (e.g., (-1) % 2 = -1 in C, vs 1 in Python/Lean)"
      - "Diamond DEPTH-15 opened — 1 contract at depth-15+"

  gcd_monoid_bezout_diamond:
    # PMAT-315: SIXTEENTH Diamond on this contract — opens FIRST
    # DEPTH-16 in the substrate. GCD MONOID + BÉZOUT IDENTITY:
    # Int.gcd satisfies the GCD-monoid universal property (gcd
    # divides both, any common divisor divides gcd) AND yields a
    # CONSTRUCTIVE linear combination (gcd a b = x*a + y*b).
    # Categorically orthogonal to all 15 prior categories — none
    # captures the GCD as a UNIVERSAL OBJECT or the Bézout
    # constructive form. Together with the existing categories,
    # this establishes Int as a PRINCIPAL IDEAL DOMAIN (PID).
    # Mathlib's Int.instIsPrincipalIdealRing typeclass evidence.
    # Load-bearing for modular inverses (used in fractions,
    # polynomial factoring).
    lean_theorem: "XpileContracts.CPyIntArith.gcd_monoid_bezout_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Int.gcd is a GCD-MONOID with BÉZOUT IDENTITY:
        (a) gcd divides left:        (Int.gcd a b : Int) ∣ a
        (b) gcd divides right:       (Int.gcd a b : Int) ∣ b
        (c) gcd is universal:        c ∣ a → c ∣ b → c ∣ (Int.gcd a b : Int)
        (d) Bézout identity:         (Int.gcd a b : Int) = a * gcdA + b * gcdB
    domain: |
      Any three Int values. The four properties together axiomatize
      Int.gcd as a GCD-monoid (categorical universal object) with
      a constructive linear combination (Bézout pair) — Mathlib's
      `IsPrincipalIdealRing` typeclass shape.
    invariants:
      - "SIXTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-16 in the substrate"
      - "FIRST claim characterizing gcd as a UNIVERSAL OBJECT (categorical) plus CONSTRUCTIVE Bézout identity"
      - "establishes Int as a PRINCIPAL IDEAL DOMAIN (PID) — every ideal is principal, generated by the gcd"
      - "load-bearing for modular inverses, fractions, and polynomial factoring — Stein's binary GCD without backward substitution would falsify (d)"
    preconditions:
      - "three Int values; theorem stated on Int.gcd, Int.gcdA, Int.gcdB"
    postconditions:
      - "an emitter lowering gcd through a path that doesn't produce a Bézout pair would falsify (d)"
      - "Diamond DEPTH-16 opened — 1 contract at depth-16+"

  unit_group_diamond:
    # PMAT-317: SEVENTEENTH Diamond on this contract — opens FIRST
    # DEPTH-17 in the substrate. UNIT GROUP STRUCTURE: the units
    # of Int form `{1, -1} ≅ Z/2Z`. Categorically orthogonal to
    # all 16 prior categories — none characterizes the
    # MULTIPLICATIVE INVERTIBLE ELEMENTS as a separate algebraic
    # structure. PMAT-300 RING / PMAT-302 INTEGRAL DOMAIN axiomatize
    # the ring; PMAT-315 GCD/PID characterizes ideals/gcd; PMAT-317
    # axiomatizes the unit-group of multiplicative inverses.
    # Load-bearing for unary-minus lowerings: a bitwise-complement-
    # plus-one shortcut that failed on Int.minValue due to overflow
    # would falsify (c) `-a = (-1) * a`.
    lean_theorem: "XpileContracts.CPyIntArith.unit_group_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      The unit group of Int is `{1, -1} ≅ Z/2Z`:
        (a) multiplicative identity:      a * 1 = a
        (b) -1 is self-inverse (Z/2Z):    (-1) * (-1) = 1
        (c) negation factors via -1:      -a = (-1) * a
        (d) squares are non-negative:     0 ≤ a * a
    domain: |
      Any Int value a. The four properties together axiomatize
      the multiplicative-inverse structure of Int: the units form
      the cyclic group Z/2Z. Uses Mathlib's mul_one,
      Int.neg_one_mul, mul_self_nonneg.
    invariants:
      - "SEVENTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-17 in the substrate"
      - "FIRST claim characterizing the MULTIPLICATIVE INVERTIBLE ELEMENTS of Int as a separate algebraic structure (unit group)"
      - "distinct from PMAT-290 abelian-group-enrichment (which axiomatized the ADDITIVE group)"
      - "distinct from PMAT-315 GCD/PID (which characterized ideals/gcd, not units)"
      - "load-bearing for unary-minus lowerings: bitwise-complement-plus-one on Int.minValue would falsify (c)"
    preconditions:
      - "one Int value; theorem stated on standard Int.mul, Int.neg"
    postconditions:
      - "an emitter that uses overflow-prone unary minus (e.g., bitwise-not + 1 on minValue) would falsify (c)"
      - "Diamond DEPTH-17 opened — 1 contract at depth-17+"

  int_sign_monoid_hom_diamond:
    # PMAT-320: EIGHTEENTH Diamond on this contract — opens FIRST
    # DEPTH-18 in the substrate. SIGN FUNCTION MONOID HOMOMORPHISM:
    # Int.sign is a multiplicative monoid hom `(Int, *) →
    # ({-1, 0, 1}, *)`. Categorically orthogonal to all 17 prior
    # categories — none axiomatizes the SIGN as a separate
    # operation with monoid-hom structure. Together with PMAT-307
    # (abs/norm) and PMAT-317 (unit group), this is the third
    # orthogonal piece of the `Int = sign × magnitude`
    # decomposition. Load-bearing for dispatch optimizations using
    # sign comparisons: an emitter computing sign(a*b) via result
    # bit pattern (rather than sign(a)*sign(b)) could overflow on
    # Int.minValue * Int.minValue, falsifying (a).
    lean_theorem: "XpileContracts.CPyIntArith.int_sign_monoid_hom_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Int.sign is a multiplicative monoid hom (Int, *) → ({-1, 0, 1}, *):
        (a) preserves multiplication:  Int.sign (a*b) = Int.sign a * Int.sign b
        (b) respects negation:         Int.sign (-a) = -(Int.sign a)
        (c) preserves zero:            Int.sign 0 = 0
        (d) preserves one (identity):  Int.sign 1 = 1
    domain: |
      Any two Int values. The four properties axiomatize Int.sign
      as the canonical SURJECTIVE multiplicative monoid homomorphism
      Int → {-1, 0, 1}.
    invariants:
      - "EIGHTEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-18 in the substrate"
      - "FIRST claim characterizing Int.sign as a multiplicative monoid HOMOMORPHISM"
      - "third orthogonal piece of `Int = sign × magnitude` decomposition (with PMAT-307 abs and PMAT-317 unit group)"
      - "load-bearing for sign-based dispatch optimizations: sign(a*b) via result bit pattern could overflow, falsifying (a)"
    preconditions:
      - "two Int values; theorem stated on Int.sign, Int.mul, Int.neg"
    postconditions:
      - "an emitter computing sign(a*b) directly via bit pattern of a*b could falsify (a) on overflow"
      - "Diamond DEPTH-18 opened — 1 contract at depth-18+"

  int_neg_order_compat_diamond:
    # PMAT-322: NINETEENTH Diamond on this contract — opens FIRST
    # DEPTH-19 in the substrate. NEGATION-ORDER COMPATIBILITY:
    # negation on Int is order-reversing (a < b ↔ -b < -a).
    # Categorically orthogonal to all 18 prior categories:
    #   - PMAT-290 ABELIAN-GROUP-ENRICHMENT: negation as group
    #     inverse (algebraic, no order)
    #   - PMAT-298 LINEAR-ORDER TRICHOTOMY: strict order axioms
    #     (no negation)
    #   - PMAT-305 ORDERED RING: sign rules on PRODUCTS
    #   - PMAT-322 NEGATION-ORDER: how unary `-` interacts with
    #     the linear order
    # This is the canonical axiom that distinguishes an ordered
    # group from a group with an independent (unrelated) order.
    # Mathlib's `OrderedAddCommGroup` typeclass encodes this.
    # Load-bearing for Python int negation: a saturating fast-path
    # where -2^63 maps to 2^63-1 would falsify (a).
    lean_theorem: "XpileContracts.CPyIntArith.int_neg_order_compat_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Negation on Int is ORDER-REVERSING (Mathlib's OrderedAddCommGroup shape):
        (a) reverses strict order:        a < b ↔ -b < -a
        (b) reverses non-strict order:    a ≤ b ↔ -b ≤ -a
        (c) positivity-negativity dual:   0 < a ↔ -a < 0
        (d) non-neg-non-pos dual:         0 ≤ a ↔ -a ≤ 0
    domain: |
      Any Int value (with the universal quantification on b in
      conjuncts (a) and (b)). Together the four properties
      axiomatize Int as an OrderedAddCommGroup — Mathlib's
      typeclass shape.
    invariants:
      - "NINETEENTH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-19 in the substrate"
      - "FIRST claim characterizing negation-order interaction (OrderedAddCommGroup axioms)"
      - "distinct from PMAT-290 abelian-group-enrichment (algebraic, no order) and PMAT-298 linear-order (no negation)"
      - "load-bearing for Python int negation: saturating fast-path where -2^63 maps to 2^63-1 would falsify (a)"
    preconditions:
      - "one Int value (plus universally-quantified b in conjuncts a and b)"
    postconditions:
      - "an emitter with saturating negation that fails order-reversing at the saturation boundary would falsify (a)"
      - "Diamond DEPTH-19 opened — 1 contract at depth-19+"

  int_to_nat_partial_inverse_diamond:
    # PMAT-325: TWENTIETH Diamond on this contract — opens FIRST
    # DEPTH-20 in the substrate. Int.toNat PARTIAL INVERSE:
    # Int.toNat : Int → Nat is the PARTIAL retraction of
    # Nat.cast : Nat → Int (PMAT-310). Together they give:
    #   Nat ──cast──> Int ──toNat──> Nat
    #       injective    partial retraction (identity on Nat-image)
    # Categorically orthogonal to all 19 prior categories — none
    # axiomatizes the Int → Nat partial retraction. PMAT-310 went
    # one way (Nat embeds into Int); PMAT-325 goes the OTHER way
    # (Int retracts to Nat partially, saturating negatives to 0).
    # Load-bearing for Python's non-negative-only fast path.
    lean_theorem: "XpileContracts.CPyIntArith.int_to_nat_partial_inverse_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Int.toNat : Int → Nat is the PARTIAL INVERSE of Nat.cast:
        (a) round-trip on Nat:       Int.toNat ((n : Int)) = n
        (b) non-negative round-trip: 0 ≤ a → ((Int.toNat a : Int)) = a
        (c) negative saturates:      Int.toNat a = 0 ↔ a ≤ 0
        (d) non-negative result:     0 ≤ Int.toNat a (trivially)
    domain: |
      Any Int value a and Nat value n. The four properties together
      axiomatize Int.toNat as the canonical partial-inverse
      retraction of Nat.cast — Mathlib's standard cast / toNat lemmas.
    invariants:
      - "TWENTIETH Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-20 in the substrate"
      - "FIRST PARTIAL-INVERSE / SECTION-RETRACTION claim on PyIntArith"
      - "Companion to PMAT-310 (Nat → Int INJECTIVE embedding): PMAT-325 is the Int → Nat PARTIAL retraction direction"
      - "load-bearing for Python's non-negative-only fast path: a buggy retraction with sentinel values would falsify (a)"
    preconditions:
      - "one Int value a, one Nat value n"
    postconditions:
      - "an emitter using a buggy Int → Nat retraction (e.g., sentinel mapping for 0) would falsify (a)"
      - "Diamond DEPTH-20 opened — 1 contract at depth-20+"

  int_nat_cast_order_embedding_diamond:
    # PMAT-327: TWENTY-FIRST Diamond on this contract — opens FIRST
    # DEPTH-21 in the substrate. NAT-CAST ORDER EMBEDDING:
    # `Nat.cast : Nat → Int` preserves the ORDER structure (≤, <, =).
    # Distinct from:
    #   - PMAT-310 NAT-CAST RING HOM: preserves RING structure
    #     (0, 1, +, *) but not order
    #   - PMAT-325 Int.toNat PARTIAL INVERSE: round-trip / retraction
    # Together PMAT-310 + PMAT-327 characterize Nat.cast as an
    # ORDER-PRESERVING RING HOMOMORPHISM (Mathlib's `OrderRingHom`
    # typeclass shape). The order-embedding axioms are independent
    # of the ring-hom axioms — a quotient hom Z → Z/2Z is a ring
    # hom but doesn't preserve order. Load-bearing for Python's
    # non-negative-int fast path with order-sensitive dispatch.
    lean_theorem: "XpileContracts.CPyIntArith.int_nat_cast_order_embedding_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Nat.cast : Nat → Int is an ORDER EMBEDDING:
        (a) preserves ≤ (iff):  ((n : Int)) ≤ ((m : Int)) ↔ n ≤ m
        (b) preserves < (iff):  ((n : Int)) < ((m : Int)) ↔ n < m
        (c) injectivity (=):    ((n : Int)) = ((m : Int)) ↔ n = m
        (d) non-negative:       0 ≤ ((n : Int))
    domain: |
      Two Nat values n, m. The four properties characterize the
      Nat.cast : Nat → Int as a canonical order embedding — Mathlib's
      standard cast / order lemmas.
    invariants:
      - "TWENTY-FIRST Diamond category on C-PY-INT-ARITH — opens FIRST DEPTH-21 in the substrate"
      - "ORDER-EMBEDDING component of the Nat.cast structure (complement to PMAT-310 ring-hom)"
      - "together with PMAT-310 captures Nat.cast as an OrderRingHom (Mathlib's typeclass shape)"
      - "load-bearing for Python's non-negative-int fast path with order-sensitive dispatch"
    preconditions:
      - "two Nat values"
    postconditions:
      - "an emitter using a hash-table encoding where insertion order doesn't match numeric order would falsify (a)"
      - "Diamond DEPTH-21 opened — 1 contract at depth-21+"

proof_obligations:
  - type: precondition
    property: operands are Python int (not int-subclass, not bool-as-int)
    formal: "type(a) is int ∧ type(b) is int"
    applies_to: all
  - type: postcondition
    property: result equals CPython's output bit-for-bit for the i64 domain
    formal: "∀ a, b ∈ i64: a + b ∈ i64 ⟹ result == cpython_eval(f'{a}+{b}')"
    applies_to: addition_no_overflow
  - type: postcondition
    property: result equals CPython's output mathematically for the promotion domain
    formal: "∀ a, b: a + b ∉ i64 ⟹ bigint_eq(result, cpython_eval(f'{a}+{b}'))"
    applies_to: addition_overflow_promotion
  - type: invariant
    property: no silent truncation
    formal: "∀ a, b, op: emit(a op b) preserves the exact mathematical value"
    applies_to: all
  - type: bound
    property: at most one heap allocation per arithmetic op
    formal: "allocs(emit(op)) ∈ {0, 1}"
    applies_to: all

