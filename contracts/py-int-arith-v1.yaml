metadata:
  id: C-PY-INT-ARITH
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Operational semantics of Python `int` arithmetic, as observed
    behaviorally in CPython 3.12+. Python's int is mathematically
    unbounded; xpile must preserve that across the Rust output, with
    a fast path through machine integers when the result fits.

    Layer 1 of the xpile contract taxonomy (per-language semantics).
    Paired with `C-XLATE-PY-LIST-TO-VEC-V1` and similar translation
    contracts at Layer 2.
  references:
    - "Python Language Reference §6.7 (Binary arithmetic operations)"
    - "CPython Objects/longobject.c"
    - docs/specifications/xpile-contract-driven-design-v1.md
  depends_on: []

equations:
  addition_no_overflow:
    formula: |
      python_int_add(a, b) == rust_i64::wrapping_add(a, b)  WHEN  fits_i64(a + b)
    domain: |
      a, b: Python int values whose mathematical sum fits in i64.
    invariants:
      - "no observable difference between CPython and Rust output when fits_i64(a+b)"
      - "no allocation in the fits_i64 fast path"
    preconditions:
      - "a and b are both Python int (not float, not bool, not bigint-required)"
    postconditions:
      - "the result is bit-identical to CPython `int.__add__(a, b)` evaluated on the same operands"
      - "no heap allocation occurs (the i64 result lives on the stack)"
      - "the emitted Rust uses `.wrapping_add` or equivalent — never `.unchecked_add` or raw `+` that could be optimized to silent UB"
    # XPILE-REFINE-001 / PMAT-017: refinement proof in Lean (Semantic
    # stratum). Statement IS the equation, formalised. v0.1.0 ships
    # the claim with `sorry`; XPILE-REFINE-002 discharges.
    lean_theorem: "XpileContracts.CPyIntArith.fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # XPILE-QUORUM-001 / PMAT-019: Kani BMC harness (Symbolic stratum).
    # `addition_no_overflow` function in the harness file; Kani
    # discharges this automatically via bit-blasted i64 arithmetic.
    # Together with the Lean theorem above and the diff_exec runtime
    # check (PMAT-018), this equation now has ≥1 Symbolic + ≥1
    # Semantic vote per the ruchy 5.0 §14.4 quorum rule.
    kani_harness: "addition_no_overflow"
    kani_file: "contracts/kani/py_int_arith.rs"

  add_dispatch_commutative_platinum:
    # PMAT-199 / XPILE-REFINE-PY-INT-ARITH-006: FIRST Platinum-tier
    # refinement in the entire xpile substrate. Opens the next
    # tier beyond Gold per ruchy 5.0 §14.10.5. Platinum captures
    # COMPOSITIONAL ALGEBRAIC PROPERTIES (commutativity,
    # associativity, distributivity, identity) — properties that
    # Bronze/Silver/Gold couldn't express because they're about
    # how multiple call sites COMPOSE, not single-call correctness.
    # Real proof using Int.add_comm — not provable by rfl. Companion
    # theorems mul_dispatch_commutative_platinum and
    # and_dispatch_commutative_platinum extend the pattern across
    # multiplication and bitwise-AND.
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_commutative_platinum"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      forall path, a, b: add_dispatch(path, a, b) == add_dispatch(path, b, a)
    domain: |
      Any path (FastPath | SlowPath) and any Int operands a, b.
      The Platinum upgrade captures the algebraic property that
      addition is commutative — which holds uniformly across the
      dispatch decision.
    invariants:
      - "compositional algebraic property: dispatcher commutes with operand swap"
      - "holds for FastPath (i64 wrapping arithmetic) via Int.add_comm and Int.bmod"
      - "holds for SlowPath (BigInt arithmetic) via Int.add_comm directly"
      - "not provable by rfl — requires the Int.add_comm structural lemma"
      - "first compositional property in the substrate — beyond pointwise (Bronze), structural (Silver), subtype (Gold)"
    preconditions:
      - "no operand-shape preconditions — commutativity is a universal algebraic property of Int addition"
      - "the dispatcher is well-formed (Silver model preconditions inherited via the dispatcher's definition)"
    postconditions:
      - "an emitter that uses a non-commutative representation (e.g., string concatenation before parsing) would falsify the commutativity claim — a real semantic bug class Bronze/Silver/Gold couldn't catch"
      - "Platinum tier captures algebraic STRUCTURE that prior tiers couldn't model"

  add_dispatch_commutative_monoid_diamond:
    # PMAT-214 / XPILE-REFINE-PY-INT-ARITH-008: FIRST Diamond-
    # tier refinement in the entire substrate. Opens the next
    # tier beyond Platinum per ruchy 5.0 §14.10.5. Diamond
    # captures COMBINED algebraic axiomatizations (monoids,
    # rings, semirings) by combining multiple Platinum
    # theorems into single tier-defining theorems. PMAT-214
    # combines PMAT-199 commutativity + PMAT-200 associativity
    # + identity into the commutative-monoid axiomatization
    # for slow-path addition. Companion theorems
    # mul_dispatch_commutative_monoid_diamond and
    # slow_path_semiring_diamond extend to multiplication and
    # the full SEMIRING structure.
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_commutative_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      ∀ a b c : Int.
        (add(a,b) = add(b,a))                 -- commutativity
        ∧ (add(add(a,b),c) = add(a,add(b,c))) -- associativity
        ∧ (add(0, a) = a)                     -- left identity
      (commutative monoid)
    domain: |
      Any Int operands a, b, c on the SlowPath. The Diamond
      upgrade captures the FULL commutative-monoid axiomatization
      combining commutativity + associativity + identity.
    invariants:
      - "FIRST Diamond-tier theorem in the substrate"
      - "COMBINED algebraic axiomatization: commutativity + associativity + identity"
      - "captures the (Int, +, 0) commutative monoid at the type level"
      - "companion theorem mul_dispatch_commutative_monoid_diamond extends to (Int, *, 1)"
      - "companion theorem slow_path_semiring_diamond combines both monoids with distributivity (PMAT-200) into the full SEMIRING axiomatization"
    preconditions:
      - "the dispatcher path is SlowPath (Diamond combines Platinum theorems that hold on SlowPath only — associativity does not hold on FastPath under wrap-around)"
    postconditions:
      - "an emitter satisfying individual Platinum theorems but breaking the joint structure (e.g., position-dependent reductions) would falsify the Diamond conjunction"
      - "Diamond tier captures algebraic STRUCTURE COMPOSITION that prior tiers couldn't axiomatize as a single unit"

  add_dispatch_slow_path_associative_platinum:
    # PMAT-200 / XPILE-REFINE-PY-INT-ARITH-007: SECOND Platinum-tier
    # refinement in the substrate. Demonstrates that the Platinum
    # pattern captures TERNARY compositional properties
    # (associativity), not just binary ones (commutativity from
    # PMAT-199). Slow-path-only because bigint_add (unbounded Int)
    # is genuinely associative, while i64_wrap_add (FastPath) is
    # NOT associative under wrap-around — that asymmetry is itself
    # a Platinum-level observation. Companion theorems
    # mul_dispatch_slow_path_associative_platinum (Int.mul_assoc)
    # and mul_distributes_over_add_slow_path_platinum
    # (Int.mul_add, the first cross-operation distributivity
    # theorem in the substrate).
    lean_theorem: "XpileContracts.CPyIntArith.add_dispatch_slow_path_associative_platinum"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      add_dispatch(SlowPath, add_dispatch(SlowPath, a, b), c)
        == add_dispatch(SlowPath, a, add_dispatch(SlowPath, b, c))
    domain: |
      Any Int operands a, b, c on the SlowPath. The FastPath is
      NOT associative under wrapping arithmetic — this theorem
      claims the property ONLY for SlowPath / BigInt mode.
    invariants:
      - "ternary compositional property: associativity on the unbounded BigInt path"
      - "fast-path is NOT associative — asymmetry is itself a Platinum-level observation about dispatch"
      - "companion theorem mul_dispatch_slow_path_associative_platinum extends the pattern to multiplication"
      - "companion theorem mul_distributes_over_add_slow_path_platinum is the FIRST cross-operation distributivity theorem in the substrate — ties together additive and multiplicative algebraic structures"
    preconditions:
      - "the dispatcher path is SlowPath (BigInt mode) — associativity does NOT hold on FastPath"
      - "operands are unbounded Int (no fits_i64 constraints needed for SlowPath)"
    postconditions:
      - "an emitter that produces a non-associative slow-path implementation (e.g., truncating at intermediate steps) would falsify this theorem"
      - "monoid/ring algebraic axioms are now structurally captured at the dispatcher level"

  pyint_fast_add_returns_fast_gold:
    # PMAT-185 / XPILE-REFINE-PY-INT-ARITH-005: FIRST Gold-tier
    # refinement in the entire substrate. Promotes Silver's
    # fits_i64-as-hypothesis to a refinement subtype
    # PyIntFast := { n : Int // fits_i64 n }. The fits_i64
    # invariant is carried by the value, not by an external
    # hypothesis. An emitter receiving a PyIntFast cannot pass
    # an out-of-range Int — the type system rules it out at
    # compile time. Companion theorems pyint_fast_witness_gold
    # and gold_subtype_agrees_with_silver_dispatch.
    lean_theorem: "XpileContracts.CPyIntArith.pyint_fast_add_returns_fast_gold"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      PyIntFast.add_with_fits_proof(a, b, h_sum).val == a.val + b.val
    domain: |
      Two PyIntFast operands (each carries its own fits_i64
      witness) plus a proof that their sum also fits. The Gold
      upgrade captures what Silver couldn't model — the fits_i64
      proof TRAVELS WITH the value through subsequent calls.
    invariants:
      - "PyIntFast values carry their fits_i64 witness with them (witness theorem pyint_fast_witness_gold)"
      - "downstream code can chain PyIntFast additions without re-proving fits_i64 at every step — the type system enforces it"
      - "Gold-tier refinement subtype rules out invalid inputs at CONSTRUCTION time (caller without a fits_i64 proof can't create the PyIntFast)"
      - "bridges to the Silver model via gold_subtype_agrees_with_silver_dispatch — both Silver and Gold agree on the fits domain"
    preconditions:
      - "both operands are PyIntFast (carry their own fits_i64 witness)"
      - "h_sum : fits_i64 (a.val + b.val) — the carry-out check that addition can introduce a witness that the operands don't have alone"
    postconditions:
      - "the result is a PyIntFast (the fits_i64 proof is preserved at the type level for subsequent calls)"
      - "an emitter accepting raw Int values is upgradeable to PyIntFast by inserting fits_i64-proof construction at the boundary — once inside the typed region, no precondition propagation needed"
      - "this is the archetype Gold-tier refinement pattern per ruchy 5.0 §14.10.5: structural typing + subtype-encoded preconditions"

  dispatch_correct_on_fits_silver:
    # PMAT-169 / XPILE-REFINE-PY-INT-ARITH-001: Silver-tier
    # refinement promotes the Bronze pointwise-equality model of
    # addition_no_overflow to a typed-dispatch model. Introduces
    # PyIntPath { FastPath | SlowPath } and proves that the
    # dispatcher selects either path correctly: fast/slow agree on
    # fits_i64, slow path always returns the mathematical sum,
    # dispatcher is total. Captures the load-bearing emission
    # decision xpile-rust-codegen makes at codegen time (which
    # Bronze couldn't model since it only had per-operation
    # equality). SIXTH multi-eq contract Silver upgrade (after
    # PMAT-164/165/166/167/168) and the FIRST Silver on a
    # substantive Bronze base (the previous Silver upgrades
    # promoted byte-array Bronze; this one promotes already-
    # substantive Int-level Bronze to a typed-dispatch Silver).
    lean_theorem: "XpileContracts.CPyIntArith.dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      add_dispatch(FastPath, a, b) == add_dispatch(SlowPath, a, b)  WHEN  fits_i64(a + b)
    domain: |
      Same as addition_no_overflow — a, b Python int values whose
      mathematical sum fits in i64. The Silver upgrade lifts the
      Bronze pairwise-equality claim into a typed dispatcher.
    invariants:
      - "the dispatcher is total: every (path, a, b) yields a defined value (no stuck state at codegen time)"
      - "fast and slow paths agree on the fits_i64 domain — the load-bearing soundness condition for emitting i64 wrapping arithmetic"
      - "the slow path returns the mathematical sum on EVERY input (subsumes add_slow_path_eq_python at the dispatcher level)"
    preconditions:
      - "for the fast-path agreement claim: fits_i64(a + b) must hold (the contract precondition for emitting i64_wrap_add)"
      - "the slow-path soundness claim has no precondition (the safety net branch)"
    postconditions:
      - "an emitter that selects FastPath when fits_i64 fails would falsify dispatch_correct_on_fits_silver — captures the path-selection error that Bronze couldn't detect"
      - "the dispatch model is what xpile-rust-codegen actually encodes; companion theorems dispatch_slow_path_eq_python_silver and dispatch_total_silver in the same Lean file complete the structural Silver story"

  addition_overflow_promotion:
    formula: |
      python_int_add(a, b) == bigint::add(a, b)  WHEN  not fits_i64(a + b)
    domain: |
      a, b: Python ints whose mathematical sum does not fit in i64.
    invariants:
      - "the result equals the mathematically exact a + b"
      - "no information loss compared to CPython"
      - "exactly one heap allocation (the BigInt result)"
    preconditions:
      - "a and b are both Python int (BigInt-eligible)"
      - "the function is lowered in BigInt mode (return-type annotation `-> BigInt`, per PMAT-013)"
    postconditions:
      - "the result equals the mathematically exact `a + b` (no truncation, no wrapping)"
      - "the result equals CPython `int.__add__(a, b)` evaluated on the same operands (bit-identical via the value's BigInt encoding)"
      - "the BigInt allocation uses `xpile_bigint::BigInt` (the canonical runtime, not a hand-rolled type)"
    # XPILE-REFINE-006 / PMAT-034: slow-path soundness theorem. Both
    # CPython's `int.__add__` and our model of `xpile_bigint::BigInt::add`
    # are unbounded mathematical addition; the theorem reduces to `rfl`
    # by our definitional choice (`bigint_add a b := a + b`). The
    # `¬ fits_i64` hypothesis is the operational trigger, not a math
    # precondition — it documents which equation this theorem refines.
    lean_theorem: "XpileContracts.CPyIntArith.add_slow_path_eq_python"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "addition_overflow_promotion"
    kani_file: "contracts/kani/py_int_arith.rs"

  bigint_addition_is_heap_allocated_silver:
    # PMAT-183 / XPILE-REFINE-PY-INT-ARITH-004: Silver-tier
    # refinement wires the slow-path-only companion equation.
    # Bronze (add_slow_path_eq_python) proved the slow path
    # returns the mathematical sum; Silver adds a typed
    # BigIntResult { value, allocation : Heap | Stack } that
    # captures the load-bearing allocation semantics. Companion
    # theorem bigint_addition_value_eq_math_silver keeps the
    # Bronze sum-equality claim in the Silver model. COMPLETES
    # Silver coverage on C-PY-INT-ARITH (9/9) — SIXTH and FINAL
    # multi-eq contract at full Silver.
    lean_theorem: "XpileContracts.CPyIntArith.bigint_addition_is_heap_allocated_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      bigint_add_with_allocation(a, b).allocation == Heap
    domain: |
      Same as addition_overflow_promotion — a, b Python ints whose
      mathematical sum does not fit in i64.
    invariants:
      - "the slow-path result is HEAP-ALLOCATED (Allocation::Heap), never stack-allocated as a wrapped i64"
      - "the result value equals the mathematical sum (companion theorem bigint_addition_value_eq_math_silver)"
      - "captures the load-bearing 'exactly one heap allocation' invariant at the type level — Bronze couldn't model allocation strategy"
    preconditions:
      - "the function is lowered in BigInt mode"
      - "the Silver model assumes a 2-state allocation enum (Stack | Heap); Gold tier introduces refinement subtypes for allocator tracking"
    postconditions:
      - "an emitter that optimises small BigInt values onto the stack as wrapped i64 (SmallVec-style representation) would falsify the Silver theorem — caught at the typed-enum level"
      - "the heap-allocation contract is structurally locked-in regardless of value magnitude"

  multiplication_quadratic_promotion:
    formula: |
      python_int_mul(a, b) == if fits_i64(a * b) { rust_i64::wrapping_mul(a, b) } else { bigint::mul(a, b) }
    domain: |
      a, b: Python ints. Special case: i64::MIN * -1 always promotes.
    invariants:
      - "result matches CPython for all (a, b) including i64::MIN * -1 which CPython promotes to bigint"
      - "i64::MIN.wrapping_mul(-1) == i64::MIN — Rust wraps; CPython promotes; we MUST follow CPython"
    preconditions:
      - "a and b are both Python int"
    postconditions:
      - "the result equals CPython `int.__mul__(a, b)` evaluated on the same operands"
      - "the i64::MIN * -1 case is handled via promotion to BigInt (not a silent wrap)"
      - "the dispatch between fast (i64) and slow (BigInt) path is deterministic on (a, b) — no run-to-run variance"
    # XPILE-REFINE-003 / PMAT-029: refinement proof for the *fast path*
    # half of the equation. The slow-path / promotion half is
    # XPILE-REFINE-004+.
    lean_theorem: "XpileContracts.CPyIntArith.mul_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "multiplication_quadratic_promotion"
    kani_file: "contracts/kani/py_int_arith.rs"

  mul_dispatch_correct_on_fits_silver:
    # PMAT-175 / XPILE-REFINE-PY-INT-ARITH-002: Silver-tier
    # dispatcher for multiplication. Replicates the PMAT-169
    # pattern (typed PyIntPath { FastPath | SlowPath } +
    # mul_dispatch_silver). Captures the path-selection decision
    # xpile-rust-codegen makes per `*` call site. Composes with
    # the Bronze mul_fast_path_eq_slow_path at the dispatcher
    # level. Companion theorems mul_dispatch_slow_path_eq_python_
    # silver and mul_dispatch_total_silver in same file.
    lean_theorem: "XpileContracts.CPyIntArith.mul_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      mul_dispatch(FastPath, a, b) == mul_dispatch(SlowPath, a, b)  WHEN  fits_i64(a * b)
    domain: |
      Same as multiplication_quadratic_promotion — a, b Python int values whose
      mathematical product fits in i64. The Silver upgrade lifts
      the Bronze pairwise-equality claim into a typed dispatcher.
    invariants:
      - "fast and slow multiplication paths agree on the fits_i64-of-product domain"
      - "the slow path returns the mathematical product on EVERY input (companion theorem)"
      - "the multiplication dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a * b) — the contract precondition for emitting i64_wrap_mul"
    postconditions:
      - "an emitter that selects FastPath when fits_i64(a*b) fails would falsify the dispatch claim — captures the i64::MIN * -1 silent-wrap bug class"

  division_floor_semantics:
    formula: |
      python_int_floordiv(a, b) == floor(a / b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `//` is FLOOR division;
      Rust `/` is TRUNCATING.
    invariants:
      - "for mixed-sign operands Python and Rust diverge by one — must be corrected in translation"
      - "div_euclid is closer to floor but still diverges when remainder is zero — handle that case"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fdiv a b` (floor division) for all (a, b) with b != 0"
      - "for mixed-sign operands, the result diverges from Rust's truncating `/` — the emitted code uses `checked_div_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__floordiv__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: refinement proof. Both fast and
    # slow path model floor-div as `Int.fdiv`, so the theorem reduces
    # to `rfl`; the load-bearing claim is that this *identity*
    # observation is recorded next to the equation rather than
    # implicit in the prose.
    lean_theorem: "XpileContracts.CPyIntArith.floor_div_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "division_floor_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  floor_div_dispatch_correct_on_fits_silver:
    # PMAT-175: Silver-tier dispatcher for floor-division.
    # Replicates PMAT-169's pattern. Even though fast and slow
    # paths reduce to the same Int.fdiv operation, the SELECTION
    # decision is what the Silver theorem captures (Bronze
    # couldn't model the dispatcher itself).
    lean_theorem: "XpileContracts.CPyIntArith.floor_div_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      floor_div_dispatch(FastPath, a, b) == floor_div_dispatch(SlowPath, a, b)
        WHEN b != 0 AND fits_i64(Int.fdiv a b)
    domain: |
      Same as division_floor_semantics — a, b Python ints with b != 0.
    invariants:
      - "fast and slow floor-div paths agree on the fits_i64-of-quotient domain with b != 0"
      - "the slow path returns Int.fdiv on every input (b != 0) — companion theorem"
      - "the floor-div dispatcher is total (companion theorem)"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
      - "fits_i64(Int.fdiv a b) for the fast-path agreement claim"
    postconditions:
      - "an emitter that uses Rust's truncating `/` instead of checked_div_euclid would diverge from CPython on mixed-sign operands — caught by the dispatcher's slow-path soundness claim"

  modulo_floor_semantics:
    formula: |
      python_int_mod(a, b) == floor_mod(a, b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `%` is FLOOR mod
      (sign of result matches sign of divisor); Rust `%` is
      TRUNCATING mod (sign matches sign of dividend).
    invariants:
      - "for mixed-sign operands Python and Rust diverge — must use rem_euclid or equivalent in translation"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fmod a b` (sign matches divisor) for all (a, b) with b != 0"
      - "for mixed-sign operands the result diverges from Rust's truncating `%` — the emitted code uses `checked_rem_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__mod__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: same `rfl` structure as floor div.
    # Both paths model mod as `Int.fmod`.
    lean_theorem: "XpileContracts.CPyIntArith.mod_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "modulo_floor_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  mod_dispatch_correct_on_fits_silver:
    # PMAT-175: Silver-tier dispatcher for modulo. Replicates
    # PMAT-169's pattern. Same domain story as floor-division —
    # both paths reduce to Int.fmod; the Silver claim is on the
    # path-selection decision.
    lean_theorem: "XpileContracts.CPyIntArith.mod_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      mod_dispatch(FastPath, a, b) == mod_dispatch(SlowPath, a, b)
        WHEN b != 0 AND fits_i64(Int.fmod a b)
    domain: |
      Same as modulo_floor_semantics — a, b Python ints with b != 0.
    invariants:
      - "fast and slow modulo paths agree on the fits_i64-of-remainder domain with b != 0"
      - "the slow path returns Int.fmod on every input (b != 0) — companion theorem"
      - "the modulo dispatcher is total (companion theorem)"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError)"
      - "fits_i64(Int.fmod a b) for the fast-path agreement claim"
    postconditions:
      - "an emitter that uses Rust's truncating `%` instead of checked_rem_euclid would diverge from CPython on mixed-sign operands"
    kani_file: "contracts/kani/py_int_arith.rs"

  division_algorithm_diamond:
    # PMAT-228 / XPILE-REFINE-PY-INT-ARITH-009: SECOND Diamond-
    # tier refinement on C-PY-INT-ARITH. First DEPTH-2 Diamond in
    # the entire substrate — opens Diamond breadth. Previously,
    # every contract had at most one Diamond category; PMAT-228
    # adds the EUCLIDEAN-DOMAIN Diamond on the same contract that
    # already has the commutative-monoid / semiring Diamond
    # (PMAT-214). The two Diamonds capture distinct algebraic
    # categories: PMAT-214 is (Int, +, 0, *, 1) as semiring;
    # PMAT-228 is (Int, fdiv, fmod) satisfying the canonical
    # division algorithm.
    lean_theorem: "XpileContracts.CPyIntArith.division_algorithm_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      ∀ a b : Int.
        (a fmod b + b * (a fdiv b) = a)                 -- division algorithm
        ∧ (floor_div_dispatch SlowPath a b = Int.fdiv a b)
        ∧ (mod_dispatch SlowPath a b = Int.fmod a b)
        ∧ (mod_dispatch SlowPath a b
            + b * floor_div_dispatch SlowPath a b = a)   -- composed
      (Euclidean-domain axiomatization)
    domain: |
      Any Int operands a, b on the SlowPath. The Diamond upgrade
      captures the FULL Euclidean-domain axiomatization, including
      the canonical division algorithm and slow-path dispatcher
      soundness. b = 0 is admitted in the algebraic statement
      because Int.fdiv / Int.fmod default to 0 at b = 0 in Lean,
      satisfying the identity trivially; runtime emission still
      enforces b ≠ 0 via Python's ZeroDivisionError semantics.
    invariants:
      - "SECOND Diamond-tier theorem on C-PY-INT-ARITH — opens Diamond breadth (first DEPTH-2 Diamond in the substrate)"
      - "fundamentally distinct algebraic category from PMAT-214 (semiring vs Euclidean-domain)"
      - "captures (Int, fdiv, fmod) as a Euclidean domain at the type level"
      - "the division algorithm holds when both dispatchers are read on the slow path"
    preconditions:
      - "Lean's Int.fdiv / Int.fmod default to 0 at b = 0 — the algebraic identity holds for ALL b including 0"
    postconditions:
      - "an emitter that uses C-style truncating div instead of Python floor-div would falsify the division algorithm on negative dividends"
      - "Diamond BREADTH demonstrated: 2 distinct Diamond categories on the same contract is possible"
      - "the substrate's Diamond tier can now demonstrate algebraic depth-2 — multiple categories per contract"

  shift_monoid_diamond:
    # PMAT-241 / XPILE-REFINE-PY-INT-ARITH-010: THIRD Diamond on
    # this contract — first DEPTH-3 Diamond in the substrate.
    # SHIFT-MONOID Diamond: (Int × Nat, shl, 0) forms a monoid
    # action of (Nat, +, 0) on Int via powers of 2. Distinct
    # algebraic category from PMAT-214 semiring and PMAT-228
    # Euclidean-domain — captures exponent-indexed multiplicative
    # structure via shift composition law shl(shl(a, b1), b2) =
    # shl(a, b1 + b2).
    lean_theorem: "XpileContracts.CPyIntArith.shift_monoid_diamond"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      Left-shift forms a MONOID action of (Nat, +, 0) on Int:
        (a) slow-path semantics: shl(a, b) = a * 2^b
        (b) exponent additivity: shl(shl(a, b1), b2)
                                   = shl(a, b1 + b2)
        (c) identity: shl(a, 0) = a
        (d) zero on zero input: shl(0, b) = 0
    domain: |
      Any Int operand a and Nat shift amounts b1, b2 on the
      SlowPath. The Diamond captures the full shift-monoid
      axiomatization as a third orthogonal algebraic structure
      on top of the semiring (PMAT-214) and Euclidean-domain
      (PMAT-228) Diamonds.
    invariants:
      - "FIRST DEPTH-3 Diamond in the substrate — three orthogonal algebraic categories on the same contract"
      - "distinct from PMAT-214 semiring (additive/multiplicative) and PMAT-228 Euclidean-domain (division)"
      - "captures (Nat, +, 0) → Int shift-action as a monoid homomorphism"
    preconditions:
      - "SlowPath dispatcher (shift-monoid axioms hold under unbounded Int, not FastPath wrap-around)"
    postconditions:
      - "an emitter that uses wrap-around shift on the slow path would falsify the exponent-additivity composition law"
      - "Diamond DEPTH-3 demonstrated: three distinct algebraic categories on PyIntArith — opens new dimension of refinement"

  bitwise_and_signed_semantics:
    formula: |
      python_int_and(a, b) == rust_i64::bitand(a, b)  WHEN  both_fit_i64(a, b)
    domain: |
      a, b: Python ints that fit in i64.
    invariants:
      - "Python ints have INFINITE-PRECISION two's complement representation"
      - "for negative bigint operands, the Rust output must match this — separate bigint contract"
    preconditions:
      - "both operands fit in i64 (the BigInt extension is the separate-contract follow-on)"
      - "a and b are both Python int (not float, not bool)"
    postconditions:
      - "the result equals `Int.land a b` over the two's-complement i64 representation"
      - "the result equals CPython `int.__and__(a, b)` bit-for-bit in the i64 domain"
      - "no heap allocation in the fits_i64 fast path"
    # PMAT-138 / XPILE-REFINE-005: Bronze-tier refinement theorem
    # via hand-rolled cast-through-Nat encoding. Both fast and slow
    # paths invoke the shared `i64_and` kernel; proof is `rfl` by
    # construction. Silver tier replaces the encoding with a precise
    # BitVec 64 model.
    lean_theorem: "XpileContracts.CPyIntArith.and_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "bitwise_and_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  and_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for bitwise-AND.
    # Replicates PMAT-169 pattern. Even though Bronze had both
    # paths reduce to the same shared-kernel i64_and, the Silver
    # claim is on the path-selection — a future emitter swapping
    # bigint_and for GMP's mpz_and would falsify path-correctness
    # without touching the Bronze theorem.
    lean_theorem: "XpileContracts.CPyIntArith.and_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      and_dispatch(FastPath, a, b) == and_dispatch(SlowPath, a, b)
        WHEN fits_i64(a) AND fits_i64(b)
    domain: |
      Same as bitwise_and_signed_semantics — a, b Python ints that fit in i64.
    invariants:
      - "fast and slow bitwise-AND paths agree when both operands fit in i64"
      - "the slow path returns bigint_and on every input (companion theorem)"
      - "the bitwise-AND dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a) AND fits_i64(b) — the contract precondition for emitting i64 bit-AND"
    postconditions:
      - "a future emitter swapping bigint_and for GMP's mpz_and would falsify path-correctness — caught at the dispatcher level"

  shift_left_signed_semantics:
    formula: |
      python_int_shl(a, b) == rust_i64::wrapping_shl(a, b)  WHEN  0 <= b < 64 AND fits_i64(a * 2^b)
    domain: |
      a: Python int that fits in i64; b: Nat exponent.
    invariants:
      - "Python `<<` is mathematical: result = a * 2^b on unbounded ints"
      - "Rust `(a as i64).checked_shl(b)` panics on b >= 64; we cite C-PY-INT-ARITH there"
      - "in the fits_i64 domain both paths agree via `Int.bmod` reduction"
    preconditions:
      - "0 <= b < 64 (else Rust panics — separate contract slot)"
      - "the mathematical product `a * 2^b` fits in i64 (else BigInt promotion required — separate contract)"
    postconditions:
      - "the result equals `Int.shiftLeft a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__lshift__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_shl` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shl reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.shl_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "shift_left_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  shl_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for left-shift.
    # Replicates PMAT-169 pattern. Captures the path-selection
    # decision per `<<` call site.
    lean_theorem: "XpileContracts.CPyIntArith.shl_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      shl_dispatch(FastPath, a, b) == shl_dispatch(SlowPath, a, b)
        WHEN fits_i64(a * 2^b)
    domain: |
      Same as shift_left_signed_semantics — a Python int that fits in i64; b Nat.
    invariants:
      - "fast and slow left-shift paths agree on the fits_i64-of-product domain"
      - "the slow path returns a * 2^b on every input (companion theorem)"
      - "the left-shift dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a * 2^b) — the contract precondition for emitting i64_wrap_shl"
      - "b : Nat (negative shifts are out of domain per Rust's u32 API match)"
    postconditions:
      - "an emitter that emits raw `<<` instead of `checked_shl` for out-of-domain inputs would silently wrap rather than panic"

  shift_right_signed_semantics:
    formula: |
      python_int_shr(a, b) == rust_i64::checked_shr(a, b)  WHEN  0 <= b < 64
    domain: |
      a: Python int that fits in i64; b: Nat exponent in [0, 64).
    invariants:
      - "Python `>>` and Rust `>>` on signed i64 are both arithmetic (sign-preserving)"
      - "both paths model the shift as `Int.fdiv a (2^b)` — pointwise equal under fits_i64 precondition"
    preconditions:
      - "0 <= b < 64 (else Rust panics)"
    postconditions:
      - "the result equals `Int.fdiv a (2^b)` (arithmetic shift, sign-preserving)"
      - "the result equals CPython `int.__rshift__(a, b)` bit-for-bit"
      - "the emission uses `checked_shr` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shr is `rfl` (Int.fdiv on both sides).
    lean_theorem: "XpileContracts.CPyIntArith.shr_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "shift_right_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  shr_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for right-shift.
    # Replicates PMAT-169 pattern. Both paths reduce to Int.fdiv
    # — the Silver claim captures the path-selection decision.
    lean_theorem: "XpileContracts.CPyIntArith.shr_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      shr_dispatch(FastPath, a, b) == shr_dispatch(SlowPath, a, b)
        WHEN fits_i64(Int.fdiv a (2^b))
    domain: |
      Same as shift_right_signed_semantics — a Python int that fits in i64; b Nat in [0, 64).
    invariants:
      - "fast and slow right-shift paths agree on the fits_i64 domain"
      - "the slow path returns Int.fdiv a (2^b) on every input (companion theorem)"
      - "the right-shift dispatcher is total (companion theorem)"
    preconditions:
      - "0 <= b < 64 (else Rust panics)"
      - "fits_i64(Int.fdiv a (2^b)) for the fast-path agreement claim"
    postconditions:
      - "the dispatch claim is preserved even when both paths' underlying ops are identical — captures the selection-decision Bronze couldn't model"

  power_signed_semantics:
    formula: |
      python_int_pow(a, b) == rust_i64::wrapping_pow(a, b)  WHEN  b >= 0 AND fits_i64(a^b)
    domain: |
      a: Python int that fits in i64; b: Nat (non-negative exponent).
    invariants:
      - "Python `**` with non-negative integer exponent stays in int domain"
      - "Negative exponent always promotes to Float in Python — separate contract"
      - "Rust `(a as i64).checked_pow(b as u32)` panics on overflow; cited as C-PY-INT-ARITH"
    preconditions:
      - "b >= 0 (else Python promotes to Float — out of scope)"
      - "the mathematical result `a^b` fits in i64 (else BigInt promotion required)"
    postconditions:
      - "the result equals `Int.pow a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__pow__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_pow(u32::try_from(rhs).expect(...))` so overflow panics with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: pow reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.pow_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # PMAT-151: Kani harness mirrors the Lean theorem.
    kani_harness: "power_signed_semantics"
    kani_file: "contracts/kani/py_int_arith.rs"

  pow_dispatch_correct_on_fits_silver:
    # PMAT-176: Silver-tier dispatcher for power (`a ** b`).
    # Replicates PMAT-169 pattern. With this, C-PY-INT-ARITH has
    # Silver dispatchers on ALL 8 fast/slow-path equations
    # (addition_overflow_promotion is the slow-path-only
    # companion that doesn't have its own dispatcher; its
    # slow-path soundness is covered by
    # dispatch_slow_path_eq_python_silver from PMAT-169).
    lean_theorem: "XpileContracts.CPyIntArith.pow_dispatch_correct_on_fits_silver"
    lean_file: "contracts/lean/PyIntArith.lean"
    formula: |
      pow_dispatch(FastPath, a, b) == pow_dispatch(SlowPath, a, b)
        WHEN fits_i64(a^b)
    domain: |
      Same as power_signed_semantics — a Python int that fits in i64; b Nat (non-negative).
    invariants:
      - "fast and slow power paths agree on the fits_i64-of-result domain"
      - "the slow path returns a^b on every input (companion theorem)"
      - "the power dispatcher is total (companion theorem)"
    preconditions:
      - "fits_i64(a^b) — the contract precondition for emitting checked_pow"
      - "b : Nat (negative exponent promotes to Float — separate contract)"
    postconditions:
      - "an emitter that uses unchecked pow for out-of-domain inputs would overflow silently — caught by the dispatcher's selection claim"

proof_obligations:
  - type: precondition
    property: operands are Python int (not int-subclass, not bool-as-int)
    formal: "type(a) is int ∧ type(b) is int"
    applies_to: all
  - type: postcondition
    property: result equals CPython's output bit-for-bit for the i64 domain
    formal: "∀ a, b ∈ i64: a + b ∈ i64 ⟹ result == cpython_eval(f'{a}+{b}')"
    applies_to: addition_no_overflow
  - type: postcondition
    property: result equals CPython's output mathematically for the promotion domain
    formal: "∀ a, b: a + b ∉ i64 ⟹ bigint_eq(result, cpython_eval(f'{a}+{b}'))"
    applies_to: addition_overflow_promotion
  - type: invariant
    property: no silent truncation
    formal: "∀ a, b, op: emit(a op b) preserves the exact mathematical value"
    applies_to: all
  - type: bound
    property: at most one heap allocation per arithmetic op
    formal: "allocs(emit(op)) ∈ {0, 1}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-PY-INT-ARITH-001
    rule: |
      i64::MAX + 1 must promote to bigint, not silently wrap.
    prediction: |
      python_int_add(i64::MAX, 1) returns BigInt(i64::MAX + 1), not i64::MIN.
    test: |
      cargo test -p depyler-frontend --test py_int_overflow_promotion
    if_fails: |
      The translation is doing wrapping_add without the fits_i64 guard.
    ship_blocking: true
    counter_example_classes:
      - silent_wrap_on_overflow

  - id: FALSIFY-PY-INT-ARITH-002
    rule: |
      i64::MIN * -1 must promote to bigint (Python doesn't wrap).
    prediction: |
      python_int_mul(i64::MIN, -1) returns BigInt(2^63), not i64::MIN.
    test: |
      cargo test -p depyler-frontend --test py_int_min_neg_one
    if_fails: |
      Multiplication translation forgot the i64::MIN * -1 special case.
    ship_blocking: true
    counter_example_classes:
      - i64_min_times_neg_one

  - id: FALSIFY-PY-INT-ARITH-003
    rule: |
      Floor division of -7 // 2 must equal -4 (Python floor), not -3 (Rust trunc).
    prediction: |
      python_int_floordiv(-7, 2) == -4.
    test: |
      cargo test -p depyler-frontend --test py_int_floordiv_mixed_sign
    if_fails: |
      The translation emitted `a / b` (Rust trunc) instead of correcting to floor.
    ship_blocking: true
    counter_example_classes:
      - trunc_instead_of_floor

  - id: FALSIFY-PY-INT-ARITH-004
    rule: |
      Bitwise AND on i64-fitting Python ints must match Rust i64 AND bit-for-bit.
    prediction: |
      For all (a, b) ∈ i64²: python_int_and(a, b) == a & b (Rust i64).
    test: |
      cargo test -p depyler-frontend --test py_int_bitand_i64
    if_fails: |
      Two's complement representation mismatch — likely sign-extension bug.
    ship_blocking: true
    counter_example_classes:
      - sign_extension_bug

  - id: FALSIFY-PY-INT-ARITH-005
    rule: |
      No arithmetic op allocates more than once.
    prediction: |
      For any single binary arithmetic op, the allocation counter
      increments by at most 1 (the bigint result, if promoted).
    test: |
      cargo test -p depyler-frontend --test py_int_arith_alloc_budget
    if_fails: |
      Intermediate BigInt allocation in the fast path — wasted work.
    ship_blocking: false
    counter_example_classes:
      - intermediate_alloc

kani_harnesses:
  - id: KANI-PY-INT-ARITH-001
    obligation: addition_no_overflow
    bound: 8
    property: |
      At i8 bit width (256² pairs, exhaustive), addition_no_overflow
      holds: when (a + b) fits in i8, python_int_add(a, b) equals
      wrapping_add(a, b). Lifts algebraically to i64 via Lean.
    harness: |
      #[kani::proof]
      fn addition_no_overflow_i8() {
          let a: i8 = kani::any();
          let b: i8 = kani::any();
          let fits = (a as i16).checked_add(b as i16)
              .map(|s| s >= i8::MIN as i16 && s <= i8::MAX as i16)
              .unwrap_or(false);
          if fits {
              assert_eq!(a.wrapping_add(b), python_int_add_i8(a, b));
          }
      }

  - id: KANI-PY-INT-ARITH-002
    obligation: multiplication_quadratic_promotion
    bound: 8
    property: |
      i8::MIN * -1 must report "promotion required" (not wrap to i8::MIN).
    harness: |
      #[kani::proof]
      fn mul_min_neg_one_promotes() {
          let a: i8 = i8::MIN;
          let b: i8 = -1;
          assert!(needs_promotion_i8_mul(a, b));
      }

qa_gate:
  id: QA-PY-INT-ARITH
  name: "Python int arithmetic semantics contract"
  min_coverage: 0.85
  max_complexity: 20
  required_tests:
    - transpile_add_py_emits_rust_fn
    - rust_emission_for_add_compiles_with_rustc
    - py_int_arith_lean_file_carries_required_landmarks
    - py_int_arith_kani_file_carries_required_landmarks
    - every_referenced_lean_theorem_exists_in_its_file
    - every_referenced_kani_harness_exists_in_its_file
