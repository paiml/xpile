metadata:
  id: C-PY-INT-ARITH
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: kernel
  status: draft
  description: |
    Operational semantics of Python `int` arithmetic, as observed
    behaviorally in CPython 3.12+. Python's int is mathematically
    unbounded; xpile must preserve that across the Rust output, with
    a fast path through machine integers when the result fits.

    Layer 1 of the xpile contract taxonomy (per-language semantics).
    Paired with `C-XLATE-PY-LIST-TO-VEC-V1` and similar translation
    contracts at Layer 2.
  references:
    - "Python Language Reference §6.7 (Binary arithmetic operations)"
    - "CPython Objects/longobject.c"
    - docs/specifications/xpile-contract-driven-design-v1.md
  depends_on: []

equations:
  addition_no_overflow:
    formula: |
      python_int_add(a, b) == rust_i64::wrapping_add(a, b)  WHEN  fits_i64(a + b)
    domain: |
      a, b: Python int values whose mathematical sum fits in i64.
    invariants:
      - "no observable difference between CPython and Rust output when fits_i64(a+b)"
      - "no allocation in the fits_i64 fast path"
    preconditions:
      - "a and b are both Python int (not float, not bool, not bigint-required)"
    postconditions:
      - "the result is bit-identical to CPython `int.__add__(a, b)` evaluated on the same operands"
      - "no heap allocation occurs (the i64 result lives on the stack)"
      - "the emitted Rust uses `.wrapping_add` or equivalent — never `.unchecked_add` or raw `+` that could be optimized to silent UB"
    # XPILE-REFINE-001 / PMAT-017: refinement proof in Lean (Semantic
    # stratum). Statement IS the equation, formalised. v0.1.0 ships
    # the claim with `sorry`; XPILE-REFINE-002 discharges.
    lean_theorem: "XpileContracts.CPyIntArith.fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"
    # XPILE-QUORUM-001 / PMAT-019: Kani BMC harness (Symbolic stratum).
    # `addition_no_overflow` function in the harness file; Kani
    # discharges this automatically via bit-blasted i64 arithmetic.
    # Together with the Lean theorem above and the diff_exec runtime
    # check (PMAT-018), this equation now has ≥1 Symbolic + ≥1
    # Semantic vote per the ruchy 5.0 §14.4 quorum rule.
    kani_harness: "addition_no_overflow"
    kani_file: "contracts/kani/py_int_arith.rs"

  addition_overflow_promotion:
    formula: |
      python_int_add(a, b) == bigint::add(a, b)  WHEN  not fits_i64(a + b)
    domain: |
      a, b: Python ints whose mathematical sum does not fit in i64.
    invariants:
      - "the result equals the mathematically exact a + b"
      - "no information loss compared to CPython"
      - "exactly one heap allocation (the BigInt result)"
    preconditions:
      - "a and b are both Python int (BigInt-eligible)"
      - "the function is lowered in BigInt mode (return-type annotation `-> BigInt`, per PMAT-013)"
    postconditions:
      - "the result equals the mathematically exact `a + b` (no truncation, no wrapping)"
      - "the result equals CPython `int.__add__(a, b)` evaluated on the same operands (bit-identical via the value's BigInt encoding)"
      - "the BigInt allocation uses `xpile_bigint::BigInt` (the canonical runtime, not a hand-rolled type)"
    # XPILE-REFINE-006 / PMAT-034: slow-path soundness theorem. Both
    # CPython's `int.__add__` and our model of `xpile_bigint::BigInt::add`
    # are unbounded mathematical addition; the theorem reduces to `rfl`
    # by our definitional choice (`bigint_add a b := a + b`). The
    # `¬ fits_i64` hypothesis is the operational trigger, not a math
    # precondition — it documents which equation this theorem refines.
    lean_theorem: "XpileContracts.CPyIntArith.add_slow_path_eq_python"
    lean_file: "contracts/lean/PyIntArith.lean"

  multiplication_quadratic_promotion:
    formula: |
      python_int_mul(a, b) == if fits_i64(a * b) { rust_i64::wrapping_mul(a, b) } else { bigint::mul(a, b) }
    domain: |
      a, b: Python ints. Special case: i64::MIN * -1 always promotes.
    invariants:
      - "result matches CPython for all (a, b) including i64::MIN * -1 which CPython promotes to bigint"
      - "i64::MIN.wrapping_mul(-1) == i64::MIN — Rust wraps; CPython promotes; we MUST follow CPython"
    preconditions:
      - "a and b are both Python int"
    postconditions:
      - "the result equals CPython `int.__mul__(a, b)` evaluated on the same operands"
      - "the i64::MIN * -1 case is handled via promotion to BigInt (not a silent wrap)"
      - "the dispatch between fast (i64) and slow (BigInt) path is deterministic on (a, b) — no run-to-run variance"
    # XPILE-REFINE-003 / PMAT-029: refinement proof for the *fast path*
    # half of the equation. The slow-path / promotion half is
    # XPILE-REFINE-004+.
    lean_theorem: "XpileContracts.CPyIntArith.mul_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

  division_floor_semantics:
    formula: |
      python_int_floordiv(a, b) == floor(a / b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `//` is FLOOR division;
      Rust `/` is TRUNCATING.
    invariants:
      - "for mixed-sign operands Python and Rust diverge by one — must be corrected in translation"
      - "div_euclid is closer to floor but still diverges when remainder is zero — handle that case"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fdiv a b` (floor division) for all (a, b) with b != 0"
      - "for mixed-sign operands, the result diverges from Rust's truncating `/` — the emitted code uses `checked_div_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__floordiv__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: refinement proof. Both fast and
    # slow path model floor-div as `Int.fdiv`, so the theorem reduces
    # to `rfl`; the load-bearing claim is that this *identity*
    # observation is recorded next to the equation rather than
    # implicit in the prose.
    lean_theorem: "XpileContracts.CPyIntArith.floor_div_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

  modulo_floor_semantics:
    formula: |
      python_int_mod(a, b) == floor_mod(a, b)  WHEN  b != 0
    domain: |
      a, b: Python ints with b != 0. Python `%` is FLOOR mod
      (sign of result matches sign of divisor); Rust `%` is
      TRUNCATING mod (sign matches sign of dividend).
    invariants:
      - "for mixed-sign operands Python and Rust diverge — must use rem_euclid or equivalent in translation"
    preconditions:
      - "b != 0 (else Python raises ZeroDivisionError — separate contract)"
    postconditions:
      - "the result equals `Int.fmod a b` (sign matches divisor) for all (a, b) with b != 0"
      - "for mixed-sign operands the result diverges from Rust's truncating `%` — the emitted code uses `checked_rem_euclid` or the BigInt equivalent"
      - "the result equals CPython `int.__mod__(a, b)` bit-for-bit"
    # XPILE-REFINE-003 / PMAT-029: same `rfl` structure as floor div.
    # Both paths model mod as `Int.fmod`.
    lean_theorem: "XpileContracts.CPyIntArith.mod_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

  bitwise_and_signed_semantics:
    formula: |
      python_int_and(a, b) == rust_i64::bitand(a, b)  WHEN  both_fit_i64(a, b)
    domain: |
      a, b: Python ints that fit in i64.
    invariants:
      - "Python ints have INFINITE-PRECISION two's complement representation"
      - "for negative bigint operands, the Rust output must match this — separate bigint contract"
    preconditions:
      - "both operands fit in i64 (the BigInt extension is the separate-contract follow-on)"
      - "a and b are both Python int (not float, not bool)"
    postconditions:
      - "the result equals `Int.land a b` over the two's-complement i64 representation"
      - "the result equals CPython `int.__and__(a, b)` bit-for-bit in the i64 domain"
      - "no heap allocation in the fits_i64 fast path"
    # No `lean_theorem` yet: core Lean 4.15 doesn't ship
    # `Int.land` / `Int.lor` / `Int.xor`; encoding requires either a
    # mathlib dep or a hand-rolled cast-through-Nat. Tracked as
    # XPILE-REFINE-005 (separate from XPILE-REFINE-004's shift/pow
    # corpus completion).

  shift_left_signed_semantics:
    formula: |
      python_int_shl(a, b) == rust_i64::wrapping_shl(a, b)  WHEN  0 <= b < 64 AND fits_i64(a * 2^b)
    domain: |
      a: Python int that fits in i64; b: Nat exponent.
    invariants:
      - "Python `<<` is mathematical: result = a * 2^b on unbounded ints"
      - "Rust `(a as i64).checked_shl(b)` panics on b >= 64; we cite C-PY-INT-ARITH there"
      - "in the fits_i64 domain both paths agree via `Int.bmod` reduction"
    preconditions:
      - "0 <= b < 64 (else Rust panics — separate contract slot)"
      - "the mathematical product `a * 2^b` fits in i64 (else BigInt promotion required — separate contract)"
    postconditions:
      - "the result equals `Int.shiftLeft a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__lshift__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_shl` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shl reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.shl_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

  shift_right_signed_semantics:
    formula: |
      python_int_shr(a, b) == rust_i64::checked_shr(a, b)  WHEN  0 <= b < 64
    domain: |
      a: Python int that fits in i64; b: Nat exponent in [0, 64).
    invariants:
      - "Python `>>` and Rust `>>` on signed i64 are both arithmetic (sign-preserving)"
      - "both paths model the shift as `Int.fdiv a (2^b)` — pointwise equal under fits_i64 precondition"
    preconditions:
      - "0 <= b < 64 (else Rust panics)"
    postconditions:
      - "the result equals `Int.fdiv a (2^b)` (arithmetic shift, sign-preserving)"
      - "the result equals CPython `int.__rshift__(a, b)` bit-for-bit"
      - "the emission uses `checked_shr` so out-of-domain inputs panic with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: shr is `rfl` (Int.fdiv on both sides).
    lean_theorem: "XpileContracts.CPyIntArith.shr_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

  power_signed_semantics:
    formula: |
      python_int_pow(a, b) == rust_i64::wrapping_pow(a, b)  WHEN  b >= 0 AND fits_i64(a^b)
    domain: |
      a: Python int that fits in i64; b: Nat (non-negative exponent).
    invariants:
      - "Python `**` with non-negative integer exponent stays in int domain"
      - "Negative exponent always promotes to Float in Python — separate contract"
      - "Rust `(a as i64).checked_pow(b as u32)` panics on overflow; cited as C-PY-INT-ARITH"
    preconditions:
      - "b >= 0 (else Python promotes to Float — out of scope)"
      - "the mathematical result `a^b` fits in i64 (else BigInt promotion required)"
    postconditions:
      - "the result equals `Int.pow a b` reduced mod 2^64 in the fits_i64 domain"
      - "the result equals CPython `int.__pow__(a, b)` bit-for-bit when both preconditions hold"
      - "the emission uses `checked_pow(u32::try_from(rhs).expect(...))` so overflow panics with the contract-ID citation"
    # XPILE-REFINE-004 / PMAT-030: pow reuses bmod_fits_i64.
    lean_theorem: "XpileContracts.CPyIntArith.pow_fast_path_eq_slow_path"
    lean_file: "contracts/lean/PyIntArith.lean"

proof_obligations:
  - type: precondition
    property: operands are Python int (not int-subclass, not bool-as-int)
    formal: "type(a) is int ∧ type(b) is int"
    applies_to: all
  - type: postcondition
    property: result equals CPython's output bit-for-bit for the i64 domain
    formal: "∀ a, b ∈ i64: a + b ∈ i64 ⟹ result == cpython_eval(f'{a}+{b}')"
    applies_to: addition_no_overflow
  - type: postcondition
    property: result equals CPython's output mathematically for the promotion domain
    formal: "∀ a, b: a + b ∉ i64 ⟹ bigint_eq(result, cpython_eval(f'{a}+{b}'))"
    applies_to: addition_overflow_promotion
  - type: invariant
    property: no silent truncation
    formal: "∀ a, b, op: emit(a op b) preserves the exact mathematical value"
    applies_to: all
  - type: bound
    property: at most one heap allocation per arithmetic op
    formal: "allocs(emit(op)) ∈ {0, 1}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-PY-INT-ARITH-001
    rule: |
      i64::MAX + 1 must promote to bigint, not silently wrap.
    prediction: |
      python_int_add(i64::MAX, 1) returns BigInt(i64::MAX + 1), not i64::MIN.
    test: |
      cargo test -p depyler-frontend --test py_int_overflow_promotion
    if_fails: |
      The translation is doing wrapping_add without the fits_i64 guard.
    ship_blocking: true
    counter_example_classes:
      - silent_wrap_on_overflow

  - id: FALSIFY-PY-INT-ARITH-002
    rule: |
      i64::MIN * -1 must promote to bigint (Python doesn't wrap).
    prediction: |
      python_int_mul(i64::MIN, -1) returns BigInt(2^63), not i64::MIN.
    test: |
      cargo test -p depyler-frontend --test py_int_min_neg_one
    if_fails: |
      Multiplication translation forgot the i64::MIN * -1 special case.
    ship_blocking: true
    counter_example_classes:
      - i64_min_times_neg_one

  - id: FALSIFY-PY-INT-ARITH-003
    rule: |
      Floor division of -7 // 2 must equal -4 (Python floor), not -3 (Rust trunc).
    prediction: |
      python_int_floordiv(-7, 2) == -4.
    test: |
      cargo test -p depyler-frontend --test py_int_floordiv_mixed_sign
    if_fails: |
      The translation emitted `a / b` (Rust trunc) instead of correcting to floor.
    ship_blocking: true
    counter_example_classes:
      - trunc_instead_of_floor

  - id: FALSIFY-PY-INT-ARITH-004
    rule: |
      Bitwise AND on i64-fitting Python ints must match Rust i64 AND bit-for-bit.
    prediction: |
      For all (a, b) ∈ i64²: python_int_and(a, b) == a & b (Rust i64).
    test: |
      cargo test -p depyler-frontend --test py_int_bitand_i64
    if_fails: |
      Two's complement representation mismatch — likely sign-extension bug.
    ship_blocking: true
    counter_example_classes:
      - sign_extension_bug

  - id: FALSIFY-PY-INT-ARITH-005
    rule: |
      No arithmetic op allocates more than once.
    prediction: |
      For any single binary arithmetic op, the allocation counter
      increments by at most 1 (the bigint result, if promoted).
    test: |
      cargo test -p depyler-frontend --test py_int_arith_alloc_budget
    if_fails: |
      Intermediate BigInt allocation in the fast path — wasted work.
    ship_blocking: false
    counter_example_classes:
      - intermediate_alloc

kani_harnesses:
  - id: KANI-PY-INT-ARITH-001
    obligation: addition_no_overflow
    bound: 8
    property: |
      At i8 bit width (256² pairs, exhaustive), addition_no_overflow
      holds: when (a + b) fits in i8, python_int_add(a, b) equals
      wrapping_add(a, b). Lifts algebraically to i64 via Lean.
    harness: |
      #[kani::proof]
      fn addition_no_overflow_i8() {
          let a: i8 = kani::any();
          let b: i8 = kani::any();
          let fits = (a as i16).checked_add(b as i16)
              .map(|s| s >= i8::MIN as i16 && s <= i8::MAX as i16)
              .unwrap_or(false);
          if fits {
              assert_eq!(a.wrapping_add(b), python_int_add_i8(a, b));
          }
      }

  - id: KANI-PY-INT-ARITH-002
    obligation: multiplication_quadratic_promotion
    bound: 8
    property: |
      i8::MIN * -1 must report "promotion required" (not wrap to i8::MIN).
    harness: |
      #[kani::proof]
      fn mul_min_neg_one_promotes() {
          let a: i8 = i8::MIN;
          let b: i8 = -1;
          assert!(needs_promotion_i8_mul(a, b));
      }

qa_gate:
  id: QA-PY-INT-ARITH
  name: "Python int arithmetic semantics contract"
  min_coverage: 0.85
  max_complexity: 20
  required_tests:
    - transpile_add_py_emits_rust_fn
    - rust_emission_for_add_compiles_with_rustc
    - py_int_arith_lean_file_carries_required_landmarks
    - py_int_arith_kani_file_carries_required_landmarks
    - every_referenced_lean_theorem_exists_in_its_file
    - every_referenced_kani_harness_exists_in_its_file
