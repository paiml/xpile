metadata:
  id: C-WASM-HEAP
  version: "1.0.0"
  created: "2026-06-25"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Compile-time contract: how xpile-wasm-codegen lowers a string-RETURNING
    meta-HIR op (string concatenation `a + b` / `chr(n)` / a `str` return) to
    WebAssembly that ALLOCATES + materialises the result in linear memory —
    the bump-allocator capability (PMAT-993, PMAT-986 slice 2).

    Layer 5 of the xpile contract taxonomy (compile-time / IR), a strict
    EXTENSION of `C-COMPILE-RUST-TO-WASM`. That contract governs scalar /
    control / read-only-aggregate emission (incl. read-only string access —
    a `str` param + `len(s)` + `ord(s[i])`, PMAT-986 slice 1); this one adds
    the NEW capability of constructing strings in a bump heap. `xs[i]` /
    `len(s)` / `ord(s[i])` stay under `C-COMPILE-RUST-TO-WASM` (no
    allocation); a string MATERIALISATION (`Concat`, `Chr`, a `str` return)
    is the C-WASM-HEAP capability.

    The allocator is a linear-memory **bump heap**: a mutable
    `(global $__heap_ptr (mut i32))` initialised past the static `(data)`
    region (at `__HEAP_BASE` = 1024) and an `$__alloc(n) -> i32` that returns
    the current bump pointer and advances it `align8(n)` (8-byte aligned).
    Bump-only — NO free (slice-2 scope; the enabling primitive, not a
    general allocator) — and NO `memory.grow` (the module pre-sizes one
    64-KiB page; an over-large heap traps rather than corrupting). A
    constructed string is the SAME length-prefixed ABI the read path uses
    (an `i32` byte-count header at `base+0`, the UTF-8 bytes at `base+8`),
    so a heap string composes uniformly with a str param under `len` and
    byte-copy.

    String construction is ASCII-bounded for `chr(n)` (the byte `n & 0xFF`,
    exact for `0 ≤ n < 128`; multi-byte UTF-8 is a follow-up) — the same
    honest restriction the slice-1 `ord(s[i])` carries.

    PMAT-994 (slice 3a) extends string support to substantial completeness:
      * string LITERALS (`Expr::LitStr`, e.g. `"Hello, "`) are materialised at
        EMIT time into static `(data …)` segments laid down in `[LITERAL_BASE,
        HEAP_BASE)` (= [512, 1024), 8-aligned, deduplicated, length-prefixed),
        and a `LitStr` lowers to a constant `i32.const <base>` — so `"Hi " +
        name`, `return "done"`, and literal args all work, the literal pointer
        composing uniformly with the concat heap path. The literal region is
        EMITTER-OWNED and sits BELOW the bump heap so the two never overlap; a
        module whose literals overflow `HEAP_BASE` is REFUSED (an honest
        out-of-room error, never an aliasing miscompile);
      * `s[i]` as a 1-char string (`Expr::StrCharAt` outside `ord`) materialises
        a NEW 1-char heap string (the `chr` mirror — `$__alloc(9)`, a count-1
        header, a bounds-checked `i32.load8_u`/`i32.store8` of byte `i`);
      * string content EQUALITY `a == b` / `a != b` lowers to `$__wasm_str_eq`
        (a length check + a byte-compare loop → i32 bool) — REAL string-content
        logic, NEVER a base-pointer compare — correct for params, literals, and
        heap strings (all share the length-prefixed ABI);
      * a string SLICE `s[lo:hi]` (PMAT-1058, `Expr::Slice` of_str/unstepped)
        materialises a NEW heap SUBSTRING via `$__wasm_str_slice` — a CHAR-exact
        walk (a multi-byte code point copied whole, never split) with full
        Python clamp semantics (negative-bound normalise, clamp to `[0, len]`,
        `hi = max(hi, lo)`, missing bound → `0` / `len`) that never traps on an
        out-of-range bound;
      * string ORDERING `a < b` / `a <= b` / `a > b` / `a >= b` (PMAT-1059)
        lowers to `$__wasm_str_cmp` — a byte-wise lexicographic 3-way compare
        (`min(len)` unsigned byte compares, then shorter-is-less), the result
        tested against 0 with the matching signed op. Byte order == code-point
        order for UTF-8, so this IS Python's str ordering, NEVER a base-pointer
        compare and correct across multi-byte code points.
    Still REFUSED with a hard error rather than miscompiled (a Lean-style honest
    refusal): STEPPED / list slicing, `str(x)`/`repr(x)`, f-strings, string
    methods.
  xpile:
    layer: compile
  references:
    - "WebAssembly Core Specification 2.0 — W3C (linear memory, globals)"
    - "WebAssembly bulk-memory operations — `memory.copy`"
    - "WebAssembly Text Format (WAT) — the `(global …)` / `(memory …)` forms"
    - "WABT — wat2wasm / wasm-interp (executed string-building witness toolchain)"
    - contracts/compile-rust-to-wasm-v1.yaml
    - contracts/xpile-backend-trait-v1.yaml
    - docs/specifications/sub/backend-trait.md
  depends_on:
    - C-COMPILE-RUST-TO-WASM
    - C-XPILE-BACKEND-TRAIT

compile_targets:
  - target: wasm
    hardware: null
    via:
      - xpile-wasm-codegen
    backend_crate: xpile-wasm-codegen
    # PMAT-993 (2026-06-25, PMAT-986 slice 2): the string-RETURNING half of
    # the native WASM emit lane. The bump allocator (`$__heap_ptr` global +
    # `$__alloc`) and the first two string-constructing ops — concat `a + b`
    # (Expr::Concat) and `chr(n)` (Expr::Chr) — materialise a length-prefixed
    # string in linear memory and a `str` return now lowers to an `i32`
    # heap-pointer result. The emitted WAT is genuine: the PMAT-993 slice ran
    # it through WABT (wat2wasm assembles it; `wasm-interp --run-all-exports`
    # executes a self-contained driver that preloads two input strings, calls
    # the lowered `join(a, b) = a + b`, and reads the CONSTRUCTED string's
    # bytes back) and confirmed the result value-matches the CPython `a + b`
    # for the ASCII fixture "Hi " + "WASM 42!". Gated on
    # `wasm_runtime_available()` (graceful-skip on free CI, which lacks WABT).
    # RUNTIME CHOICE: WABT subprocess — NO new Cargo dependency (no
    # wasmi/wasmtime), so `cargo deny check advisories` is unaffected.
    #
    # PMAT-994 (2026-06-25, PMAT-986 slice 3a): string support is substantially
    # complete. String LITERALS (Expr::LitStr) become static (data) segments in
    # [LITERAL_BASE=512, HEAP_BASE=1024) (a LitStr lowers to a constant
    # i32.const <base>); `s[i]` as a 1-char string (Expr::StrCharAt outside ord)
    # materialises a new 1-char heap string; and string content equality
    # (a == b / a != b) lowers to a $__wasm_str_eq content-compare helper. The
    # emitted WAT is genuine: the PMAT-994 slice ran it through WABT — the
    # `greet(name) = "Hello, " + name + "!"` literal program executes to
    # "Hello, WASM!" (value-matching CPython), `is_done(s) = (s == "done")`
    # executes to True/False/False over "done"/"busy"/"don", and `at(s, i) =
    # s[i]` executes to the 1-char string "S" for "WASM"[2]. See the
    # `literal_string_witness` integration test.
    #
    # PMAT-995 (2026-06-25, PMAT-986 slice 3b): the FIRST associative
    # collections — dict[int|str, int] and set[int|str] — as bump-heap open
    # assoc-arrays. Layout: an 8-byte header (i32 live count @ base+0 — the
    # same +0 count header len() reads — + i32 capacity @ base+4), then
    # `capacity` fixed 16-byte entries from base+8 (key @ entry+0: an i64 int
    # key or the i32 string base-pointer for a str key; value @ entry+8: an
    # i64, a dummy for a set). Three helpers per key kind do a LINEAR scan:
    # $__wasm_dict_get_<k> (d[k]; TRAPS via `unreachable` on an absent key —
    # the KeyError analogue, mirroring the list-index bounds trap),
    # _has_<k> (k in d / x in s → 0/1), _set_<k> (d[k]=v / s.add(e):
    # update-or-insert, TRAPS at capacity). <k> is `i` for int keys (i64.eq)
    # or `s` for str keys ($__wasm_str_eq CONTENT compare over stored string
    # pointers — a str key reuses the PMAT-994 literal (data) table + the
    # content-equality helper). The emitted WAT is genuine: the PMAT-995 slice
    # ran it through WABT — int + str dict get/len/membership and int-set
    # membership/len all execute value-matching CPython (d[2]=20, len=3,
    # 2 in d=1, 9 in d=0, d["y"]=200, "z" in d=0), and `d[9]` (absent key)
    # TRAPS (`unreachable executed`) as CPython raises KeyError. See the
    # `heap_dict_witness` integration test. Refused honestly: a non-int/str
    # key type, a non-int value, dict/set comprehensions, iteration.
    #
    # PMAT-996 (2026-07-01, slice 4): PLAIN-DATA STRUCTS (@dataclass/class). A
    # struct instance is a bump-heap record with NO header — field i (definition
    # order) at base+i*8, a uniform 8-byte slot (an i32/f32/bool field uses the
    # low 4 bytes). StructLit (Name(f=v,…)) $__alloc's n_fields*8 + writes each
    # field (matched by NAME, so arg order is irrelevant); FieldAccess (obj.field)
    # loads at the field offset. A struct LOCAL and a struct PARAM both ride an
    # i32 base-pointer; a struct DEFINITION emits no WAT (pure layout). WABT-
    # executed (tests/heap_struct_witness.rs): Point(3,4).x+.y=7, reversed
    # Point(y=10,x=3).x=3, Rec(5,2.5).f=2.5, a struct-param p.x+p.y=42 — all ==
    # CPython. Refused honestly: a non-scalar field, a struct RETURN, a method call.
    #
    # PMAT-1126 (2026-07-03): the FIRST two string METHODS on the WASM lane —
    # s.startswith(p) / s.endswith(p) (Expr::StrMethod, op StartsWith / EndsWith).
    # Each lowers to a non-allocating BYTE prefix/suffix compare
    # ($__wasm_str_startswith / $__wasm_str_endswith): a len-guarded i32.load8_u
    # loop over the length-prefixed payload, returning an i32 bool. Byte
    # prefix/suffix == code-point prefix/suffix for valid UTF-8 (the needle's
    # first byte is a lead byte, so a byte match lands on a char boundary — no
    # split multi-byte char, no false positive on a shared continuation byte),
    # mirroring the $__wasm_str_cmp "byte order == code-point order" rationale;
    # like it, allocates NOTHING (a bool, not a new string). The emitted WAT is
    # genuine: the PMAT-1126 slice ran it through WABT — 34 (case × op) pairs
    # (ASCII + prefix/suffix/equal/longer-than/empty + MULTI-BYTE é/© fixtures)
    # execute value-matching CPython, incl. "héllo".startswith("h©")=False on a
    # shared 0xA9 and "héllo".endswith("éllo")=True on a char-boundary suffix
    # offset. See the `str_prefix_witness` integration test. Each helper is gated
    # separately (no dead helper). Refused honestly: any OTHER string method
    # (upper/lower/strip/split/replace/find/…) and a non-str operand.

equations:
  wasm_heap_alloc_structure_extensionality_diamond:
    # Tier-defining Diamond equation (depth-1). Machine-checked by the
    # lake-build pilot — see contracts/lean/WasmHeap.lean. A bump-heap
    # allocation is determined by its structural fields (base address,
    # requested byte size), mirroring the str/list/float/set/wgsl/wasm
    # structural Diamonds.
    lean_theorem: "XpileContracts.CWasmHeap.wasm_heap_alloc_structure_extensionality_diamond"
    lean_file: "contracts/lean/WasmHeap.lean"
    formula: |
      ∀ a b : WasmAlloc.
        a.base = b.base → a.size = b.size → a = b
      (a bump-heap allocation is determined by its (base, size) signature)
    domain: |
      Any bump-heap allocation as `$__alloc` produces it, modelled by its
      returned `base` address and the requested `size` (in bytes).
    invariants:
      - "FIRST Diamond-tier theorem of C-WASM-HEAP (registers it at depth-1)"
      - "structure extensionality over the allocation's (base, size) signature (sorry-free, core-only)"
      - "the bump pointer advances monotonically (8-aligned) — execution-stratum, EXECUTED via the WABT string-building witness (PMAT-993)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "the function performs a string-RETURNING op (Concat / Chr / str return)"
    postconditions:
      - "heap-allocating WASM-emitting code carries citation C-WASM-HEAP"

  heap_string_is_length_prefixed:
    formula: |
      construct(string_returning_op, BackendConfig{target: Wasm})
        produces wat that calls $__alloc and writes an i32 byte-count header
        at base+0 followed by the UTF-8 bytes at base+8 (the same
        length-prefixed ABI read access uses), returning base as an i32
    domain: |
      A string concatenation `a + b` (Expr::Concat) over str params / literals
      / chr / s[i] results, `chr(n)` (Expr::Chr), or `s[i]` as a 1-char string
      (Expr::StrCharAt outside ord), in a function lowered to WAT.
    invariants:
      - "a string is materialised via $__alloc (the bump heap), never on the call stack"
      - "the result is a length-prefixed region (i32 count @ base+0, bytes @ base+8)"
      - "concat copies operand bytes via memory.copy; left-nested concat allocs ONCE"
      - "PMAT-998/1000: a concat holds BOTH its DESTINATION pointer ($__wasm_concat_dst) AND its running WRITE-OFFSET ($__wasm_concat_off) in DEDICATED locals distinct from the operand scratches ($__wasm_str_dst / $__wasm_str_la), so an operand that is ITSELF a string-returning op — chr(n) (uses $__wasm_str_dst) or s[i] (uses $__wasm_str_la) — cannot CLOBBER the concat's destination OR offset. `chr(65)+chr(66)` builds `AB` (not the last-operand collapse `B`, PMAT-998) and `\"AB\"[0]+\"CD\"[1]` builds `AD` (not garbage from a clobbered offset, PMAT-1000). Found by the PMAT-998 adversarial CPython-differential sweep + a gap-probe."
      - "chr(n) writes the byte n & 0xFF (ASCII-bounded, the ord mirror)"
      - "s[i] as a string allocs(9), a count-1 header, a bounds-checked load8_u/store8 of byte i (PMAT-994)"
      - "a str return lowers to an i32 result (the heap base-pointer)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "operands are str params / literals / chr / s[i] results (string-valued)"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) and executes (wasm-interp) to a string value-matching CPython on an ASCII fixture"
      - "heap-allocating WASM-emitting code carries citation C-WASM-HEAP"

  string_literal_is_static_data:
    # PMAT-994 (slice 3a): a string LITERAL is materialised at EMIT time, not on
    # the heap — a static (data) segment in [LITERAL_BASE, HEAP_BASE), and a
    # LitStr lowers to a constant i32.const <base> pointer.
    formula: |
      construct(LitStr(s), BackendConfig{target: Wasm})
        emits a static (data (i32.const base) <i32 len header>) +
        (data (i32.const base+8) <UTF-8 bytes>) in [LITERAL_BASE, HEAP_BASE),
        and lowers the LitStr to `i32.const base` — the same length-prefixed ABI
        a str param / heap string uses. String content equality (a == b / a != b)
        lowers to a $__wasm_str_eq content-compare (length check + byte loop),
        NEVER a base-pointer i32.eq.
    domain: |
      A string literal operand (Expr::LitStr) anywhere in a function body, and a
      string `==`/`!=` (Expr::BinOp Eq/NotEq) over string-valued operands.
    invariants:
      - "each distinct literal is a deduplicated, 8-aligned, length-prefixed (data) segment below HEAP_BASE"
      - "a LitStr lowers to a constant i32.const <base> (a static base-pointer)"
      - "literals never alias the bump heap; an overflow of [LITERAL_BASE, HEAP_BASE) is REFUSED"
      - "string equality is a CONTENT compare ($__wasm_str_eq), never a base-pointer compare"
      - "a != b is the content compare negated (i32.eqz)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
    postconditions:
      - "the emitted WAT assembles + executes to a string / bool value-matching CPython on an ASCII fixture"
      - "the literal/equality WASM-emitting code carries the WASM citation"

  string_slice_is_charexact_substring:
    # PMAT-1058: a string slice `s[lo:hi]` (unstepped) materialises a NEW
    # heap SUBSTRING — the CHARACTERS in [lo, hi), never a byte slice that
    # could split a multi-byte code point. Same length-prefixed ABI as every
    # other string, so it composes with len / Concat / equality / a str return.
    formula: |
      construct(Slice{collection, lo, hi, of_str: true, step: None},
                BackendConfig{target: Wasm})
        emits `<base> <lo:i64> <hi:i64> call $__wasm_str_slice`, where
        $__wasm_str_slice normalises the CHARACTER bounds with full Python
        semantics (a negative bound += charlen; both CLAMP to [0, charlen];
        hi = max(hi, lo)), then two UTF-8 char-walks from base+8 find the byte
        offsets of chars lo and hi, and $__alloc(8 + (endoff-startoff)) + a
        header store + memory.copy build the substring. A missing `lo` lowers
        to 0, a missing `hi` to i64::MAX (clamped to charlen). The result is a
        fresh length-prefixed heap string. A LIST slice (of_str: false) and a
        STEPPED string slice (step != None, incl. the s[::-1] reverse) REFUSE.
    domain: |
      A string slice expression `s[lo:hi]` (Expr::Slice with of_str: true,
      step: None) — bounds are optional i64 CHARACTER indices (any int-valued
      expression). Reached in a value position and in a string position (a str
      return / a concat operand). A list slice or stepped string slice is out
      of subset and refused with a precise diagnostic (never wrong WAT).
    invariants:
      - "the slice indexes by CHARACTERS (code points), not bytes — a multi-byte char is copied whole, never split"
      - "out-of-range slice bounds CLAMP to [0, charlen] and never trap (unlike s[i], which traps on IndexError)"
      - "a negative bound is normalised Python-style (+= charlen) before clamping; hi is raised to lo (empty slice, never a negative length)"
      - "the result is a fresh $__alloc'd length-prefixed heap string (i32 byte-count header @ base+0, UTF-8 bytes @ base+8)"
      - "a missing lo defaults to 0, a missing hi to charlen (passed as i64::MAX, clamped)"
      - "a stepped string slice / a list slice is REFUSED (loud diagnostic), never emitted as wrong WAT"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) and executes (wasm-interp) to a substring value-matching CPython, including on a MULTI-BYTE fixture (s[1:4] over 'abécd' == 'béc')"
      - "the slice WASM-emitting code carries the WASM citation"

  dict_set_is_length_prefixed_assoc_array:
    # PMAT-995 (slice 3b): a dict[int|str, int] / set[int|str] is a bump-heap
    # open assoc-array. The entry-array layout facts (contiguity, disjointness,
    # value-fits) are machine-checked in contracts/lean/WasmHeap.lean
    # (dict_entries_contiguous / dict_entries_disjoint / dict_value_fits_in_entry,
    # core-only, sorry-free) — they strengthen the C-WASM-HEAP tier under the
    # existing structural Diamond.
    formula: |
      construct(dict/set build + d[k] / (k in d) / len(d),
                BackendConfig{target: Wasm})
        produces wat that $__alloc's an 8-byte header (i32 count @ base+0,
        i32 capacity @ base+4) + `capacity` fixed 16-byte entries from base+8
        (key @ entry+0, value @ entry+8), and reads it via a LINEAR-scan helper
        $__wasm_dict_{get,has,set}_<i|s> — get TRAPS (`unreachable`) on an absent
        key (the KeyError analogue), a str key compares by CONTENT via
        $__wasm_str_eq. The i32 count @ base+0 is the same header len() reads.
    domain: |
      A dict/set LOCAL built from a DictLit / SetLit (Expr::DictLit /
      Expr::SetLit bound at a `Type::Dict(K,_)` / `Type::Set(K)` let), and
      d[k] (Expr::DictGet), `k in d` / `x in s` (Expr::DictContains /
      Expr::SetContains), len(d) over it. Keys are int (i64) or str (i32
      content-compared); values are int. `d[k]=v` (Stmt::DictSet) update-or-inserts.
    invariants:
      - "the entry array is $__alloc'd (bump heap): 8-byte header + capacity*16-byte entries"
      - "entry i is at base+8+i*16; key @ +0, value @ +8 (machine-checked contiguous + disjoint in WasmHeap.lean)"
      - "d[k] over an absent key TRAPS (`unreachable`) — the KeyError analogue, never a wrong value"
      - "a DUPLICATE literal key/elem COLLAPSES: a dict keeps the LAST value, a set dedups, and the live count is the DISTINCT count — the literal is built via update-or-insert (`$__wasm_dict_set`), matching CPython {1:10,1:20}=={1:20} (len 1) and {5,5,6} (len 2), NOT a blind sequential write that keeps both"
      - "a str key is compared by CONTENT ($__wasm_str_eq over the literal (data) table), never a base-pointer compare"
      - "len(d)/len(s) reads the i32 count @ base+0 — the same header the list/str len path reads"
      - "PMAT-999: a dict/set GROWS past its initial capacity (literal_count + DICT_GROWTH_SLACK=16). On an insert at count>=capacity, $__wasm_dict_set bump-allocs a 2x region, memory.copy's the header + entries, sets the new capacity, and RETURNS the relocated base-pointer — which the caller (d[k]=v / s.add / the literal-construction loop) local.set's back into the dict/set local. So a set/dict grown in a loop matches CPython's unbounded growth (up to the one 64-KiB page; a genuine OOM still traps via $__alloc, the honest ceiling). Doubling amortises the copies. (This retires the earlier fixed-capacity fail-loud trap.)"
      - "a non-int/str key type, a non-int value, comprehensions + iteration are REFUSED honestly"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "the dict/set key types as int or str; the value as int"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) + executes (wasm-interp) to values matching CPython (get/len/membership), and TRAPS on an absent-key get"
      - "the dict/set WASM-emitting code carries the WASM citation"

  struct_is_flat_field_slot_record:
    # PMAT-996 (slice 4): a plain-data struct (@dataclass/class) is a bump-heap
    # record with NO header — field i (definition order) at base+i*8, a uniform
    # 8-byte slot. The field-slot layout facts (contiguity, disjointness) are
    # machine-checked in contracts/lean/WasmHeap.lean (struct_fields_contiguous /
    # struct_fields_disjoint, core-only, sorry-free).
    formula: |
      construct(StructLit(Name, fields) + obj.field,
                BackendConfig{target: Wasm})
        produces wat that $__alloc's n_fields*8 bytes, writes each field into its
        8-byte slot (field i @ base+i*8 in DEFINITION order, via {ty}.store), and
        reads a field via {ty}.load offset=i*8. A struct LOCAL and a struct PARAM
        both ride an i32 base-pointer. The struct DEFINITION emits no WAT (pure
        layout).
    domain: |
      A plain-data struct built from a StructLit (Expr::StructLit) bound at a
      Type::Struct let / passed as a Type::Struct param, and its field reads
      (Expr::FieldAccess obj.field). Fields are SCALARS (i64/i32/f64/f32/bool).
    invariants:
      - "a struct instance is $__alloc'd (bump heap): n_fields * 8 bytes, no header"
      - "field i is at base+i*8 in DEFINITION order; the literal's arg order is irrelevant (fields matched by NAME) — machine-checked contiguous + disjoint in WasmHeap.lean"
      - "a field's WAT type drives its store/load ({ty}.store / {ty}.load offset=i*8); an i32/f32/bool field uses the slot's low 4 bytes"
      - "a struct DEFINITION emits no WAT symbol (it is pure layout)"
      - "a non-scalar field (str/list/dict/set/nested-struct), a struct RETURN, and a method CALL are REFUSED honestly"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "every struct field types as a scalar (i64/i32/f64/f32/bool)"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) + executes (wasm-interp) to field values matching CPython"
      - "the struct WASM-emitting code carries the WASM citation"

  string_ordering_is_lexicographic:
    # PMAT-1059: string ORDERING `a < b` / `a <= b` / `a > b` / `a >= b` lowers
    # to a byte-wise lexicographic 3-way compare ($__wasm_str_cmp). UTF-8 is
    # designed so byte-lexicographic order == code-point-lexicographic order, so
    # a plain byte compare over the length-prefixed payload reproduces CPython's
    # code-point ordering EXACTLY — no char walk (unlike len/index/slice).
    formula: |
      construct(BinOp{op ∈ {Lt, LtEq, Gt, GtEq}, lhs, rhs} over str operands,
                BackendConfig{target: Wasm})
        emits `<lhs> <rhs> call $__wasm_str_cmp  i32.const 0  <signed cmp>`,
        where $__wasm_str_cmp does an UNSIGNED byte compare over min(len(a),
        len(b)) bytes from base+8 (returning a[i]-b[i] at the first differing
        byte) then shorter-is-less (len(a)-len(b)) → i32 <0/0/>0, and the signed
        cmp is i32.{lt,le,gt,ge}_s against 0. NEVER a base-pointer i32 compare.
    domain: |
      A string ordering `a < b` / `a <= b` / `a > b` / `a >= b` (Expr::BinOp
      with op in {Lt, LtEq, Gt, GtEq}) over two string-valued operands (a LitStr
      / Concat / Chr / bare StrCharAt, a str-name Ident, or a str-returning
      call). A mixed `str <op> non-str` is REFUSED (never a wrong compare).
    invariants:
      - "the compare is byte-wise UNSIGNED (i32.load8_u) — UTF-8 byte order == code-point order, so it IS Python's str ordering even across multi-byte code points (a signed read would mis-order a lead byte >= 0x80)"
      - "a common prefix falls to shorter-is-less (len(a)-len(b)), matching Python ('app' < 'apple')"
      - "the 3-way result is tested against 0 with the matching signed op (lt_s/le_s/gt_s/ge_s) — never a base-pointer compare"
      - "$__wasm_str_cmp reads linear memory but allocates NOTHING (independent of the bump-heap gate; a pure-ordering module carries no $__alloc)"
      - "a `str <op> non-str` mixed comparison is REFUSED honestly"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "both operands type as str"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) + executes (wasm-interp) to a bool value-matching CPython, including on MULTI-BYTE fixtures ('abé' > 'abz', 'café' > 'cafe')"
      - "the ordering WASM-emitting code carries the WASM citation"

  int_to_str_is_decimal_ascii:
    # PMAT-1060: `str(int)` / `repr(int)` (Expr::ToStr{of_float: false}) lowers to
    # $__wasm_int_to_str — the FIRST string op that manufactures a string from a
    # NON-string value. Works in the UNSIGNED magnitude so i64::MIN converts
    # without an overflow on the negation; every digit is 1-byte ASCII so the
    # byte-count header equals the Python CHAR count.
    formula: |
      construct(ToStr{value, of_float: false} over an i64 value,
                BackendConfig{target: Wasm})
        emits `<value:i64> call $__wasm_int_to_str`, where $__wasm_int_to_str
        computes neg = value < 0, mag = neg ? (0 - value) : value  [the WRAPPING
        i64 sub, correct u64 magnitude for i64::MIN], counts the decimal digits
        of mag (>= 1), $__alloc(8 + digits + neg), stores the i32 BYTE-count
        header, writes '-' (45) when neg, and fills digits from the
        least-significant end backward (48 + mag%10 via i64.rem_u/div_u).
    domain: |
      A `str(n)` / `repr(n)` (Expr::ToStr{of_float: false}) whose operand lowers
      to an i64 (Python int). str(float) (of_float: true) is REFUSED, and a bool
      (i32) / str (pointer) operand is REFUSED by the operand type check (never a
      wrong conversion).
    invariants:
      - "the conversion works in the UNSIGNED magnitude (i64.div_u/rem_u), so i64::MIN = -9223372036854775808 converts exactly where a naive `0 - n` negation would overflow"
      - "at least one digit is always emitted, so str(0) == '0' (not the empty string)"
      - "a negative value gets a single leading '-' (45); a non-negative value none"
      - "every digit is 1-byte ASCII, so the i32 byte-count header EQUALS the Python char count — the result composes with len/Concat/equality/a str RETURN"
      - "$__wasm_int_to_str calls $__alloc (rides the bump-heap gate); the module carries the allocator + (memory) whenever str(int) is used"
      - "str(float)/repr(float) and str(bool)/str(str) are REFUSED honestly (no silent miscompile)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "the ToStr operand types as int (i64) and of_float is false"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) + executes (wasm-interp) to a string value-matching CPython str(n), including str(0)='0', the sign cases, and the i64::MIN/MAX magnitude boundaries"
      - "the int→str WASM-emitting code carries the WASM citation"

  string_startswith_endswith_is_byte_prefix:
    # PMAT-1126: `s.startswith(p)` / `s.endswith(p)` (Expr::StrMethod with op
    # StartsWith / EndsWith) lower to $__wasm_str_startswith / $__wasm_str_endswith
    # — non-allocating BYTE prefix/suffix compares. Like $__wasm_str_cmp they read
    # linear memory but allocate nothing. A byte prefix/suffix compare IS a
    # code-point prefix/suffix compare for valid UTF-8, so it reproduces CPython's
    # predicate EXACTLY with no char walk.
    formula: |
      construct(StrMethod{recv, op ∈ {StartsWith, EndsWith}, args: [needle]}
                over str operands, BackendConfig{target: Wasm})
        emits `<recv> <needle> call $__wasm_str_<startswith|endswith>`, where the
        helper loads both i32 byte-count headers; returns 0 if len(needle) >
        len(recv); else compares len(needle) bytes — from recv+8 (startswith) or
        recv+8+(len(recv)-len(needle)) (endswith) — against needle+8, returning
        0 on the first mismatch and 1 if all match. The result is an i32 bool.
        NEVER a base-pointer compare.
    domain: |
      A Python string predicate `s.startswith(p)` / `s.endswith(p)`
      (Expr::StrMethod, op StartsWith / EndsWith, exactly one str arg) over two
      string-valued operands (a str-name Ident, a LitStr, a Concat / Chr / bare
      StrCharAt / slice / str-returning call). A non-str operand is REFUSED by
      emit_str_expr (an honest type mismatch). Any OTHER string method
      (upper/lower/strip/split/replace/find/…) stays REFUSED.
    invariants:
      - "the compare is byte-wise (i32.load8_u) over the length-prefixed payload — byte prefix/suffix == code-point prefix/suffix for valid UTF-8 (needle[0] is a LEAD byte, so a byte match lands on a char boundary in the haystack: no split multi-byte char, no false positive on a SHARED continuation byte)"
      - "a needle LONGER than the haystack returns 0 immediately (len(p) > len(s) short-circuit); the endswith start offset len(s)-len(p) is therefore >= 0"
      - "an EMPTY needle returns 1 ('abc'.startswith('')=='abc'.endswith('')==True) — the compare loop never runs"
      - "the result is an i32 bool, NEVER a base-pointer compare of the two str pointers"
      - "$__wasm_str_startswith / $__wasm_str_endswith read linear memory but allocate NOTHING (independent of the bump-heap gate; a pure-predicate module carries no $__alloc); each helper is gated separately (a startswith-only module carries no endswith helper)"
      - "any string method other than CharCount / StartsWith / EndsWith is REFUSED honestly (no silent miscompile)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "the receiver and the single arg both type as str"
    postconditions:
      - "the emitted WAT assembles (wat2wasm) + executes (wasm-interp) to a bool value-matching CPython, INCLUDING MULTI-BYTE fixtures ('héllo'.startswith('hé')==True, 'héllo'.startswith('h©')==False on a shared 0xA9, 'héllo'.endswith('éllo')==True)"
      - "the startswith/endswith WASM-emitting code carries the WASM citation"

  unwired_string_op_is_refused:
    formula: |
      construct(slice_stepped | list_slice | str(float) | fstring |
                str_method∉{CharCount,StartsWith,EndsWith},
                BackendConfig{target: Wasm})
        == Err(BackendError::Lower("…"))
    domain: |
      A string op still outside the WASM string subset: a STEPPED string slice
      or a list slice, str(float)/repr(float), an f-string, a string method
      OTHER than len (CharCount) / startswith / endswith.
      (String ORDERING is supported — see `string_ordering_is_lexicographic`;
      str(int)/repr(int) is supported — see `int_to_str_is_decimal_ascii`;
      startswith/endswith are supported — see
      `string_startswith_endswith_is_byte_prefix`.)
    invariants:
      - "an unwired string op yields a hard BackendError, never wrong WAT"
      - "the refusal names the op + the follow-up (honest diagnostic)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
    postconditions:
      - "no WAT is emitted for an unwired string op (no silent miscompile)"

proof_obligations:
  - type: postcondition
    property: a constructed string is a well-formed length-prefixed WASM region
    formal: "wasm-interp(construct(a + b)) reads back == CPython(a + b)"
    applies_to: heap_string_is_length_prefixed

  - type: postcondition
    property: a string literal is a well-formed static (data) region, equality is a content compare
    formal: "wasm-interp(construct('Hi ' + s)) == CPython AND wasm-interp(construct(s == 'done')) == CPython"
    applies_to: string_literal_is_static_data

  - type: postcondition
    property: a dict/set is a well-formed bump-heap assoc-array; get/len/membership match CPython and an absent-key get traps
    formal: "wasm-interp(construct(d[k]/len(d)/(k in d))) == CPython AND wasm-interp(construct(d[absent])) traps"
    applies_to: dict_set_is_length_prefixed_assoc_array

  - type: postcondition
    property: a struct is a well-formed flat field-slot record; field reads match CPython
    formal: "wasm-interp(construct(Point(x,y); p.x + p.y)) == CPython"
    applies_to: struct_is_flat_field_slot_record

  - type: postcondition
    property: string ordering is a lexicographic byte compare; results match CPython on multi-byte fixtures
    formal: "wasm-interp(construct(a < b)) == CPython(a < b) AND wasm-interp(construct('abé' > 'abz')) == True"
    applies_to: string_ordering_is_lexicographic

  - type: postcondition
    property: str(int) is a decimal-ASCII heap string; results match CPython incl. zero, sign, and the i64::MIN overflow boundary
    formal: "wasm-interp(construct(str(n))) == CPython(str(n)) AND wasm-interp(construct(str(-9223372036854775808))) == '-9223372036854775808'"
    applies_to: int_to_str_is_decimal_ascii

  - type: postcondition
    property: string startswith/endswith are byte prefix/suffix compares; results match CPython on multi-byte fixtures
    formal: "wasm-interp(construct(s.startswith(p))) == CPython AND wasm-interp(construct('héllo'.startswith('h©'))) == False"
    applies_to: string_startswith_endswith_is_byte_prefix

  - type: postcondition
    property: unwired string ops are refused, never miscompiled
    formal: "construct(unwired_string_op) == Err(_)"
    applies_to: unwired_string_op_is_refused

  - type: invariant
    property: the bump pointer advances monotonically and 8-aligned
    formal: "after __alloc(n): __heap_ptr' = base + align8(n) ∧ base = __heap_ptr"
    applies_to: wasm_heap_alloc_structure_extensionality_diamond

  - type: frame
    property: lower() does not mutate the input meta-HIR module
    formal: "modifies() == ∅"
    applies_to: all

  - type: precondition
    property: backend citation is recorded
    formal: "Artifact.citations contains C-COMPILE-RUST-TO-WASM (the lane carries the WASM citation)"
    applies_to: all

falsification_tests:
  - id: FALSIFY-WASM-HEAP-001
    rule: |
      A constructed string (concat / chr) MUST be a well-formed length-prefixed
      region in linear memory — the i32 byte-count header at base+0 then the
      bytes at base+8 — that assembles via wat2wasm and, when executed, reads
      back byte-for-byte equal to the CPython result on an ASCII fixture.
    prediction: |
      The executed WABT witness reconstructs the concatenated string and it
      equals CPython `a + b`.
    test: |
      cargo test -p xpile-wasm-codegen --test heap_string_witness
    if_fails: |
      The allocator or concat lowering regressed — a wrong header length, a
      bad memory.copy offset, an aliasing scratch local, or a misaligned bump
      pointer. The constructed bytes diverge from CPython.
    ship_blocking: true
    counter_example_classes:
      - wrong_header_length
      - memory_copy_offset_drift
      - scratch_local_aliasing
      - bump_pointer_misalignment

  - id: FALSIFY-WASM-HEAP-002
    rule: |
      A string op still outside the WASM string subset (a STEPPED / list slice,
      str(), f-strings, string methods) MUST be refused with a hard error, NEVER
      emitted as wrong WAT. (PMAT-994 wired literals, `s[i]` as a string, and
      content equality `==`/`!=`; PMAT-1058 slicing; PMAT-1059 ordering `<`/
      `<=`/`>`/`>=`; those are no longer refused.)
    prediction: |
      `lower` returns `Err(BackendError::Lower(...))` naming the op + follow-up.
    test: |
      cargo test -p xpile-wasm-codegen --lib
    if_fails: |
      The emitter silently emitted (wrong) code for an unwired string op — a
      correctness violation worse than a refusal.
    ship_blocking: true
    counter_example_classes:
      - silent_miscompile_of_unwired_string_op
      - pointer_arithmetic_passed_off_as_concat
      - base_pointer_compare_passed_off_as_string_equality

  - id: FALSIFY-WASM-HEAP-003
    rule: |
      PMAT-994: a string LITERAL MUST become a well-formed static (data) segment
      in [LITERAL_BASE, HEAP_BASE) (a length-prefixed region the same shape a str
      param uses) that assembles via wat2wasm and, when executed in a literal
      program (`"Hello, " + name + "!"`), reads back byte-for-byte equal to the
      CPython result on an ASCII fixture. String content equality MUST be a real
      $__wasm_str_eq compare value-matching CPython, never a base-pointer compare.
    prediction: |
      The executed WABT witness reconstructs "Hello, WASM!" (== CPython) and
      `is_done(s) = (s == "done")` yields True/False matching CPython.
    test: |
      cargo test -p xpile-wasm-codegen --test literal_string_witness
    if_fails: |
      The literal (data) layout, the LitStr pointer lowering, the literal/heap
      overlap guard, or the content-compare helper regressed — a wrong literal
      offset, an aliased heap, or a base-pointer compare. The constructed string
      / equality result diverges from CPython.
    ship_blocking: true
    counter_example_classes:
      - wrong_literal_data_offset
      - literal_heap_aliasing
      - base_pointer_compare_passed_off_as_string_equality

  - id: FALSIFY-WASM-HEAP-004
    rule: |
      PMAT-995: a dict[int|str, int] / set[int|str] MUST be a well-formed
      bump-heap open assoc-array — an 8-byte header (i32 count @ base+0, i32
      capacity @ base+4) then 16-byte entries from base+8 — whose get/len/
      membership assemble via wat2wasm and, when executed, VALUE-MATCH CPython
      on int AND str keys; and `d[k]` on an ABSENT key MUST TRAP (`unreachable
      executed`), never return a value (the KeyError analogue). A str key MUST
      compare by CONTENT ($__wasm_str_eq), never by base-pointer.
    prediction: |
      The executed WABT witness reads d[2]=20, len(d)=3, 2 in d=1, 9 in d=0,
      d["y"]=200, "z" in d=0 (all == CPython); `d[9]` TRAPS.
    test: |
      cargo test -p xpile-wasm-codegen --test heap_dict_witness
    if_fails: |
      The entry layout (stride, header, key/value offsets), the linear-scan
      helper, the absent-key trap, or the str-key content compare regressed —
      a wrong entry offset, an aliased neighbour, a missing trap, or a
      base-pointer key compare. The executed values diverge from CPython.
    ship_blocking: true
    counter_example_classes:
      - wrong_entry_stride_or_offset
      - absent_key_returns_value_instead_of_trapping
      - base_pointer_key_compare_passed_off_as_content
      - len_reads_wrong_header
      - duplicate_literal_key_kept_both_entries

  - id: FALSIFY-WASM-HEAP-005
    rule: |
      PMAT-996: a plain-data struct MUST be a well-formed flat field-slot record
      — field i (definition order) at base+i*8, no header — whose StructLit
      construction + FieldAccess reads assemble via wat2wasm and, when executed,
      VALUE-MATCH CPython (int AND float fields), for a struct LOCAL and a struct
      PARAM. Fields MUST be matched by NAME (a reversed-keyword-arg literal maps
      to the same slots). A non-scalar field, a struct RETURN, and a method call
      MUST be refused, never miscompiled.
    prediction: |
      The executed WABT witness reads Point(3,4).x=3, .y=4, x+y=7; a reversed
      Point(y=10,x=3) still yields x=3; Rec(5,2.5).f=2.5; a struct param p.x+p.y
      over a preloaded record = 42 — all == CPython.
    test: |
      cargo test -p xpile-wasm-codegen --test heap_struct_witness
    if_fails: |
      The field-slot layout (stride, offset, name-matching), the store/load type,
      the struct-param base-pointer, or a refusal regressed — a wrong field
      offset, an arg-order-not-name mapping, or an aliased neighbouring field.
      The executed values diverge from CPython.
    ship_blocking: true
    counter_example_classes:
      - wrong_field_offset_or_stride
      - literal_arg_order_used_instead_of_field_name
      - wrong_store_or_load_type_for_field
      - non_scalar_field_or_struct_return_miscompiled

  - id: FALSIFY-WASM-HEAP-006
    rule: |
      PMAT-1058: a string slice `s[lo:hi]` (unstepped) MUST materialise a
      well-formed length-prefixed heap SUBSTRING holding the CHARACTERS in
      [lo, hi) — char-exact (a multi-byte code point copied whole, never split),
      with Python clamp semantics (negative-bound normalise, clamp to
      [0, charlen], hi = max(hi, lo), missing lo → 0 / missing hi → charlen)
      that never trap on out-of-range bounds — assembling via wat2wasm and, when
      executed, reading back byte-for-byte equal to CPython, INCLUDING on a
      multi-byte fixture. A stepped string slice / a list slice MUST refuse.
    prediction: |
      The executed WABT witness reconstructs `mid(s) = s[1:4]` over the
      multi-byte fixture "abécd" to "béc" (bytes [98,195,169,99], the 2-byte é
      copied whole) == CPython.
    test: |
      cargo test -p xpile-wasm-codegen --test str_slice_witness
    if_fails: |
      The char-walk (byte-vs-char indexing), the bound clamping/normalisation,
      the substring alloc/copy, or the step/list refusal regressed — a byte
      slice that splits a multi-byte char, a trap on a clamped bound, a wrong
      length, or wrong WAT for a stepped slice. The constructed substring
      diverges from CPython.
    ship_blocking: true
    counter_example_classes:
      - byte_slice_splits_multibyte_char
      - out_of_range_bound_traps_instead_of_clamping
      - wrong_substring_length_or_offset
      - stepped_or_list_slice_miscompiled

  - id: FALSIFY-WASM-HEAP-007
    rule: |
      PMAT-1059: string ORDERING `a < b` / `a <= b` / `a > b` / `a >= b` MUST
      lower to a byte-wise lexicographic 3-way compare ($__wasm_str_cmp) — an
      UNSIGNED byte compare over min(len) bytes then shorter-is-less — tested
      against 0 with the matching signed op, NEVER a base-pointer i32 compare.
      Byte order == code-point order for UTF-8, so the result MUST value-match
      CPython, INCLUDING on multi-byte fixtures where a signed-byte read would
      mis-order. A `str <op> non-str` mixed comparison MUST refuse.
    prediction: |
      The executed WABT witness runs every (case × op) pair and each equals the
      pinned CPython bool — "app" < "apple" (prefix), "abc" <= "abc" (equal),
      and the multi-byte "abé" > "abz" / "café" > "cafe" (byte order == code
      point order). A pure-ordering module carries no $__alloc.
    test: |
      cargo test -p xpile-wasm-codegen --test str_ordering_witness
    if_fails: |
      The 3-way compare (signed vs unsigned byte read, prefix shorter-is-less,
      the against-0 signed op), the helper gate, or the mixed-operand refusal
      regressed — a base-pointer compare, a signed-byte mis-order of a
      multi-byte lead byte, or a wrong prefix result. The bool diverges from
      CPython.
    ship_blocking: true
    counter_example_classes:
      - base_pointer_compare_passed_off_as_string_ordering
      - signed_byte_read_misorders_multibyte_lead_byte
      - prefix_shorter_is_less_wrong
      - mixed_str_nonstr_ordering_miscompiled

  - id: FALSIFY-WASM-HEAP-008
    rule: |
      PMAT-1060: `str(int)` / `repr(int)` MUST lower to $__wasm_int_to_str — a
      decimal-ASCII heap string built in the UNSIGNED magnitude (i64.div_u/rem_u
      over `neg ? (0 - n) : n`), with at least one digit (str(0) == "0"), a
      single leading '-' for negatives, and an i32 byte-count header equal to the
      digit count. The executed value MUST match CPython str(n), INCLUDING the
      i64::MIN boundary where a naive negation would overflow. str(float) and
      str(bool)/str(str) MUST refuse (never a wrong conversion).
    prediction: |
      The executed WABT witness runs 8 sign/zero/boundary cases (0, 7, -5, -42,
      100, 1000000, i64::MAX, i64::MIN) and each reconstructed string equals the
      pinned CPython str(n) — incl. i64::MIN = "-9223372036854775808" and the
      "n=" + str(n) concat composition (header length stays synced with the
      copied bytes across the re-materialised operand).
    test: |
      cargo test -p xpile-wasm-codegen --test int_to_str_witness
    if_fails: |
      The magnitude handling (signed vs unsigned division, the i64::MIN wrapping
      negation), the digit fill (order, the at-least-one-digit case, the sign
      byte), the header byte count, or the str(float)/str(bool) refusal
      regressed — the reconstructed decimal string diverges from CPython or a
      refused operand miscompiles.
    ship_blocking: true
    counter_example_classes:
      - naive_negation_overflows_on_i64_min
      - signed_division_misconverts_large_magnitude
      - zero_becomes_empty_string
      - missing_or_double_sign_byte
      - header_length_desynced_from_digits
      - str_float_or_bool_miscompiled_instead_of_refused

  - id: FALSIFY-WASM-HEAP-009
    rule: |
      PMAT-1126: `s.startswith(p)` / `s.endswith(p)` MUST lower to a
      non-allocating BYTE prefix/suffix compare ($__wasm_str_startswith /
      $__wasm_str_endswith) — a len-guarded loop of i32.load8_u compares over the
      length-prefixed payload — returning an i32 bool, NEVER a base-pointer
      compare. Byte prefix/suffix == code-point prefix/suffix for valid UTF-8
      (the needle's first byte is a LEAD byte, so a byte match lands on a char
      boundary), so the result MUST value-match CPython, INCLUDING multi-byte
      fixtures where a shared continuation byte could false-positive or a byte
      offset could split a char. A needle longer than the haystack MUST return 0;
      an empty needle MUST return 1. Any OTHER string method MUST refuse.
    prediction: |
      The executed WABT witness runs every (case × op) pair and each equals the
      pinned CPython bool — "hello".startswith("he")=True, the same-length
      differing prefix "hi"=False, the longer-than needle "hi".startswith("hello")
      =False, the empty needle ""=True, and the MULTI-BYTE "héllo".startswith("hé")
      =True / "héllo".startswith("h©")=False (shared 0xA9, differing lead byte) /
      "héllo".endswith("éllo")=True (suffix offset on a char boundary). A
      pure-predicate module carries no $__alloc.
    test: |
      cargo test -p xpile-wasm-codegen --test str_prefix_witness
    if_fails: |
      The prefix/suffix compare (the len-guard short-circuit, the endswith start
      offset len(s)-len(p), the byte-vs-char boundary, the empty-needle case), the
      per-op helper gate, or the non-str-operand refusal regressed — a base-pointer
      compare, a false positive on a shared continuation byte, a wrong suffix
      offset, or a crash on a longer needle. The bool diverges from CPython.
    ship_blocking: true
    counter_example_classes:
      - base_pointer_compare_passed_off_as_startswith
      - shared_continuation_byte_false_positive
      - wrong_endswith_suffix_offset
      - longer_needle_not_short_circuited
      - empty_needle_wrong_result
      - other_str_method_miscompiled_instead_of_refused
