metadata:
  id: C-COMPILE-RUST-TO-PTX-MMA
  version: "1.0.0"
  created: "2026-05-15"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Compile-time contract: how a Rust kernel annotated `#[gpu_kernel(mma)]`
    lowers through xpile-ptx-codegen to PTX text targeting sm_80+ hardware.

    Layer 5 of the xpile contract taxonomy (compile-time / IR). Adopted
    from aprender's PerformanceContract pattern
    (crates/aprender-compute/contracts/cgp/cgp-gpu-mma-64x128-pipeline-v1.yaml)
    but kept under `kind: pattern` for vanilla `pv` compatibility; the
    `xpile.layer: compile` marker carries the team-only Layer-5 distinction.

    Asserts properties of the *emitted PTX text*, not just the Rust source
    or the meta-HIR. Falsification tests grep / parse the PTX artifact
    directly — if the emitted instructions don't match, the contract fails
    regardless of whether the Rust input was well-typed.
  xpile:
    layer: compile
  references:
    - "PTX ISA 8.3 — §8.7 mma instructions"
    - "PTX ISA 8.3 — §10.3 cp.async instructions"
    - "CUDA Programming Guide §K.5 (sm_80 SMEM capacity)"
    - contracts/xpile-backend-trait-v1.yaml
    - docs/specifications/sub/backend-trait.md
  depends_on:
    - C-XPILE-BACKEND-TRAIT

compile_targets:
  - target: ptx
    hardware:
      compute_capability_min: "sm_80"
      compute_capability_max: "sm_90"
    via:
      - rustc_codegen_nvvm
      - rust-cuda
    backend_crate: xpile-ptx-codegen
    # PMAT-259 / sub/layer5-multi-emitter-quorum.md: this `via` list
    # is the v0.1.0 flat-string form. The spec'd v0.2.0+ schema
    # extends each entry to a structured record:
    #   - emitter: rustc_codegen_nvvm
    #     role: general
    #     crate: xpile-ptx-codegen
    #   - emitter: aprender-gpu
    #     role: specialist
    #     cross_repo: aprender
    #     shape_filter: gemm_fp16_mma_64x128
    # with a quorum_policy: { kind: DiffExec, tolerance: 1.0e-3 }
    # field at the compile_targets level. This wires the §14.4
    # N-of-M oracle quorum into the Runtime stratum: divergence
    # between general (rustc_codegen_nvvm) and specialist
    # (aprender-gpu) emitters at runtime falsifies the contract.
    # Closes the audit-design.md §4 "Run=1 demo fixture" caveat
    # for C-COMPILE-RUST-TO-PTX-MMA specifically.

equations:
  mma_emission_for_gemm_kernel:
    # PMAT-074: Lean refinement theorem locks in the marker-
    # preservation modelling commitment. See
    # contracts/lean/CompileRustToPtxMma.lean for the proof.
    # FIRST Layer-5 (compile-time / IR) contract to receive a
    # refinement theorem.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.mma_emission_for_gemm_kernel"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    # PMAT-075: Kani harness completes the §14.4 quorum and
    # makes this the FIRST Layer-5 contract at QUORUM.
    kani_harness: "mma_emission_for_gemm_kernel"
    kani_file: "contracts/kani/compile_rust_to_ptx_mma.rs"
    formula: |
      lower(rust_fn marked #[gpu_kernel(mma)], BackendConfig{target: Ptx})
        produces ptx_text containing mma.sync.aligned
    domain: |
      A Rust function annotated `#[gpu_kernel(mma)]` containing a
      triple-nested loop over a tile shape supported by mma.sync
      (16×8×16 or 16×8×8) with operand type fp16.
    invariants:
      - "emitted PTX contains at least one mma.sync.aligned.* instruction"
      - "no emitted code path falls back to scalar mad.lo or fma.rn"
    preconditions:
      - "BackendConfig.target == Target::Ptx"
      - "BackendConfig.hardware == Some(HwProfile::Ptx { compute_capability >= sm_80 })"

  cp_async_pipeline_overlap:
    formula: |
      lower(rust_fn marked #[pipeline_depth=N], _) where N ∈ {2, 3}
        produces ptx_text containing cp.async.wait_group N-1
    domain: |
      Same as mma_emission_for_gemm_kernel, plus the kernel attribute
      `#[pipeline_depth=2]` or `#[pipeline_depth=3]`.
    invariants:
      - "wait_group operand in PTX equals (requested_pipeline_depth - 1)"
      - "wait_group 0 does NOT appear (would fully serialize load/compute)"
      - "number of distinct cp.async issue sites equals pipeline_depth"
    preconditions:
      - "mma_emission_for_gemm_kernel holds for this kernel"

  shared_memory_budget:
    # PMAT-161 / XPILE-REFINE-COMPILE-PTX-002: Silver-tier
    # refinement theorem. First Silver proof in the substrate
    # that's NOT trivial rfl — uses Nat.min_le_right. Introduces
    # typed KernelInputSilver + PtxOutputSilver with smem_bytes
    # field; clamps to the sm_80 48 KiB hardware budget via
    # `min k.requested_smem 49152`. Theorem proves
    # `emitted.smem_bytes ≤ 49152` structurally.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.shared_memory_budget_silver"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    # PMAT-276: Property-specific Silver-tier Kani harness. Closes
    # audit-design.md §4 "byte-identity placeholder" caveat for this
    # equation. Bronze (mma_emission_for_gemm_kernel) only proved
    # byte-equality on a 4-byte marker — trivially true. Silver
    # introduces a real INEQUALITY: emitted smem_bytes ≤ 48 KiB,
    # proved over symbolic 4.3B u32 requested_smem values. Companion
    # Kani harnesses (smem_under_budget_preserved_silver,
    # smem_over_budget_clamps_to_budget_silver) verify the exact
    # clamp semantics — both arms of the min boundary. First Silver-
    # tier Kani proof on this contract (matches the Lean theorem's
    # non-trivial Nat.min_le_right structure, not rfl).
    kani_harness: "shared_memory_budget_silver"
    kani_file: "contracts/kani/compile_rust_to_ptx_mma.rs"
    formula: |
      smem_static_bytes(emitted_ptx) ≤ 49152
    domain: |
      Any kernel emitted by xpile-ptx-codegen targeting sm_80–sm_90
      that relies on static (compile-time-sized) shared memory.
    invariants:
      - "sum of `.shared .align N .b8 buf[K]` sizes ≤ 48 KiB"
      - "dynamic shared memory (extern __shared__) is reported separately
         and bounded by HwProfile::Ptx::dynamic_smem_max"
    preconditions: []

  bounded_smem_preserved_gold:
    # PMAT-187 / XPILE-REFINE-COMPILE-PTX-003: THIRD Gold-tier
    # refinement in the substrate (after PMAT-185 PyIntFast
    # and PMAT-186 BoundedRefcountDelta). Promotes Silver's
    # smem_bytes : Nat (with runtime min clamp) to
    # BoundedSmem := { s : Nat // s ≤ 48*1024 } refinement
    # subtype. The sm_80 hardware budget is encoded at the
    # TYPE level — over-budget kernel requests can't even be
    # constructed. Demonstrates Gold pattern on Layer-5
    # compile-time emission (PMAT-185 covered Layer-1
    # arithmetic, PMAT-186 covered Layer-4 FFI).
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_preserved_gold"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      lower_kernel_to_ptx_gold(k).smem_bytes.val ≤ 49152  BY TYPE
    domain: |
      Same as shared_memory_budget — any kernel emitted by
      xpile-ptx-codegen targeting sm_80–sm_90. The Gold upgrade
      removes the runtime clamp by encoding the budget at type
      level.
    invariants:
      - "the BoundedSmem subtype rules out over-budget kernel requests at CONSTRUCTION time"
      - "the bound witness travels with the value through lowering — no runtime check needed"
      - "no `min` clamp at lowering time (Silver's clamp was a runtime workaround for untyped Nat input)"
      - "companion theorem gold_subtype_agrees_with_silver_clamp bridges Gold to PMAT-161's Silver model"
    preconditions:
      - "kernel requested_smem is constructed with a proof that smem ≤ 48*1024 (the Gold-tier well-formedness obligation)"
      - "an emitter that accepts raw Nat requests would not type-check against lower_kernel_to_ptx_gold"
    postconditions:
      - "emitted PTX never exceeds the sm_80 shared-memory budget — ptxas would reject otherwise, but the type system catches it before emission"
      - "this is the archetype Gold-tier pattern applied to Layer-5 compile-time contracts (after PMAT-185 on Layer-1 arithmetic and PMAT-186 on Layer-4 FFI)"

  bounded_smem_sum_within_budget_platinum:
    # PMAT-206 / XPILE-REFINE-COMPILE-PTX-004: SEVENTH Platinum-
    # tier refinement in the substrate. First Platinum theorem
    # demonstrating COMPOSITION of prior tier patterns —
    # PMAT-187's Gold BoundedSmem subtype + PMAT-204's Platinum
    # additivity combined into bounded-monoid-homomorphism.
    # Companion theorems bounded_smem_add_commutative_platinum
    # (combines PMAT-199 commutativity + PMAT-187 Gold subtype +
    # PMAT-204 additivity) and zero_is_bounded_smem_platinum
    # (monoid identity).
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_sum_within_budget_platinum"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      add_bounded_smem(a, b, h).val == a.val + b.val
      WHERE h : a.val + b.val ≤ smem_budget_sm80
      (bounded-monoid-homomorphism)
    domain: |
      Any two BoundedSmem values a, b with a sum bound proof.
      The Platinum upgrade captures composition of Gold-tier
      bounded subtypes with Platinum-tier additivity.
    invariants:
      - "FIRST Platinum theorem demonstrating COMPOSITION of prior tier patterns"
      - "combines PMAT-187 Gold BoundedSmem subtype + PMAT-204 Platinum additivity"
      - "the bounded-smem (Nat, +, 0) monoid is preserved under the bound — bounded-monoid-homomorphism property"
      - "companion theorem bounded_smem_add_commutative_platinum further combines PMAT-199 commutativity with the bounded subtype"
      - "companion theorem zero_is_bounded_smem_platinum captures the monoid identity element"
    preconditions:
      - "the sum bound a.val + b.val ≤ smem_budget_sm80 must be proven at construction time"
      - "this is the Gold-subtype well-formedness obligation lifted to the binary-composition case"
    postconditions:
      - "the result is itself a BoundedSmem — the bound witness travels with the sum"
      - "Platinum patterns COMPOSE — building richer compositional properties from prior tier components"
      - "an emitter that sums two BoundedSmems without checking the cumulative bound would not produce a valid BoundedSmem — caught at composition time by the type system"

  bounded_smem_monoid_diamond:
    # PMAT-218 / XPILE-REFINE-COMPILE-PTX-005: FIFTH Diamond-tier
    # refinement. Combines PMAT-187 Gold BoundedSmem + PMAT-206
    # Platinum bounded composition + commutativity + identity
    # into the BOUNDED MONOID axiomatization. Fifth distinct
    # Diamond category — bounded algebraic structure.
    # Companion theorem bounded_smem_closure_diamond captures
    # closure under the budget.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_monoid_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      BoundedSmem forms a BOUNDED COMMUTATIVE MONOID:
        (a) closure: a + b ≤ budget → result is BoundedSmem
        (b) commutativity: a + b = b + a
        (c) right identity: a + 0 = a
        (d) bounded by smem_budget_sm80 = 49152
    domain: |
      Any BoundedSmem values with sum-bound preconditions. The
      Diamond upgrade captures the FULL bounded-monoid
      axiomatization at the type level.
    invariants:
      - "FIFTH Diamond-tier theorem; combines PMAT-187 + PMAT-206 + commutativity + identity"
      - "distinct from PMAT-214 commutative-monoid: bounded-monoid REQUIRES the operation stay within a bound"
      - "captures hardware-bound algebraic structure for sm_80 shared memory"
      - "companion theorem bounded_smem_closure_diamond proves closure under the budget"
    preconditions:
      - "all values are BoundedSmem (Gold-tier well-formedness)"
      - "sum-bound preconditions hold for the binary operations"
    postconditions:
      - "an emitter satisfying individual Platinum + Gold theorems but breaking joint structure (non-commutative representation, off-by-one in zero-handling) would falsify this Diamond"
      - "the bounded-monoid structure is the algebraic foundation for compositional sm_80 budget analysis"

  bounded_smem_closure_diamond:
    # PMAT-287 / XPILE-REFINE-COMPILE-PTX-008: FIFTH Diamond on this
    # contract — opens DEPTH-5 ACROSS LAYERS milestone (second
    # contract to reach depth-5 after PMAT-286 on C-PY-INT-ARITH).
    # The CLOSURE Diamond captures a categorically distinct claim:
    # bounded composition produces a value IN the BoundedSmem set
    # (closure under sum-fits operation). Distinct from PMAT-218
    # monoid (axiomatic), PMAT-231/232 semilattices (max/min lattice
    # structure), PMAT-248 absorption (lattice law) — closure is a
    # SUBALGEBRA / WELL-DEFINEDNESS property: given valid inputs +
    # precondition, the output is also a valid input for the next
    # composition. Without closure, even valid monoid axioms wouldn't
    # support compositional analysis (you'd need to re-validate the
    # bounded property after every step). The Lean theorem already
    # exists at bounded_smem_closure_diamond — this YAML entry wires
    # it as a separately-counted Diamond category for the diamond
    # reporter.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_closure_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      ∀ (a b : BoundedSmem) (h : a.val + b.val ≤ smem_budget_sm80),
        ∃ c : BoundedSmem, c.val = a.val + b.val
    domain: |
      Any pair of BoundedSmem values whose sum fits the sm_80 budget.
      The closure Diamond asserts the result is also a BoundedSmem —
      i.e., bounded composition is closed under the budget.
    invariants:
      - "SECOND contract to reach Diamond depth-5 (after PMAT-286 on C-PY-INT-ARITH)"
      - "opens DEPTH-5 ACROSS LAYERS milestone — Layer 1 (PyIntArith) + Layer 5 (CompileRustToPtxMma)"
      - "closure is a SUBALGEBRA property distinct from monoid axioms, semilattice axioms, and absorption laws"
      - "load-bearing for compositional smem analysis: without closure, every step needs re-validation; with closure, the analysis composes as a chain of monoid operations"
    preconditions:
      - "all values are BoundedSmem (Gold-tier well-formedness)"
      - "sum-fits precondition holds for the operation"
    postconditions:
      - "an emitter that produces an over-budget result on bounded+bounded with sum-fits precondition would falsify the closure (no witness c exists)"
      - "Diamond DEPTH-5 ACROSS LAYERS demonstrated: 2 contracts at depth-5+ — opens the depth-5-across-layers dimension"

  bounded_smem_join_semilattice_diamond:
    # PMAT-231 / XPILE-REFINE-COMPILE-PTX-006: SECOND Diamond on
    # this contract — Layer 5 depth-2 Diamond. Following
    # PMAT-228 (Layer 1), PMAT-229 (Layer 2), PMAT-230 (Layer 4),
    # this extends Diamond breadth to Layer 5. The JOIN-
    # SEMILATTICE Diamond is a fundamentally distinct algebraic
    # category from PMAT-218 bounded-monoid: monoid (additive)
    # vs semilattice (max-based, idempotent). The semilattice
    # captures WORST-CASE-RESERVATION semantics — parallel
    # kernels reserve max-of-requested, not sum-of-requested.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_join_semilattice_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, max, 0) forms a JOIN-SEMILATTICE:
        (a) commutativity: max(a, b) = max(b, a)
        (b) associativity: max(max(a, b), c) = max(a, max(b, c))
        (c) bottom: max(0, a) = a
        (d) idempotence: max(a, a) = a (lattice-defining axiom)
    domain: |
      Any three BoundedSmem values. The Diamond upgrade captures
      the join-semilattice structure (max + identity + idempotence)
      that is fundamentally distinct from the additive monoid
      captured at PMAT-218.
    invariants:
      - "SECOND Diamond category on C-COMPILE-RUST-TO-PTX-MMA — Diamond breadth on Layer 5"
      - "distinct algebraic category from PMAT-218 bounded-monoid (monoid vs semilattice)"
      - "captures WORST-CASE-RESERVATION semantics for parallel kernel composition"
      - "idempotence is the semilattice-defining axiom — distinguishes from monoid"
    preconditions:
      - "three BoundedSmem values (Gold-tier well-formedness)"
    postconditions:
      - "an emitter that uses sum-based reservation for parallel kernels would over-reserve unnecessarily"
      - "Diamond depth-2 demonstrated on Layer 5 — substrate now has FOUR depth-2 Diamond contracts (Layers 1, 2, 4, 5)"

  bounded_smem_meet_semilattice_diamond:
    # PMAT-242 / XPILE-REFINE-COMPILE-PTX-007: THIRD Diamond on
    # this contract — second DEPTH-3 Diamond in substrate.
    # MEET-SEMILATTICE via min, DUAL to PMAT-231 join-semilattice
    # via max. Together they form the BOUNDED LATTICE structure
    # on BoundedSmem (both join and meet operations
    # axiomatized).
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_meet_semilattice_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, min) forms a MEET-SEMILATTICE:
        (a) commutativity: min(a, b) = min(b, a)
        (b) associativity: min(min(a, b), c) = min(a, min(b, c))
        (c) bottom absorption: min(0, a) = 0
        (d) idempotence: min(a, a) = a
    domain: |
      Any three BoundedSmem values. The Diamond upgrade
      captures the meet-semilattice structure (min + bottom
      absorption + idempotence), the DUAL of PMAT-231's
      join-semilattice.
    invariants:
      - "SECOND DEPTH-3 Diamond in the substrate (after PMAT-241 on PyIntArith)"
      - "distinct algebraic category from PMAT-218 bounded-monoid AND PMAT-231 join-semilattice"
      - "together with PMAT-231 forms BOUNDED LATTICE structure on BoundedSmem"
      - "captures safe over-subscription floor for shared-memory allocation"
    preconditions:
      - "three BoundedSmem values"
    postconditions:
      - "lattice operations enable both worst-case (max via PMAT-231) and safe-floor (min via this PR) reservation analysis"
      - "Diamond DEPTH-3 universal-across-layers: now opened on Layer 1 (PMAT-241) and Layer 5 (this PR)"

  bounded_smem_lattice_absorption_diamond:
    # PMAT-248 / XPILE-REFINE-COMPILE-PTX-008: FOURTH Diamond on
    # this contract — Layer 5 DEPTH-4. Second DEPTH-4 Diamond in
    # substrate (after PMAT-247 on PyIntArith). The LATTICE
    # ABSORPTION LAWS turn PMAT-231 join-semilattice (max) and
    # PMAT-242 meet-semilattice (min) into a single LATTICE
    # structure — the strongest algebraic structure derivable
    # from pairwise-orderable values.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_lattice_absorption_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, max, min) forms a LATTICE via absorption:
        (a) max-absorbs-min: max(a, min(a, b)) = a
        (b) min-absorbs-max: min(a, max(a, b)) = a
        (c) max idempotent (PMAT-231 lifted)
        (d) min idempotent (PMAT-242 lifted)
    domain: |
      Any two BoundedSmem values. The Diamond captures the
      lattice absorption laws binding max and min into a single
      lattice structure.
    invariants:
      - "SECOND DEPTH-4 Diamond in substrate; FOURTH category on CompileRustToPtxMma"
      - "distinct from PMAT-218 bounded-monoid, PMAT-231 join-semilattice, AND PMAT-242 meet-semilattice"
      - "absorption laws are the categorical hallmark of a LATTICE"
    preconditions:
      - "two BoundedSmem values"
    postconditions:
      - "lattice structure now fully axiomatized"
      - "Diamond depth-4 opened on TWO contracts (PMAT-247 PyIntArith L1, this PR CompileRustToPtxMma L5)"

  bounded_smem_distributive_lattice_diamond:
    # PMAT-291 / XPILE-REFINE-COMPILE-PTX-009: SIXTH Diamond on this
    # contract — opens DEPTH-6 ACROSS LAYERS (second contract at
    # depth-6+ after PMAT-290 on C-PY-INT-ARITH). The
    # DISTRIBUTIVE-LATTICE Diamond captures cross-distributivity of
    # max and min: max(a, min(b, c)) = min(max(a, b), max(a, c))
    # and the symmetric law. Distinct from PMAT-248 absorption
    # (which is a SAME-OPERAND law: a ⊓ (a ⊔ b) = a) — distributivity
    # is CROSS-OPERAND. Not all lattices are distributive (e.g., the
    # pentagon lattice N5 has absorption but not distributivity);
    # this Diamond proves BoundedSmem is in the distributive class.
    # Distributive lattices are the algebraic foundation of BOOLEAN
    # ALGEBRAS — load-bearing for any downstream emitter that uses
    # Boolean-algebra reasoning on smem reservations.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_distributive_lattice_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, max, min) is a DISTRIBUTIVE LATTICE:
        (a) max distributes over min: max(a, min(b, c)) = min(max(a, b), max(a, c))
        (b) min distributes over max: min(a, max(b, c)) = max(min(a, b), min(a, c))
    domain: |
      Any three BoundedSmem values. The Diamond captures the
      cross-distributivity of max and min — a CROSS-OPERAND
      structural claim distinct from the SAME-OPERAND absorption
      laws at PMAT-248.
    invariants:
      - "SIXTH Diamond category on C-COMPILE-RUST-TO-PTX-MMA — opens DEPTH-6 ACROSS LAYERS (second contract at depth-6+ after PMAT-290 on PyIntArith)"
      - "distinct from PMAT-218 monoid, PMAT-231 join-semilattice, PMAT-242 meet-semilattice, PMAT-248 absorption, PMAT-287 closure — distributivity is a SHARP structural enrichment"
      - "captures the BOOLEAN-ALGEBRA-FOUNDATIONAL distributivity law — not all lattices are distributive (pentagon N5 isn't), so this is a real categorical claim"
      - "load-bearing for emitters that perform Boolean-algebra reasoning on smem reservations (smem regions can be unioned/intersected via max/min)"
    preconditions:
      - "three BoundedSmem values"
    postconditions:
      - "an emitter that implements a non-distributive lattice (e.g., reduces parallel-then-sequential smem composition asymmetrically) would falsify this Diamond while leaving PMAT-248 absorption intact"
      - "Diamond DEPTH-6 ACROSS LAYERS demonstrated: 2 contracts at depth-6+ — opens the depth-6-across-layers dimension"

  bounded_smem_bounded_lattice_diamond:
    # PMAT-293 / XPILE-REFINE-COMPILE-PTX-010: SEVENTH Diamond on this
    # contract — opens DEPTH-7 ACROSS LAYERS (second contract at
    # depth-7+ after PMAT-292 on C-PY-INT-ARITH). The BOUNDED LATTICE
    # Diamond adds explicit TOP and BOTTOM elements to PMAT-291's
    # distributive lattice: 0 is bottom (max(0, a) = a; min(0, a) = 0)
    # and smem_budget_sm80 is top (max(a, top) = top for a in
    # BoundedSmem; min(top, a) = a). The top-element claims use
    # a.property — the proof carried by the BoundedSmem subtype that
    # a.val ≤ smem_budget_sm80. This makes smem_budget_sm80 a REAL
    # structural top, not just a Nat bound. This is the closing-the-
    # loop Diamond for BoundedSmem's algebraic structure — together
    # with PMAT-218..291 it captures the full BOUNDED DISTRIBUTIVE
    # LATTICE axiomatization (the foundation of Boolean algebras
    # restricted to the smem budget interval).
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_bounded_lattice_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, max, min, 0, smem_budget_sm80) is a BOUNDED
      DISTRIBUTIVE LATTICE:
        (a) bottom-left-identity for max: max(0, a) = a
        (b) bottom-left-zero for min: min(0, a) = 0
        (c) top-absorbs-from-right under max: max(a, top) = top
        (d) top-is-identity-from-left under min: min(top, a) = a
    domain: |
      Any BoundedSmem value a. The Diamond captures the explicit
      top/bottom enrichment of PMAT-291's distributive lattice.
    invariants:
      - "SEVENTH Diamond category on C-COMPILE-RUST-TO-PTX-MMA — opens DEPTH-7 ACROSS LAYERS (second contract at depth-7+ after PMAT-292 on PyIntArith)"
      - "distinct from PMAT-291 distributive lattice — bounded lattice adds explicit top/bottom STRUCTURAL elements with absorption properties"
      - "captures the BOOLEAN-ALGEBRA-CLOSURE structure — together with PMAT-291 distributivity + PMAT-248 absorption + PMAT-218..242 monoids/semilattices, the full BOUNDED DISTRIBUTIVE LATTICE axiomatization is in place"
      - "the BoundedSmem subtype's bound is load-bearing: a.property is what makes smem_budget_sm80 a REAL top element, not just a Nat constant"
    preconditions:
      - "BoundedSmem value with a.val ≤ smem_budget_sm80 (carried by a.property)"
    postconditions:
      - "an emitter that allowed BoundedSmem values to exceed the budget would falsify (c)/(d) because top-absorbs-join requires every value ≤ top"
      - "Diamond DEPTH-7 ACROSS LAYERS demonstrated: 2 contracts at depth-7+ — opens the depth-7-across-layers dimension"

  bounded_smem_cancellative_monoid_diamond:
    # PMAT-295: EIGHTH Diamond on this contract — opens DEPTH-8
    # ACROSS LAYERS. CANCELLATIVE MONOID via Nat.add_left_cancel /
    # Nat.add_right_cancel. Distinct from PMAT-218 monoid axioms
    # (which don't require cancellation). Not all monoids are
    # cancellative — `(Nat ∪ {∞}, +, 0)` is a monoid but NOT
    # cancellative. Closes the loop on BoundedSmem's additive-
    # monoid structure.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_cancellative_monoid_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, +, 0) is a CANCELLATIVE MONOID:
        (a) left cancellation: a.val + b.val = a.val + c.val → b.val = c.val
        (b) right cancellation: b.val + a.val = c.val + a.val → b.val = c.val
    domain: |
      Any three BoundedSmem values, on the underlying Nat .val
      projection.
    invariants:
      - "EIGHTH Diamond category on C-COMPILE-RUST-TO-PTX-MMA — opens DEPTH-8 ACROSS LAYERS (second contract at depth-8+ after PMAT-294 on PyIntArith)"
      - "distinct from PMAT-218 monoid axioms — cancellation is a STRONGER structural property"
      - "load-bearing for saturating-arithmetic emitters: a saturating add that maps both (48 KiB + 1) and (48 KiB + 2) to 48 KiB would falsify both cancellation laws"
    preconditions:
      - "three BoundedSmem values; theorem stated on Nat .val projection"
    postconditions:
      - "an emitter that uses non-cancellative accounting would falsify both laws"
      - "Diamond DEPTH-8 ACROSS LAYERS demonstrated: 2 contracts at depth-8+"

  bounded_smem_ordered_monoid_diamond:
    # PMAT-299: NINTH Diamond on this contract — opens DEPTH-9 ACROSS
    # LAYERS. ORDERED MONOID via Nat.add_le_add_left,
    # Nat.add_le_add_right, Nat.le_refl, Nat.le_trans. Distinct from
    # PMAT-295 cancellative monoid:
    #   - cancellation:  equality → equality (reverse direction)
    #   - ordered-monoid: order  → order    (forward monotonicity)
    # Distinct from the lattice family (PMAT-231/242/248/291/293):
    # lattice axioms are about max/min as standalone operations;
    # ordered-monoid says ADDITION is COMPATIBLE with the order.
    # Mathlib's `OrderedAddCommMonoid` typeclass canonically packages
    # this combination. PyIntArith reached depth-9 at PMAT-298
    # (linear-order trichotomy); PMAT-299 extends depth-9 to Layer 5.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_ordered_monoid_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, +, 0, ≤) is an ORDERED MONOID:
        (a) right-monotonicity: a.val ≤ b.val → a.val + c.val ≤ b.val + c.val
        (b) left-monotonicity:  a.val ≤ b.val → c.val + a.val ≤ c.val + b.val
        (c) reflexivity:        a.val ≤ a.val
        (d) transitivity:       a.val ≤ b.val → b.val ≤ c.val → a.val ≤ c.val
    domain: |
      Any three BoundedSmem values, on the underlying Nat .val
      projection with the standard ≤ order. The four properties
      together axiomatize an ordered (additive) monoid — Mathlib's
      `OrderedAddCommMonoid` typeclass shape.
    invariants:
      - "NINTH Diamond category on C-COMPILE-RUST-TO-PTX-MMA — opens DEPTH-9 ACROSS LAYERS (second contract at depth-9+ after PMAT-298 on PyIntArith)"
      - "distinct from PMAT-295 cancellative monoid: cancellation is reverse-direction (eq → eq), monotonicity is forward (order → order)"
      - "distinct from PMAT-231/242/248/291/293 lattice family: lattice axioms govern max/min as standalone operations; ordered-monoid couples addition with the order"
      - "load-bearing for wrap-around-arithmetic emitters: smem represented modulo 2^32 could decrease under addition of a positive value, falsifying property (a)"
    preconditions:
      - "three BoundedSmem values; theorem stated on Nat .val projection"
    postconditions:
      - "an emitter that uses wrap-around accounting would falsify monotonicity"
      - "Diamond DEPTH-9 ACROSS LAYERS demonstrated: 2 contracts at depth-9+"

  bounded_smem_additive_lattice_diamond:
    # PMAT-301: TENTH Diamond on this contract — opens DEPTH-10
    # ACROSS LAYERS. ADDITIVE-LATTICE distributivity: addition
    # distributes over both max and min. Categorically distinct
    # from all 9 prior categories:
    #   - PMAT-218 monoid: only about + alone, no lattice interaction
    #   - PMAT-291 distributive lattice: max distrib over min, no +
    #   - PMAT-299 ordered monoid: monotonicity, not distribution
    # This is the BRIDGE between the additive monoid and the lattice
    # family — exactly the TROPICAL SEMIRING axiom (a + max b c =
    # max (a+b) (a+c)). PyIntArith reached depth-10 at PMAT-300
    # (RING-distributivity); PMAT-301 extends depth-10 to Layer 5.
    lean_theorem: "XpileContracts.CCompileRustToPtxMma.bounded_smem_additive_lattice_diamond"
    lean_file: "contracts/lean/CompileRustToPtxMma.lean"
    formula: |
      (BoundedSmem, +, max, min) is an ADDITIVE LATTICE:
        (a) c + max a b = max (c + a) (c + b)    -- left + over max
        (b) max a b + c = max (a + c) (b + c)    -- right + over max
        (c) c + min a b = min (c + a) (c + b)    -- left + over min
        (d) min a b + c = min (a + c) (b + c)    -- right + over min
    domain: |
      Any three BoundedSmem values, on the underlying Nat .val
      projection. The four properties together axiomatize the
      additive-lattice structure on (Nat, +, max, min) — the
      tropical-semiring axiom relating + and max/min.
    invariants:
      - "TENTH Diamond category on C-COMPILE-RUST-TO-PTX-MMA — opens DEPTH-10 ACROSS LAYERS (second contract at depth-10+ after PMAT-300 on PyIntArith)"
      - "BRIDGES the additive monoid (PMAT-218) and the lattice family (PMAT-231/242/248/291/293)"
      - "distinct from PMAT-291 distributive lattice (max over min, no +)"
      - "distinct from PMAT-299 ordered monoid (monotonicity, not distribution)"
      - "load-bearing for smem-accounting emitters that compute worst-case parallel reservation: double-counting via a + max(b,c) ≠ max(a+b, a+c) would falsify (a)"
    preconditions:
      - "three BoundedSmem values; theorem stated on Nat .val projection"
    postconditions:
      - "an emitter using path-dependent worst-case reservation would falsify (a) or (b)"
      - "Diamond DEPTH-10 ACROSS LAYERS demonstrated: 2 contracts at depth-10+"

  output_equivalence_to_cublas:
    formula: |
      run(emitted_ptx, A, B, C) ≈ cublas_gemm(A, B, C)
        with max_abs_diff < 1e-2
    domain: |
      Inputs A, B square fp16 matrices of size 1024×1024 with values in
      [-1, 1]; C accumulates fp32; reference is cuBLAS gemmEx on the
      same hardware.
    invariants:
      - "numerical drift stays within fp16 epsilon for the fixture set"
      - "no NaN or Inf in the output"
    preconditions:
      - "emitted PTX assembles via ptxas with no warnings at -O3"
      - "kernel launches successfully (cuLaunchKernel returns CUDA_SUCCESS)"

proof_obligations:
  - type: postcondition
    property: emitted PTX uses mma.sync, not scalar fallback
    formal: "∃ instr ∈ tokens(emitted_ptx) : instr matches /mma\\.sync\\.aligned\\./"
    applies_to: mma_emission_for_gemm_kernel

  - type: postcondition
    property: wait_group depth matches requested pipeline depth
    formal: "∀ wg ∈ wait_groups(emitted_ptx) : wg.operand == pipeline_depth - 1"
    applies_to: cp_async_pipeline_overlap

  - type: invariant
    property: wait_group 0 (full serialization) never appears
    formal: "∀ wg ∈ wait_groups(emitted_ptx) : wg.operand > 0"
    applies_to: cp_async_pipeline_overlap

  - type: bound
    property: static shared memory stays under sm_80 cap
    formal: "smem_static(emitted_ptx) ≤ 48 * 1024"
    applies_to: shared_memory_budget

  - type: postcondition
    property: output matches cuBLAS reference to fp16 precision
    formal: "max_abs_diff(run(emitted, X), cublas(X)) < 1e-2 ∀ X ∈ fixtures"
    applies_to: output_equivalence_to_cublas

  - type: frame
    property: lower() does not mutate the input meta-HIR module
    formal: "modifies() == ∅"
    applies_to: all

  - type: precondition
    property: backend citation is recorded
    formal: "Artifact.citations contains C-COMPILE-RUST-TO-PTX-MMA"
    applies_to: all

falsification_tests:
  - id: FALSIFY-COMPILE-PTX-001
    rule: |
      Emitted PTX MUST contain at least one mma.sync.aligned instruction
      for kernels annotated #[gpu_kernel(mma)].
    prediction: |
      `grep -c 'mma\.sync\.aligned' target/ptx/gemm.ptx` returns ≥ 1.
    test: |
      cargo test -p xpile-ptx-codegen --test ptx_emits_mma_sync
    if_fails: |
      Backend silently fell back to scalar mad.lo — defeats the
      tensor-core contract. Likely cause: missing PTX feature gate or
      compute-capability misconfiguration.
    ship_blocking: true
    counter_example_classes:
      - scalar_mad_fallback
      - mma_disabled_by_optimizer
      - missing_feature_gate

  - id: FALSIFY-COMPILE-PTX-002
    rule: |
      pipeline_depth=N MUST produce cp.async.wait_group (N-1), never 0.
    prediction: |
      For #[pipeline_depth=2]: PTX contains `cp.async.wait_group 1` and
      contains zero occurrences of `cp.async.wait_group 0`.
    test: |
      cargo test -p xpile-ptx-codegen --test ptx_pipeline_depth_correct
    if_fails: |
      Pipeline did not unroll; load and compute are fully serialized.
      Loses the entire point of software pipelining.
    ship_blocking: true
    counter_example_classes:
      - wait_group_zero
      - missing_pipeline_unroll

  - id: FALSIFY-COMPILE-PTX-003
    rule: |
      Static SMEM in emitted PTX MUST NOT exceed 48 KiB on sm_80.
    prediction: |
      Sum of `.shared .align _ .b8 buf[K]` over the PTX ≤ 49152.
    test: |
      cargo test -p xpile-ptx-codegen --test ptx_smem_budget
    if_fails: |
      Kernel launch fails with CUDA_ERROR_LAUNCH_OUT_OF_RESOURCES on
      sm_80 hardware. Likely a tile-size or accumulator-buffer regression.
    ship_blocking: true
    counter_example_classes:
      - smem_overflow
      - oversized_accumulator

  - id: FALSIFY-COMPILE-PTX-004
    rule: |
      Output of emitted kernel MUST match cuBLAS reference within 1e-2.
    prediction: |
      max_abs_diff(run(emitted_kernel, A, B), cublas_gemm(A, B)) < 0.01
      for the 1024×1024 fp16 fixture.
    test: |
      cargo test -p xpile-ptx-codegen --test ptx_matches_cublas
        -- --ignored  # requires GPU runner
    if_fails: |
      Numerical drift exceeds fp16 epsilon. Likely an fp16 accumulator
      bug (should be fp32) or a row/column-major layout mismatch.
    ship_blocking: true
    counter_example_classes:
      - fp16_accumulator
      - layout_mismatch
      - wrong_swizzle

  - id: FALSIFY-COMPILE-PTX-005
    rule: |
      lower() MUST NOT mutate the input meta-HIR module.
    prediction: |
      hash(module) before == hash(module) after PtxBackend::lower().
    test: |
      cargo test -p xpile-ptx-codegen --test backend_no_mutation
    if_fails: |
      Backend has hidden side effects. Breaks the compile-cache
      determinism invariant; cache key reuse may emit stale PTX.
    ship_blocking: true
    counter_example_classes:
      - hidden_side_effect
      - mutable_module_visitor

  - id: FALSIFY-COMPILE-PTX-006
    rule: |
      Emitted Artifact.citations MUST list this contract.
    prediction: |
      Artifact.citations.contains(ContractId("C-COMPILE-RUST-TO-PTX-MMA")).
    test: |
      cargo test -p xpile-ptx-codegen --test backend_cites_compile_contract
    if_fails: |
      Backend emits MMA / cp.async without contractual sanction. Layer-5
      provenance is broken; audit chain cannot tie hardware instructions
      back to a reviewed contract.
    ship_blocking: true
    counter_example_classes:
      - missing_citation
      - silent_codegen

# kani_harnesses: intentionally omitted.
#
# Layer-5 contracts assert properties of the emitted PTX *text*, which
# is not amenable to Kani bounded model checking (Kani checks Rust, not
# PTX). The falsification tests above are the runtime equivalent — they
# inspect the artifact directly via grep / ptx-parser.
#
# A future Lean 4 theorem can encode the meta-relation:
#   "if Rust HIR satisfies pattern P, then emitted PTX contains
#    instruction I" — see docs/specifications/sub/pv-integration.md
# for the planned Lean ↔ pv handoff.
#
# This omission is sanctioned by docs/specifications/sub/contract-taxonomy.md:
#   "pattern contracts can omit kani harnesses".
