metadata:
  id: C-COMPILE-RUST-TO-WASM
  version: "1.0.0"
  created: "2026-06-25"
  author: PAIML Engineering
  kind: pattern
  status: draft
  description: |
    Compile-time contract: how a meta-HIR scalar/control function lowers
    through xpile-wasm-codegen to WebAssembly Text format (WAT) text —
    natively, NOT via the Ruchy `WasmEmitter` hop (the spec §73/§484
    delegated-only stance, now superseded).

    Layer 5 of the xpile contract taxonomy (compile-time / IR), the WASM
    sibling of `C-COMPILE-RUST-TO-WGSL` and `C-COMPILE-RUST-TO-PTX-MMA`.
    This is the EMIT half of first-class bidirectional native WASM
    (PMAT-951): the tractable high→low direction (funcs / locals / if /
    loops / i64 / f64 / calls → WASM). The lossy WASM→meta-HIR lift
    (`SourceLang::Wasm`) is deferred to v0.2.0+ (PMAT-952+).

    Asserts properties of the *emitted WAT text* and (for the executed
    witness) of its *executed numeric output* when assembled and run in a
    wasm runtime. The emitter REFUSES every construct outside the
    DECLARED subset with a hard error rather than emitting wrong code —
    a Lean-style honest refusal.

    PMAT-1350 (2026-07-26): the declared subset is no longer prose. It is
    the machine-readable `emit_surface` block below, and it is checked
    BOTH WAYS by `crates/xpile/tests/wasm_contract_surface.rs`: every
    `declared` probe must emit, and every `refused` probe must refuse.
    Until this slice, this paragraph said the emitter refused
    "str / list / dict / set / struct / tuple / bigint / pointer / print /
    closures". Five of those ten had shipped — a str-keyed dict program
    emits, assembles under `wat2wasm` and executes under `wasm-interp`
    returning the CPython answer. The claim was authored at PMAT-951 when
    it was true and then decayed silently across ~69 capability slices,
    because nothing sampled contract capability prose. The two-way gate is
    the graft that makes this reconciliation durable rather than momentary:
    widening the emitter without widening `emit_surface` now reds a test.

    Semantic posture replicated from the Rust/PTX lanes: i64 arithmetic
    carries the `C-PY-INT-ARITH` overflow posture, and FloorDiv/Mod apply
    the Python floor correction (WASM `i64.div_s` truncates toward zero;
    Python `//` floors toward −∞) via emitted helper functions.
  xpile:
    layer: compile
  references:
    - "WebAssembly Core Specification 2.0 — W3C"
    - "WebAssembly Text Format (WAT) — the `(module (func …))` S-expression syntax"
    - "WABT — wat2wasm / wasm-interp / spectest-interp (executed witness toolchain)"
    - contracts/compile-rust-to-wgsl-v1.yaml
    - contracts/compile-rust-to-ptx-mma-v1.yaml
    - contracts/xpile-backend-trait-v1.yaml
    - docs/specifications/sub/backend-trait.md
  depends_on:
    - C-XPILE-BACKEND-TRAIT

compile_targets:
  - target: wasm
    hardware: null
    via:
      - xpile-wasm-codegen
    backend_crate: xpile-wasm-codegen
    # PMAT-951 (2026-06-25): the EMIT half shipped. xpile-wasm-codegen
    # lowers the meta-HIR scalar/control subset directly to WAT text (no
    # runtime dependency). The emitted WAT is a genuine, validatable
    # WebAssembly module — the PMAT-951 slice ran it through WABT (wat2wasm
    # assembles it; spectest-interp executes every exported fn) and
    # confirmed 10/10 executed semantic results match the CPython reference
    # (incl. floor-division -7//2 == -4, 7//-2 == -4, the while-loop sum,
    # the if-expr max, short-circuit bool logic, and f64 arithmetic).
    #
    # PMAT-952 (runtime-witness half, 2026-06-25): the EXECUTED WASM-runtime
    # DiffExec witness now EXISTS — this upgrades the lane from `Single` to
    # the `DiffExec` Run-stratum, mirroring the CUDA (PMAT-949) and
    # wgpu/WGSL (PMAT-950) GPU witnesses. `WasmDiffExecEngine` (crates/
    # xpile-wasm-codegen/src/wasm_diffexec.rs) runs two categorically
    # independent WAT emitters (general `x*2.0 + 1.0` via f64.mul+f64.add,
    # specialist `(x + x) + 1.0` reassociated doubling with NO f64.mul) in
    # a wasm runtime via the PMAT-951-proven WABT subprocess path (wat2wasm
    # assembles each module; `wasm-interp --run-all-exports` executes every
    # exported fn), and numerically compares the executed outputs under
    # this `quorum_policy.kind: DiffExec`. On a box with WABT the §29 quorum
    # records a real `DiffExecResult::Match` (max_abs_diff = 0 over the
    # fixture vector, bit-identical to the CUDA/WGSL fixtures) instead of
    # `NotRun{no-engine}`. The witness is gated on `wasm_runtime_available()`
    # (graceful-skip on free CI, which lacks WABT). RUNTIME CHOICE: WABT
    # subprocess — NO new Cargo dependency, so `cargo deny check advisories`
    # is unaffected (no wasmi/wasmtime). The lossy WASM→meta-HIR LIFT half
    # of PMAT-952 (SourceLang::Wasm + xpile-wasm-frontend) remains deferred.
    quorum_policy:
      kind: DiffExec
      tolerance: 1.0e-9
    via_roles:
      - emitter: wasm-saxpy-general
        role: general
        crate: xpile-wasm-codegen
      - emitter: wasm-saxpy-specialist-doubling
        role: specialist
        crate: xpile-wasm-codegen

# ---------------------------------------------------------------------------
# PMAT-1350 — THE DECLARED EMIT SURFACE, machine-checked in BOTH directions.
#
# This block is the normative definition of "the subset" for this contract.
# `crates/xpile/tests/wasm_contract_surface.rs` parses it and runs every probe
# below through the live `xpile_core::default_session()` pipeline — the same
# frontend + backend the `xpile transpile --target wasm` CLI dispatches
# through, so it cannot drift from the shipped binary the way prose did.
#
#   declared[*].probe  MUST lower to non-empty WAT   (a REFUSED declared
#                      construct means a capability regressed, or the
#                      contract over-claims)
#   refused[*].probe   MUST return Err(BackendError)  (an EMITTING refused
#                      construct means the contract under-claims, i.e. the
#                      exact PMAT-1350 failure recurring)
#
# HOW TO EXTEND: a slice that widens the emitter MUST add a `declared` entry
# in the same PR (and delete the corresponding `refused` entry if it had
# one). That is the whole point — the gate reds otherwise. Probes are the
# smallest program WITH REAL CONTENT that exercises the construct; an empty
# or trivially-constant program can lower for reasons unrelated to the
# construct and would make the entry vacuous.
# ---------------------------------------------------------------------------
emit_surface:
  declared:
    - id: scalar-int-arith
      note: "i64 arithmetic under the C-PY-INT-ARITH overflow posture, incl. the Python floor correction for // and %."
      probe: |
        def f(a: int, b: int) -> int:
            return (a * b + 7) // 2 - (a % 3)

    - id: scalar-float-arith
      note: "f64 arithmetic."
      probe: |
        def f(x: float) -> float:
            return x * 2.0 - 0.25

    - id: scalar-bool-logic
      note: "Bool lowers to i32 0/1; and/or short-circuit."
      probe: |
        def f(a: int, b: int) -> bool:
            return (a > 0) and (b > 0 or a < 10)

    - id: control-if-while-for
      note: "Let/Assign/If/elif/else/While/Break/Continue/Return plus for-in-range, arbitrarily nested."
      probe: |
        def f(n: int) -> int:
            t: int = 0
            for i in range(n):
                if i % 2 == 0:
                    t = t + i
                elif i == 3:
                    continue
                else:
                    t = t - 1
            while t > 100:
                t = t - 10
            return t

    - id: direct-call-and-recursion
      note: "Direct calls between emitted functions, including self-recursion."
      probe: |
        def fact(n: int) -> int:
            if n <= 1:
                return 1
            return n * fact(n - 1)

        def f() -> int:
            return fact(5)

    - id: num-builtins
      note: "The int-valued builtin family (abs/min/max) usable as an int operand."
      probe: |
        def f(a: int, b: int) -> int:
            return abs(a) + min(a, b) + max(a, b)

    - id: str-literal-len-index
      note: "Length-prefixed UTF-8 string runtime in linear memory: literals, len(), indexing."
      probe: |
        def f() -> int:
            s: str = "hello"
            return len(s) + ord(s[1])

    - id: str-concat-compare
      note: "Concatenation and structural equality over the string runtime."
      probe: |
        def f() -> bool:
            a: str = "foo"
            b: str = "bar"
            return (a + b) == "foobar"

    - id: str-search-family
      note: "startswith / endswith / `in` / find over the string runtime."
      probe: |
        def f() -> bool:
            s: str = "hello world"
            return s.startswith("hello") and ("wor" in s)

    - id: str-slice-stepped
      note: "Stepped slice s[i:j:k] with a CONST step; negative stride requires BOTH bounds omitted (PMAT-1327/1331)."
      probe: |
        def f() -> int:
            s: str = "hello"
            return len(s[::-1]) + len(s[1:4])

    - id: fstring-interpolation
      note: "f-string interpolation of int/str/bool operands into the string runtime."
      probe: |
        def f(n: int) -> int:
            s: str = f"n={n}"
            return len(s)

    - id: list-int-elements
      note: "list[int] over the bump heap: literal, index read, index store."
      probe: |
        def f() -> int:
            xs: list[int] = [1, 2, 3]
            xs[0] = 9
            return xs[0] + xs[2]

    - id: list-float-elements
      note: "list[float] — f64 elements with a natural f64.load."
      probe: |
        def f() -> float:
            xs: list[float] = [1.5, 2.5]
            return xs[0] + xs[1]

    - id: list-bool-elements
      note: "list[bool] — i32 0/1 elements."
      probe: |
        def f() -> bool:
            xs: list[bool] = [True, False]
            return xs[0]

    - id: list-mutation-family
      note: "append / insert / pop / pop(i) / del xs[i] / remove — the full Stmt::ListMutate family."
      probe: |
        def f() -> int:
            xs: list[int] = [1, 2, 3]
            xs.append(4)
            xs.insert(0, 9)
            xs.pop()
            del xs[0]
            xs.remove(2)
            return len(xs)

    - id: list-reductions
      note: "len / sum / min / max over a list."
      probe: |
        def f() -> int:
            xs: list[int] = [3, 1, 2]
            return sum(xs) + min(xs) + max(xs) + len(xs)

    - id: dict-int-keyed
      note: "dict[int, int] over the bump heap: literal, keyed read, keyed store, len."
      probe: |
        def f() -> int:
            d: dict[int, int] = {1: 10, 2: 20}
            d[3] = 30
            return d[1] + d[3] + len(d)

    - id: dict-str-keyed
      note: "dict[str, int] — str keys hashed through the string runtime."
      probe: |
        def f() -> int:
            d: dict[str, int] = {"a": 1, "b": 2}
            return d["a"] + d["b"]

    - id: dict-str-valued
      note: "dict[K, str] — values stored as an i32 base-pointer in the i64 slot."
      probe: |
        def f() -> int:
            d: dict[str, str] = {"a": "xy"}
            return len(d["a"])

    - id: dict-bool-valued
      note: "dict[K, bool] — i32 0/1 widened into the i64 slot, read back as a bool."
      probe: |
        def f() -> bool:
            d: dict[str, bool] = {"a": True}
            return d["a"]

    - id: dict-float-valued
      note: "dict[K, float] — f64 bits reinterpreted through the i64 slot."
      probe: |
        def f() -> float:
            d: dict[int, float] = {1: 1.5}
            return d[1]

    - id: dict-iteration
      note: "for k in d / d.keys() — insertion-ordered iteration over the keyed table."
      probe: |
        def f() -> int:
            d: dict[str, int] = {"a": 1, "b": 2}
            t: int = 0
            for k in d:
                t = t + d[k]
            return t

    - id: dict-view-materialisation
      note: >-
        PMAT-1365. `list(d)` / `list(d.keys())` / `list(d.values())` bind a
        `list[int]` from a dict view — the first ORDER-OBSERVING dict
        materialisation (`sorted(d)` / `sum(d)` re-sort or fold commutatively,
        so they never observe storage order). Emitted ONLY while the whole
        module preserves Python insertion order; see the `dict-view-after-removal`
        refusal for the other half.
      probe: |
        def f() -> int:
            d: dict[int, int] = {3: 30, 1: 10, 2: 20}
            ks: list[int] = list(d)
            vs: list[int] = list(d.values())
            return ks[0] * 100 + ks[1] * 10 + vs[0]

    - id: set-int-elements
      note: "set[int] — literal, len, membership."
      probe: |
        def f() -> int:
            s: set[int] = {1, 2, 3}
            return len(s)

    - id: set-str-elements
      note: "set[str] — elements hashed through the string runtime."
      probe: |
        def f() -> int:
            s: set[str] = {"a", "b"}
            return len(s)

    - id: set-membership
      note: "`x in s` over a set."
      probe: |
        def f() -> bool:
            s: set[int] = {1, 2, 3}
            return 2 in s

    - id: truthiness-reductions
      note: "any() / all() over the truthiness family (list / set / dict keys / dict values)."
      probe: |
        def f() -> bool:
            xs: list[int] = [1, 2, 0]
            return any(xs) and not all(xs)

    - id: struct-scalar-fields
      note: "A class with a straight-line __init__ and SCALAR fields, as an i32 base-pointer local."
      probe: |
        class P:
            def __init__(self, x: int) -> None:
                self.x = x

        def f() -> int:
            p = P(5)
            return p.x

    - id: struct-mutating-method
      note: "A `&mut self` method storing back into a scalar field."
      probe: |
        class P:
            def __init__(self, x: int) -> None:
                self.x = x

            def bump(self) -> None:
                self.x = self.x + 1

        def f() -> int:
            p = P(1)
            p.bump()
            return p.x

    # PMAT-1366 (2026-07-27) — the 1-arg `round(x)`. `f64.nearest` is IEEE
    # roundToIntegralTiesToEven, which is EXACTLY Python's banker's rounding
    # (round(2.5) == 2, round(3.5) == 4) — unlike Rust's half-away-from-zero
    # `f64::round`, which the Rust lane has to spell `round_ties_even()`.
    # The integral result narrows to the Python `int` with `i64.trunc_f64_s`.
    - id: round-to-int
      note: "1-arg round(x) over a float -> int, via the native round-half-to-EVEN f64.nearest."
      probe: |
        def f(x: float) -> int:
            return round(x) + round(2.5)

    # PMAT-1366 (2026-07-27) — module-level scalar constants. Before this
    # slice a single `NAME = <literal>` at module scope took the WHOLE module
    # out of the lane. Each now emits once as an IMMUTABLE
    # `(global $NAME <ty> (<ty>.const v))`; reads are `global.get`. The
    # frontend refuses any param/local that would shadow one, so nothing can
    # rebind it and `global.set` is never emitted.
    - id: module-scalar-const
      note: "Module-level int/bool/float constants as immutable WASM globals, read via global.get."
      probe: |
        SCALE: int = 7
        RATE: float = 2.5
        ON: bool = True

        def f(n: int) -> int:
            if ON:
                return n * SCALE + round(RATE)
            return 0

  refused:
    - id: tuple-type
      note: "Tuples have no heap layout in the WASM lane. Standing refusal since PMAT-951."
      probe: |
        def f() -> int:
            t: tuple[int, int] = (1, 2)
            return t[0]

    - id: print-statement
      note: "No host I/O in the emitted module — the WASM lane emits a pure computational module with no import section."
      probe: |
        def f() -> None:
            print("hi")

    - id: closure-lambda
      note: "No closure conversion; WASM has no first-class function values in this lane."
      probe: |
        def f() -> int:
            g = lambda x: x + 1
            return g(1)

    - id: bigint-literal
      stage: frontend
      note: "An integer literal outside i64 range — bigint promotion is not implemented at v0.1.0. Refused at the FRONTEND (target-independent), not by the WASM backend."
      probe: |
        def f() -> int:
            return 123456789012345678901234567890

    - id: list-of-str
      note: "list[str] — the biggest compositional hole; blocks s.split() and ','.join(xs). Queued for 0.1.618."
      probe: |
        def f() -> int:
            xs: list[str] = ["a", "b"]
            return len(xs)

    - id: nested-list
      note: "list[list[...]] — recursive element kinds are refused."
      probe: |
        def f() -> int:
            xs: list[list[int]] = [[1]]
            return len(xs)

    - id: nested-dict-value
      note: "dict[K, dict[...]] / dict[K, list[...]] — recursive value kinds are refused."
      probe: |
        def f() -> int:
            d: dict[str, list[int]] = {}
            return len(d)

    - id: container-valued-struct-field
      note: "A struct field holding a container — scalar fields only."
      probe: |
        class P:
            def __init__(self) -> None:
                self.d: dict[str, int] = {}

        def f() -> int:
            p = P()
            return len(p.d)

    - id: set-of-float
      stage: frontend
      note: >-
        set[float]. Refused at the FRONTEND, for ALL targets, with a
        Rust-lane reason (`f64` is not `Eq`/`Hash`, so it cannot key a
        Rust HashSet) — the WASM backend never sees it. Recorded here
        precisely because the distinction is invisible from the CLI:
        `xpile transpile --target wasm` prints one refusal either way.
        The WASM lane has its OWN reason to refuse it (an f64-bit-pattern
        hash is unsound over ±0.0/NaN, the same reason whole-dict `==`
        over float values refuses), but that reason is currently
        unreachable and so is NOT what this row witnesses.
      probe: |
        def f() -> int:
            s: set[float] = {1.5}
            return len(s)

    - id: dict-tuple-key
      note: "Composite keys have no heap layout — keys are int or str only."
      probe: |
        def f() -> int:
            d: dict[tuple[int, int], int] = {}
            return len(d)

    - id: str-of-float
      note: "str(float) needs a dtoa with CPython repr-shortest semantics. Queued for 0.1.618."
      probe: |
        def f() -> int:
            x: float = 1.5
            return len(str(x))

    - id: dict-view-after-removal
      note: >-
        PMAT-1365, the RED half of `dict-view-materialisation`. A dict removal
        (`del d[k]` / `d.pop(k)`) is swap-last-into-hole, so the surviving keys
        are no longer in insertion order; a `set` is stored in xpile-INSERTION
        order while CPython iterates it in HASH order. Either hazard ANYWHERE in
        the module makes an order-OBSERVING `list(d)` potentially divergent from
        CPython, so the backend refuses it rather than emitting a plausible wrong
        order. `sorted(d)` and `sum/min/max(d)` stay available and still emit.
      probe: |
        def f() -> int:
            d: dict[int, int] = {3: 30, 1: 10, 2: 20}
            del d[3]
            ks: list[int] = list(d)
            return ks[0]

    - id: round-to-digits
      note: >-
        PMAT-1366, the RED half of `round-to-int`. The 1-arg `round(x)` is one
        native instruction; the 2-arg `round(x, n)` is NOT the same problem.
        CPython (and the Rust lane, PMAT-502al) get decimal rounding right by
        formatting to `n` places with round-half-to-even and reparsing — the
        WASM subset has no dtoa/strtod. The obvious `x*10**n` scale-round-unscale
        is NOT equivalent: it rounds the BINARY image of the scaled value, so
        `round(2.675, 2)` would answer 2.68 where CPython answers 2.67. Refused
        rather than approximated. `round(int, n)` is refused for the same reason
        (it needs `10**(-n)` scaling in i128 to stay overflow-honest).
      probe: |
        def f(x: float) -> float:
            return round(x, 2)

equations:
  wasm_emission_structure_extensionality_diamond:
    # Tier-defining Diamond equation (depth-1). Machine-checked by the
    # lake-build pilot — see contracts/lean/XlateRustToWasm.lean. An
    # emitted WAT function is determined by its structural signature
    # (name, ordered param value-types, result value-type), mirroring the
    # str/list/float/set/wgsl structural Diamonds.
    lean_theorem: "XpileContracts.CCompileRustToWasm.wasm_emission_structure_extensionality_diamond"
    lean_file: "contracts/lean/XlateRustToWasm.lean"
    formula: |
      ∀ a b : WasmFunc.
        a.name = b.name → a.params = b.params → a.result = b.result →
        a = b
      (an emitted WAT function is determined by its structural signature)
    domain: |
      Any emitted WAT function as xpile-wasm-codegen produces it, modelled
      by its `$name`, the ordered list of param WASM value-types, and the
      result WASM value-type.
    invariants:
      - "FIRST Diamond-tier theorem of C-COMPILE-RUST-TO-WASM (registers it at depth-1)"
      - "structure extensionality over the emitted function's signature (sorry-free, core-only)"
      - "execution-semantics agreement (the wasm-runtime DiffExec witness) is the runtime-stratum tier, EXECUTED via WasmDiffExecEngine over WABT (PMAT-952 runtime-witness half)"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
    postconditions:
      - "WASM-emitting code carries citation C-COMPILE-RUST-TO-WASM"

  scalar_emission_is_well_formed_wat:
    formula: |
      lower(scalar_control_fn, BackendConfig{target: Wasm})
        produces wat_text containing a `(module …)` with a `(func $name …)`
        declaration and a matching `(export "name" (func $name))`
    domain: |
      A meta-HIR function over the scalar/control subset (i64/i32/f64/f32/
      bool locals; Let/Assign/If/While/Break/Continue/Return; BinOp/
      FloatBinOp/UnOp/comparisons/IfExpr/direct Call) lowered to a WAT
      module.
    invariants:
      - "emitted WAT opens a `(module` form"
      - "every function emits a `(func $name …)` declaration and an export"
      - "params/result use only i64/i32/f64/f32 value types"
      - "Bool lowers to i32 (0/1); I64/CLong to i64; F64 to f64; F32 to f32"
      - "FloorDiv/Mod route through the Python floor-correction helpers"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
      - "every value type in the function is in the scalar subset"
    postconditions:
      - "emitted WAT assembles to a valid WASM module (wat2wasm / wasm-validate)"
      - "WASM-emitting code carries citation C-COMPILE-RUST-TO-WASM"

  out_of_subset_is_refused:
    # PMAT-1350: "the subset" is now `emit_surface`, not a prose list. The
    # previous formula enumerated str|list|dict|set|struct as refused; all
    # five emit. The refused set is `emit_surface.refused`, and BOTH halves
    # are executed by crates/xpile/tests/wasm_contract_surface.rs.
    formula: |
      ∀ p ∈ emit_surface.refused.
        lower(p.probe, BackendConfig{target: Wasm})
          == Err(BackendError::Lower("unsupported construct — …"))
      ∧
      ∀ p ∈ emit_surface.declared.
        lower(p.probe, BackendConfig{target: Wasm}) == Ok(wat) ∧ wat ≠ ""
    domain: |
      Any function touching a type or construct outside the DECLARED subset
      (`emit_surface.declared`). The standing refusals are enumerated in
      `emit_surface.refused`: tuple, print, closures, bigint, list[str],
      nested list, nested dict value, container-valued struct field,
      set[float], composite dict key, str(float).
    invariants:
      - "a refused construct yields a hard BackendError, never wrong WAT"
      - "the refusal names the offending construct (honest diagnostic)"
      - "the DECLARED direction is checked too: a declared construct that stops emitting is a regression, not a tightening"
    preconditions:
      - "BackendConfig.target == Target::Wasm"
    postconditions:
      - "no WAT text is emitted for an out-of-subset function"
      - "every `emit_surface.declared` probe lowers to non-empty WAT"

proof_obligations:
  - type: postcondition
    property: emitted WAT is a well-formed WebAssembly module
    formal: "wat2wasm(emitted_wat) succeeds"
    applies_to: scalar_emission_is_well_formed_wat

  - type: postcondition
    property: out-of-subset constructs are refused, never miscompiled
    formal: "lower(out_of_subset) == Err(_)"
    applies_to: out_of_subset_is_refused

  - type: frame
    property: lower() does not mutate the input meta-HIR module
    formal: "modifies() == ∅"
    applies_to: all

  - type: precondition
    property: backend citation is recorded
    formal: "Artifact.citations contains C-COMPILE-RUST-TO-WASM"
    applies_to: all

falsification_tests:
  - id: FALSIFY-COMPILE-WASM-001
    rule: |
      Emitted WAT MUST be a well-formed WebAssembly module — a `(module …)`
      with a `(func $name …)` and a matching export, assembling cleanly via
      wat2wasm.
    prediction: |
      `wat2wasm(emitted)` succeeds for every scalar/control function.
    test: |
      cargo test -p xpile-wasm-codegen --lib
    if_fails: |
      The emitter regressed to ill-formed WAT (stack-type mismatch, missing
      local declaration, unbalanced block/loop). Likely cause: a new BinOp
      or control arm emitting the wrong value-type instruction.
    ship_blocking: true
    counter_example_classes:
      - stack_type_mismatch
      - missing_local_decl
      - unbalanced_block_loop

  - id: FALSIFY-COMPILE-WASM-002
    rule: |
      A construct outside the DECLARED subset (`emit_surface.declared`)
      MUST be refused with a hard error, NEVER emitted as wrong WAT.
      Symmetrically, every construct the contract DECLARES must emit — the
      contract may neither over-claim nor under-claim the surface.
    prediction: |
      For every `emit_surface.refused` probe, `lower` returns
      `Err(BackendError::Lower(...))` naming the construct; for every
      `emit_surface.declared` probe, `lower` returns non-empty WAT.
    test: |
      cargo test -p xpile --test wasm_contract_surface
      cargo test -p xpile-wasm-codegen --lib
    if_fails: |
      One of two failures, and the test message says which. UNDER-CLAIM:
      a construct listed as refused actually emits — the contract is stale
      against a capability slice that widened the emitter without widening
      `emit_surface`. This is the PMAT-1350 failure itself, and it is the
      one that makes the ship-blocking claim above worthless, because it
      is the claim readers use to decide what they may rely on.
      OVER-CLAIM/REGRESSION: a declared construct stopped emitting — a
      capability regressed, or the declaration was never true.
    ship_blocking: true
    counter_example_classes:
      - silent_miscompile_of_aggregate
      - unsupported_type_emitted
      - refused_construct_actually_emits
      - declared_construct_refuses
