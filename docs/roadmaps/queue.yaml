  title: Pin the wasi job's wasmtime + XPILE-CI-INSTALL-001 toolchain-install honesty gate
  notes_done: 'DONE 2026-07-26. Picked OUT OF QUEUE ORDER because main was red: the advisory `wasi` job
    FAILED on ccb95a04 — the exact SHA tagged v0.1.617 — while passing on ef53c281 an hour earlier with
    no change to the job. FLAKY, not broken, which is worse: a green run proved nothing about the next
    one. ** ROOT CAUSE read out of the runner log, not guessed: `curl -fsSL https://wasmtime.dev/install.sh
    | bash` resolves its version by scraping api.github.com/.../releases/latest UNAUTHENTICATED. Actions
    runners share egress IPs, so that call is rate-limited in bursts; the rate-limit body has no `tag_name`,
    so the installer''s sed pipeline degrades the whole JSON document to its FIRST CHARACTER — the literal
    `{`. It printed `Could not download Wasmtime version ''{''` AND EXITED 0. The install step went GREEN
    with nothing installed and the job died a step later on `wasmtime: command not found` (127), naming
    neither the installer nor the cause. ** FIX: pin WASMTIME_VERSION=v47.0.2, fetch the release ASSET
    directly (asset downloads are not API-rate-limited), mirroring the `docs` job''s existing PMAT_VERSION
    precedent. Verify IN-STEP BY ABSOLUTE PATH — this is the load-bearing detail: $GITHUB_PATH only takes
    effect in SUBSEQUENT steps, so a bare `wasmtime --version` in the install step would not even resolve,
    and a downstream check blames the wrong step. ** SWEEP: every other $GITHUB_PATH installer had the
    same shape — elan (x2), pmat, mdbook all gained in-step verification; mdbook''s `curl -sSL` gained
    the missing `-f` (without it curl exits 0 on an HTTP error and pipes the error PAGE into tar). **
    GATE crates/xpile/tests/ci_tool_install.rs (XPILE-CI-INSTALL-001), 4 static tests, std::fs only, cannot
    skip: in-step verification (>=4-step non-vacuity floor), `-f` on every install curl, a ban on wasmtime.dev/install.sh
    and `releases/latest` with the failure story as the message, and a regression pin that the wasi job
    pins a concrete vN.N.N and that a URL actually interpolates it (so the pin cannot become decorative).
    RED-THEN-GREEN shown in the PR body by restoring the literal pre-slice step. ** ALSO: ci.yml:164 still
    claimed the kani tripwire existed ''now that `kani` is a REQUIRED status context'' — false, and the
    inverse of the marker line 89 lines above it in the SAME FILE; a leftover of the six-hour 2026-07-05
    flip that PMAT-1347 reconciled everywhere else. Corrected. ** AND: the v0.1.617 release body listed
    `wasi` as advisory but never recorded that it was RED on the release SHA when the release was cut;
    the body now names it. LESSON: an advisory job going red is exactly as invisible as a job that does
    not exist unless something reads it. NEXT PICK: PMAT-1351 (Day 3 R2, non-gate — the negative-integer-literal
    list-index double-normalize). PMAT-1352 is also open and disjoint.'
