  notes: 'SEEDED, NOT SCHEDULED. Recorded now so the reasoning is not re-derived from scratch.

    All three witnesses PASS locally today at exactly the versions to pin: lean v4.15.0 (== the

    contracts/lean/lean-toolchain pin), ruchy 4.2.1, forjar 1.10.0; combined wall time ~1.3s.

    Measured install cost from a real runner log: elan installer 0.23s + Lean toolchain 2.2s

    (252.6 MiB compressed, 1.3 GB unpacked); ruchy tarball ~3.3 MB; forjar musl tarball ~11.9 MB.

    DO NOT add elan to `workspace-test` — that is a REQUIRED merge-blocking job and it already

    carries a fetch-depth:0 checkout, the full workspace debug build and a Swatinem cache.

    Use a SEPARATE ADVISORY job with its own cache prefix-key.

    TRAP 1 — THE ELAN NO-OP: copying the lake-build step verbatim (`--default-toolchain none`,

    ci.yml:206-215) installs elan and changes NOTHING. Verified with a fresh ELAN_HOME that

    `lean --version` exits 1 ("no default toolchain configured") outside a lean-toolchain

    directory; the repo ROOT has none (only contracts/lean and contracts/lean-models) and the

    test CWD is crates/xpile, so `tool_present()` returns false and the witness skips GREEN with

    elan sitting right there on PATH. Must use

    `--default-toolchain "$(cat contracts/lean/lean-toolchain)"` — read the FILE, never retype

    the version.

    TRAP 2: verify `"$HOME/.elan/bin/lean" --version` by ABSOLUTE path, NOT `elan --version` —

    `elan --version` succeeds with no toolchain installed and would green the exact failure mode

    being fixed. XPILE-CI-INSTALL-001 (crates/xpile/tests/ci_tool_install.rs) enforces in-step

    absolute-path verification, `-f` on every install curl, no `releases/latest`, and no

    self-versioning install script.

    TRAP 3: adding a CI job REDS

    `ruleset_drift.rs::advisory_markers_are_exactly_the_unrequired_ci_jobs` unless

    `# XPILE-ENFORCEMENT ADVISORY-CONTEXTS:` at .github/workflows/ci.yml:75 gains `backend-exec`

    in the SAME commit (keep the list sorted).

    TRAP 4: without an `XPILE_REQUIRE_LEAN` / `_RUCHY` / `_FORJAR` env tripwire in each witness''s

    skip branch, the job is DECORATIVE — delete an install step later and it silently returns to

    skip-green. Env var scoped to the new job, NEVER `CI=true`: workspace-test must keep skipping

    these three BY DESIGN.

    TRAP 5: advisory jobs are invisible until something reads them — `wasi` was RED on ccb95a04,

    the exact SHA tagged v0.1.617, and the release was cut anyway (PMAT-1370''s recorded lesson).

    Landing this without adding it to the Thursday release checklist buys evidence nobody looks at.

    DO NOT promote it to REQUIRED: the ruchy lane executes 7 of 34 curated fixtures and its

    ceiling is ruchy''s own toolchain — making an upstream release cadence a merge blocker imports

    someone else''s schedule into this repo''s merge queue.'
