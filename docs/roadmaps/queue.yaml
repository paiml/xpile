    limitation (`Unknown integer method: checked_sub`, `Cannot cast boolean to i64`, ...).

    ** MEASURED over all 38 fixtures, before -> after: emit 38->38, `ruchy check` 18->18, `ruchy

    run` exit-0 7->2, of which correct 1->1. The exit-0 count DROPPING is the point: five of the

