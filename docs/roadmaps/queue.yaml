- id: PMAT-1370
  status: done
  ev_rank: R1
  title: Pin the wasi job's wasmtime + XPILE-CI-INSTALL-001 toolchain-install honesty gate
  notes_done: 'DONE 2026-07-26. Picked OUT OF QUEUE ORDER because main was red: the advisory `wasi` job
    FAILED on ccb95a04 — the exact SHA tagged v0.1.617 — while passing on ef53c281 an hour earlier with
    no change to the job. FLAKY, not broken, which is worse: a green run proved nothing about the next
    one. ** ROOT CAUSE read out of the runner log, not guessed: `curl -fsSL https://wasmtime.dev/install.sh
    | bash` resolves its version by scraping api.github.com/.../releases/latest UNAUTHENTICATED. Actions
    runners share egress IPs, so that call is rate-limited in bursts; the rate-limit body has no `tag_name`,
    so the installer''s sed pipeline degrades the whole JSON document to its FIRST CHARACTER — the literal
    `{`. It printed `Could not download Wasmtime version ''{''` AND EXITED 0. The install step went GREEN
    with nothing installed and the job died a step later on `wasmtime: command not found` (127), naming
    neither the installer nor the cause. ** FIX: pin WASMTIME_VERSION=v47.0.2, fetch the release ASSET
