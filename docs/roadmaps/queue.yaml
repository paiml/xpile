  notes: 'PICKED as the lowest-numbered OPEN item dated <= today, R1 within the day being taken
    already (PMAT-1388 shipped as #1975 before this slate merged).

    ** THE DEFECT, measured through the shipped CLI at c1d7db19 BEFORE fixing. `def f(a: int, /,
    b: int = 2) -> int: return b` with `def run(): return f(9)` prints 2 under CPython. `xpile
    transpile --target rust` exited 0 with ZERO bytes of stderr and emitted `pub fn f(b: i64)`
    — `a` deleted — with the call site `f(9i64)`, so 9 re-bound to `b`. rustc accepted it and
    the binary printed 9. The DEFAULTED second parameter is the load-bearing detail: once `a` is
    dropped the call site has exactly as many arguments as the mutilated signature has
    parameters, so nothing downstream can notice. wasm/lean/ruchy all exited 0 the same way.

    ** ROOT CAUSE: crates/depyler-frontend/src/lib.rs lower_function guarded kwonlyargs/kwarg but
    never read f.args.posonlyargs, and the param loop iterates f.args.args alone. The scope bound
    in the slate held on re-measurement: desugar_nested_fn and desugar_closure_assign already
    refused `/`; module-level functions were the only leak.

    ** THE FIX: its OWN refusal arm naming positional-only parameters and the `/` separator, not
    an extra disjunct on the keyword-only guard — a caller told "keyword-only args / **kwargs"
    for a `/` inspects the wrong end of the signature. Splitting refusals by KIND is the standing
    lesson from PMAT-1371/1377.

    ** THE WITNESS: crates/xpile/tests/posonly_param_witness.rs (XPILE-POSONLY-001, NEW FILE, so
    not a gate touch), 4 tests, 0.19s MEASURED via `--nocapture` rather than assumed. Load-bearing
    assertion is the RELATION the defect violated, not a list of spellings that must refuse: for
    every probe and every lane, either the frontend refuses or every parameter the `def` declares
    appears in the emitted signature. That survives `/` ever being SUPPORTED. RED HALF RUN: with
    the frontend edit stashed it fails with 16 violations (4 `/` probes x 4 lanes) and the
    refusal-wording test fails too; the 2 controls pass on both sides, which is the shape a real
    red-then-green has. The execution half transpiles + rustc-compiles + RUNS the `/`-free
    control and diffs against CPython (both 2; the Rust side printed 9 pre-fix), and prints both
    observed values plus its wall clock so a reader can tell a differential from a silent skip.

    ** TWO TRAPS HIT AND RECORDED. (a) The first probe corpus named its parameters `a`/`b`; the
    WAT lane ALWAYS emits an `__wasm_floordiv_i64` helper with `(param $a i64) (param $b i64)`,
