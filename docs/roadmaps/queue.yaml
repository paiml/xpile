  notes: 'FOUND WHILE MEASURING PMAT-1389, not by a hunt. Reproduce on main:

    python3 -c "import yaml; yaml.safe_load(open(''docs/roadmaps/roadmap.yaml''))"
    -> yaml.parser.ParserError: while parsing a block mapping ... expected <block end>

    ** THE DEFECT: the PMAT-1388 ledger row''s `description:` is a SINGLE-QUOTED YAML scalar, and
    three apostrophes inside it are written with ONE quote instead of the doubled `''` YAML
    requires — `is "xpile''s output, not a hardcoded shader"`, `box''s Vulkan adapter`, `crate''s
    own dummy_module()`. (Written here doubled; on main they are single.) The first lone quote
    ENDS the scalar, so everything after it is re-parsed as YAML structure and the file stops
    loading at the first line that looks like a mapping key (`items: Vec::new() }`). Note the
    SAME entry escapes correctly four lines earlier (`audit''s`), so this is a slip, not a
    convention.

    ** WHY NOTHING CAUGHT IT: crates/xpile/tests/roadmap_registration.rs asserts
    (1) every done queue item appears as a `- id:` ROW, (2) every cited id since the tag is
    registered, (3) the pre-commit guard paths exist. All three are `contains` / line matching
    over the raw text. The ledger gate therefore reports registration GREEN over a file no YAML
    parser can read — the exact reporter shape PMAT-1385/1386/1387/1390 keep finding, one level
    up, in the gate rather than the tool. `xpile attestations` and `xpile quorum` also scan this
    file textually, which is why the CLI does not fail either.

    ** THE FIX (S): double the three apostrophes. THE GATE (the actual slice): a test that
    PARSES both docs/roadmaps/*.yaml and fails if either does not load. Cheapest honest form is
    a new test file, NOT an edit to roadmap_registration.rs — that file is a gate and the
    gate chain is pinned by PMAT-1373''s gate_touch:3 this window. Check whether the workspace
    already has serde_yaml in dev-deps; if not, a 3-line scalar-quoting linter over the file is
    still strictly better than nothing, but prefer a real parser.

    ** ACCEPTANCE: the reproducer above exits 0; the new test FAILS when any one apostrophe is
    un-doubled again (run the red half); roadmap_registration.rs still passes UNCHANGED.

    ** DONE 2026-07-27. All three acceptance criteria MET and measured. serde_yaml WAS already
    a dev-dep of crates/xpile (PMAT-484), so the real parser was available and the 3-line
    linter fallback was not needed. Gate shipped as crates/xpile/tests/roadmap_ledger_parses.rs
    (XPILE-LEDGER-002, 4 tests, 0.27 s measured) — a NEW file; roadmap_registration.rs is
    byte-unchanged, so gate_touch #3 (PMAT-1373) is unperturbed. The fourth assertion is the
