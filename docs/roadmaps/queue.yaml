- id: PMAT-1421
  date: '2026-07-28'
  ev_rank: R1
  gate_touch: null
  status: done
  title: five stale inverse arms in the WAT lift - bare `i64.add`/`sub`/`mul`/`shl`/`shr_s` were
    mapped to the high-level meta-HIR operators long after the emit stopped producing them, so
    hand-written WAT got PYTHON semantics and re-emitted to a different running value at exit 0
    (`1024 i64.shr_s 70` is 16 at the source, 0 after the round trip)
  notes: 'SHIPPED 2026-07-28 from an honesty hunt (ranked queue exhausted until Thu 07-30).
    PMAT-1420''s standing lead (c) taken verbatim: `.ruchy` and `.wat` were the last two frontend
    families never swept to their subset ceilings. `.ruchy` came back HONEST - registered "routing
    only - INPUT refuses, no parser" and `xpile info` prints exactly that. `.wat` is a real
    lowering frontend and its opcode table had rotted. THE TELL WAS A CODE COMMENT ALREADY IN THE
    FILE: lib.rs:719 (PMAT-1402) states that `+`/`-`/`*` "stopped emitting bare
    i64.add/i64.sub/i64.mul and started emitting these calls" - the fact that falsifies the arms
    540 lines below was written down and read as a note about the NEW arms, not as a death
    certificate for the old ones. Re-derived the emit''s user-body opcode set FROM THE BINARY
    (transpile a Python module using every operator, strip the `$__wasm_*` prelude the lift skips
    at lib.rs:195): `i64.{and,or,xor}` + comparisons + `f64.{add,sub,mul,div}`. The five bare
    mnemonics are emitted ONLY inside the prelude, so the arms fired only on input the emit does
    not produce - exactly the hand-written/third-party WAT the advertised frontend exists for.
    EXECUTED under wasm-interp, both legs wat2wasm-clean, exit 0 throughout: `1024 i64.shr_s 70`
    -> 16 vs 0 (SILENT wrong answer, WASM masks the count mod 64 where the helper saturates to
    63); `1 i64.shl 70` 64 vs trap; i64::MAX+1, i64::MIN-1, 2^62*4 each wrap in WASM and trap in
    the helper. In-domain the two agree byte-for-byte, which is why no fixture saw it. Frontend
    defect => reached all 9 backends (verified wasm/rust/forjar). FIX = REFUSE naming the specific
    helper per mnemonic (PMAT-1395: coercing to one of two incompatible semantics installs a
    silent wrong answer; PMAT-1392 precedent in this same file for i32.const). `int_binop` now
    returns Result so the guard is at the SINGLE decision point for all three lift sites.
    OVER-REFUSAL BOUND MEASURED FIRST: zero tracked `.wat` files, and all 13 pre-existing
    round-trip fixed-point fixtures stay green - including roundtrip_shift_and_arith, which
    exercises all five operators via the helpers. RED HALF RUN 3x (arms restored -> 3 tests red
    with the 16-vs-0 message; guard widened to i64.and -> the differential AND a pre-existing
    fixture red; premise-test filter/fixture broken -> its negative and its vacuity guard red).
    STANDING LESSON: when a slice MOVES an operator onto a new lowering, the old inverse does not
    become wrong-and-DEAD, it becomes wrong-and-LIVE for exactly the inputs the new lowering never
    produces - and a right-inverse-on-image property CANNOT see it, because the image shrank and
    the fixed point over the smaller image stays green. Grep the inverse table on every re-route.
    No witness floor touched; no gate file edited. NEXT PICK: PMAT-1373 (release commit) on Thu
    07-30; a fire before then should hunt again. STANDING LEADS from this slice: (a) meta-HIR has
    ONE integer arithmetic semantics and three source languages disagree with it - this and
    PMAT-1419''s C-int lead (a) are the same missing distinction, 0.1.619; (b) only the BINARY
    OPERATOR table was swept - `lift_call`, the unary/`i32.eqz` path and the f64 table were read
    but not swept against a re-derived emit opcode set the same way; (c) PMAT-1392''s deliberate
    `i32` -> Type::Bool residual is still live, so a hand-written `(param $a i32)` renders as
    `bool` on --target rust.'

