    `cargo:rerun-if-env-changed=CARGO_MANIFEST_DIR` reads like the exact remedy and does
    NOTHING — cargo does not track the variables it injects itself. Measured: with that line
    present, both failure modes survive verbatim. The executed differential in
    `build_script_path_independence.rs` carries it in the failing arm, so a later reader cannot
    re-adopt it on plausibility.


    ** STANDING LESSON, new shape for the honesty ledger: A SHARED CACHE MAKES A GENERATED FILE
    A CROSS-TREE CHANNEL. Any build script that writes an absolute path into OUT_DIR is
    publishing its own tree''s identity to every other tree that shares the target dir. The rule
    is that a generated file must name NOTHING outside OUT_DIR — stage the inputs in and emit
    relative paths. Corollary for future hunts: when a build breaks with paths you do not
    recognise, suspect the shared target dir BEFORE suspecting git.


    ** NEXT PICK: the queue STILL has no open item dated <= today; PMAT-1373 is 07-30 and
    PMAT-1374 is 07-31. HARD FREEZE Wed 2026-07-29 18:00 local — Tue 07-28 and Wed morning are
