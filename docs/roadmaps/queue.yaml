- id: PMAT-1404
  status: done
  ev_rank: R1
  gate_touch: null
  date: '2026-07-27'
  title: The WGSL/SPIR-V lanes silently HALVED a C `long` to `i32` at exit 0, collapsing the one distinction
    `Type::CLong` exists to carry — while the SAME lane refused to write down the value it was accepting
  notes: 'DONE 2026-07-27 (Day 2). SELF-DIRECTED under the queue''s "Days 2-3 capacity: the honesty hunt"
    clause, taking unswept-surface item (a) that PMAT-1401 named on its way out: the C -> {wgsl, spirv,
    ptx} direction. THE ID WAS CLAIMED IN THIS FILE BEFORE THE PR WAS OPENED, per PMAT-1401''s own closing
    lesson about the PMAT-1400 collision. ** THE DEFECT: decy-frontend introduced Type::CLong for exactly
    one purpose, stated in its own module docs — to keep the 64-bit C widths (long / long long / int64_t)
    APART from Type::I64, where the 32-bit C `int` and the width-less Python `int` both land. wgsl_emit.rs
    folded them straight back together (`Type::I64 | Type::CLong => Ok(WgslTy::I32)`) at BOTH type-map
    sites. `long f(long a) { return a + 1; }` emitted `fn f(a: i32) -> i32` at EXIT 0; half the declared
    domain of f cannot be passed to that function and nothing said so. SPIR-V inherited it verbatim. **
    NOT a documented posture: the lane already refuses the other three 64-bit C types, and the f64 refusal
    states the doctrine verbatim ("substituting f32 would change numeric results, so the WGSL subset refuses
    f64 rather than narrow it silently"). Signed `long` was the ONE 64-bit type taking the silent narrowing.
    ** THE SHAPE WORTH REMEMBERING — IT REFUSED TO WRITE DOWN WHAT IT SILENTLY ACCEPTED: `return 3000000000;`
    inside a `long` function refused ("the concrete type i32 cannot represent the abstract value 3000000000
    accurately") while the `long` PARAMETER carrying exactly that value emitted clean. The literal was
    caught incidentally BY NAGA; the parameter was not caught at all, because after map_type ran there
    was nothing left to catch — the type had already got smaller. A validator can only police the values
    you still ask it about, so a downstream validator is NOT a width gate. ** CROSS-BACKEND RECEIPT: same
    source, five backends, only the two GPU lanes lost the width (rust i64, wasm i64, ptx .s64) — so 64
    bits is correct and the WGSL refusal is a real lane limit, not xpile giving up. The refusal names
    those three alternatives. ** FIX refuses CLong at both sites via one shared CLONG_REFUSAL const; Type::I64
    DELIBERATELY still maps to i32 (refusing it would delete the lane — every Python function lowers through
    it — and an UNDECLARED width contradicts nothing the user wrote; the literal half is already PMAT-1401''s).
    ** GATE XPILE-CLONG64-001 (crates/xpile/tests/c_long_gpu_width_witness.rs, 5 tests, no skip path on
    any xpile assertion), 18 CLI-path probes; the refusal must NAME THE WIDTH, not merely be an Err. Each
    probe carries a FRONTEND-ACCEPTS PRECONDITION (must emit i64 on the Rust lane first) because a probe
    that fails to PARSE also "refuses" — THAT TRAP FIRED HERE: the first local_decl probe used a cast
    the C frontend does not support and the test NAMED it rather than passing. ** HONEST COVERAGE BOUNDARY:
    the list[…] element site is NOT CLI-reachable (decy cannot parse `xs[0]` at all; Python never makes
    CLong), so it is covered by a hand-built-meta-HIR unit test that says so in its own doc comment, NOT
    by a CLI probe that would have "passed" on a parse error. ** RED-THEN-GREEN both sites independently:
    scalar revert = 18/18 probes narrow, 3 of 5 tests red (the 2 that stay green are exactly the accept-side
    receipt and the vacuity guard — the evidence this is not a blanket refusal); list revert reds the
    unit test. ** NOT a gate_touch, NOT a witness_floor.rs touch (no GPU lane has a floor). ** NEXT PICK:
    the scheduled queue is STILL empty until Thu 2026-07-30 (PMAT-1373, the release commit; gate touch
    #3 is RESERVED for it). PMAT-1375 is 0.1.619 lane, DO NOT START. Days 2-3 remaining capacity: continue
    the honesty hunt on the surface PMAT-1401 listed, now with (a) CLOSED for the wgsl/spirv half — REMAINING
    are (b) `--emit-crate` and the hybrid `--emit-shims` paths, which no validator-acceptance property
