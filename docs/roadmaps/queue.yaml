    LESSONS. (1) ASK WHETHER THE ARTIFACT *IS* THE THING THE FLAG NAMES. Every honesty shape swept
    so far asked "is the emitted content right?"; this one is a level up — the content was never
    emitted. `--target spirv` is not "SPIR-V that is wrong", it is "not SPIR-V". Sweep the OTHER
    flags for the same question (`--emit-crate`, `--out`, `--hardware`). (2) A DOC CLAIM THAT NAMES
