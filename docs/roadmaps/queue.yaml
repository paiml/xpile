    Rust for 16 of 39; `rustc` compiles that Rust for 8 OF 39. TWENTY-ONE emitted artifacts do
    not parse as Ruchy AT ALL ("Expected RightBrace, found Let" / "found Match"), so for most of
    the corpus the claim fails at the FIRST step, before Rust is reached.
    ** WHAT WAS ALREADY HONEST, recorded so it is not re-derived: the checkmark itself
    (PMAT-1440 verified input-dependence for all nine backends), AND README''s SPECIFIC example
    -- `xpile transpile factorial.py --target ruchy  # -> Ruchy (compiles to Rust)` is TRUE,
    measured end to end: emits, parses, transpiles, and rustc compiles it. THE FALSEHOOD WAS THE
    UNIVERSAL, NOT THE INSTANCE -- the same shape as PMAT-1438''s shell-roundtrip transcript,
    which was also accurate under a false generalisation. Do not "correct" a true example.
    ** THE MEASUREMENT WAS WRONG THE FIRST TIME, AND IT WOULD HAVE BEEN A FABRICATED NUMBER
    INSIDE A FIX FOR FABRICATED NUMBERS. The first sweep reported `rustc compiles: 0 of 39`.
    Cause: `rustc -o /dev/null` makes rustc create a TEMP DIR beside its output, which fails
    with "couldn''t create a temp dir: Permission denied ... at path /dev/rmetax9waG4" -- an
    ENVIRONMENT error a naive harness reads as a COMPILE error. The tell was that a hand-run of
    the same file had looked fine; that hand-run was PIPED to `head`, so the exit code I read
    was head''s (the pipe-masks-exit-code trap, in my own notes). Correct invocation is
    `--out-dir <dir>`. LESSON: when a sweep returns an ABSOLUTE result (0 of N, N of N), suspect
    the harness before the subject, and re-derive it a second way.
    ** FIX. The Status cell links a measured table; the README diagram row states the ratio; and
    `ruchy_exec_witness.rs`''s header loses its three hard-coded denominators (it read 38/38,
    18/38, 8/38 -- a 39th fixture landed the morning after they were "re-measured", PMAT-1427,
    so every denominator was wrong while two numerators stayed right). Doc-comment change only,
    no gate logic touched.
    ** GATED by crates/xpile/tests/ruchy_conformance_witness.rs (XPILE-RUCHYCONF-001), and the
    SPLIT IS THE POINT: `ruchy` is installed in NO CI workflow (`grep -rn ruchy
    .github/workflows` -> nothing), so a toolchain gate is a developer-machine check by
    construction. (1) The WORDING rule runs EVERYWHERE, needs no toolchain, and is what holds
    the line in CI: no page may present "compiles to Rust" as an unqualified property of the
    lane. (2) The CORPUS-SIZE rule also runs everywhere: every denominator in the published
    table must equal the LIVE fixture count, so a new fixture reds the page in CI even where the
    counts cannot be checked -- which is exactly how the sibling `38` went stale unnoticed.
