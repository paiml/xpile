  notes_done: 'DONE 2026-07-26 (pulled forward from 07-29 under the day<=4 rule; nothing was dated <=
    Sun, gate touch #1 PMAT-1372 was merged at 621a3e83, so touch #2 was clear to start). ** THE ENTRY
