    table and the named non-vacuity check).
    ** A SKIPPED BEHAVIOUR HALF IS NOT A RUN ONE. The first attempt at the float perturbation
    patched crates/xpile-rust-codegen/src, where the string is not spelled, and the driver
    printed SKIPPED. Had that been read as a pass, one of the two behaviour halves would have
    been claimed without running. The ID is chosen in xpile-meta-hir/src/lib.rs:268, one crate
    up from where a lane-shaped guess put it.
    ** AND THE WITNESS CAUGHT ITS OWN CONCURRENCY BUG ON ITS FIRST RUN. Three tests each call
    `measure()`, cargo runs them on concurrent threads in ONE process, and the probe directory
    was keyed on pid + (type, lane) -- shared state between siblings. The first to finish deleted
