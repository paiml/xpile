    \  $X transpile $D/z.py --target lean --contracts off > $D/z.lean; echo \"xpile=$?\"   # 0\n  cat\
    \ $D/z.lean            # def f : Int := (Int.fdiv (7: Int) (0: Int))\n  printf '\\n#eval f\\n' >>\
    \ $D/z.lean\n  lean $D/z.lean; echo \"lean=$?\"                                                  \
    \   # prints 0, rc 0\n  python3 -c \"exec(open('$D/z.py').read()); print(f())\"                  \
    \            # ZeroDivisionError\nOther two legs, same shape: `a % b` -> `(Int.fmod a b)`, `#eval\
    \ f 7 0` => 7;\n`a / 0.0` -> `(a / (0: Float))`, `#eval f 1.0` => inf.\nCONTRAST — the SAME meta-HIR\
    \ through `--target rust` gets it right and says so (I re-ran it):\n  $X transpile $D/z.py --target\
    \ rust --contracts off | grep panic\n  -> if __fb == 0 { panic!(\"xpile: ZeroDivisionError: integer\
    \ division or modulo by zero\"); }\nDECISIVE COROBORATION — the lane already refuses exception machinery,\
    \ so a refusal here is\nCONSISTENT with its own posture: wrapping the same expression in `try/except\
    \ ZeroDivisionError`\ngives rc=1, \"Python `try`/`except` lowers to Rust `catch_unwind` ... with no\
    \ Lean counterpart\".\nIt refuses the HANDLER while silently miscompiling the RAISER.\n** PREFER THE\
    \ REFUSAL, NOT THE PANIC GUARD. Measured: Lean `panic!` does NOT give a non-zero exit —\na failing\
