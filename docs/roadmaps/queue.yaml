  notes: 'SHIPPED 2026-07-28 from an honesty hunt (fifth fire of the day; ranked queue exhausted
    until Thu 07-30). ★ FOUR LEADS RE-DERIVED FIRST, ALL FOUR CLEAN OR FALSE — PMAT-1427''s (a)
    field-subscript receiver (emits `&mut self` correctly), (b) "C int and long collapse to i64"
    (FALSE: `int`->`i32`, `long`->`i64`, and the whole unsigned family is right), (c) in-place list
    methods on a subscript receiver (all seven refuse at exit 1), and PMAT-1388''s next-pick (b)
