    \ tab-prefixes the `EOF` terminator ->\n      \"here-document at line 6 delimited by end-of-file\"\
    , `bash -n` rc=2.\n  (e) a bare `&` on its own line anywhere -> emitted verbatim, `bash -n` rc=2.\n\
    \nROOT CAUSES, exact. (a)/(b): `for chunk in arms_text.split(\";;\")` at\ncrates/bashrs-frontend/src/lib.rs:1312\
    \ never splits `;&`. (c)/(d): there is NO here-doc\nhandling at all — `spliced.lines().map(str::trim)`\
    \ at lib.rs:1428 plus\n`if line.is_empty() { continue }` at ~1433 trims EVERY source line and drops\
    \ EVERY blank\nline globally, so a here-doc body is re-tokenized as commands and space-joined by the\n\
    backend. DO NOT try to \"fix\" the trim; it ripples through every parser path. REFUSE.\n\nSKETCH —\
    \ all in crates/bashrs-frontend/src/lib.rs (line numbers at c3e468d4):\nA. In `parse_case` (starts\
    \ 1229), AFTER `arms_text` is bound (~1287) and BEFORE the split\n   at 1312:\n     if let Some(off)\
    \ = arms_text.find(\";&\") {\n         let form = if arms_text[..off].ends_with(';') { \";;&\" } else\
