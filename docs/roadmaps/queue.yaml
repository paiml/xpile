    rustpython-parser; (c) neither. ORIGINAL FRAMING, unchanged: while the workspace
    declares MIT OR Apache-2.0. rustpython-parser is ALSO the sole source of
    all 7 suppressed RUSTSEC advisories (deny.toml''s own comment says ''Revisit when rustpython-parser
