  title: 'the citation an emitted function carries is TYPE-DIRECTED and the book published it as a CONSTANT -- one sentence, false twice, on the page''s only statement about citations'
  notes: 'SHIPPED 2026-07-28 from an honesty hunt (ranked queue exhausted until Thu 07-30 /
    PMAT-1373). Took PMAT-1442 standing lead (d).
    ** THE DEFECT, one sentence in book/src/reference/frontends.md: "Each emitted
    Rust/Ruchy/Lean function carries a `// xpile-contract: C-PY-INT-ARITH` citation for the
    arithmetic contract." FALSE TWICE.
    ** (1) THE ID IS NOT CONSTANT. Measured over the CLI, one minimal function per Python type,
    on every code lane: int -> C-PY-INT-ARITH, float -> C-PY-FLOAT-ARITH, str ->
    C-XLATE-PY-STR-TO-RUST-STRING, bool -> C-XLATE-PY-BOOL-TO-RUST-BOOL. So "each ... function
    carries C-PY-INT-ARITH" is right for ONE TYPE OF FOUR, and a reader with a float function
    was pointed at the wrong contract.
    ** (2) `//` IS NOT THE LEAN FORM. The Lean lane emits `/-- xpile-contract: <ID> -/`. That is
    not an oversight: PMAT-1405 changed it DELIBERATELY, because a file `lean` must actually
    parse cannot carry the old `@[xpile_contract "..."]` attribute that nothing registers. THE
    EMITTER MOVED AND THE PAGE DID NOT -- it named the Rust comment syntax for a lane that would
    not compile with it.
    ** WHAT IS ALREADY HONEST, measured and recorded so it is not re-derived: EVERY OTHER site in
    the corpus is correct. backends.md gives `// xpile-contract: <ID>` for Rust and
    `/-- xpile-contract: <ID>[, <ID>]* -/` for Lean, both with PLACEHOLDERS; cli.md, contracts.md
    and adding-a-backend.md use `<ID>`; and the concrete C-PY-INT-ARITH in quickstart.md,
    python-to-rust.md, python-to-lean.md and README.md appears in TRANSCRIPTS OF int FUNCTIONS,
    where it is the right answer. ONE SITE UNIVERSALLY QUANTIFIED OVER A VALUE THAT VARIES; THE
    REST QUANTIFIED OVER A PLACEHOLDER. That is the tell worth carrying forward -- a doc that
    writes `<ID>` cannot go stale this way, and one that writes a literal can.
    ** FIX in crates/xpile/tests/citation_id_matrix_witness.rs (XPILE-CITEMATRIX-001). The false
    sentence becomes TWO measured tables between markers, compared to the CLI by EQUALITY: which
    contract by the function''s TYPE, and which comment form by LANE. Plus the FACTORISATION that
    makes two small tables legitimate instead of one twelve-cell matrix -- the ID depends on the
    type and NOT the lane, the form depends on the lane and NOT the type. Checking the
    factorisation is not decoration: without it `lean` could start citing something the other two
    do not and each table would still be individually satisfiable by picking a lane to believe.
    THE PROPERTY THAT MAKES THE DOCUMENTATION SHAPED THE WAY IT IS HAS TO BE THE PROPERTY UNDER
    TEST.
    ** NON-VACUITY, three ways: every cell must actually produce a citation (an emit with none
    fails rather than yielding an empty row); the ID set must contain MORE THAN ONE distinct
    value (otherwise the table has collapsed back into the constant this slice removed and would
    read as fixed again); and the Lean form must DIFFER from the Rust one, pinned so a regression
    to `//` reds BY NAME rather than as an opaque table diff.
    ** RED HALF RUN, SIX perturbations, green control: the original sentence restored; one wrong
    ID in the table; the Lean form published as `//`; a row dropped; and TWO BEHAVIOUR halves --
    making float cite C-PY-INT-ARITH in crates/xpile-meta-hir/src (reds the ID table) and making
