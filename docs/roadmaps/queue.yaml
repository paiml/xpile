- id: PMAT-1409
  status: done
  date: '2026-07-28'
  ev_rank: R3
  title: Run the dependency checks the repo already configured — `cargo deny check licenses` has NEVER
    executed and fails with 18 rejections incl. 10x LGPL-3.0-only in the shipped binary
  notes_done: 'DONE 2026-07-27 (Day 2, pulled forward from 07-28 under the day<=4 rule; nothing dated
    <= today was open). SCOPED TO VISIBILITY exactly as directed — no licence decision taken.

    ** THE TITLE''S OWN NUMBERS ARE WRONG AND THE CORRECTION IS PART OF THE SLICE: it is NINE rejection
    diagnostics over NINE crates (5x LGPL-3.0-only, 2x Zlib, 2x CC0-1.0), not 18 / 10x. The doubling is
    a `grep -c rejected` artifact — cargo-deny''s HUMAN output prints the word once in the headline and
    once in the label of every diagnostic, so a text count returns exactly double. Same class as PMAT-1408''s
    grep and PMAT-1396''s prose cardinality: the fix is to stop counting text. The tripwire parses `--format
    json`, and its module doc records why.

    ** DERIVED, NOT ASSERTED, and this is the fact that matters: the malachite family (5 crates) is LGPL-3.0-only
    and reaches the SHIPPED binary over NORMAL edges via rustpython-parser -> depyler-frontend -> xpile-core
    -> xpile. hexf-parse (CC0-1.0, naga -> wgpu) and foldhash 0.1.5/0.2.0 (Zlib, hashbrown -> wgpu) are
    ALSO linked; tiny-keccak (CC0-1.0) is build-script only and is NOT. The discriminator is `cargo tree
    -p xpile -e normal -i <crate>@<version>` and the gate RE-RUNS it per row — "copyleft in the binary"
    vs "copyleft in a build script" is the whole disclosure and it would otherwise rot into prose.

    ** SHIPPED: (1) NOTICE.md at the root — disclosure table + derive commands INSTEAD of counts (PMAT-1348''s
    rule applied to the new file itself; a bare "nine rejections" reds its own gate, demonstrated); (2)
    ADVISORY `license-scan` job — NOT a `gate` step, because `licenses` exits 4 today and would wedge
    every merge on day one; (3) crates/xpile/tests/dependency_license_policy.rs (XPILE-LICENSE-001), 7
    tests, stratified like ruleset_drift.rs.

    ** THE `continue-on-error` ON THE RAW CHECK IS A DELIBERATE DESIGN CHOICE, not laziness: a job whose
    verdict is "still 9 rejections" is red on every commit forever, and PMAT-1370 already recorded what
    that buys — `wasi` was RED on ccb95a04, the exact SHA tagged v0.1.617, and the release was cut anyway.
    A permanently-red advisory job is exactly as invisible as no job. So the raw output is in the log
    every run while the job''s PASS/FAIL is the DRIFT tripwire. A test asserts the TRIPWIRE step is not
    also continue-on-error, because that single line is the difference between a gate and a decoration.

    ** ROOT-CAUSE ASSERTION lives in the STATIC half (std::fs only, cannot skip): every check kind configured
    in deny.toml must be EXECUTED by some ci.yml job. Restoring the pre-slice ci.yml reds it naming ["bans",
    "licenses"] — the gate would have caught the original defect offline, at the commit that added the
    config. Generalise it: this is the third instance of declared-but-never-executed (unreachable RepairLoop,
    dead pre-commit hook, unrun deny sections) and the first one with a gate that generalises past its
    own instance.

    ** SIX FALSIFICATIONS RUN: pre-slice ci.yml; delete the malachite-q row (undisclosed); invent a ghost
    row (stale); reclassify hexf-parse binary -> build-only (reds against cargo tree); LGPL row -> dev-only;
    XPILE_REQUIRE_DENY=1 with cargo-deny off PATH (reds, while the unflagged run SKIPs with a printed
    reason).

    ** ⚠️ THE GATE''S OWN FIRST CI RUN FAILED AND THE BUG WAS IN THE GATE — the most transferable lesson
    here. `every_linkage_claim_is_re_derived_from_cargo_tree` shells out to `cargo tree`, and ci.yml sets
    `CARGO_TERM_COLOR: always` WORKFLOW-WIDE, so on a runner the tree arrives wrapped in ANSI escapes
    while locally cargo auto-disables colour (stdout is not a tty). The matcher walked past a line that
    visibly read `└── xpile v0.1.617 (…)` and reported the LGPL crate as UNLINKED — a FALSE ALARM in the
    safe direction this time, but the same blindness could as easily have gone the other way on the
    build-only row. 8/8 green locally proved NOTHING about the runner. Fixed twice over: `.env("CARGO_TERM_COLOR",
    "never")` on the child so the input is DETERMINISTIC rather than inherited, plus escape-stripping
    in the matcher. Measured which fix does what: with the env pin alone the live test passes even under
    `CARGO_TERM_COLOR=always`; the strip is defence-in-depth and is pinned by a unit test that reds without
    it. STANDING RULE: a test that parses a SUBPROCESS''s output must PIN that subprocess''s environment
    — inheriting CI''s env means the local run and the CI run are different experiments.

    ** PRE-EXISTING RED, NOT SLICE FALLOUT: `ruleset_drift::live_ruleset_matches_the_committed_snapshot`
    still reds locally on the `ruleset-workspace-test-dropped` owner decision. Unchanged by this slice
    and skips-with-reason in CI.

    ** DISCLOSED GAP: no crate''s `include` carries NOTICE.md, so it does not ship inside the .crate archives.
