# xpile autonomous work-queue — the next-pick source of truth.
#
# PMAT-859 / countermeasure #2 from the capability-vs-contract + stopping audit
# (audit-design.md §6; memory feedback-never-stop-status-updates). The recurring
# failure was "what to do next" being a human-prod-shaped decision, so the loop
# stalled whenever a slice finished. INVARIANT: the loop may end a turn ONLY when
# this queue is empty AND a refill hunt has been launched. Each firing: pop the
# top OPEN item, ship it to full-CI-green + release, mark done, chain the next.
#
# Ordering = EV (frequency x severity), goal-aligned (R6 contract-integrity and
# contract-carrying fidelity ahead of contractless breadth). Pulled from the
# corrected roadmap (memory project-roadmap-goals) + HUNT-V29 (34 confirmed).

updated: 2026-06-21 (V29-3 expr-or-default + V29-4 tuple-repeat shipped; R6-slice3 float-contract deferred — needs 1 Lean theorem + diamond eq + quorum entry, dedicated slice)
invariant: "never (queue has OPEN items AND main loop idle); a turn ends only on a genuine block or empty-queue+hunt-launched"

