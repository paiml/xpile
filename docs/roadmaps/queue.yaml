    readers: the payload went in BEFORE the `; Source WGSL` marker so `extract_wgsl_from_summary`
    (which advances to that marker) is untouched, every prior line stayed byte-identical, and all
    four pre-existing spirv/wgsl witness files stayed green unmodified. STANDING LEADS: (a) `Artifact.sidecars`
    is written by NO backend the CLI can reach and read by NO CLI code path — either wire it (`--out`
