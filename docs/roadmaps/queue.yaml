updated: '2026-07-28 (PMAT-1424 landed from an honesty hunt. The ranked queue stays exhausted
  until Thu 07-30 - PMAT-1373, the release commit. This slice took PMAT-1423''s standing lead (e)
  verbatim - the emit''s AGGREGATE lane (list/dict/str) had never been driven through emit->lift -
  and that lane came back HONEST (it emits a `(memory ...)` and the lift refuses it by name,
  citing PMAT-952). THE FINDING WAS THE ARM NEXT TO IT, read while confirming the negative
  result: the top-level `(export ...)` directive was skipped UNREAD on the comment "re-derived
  from the function on re-emit" - true of the INTERNAL symbol, false of the EXTERNAL name, and
  the external name is the only way a WASM host can call in. EXECUTED under wasm-interp with both
  legs wat2wasm-clean and a provenance-verified baseline binary: the source module answers
  `compute_total() => i64:42`, and after `xpile transpile z2.wat --target wasm` at exit 0 the
  round-tripped module answers `ct() => i64:42`. Three shapes corrupted silently and a fourth was
  refused with the wrong description. LESSONS WORTH KEEPING. (1) THE DEFECT WAS IN A DIFFERENT
  VOCABULARY - every witness in tests.rs, and all three preceding slices, measured INSTRUCTIONS;
  the module''s export surface had none, so three ABI rewrites sat underneath a round-trip fixed
  point that was genuinely holding. The oracle was right and the CORPUS could not express the
  question: single-function modules with self-named exports have no row that distinguishes an
  external name from an internal one. When a witness set has been wrong twice about its WIDTH,
  stop widening the corpus along the axis you already know and ask what OTHER vocabulary the emit
  has. (2) A NEGATIVE RESULT IS A READING OPPORTUNITY - the lead was honest, and the payload was
  three lines away in the same match block. (3) OVER-REFUSAL FIRED AGAIN, exactly as PMAT-1419
  recorded, and a PRE-EXISTING witness caught it: the guard placed before the body lift turned
  five instruction-level refusal witnesses into export diagnostics, because they pin those
  refusals on hand-written modules that happen to export nothing. It runs LAST. (4) 127 IS NOT A
  REFUSAL - the first red-half run reported exit=127 for all four shapes and read as a clean
  pass; it was a missing binary, because the worktree build ignored CARGO_TARGET_DIR and landed
  in the shared target dir. Every probe binary in this slice was provenance-verified by grepping
  it for its own new refusal string.)'
