owner_decisions:
- id: int-float-container-literal-policy
  summary: '`list[float] = [1, 2.5]` silently COERCES (compiles, prints [1.0, 2.5] vs CPython [1, 2.5])
    while `dict[str,float] = {''a'': 1}` and `tuple[float,float] = (1, 2.5)` accept-then-fail rustc with
    E0308. Coercing dict/tuple trades INVALID_RUST for SILENT_WRONG; refusing matches the OOP-`==` honesty
    precedent. Pick one policy before any code.'
- id: ruleset-reflip
  summary: Restore kani + lake-build as REQUIRED contexts on org ruleset 13878864. Org-admin only (the
    repo endpoint 404s). The proof lane is currently advisory, so a red proof job never blocks a merge.
