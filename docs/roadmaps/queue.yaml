    loudly when the toolchain is absent. A disclosed skip in front of a false pass is still a
    false pass, so the skip is confined to the half that genuinely cannot run.
    ** NO DENOMINATOR IS WRITTEN DOWN ANYWHERE in the witness; the corpus is DISCOVERED from the
    directory (PMAT-1396).
