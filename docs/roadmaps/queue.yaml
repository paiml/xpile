    \  sweep the other decy scalar tokens (`int`, `long`, `double`, `unsigned int`) through\n  wat2wasm\
    \ and record which lower and which refuse\n  command cargo test -p xpile-wasm-codegen && command cargo\
    \ test -p decy-frontend\n"
  done_note: 'DONE 2026-07-27 (pulled forward from 07-29 — the ranked slate for today was empty and

    today is well inside the day<=4 pull-forward window; not a gate_touch, so the strictly-serial

    #3 PMAT-1373 release commit is untouched).

    ** THE ENTRY''S ROOT CAUSE WAS WRONG, and it said so honestly ("find out WHY before patching"):

    PMAT-1378 did NOT miss the CUInt path. Its pre-emit layer is a BINDING-NAME collision belt and

    has never checked types. The real cause is that `emit_function` had TWO return paths and only

    ONE was type-checked — the early `Stmt::Return` arm called `emit_expr_typed`, the TRAILING

    return called the bare `emit_expr`, and the trailing one is the path nearly every C source

    takes. Both now funnel through `emit_scalar_ret`.

    ** SCOPE IS FIVE SHAPES, NOT ONE: sweeping the WHOLE decy scalar token set through the REAL

    assembler found `unsigned int`<-int-lit, `float`<-int-lit, `float`<-float-lit,

    `double`<-int-lit and every negated form broken. `int`/`long`/`long long` unaffected (i64 IS an

    int literal''s natural type) and KEPT in the corpus as the CONTROL group, so a blanket-coercion

    fix would red. `unsigned long` already refused at the BACKEND, `short`/`char` at the FRONTEND.

    ** CHOSE CONVERT over REFUSE (the entry allowed either): the conversion is the one C specifies

    for a `return` (C17 6.8.6.4p3) AND the one the Rust backend already performs by suffixing the

    literal, so converting makes the two backends AGREE instead of leaving them disagreeing about a

    program C defines. Modular for unsigned per C17 6.3.1.3p2 — `-2`->4294967294,

    `5000000000`->705032704, both value-matched against live cc. NOTHING WIDENED: a non-literal

    mismatch still refuses, and a narrow LOCAL (`unsigned int a = 1;`) still refuses; both

    boundaries carry a test so they stay visible rather than becoming folklore.

    ** THE STRUCTURAL FINDING, worth more than the fix: all 138 WASM witness files drive the emitter

    from PYTHON, and Type::CUInt / Type::F32 / Type::CLong are produced ONLY by decy-frontend — so

    the C->WASM lane had a live emitter, a live CLI flag and ZERO witnesses. `emit_surface` in

    compile-rust-to-wasm-v1.yaml is Python-only too (all 39 probes), so PMAT-1350''s two-way gate

    could not have caught it either. New crates/xpile-wasm-codegen/tests/c_scalar_abi_witness.rs

    (18 probes; decy-frontend added as a dev-dep, no cycle) is the lane''s FIRST witness.

    ** FALSIFICATION (B) IS THE DECISIVE ONE: (A) restoring the pre-slice `emit_expr` call reds 3 of

    4 tests including the STATIC pin; (B) a WELL-TYPED but semantically WRONG conversion (clamping

    instead of C''s modular wrap) passes the class gate AND the static pin, and is caught ONLY by the

    cc differential.

    ** LESSON FOR THE NEXT EMIT GATE: `Ok(wat) ==> wat2wasm accepts it` is NECESSARY AND NOT

    SUFFICIENT. Assembling is not the same as being right — pair the class gate with a VALUE

    differential or it certifies syntax only.

    ** SIBLING FILED, NOT SWALLOWED: the same literal-vs-declared-type hole exists on the RUST lane

    in the opposite direction -> PMAT-1399 below, with a verified repro.

    NEXT PICK: PMAT-1396 (doc-only, freeze-legal, R9) or PMAT-1399 (the Rust-lane sibling this slice

    found and verified).'
