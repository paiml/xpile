    blocked on that decision ALONE. Note PMAT-1444''s ordering trap: without --no-fail-fast the
    suite stops at the first failing binary, so a second real failure hid behind this one.
    NEXT PICK: STANDING LEADS, EV order. (a) backends.md''s ruchy Status parenthetical "compiles
    to Rust" -- `ruchy check` accepts 18 of 39 emitted artifacts, and one emit puts `&self` on a
    method that assigns to self (E0594). (b) the PER-INPUT disposition granularity PMAT-1442
