  notes: 'PICKED by executing PMAT-1381''s own next-pick note: the queue is empty before Thursday and
    that

    note names the decy/C frontend as "the only lane named by PMAT-1380''s note that is still

    unswept". Swept it with a 129-probe gcc-vs-(xpile -> rustc -> run) differential harness.

    ** FOUR defects, THREE of them SILENT WRONG ANSWERS that compiled cleanly: C `!x` emitting the

    bitwise invert (byte-identical to the `~x` arm); a leading-zero literal taking a base-10 parse

    (`010` -> 10, gcc 8); and "widest wins" retyping a function across the INT/FLOAT boundary,

    deleting C''s truncating conversion (`int f(double a){ return a; }` -> 3.9, gcc 3). Plus a

    ten-shape accept-then-reject class (int conditions, int `&&`/`||`, truth-as-value, and a

    reassigned PARAMETER emitting a non-`mut` binding). Root cause is single: C has no boolean type,

