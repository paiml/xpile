    (d) the C -> PTX direction was NOT swept for width defects (ptx maps CLong to .s64, which is right,
    but nothing pins it and `--hardware` is CLI-required so no existing corpus reaches it); (e) the `unsigned`
    C widths (CUInt/CULong) through the GPU lanes — CUInt -> u32 accepts, and a mixed `unsigned + int`
    add already refuses, but no gate pins either; (f) contracts/compile-rust-to-wgsl-v1.yaml has NO machine-readable
    type surface at all, unlike the WASM contract whose subset is checked both ways (PMAT-1342) — so no
    contract asserts which types this lane accepts. Do NOT open new WASM breadth; that grind is CLOSED
