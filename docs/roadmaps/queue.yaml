    c_long_gpu_width_witness - C `long` is genuinely 64-bit, so i64 is CORRECT for it. Shipped
    belt is keyed on DECLARED TYPES (the emitted WAT cannot tell C `int` from C `long` - both are
    i64, which IS the defect): DIVISION refuses whenever a signed C integer is declared, even for
    CONSTANTS (`-7 / 2` is -3 vs -4 with no runtime value); WIDTH refuses only when Type::I64 is
