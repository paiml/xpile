    ** ID RE-FILED 1402 -> 1404 BEFORE ANY PUSH. A concurrent fire merged PR #1991 while this slice was
    in the gate, and its queue refill claimed PMAT-1402 for a DIFFERENT slice (WASM i64 wraparound) plus
    PMAT-1403 for the refill itself. Main won; this slice was re-filed as PMAT-1404 in every artefact
