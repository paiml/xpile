    \ a -Woverflow warning. So the emitted literal is BOTH\nuncompilable AND, once made compilable, the\
    \ wrong value unless it is wrapped.\nROOT CAUSE: the C-emit width table renders a literal as `<digits><lit_suffix>`\n\
