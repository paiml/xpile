    (3) THE CLI DROPS `Artifact.sidecars` ENTIRELY AND SILENTLY (`main.rs` writes `primary` only), so
    the whole sidecar channel is dead code across every backend — a standing lead below. (4) A
    SELF-REPORTED COUNT IS NOT A CHECK: `; Words: 63` was asserted by a pre-existing witness
    (`wgsl_int_boundary_witness.rs`) as proof "naga actually ran", but the number was written by the
    same code path it was meant to attest. The new gate ties the two INDEPENDENTLY recorded halves of
