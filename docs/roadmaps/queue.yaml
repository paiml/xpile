    \   ..._semi_semi_amp_fallthrough, ..._refuses_heredoc, ..._refuses_heredoc_in_loop_body,\n   ..._refuses_bare_ampersand,\
    \ PLUS two POSITIVE non-regression tests:\n   parse_and_lower_case_arm_trailing_background_ampersand_still_ok\
    \ (`a) sleep 0 & ;;` must\n   still LOWER — verified working today) and\n   parse_and_lower_double_quoted_heredoc_operator_still_ok\
    \ (`echo \"a << b\"`).\n\nBLAST RADIUS IS TINY: `git ls-files '*.sh'` = 8 files, ZERO containing `<<`\
