    under the target toolchain''s OWN runner. `ruchy run` evaluates a module as a sequence of

    top-level items and only auto-invokes `main` when `main` is the SOLE item. xpile emitted

    `fun main() -> () { ... }` and never called it, so any module with a helper function alongside

    `main` DEFINED everything and RAN NOTHING. Five execution-witnessed rows over

    tests/oracle_fixtures (ruchy v4.2.1): recursion (CPython 120/3628800), optional_flow (0/8),

    optional_guard_continue (8/2), range_bool_bound (8 lines), str_and_fstring (4 lines) -- every

