    space-separated `cat <<EOF`. The tokenizer splits on whitespace alone, so `cat<<EOF` (attached),

    `cat 0<<EOF` (fd-prefixed) and `cat<<-EOF` hid the operator inside a longer token and exited 0 --

    flat, `bash -n` CLEAN and executing DIFFERENTLY; nested in a loop/if, emitting a script that did

    not parse. Fix = `contains("<<")` with `$((` exempted so the arithmetic LEFT SHIFT survives

    (execution-witnessed via a new fixture, not asserted). Both mutants RUN in both directions.

    METHOD NOTE for later verify passes: the productive question was not "is the refusal correct?" but

    "what SPELLINGS of the refused construct exist, and does the detector see each one?" A guard keyed

    on a token PREFIX is suspect whenever the tokenizer does not split operators.

