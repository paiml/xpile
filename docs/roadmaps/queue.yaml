    function". PMAT-1436''s shape inside a brand-new witness. Fixed with a per-CALL atomic
    counter; verified stable over three consecutive runs.
    ZERO crates/*/src and ZERO contracts/*.yaml change -- freeze-compatible.
    ** RELEASE NOTE, measured this session and worth carrying to Thursday: `cargo test
    --workspace --no-fail-fast` on main at 7c1191f9 is 310 suites OK and ONE failing --
    `ruleset_drift::live_ruleset_matches_the_committed_snapshot`, the OPEN owner decision
