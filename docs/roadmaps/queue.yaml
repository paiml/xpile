- id: narrow-to-python-rust-wasm
  summary: 'Is the product `Python -> {Rust, WASM}`? 59.3% of implementation lines and 100% of the executing
    witnesses in the required CI job are already on that side. Derived reach over 741 fixtures: rust 710,
    wasm 218, lean 76, wgsl 31, shell 4, forjar 0; 4 of 9 declared SourceLang variants have no parser.
    Narrowing costs the nine-backend identity statement but buys an affordable proof-to-code connection
    and a tractable mutation scope. It is the PRECONDITION for the biggest single thing below.'
- id: proof-lane-load-bearing-or-decorative
  summary: '★ BIGGEST SINGLE THING. NO proof in this repo can be turned red by a wrong lowering: `grep
    -h ''^import'' contracts/lean/*.lean | sort | uniq -c` -> `1 import Lake` across all 36 modules, and
    the Kani harness builds a temp crate with no workspace dependencies. So 489 Lean theorems and 108
    Kani proofs verify hand-written RE-IMPLEMENTATIONS of xpile''s behaviour, not xpile. That makes ''every
    construct is carried by a machine-checked contract'' UNFALSIFIABLE, which is worse than false. Either
