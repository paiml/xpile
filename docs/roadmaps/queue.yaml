    a real directory holding no recognised source (and the single-FILE spelling `xpile audit

    notes.txt`); and a corpus where EVERY file failed to lower (`--json` collapses those to

    `"errors":1` beside `"f1_status":"OK"`). The flat 100 is `coverage_pct()`''s 0-denominator

    convention. The convention is defensible; reporting it through the SAME channel as a measured

    ratio is not -- an unmeasured corpus was indistinguishable from one measured at ceiling in text,

    in JSON, and in the exit status.

    ** THE FIX splits by KIND: a bad path / empty scan is an INPUT error and REFUSES (as `transpile`

    always has); a real corpus that measures nothing is an OUTCOME and is REPORTED -- status

    VACUOUS, text `n/a`, JSON `"f1_pct":null`. `audit` stays a reporter without claiming a ceiling.

    ** SECOND FINDING, sharper, and found ONLY by fixing the first: the four `audit_command_*` tests

    passed the literal "crates/xpile/tests/fixtures", but an integration test''s CWD is the PACKAGE

    root, so it resolved to `crates/xpile/crates/xpile/tests/fixtures` -- NONEXISTENT. All four were

    green on the vacuous 100%. `audit_command_f1_is_100_percent_on_current_fixture_corpus_rust`,

    whose comment says it pins the number so a missed citation "shows up as a numeric drop", would

    have stayed green if the pipeline emitted NOTHING. Re-derived on the 825-file corpus they had

    never read: Rust 2167/2167 = 100.0% OK with over_citations 4 (the test asserted 0); Lean 157/181

    = 86.7% WARN (the test asserted OK). Path anchored on CARGO_MANIFEST_DIR + a denominator vacuity

    guard per test. General lesson, a variant of PMAT-1383''s: a test that asserts on a REPORTER is

    only as good as the reporter''s willingness to say "I measured nothing".

    ** THIRD FINDING, an under-count inside the metric: a name colliding with a Rust keyword emits

    as a RAW identifier (`def move` -> `pub fn r#move`; ruchy the same). `function_has_citation`

    matched the bare name, missed the decl, and counted the function in the denominator and never

    the numerator -- the citation WAS emitted. Strip a leading `r#`: 2166 -> 2167, so the Rust lane

    is now a TRUE 100.0% rather than a 99.954% that `{:.1}` ROUNDED UP. Reporters now TRUNCATE

    (`display_pct`), which can only understate.

    ** FOURTH/FIFTH, same class, on `transpile`: `--out FILE --emit-crate DIR` wrote the crate,

    SILENTLY DROPPED `--out`, exit 0 (the emit path returns on --emit-crate first); `--hardware`

    only ever builds a PTX profile, so `--target rust --hardware ptx:sm_89` was accepted, IGNORED,

    exit 0. Both refuse now; the VALUE is parsed first so a misspelling still reports as one.

