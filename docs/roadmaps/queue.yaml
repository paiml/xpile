next_lane:
- 'WASM i64 OVERFLOW is a SILENT WRONG ANSWER (measured by the PMAT-1378 differential pass, 2026-07-27;
  deliberately NOT actioned in a release week). Python ints are arbitrary precision; the lane maps them
  to i64 and wraps without a word: `9223372036854775807 + 1` returns -9223372036854775808, `2**62 * 4`
  returns 0, `-(-2**63)` returns itself. Div-by-zero already TRAPS honestly (i64.div_s), so the lane is
  internally inconsistent about which arithmetic failures it reports. The full fix is overflow-checked
  add/sub/mul/neg helpers that `unreachable` on overflow — L/XL, on the emitter''s hot path, and it touches
  every existing witness. SEPARABLE AND MUCH SMALLER, do this one first: the SHIFT half. `1 << 70` returns
  64 because `i64.shl` masks the count to 6 bits — wrong even under fixed-width semantics, where 0 is
  the defensible answer — and a NEGATIVE count (Python raises ValueError) masks to a large positive one.
  `x >> n` for n >= 64 is fixable EXACTLY by clamping to 63, which reproduces CPython for both signs;
  `x << n` for n >= 64 always overflows i64 unless x == 0, so it traps. Neither needs the hot path.'
