- id: PMAT-1399
  status: open
  ev_rank: R10
  gate_touch: null
  date: '2026-07-27'
  title: The RUST lane has the PMAT-1395 hole in the OPPOSITE direction — a C integer literal
    outside the declared type's range is emitted VERBATIM with its width suffix, so `--target
    rust` exits 0 emitting Rust that `rustc` REJECTS
  notes: |-
    FOUND AND VERIFIED BY THE PMAT-1395 SWEEP at a31c12b6 — not speculated.
    REPRO (unpiped; a pipe masks the exit code):
      D=$(mktemp -d); printf 'unsigned int f(void) { return 5000000000; }\n' > $D/o.c
      X=/mnt/nvme-raid0/targets/xpile/debug/xpile
      $X transpile $D/o.c --target rust > $D/o.rs; echo "XP=$?"            # -> 0
      rustc --crate-type lib --edition 2021 -o $D/o.rlib $D/o.rs; echo $?  # -> 1
      #   error: literal out of range for `u32`
      #     5 |     5000000000u32
      #     = note: the literal does not fit into `u32` whose range is 0..=4294967295
    GROUND TRUTH (/usr/bin/cc, NOT the bare `cc` — it is shell-ALIASED to `cargo check` in this
    repo's dev shell and will silently eat a probe): C answers 705032704, i.e. the value converts
    MODULO 2^32 (C17 6.3.1.3p2) with only a -Woverflow warning. So the emitted literal is BOTH
    uncompilable AND, once made compilable, the wrong value unless it is wrapped.
    ROOT CAUSE: the C-emit width table renders a literal as `<digits><lit_suffix>`
    (`CWidth.lit_suffix`, the u32 row near crates/xpile-rust-codegen/src/lib.rs:5464) with NO range
    conversion. PMAT-1395 fixed the identical class on the WASM lane by converting at the RETURN
    site; do the same here. The two lanes MUST agree — cross-backend agreement was the whole
    argument for converting there rather than refusing.
    SWEEP BEFORE PATCHING (PMAT-1395's lesson: the one-token framing understated that slice 5x):
    check EVERY C width the table carries (i32/i64/u32/u64/f32/f64) against both an out-of-range
    literal and a negated literal, and check the LOCAL and PARAMETER positions as well as the return.
    TRAP — do not over-red: `float f(void) { return 16777217; }` emits `16777217f32`, which rustc
    ACCEPTS with rounding, exactly as C rounds. That is NOT a defect. The defect is specific to an
