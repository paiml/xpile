- id: PMAT-1389
  status: done
  ev_rank: R2
  gate_touch: null
  date: '2026-07-27'
  title: positional-only parameters (`/`) were SILENTLY DELETED from the signature — the caller's positional
    args shifted left and rust/wasm/lean/ruchy each compiled AND EXECUTED a different answer than CPython
    (SHIPPED 2026-07-27)
  notes: 'PICKED as the lowest-numbered OPEN item dated <= today, R1 within the day being taken already
    (PMAT-1388 shipped as #1975 before this slate merged).

    ** THE DEFECT, measured through the shipped CLI at c1d7db19 BEFORE fixing. `def f(a: int, /, b: int
    = 2) -> int: return b` with `def run(): return f(9)` prints 2 under CPython. `xpile transpile --target
    rust` exited 0 with ZERO bytes of stderr and emitted `pub fn f(b: i64)` — `a` deleted — with the call
    site `f(9i64)`, so 9 re-bound to `b`. rustc accepted it and the binary printed 9. The DEFAULTED second
    parameter is the load-bearing detail: once `a` is dropped the call site has exactly as many arguments
    as the mutilated signature has parameters, so nothing downstream can notice. wasm/lean/ruchy all exited
    0 the same way.

    ** ROOT CAUSE: crates/depyler-frontend/src/lib.rs lower_function guarded kwonlyargs/kwarg but never
    read f.args.posonlyargs, and the param loop iterates f.args.args alone. The scope bound in the slate
    held on re-measurement: desugar_nested_fn and desugar_closure_assign already refused `/`; module-level
    functions were the only leak.

    ** THE FIX: its OWN refusal arm naming positional-only parameters and the `/` separator, not an extra
    disjunct on the keyword-only guard — a caller told "keyword-only args / **kwargs" for a `/` inspects
    the wrong end of the signature. Splitting refusals by KIND is the standing lesson from PMAT-1371/1377.

    ** THE WITNESS: crates/xpile/tests/posonly_param_witness.rs (XPILE-POSONLY-001, NEW FILE, so not a
    gate touch), 4 tests, 0.19s MEASURED via `--nocapture` rather than assumed. Load-bearing assertion
    is the RELATION the defect violated, not a list of spellings that must refuse: for every probe and
    every lane, either the frontend refuses or every parameter the `def` declares appears in the emitted
    signature. That survives `/` ever being SUPPORTED. RED HALF RUN: with the frontend edit stashed it
    fails with 16 violations (4 `/` probes x 4 lanes) and the refusal-wording test fails too; the 2 controls
    pass on both sides, which is the shape a real red-then-green has. The execution half transpiles +
    rustc-compiles + RUNS the `/`-free control and diffs against CPython (both 2; the Rust side printed
    9 pre-fix), and prints both observed values plus its wall clock so a reader can tell a differential
    from a silent skip.

    ** TWO TRAPS HIT AND RECORDED. (a) The first probe corpus named its parameters `a`/`b`; the WAT lane
    ALWAYS emits an `__wasm_floordiv_i64` helper with `(param $a i64) (param $b i64)`, so the presence
    check found them in every emission and would have passed VACUOUSLY. Probes renamed to alpha/beta/items.
    (b) The accepted-pairs vacuity floor is 7, not the obvious 8: the Lean lane refuses the `*args` control
    for an unrelated pre-existing reason (`for x in xs:` needs a monadic-iteration encoding it does not
    have). MEASURED, not assumed.

    ** No gate file touched; witness_floor.rs untouched (2-touch serial resource, second touch reserved
    for PMAT-1373).

    NEXT PICK: PMAT-1390 (R3, dated today) — `xpile attestations` counting a roadmap PREAMBLE mention
    as a work item and emitting invalid JSON at rc=0. ★ WHILE MEASURING THIS SLICE a SEPARATE defect in
    the same file surfaced and is now queued as PMAT-1398: docs/roadmaps/ roadmap.yaml has been INVALID
    YAML since 968d352d (PMAT-1388) — three unescaped apostrophes inside a single-quoted scalar (`xpile''s`,
    `box''s`, `crate''s` written with ONE quote) end the scalar early, and NO YAML parser can read the
    file. roadmap_registration.rs did not catch it because all three of its assertions are pure TEXT (`-
    id:` line matching), so the ledger gate reports registration green over a file that does not parse.
    Take PMAT-1398 with or before PMAT-1390 — they touch the same reporter surface.'
- id: PMAT-1398
  status: done
  ev_rank: R3
  gate_touch: null
  date: '2026-07-27'
  title: docs/roadmaps/roadmap.yaml has been INVALID YAML since 968d352d and the ledger gate did not notice,
    because all three of roadmap_registration.rs''s assertions are pure TEXT
  notes: 'FOUND WHILE MEASURING PMAT-1389, not by a hunt. Reproduce on main:

    python3 -c "import yaml; yaml.safe_load(open(''docs/roadmaps/roadmap.yaml''))" -> yaml.parser.ParserError:
    while parsing a block mapping ... expected <block end>

    ** THE DEFECT: the PMAT-1388 ledger row''s `description:` is a SINGLE-QUOTED YAML scalar, and three
    apostrophes inside it are written with ONE quote instead of the doubled `''` YAML requires — `is "xpile''s
    output, not a hardcoded shader"`, `box''s Vulkan adapter`, `crate''s own dummy_module()`. (Written
    here doubled; on main they are single.) The first lone quote ENDS the scalar, so everything after
    it is re-parsed as YAML structure and the file stops loading at the first line that looks like a mapping
    key (`items: Vec::new() }`). Note the SAME entry escapes correctly four lines earlier (`audit''s`),
    so this is a slip, not a convention.

    ** WHY NOTHING CAUGHT IT: crates/xpile/tests/roadmap_registration.rs asserts (1) every done queue
    item appears as a `- id:` ROW, (2) every cited id since the tag is registered, (3) the pre-commit
    guard paths exist. All three are `contains` / line matching over the raw text. The ledger gate therefore
    reports registration GREEN over a file no YAML parser can read — the exact reporter shape PMAT-1385/1386/1387/1390
    keep finding, one level up, in the gate rather than the tool. `xpile attestations` and `xpile quorum`
    also scan this file textually, which is why the CLI does not fail either.

    ** THE FIX (S): double the three apostrophes. THE GATE (the actual slice): a test that PARSES both
    docs/roadmaps/*.yaml and fails if either does not load. Cheapest honest form is a new test file, NOT
    an edit to roadmap_registration.rs — that file is a gate and the gate chain is pinned by PMAT-1373''s
    gate_touch:3 this window. Check whether the workspace already has serde_yaml in dev-deps; if not,
    a 3-line scalar-quoting linter over the file is still strictly better than nothing, but prefer a real
    parser.

    ** ACCEPTANCE: the reproducer above exits 0; the new test FAILS when any one apostrophe is un-doubled
    again (run the red half); roadmap_registration.rs still passes UNCHANGED.

    ** DONE 2026-07-27. All three acceptance criteria MET and measured. serde_yaml WAS already a dev-dep
    of crates/xpile (PMAT-484), so the real parser was available and the 3-line linter fallback was not
    needed. Gate shipped as crates/xpile/tests/roadmap_ledger_parses.rs (XPILE-LEDGER-002, 4 tests, 0.27
    s measured) — a NEW file; roadmap_registration.rs is byte-unchanged, so gate_touch #3 (PMAT-1373)
    is unperturbed. The fourth assertion is the one with teeth and is not what the queue asked for: it
    re-derives the ledger id set BOTH ways (the byte-identical `- id: ` text scan XPILE-LEDGER-001 uses,
    and serde_yaml) and demands equality — a relation between two live implementations, so it cannot go
    stale as the ledger grows, and it also catches a half-parsing document, a row swallowed into a string
    scalar, or an `id` nested a level too deep. Vacuity-guarded on both sides (> 1000 ids each). File
    set is GLOBBED from docs/roadmaps/, never hand-listed. RED HALF RUN THREE TIMES, once per apostrophe:
    each independently reds 3 of 4 new tests, and in EVERY probe `cargo test -p xpile --test roadmap_registration`
    stayed 3/3 GREEN on the broken file — the gap is measured, not asserted. Repo-wide scan after the
    fix: 40 of 40 YAML files across docs/roadmaps, contracts and .github/workflows parse. NEXT PICK: PMAT-1390
    (`xpile attestations` phantom preamble work-item + invalid JSON) — now unblocked, since its own independent
    reference is a REAL yaml parse of docs/roadmaps/roadmap.yaml, which could not run until this slice
    landed.'
