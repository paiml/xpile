  date: '2026-07-28'
- id: PMAT-1429
  status: done
  ev_rank: R1
  gate_touch: null
  date: '2026-07-28'
  title: 'the PROOF LANE was advertised at parity with the code lane while BOTH its backends
    are `_scaffold` stubs, and `book/src/reference/cli.md` published an `xpile info` transcript
    stale by THREE backends and a whole frontend -- on the page that says "use this to confirm
