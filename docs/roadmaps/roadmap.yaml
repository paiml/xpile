  title: 'PMAT-673: [Tranche 2] CORRECTNESS tuple concatenation a + b'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`a + b` over two tuples is CONCATENATION in Python (`(1,2)+(3,4)`==`(1,2,3,4)`), not numeric addition. Rust tuples have no `+`, so the old path fell through to the i64-arith lowering — the result mis-typed as I64 and the body-vs-annotation check REJECTED it ('body produces I64'), or the backend would have emitted `(a).checked_add(b)` (E0599). FIX (frontend ONLY, the context-aware BinOp lowering ~10036, NO IR change): when `+` is applied to two Type::Tuple operands, build a fresh Expr::TupleLit reading each field of `a` then `b` via TupleIndex over the ORIGINAL operand — so each field type-infers correctly for any element type (int, str, …) and, for a name operand, has no side effect (`((a).0.clone(), (a).1.clone(), (b).0.clone(), (b).1.clone())`). A field-per-operand read DUPLICATES the operand, so the lowering is restricted to side-effect-free operands (Expr::Ident | Expr::TupleLit); a call-result operand (`f()+g()`) is REJECTED cleanly with guidance to bind it to a local first (avoids silent per-field re-evaluation). Differential-verified vs python3: int/str tuples, chained `a+b+c`, local-tuple concat; call-result rejects. New e2e tuple_concat.py rustc-rt. FREE CI. e2e 429->430. SHIPPED v0.1.372. FOUND BY HUNT-V5 (tuple-ops-2-4). Extends the tuple cluster (669/670/671/673)."
- id: PMAT-672
  github_issue: null
  item_type: task
  title: 'PMAT-672: [Tranche 2] CORRECTNESS chained comparison short-circuits like Python'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A chained comparison `a < b < c` must evaluate operands left-to-right and STOP at the first false sub-comparison — Python never evaluates trailing operands once an earlier compare fails. PMAT-576 fixed the *double-eval* of the shared middle operand by hoisting EVERY operand to a `let __cmpN` temp up front, then folding the sub-comparisons over the temps with `&&`; that made `&&` short-circuit the *comparisons* but left operand *evaluation* EAGER. A panic-prone / side-effecting trailing operand (`10 < n < (100 // dv)` with dv==0) ran even when an earlier compare was false — a divide-by-zero panic / spurious side effect where Python returns False. FIX (frontend ONLY, the chained-Compare lowering ~12821, NO IR change): emit a RIGHT-NESTED form instead of the flat temp-block + `&&`. Each shared (interior) operand is bound to a temp the moment it is first reached, INSIDE the `if` of the prior sub-comparison; the first operand is inline in compare 0 and the last is inline in the innermost compare: `{ let __t1 = b; if (a OP0 __t1) { { let __t2 = c; if (__t1 OP1 __t2) { __t2 OP2 d } else { false } } } else { false } }`. This evaluates every operand EXACTLY ONCE (preserving the PMAT-576 single-pop guarantee) AND only when Python would (restoring short-circuit). Built via Expr::IfExpr + Expr::Block + LitBool(false), wrapped outward from op n-2 to op 0. Differential-verified vs python3: guard(2,0) short-circuits before 100//0 (no panic), all-true/mid-false/4-term chains, pop-once side-effect regression. Updated chained_compare e2e shape assertion (was `(__cmp0<=__cmp1)&&…`, now right-nested). New e2e chain_short_circuit.py rustc-rt. FREE CI. e2e 428->429. SHIPPED v0.1.371. FOUND BY HUNT-V5 (comparison-chains-2-1/2)."
- id: PMAT-671
  github_issue: null
  item_type: task
  title: 'PMAT-671: [Tranche 2] CORRECTNESS x in tuple → chained-OR membership'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`x in t` / `x not in t` over a fixed-arity tuple was REJECTED ('unsupported comparison operator: In') — the membership intercept (depyler-frontend ~9784, the `ast::Expr::Compare` with a single `In`/`NotIn` op) handled Dict/Str/Set/List but NOT Tuple, falling through to `cmp_binop` which rejects `In`. Rust tuples have no `.contains`. FIX (frontend ONLY, the In/NotIn intercept, NO IR change): add a `Type::Tuple(elem_tys)` arm AFTER the List arm. Lower `x in t` to a chained-OR of equalities — fold `Expr::BinOp{Eq, needle.clone(), TupleIndex{tuple: rhs, index: i}}` over `||` for i in 0..arity → `(x == t.0) || (x == t.1) || …`; `not in` wraps the result in `UnOp::Not`. GATED to a HOMOGENEOUS tuple whose element type == the needle type (`elem_tys.iter().all(|e| *e == needle_ty)`) — a heterogeneous tuple would produce type-mismatched `==` (Rust error); Python's per-element `==` for mixed types returns False but is rare, so it falls through to the existing reject. An empty tuple → `Expr::LitBool(false)` (`x in ()` is always False; `x not in ()` True). Differential-verified vs python3: contains((1,2,3),2)=1/9=0, not_contains((1,2,3),9)=1/2=0, contains_str(('a','b'),'b')=1/'z'=0, list-membership regression. NOTE the needle is cloned per element (double-eval for a side-effecting needle — rare; consistent with other reuse). New e2e tuple_membership.py rustc-rt. FREE CI. e2e 427->428. SHIPPED v0.1.370. FOUND BY HUNT-V5 (tuple-ops-2-6). TUPLE CLUSTER (669 aggregate + 670 neg-index + 671 membership) essentially complete."
- id: PMAT-670
