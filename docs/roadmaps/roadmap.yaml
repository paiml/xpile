  title: 'PMAT-746: [Tranche 2] CORRECTNESS augmented assignment coerces a bool RHS to int (HUNT-V14 rank 1)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "Python's `bool` is an `int` subtype, so `count += a == b` (count matches), `n -= flag`, `xs[i] += b` are integer arithmetic. The plain `total + (a == b)` path coerced the bool to i64 (PMAT-565) but the AUGMENTED path emitted `(count).checked_add(<bool>)` with no cast → rustc E0308 (transpile-success → invalid Rust). COMMON (boolean-counting idiom). FIX: in `combine_aug`'s integer `BinOp` else-arm, mirror the plain BinOp arm EXACTLY — `both_bool = matches!(op, BitAnd|BitOr|BitXor) && lhs Bool && rhs Bool`; `if is_int_arith_binop(op) && !both_bool { (to_i64_operand(lhs), to_i64_operand(rhs)) }`. So `&`/`|`/`^` over two bools stays a bool op (PMAT-580, `flag &= other` keeps Type::Bool); +=/-=/*= with a bool coerces. Covers Name/Subscript/Attribute targets. Float-augmented (FloatBinOp) + str/list/set augmented paths untouched. Verified vs python3: count_spaces('a b c d')=3, acc_mul(7,True/False)=7/0, sub_bool=9, subscript_bool=11, bool_and stays bool, float_acc unchanged. New e2e bool_augassign_int.py. FREE CI. e2e 511->512. SHIPPED v0.1.446. FOUND BY HUNT-V14 (rank 1, bool-augadd-i64-coerce). NEXT V14 picks: #2 exc-untagged-panic-swallowed (dict/list/pop native panics swallowed by typed except — silent-wrong, extends PMAT-743/744), #3 str-literal-control-byte-escape (bare CR/CRLF), #4 nf-reassign-immutable (E0384), #6 dc-order-sort-no-ord (E0277)."
- id: PMAT-745
  github_issue: null
  item_type: task
  title: 'PMAT-745: [Tranche 2] CORRECTNESS exact int↔float comparison (no f64 precision loss above 2^53)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "Python compares an `int` and a `float` EXACTLY — it never rounds the int operand. xpile cast the int side to `f64` before comparing (`(n) as f64 == f`), silently losing precision above 2^53 (consecutive integers stop being distinct in f64) and able to INVERT the order: `9007199254740993 == 9007199254740992.0` wrongly became True, `9007199254740993 > 9007199254740992.0` wrongly False. SILENT-WRONG. FIX: new `Expr::MixedIntFloatCmp { int, float, op }` node. Frontend `build_chain_cmp` builds it for the I64↔F64 cases instead of `to_f64_operand`-promoting, normalising the operator so the int is the conceptual left operand (`flip_cmp` flips </>/<=/>= when the float was written first; ==/!= symmetric), so ONE codegen template covers all six operators in either order. rust+ruchy `emit_mixed_int_float_cmp` emits a block: compare `n as f64` (`__cnf`) vs `f` (`__cf`) for STRICT ordering (reliable — a rounded integer lands within half a ULP of `__cnf`, so `__cnf < __cf` ⟹ `n < f`), and break the `__cnf == __cf` tie in i128 (exactly holds every integral f64 an i64 cast can reach, up to 2^63), so boundary cases (i64::MAX vs 2^63, 2^53+1 vs 2^53) resolve correctly. NaN falls through every arm (Python: `n != nan` True, rest False). Float ARITHMETIC still promotes the int (Rust has no mixed f64/i64 ops); only the comparison path changed. Ripple: meta-hir variant + 3 walkers (expr_has_int_arith/escape_expr/collect_idents_expr) + lean collect_idents; 2 infer sites + rewrite_dict_reads; lean emit refuses. Verified by a differential fuzz of 4320 (n,f) pairs × 11 comparison forms vs python3 (0 mismatches) + e2e intfloat_cmp_precision.py (boundaries, NaN, ±inf, float-on-left flip). FREE CI. e2e 510->511. SHIPPED v0.1.445. FOUND BY HUNT-V13 (intfloat-cmp-precision)."
- id: PMAT-744
  github_issue: null
  item_type: task
  title: 'PMAT-744: [Tranche 2] CORRECTNESS tag list-index OOB as IndexError (typed except no longer swallows it)'
  status: done
  priority: low
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`try: return xs[i] except ValueError: return -1` SILENTLY swallowed an out-of-bounds list IndexError and returned -1 (Python propagates the uncaught IndexError). SILENT-WRONG, common. ROOT: a runtime list-index read emitted a NATIVE `Vec[i]` bounds panic with no `xpile:` prefix; the typed-except re-raise filter (PMAT-731) only re-raises payloads tagged `xpile: <KnownExc>:`, so the untagged native panic fell into the handler arm. FIX (rust+ruchy `Expr::Index` runtime/negative branch, NO IR): emit an explicit bounds check `if __lidx < 0 || __lidx as usize >= __lc.len() { panic!(\"xpile: IndexError: list index out of range\") }` before the index, so the discrimination re-raises it from a non-matching except (propagates, like Python) and catches it under `except IndexError`. Verified vs python3 (wrong_except propagates; right_except returns -1 in-bounds val + OOB -1). New e2e except_wrong_type_index.py. FREE CI. e2e 509->510. SHIPPED v0.1.444. FOUND BY HUNT-V13 (exc-flow-01/02). FOLLOW-UPS: nonneg-LITERAL index fast path still native (rarer); exc-flow-03 (i64-overflow `xpile: i64…` panic swallowed by unrelated except) needs the broader catch-only-matching-tag filter."
- id: PMAT-743
