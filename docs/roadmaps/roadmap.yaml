  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`for x in list(xs): xs.remove(x)` — the canonical iterate-a-copy-so-I-can-mutate-the-original idiom — hit rustc E0502. `list(xs)` over a list returned the bare `xs` (relying on `value semantics already clones`), but in for-loop-iterable position `for x in xs` lowers to `xs.iter().cloned()`, an immutable borrow of `xs` that lives the whole loop, so an in-body `xs.remove()` (mut borrow) conflicts. INVALID-RUST, common idiom. FIX (frontend only, lower_expr `list(...)` over-a-list arm ~10746): return `Expr::Clone(Box::new(inner))` (→ `(xs).clone()`) instead of `inner` — the loop iterates an owned temporary, `xs` stays free to mutate. Matches Python (`list(xs)` is a fresh list) + the already-correct slice-copy `xs[:]` (`.to_vec()`); the `xs[:]`-works / `list(xs)`-broken inconsistency was the tell. `Expr::Clone` preserves list type inference; `ys = list(xs)` stays an independent copy (no regression). Verified vs python3: evens_removed([1,2,3,4,5])==3, copy_independent([1,2,3])==7. New e2e list_copy_iter_mutate.py (rustc round-trip). FREE CI. e2e 498->499. SHIPPED v0.1.437. FOUND BY HUNT-V12 (item V12-3)."
