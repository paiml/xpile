  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "An arith operator over a user class w/ the matching dunder (`a+b`→__add__, `-`→__sub__, `*`→__mul__) emitted i64 `(a).checked_add(b)` → E0599 (struct has no checked_add); Python resolves a+b to a.__add__(b). FIX (frontend context-aware BinOp lowering, lower_expr_in_ctx_inner, after lowering both operands, before the numeric paths): new `arith_dunder_name(op)` maps Add/Sub/Mult→__add__/__sub__/__mul__; when set AND `infer_type(lhs)` is Type::Struct(sname) w/ that method registered, lower to `Expr::MethodCall{obj:lhs, method:dunder, args:[rhs]}` (rhs by value, matches generated dunder sig). Plain int/float + str/list `+` unchanged (gate doesn't fire). Verified vs python3: Money(100)+Money(50)=150, -Money(30)=70, Money(4)*Money(5)=20, plain a+b=5. New e2e dunder_arith.py. FREE CI. e2e 534->535. SHIPPED v0.1.468. FOUND BY HUNT-V16 (DD-05, 3rd of dunder cluster after __len__/__getitem__). NEXT dunder: DD-07 `<`/sorted ignore __lt__ (impl PartialOrd from __lt__, like PMAT-762 PartialEq from __eq__); DD-06 __call__; DD-08 `x in obj` __contains__. Then #10 oc-ternary-int-branch-widened; #15/16 GEN-01/02. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
