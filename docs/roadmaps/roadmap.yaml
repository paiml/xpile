  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-21 + H5-22). math.floor/ceil/trunc(float) -> Python int, lowered to bare `(x).floor() as i64`. Rust's `as i64` float cast SATURATES (since 1.45): huge float (1e30) -> i64::MAX (silent miscompile), inf -> i64::MAX, nan -> 0; Python returns a bignum for a huge float and raises OverflowError(inf)/ValueError(nan). The int(float) cast already guards (PMAT-586/589); math.* round paths did not. FIX (rust+ruchy NumBuiltin codegen): special-case Floor|Ceil|Trunc at the top of the arm (alongside the min/max float fast-path), emit `{ let __mf=(x).<round>(); if !__mf.is_finite() {panic OverflowError/ValueError} if __mf<(i64::MIN as f64)||__mf>=(i64::MAX as f64) {panic out-of-range, contract fail-loud} __mf as i64 }` and early-return; the old `.floor()/.ceil()/.trunc() as i64` suffix arms stay for match exhaustiveness (unreachable after the early return). In-range values round unchanged. No new IR. Updated math_pow_trunc + math_module assertions to the guarded shape. PROCESS GOTCHA RECURRED: forgot to `git checkout -b` after the v0.1.304 release -> the PMAT-606 commit landed on local main; recovered non-destructively (git branch fix/... to save the commit; git checkout it; git branch -f main origin/main; nothing was pushed). New e2e fixture math_round_overflow.py rustc-rt + python3 diff (fl(3.7)=3/ce(3.2)=4/tr(-3.7)=-3; inf + 1e30 fail loud via catch_unwind). FREE CI. e2e 366->367. SHIPPED v0.1.305. Remaining HUNT-5 clean picks: H5-13 pow(bool) E0425, H5-27 comp-var-shadows-bound, H5-12 int('1_000') underscore, H5-24 pop(neg idx), H5-28 max/min empty float-gen, H5-15 NaN spec'd format, H5-23 float//inf. TOP architectural: dict iteration order H5-6/7/26 (HashMap->IndexMap), typed-exceptions H5-16/17."
- id: PMAT-605
