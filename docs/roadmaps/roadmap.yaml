  - "CORRECTNESS (differential hunt #9 H9-15, fresh v0.1.327). A context-dependent argument to a user-function call — a bool and/or/not/ternary like `g(5, c and d)` (c,d bool params) — was REJECTED ('operands of and/or must be Bool'). ROOT CAUSE (same as PMAT-627): the context-aware Call arm delegated to the CONTEXT-FREE `lower_call`, whose args use `lower_expr` (not lower_expr_in_ctx), losing param type bindings → the and/or bool-operand guard saw c/d as non-Bool. FIX (frontend, NO new IR): at the context-aware Call site, a Name-callee user-function call lowers its args via lower_expr_in_ctx and builds Expr::Call directly (then clone_reused_call_args); `len` + non-Name callees fall back to lower_call (lower_call only special-cases len, handled earlier anyway). Context-aware is the path used everywhere else, so int/str args unchanged — only context-dependent args (bool ops, nested calls, dict reads) now typed correctly. FULL WORKSPACE TEST CLEAN (no regression from broadening arg-lowering). New e2e fixture bool_arg_to_call.py rustc-rt + python3 diff (and/or/not/ternary). e2e 388->389. SHIPPED v0.1.329. **This is the proper general fix for the lower_call-is-context-free root (subsumes/complements PMAT-627's reorder_nested_call_args).** Remaining hunt #9 ARCHITECTURAL: typed-exceptions H9-5..10 (except E catches all panics — decompose via panic-payload type-prefix + re-raise), dict-by-ref H9-12..14, for-loop-var cluster H9-0..4/17/18. Deferred: H9-16 str.format radix-neg (fragile — str.format's auto/positional arg accounting)."
