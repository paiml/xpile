  acceptance_criteria:
  - "A float-typed set element / dict KEY lowered to `HashSet<f64>` / `HashMap<f64, _>` — INVALID Rust (`f64: !Eq`, `!Hash`) → E0277 (transpile-success → rustc-fail, HIGH severity per the E0XXX-beats-silent-divergence lesson). FIX: new `fn reject_float_hashed(fn_name, site, position, ty)` (reuses the existing `type_contains_float` helper, so F64 directly OR inside a tuple/list element is caught — e.g. `set[tuple[int,float]]`) → clean `FrontendError::Lower` reject. Gated at THREE sites: (1) `parse_type_annotation` `set` arm (element) + `dict` arm (KEY only — value is unchecked, a float VALUE is fine) → covers params/returns/local annotations; (2) `lower_set_literal_in_ctx` (post element-loop, on `elem_ty`) → un-annotated `{1.5,2.5}`; (3) `lower_dict_literal_in_ctx` (post pair-loop, on `k_ty`) → un-annotated `{1.5:3}`. STRICT IMPROVEMENT: uncompilable-Rust → clean compile-time reject; never regresses (a missed site still emits E0277 as before). `dict[str,float]` (float VALUE) still transpiles+runs (locked by float_dict_value_ok e2e). Differential/compile-verified: set[float]/dict[float,_]/literals/nested-tuple all reject; set[int]/dict[int,int]/dict[str,float] all compile+run. New e2e float_hashed_key_rejected (reject+msg) + float_dict_value_ok (rustc-rt). FREE CI. e2e 452->454. SHIPPED v0.1.395. FOUND BY HUNT-V7 (item V7-7). FOLLOW-UP: set/dict COMPREHENSIONS with float keys still E0277 (additive gate, no regression) + ordered-float-newtype alternative deferred."
- id: PMAT-695
