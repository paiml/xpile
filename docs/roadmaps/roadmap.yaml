  title: 'PMAT-769: [Tranche 2] CORRECTNESS generate impl PartialOrd from a custom __lt__ (HUNT-V16 DD-07)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "A dataclass w/ a custom __lt__ emitted `a < b` over a struct deriving only PartialEq → E0369 (no PartialOrd), dead __lt__ method. FIX (both backends, mirror PMAT-762 __eq__→PartialEq): `has_custom_lt = methods.any(__lt__)`; when set, generate `impl PartialOrd for T { fn partial_cmp(&self, __other) -> Option<Ordering> { if self.__lt__(other.clone()) Less else if other.__lt__(self.clone()) Greater else Equal } }`, giving </>/<=/>=. Suppress the order=True structural PartialOrd/Ord (+Eq) derive when has_custom_lt (else two conflicting impls). Verified vs python3 (__lt__ compares .x): P(1,9)<P(2,0) True, P(3,0)>P(2,9) True, P(1,9)<=P(1,0) True (equal x). New e2e dunder_lt.py. FREE CI. e2e 535->536. SHIPPED v0.1.469. FOUND BY HUNT-V16 (DD-07, 4th of dunder cluster after __len__/__getitem__/__add__). FOLLOW-UP: sorted() over a custom-__lt__ dataclass needs Ord (PartialOrd-only → E0277). NEXT dunder: DD-06 obj(args) __call__ E0618; DD-08 `x in obj` __contains__. Then #10 oc-ternary-int-branch-widened; #15/16 GEN-01/02. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
