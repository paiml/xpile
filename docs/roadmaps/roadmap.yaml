  - "CORRECTNESS (found by a differential hunt — the ONE real finding; the rest were stale-binary artifacts, see cadence memory). A list subscript `xs[i]` with a RUNTIME-negative `i` (a variable/computed index, e.g. param i=-1, or `xs[-len(xs)]`) emitted `xs[i as usize]`, so `-1 as usize` = usize::MAX -> index-out-of-bounds PANIC, where Python returns the last element (`xs[-1]`). Literal negative indices `xs[-1]` were already resolved to `len-k` in the frontend (PMAT-502s/560); this is the variable/computed case, long DEFERRED as an 'invasive hot-path' change. FIX (both backends' Expr::Index arm, NO new IR): mirror the EXISTING str-index negative-wrap (proven template). A NON-NEGATIVE integer LITERAL index keeps the bare fast path `coll[i as usize].clone()` (no wrap, no e2e churn — literal-index emit unchanged); ANY OTHER index emits `{ let __lc = &(coll); let __li: i64 = (index) as i64; let __lidx = if __li < 0 { __lc.len() as i64 + __li } else { __li }; __lc[__lidx as usize].clone() }` — the `&(...)` binds the collection eval-once (also handles a block-producing collection like sorted()), and an out-of-range result still panics via the `as usize` cast/bounds check (~= Python IndexError). Expr::Index is LIST-ONLY (str has its own char-indexed path which ALREADY does this wrap; dict uses DictGet), so the len-based wrap is sound. Differential-verified vs python3: xs[-1]=30/xs[-2]=20, computed xs[len-1]+xs[-len]=12, negative nested grid[i][0]. Regression: positive variable / literal / loop-counter / nested indices unaffected (398 e2e, none changed shape). FREE CI. e2e 397->398. SHIPPED v0.1.338. **FOLLOW-UP: the subscript ASSIGN path `xs[i] = v` and aug-assign `xs[i] += v` are SEPARATE codegen sites that STILL emit `xs[i as usize] = ...` (no wrap) — a runtime-negative assign index still panics. Mirror this fix there next (deferred to keep this slice contained).**"
