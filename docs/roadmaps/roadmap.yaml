  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`-9223372036854775808` (exactly i64::MIN, representable) rejected at transpile (`integer literal does not fit in i64`). Python parses it as `USub(Constant(9223372036854775808))` — the bare magnitude 2^63 doesn't fit i64, so lowering the operand first rejects before the unary minus is applied. REJECT-of-valid-program. FIX (frontend only): new `fold_neg_int_literal(operand)` helper called FIRST in both USub lowering arms (context-free `lower_unary_op` + context-aware `lower_expr_in_ctx`): when the operand is a bare int literal whose magnitude EXCEEDS i64::MAX (`i64::try_from(big).is_err()`), negate in i128 and range-check back to i64 — `-(2^63)` → LitInt(i64::MIN); larger → bigint reject. Magnitudes that fit i64 (`-1`/`-5`) return None → existing path unchanged (no emit churn; avoids breaking sign.py's checked_neg shape assertion). Positive 2^63 (i64::MAX+1) + `-9223372036854775809` still reject. Verified vs python3 (min_val()==i64::MIN, near_min(5)==MIN+5). New e2e int_min_literal.py (rt) + int_past_min_literal.py (reject). FREE CI. e2e 502->504. SHIPPED v0.1.439. FOUND BY HUNT-V12 (item V12-31). NOTE re-negating i64::MIN at runtime (`return -x`) still panics (i64-negation overflow = bigint-runtime epic, unchanged)."
- id: PMAT-738
