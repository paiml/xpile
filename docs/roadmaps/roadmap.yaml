  acceptance_criteria:
  - "Extends PMAT-645 (star-LAST `a, *rest = xs`) to a starred target at ANY position: `*init, last = xs` (star-first) and `first, *mid, last = xs` (star-mid), with any prefix(p)/suffix(s) counts. FIX (frontend desugar, NO new IR; generalizes lower_starred_unpack): the lower_block_stmt hook now accepts EXACTLY ONE Starred elt with all-Name prefix AND suffix (was: star must be last). lower_starred_unpack finds star_pos via position(Starred), splits prefix=elts[..star_pos] / suffix=elts[star_pos+1..]. Emits: prefix `let n_i = coll[i]` (Index, literal i); star `let star = coll[p : len-s]` (Slice, lo=Some(p)|None when p==0, hi=Some(Len(coll) - s via BinOp::Sub)|None when s==0); suffix `let m_j = coll[len - (s-j)]` (j=0..s -> coll[len-s]..coll[len-1], computed Index via Expr::Len + BinOp::Sub; the PMAT-639 negative-wrap is a no-op since len-(s-j) is non-negative for a long-enough list). Star-last (s==0 -> open hi, no suffix) reduces to PMAT-645. Plain-Ident RHS indexed/sliced directly (borrowed, not moved); else `__starunpack` temp. Too-few-values -> Python ValueError; here a suffix index goes OOB / the slice empties (invalid-program edge). Differential-verified vs python3: *init,last=406, *init,a,b=34002, first,*mid,last=1509, empty-mid=12, a,b,*mid,y,z=21, str elems z:x,y. Regression: star-last + plain tuple unpack unaffected. Extended e2e starred_unpack.py rustc-rt. FREE CI. e2e 404 (driver-only additions). SHIPPED v0.1.345. Found by a differential probe. **STARRED UNPACKING NOW COMPLETE (any single-star position).**"
