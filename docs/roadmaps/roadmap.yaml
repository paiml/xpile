  title: 'PMAT-652: [Tranche 2] CORRECTNESS set relational predicates do not move their operands'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "The set relational predicates — operators `a <= b` / `>=` / `<` / `>` and methods `a.issubset(b)` / `a.issuperset(b)` / `a.isdisjoint(b)` (all lowered to `Expr::SetPred`) — emitted `({ let __l = <lhs>; let __r = <rhs>; __l.is_subset(&__r) })`, binding the operands BY VALUE. For a HashSet operand that is an Ident, `let __l = a` MOVES `a`, so comparing a set and then reusing it (`if a <= b: ...; return len(a)`) or self-comparing (`a <= a`, `a.isdisjoint(a)`) failed to compile with E0382 (use of moved value) — a transpile->invalid-rust for mainstream set-relation usage. FIX (both backends' `Expr::SetPred` arm — rust-codegen ~2592, ruchy ~2240, NO IR change): bind the operands BY REFERENCE — `let __l = &(<lhs>); let __r = &(<rhs>);` then `__l.is_subset(__r)` (drop the now-redundant `&` on `__r`). `&(expr)` borrows an Ident operand (no move) and extends a temporary operand (e.g. a set-union sub-expression) via Rust's temporary-lifetime-extension when bound directly in a `let`; the proper-variant `__l != __r` still works (PartialEq for `&HashSet`). Fixes BOTH set-ops-1 (reuse-after-compare, COMMON) and set-ops-2 (self-comparison, niche) in one change. Differential-verified vs python3: subset/superset/disjoint/proper operators + issubset/isdisjoint methods, reuse-after-compare (returns 3), self-comparison (isdisjoint(a,a)=0, a<=a=1). Regression: the existing set_predicates e2e (asserts `is_subset(`/`is_disjoint(` substrings) is unchanged; `==`/`!=` on sets keep the plain BinOp. New e2e set_predicates_no_move.py rustc-rt. FREE CI. e2e 407->409 (+2). SHIPPED v0.1.351. FOUND BY HUNT-V3 (workflow w93tvcuz6, fresh v0.1.350, 34 findings refilling the backlog)."
- id: PMAT-651
  github_issue: null
  item_type: task
  title: 'PMAT-651: [Tranche 2] CORRECTNESS float floor-division preserves signed zero'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`-0.0 // 1.0` is `-0.0` in Python, but xpile emitted `+0.0` — a silent value-divergence (observable in the printed repr and any sign-dependent downstream use). xpile's float floor-div is CPython's fmod-based `float_divmod` (PMAT-614), but it snapped the quotient with `let __ffl = __fd.floor(); if __fd-__ffl>0.5 {__ffl+1.0} else {__ffl}` — and `floor(0.0)` is `+0.0`, so a zero result always came out positive. CPython's `float_divmod` instead has a dedicated zero-quotient branch: `if (div) { floordiv = floor(div); snap } else { floordiv = copysign(0.0, vx/wx); }` — a zero carrying the sign of the TRUE quotient `a/b`. FIX (both backends' `FloatOp::FloorDiv` formula, NO IR change): replace the unconditional snap with `if __fd != 0.0 { let __ffl = __fd.floor(); if __fd-__ffl>0.5 {__ffl+1.0} else {__ffl} } else { (0.0_f64).copysign(__fa / __fz) }`. So `-0.0 // 1.0` → copysign(0.0, -0.0/1.0) = copysign(0.0, -0.0) = -0.0; `1.0 // 5.0` → copysign(0.0, +0.2) = +0.0. Differential-verified vs python3 over an 11-case truth-table (negzero//pos, -x//pos, pos//neg, poszero, small-pos-zero-quotient, small-neg, normal, neg-result, exact-neg, both-neg, 1e16//3) — all match; no regression on the existing fmod-divmod semantics (the `let __fm = __fa % __fz;` / `__fd - __ffl > 0.5` substrings the prior tests assert are unchanged, now nested in the nonzero branch). New e2e floordiv_signed_zero.py rustc-rt. FREE CI. e2e 407->408. SHIPPED v0.1.350. FOUND BY HUNT-V2 (signed-zero cluster, facet 2 of 2). **SIGNED-ZERO CLUSTER COMPLETE: unary neg (650) + floor-div (651).**"
- id: PMAT-650
