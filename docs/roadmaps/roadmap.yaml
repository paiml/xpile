  title: 'PMAT-634: [Tranche 2] CORRECTNESS for-range loop-variable semantics (synthetic counter)'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (for-loop-variable cluster, hunt H9-0/2/17; found by a differential probe). `for i in range(...)` desugared to a while-loop that used the USER variable as the counter: `let mut i = start; while i <cmp> stop { <body>; i += step }`. Three SILENT miscompiles vs python3: (1) NESTED SAME-NAME loops `for i: for i:` — the inner loop's `i = start` reset the SHARED counter, so the outer `while i<3` saw i left at the inner's end and ran only ONCE (sum 2 not 6); (2) POST-LOOP value: the counter overran to `stop` (the final `i += step` before the failing cond check), but Python leaks the LAST iteration value (`for i in range(3): pass; return i` → 3 not 2); (3) EMPTY RANGE: the unconditional `i = start` init clobbered a pre-existing variable even when the body never ran (`i=99; for i in range(0): pass; return i` → 0 not 99). FIX (frontend lower_for_stmt ONLY, NO new IR): a NEW `LoweringCtx::fresh_loop_counter()` (backed by a `loop_counter: usize` field) mints a unique synthetic counter `__forc{N}` per loop (nested loops get distinct names → fixes (1)). Emit `let mut __forc{N} = start; [let mut i = __forc{N};] while __forc{N} <cmp> stop { i = __forc{N}; <body>; __forc{N} += step }`. The user var is assigned from the counter at the TOP of the body (takes a value only when the body runs → fixes (3) for pre-bound vars). A FRESH user var is still declared in the enclosing scope (initialized from the counter so `start` is evaluated exactly once) so it leaks like Python (fixes (2)); an ALREADY-BOUND var gets no declaration (empty range leaves it untouched). walk_counts already counts the for-target +2 (mutable) so `let mut` is unaffected. All 3 differential-verified vs python3; ordinary/start-stop/step/negative-step/reversed(range)/nested-distinct/for-_/break forms unaffected. New e2e fixture for_loop_var_semantics.py rustc-rt; 4 emitted-shape assertions updated (rust for_range/negative-step/reversed + lean countdown helper now threads __forc0). FREE CI. e2e 392->393. SHIPPED v0.1.333. **Remaining for-loop-cluster: H9-1/3/4/18 (other leak/shadow variants — re-probe). Other epics: typed-exceptions sub-slice 2 (native-panic-typing, deferred to focused firing), dict-by-ref H9-12..14.**"
