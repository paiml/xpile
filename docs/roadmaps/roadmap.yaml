  acceptance_criteria:
  - "`\",\".join(d)` over a dict emitted `d.join(...)` on a `std::collections::HashMap` (no `.join` method) → E0599 (transpile->invalid-rust). Python iterates a dict's KEYS, so `sep.join(d)` joins the (string) keys — `\",\".join(d)` == `\",\".join(d.keys())`. ROOT: the str-method `.join()` lowering (depyler-frontend ~8397) lowered the join arg with plain `lower_expr_in_ctx`, leaving a bare dict that the codegen emitted `.join` on. FIX (frontend ONLY, the StrMethod-call arm, NO IR change): for `op == StrMethodOp::Join` with 1 arg, route the arg through `materialize_iterable_arg` (dict→`DictView{Keys}`, set→SetToList, range→Vec, list→passthrough) — falling back to plain lowering on None — mirroring PMAT-656. So the dict materializes to its keys list before `.join`. Differential-verified vs python3: join_one_key (single-key dict, deterministic)='solo', join(d.keys()) regression, join(list) regression, join(set) bonus. New e2e join_dict_keys.py rustc-rt. FREE CI. e2e 424->425. SHIPPED v0.1.367. FOUND BY HUNT-V4 (join-dict-1). NOTE: multi-key dict join ORDER is nondeterministic — the deferred PMAT-537 dict-iteration-order epic, orthogonal to this E0599 fix; the e2e uses a single-key dict for determinism."
