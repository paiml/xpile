  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-12). int(\"1_000\")==1000 in Python (PEP 515 underscore separators), but the int(str) NumCast (from_str, !to_float) lowered to `(s).trim().parse::<i64>()`; Rust's i64 FromStr rejects '_' -> runtime panic ('invalid digit') on valid Python. FIX (rust+ruchy NumCast codegen): split the from_str branch — float(s) keeps `.trim().parse::<f64>()`; int(s) now emits `{ let __ps = (s).trim(); let __pb = __ps.strip_prefix('-').or_else(|| __ps.strip_prefix('+')).unwrap_or(__ps); if __pb.starts_with('_') || __pb.ends_with('_') || __pb.contains(\"__\") { panic!(ValueError) } __ps.replace('_', \"\").parse::<i64>().expect(ValueError) }`. Python's 'underscore only between digits' is EXACT for an int (digits-only body after optional sign) = no leading/trailing/doubled underscore. Invalid placements (_1, 1_, 1__0, -_1) + any other bad literal still panic ≈ ValueError; empty/whitespace handled by parse-Err. int(float) cast + float(s) unchanged. float(s) underscore (more edge cases around ./e) deferred. New e2e fixture int_str_underscore.py rustc-rt + python3 diff (1_000->1000, 1_000_000->1000000, -2_5->-25, 42->42; _1/1_/1__0 raise via catch_unwind). Updated str_parse int assertion to the new shape. FREE CI. e2e 370->371. SHIPPED v0.1.309. Remaining HUNT-5 clean picks: H5-15 NaN spec'd format, H5-27 comp-var-shadows-bound (3-site), H5-23 float//inf, H5-8 unpack-temp hygiene, H5-30 int max/min empty msg, float(s) underscore. Architectural (deferred): dict iteration order (PMAT-537), typed-exceptions H5-16/17."
