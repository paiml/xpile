  item_type: task
  title: 'PMAT-653: [Tranche 2] CORRECTNESS max()/min() with a float key uses max_by/min_by'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`max(xs, key=lambda x: <float-expr>)` / `min(...)` lowered to `Expr::ListMinMax` with a key and emitted `.iter().cloned().rev().max_by_key(|__k| {...})` / `.min_by_key(...)`. But `max_by_key`/`min_by_key` require the key to be `Ord`, and a float key result is `f64` (no `Ord`) → E0277 (transpile->invalid-rust) for the common 'max/min by ratio/score/distance/key-fn' idiom (e.g. `max(items, key=lambda x: x/total)`). ROOT: the frontend set `ListMinMax.of_float` from the LIST ELEMENT type (`matches!(*elem, Type::F64)`), so a float KEY over an int list left of_float=false and the codegen always used the Ord `*_by_key` path. FIX (frontend + both backends, NO IR change; mirrors the Sorted float-key path PMAT-603): (1) frontend ListMinMax construction — when a `key` is present, set `of_float = sort_key_is_float(ctx, k, sort_target_elem_type(...))` (the KEY body's float-ness) instead of the element type; keyless keeps the element type. (2) rust-codegen + ruchy-codegen `Expr::ListMinMax` — add a `Some(k) if *of_float` arm BEFORE the Ord-key arm that emits `max_by`/`min_by` comparing recomputed keys: `.rev().max_by(|__a,__b| { let p=__a.clone(); <body> }.partial_cmp(&{ let p=__b.clone(); <body> }).unwrap_or(std::cmp::Ordering::Equal))` (min: no rev). NaN-tolerant `unwrap_or(Equal)` matches Python (max/min don't raise on NaN keys, PMAT-616); `max` keeps the `.rev()` so ties resolve to the FIRST element (PMAT-568). An int/Ord key still uses `max_by_key`/`min_by_key` (of_float=false). Differential-verified vs python3: max/min by ratio (x/3.0), negated float key, all-equal-key tie (x*0.0 → returns FIRST element), int-key regression (key=-x still max_by_key). Regression: existing minmax_key_lambda (int chars().count() key) unchanged. New e2e minmax_float_key.py rustc-rt. FREE CI. e2e 409->410. SHIPPED v0.1.352. FOUND BY HUNT-V3 (iter-builtins-1)."
- id: PMAT-652
