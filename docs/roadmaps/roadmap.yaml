  title: 'PMAT-697: [Tranche 2] CORRECTNESS float truthiness in and/or operands'
  status: done
  priority: medium
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`x or 9.0` / `x and y` over float idents (value-return) + `if x and y > 1.0` (bool context) were REJECTED ('operands of and/or must be Bool — no int-truthiness'). A float is truthy iff `!= 0.0` — IEEE-754 EXACT at the edges: `-0.0 != 0.0` is FALSE (falsy), `nan != 0.0` is TRUE (truthy) — matching Python `bool(float)` (same as the existing `truthy_condition` helper + PMAT-681 bool(float)). FIX: a SINGLE F64 arm in `bool_op_operand_truthy` (~12211 — the ONLY truthiness helper that lacked F64; `truthy_condition` ~4063 already had it) → `Expr::BinOp{NotEq, operand, LitFloat(0.0)}`. Both `lower_bool_op_in_ctx` paths then accept floats: the value-return path (ident-lead operands → `if x!=0.0 {x} else {default}`) and the bool-result coercion path (`if x and y>1.0` → `(x!=0.0) && (y>1.0)`). DEFERRED (stay rejected, no trap introduced): `Optional` operands (value-return Optional `x or default` needs `x.filter(|v| truthy(v)).unwrap_or(default)`, NOT unwrap_or — `Some(0) or 7`==7 not 0) and non-`Ident`-leading operands (`s.strip() or d` — needs a temp bind; the bool-result branch correctly refuses to coerce a same-typed value expr to bool). Differential-verified vs python3: or_default(0.0/-0.0/3.0/nan), and_val, in_cond all match; int/str/container bool-op regressions intact. New e2e bool_op_float_truthy.py rustc-rt. FREE CI. e2e 454->455. SHIPPED v0.1.396. FOUND BY HUNT-V7 (item V7-5, float sub-slice)."
