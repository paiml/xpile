  acceptance_criteria:
  - "A format-spec FILL char preceding an alignment (`{:->10}`, `{:*<8}`, `{:.^9}`) was mishandled by `translate_format_spec`. Python's mini-language: when a char is followed by an align char (`<`/`>`/`^`), it's the FILL. xpile had no fill+align branch — so `{:->10}` hit the sign-strip (`spec.strip_prefix('-')`), which treated the `-` fill as a sign flag and dropped it → Rust `{:>10}` → SPACE padding not `-` padding (silent wrong output); and `{:*<8}`/`{:.^9}` (non-sign fills) fell through every branch → REJECT. FIX (frontend ONLY, `translate_format_spec`, NO IR change): add a fill+align branch at the TOP of the fn (before the +/- sign-strip) — collect `spec.chars()`, and if `chars.len() >= 2 && chars[1] is one of <>^ && chars[2..] is all digits`, return `spec.to_string()` verbatim (Rust's `{:fill align width}` syntax is IDENTICAL to Python's). Must precede the sign-strip so a `-`/`+` fill isn't swallowed. The fill-LESS alignment case (`{:>6}`, char[0] is the align) still routes through the existing alignment branch further down (char[1] would be a digit, not an align, so the new branch doesn't match). Shared by BOTH the str.format() path (lower_str_format → translate_format_spec) and the f-string path (apply_nonempty_format_spec → translate_format_spec). Differential-verified vs python3: `{:->10}`.format('ab')='--------ab', `{:*<8}`='hi******', `{:.^9}`='...xy....', f-string `f'{s:->10}'`, `{:0>5}`='000ab' (fill='0'), int `{:*>6}`.format(42)='****42', align-only `{:>6}`='    zz' regression. New e2e format_fill_char.py rustc-rt. FREE CI. e2e 414->415. SHIPPED v0.1.357. FOUND BY HUNT-V3 (strfmt-2). NOTE: this ALSO un-rejected the strfmt-7-adjacent `*`/`.` fills. The remaining str.format radix-neg (strfmt-1) needs a lower_str_format arg-remap rewrite — still deferred."
