  acceptance_criteria:
  - "A function returning a nested function / closure (`def make(k): def inner()->int: return k; return inner`) SILENTLY mis-inferred its return type as the CLOSURE's call-result type (i64), emitting `fn make(k:i64)->i64 { let inner=||{k}; inner }` → rustc E0308 (returns the closure, not i64). INVALID-RUST + INCONSISTENT (the annotated `-> Callable[...]` form already rejects cleanly via parse_type_annotation). FIX (frontend only, NO IR change): before `let inferred_return = infer_type_in_ctx(...)` (~2074), if the trailing return is `Expr::Ident(name)` and `ctx.closure_returns.contains_key(name)` (the existing map populated for `name = lambda` ClosureLet ~7309 + nested `def` ~7359), reject with a clear 'function returns a nested function / closure (`name`) — returning a callable is not supported at v0.2.0 ... inline the logic, or call it before returning'. Fires regardless of declared annotation (a wrong `-> int` over a returned closure also mis-compiled). A nested closure USED locally (`adder` calls `inc(k)` + returns the int sum) is UNAFFECTED (the trailing return isn't the closure Ident). Differential-checked: make_const rejects cleanly (reject-asserted e2e); adder transpiles + adder(5)=12 (rustc-rt regression). New e2e return_nested_fn.py + local_closure_used.py. FREE CI. e2e 490->492. SHIPPED v0.1.431. FOUND BY HUNT-V10 (item V10-4). FOLLOW-UP (capability): lower a returned callable to `impl Fn`/`Box<dyn Fn>` (deferred); V10-3 closure-capture-then-mutate (Rc<Cell>) still open."
- id: PMAT-731
