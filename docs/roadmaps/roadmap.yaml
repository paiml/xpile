  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`def f(x, acc=[0]): acc.append(x)` SILENTLY diverged — Python evaluates a default ONCE at definition and shares that single instance across every call (mutations accumulate, the famous gotcha), but xpile fills the default expr at each call site (fresh value per call). SILENT-WRONG (worst class). FIX (frontend `lower_function_def`, NO IR): capture each param's default AST before the args are consumed; after `LoweringCtx::new` runs the mutability pre-pass, reject a param whose default is a mutable-collection LITERAL (`ast::Expr::List`/`Dict`/`Set`) AND whose name is in `ctx.mutable` (mutated: append/insert/subscript-assign/reassign), with a clear `Optional[...] = None` + init-in-body message. PRECISE: a READ-ONLY mutable default is unaffected (fresh copy per call observably identical → still transpiles); a mutated param WITHOUT a default (ordinary pass-by-value mutation) is unaffected. dict/set defaults use the same path as the tested list case. Verified: 3 reject kinds + readonly_default.py rustc-rt (run()==50 vs python3). FREE CI. e2e 505->507. SHIPPED v0.1.441. FOUND BY HUNT-V12 (items V12-9/10/11; also V12-12 call-expr-default deferred — scalar call-expr re-eval is a distinct broader case). Full def-time-shared support (hoist to static) intentionally NOT done — mutable-default-sharing is a universally-linted anti-pattern, reject is the right v0.2.0 guidance."
- id: PMAT-740
