  - "`len(obj)` over a user class defining `__len__` emitted `obj.len() as i64` → E0599 (struct has no .len()). Python len() calls obj.__len__(). FIX (frontend len() dispatch, after the tuple-arity check, before the final Expr::Len): when inner_ty is Type::Struct(sname) and ctx.struct_methods[sname] contains a `__len__`, lower to `Expr::MethodCall{obj, method:\"__len__\", args:[]}`. Containers/tuple/`s.encode()` byte-len unchanged. Verified vs python3: len(Bag(5))=5, len(Bag(3))+1=4. New e2e dunder_len.py. FREE CI. e2e 532->533. SHIPPED v0.1.466. FOUND BY HUNT-V16 (DD-03, first of the dunder-dispatch cluster). NEXT (rest of dunder cluster): DD-04 obj[i] w/ __getitem__→native index E0608 (route to __getitem__ method); DD-05 obj1+obj2 w/ __add__→checked_add E0599 (route binop to dunder); DD-07 `<`/sorted ignore __lt__ (impl PartialOrd from __lt__); DD-06 __call__ E0618; DD-08 `x in obj` __contains__ reject. Then #10 oc-ternary-int-branch-widened; #15/16 GEN-01/02. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
- id: PMAT-765
  github_issue: null
  item_type: task
  title: 'PMAT-765: [Tranche 2] CORRECTNESS snapshot a range() stop bound once at loop entry (HUNT-V16 #5 CFD-1/CFD-2)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "Python evaluates range(...) args ONCE at loop entry (range frozen). The range-for desugar put `stop_expr` directly in the `while` cond → RE-EVALUATED each iter: `for i in range(len(xs)): xs.append(..)` re-read xs.len() as the body grew xs → bound outpaced counter → INFINITE LOOP (CFD-1); `for i in range(n): n += 10` same (CFD-2). SILENT-WRONG (non-termination). FIX (frontend lower_for_stmt): snapshot a NON-literal stop into a fresh `__forstop{N}` let (mutable:false) before the loop, compare counter against it; a LitInt stop stays inline (no churn for range(5)). start already eval'd once into the counter let; step is a parsed literal. New `fresh_range_stop()` helper. Verified vs python3: range(len(xs))+append→3 (terminates), range(n)+`n+=10`→3, range(5)→10. New e2e range_stop_snapshot.py; updated for_range_emitted_rust_computes_correct_values while-cond assertion to the __forstop form. FREE CI. e2e 531->532. SHIPPED v0.1.465. FOUND BY HUNT-V16 (#5). NEXT V16: DUNDER cluster DD-03/04/05/06/07/08 (len/getitem/add/lt/call/contains → user method) = coherent epic; #10 oc-ternary-int-branch-widened; #15/16 GEN-01/02 list(enumerate(range))/zip. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
- id: PMAT-764
  github_issue: null
  item_type: task
  title: 'PMAT-764: [Tranche 2] CORRECTNESS tag a literal-index OOB panic as xpile: IndexError (HUNT-V16 #4)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "A non-negative LITERAL list index OOB (`data[10]`) emitted bare `data[10i64 as usize].clone()` → panics with Rust's NATIVE 'index out of bounds' (no `xpile:` prefix). Inside a try, the typed-except re-raise filter (PMAT-731) only re-raises `xpile:<KnownExc>:` payloads, so the native IndexError was SILENTLY SWALLOWED by an unrelated handler (`except KeyError:` caught it) vs Python propagating. The runtime/negative index path was already tagged (PMAT-744); the nonneg-literal fast path was the gap. FIX (both backends, nonneg-literal `Expr::Index` arm): bind collection by-ref + bounds-check with `panic!(\"xpile: IndexError: list index out of range\")` before `__lc[__li].clone()` (mirror the runtime path). In-range byte-identical behavior (LLVM elides check at -O). Verified vs python3: data[10] in try…except KeyError propagates, except IndexError catches (-2), in-bounds data[1]=20. New e2e const_index_indexerror.py; updated 4 string-assert tests (block_index→`__lc=&({`+`__lc[__li].clone()`, starred_unpack/list_positional_unpack/neg_runtime_list_index→`let __li = (0i64) as usize`). FREE CI. e2e 530->531. SHIPPED v0.1.464. FOUND BY HUNT-V16 (#4). NOTE: str-index OOB in try may have the same gap (follow-up). NEXT V16: #5 CFD-1 range(len(mut)) infinite loop (silent-wrong, eval range stop once). DUNDER cluster DD-03..08 epic. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
- id: PMAT-763
  github_issue: null
  item_type: task
  title: 'PMAT-763: [Tranche 2] CORRECTNESS discriminate a tuple except (A, B) instead of catch-all (HUNT-V16 #3)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "A tuple `except (A, B):` emitted a bare `Err(_) => body` (no type guard) → swallowed ANY exc incl. one not listed (e.g. `except (KeyError, ValueError):` caught ZeroDivisionError), where Python catches only the listed types. SILENT-WRONG control flow. The single-named `except E:` already built the `xpile: <T>:` re-raise denylist (PMAT-731). FIX (IR + frontend + both backends): `TryCatch.except_type: Option<String>` → `except_types: Vec<String>` (#[serde(default)]; empty=catch-all, 1=single, many=tuple). Frontend `except_type_names`: `[E]` for `except E:`, `[A,B]` for tuple, EMPTY for bare/base-class (a base class — Exception/BaseException/LookupError/ArithmeticError — anywhere in a tuple makes the whole handler catch-all). Both backends: `others = KNOWN_EXC \\ except_types`, re-raise on a payload prefix in `others`. Verified vs python3: `except (KeyError,ValueError)` around `10//0` propagates ZeroDivisionError, around `int('abc')` catches ValueError (-7). New e2e tuple_except_typed.py. FREE CI. e2e 529->530. SHIPPED v0.1.463. FOUND BY HUNT-V16 (#3). NEXT V16: #4 raw-index native-panic in try (silent-wrong, const-positive subscript → tag as xpile: IndexError:, extends PMAT-744/747), #5 CFD-1 range(len(mut)) infinite loop (silent-wrong, eval stop once). DUNDER cluster DD-03/04/05/06/07/08 epic. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
- id: PMAT-762
  github_issue: null
  item_type: task
  title: 'PMAT-762: [Tranche 2] CORRECTNESS delegate == to a custom dataclass __eq__ (HUNT-V16 #2 DD-01)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
  - "A dataclass defining `__eq__` got `#[derive(PartialEq)]` AND a dead __eq__ method → `==` dispatched to the STRUCTURAL derive (all fields), silently overriding the user equality (e.g. __eq__ comparing only self.x). SILENT-WRONG bool, also via `if a==b` and `x in list`. FIX (both backends, Item::Struct): `has_custom_eq = methods.any(name==__eq__)`; when set, suppress PartialEq derive (and Eq/Hash — custom __eq__ not guaranteed reflexive, and a Python class w/ __eq__ but no __hash__ is unhashable, so matches Python), and emit `impl PartialEq for T { fn eq(&self, __other: &Self) -> bool { self.__eq__(__other.clone()) } }` (generated __eq__ takes other by value → clone the borrowed RHS). Also fixes DD-02 `x in list` (Vec::contains uses correct eq, no in-lowering change). Verified vs python3 (__eq__ compares only .x): Pt(1,2)==Pt(1,9) True, ==Pt(2,2) False, Pt(1,99) in [Pt(1,5),Pt(3,7)] True. New e2e dataclass_custom_eq.py. FREE CI. e2e 528->529. SHIPPED v0.1.462. FOUND BY HUNT-V16 (#2 DD-01, also closes DD-02). NEXT V16: #3 tuple-except blanket-catch (silent-wrong), #4 raw-index native-panic in try (silent-wrong, extends PMAT-744/747), #5 CFD-1 range(len(mut)) infinite loop (silent-wrong). Rest of DUNDER cluster DD-03/04/05/06/07/08 = coherent epic. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
- id: PMAT-761
  github_issue: null
  item_type: task
  title: 'PMAT-761: [Tranche 2] CORRECTNESS parenthesize the len() cast so `len(x) < N` parses (HUNT-V16 #1 CFD-3)'
  status: done
  priority: low
  created: 2026-06-18T00:00:00Z
  acceptance_criteria:
