  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #7 H7-20, fresh v0.1.315 binary). Python bool is an int subtype: `flag == 1`, `flag < 2`, `True == 1` are valid. xpile emitted a bare `bool OP i64` → rustc E0308 (transpile-success → invalid Rust). The ARITHMETIC path already coerced bool (PMAT-565 to_i64_operand), but the COMPARISON path didn't — this is the explicitly-documented deferred half of the bool-as-int story. FIX (frontend build_chain_cmp, NO new IR): when one comparison operand is Bool and the other I64, coerce the bool side to i64. KEY SUBTLETY: build the cast DIRECTLY from the authoritative lt/rt types (new helper bool_to_i64_cast → Expr::NumCast{to_float:false}), NOT via to_i64_operand which RE-INFERS — in a CHAINED comparison (a<=b<c) the operands are __cmpN temps bound only inside the result Block and NOT registered in ctx.name_types, so re-inference returns the I64 default and SILENTLY SKIPS the coercion (the float path's to_f64_operand survives that only because a redundant `f64 as f64` is harmless; a missed bool cast is not). build_chain_cmp serves BOTH the simple 2-operand case (line ~11909) and each chained pair (~11935), so one fix covers both. bool/bool needs no coercion (Rust bool: Ord, false<true matches Python); bool/float is a rarer separate follow-up (to_f64_operand on bool would emit invalid `(true) as f64`). New e2e fixture bool_int_compare.py rustc-rt + python3 diff (beq/ieqb/blt/blit/chained/both_bool all match). FREE CI. e2e 377->378. SHIPPED v0.1.316. **LESSON: in build_chain_cmp / any chained-temp context, coerce using the PASSED-IN type, never re-infer — chained temps aren't in ctx.** Remaining hunt #7 picks (see [[project-correctness-hunt-backlog]] HUNT 7): H7-7 d.get-no-default==int E0308, H7-18 modpow neg-base+neg-mod, H7-1 titlecase, for-loop-var cluster H7-14/16/17, pass-by-ref epic H7-8/13."
- id: PMAT-616
  github_issue: null
  item_type: task
  title: 'PMAT-616: [Tranche 2] CORRECTNESS sorting a float list with NaN no longer panics'
  status: done
  priority: medium
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS/ROBUSTNESS (differential hunt #6, re-verified on fresh v0.1.314). Sorting a float list/key containing NaN lowered to `partial_cmp(...).unwrap()`, which PANICS (partial_cmp returns None for NaN). Python's sorted/list.sort does NOT raise on NaN — it yields an UNDEFINED-but-non-crashing order (Python's NaN comparator isn't a valid total order, so NO deterministic Rust comparator can replicate it: e.g. sorted([nan,3,1,2])==[1,nan,2,3], not even sorted). Prior comments wrongly claimed 'NaN panics, like Python'. FIX (rust+ruchy codegen, NO new IR): all SIX float-sort comparator sites — keyless sorted asc/desc, in-place xs.sort()/sort(reverse=True), float key= asc, float key= desc-stable — changed `.unwrap()` → `.unwrap_or(std::cmp::Ordering::Equal)`. For FINITE floats partial_cmp never returns None, so this is BYTE-IDENTICAL behavior (finite sorts stay python3-exact, zero risk to passing tests); only NaN now falls back to Equal (no crash; resulting NaN order is unspecified-but-defined, acceptable since Python's is also unspecified). Chose unwrap_or(Equal) over total_cmp to preserve -0.0/+0.0 stable equality (total_cmp orders -0.0<+0.0, diverging from Python). New e2e fixture sorted_float_nan.py: finite sorts cross-checked vs python3 + NaN sort via catch_unwind asserts no-panic + all elements preserved + finite part sorted. Updated 2 existing assertions (list_mutate, sorted_reverse) to the new comparator shape; fixed misleading sorted_float doc comment. FREE CI. e2e 376->377. SHIPPED v0.1.315. This DRAINS the last cleanly-actionable item from hunt #6. NEXT: run a PROPER hunt #7 against the FRESH binary (agents use `cargo run`, NOT a stale path — see [[project-correctness-hunt-backlog]] stale-binary lesson). Architectural (deferred): dict order (PMAT-537), typed-exceptions, ownership-by-ref."
- id: PMAT-615
  github_issue: null
  item_type: task
  title: 'PMAT-615: [Tranche 2] CORRECTNESS augmented set ops s -=/|=/&=/^= other compile'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #6, re-verified on fresh v0.1.313). Augmented set assignment fell through to a numeric/bitwise BinOp → invalid Rust on a mainstream idiom (transpile-success → rustc reject): `s -= other` → `HashSet::checked_sub` (E0599, no such method); `s |= / &= / ^= other` → owned-value `|`/`&`/`^` on HashSet (E0369 — std impls BitOr/BitAnd/BitXor for HashSet only on REFERENCES, not owned values). The NON-augmented forms (`s - other` etc.) already lowered correctly to Expr::SetOp via the binop path. FIX (frontend combine_aug, NO new IR): added a branch — when both operands are Type::Set and set_op_from_ast(ast_op).is_some(), produce Expr::SetOp{op,lhs,rhs} (difference/union/intersection/symmetric_difference), exactly like the binop `s - other`. Mirrors the existing dict-`|=`→DictUpdate and list-`+=`→ListExtend special-casing. combine_aug is reached for set targets because lower_aug_assign's Name branch only special-cases List/Dict before falling to combine_aug; mutability handled by the existing reassignment pre-pass (emits `let mut s`). New e2e fixture augmented_set_ops.py rustc-rt + python3 diff ({1,2,3} op {3,4,5} → sub [1,2], or [1,2,3,4,5], and [3], xor [1,2,4,5]). FREE CI. e2e 375->376. SHIPPED v0.1.314. **PROVENANCE/LESSON: hunt #6 (workflow wczysb9kp) accidentally ran against a STALE v0.1.288 binary (I handed agents `target/debug/xpile`, an old leftover; real builds go to CARGO_TARGET_DIR=/mnt/nvme-raid0/...). 26/28 findings were already-fixed. Re-verifying on the FRESH binary salvaged 2 genuinely-open: this (PMAT-615) + sorted(list[float]) NaN panic. NEVER hand hunt agents a binary path — use `cargo run` or verify `<bin> --version` first.** Remaining OPEN: sorted(list[float]) with NaN panics (partial_cmp().unwrap()→None) vs Python's defined order [nan,1,2] — candidate next slice. Architectural (deferred): dict order (PMAT-537), typed-exceptions, ownership-by-ref."
- id: PMAT-614
  github_issue: null
  item_type: task
  title: 'PMAT-614: [Tranche 2] CORRECTNESS float a // b is CPython float_divmod, not floor(a/b)'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-23 broadened). Python float `a // b` is CPython float_divmod (Objects/floatobject.c), NOT `(a/b).floor()`. The naive floor OVER-ROUNDS whenever a/b lands just below an integer in float repr — the TEXTBOOK `1.0 // 0.1` is 9.0 in Python but `(1.0/0.1).floor()`==10.0 (also 2.0//0.1→19 not 20, 5.5//1.1→4 not 5: COMMON, high-realism). Also mishandled infinite operands (inf//2==nan, -5.0//inf==-1.0, 5.0//-inf==-1.0, 1e308//1e-308==inf). Started as the niche inf-only finding; the differential check surfaced the common finite divergence → upgraded to HIGH priority. FIX (rust+ruchy FloatOp::FloorDiv codegen, NO new IR): replicate CPython exactly — `mod = fmod(a,b)` (Rust `%` IS C fmod), `div = (a-mod)/b`, `if mod!=0 && (b<0)!=(mod<0) { div -= 1.0 }`, `fl = floor(div); if div-fl > 0.5 { fl+1.0 } else { fl }`. Both operands bound to temps __fa/__fz (evaluate-once); PMAT-581 zero-divisor ZeroDivisionError guard preserved. NOTE Python's math.fmod WRAPPER raises on inf but Rust's `%` (and CPython's internal C fmod) returns nan for inf%x → the Rust emit is correct for inf even though the Python-math-module port of the algo errors; verified the RUST algo vs python3's `//` operator across 20 cases (common-repr/signed/inf/nan/large-mag) — all values match (only textual f64 Display differs). New e2e fixture float_floordiv_semantics.py + extended float_floordiv_mod (updated assertion `((a)/__fz).floor()` → `let __fm = __fa % __fz` + `__fd - __ffl > 0.5`). FREE CI. e2e 374->375. SHIPPED v0.1.313. **LESSON: probing a 'niche' edge (inf//) with a differential check can surface a COMMON bug (1.0//0.1) hiding behind it — always run the full python3 truth-table, don't assume the documented finding is the whole story.** float `%` already correct (PMAT-591). Remaining HUNT picks: H4-20 int==float precision (>2^53, fiddly), H4-15 float set/dict comp (E0277, architectural), H5-15 NaN spec'd format. Architectural (deferred): dict order (PMAT-537), typed-exceptions, ownership-by-ref."
- id: PMAT-613
