  title: 'PMAT-650: [Tranche 2] CORRECTNESS unary float negation preserves signed zero'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "Unary `-x` over a float VARIABLE (not a literal) was lowered to a `FloatBinOp{Sub, lhs: 0.0, rhs: x}` → `0.0 - x`. But `0.0 - 0.0 == +0.0` in IEEE-754, so negating a zero LOST THE SIGN: `-x` with x==0.0 produced `+0.0` and printed \"0.0\", where Python `-x` flips the sign bit and prints \"-0.0\". Silent value-divergence wherever signed zero is observable (repr/str, sign-dependent downstream math; the literal `-0.0` fold was already correct, only the variable path was wrong). FIX (frontend ONLY, the context-aware `ast::Expr::UnaryOp(USub)` arm over an F64 non-literal operand; NO IR/codegen change): construct `FloatBinOp{Mul, lhs: operand, rhs: LitFloat(-1.0)}` → `x * -1.0` instead. Multiplication by -1.0 flips the sign bit for EVERY value — ±0.0, ±inf, nan, and all finite floats — and is BIT-EXACT with `-x` (multiplication by ±1.0 is exact in IEEE-754, no rounding). The negative-float-literal fold (PMAT-502bo) and i64 negation (checked_neg) paths are untouched. Differential-verified vs python3: -0.0 (str \"-0.0\", was \"0.0\"), -3.5, `-(-0.0)` flips back to +0.0, `-0.0 + 0.0 == +0.0`. New e2e neg_float_signed_zero.py rustc-rt; existing neg_float_var shape assertion updated `(0f64 - x)` -> `(x * -1f64)`. FREE CI. e2e 406->407. SHIPPED v0.1.349. FOUND BY HUNT-V2 (signed-zero cluster, facet 1 of 2; the `-0.0 // 1.0` floor-div facet is a separate follow-up). NOTE: the HUNT-V2 controlflow-ternary 'possible miscompile' finding was investigated and does NOT reproduce on fresh 0.1.348 (already correct) — dropped from the queue."
