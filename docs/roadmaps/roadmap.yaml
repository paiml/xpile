  title: 'PMAT-738: [Tranche 2] CORRECTNESS clear reject for a local/param shadowing a module const'
  status: done
  priority: low
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`LIMIT = 6` inside a function with a module-level `const LIMIT` emitted a reassignment of the Rust `const` → E0070. In Python the name is a function-local (assignment makes it local for the whole scope). INVALID-RUST, common. Rust CANNOT express the shadow: a `let LIMIT` whose name matches an in-scope `const LIMIT` is a CONSTANT PATTERN not a binding (E0005), and a param can't shadow a const (E0530); faithful support needs a function-wide rename across every read / for-loop var / tuple target (deferred). FIX (frontend only): `LoweringCtx::new` precomputes `shadowed_consts` = module consts ASSIGNED in the body (via `walk_counts`) and NOT shadowed by a same-named param (so a normal param reassignment is untouched); `lower_assign` rejects an assignment to such a name with a clear rename-suggesting message; `lower_function_def` rejects a param sharing a const name (E0530) upfront. A function that only READS a module const is unchanged (resolves to the `const`). e2e: local_shadows_const.py + param_shadows_const.py (reject-assertions) + const_read_only.py (rustc round-trip, scaled(6)==49 vs python3). FREE CI. e2e 499->502. SHIPPED v0.1.438. FOUND BY HUNT-V12 (item V12-5; also covers V12-6). Full rename-based support deferred."
