  - "`obj[i]` over a user class defining `__getitem__` fell through to the list-index path → struct can't be indexed (E0608)/no .len() (E0599); Python calls obj.__getitem__(i). FIX (frontend lower_expr_in_ctx_inner Subscript arm, after Dict/before Str check): when `infer_type(collection)` is Type::Struct(sname) and ctx.struct_methods[sname] has `__getitem__`, lower to `Expr::MethodCall{obj:collection, method:\"__getitem__\", args:[index]}`. Dict/str/list subscripts + slices unchanged. Verified vs python3: Row(10,20)[0]+[1]=30, Row(7,8)[i]=7/8. New e2e dunder_getitem.py. FREE CI. e2e 533->534. SHIPPED v0.1.467. FOUND BY HUNT-V16 (DD-04, 2nd of dunder cluster). NEXT dunder: DD-05 obj1+obj2 w/ __add__→checked_add E0599 (route binop over struct operands to __add__/__sub__/__mul__); DD-07 `<`/sorted ignore __lt__ (impl PartialOrd from __lt__); DD-06 __call__; DD-08 `x in obj` __contains__. Then #10 oc-ternary-int-branch-widened; #15/16 GEN-01/02. DEFER (architectural): nested-list aliasing; mixed-numeric winner-type."
