  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "Completes the negative-index work (read PMAT-639, single-index write PMAT-640). A nested subscript WRITE `grid[i][j] = v` emitted `grid[i as usize][j as usize] = ...` (no wrap), so a runtime-negative index at ANY level panicked, where Python wraps (`grid[-1][-1] = v`). FIX (both backends' Stmt::IndexAssign, NO new IR): generalize the single-index negative-wrap to N LEVELS. Gate `any_runtime` = any index not a non-negative literal. When set, stage each level's wrapped index into a temp: `let __ai{n}: i64 = (index) as i64; let __aidx{n} = if __ai{n} < 0 { <list>[__aidx0 as usize]..[__aidx{n-1} as usize].len() as i64 + __ai{n} } else { __ai{n} };` — i.e. each level wraps via the PROGRESSIVELY-INDEXED collection's OWN len (only evaluated when that index is actually negative, since the `if` else-branch skips it). Then store `<list>[__aidx0 as usize]..[__aidxN as usize] = value`. Staging the indices FIRST ends the collection's immutable borrow before the index_mut assign — so this SUBSUMES the old `needs_temps` self-referential path (`xs[len(xs)-k]=v` mentions the receiver), simplifying the codegen 3 paths -> 2 (any_runtime wrap-all + all-non-negative-literal bare). Differential-verified vs python3: grid[-1][0]=99, grid[0][-1]=88, grid[-1][-1]=77, single-neg, self-ref len-1, literal. Regression: positive/literal/loop/nested-literal writes unaffected. 3 existing shape assertions updated (nested_index_assign / nested_aug_assign / neg_runtime_index_assign now __aidx{n}). New e2e neg_nested_index_assign.py rustc-rt. FREE CI. e2e 399->400. SHIPPED v0.1.340. **NEGATIVE-INDEXING COMPLETE: read (639) + single write (640) + nested write (641).**"
