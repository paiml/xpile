  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`for k in d: d[k] = d[k] * 2` — updating dict VALUES during iteration (size-stable, legal Python) — hit rustc E0502: the lazy `d.keys().cloned()` borrows `d` for the whole loop, conflicting with the in-body `d.insert(...)`. INVALID-RUST, common idiom. FIX (frontend `lower_for_stmt`, NO IR): the `Type::Dict` key-iteration branch, when the iterated dict ident is in `ctx.mutable` (mutated somewhere in the fn), now materializes the keys to an owned Vec via `Expr::DictView{kind: Keys}` (iterated as a `List(K)`, over_keys=false) instead of the lazy view → `for k in d.keys().cloned().collect::<Vec<_>>().iter().cloned()`, leaving `d` free to mutate. Matches Python's key-iteration for the size-stable value-update case. A read-only dict iteration keeps the lazy `keys().cloned()` (no alloc); over-materializing a dict mutated only outside the loop is harmless. Verified vs python3 (double_vals({1:10,2:20,3:30})==120). New e2e dict_iter_value_update.py (rt). FREE CI. e2e 507->508. SHIPPED v0.1.442. FOUND BY HUNT-V12 (item V12-2). Size-CHANGING mutation (insert/delete keys → Python RuntimeError) is V12-8, deferred."
- id: PMAT-741
