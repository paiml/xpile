  title: 'PMAT-748: [Tranche 2] CORRECTNESS escape control bytes in emitted string literals (HUNT-V14 #3)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "A Python string literal with control bytes was emitted with RAW bytes in the Rust `String::from(\"...\")` literal. Bare CR (`\"\\r\"`) → rustc hard error 'bare CR not allowed in string' (transpile-success→invalid-rust); raw CRLF → Rust lexer normalizes to lone LF, silently DROPPING the CR (`len(\"x\\r\\ny\")` was 3 not 4 — silent-wrong, breaks Windows/CRLF/protocol strings). COMMON. FIX (both backends): `escape_rust_str`/`escape_ruchy_str` (plain LitStr) + `escape_format_literal` (f-string/format! literal segments) escape `\\n`/`\\r`/`\\t`/`\\0` by name and every other C0/DEL char via `\\u{..}`. `escape_format_literal` already had `\\n`/`\\r`/`\\t`; added `\\0` + the `\\u{..}` fallback and brought the plain-literal escapers to parity. Verified vs python3: len('data\\r')=5 (was compile error), len('x\\r\\ny')=4 (was 3), tab/NUL/f-string-CRLF correct, no raw CR byte in emitted source. New e2e str_control_byte_escape.py. FREE CI. e2e 513->514. SHIPPED v0.1.448. FOUND BY HUNT-V14 (#3). NEXT V14 picks: #4 nf-reassign-immutable (E0384), #6 dc-order-sort-no-ord (E0277), #8 BM-02 str(None) (E0423), #9 BM-01 max/min mixed int+float keeps int-winner type."
- id: PMAT-747
