  - "Ninth classes sub-slice. Augmented struct field assignment obj.field <op>= v desugars to obj.field = obj.field <op> v, reusing the shipped Expr::FieldAccess read + Stmt::FieldAssign write (PMAT-506c) + combine_aug. ZERO new IR. lower_aug_assign gains an ast::Expr::Attribute target arm (before the catch-all): obj must be a plain Name typing Type::Struct(sname) with field a known member (mirrors the 506c Assign Attribute arm); builds current = FieldAccess{obj:Ident(obj), field}, value = combine_aug(op, current, rhs), ctx.mutable.insert(obj), returns FieldAssign{obj, field, value}. self.field <op>= v lowers to FieldAssign{obj:\"self\",…} → rejected by body_assigns_self (read-only methods), consistent with self.f = v. CALLER MUT: walk_counts AugAssign arm now also counts an Attribute(Name(obj)) target (else-if after the subscript-chain case), bumping obj so a literal-constructed local receiver gets `let mut` (mirrors the obj.field = v Assign-arm count). rustc rt dataclass_aug_field.py vs python3: run_deposits(20,30)=145 (+=,+=,-=), scale_bonus(4)=13 (*=,+=), combined(10)=28 (field-to-field +=, -=). All int fields via the C-PY-INT-ARITH checked_* path. NOTE: param-receiver field mutation has the same latent by-value divergence as 506c (Rust copies the param) — fixtures use LOCAL receivers (the sound case); deferred with &mut self. FREE CI. SHIPPED v0.1.209 (e2e 271→272). REMAINING 506: &mut self mutating methods (HARD — walk_counts is purely syntactic; type-blind 'union of mutating method names' over-approximates → spurious let mut → clippy unused_mut when two structs share a method name with differing mutability; needs type-aware caller-mutability + by-ref param semantics), inheritance."
