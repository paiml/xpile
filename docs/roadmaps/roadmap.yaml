  - "CORRECTNESS (differential hunt #4, cluster B, findings #10 set-literal + #22 dict-key — one fix closes both). A @dataclass(frozen=True) is hashable in Python (valid dict key / set element), but xpile emitted every dataclass struct with a fixed `#[derive(Clone, Debug, PartialEq)]` — no Eq/Hash — so a HashSet<C> element (E0277) or HashMap<C,_> key (E0599) was rejected despite a clean transpile. FIX: add `frozen: bool` (#[serde(default)]) to IR Item::Struct, set by a new frontend `class_is_frozen` helper (scans the class decorator_list for a `dataclass(frozen=True)` Call keyword). Rust+Ruchy Item::Struct codegen extend the derive list with `Eq, Hash` when `frozen && fields.all(ty in {I64,Bool,Str})`; a float field disqualifies (f64 is neither Eq nor Hash, matching CPython hashability). Non-frozen dataclasses keep the bare derive (Python makes them unhashable) so existing fixtures are byte-identical (dataclass_def etc. unaffected). Other Item::Struct match sites (lean :65, meta-hir :3065, frontend :12134) use `..` — no ripple. New e2e fixture dataclass_eq_hash.py (frozen Coord used as set element + dict key) rustc-rt + python3 diff (count_unique()==2, dict_key_lookup()==100). FREE CI. e2e 352->353. SHIPPED v0.1.291. Remaining HUNT-4 picks: (C) int-arith overflow H4-14+28 (checked_add, proven pattern), (E) reversed-str/format builtins H4-13+25, H4-11 empty-set() i64-default (set() type inference), H4-1+17 C0-sep whitespace."
