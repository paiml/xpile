  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "A string forward-ref annotation (`-> \"Counter\"`, `x: \"Counter\"`) — idiomatic for a method returning its own class (name unbound at def time) — was rejected ('non-trivial type expression'); the common alternative-constructor classmethod `@classmethod def zero(cls) -> \"Counter\": return Counter(0)` couldn't be used (`c=Counter.zero(); c.n` → result not typed as the class, E0308/non-struct). FIX (frontend `parse_type_annotation`): a `Constant(Str)` annotation whose content is a bare identifier resolves via the same name→Type mapping as a `Name` arm (factored into `resolve_type_name`): `\"Counter\"`→Struct, `\"int\"`→I64, etc., in ANY position (return/param/local). Complex string annotations (`\"list[int]\"`) deferred (clear reject). Verified vs python3: Counter.zero().n=0, Counter.of(7).n=7, `c: \"Counter\"` param resolves. New e2e string_forward_ref_annotation.py. FREE CI. e2e 524->525. SHIPPED v0.1.458. FOUND BY HUNT-V15 (CME-2). FOLLOW-UP: an UNANNOTATED classmethod returning its class still defaults ret=() (needs body-return inference at sig collection). NEXT V15: #5 ONF-4 (Optional flow-narrow into loops), #6 CME-1 (instance in f-string E0277 — needs GENERATED dataclass-repr Display, SIZABLE), #10 CME-3 (dunder dispatch). DEFER (architectural): #11 SMA-01 [[x]*n]*m aliasing; V14-#9 max/min mixed int+float."
