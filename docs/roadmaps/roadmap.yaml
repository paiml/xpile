  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #24). 2-arg (variadic) scalar max(a,b)/min(a,b) over FLOAT operands (NumBuiltin of_float, PMAT-498 ScalarNumBuiltin, distinct from the ListMinMax list-reduction variant) lowered unconditionally to f64::max/f64::min -> IEEE-754 maxNum/minNum: +0.0 treated as > -0.0, and NaN silently dropped. Python returns the FIRST argument on a tie/incomparable compare: max(-0.0,0.0)=-0.0 (Rust 0.0), min(0.0,-0.0)=0.0 (matches), max(nan,1.0)=nan (Rust 1.0). Silent miscompiles (transpile-success + rustc-clean). FIX (rust+ruchy NumBuiltin codegen): when of_float && Min|Max, emit a left fold `{ let mut __m: f64 = args[0]; { let __x: f64 = argN; if __x > __m { __m = __x; } } ... __m }` (cmp `>` for max, `<` for min) — STRICT compare so a tie (-0.0==0.0 -> false) or NaN compare (always false) keeps the earlier value, exactly like Python `result=a; if b>result: result=b`. Integer (i64 total order) and str min/max keep the `.min(`/`.max(` chain. No new IR. Updated min_max_mixed_numeric assertion to the fold shape (runtime values unchanged; mixed int->f64 promotion preserved); num_builtins (int clamp) + min_max_str untouched. New e2e fixture float_min_max.py rustc-rt + python3 diff (signed-zero ties via is_sign_negative; distinct values; 3-arg fold). FREE CI. e2e 361->362. SHIPPED v0.1.300. Remaining HUNT-4 picks (11/29 left): H4-21 d.get->int annotation reject, H4-20 int==float precision >2^53, H4-15 float set/dict comp, H4-2 round(int,ndigits) E0425 (IR+banker's), H4-3 f-string radix neg-int, H4-18+19 titlecase (verify to_titlecase NOT std), H4-26/27/29 low-EV edges, H4-8 nested-fn mut + H4-9 method defaults (architectural)."
- id: PMAT-600
  github_issue: null
  item_type: task
  title: 'PMAT-600: [Tranche 2] CORRECTNESS isspace/strip honor C0 separators U+001C..U+001F'
  status: done
  priority: medium
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, findings #1 isspace + #17 strip family — one slice, 4 string methods, both backends). Python treats the C0 information separators FS/GS/RS/US (U+001C..U+001F) as whitespace for str.isspace() and strip()/lstrip()/rstrip(), but Rust's char::is_whitespace() (and trim/trim_start/trim_end) excludes EXACTLY those 4 codepoints (verified: Python isspace True set minus Rust is_whitespace set = {0x1c,0x1d,0x1e,0x1f}). So `\"\\x1c\".isspace()` returned false and `\"\\x1cabc\".strip()` left the separator — silent ASCII-range miscompiles (transpile-success + rustc-clean). FIX (rust+ruchy codegen): augment the whitespace predicate with `|| matches!(__c, '\\u{1c}'..='\\u{1f}')`. isspace: restructured the `.chars().all(|__c| <pred>)` block so the IsSpace arm emits `(__c.is_whitespace() || matches!(__c, '\\u{1c}'..='\\u{1f}'))` (IsDigit/IsAlpha/IsAlnum arms unchanged: `__c.is_ascii_digit()` etc). strip/lstrip/rstrip: emit `trim_matches`/`trim_start_matches`/`trim_end_matches(|__c: char| __c.is_whitespace() || matches!(__c, '\\u{1c}'..='\\u{1f}'))` instead of bare trim()/trim_start()/trim_end(). Empty-string guard unchanged. No new IR. New e2e fixture c0_whitespace.py rustc-rt + python3 diff (isspace(\\x1c\\x1d\\x1e\\x1f)==True; strip/lstrip/rstrip remove separators; normal-ws + non-ws controls preserved). Updated str_methods/str_methods_more trim assertions (str_predicates unaffected: IsDigit shape same, 'is_whitespace()' still a substring). FREE CI. e2e 360->361. SHIPPED v0.1.299. Remaining HUNT-4 picks: H4-24 max/min float signed-zero/NaN (Python first-arg-wins, contained), H4-21 d.get->int annotation reject, H4-20 int==float precision >2^53, H4-15 float set/dict comp (OrderedFloat/Vec-dedup), H4-2 round(int,ndigits) (needs IR+banker's rounding), H4-3 f-string radix neg-int, H4-18+19 titlecase (NEED verify char::to_titlecase NOT std), H4-26/27/29 low-EV edges, H4-8 nested-fn mut + H4-9 method defaults (architectural/gnarly)."
