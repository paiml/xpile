  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-25). `sorted(xs, key=lambda x: x/2.0)` / `xs.sort(key=lambda x: x*1.5)` over an int list lowered to `sort_by_key(|__k| {let p=__k.clone(); <f64 body>})`; sort_by_key requires Key: Ord, f64 has none -> rustc E0277 despite clean transpile. Distinct from PMAT-578 (float LIST -> Vec<f64>::sort partial_cmp); here the list is int but the KEY returns f64. FIX (NO new IR — reinterpret Expr::Sorted.of_float as 'the COMPARED values are float': the key result when keyed, the element type when keyless). New frontend helper sort_key_is_float(ctx, key, elem_type) clones ctx, binds key.param->elem_type (as lower_sort_key does), infers key.body == F64. Both Sorted construction sites (in-place xs.sort ~2539 and sorted() builtin ~8804) set of_float from the key when key.is_some(), else from the list element type. Rust+ruchy codegen Expr::Sorted keyed arms: added `(Some(k), false) if *of_float` -> `sort_by(|__a,__b| {let p=__a.clone(); body}.partial_cmp(&{let p=__b.clone(); body}).unwrap())`; descending `(Some(k), true)` switches the final `__kb.cmp(&__ka)` to `__kb.partial_cmp(&__ka).unwrap()` when of_float. Int/str keys keep sort_by_key/cmp (byte-identical; all 13 existing sort tests unchanged). NaN keys panic (consistent w/ keyless float sort PMAT-578). New e2e fixture sort_float_key.py (asc by_half, desc by_neg_ratio reverse=True, in-place in_place_scaled) rustc-rt + python3 diff (all -> [1,2,3]). FREE CI. e2e 363->364. SHIPPED v0.1.302. Remaining HUNT-5 clean picks: H5-24 pop(neg runtime idx) panic, H5-5 grid[i]+=list E0599, H5-11 pow(a,b,neg m) sign, H5-13 pow(bool) E0425, H5-27 comp-var-shadows-range-bound, H5-12 int('1_000') underscore, H5-21+22 math.floor/ceil/trunc saturate, H5-28 max/min empty float-gen. TOP architectural: dict iteration order H5-6/7/26 (HashMap->IndexMap, BIG)."
