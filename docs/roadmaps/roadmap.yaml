  acceptance_criteria:
  - "Fourth classes sub-slice — instance methods (the OOP headline). Item::Struct gains `methods: Vec<Function>`. A method = a Function whose FIRST param is `self`, typed Type::Struct(class). rust/ruchy emit `impl Name { pub fn m(&self, …) -> R { body } }`; emit_param renders a param named `self` as `&self` (never `self: Name`). Lean refuses (struct values deferred). NEW Expr::MethodCall{obj,method,args} → `(obj).method(args)`, routed in the ctx-aware Call(Attribute) dispatch (right after the math check) when the receiver infers Type::Struct(name) and method∈ctx.struct_methods[name] (else clean error: unknown method / kwargs). FRONTEND PLUMBING: lower_function_def gained self_type: Option<Type> (the self receiver's struct type; None for top-level fns; `self` param uses it instead of parsing its absent annotation). NEW lightweight class_def_signature(c)→(name,fields,method_returns) used in the parse_and_lower pre-pass to build BOTH structs (fields) + struct_methods (method return types) registries — resolves the chicken-and-egg of typing obj.m() before bodies lower. lower_class_def lowers each `def` member via lower_function_def(self_type=Some(Struct)). Inference: MethodCall→method's declared return type (registry). **READ-ONLY FIRST CUT: body_assigns_self() rejects a method that assigns self.field (a &mut self receiver needs caller-side mutability inference → deferred; never emit non-compiling code). classmethods/staticmethods (no self first param) rejected.** CLIPPY: lower_function_def + LoweringCtx::new hit too_many_arguments (8/7) → #[allow]. rustc rt dataclass_methods.py vs python3: area (reads self fields), scaled_area (calls self.area() + extra param), total (method calls on a param). FREE CI. SHIPPED v0.1.204 (e2e 265→266). **CLASSES now: def(506a)+construct/field-read(506b)+field-assign(506c)+read-only methods(506d). REMAINING 506: &mut self mutating methods (needs caller-mutability inference), field defaults, kwarg construction, inheritance, classmethod/staticmethod. NEXT 506e candidate: &mut self methods OR field defaults OR kwarg construction.**"
