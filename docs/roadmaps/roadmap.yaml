  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A bare radix `str.format` spec (`\"{:x}\".format(n)` / `{:X}`/`{:o}`/`{:b}`) over an int formats negatives SIGN-MAGNITUDE in Python (`\"{:x}\".format(-255)`==\"-ff\"), but xpile embedded Rust's `{:x}` = TWO'S-COMPLEMENT (`ffffffffffffff01`) → silent wrong output for negatives. (The f-string FormatSpec path already fixed this in PMAT-613 via Expr::IntRadixStr; `.format()`/lower_str_format did NOT share the guard.) FIX (frontend ONLY, lower_str_format ~12442, NO IR change): when a field's spec is a bare radix (x/X/b/o) over an I64 arg AND that arg is referenced EXACTLY ONCE in the template, reuse Expr::IntRadixStr{prefixed:false} (emits sign + radix of unsigned_abs, matching Python + the hex/bin/oct builtins) — replace args[arg_idx] in place with the radix string and emit a PLAIN field (no spec). A small PRE-SCAN counts per-arg references (mirroring the auto `{}` vs explicit `{N}` field parsing) so the in-place replacement is only applied when safe (ref_count==1); a multi-reference arg (`\"{0} {0:x}\"`, rare) keeps the existing translate_format_spec embed path UNCHANGED (correct for non-negatives — NO regression). Differential-verified vs python3: hex/oct/bin/HEX of -255, mixed two-field (`\"{:x} and {:b}\"`), radix surrounded by literal text (`\"val=0x{:x}!\"`==\"val=0x-ff!\"), non-negative regression, multi-ref fallback. New e2e format_radix_neg.py rustc-rt. FREE CI. e2e 432->433. SHIPPED v0.1.375. FOUND BY HUNT-V5 (string-format-3). NOTE: radix-WITH-width (`{:08x}`) negative sign-aware zero-pad still deferred (same as the f-string path)."
