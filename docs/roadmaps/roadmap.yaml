  acceptance_criteria:
  - "`a, *rest = xs` (head/tail destructuring) was rejected ('non-Name tuple-unpacking target'). Added the star-LAST form (prefix plain-names + one trailing `*name`) over a list[T]. FIX (frontend desugar, NO new IR — reuses Index + Slice): a lower_block_stmt hook (in the Tuple-target branch, before the subscript/reassign checks) detects a tuple whose LAST elt is Starred(Name) with all-Name prefix, and routes to new fn `lower_starred_unpack` -> Vec<Stmt>. It lowers the RHS (must be List[T]); if it's a plain Ident the collection is indexed/sliced DIRECTLY (Index/Slice BORROW it, so it is NOT moved — source stays usable, verified), else binds a `__starunpack` temp. Emits `let n_i = coll[i]` (Index, literal i — non-neg-literal fast path) for each prefix name + `let star = coll[p:]` (Slice lo=Some(p) or None when p==0, hi=None) for the rest. ctx.bound + name_types updated per binding (prefix -> elem_ty T, star -> List(T)); mutable from the prewalk. Star-first (`*init, last`) and star-mid (`a, *mid, b`) DEFERRED (need len-relative suffix indices). Names use Let (fresh-binding assumption; reassign-via-starred-in-loop is a deferred edge, same class as pre-PMAT-572). Differential-verified vs python3: head/tail 109, two-prefix 33, (*rest,) star-only 6, empty-tail 3, from-var keeps-source 12 (not moved), from-call temp 6, str elems x|y,z. Regression: plain tuple unpack unaffected. New e2e starred_unpack.py rustc-rt. FREE CI. e2e 403->404. SHIPPED v0.1.344. Found by a differential probe."
