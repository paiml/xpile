  - "A self-referential nested `def` (`def fact(n): def go(k): … go(k-1) …; return go(n)`) lowered to a `let go = |k| …` closure; the self-call inside it hit rustc E0425 (a closure can't reference its own binding while being defined). INVALID-RUST, common idiom. FIX: new `Stmt::NestedFn { name, params, ret, body: Block }` IR node — a NAMED inner `fn` (in scope for its whole body, recurses cleanly). Frontend `desugar_nested_fn` does a capture/self-reference analysis via a new EXHAUSTIVE `collect_block_idents` walker in meta-hir (the read-only mirror of the `escape_*` identifier walker, so it stays structurally identical): self-referential + captures nothing → `NestedFn`; self-referential + captures an enclosing local (in the `saved_bound` snapshot) → clear reject (a named fn can recurse but can't capture; a closure can capture but can't self-call — pass captures as params); not self-referential → unchanged `ClosureLet` closure. Rust/Ruchy emit `fn <name>(<params>) -> R { <body> }` (always i64-mode, mode=false); Lean refuses (2 sites). meta-hir bigint-mode + escape-idents + has-int-arith arms added; rust/ruchy bigint-mode arms added. Verified vs python3 (fact(6)==720, fib(10)==55); non-recursive nested defs still emit a closure. New e2e nested_recursive_fn.py (rustc round-trip) + nested_recursive_capturing.py (reject-assertion). FREE CI. e2e 496->498. SHIPPED v0.1.436. FOUND BY HUNT-V11 (item V11-6). LAST contained HUNT-V11 item — tier now DRAINED."
