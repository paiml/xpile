  acceptance_criteria:
  - "An identity comprehension `[w for w in words]` over list[str] was mis-typed as List(I64), so `sorted([w for w in words])` / `max([w for w in words])` REJECTED ('declared return type List(Str) but body produces List(I64)'). Root cause: the `Expr::Map{lambda,..}` type-inference arms (infer_type ~7306, infer_type_in_ctx ~7716) inferred lambda.body with the loop var UNBOUND → a bare-var identity body hit the I64 default. Lowering already binds the var (lower_comp_to_map PMAT-525/531); only the later inference pass didn't. FIX (frontend ONLY, NO IR change): in infer_type_in_ctx's Map arm, infer the iterable's element type, bind the loop var to it in a cloned ctx (new `bind_comp_param(sub, param, elem)` helper — handles a plain name AND the `(k, v)` tuple-destructure string lower_comp_to_map produces for `for k,v in d.items()`), then infer the body in that ctx; the context-free infer_type Map arm special-cases the identity body (`[w for w in xs]` is exactly infer_type(list)). Flows into Sorted/ListMinMax/return-check. Differential-verified vs python3: str sorted/max, filtered comprehension `if w!=\"\"`, int regression, tuple-target `[k for k,v in d.items()]`. New e2e identity_comprehension_str.py rustc-rt. FREE CI. e2e 434->435. SHIPPED v0.1.377. FOUND BY HUNT-V6 (comprehensions, item C1)."
- id: PMAT-677
  github_issue: null
  item_type: task
  title: 'PMAT-677: [Tranche 2] CORRECTNESS float format spec width+precision'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A float format spec combining WIDTH (and/or zero-pad/sign/fill+align) WITH precision — `f\"{x:8.3f}\"`, `{:06.2f}`, `{:+8.2f}`, `{:10.4f}`, `{:>8.2f}`, `{:*>8.2f}` — was REJECTED ('unsupported format spec'); only a pure `.Nf` worked. This is the single most common float-formatting idiom (aligned numeric tables). Rust's `{:8.3}`/`{:06.2}`/`{:>8.2}` match Python EXACTLY for floats — the `.Nf` precision forces the decimal count, so the whole-float repr divergence (`3.0` vs `3`) that defers BARE float widths does not arise. FIX (frontend ONLY, translate_format_spec ~11522, NO IR change): add a `float_pad_prec(core)` helper translating a float fixed-point core `[0][width].Nf` → Rust `[0][width].N` (split on '.', strip trailing 'f', validate precision digits, `[0][width]` via the existing pad_width). Wire into: (1) a new `*ty==F64` branch after the I64 block, (2) the fill+align branch (chars[1] align), (3) the explicit-align branch. A leading `+`/`-` sign is peeled by the sign-strip branches and recurses here. Pure `.Nf` (the `.`-prefixed branch) and bare float widths are unchanged. Fixes BOTH the f-string and `.format()` paths (shared helper). Differential-verified vs python3: width(3.142)/zero-pad(003.14)/sign(+3.14)/wide(3.1416)/align/fill-align(****3.14)/.format()/plain-.Nf regression — all match. New e2e float_format_width_precision.py rustc-rt. FREE CI. e2e 433->434. SHIPPED v0.1.376. FOUND BY HUNT-V6 (str-format-methods, item C4). NOTE: float NaN-in-format (A4) and radix-with-width negative zero-pad still separate follow-ups."
- id: PMAT-676
