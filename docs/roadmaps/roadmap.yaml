  item_type: task
  title: 'PMAT-612: [Tranche 2] CORRECTNESS round(int, ndigits) returns an int instead of E0425'
  status: done
  priority: medium
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, H4-2). round(int, n) emitted a bare `round(x, n)` call -> rustc E0425 (cannot find function `round`): transpile SUCCEEDS but produces invalid Rust. The 2-arg round handler only matched a float value (Expr::RoundToDigits); the int case fell through to a raw call. Even a defensive round(count, 2) failed to compile. FIX: NEW Expr::RoundIntToDigits{value,ndigits} (rust+ruchy codegen). Semantics match Python: n>=0 is the IDENTITY (an int has no fractional part) — a non-negative LITERAL n folds to `return value` at lowering, runtime n>=0 handled in the block; n<0 rounds to the nearest multiple of 10^(-n) using round-half-to-EVEN (banker's rounding): round(12345,-2)=12300, round(12350,-2)=12400 (tie->even 124), round(12250,-2)=12200 (tie->even 122), round(-12350,-2)=-12400, round(7,-1)=10. ALGORITHM (verified vs python3 across 16 cases incl. ties+negatives): work in i128 (so the 10^(-n) scale + products can't overflow), p=10i128.checked_pow((-n) as u32), d=v.div_euclid(p), m=v.rem_euclid(p) (floor semantics, correct for negatives), tie when 2*m==p -> pick the EVEN multiple (d even? d*p : (d+1)*p); result FAILS LOUD (panic, C-PY-INT-ARITH) if it leaves i64 range. NOTE: a literal `-2` lowers via checked_neg (not Expr::LitInt(-2)), so round(x,-2) takes the runtime path — still correct. Lean refuses (joined RoundToInt|RoundToDigits|RoundIntToDigits arm). Ripple: meta-hir variant (+expr_has_int_arith +escape_expr) + 2 frontend inferers (I64) + frontend 2-arg round handler I64 branch + rust/ruchy codegen + lean collect_idents + lean refuse. New e2e fixture round_int_digits.py rustc-rt + python3 diff. FREE CI. e2e 372->373. SHIPPED v0.1.311. Remaining HUNT-4 picks: H4-3 f-string radix neg-int (sign-magnitude), H4-20 int==float precision, H4-18/19 titlecase. HUNT-5 clean picks: H5-15 NaN spec'd format (NaN-only — Rust inf already matches), H5-23 float//inf operands, H5-27 comp-var-shadows-bound (3-site, low EV). Architectural (deferred): dict iteration order (PMAT-537), typed-exceptions H5-16/17, ownership-by-ref params."
