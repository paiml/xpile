  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "Python's `for … else:` / `while … else:` (the `else` runs iff the loop completed WITHOUT `break`) was a clean reject. FIX (frontend ONLY, NO IR change): desugar via a fresh `__brokeN` flag (LoweringCtx::fresh_break_flag, shares loop_counter) set `true` before each `break` AT THIS LOOP'S LEVEL, then `if !__brokeN { <else> }` after the loop. Helpers: `inject_loop_break_flag(stmts, flag)` rewrites Break→[Assign(flag,true), Break] recursing into Stmt::If then/else but NOT nested loops (their breaks target the inner loop); `inject_break_flag_into_loop(stmt, flag)` reaches into a lowered loop Stmt's body (While/ForEach/ForEachPair/ForEachZip3); `wrap_loop_else(flag, loop_stmts, else_body)` builds `[Let mut flag=false; <loop>; If(flag==false, else, [])]`. for path: lower with orelse cleared (recurse) + inject_break_flag_into_loop on each returned stmt. while path: lower_while_stmt now returns Vec<Stmt>, injects into body directly. A `return` in the loop exits the fn (no else); nested loop-elses get distinct flags. Differential-verified vs python3: return-in-loop (no else), break (else skipped) vs no-break (else runs), while-else. New e2e loop_else.py rustc-rt. FREE CI. e2e 443->444. SHIPPED v0.1.386. FOUND BY HUNT-V6 (control-scope, item C10)."
