  - "CORRECTNESS (differential hunt #4, finding #21). `x: int = d.get(key)` (1-arg get -> DictGetOpt : Optional(I64)) bound an Optional value to a non-Optional i64 annotation; lower_ann_assign trusts the annotation for the `let x: i64 = ...` but the RHS is Option<i64> -> rustc E0308 despite clean transpile. FIX (frontend lower_ann_assign, before building Stmt::Let): if `!matches!(declared_ty, Type::Optional(_)) && matches!(infer_type_in_ctx(ctx, &value), Type::Optional(_))` -> reject with an error naming the fix. RATIONALE for reject (not unwrap): Python doesn't enforce annotations (`x: int = d.get(\"z\")` legally binds None), so unwrapping/panicking would diverge from python3 on the None case; fail-fast restores transpile-success => valid Rust. The correct forms still transpile: 2-arg `d.get(k, default)` -> DictGetOr (non-Optional value), and `Optional[int]` annotation (declared Optional, not rejected). New reject e2e test ann_optional_mismatch_rejected (ann_optional_mismatch.py refused, stderr asserts 'initializer is Optional' + 'd.get(k, default)') + positive control ann_optional_ok.py (x: int = d.get(\"a\", 0) transpiles + rustc-rt + python3 diff with_default({\"a\":7})==7, {}->0). FREE CI. e2e 362->363. SHIPPED v0.1.301. Remaining HUNT-4 picks (10/29 left): H4-3 f-string radix neg-int sign-magnitude, H4-20 int==float precision >2^53, H4-15 float set/dict comp (OrderedFloat/Vec-dedup), H4-2 round(int,ndigits) E0425 (IR+banker's), H4-18+19 titlecase (verify to_titlecase NOT std), H4-26 sum empty list[float], H4-27 neg-base frac pow, H4-29 chr surrogate, H4-8 nested-fn mut + H4-9 method defaults (architectural)."
