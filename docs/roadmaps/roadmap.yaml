  title: 'PMAT-649: [Tranche 2] CORRECTNESS str.split() no-arg splits on C0 separators U+001C-1F'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "Python `str.split()` with no argument splits on runs of `str.isspace()` whitespace, which INCLUDES the C0 file/group/record/unit separators U+001C-1F (FS/GS/RS/US). xpile emitted Rust's `.split_whitespace()`, whose `char::is_whitespace` EXCLUDES those four code points — so a string containing them split into fewer parts than Python (silent miscompile / output-divergence; e.g. `\"a\\x1cb\\x1dc\".split()` → 1 part in Rust vs 3 in Python). FIX (both backends' `StrMethodOp::SplitWhitespace` arm, NO IR change): emit `.split(|__c: char| __c.is_whitespace() || matches!(__c, '\\u{1c}'..='\\u{1f}')).filter(|__c| !__c.is_empty()).map(|__c| __c.to_string()).collect::<Vec<String>>()` instead of `.split_whitespace()...`. The predicate reuses PMAT-600's strip/isspace C0-inclusive whitespace definition (FS/GS/RS/US); `.filter(|s| !s.is_empty())` reproduces no-arg split's leading/trailing/consecutive-collapse (no empty strings) semantics that `split_whitespace` gave for free (plain `.split(closure)` yields empties for boundary separators). Differential-verified vs python3: C0-only (5 parts), mixed ASCII-ws + C0 with leading/trailing/consecutive collapse (3 parts, no empties), plain ASCII (3 parts), indexed last part. Regression: plain whitespace splitting unaffected. New e2e split_c0_separators.py rustc-rt; existing split_whitespace shape assertion updated to the new emit. FREE CI. e2e 405->406. SHIPPED v0.1.348. FOUND BY HUNT-V2 (STR-UNICODE cluster) — fix mirrors PMAT-600."
