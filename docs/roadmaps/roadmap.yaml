  acceptance_criteria:
  - "`len(t)` over a tuple lowered to `Expr::Len` → `t.len() as i64`, but Rust tuples `(T0, T1, ...)` have NO `.len()` method → E0599 (transpile->invalid-rust). A Python tuple's length is fixed by its TYPE (`tuple[T0, T1, ...]`) and known at compile time. FIX (frontend ONLY, the len() builtin intercept ~8753, NO IR change): bind `inner_ty = infer_type_in_ctx(ctx, &inner)`; after the existing Str→CharCount branch, add `if let Type::Tuple(elems) = &inner_ty { return Ok(Expr::LitInt(elems.len() as i64)); }` — fold to the arity literal. List len() keeps `Expr::Len`→`.len()`; str len() keeps `StrMethodOp::CharCount`→`chars().count()` (PMAT-564). Differential-verified vs python3: 3-elem param tuple (→3i64), 4-elem literal (→4i64), mixed int/str pair (→2i64), list len regression (→.len()), str len regression (→chars().count()). New e2e len_tuple.py rustc-rt. FREE CI. e2e 410->411. SHIPPED v0.1.353. FOUND BY HUNT-V3 (seq-tuple-len-1)."
- id: PMAT-653
