  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`s.isascii()` was REJECTED (no dispatch entry in str_method_op). Python returns True iff every char is ASCII (U+0000..=U+007F); the empty string is True. Rust `str::is_ascii()` matches EXACTLY incl. the empty case (`\"\".is_ascii()` is true), so the lowering is a bare `(s).is_ascii()` with NO empty guard — unlike the isdigit-family predicates `(!(s).is_empty() && (s).chars().all(..))`. FIX: new `StrMethodOp::IsAscii` (Bool, 0 args). Frontend: name-map (`\"isascii\"`), arity 0 (joined the 0-arg predicate group), type-inference Bool at BOTH inference sites (the match is exhaustive, no wildcard). Rust+ruchy codegen: a dedicated `(recv).is_ascii()` arm in the if/else chain + the `unreachable!(\"...handled above\")` exhaustiveness entry. Lean refuses via its wildcard. GOTCHA: `out.push_str(\"(\")` trips clippy::single_char_add_str under -D warnings → use `out.push('(')`. Differential-verified vs python3: `\"abc\"`→true, `\"café\"`→false, `\"123!\"`→true, `\"\"`→true; isalnum regression intact; ruchy backend emits `(s).is_ascii()` too. New e2e str_isascii.py rustc-rt. FREE CI. e2e 451->452. SHIPPED v0.1.394. FOUND BY HUNT-V7 (item V7-10). NOTE: casefold LEFT REJECTED (divergence trap — `\"ß\".casefold()`=='ss' but Rust to_lowercase gives 'ß'); expandtabs (column-aware, optional-arg) is a separate follow-up."
