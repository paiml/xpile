  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #6 — both `|` and `|=`). `a | b` / `a |= b` over two dicts (PEP 584, Python 3.9+) fell through to a generic integer BitOr, so the backend emitted `HashMap | HashMap` -> rustc E0369 (HashMap has no BitOr). Transpile-success => invalid Rust. FIX (frontend only, REUSING existing IR — no new variants): in the binop dispatch, when both operands are Type::Dict and op is BitOr -> `Expr::DictMerge { entries: [(None,lhs),(None,rhs)] }` (the same {**a,**b} lowering; chains both iterators into a fresh HashMap, later entry b wins via collect = Python semantics). In lower_aug_assign Name path, dict |= -> `Stmt::DictUpdate` (= a.update(b) -> a.extend(...)), in place, receiver marked mut. Other binary ops between two dicts (&/-/^/+/…) AND non-|= dict aug-assigns rejected cleanly (Python defines no such dict operator) instead of invalid `HashMap <op> HashMap`. New e2e fixture dict_union.py rustc-rt + python3 diff (merged()==3051 with b winning the y collision; in_place()==320). FREE CI. e2e 353->354. SHIPPED v0.1.292. Remaining HUNT-4 picks: C int-arith overflow H4-14+28 (checked_add, proven), E reversed-str/format builtins H4-13+25, H4-9 method default params (E0061), H4-2 round(int,ndigits) E0425, H4-7 enumerate start= kwarg, D C0-sep whitespace H4-1+17."
- id: PMAT-592
