  title: 'PMAT-613: [Tranche 2] CORRECTNESS f-string radix of a negative int is sign-magnitude'
  status: done
  priority: medium
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, H4-3). Python formats a negative int in an f-string radix spec SIGN-MAGNITUDE (f\"{-255:x}\"==\"-ff\", f\"{-5:b}\"==\"-101\", f\"{-8:o}\"==\"-10\"), but xpile emitted `format!(\"{:x}\", n)` = Rust's TWO'S-COMPLEMENT (ffffffffffffff01) → silent wrong output. The hex()/bin()/oct() builtins already emit sign-magnitude (via Expr::IntRadixStr prefixed:true); only the f-string radix path lagged. FIX (frontend ONLY, NO new IR): in apply_nonempty_format_spec, a BARE radix spec (exactly \"x\"/\"X\"/\"b\"/\"o\", no width/fill/precision) over an I64 value now reuses Expr::IntRadixStr{value, radix, prefixed:FALSE, upper} (x→Hex/lower, X→Hex/upper, b→Bin, o→Oct) instead of falling to FormatSpec→`format!(\"{:x}\", n)`. IntRadixStr already emits `{ let __n=(v); let __m=__n.unsigned_abs(); let __sign=if __n<0{\"-\"}else{\"\"}; format!(\"{}{:x}\", __sign, __m) }` = sign + format(abs), matching Python. prefixed:false drops the 0x/0b/0o prefix (f-string radix has no prefix, unlike hex()). Radix-WITH-width (e.g. :08x) keeps the FormatSpec path — correct for non-negatives; sign-aware zero-padding of a NEGATIVE+width is a deferred follow-up. The standalone format(x,\"x\") builtin shares apply_nonempty_format_spec so it's fixed too (format(-255,\"x\") now \"-ff\"). Updated format_builtin assertion to the IntRadixStr emit shape. New e2e fixture fstring_radix_negative.py rustc-rt + python3 diff (n=-255/255/-8/0 across x/X/b/o + embedded). FREE CI. e2e 373->374. SHIPPED v0.1.312. **PATTERN: an existing codegen node with a config flag (IntRadixStr.prefixed) can often be REUSED for a sibling surface — frontend-only fix, zero IR/codegen ripple.** Remaining HUNT-4 picks: H4-20 int==float precision (>2^53, low realism, fiddly), H4-18/19 titlecase, H4-15 float set/dict comp (E0277, architectural — needs value-set). HUNT-5: H5-15 NaN spec'd format, H5-23 float//inf. Architectural (deferred): dict order (PMAT-537), typed-exceptions, ownership-by-ref."
- id: PMAT-612
