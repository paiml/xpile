  - "CORRECTNESS (comprehension-scope; found by a differential probe, same class as PMAT-634 but a SEPARATE code path). A range comprehension `[i for i in range(n)]` (and `{i: i for ...}` / `{i for ...}`) desugared (desugar_list_comp/dict/set range branch) to a FUNCTION-SCOPE counter loop `let mut i = start; while i<stop { append; i+=step }`, so the comprehension variable LEAKED into the enclosing scope and CLOBBERED a same-named outer binding. Python comprehension variables are scoped to the comprehension → `def f(i): xs = [i for i in range(3)]; return i` returned 3 not 99. (List-ITERABLE comps `[x for x in xs]` and genexprs `sum(x for x in ...)` were already correct — Rust-scoped ForEach/Map paths.) FIX (frontend only, NO new IR): generalize the `_`-rename field `underscore_rename: Option<String>` -> `active_rename: Option<(String,String)>` (python_name->rust_name; the `_` case is from=\"_\"), and add `LoweringCtx::enter_comp_var(py)` which renames EVERY range-comp counter (named or `_`) to a fresh `__forc{N}` (via fresh_loop_counter) and installs active_rename=(py, fresh). The comprehension's element/key/value/filter reads of the original name resolve to the fresh name via the active_rename consult site in lower_expr_in_ctx; the original name is NEVER inserted into ctx.bound, so it cannot leak/clobber. The 3 comp range branches no longer bound-insert the var, insert the COUNTER into name_types, and pass the counter to the shared comp_range_stmts builder (the list branch was refactored to use comp_range_stmts too — was inline). enter_loop_var (for-statements) unchanged: a named for-target legitimately leaks per Python (PMAT-634 handles that with a separate counter + user-var assign). All 3 forms differential-verified vs python3 (f(99)->99 was 3); comp values/filters/for-_/list-iterable/stepped/nested comps unaffected (nested handled because comp_range_bounds lowers the iterable BEFORE enter_comp_var, and sum([...])/for-body use other paths). New e2e comp_var_no_leak.py rustc-rt; 2 emitted-shape assertions updated (list_comp_range + dict_set_comp_range now __forc0). FREE CI. e2e 393->394. SHIPPED v0.1.334. **active_rename single-level limitation: a nested LIST-comp (statement desugar) whose inner element references the OUTER comp var would not resolve — but those reach the 2gen path or sum()/for-body paths in practice; re-probe if it surfaces.**"
- id: PMAT-634
  github_issue: null
