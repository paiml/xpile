  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A NEGATIVE constant tuple index `t[-1]` / `t[-2]` (parsed `UnaryOp(USub, Int)`, NOT a bare `Constant`) fell through the tuple-subscript handler (which matched only a non-negative `Constant` int) to the list-index negative-wrap path → `{ let __lc = &(t); ... __lc.len() as i64 + __li ...; __lc[__lidx as usize] }` → E0599 (a Rust tuple has no `.len()` and no `[]` indexing). FIX (frontend ONLY, the tuple-subscript arm ~7930, NO IR change): resolve ANY int literal via `extract_int_literal` (signed). A negative `t[-k]` resolves at COMPILE TIME to the field access `Expr::TupleIndex{index: arity - k}` (the arity is known from `Type::Tuple(elem_tys)`); a non-negative literal stays `t.N` (existing behavior). An out-of-range literal index now errors cleanly (Python IndexError), and a NON-LITERAL (runtime variable) tuple index `t[i]` now REJECTS cleanly ('a heterogeneous fixed-arity tuple supports only constant t[N] indexing') instead of emitting invalid `.len()` Rust — a fixed-arity heterogeneous tuple genuinely cannot be runtime-indexed in Rust. Differential-verified vs python3: last((10,20,30))=30 (`t[-1]`→`(t).2`), secondlast=20 (`t[-2]`→`(t).1`), first regression=10 (`t[0]`→`(t).0`), mixed_neg over `tuple[int,str]` t[-1]='hi' (field access works on heterogeneous), runtime t[i] rejects. New e2e tuple_negative_index.py rustc-rt; existing tuple_index (positive) unchanged. FREE CI. e2e 426->427. SHIPPED v0.1.369. FOUND BY HUNT-V5 (tuple-ops-2-2)."
- id: PMAT-669
  github_issue: null
  item_type: task
  title: 'PMAT-669: [Tranche 2] CORRECTNESS sum/min/max over a tuple'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`sum(t)` / `min(t)` / `max(t)` over a fixed-arity tuple (e.g. `t: tuple[int,int,int]`) emitted a bare undefined `sum(t)`/`min(t)`/`max(t)` free call → E0425. A tuple is iterable in Python (sum/min/max iterate its elements), but the builtin argument-materializer `materialize_iterable_arg` (depyler-frontend ~3197) had arms only for List/Set/Dict — a tuple fell through to None and the intercept emitted the bare call. FIX (frontend ONLY, `materialize_iterable_arg`, NO IR change): add a `Type::Tuple(elems)` arm that materializes the tuple to a `ListLit` — a `TupleLit` operand uses its elements directly; any other tuple value/binding indexes each field via `Expr::TupleIndex{tuple, index}` for index in 0..elems.len() (`[t.0, t.1, …]`, arity from the type). Sound for a homogeneous tuple (the only kind sum/min/max accept — Python raises on mixed too); a heterogeneous tuple fed to sum/min/max would rustc-error, matching Python's runtime TypeError. Because the materializer is SHARED by sum/min/max (and join/extend), all of them now accept a homogeneous tuple. Differential-verified vs python3: sum_t((3,7,2))=12, min_t=2, max_t=7 (tuple var), sum((3,7,2))=12 (literal), max over tuple[float,float], sum(list) regression. New e2e tuple_aggregate.py rustc-rt. FREE CI. e2e 425->426. SHIPPED v0.1.368. FOUND BY HUNT-V5 (tuple-ops-2-1). NOTE: `sorted(t)` over a tuple uses a SEPARATE sorted-intercept (its own List/Set match, not materialize_iterable_arg) — deferred follow-up."
- id: PMAT-668
