  - "Integer `a // 0` / `a % 0` panicked with the MISLEADING `xpile: i64 floor-div overflow; bigint promotion...` message — `checked_div`/`checked_rem` return None for BOTH a zero divisor AND the `i64::MIN / -1` overflow, and the single `.expect(\"...overflow...\")` conflated them. Python raises ZeroDivisionError('integer division or modulo by zero') (`//`) / 'integer modulo by zero' (`%`). FIX (codegen only, NO IR change; both rust `emit_floor_div` ~3404 / `emit_floor_mod` ~3430 + ruchy ~2903/~2926, MIRRORED): guard the divisor FIRST after binding __fa/__fb — `if __fb == 0 { panic!(\"xpile: ZeroDivisionError: integer division or modulo by zero\"); }` (floor-div) / `\"...integer modulo by zero\"` (mod) — before the checked_div/rem (which still reports the i64::MIN/-1 overflow). Mirrors the existing FLOAT div/mod ZeroDivisionError guards (~1142/1157/1183). DECOMPOSED sub-slice of the typed-exceptions epic: the panic payload now carries the correct exception type so a future `except ZeroDivisionError:` can match `xpile: ZeroDivisionError:` (the discrimination itself + except-type threading is the remaining epic work; also needs other builtins' messages audited). Differential-verified vs python3: fd(7,2)=3, fd(-7,2)=-4, md(-7,2)=1, md(7,3)=1 (normal floor/mod sign-follows-divisor); fd(10,0)/md(10,0)→ZeroDivisionError (payload checked in e2e driver). New e2e int_div_zero.py rustc-rt. FREE CI. e2e 485->486. SHIPPED v0.1.427. FOUND BY HUNT-V10 (typed-exceptions sub-slice). FOLLOW-UP: bigint-mode div_floor (emit_bigint_floor_call) zero-divisor message; full except-type discrimination."
