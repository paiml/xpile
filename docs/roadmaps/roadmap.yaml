  status: done
  priority: low
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "Float-base `b ** e` returned `inf` on overflow (`2.0 ** 2000`) instead of raising OverflowError (Python); `0.0 ** <neg>` (`0.0 ** -1`) returned `inf` instead of ZeroDivisionError. EXCEPTION-MISMATCH. FIX (codegen only, NO IR change; both rust `FloatOp::Pow` ~1219 + ruchy ~1032, split OUT of the shared `Pow|Hypot|Atan2|Log` method arm into its own arm, MIRRORED): `{ let __pb: f64 = <lhs>; let __pe: f64 = <rhs>; let __pr = __pb.powf(__pe); if __pr.is_infinite() && __pb.is_finite() { if __pb == 0.0 { panic!(\"xpile: ZeroDivisionError: 0.0 cannot be raised to a negative power\"); } panic!(\"xpile: OverflowError: (34, 'Numerical result out of range')\"); } __pr }`. A finite base + infinite result = overflow (or 0**neg); an already-infinite base (`inf ** 2`) keeps inf (no panic); finite results unchanged. Differential-verified vs python3: fpow(2,10)=1024, fpow(1.5,3)=3.375, fpow(inf,2)=inf, fpow(2,2000)→OverflowError, fpow(0,-1)→ZeroDivisionError. New e2e float_pow_overflow.py rustc-rt; updated 3 existing shape assertions (float_power/aug_assign_float_int_rhs/pow_builtin) to the guarded `__pb.powf(__pe)` form. FREE CI. e2e 494->495. SHIPPED v0.1.434. FOUND BY HUNT-V11 (item V11-10). (id 734b: 734 was V11-5; distinct sub-slice.)"
