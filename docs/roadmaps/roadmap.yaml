- id: PMAT-760
  github_issue: null
  item_type: task
  title: 'PMAT-760: [Tranche 2] CORRECTNESS render an int/bool dataclass in an f-string via generated Display (HUNT-V15 #6)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "A dataclass instance in an f-string emitted `format!(\"{}\", obj)` but the struct only derives Debug → rustc E0277 (transpile-success→invalid-rust). Python dataclass __repr__ = `ClassName(f1=v1, …)`. COMMON. FIX (both backends + frontend): (1) codegen Item::Struct generates `impl std::fmt::Display` for a dataclass whose every field is I64|Bool (where Rust `{}` / a True/False map == Python repr) — `write!(f, \"P(x={}, y={})\", self.x, self.y)`, bool via `if self.f {\"True\"} else {\"False\"}`. (2) frontend f-string part lowering: an eligible struct interpolation → empty-spec FormatSpec (types Str — fixes lone `f\"{p}\"` AND multi-part `f\"pt={p}\"`); an INELIGIBLE struct (str/float/nested fields) → clean reject (was E0277 in multi-part). `struct_display_eligible` shared predicate mirrors codegen gate. Verified vs python3: f\"{P(1,2)}\"=P(x=1, y=2), f\"pt={P(3,4)}\"=pt=P(x=3, y=4), f\"flags={Flags(True,5)}\"=flags=Flags(a=True, n=5); str-field dataclass rejects cleanly. New e2e dataclass_fstring_repr.py. FREE CI. e2e 526->527. SHIPPED v0.1.460. FOUND BY HUNT-V15 (#6). FOLLOW-UPS: str()/print() of a struct (str() builtin infers struct-arg as I64 → rejects); str/float/nested-field dataclass repr (per-field repr: str quoting, float repr, recursive Display). NEXT V15: #10 CME-3 (dunder dispatch len→.len()/obj[i]/str(obj)); CONTAINED TIER ~DRAINED → consider HUNT-V16. DEFER (architectural): #11 SMA-01 [[x]*n]*m aliasing; V14-#9 max/min mixed int+float."
- id: PMAT-759
  github_issue: null
  item_type: task
  title: 'PMAT-759: [Tranche 2] CORRECTNESS narrow Optional through `x is not None and ...` (HUNT-V15 ONF-4)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "Optional flow-narrowing didn't propagate through a compound `if x is not None and <rest>:`: the `<rest>` operand (`x > 0`) kept x an Option<i64> → rustc E0308 (Option vs i64), and the then-body kept x un-narrowed (`x + 1` → Option has no checked_add). The simple `if x is not None:` already narrowed the body. FIX (frontend, 2 sites): (1) `lower_bool_op_in_ctx` lowers `and` operands SEQUENTIALLY against a ctx-clone that accumulates narrowing — an `x is not None` conjunct adds x to `narrowed_some` for the operands after it (sound: Python AND Rust `&&` short-circuit, so `x.unwrap()` after the `is_some()` guard never runs on None); `or`/non-guarded unaffected. (2) new `if_body_none_narrow_target` matches a compound `x is not None and <rest>` (leading conjunct guards the body), used in the if-lowering instead of the bare `is_not_none_narrow_target`. Verified vs python3: guard_and_use(Some(5))=6/(Some(-3))=-1/(None)=-1, 3-way and-chain, simple form all correct. New e2e optional_narrow_compound.py. FREE CI. e2e 525->526. SHIPPED v0.1.459. FOUND BY HUNT-V15 (ONF-4). NEXT V15: #6 CME-1 (instance in f-string E0277 — needs GENERATED dataclass-repr Display, SIZABLE), #10 CME-3 (dunder dispatch). DEFER (architectural): #11 SMA-01 [[x]*n]*m aliasing; V14-#9 max/min mixed int+float; unannotated-classmethod-returns-class ret=()."
- id: PMAT-758
  github_issue: null
