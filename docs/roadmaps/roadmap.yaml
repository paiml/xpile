  title: 'PMAT-749: [Tranche 2] CORRECTNESS nested-fn body mutability — reassigned locals/params get mut (HUNT-V14 #4)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "A nested function reassigning a local (`r=n; r=r*2`), accumulator (`acc+=x`), or parameter (`n=n+1`) emitted an immutable `let`/closure-arg → rustc E0384, even though the IDENTICAL code at top level compiles. ROOT: the outer fn's `compute_mutable_names` does NOT descend into nested defs (`walk_counts` has `_ => {}` for FunctionDef), so the nested scope's reassigned names never entered `ctx.mutable` and the closure/fn params carried no mut flag. COMMON (nested helper w/ loop counter / accumulator / normalized param). FIX: `desugar_nested_fn` computes the nested scope's mutable set (`walk_counts(&f.body)` + param names, count>1, == `compute_mutable_names`), then (a) merges it into `ctx.mutable` while lowering the body (save+restore `saved_mutable`) so reassigned-local `Stmt::Let`s are mut, and (b) carries a per-param mut bool into the IR. `ClosureLet`/`NestedFn` `params: Vec<(String,Type)>` → `Vec<(String,Type,bool)>` (bool=needs-mut); lambda params (single-expr body) always false. Ripple: meta-hir field + 2 escape_stmt + 2 collect_idents_stmt destructuring (`(p,_,_)`); rust+ruchy codegen emit `mut ` prefix; lean refuses both (`..`). Verified vs python3: doubler()=42, accumulate([1,2,3,4])=10, reassign_param()=6. New e2e nested_fn_reassign_mut.py. FREE CI. e2e 514->515. SHIPPED v0.1.449. FOUND BY HUNT-V14 (#4). NEXT V14 picks: #6 dc-order-sort-no-ord (E0277), #8 BM-02 str(None) (E0423), #9 BM-01 max/min mixed int+float keeps int-winner type (silent-wrong), #5 bool-dict-key, #15 nf-default-arg-dropped, #16 dc-frozen-mutation (silent-wrong)."
