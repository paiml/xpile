  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-13). Python bool is an int subtype: pow(True, n)==pow(1, n), pow(True, n, m) valid. The pow() builtin lowering (2-arg + 3-arg) gated on `matches!(ty, I64|F64)`; a bool-typed base failed the guard and fell through to generic call lowering -> bare `pow(...)` Rust fn (E0425) despite clean transpile. Operator paths (flag**n, flag<<n) already coerce bool via (flag as i64). FIX (frontend): wrap the lowered pow operands in to_i64_operand (the existing bool->i64 NumCast helper; no-op for int/float) for both the 2-arg and 3-arg handlers, BEFORE the type-check, so a bool base/exp/modulus infers as I64 and expands to checked_pow / PowMod. No new IR. New e2e fixture pow_bool_base.py rustc-rt + python3 diff (bp2(True,5)=1, bp2(False,3)=0, bp3(True,5,7)=1, bp3(False,0,7)=1). FREE CI. e2e 367->368. SHIPPED v0.1.306. Remaining HUNT-5 clean picks: H5-27 comp-var-shadows-bound, H5-12 int('1_000') underscore, H5-24 pop(neg idx), H5-28 max/min empty float-gen, H5-15 NaN spec'd format, H5-23 float//inf, H5-8 unpack-temp hygiene. Architectural (deferred): dict iteration order H5-6/7/26 = PMAT-537 (Vec-backed ordered-map prelude); typed-exceptions H5-16/17."
- id: PMAT-606
  github_issue: null
