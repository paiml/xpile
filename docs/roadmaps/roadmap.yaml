  acceptance_criteria:
  - "The standard grouping idiom `d.setdefault(k, []).append(v)` (`.append` whose RECEIVER is itself a `d.setdefault(k, default)` call) was REJECTED with a misleading 'expression-statement call's receiver isn't a simple subprocess Name' error — the expr-statement path (`try_lower_list_method_call` ~2515) only handled `<name>.append`, `<name>[i].append` (IndexAppend), and `subprocess.run(...)`. NEW IR node `Stmt::DictSetdefaultAppend{dict,key,default,elem}`: (1) frontend `try_lower_list_method_call` gains a case before the `Name`-receiver requirement — `attr.attr==append` AND `attr.value` is a Call whose func is `<Name dict>.setdefault` with the dict typed `dict[K, list[T]]`, 2-arg setdefault + 1-arg append; the default is lowered via `lower_value_expecting(ctx, &inner.args[1], &val)` so an empty `[]` default threads its element type (reuses PMAT-717); marks dict mut. (2) rust ~778 + ruchy ~683 codegen MIRRORED: `d.entry(k).or_insert_with(|| default).push(elem);` — CREATES the entry on first use (unlike IndexAppend `d[k].append` which `.get_mut(&k).unwrap()` → KeyError-panics on absent key). (3) lean refuses (in-place dict mutation). Plus exhaustive-match arms (stmt_has_int_arith, escape_stmt, lean while-mutation group + emit). NOTE: or_insert_with is lazy vs Python's eager default eval — observationally identical for `[]`/literal defaults (side-effecting defaults rare/buggy). Differential-verified vs python3: group([('a',1),('b',2),('a',3)])={'a':[1,3],'b':[2]}, group_nonempty [0]-default={'a':[0,1,2]}. New e2e setdefault_append.py rustc-rt. FREE CI. e2e 484->485. SHIPPED v0.1.426. FOUND BY HUNT-V10 (item V10-8). FOLLOW-UP: `out[k] = []` (empty-list to a dict-value subscript-assign) still rejects — empty-literal threading in subscript-assign target position is separate."
