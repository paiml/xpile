  title: 'PMAT-731: [Tranche 2] CORRECTNESS typed except discrimination (except T re-raises a different exception)'
  status: done
  priority: high
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "A specific `except T:` SWALLOWED every panic (`catch_unwind`'s `Err(_) => handler` catches all), so `except ValueError:` around `100 // 0` caught the ZeroDivisionError instead of propagating it (SILENT-WRONG — Python propagates). Built on PMAT-728 (which made int div-by-zero emit the correct `xpile: ZeroDivisionError:` prefix vs the old misleading 'overflow'). FIX (`Expr::TryCatch` gains `except_type: Option<String>`): (1) frontend `except_type_name(ty)` captures the handler's specific type name; returns None (catch-all) for a bare except / `Exception` / `BaseException` AND the base classes `LookupError`/`ArithmeticError` (whose subclasses are among the discriminated leaves — discriminating them would wrongly re-raise a caught subclass). Captured at BOTH terminal_try_as_expr (~4794) + lower_assignment_try (~5853). (2) rust ~3070 + ruchy ~2618 codegen MIRRORED: `except_type=Some(T)` → `Err(__xpile_e) => { let __xpile_m = <downcast String|&str>; if __xpile_m.starts_with(\"xpile: <Other>: \") {...} { resume_unwind(__xpile_e) } else { <handler> } }` over the KNOWN leaf set minus T; `None` keeps catch-all `Err(_)`. KNOWN_EXC const (in both codegens) = {ValueError,KeyError,IndexError,ZeroDivisionError,OverflowError,TypeError} — all mutually non-subclass leaves, so cross-re-raise always correct; unrecognized payloads still caught (conservative, NO regression). lean refuses (collect_idents `..`). Differential-verified vs python3: catch_value(5)=20/catch_value(-1)=-1 (ValueError caught)/catch_value(0)→ZeroDivisionError PROPAGATES; catch_all (except Exception)=-99 (catch-all); except KeyError catches missing-key. New e2e typed_except.py rustc-rt. FREE CI. SHIPPED v0.1.430. FOUND BY HUNT-V10 (typed-exceptions epic, the discrimination sub-slice). FOLLOW-UP: bound exception object (`except E as e:`), else/finally, class-hierarchy (base-class handlers stay catch-all today), more builtins audited into KNOWN_EXC."
- id: PMAT-730
