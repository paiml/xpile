  title: 'PMAT-516: [Tranche 2 correctness] str.startswith/endswith with a tuple of prefixes'
  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (silent-miscompile fix found via a rustc-verified probe). s.startswith((a, b)) / s.endswith((...)) previously lowered the tuple as the single StrMethod arg → codegen emitted ….starts_with(&(a, b)[..]) = transpile-success-but-INVALID-Rust (can't index a tuple), violating transpile ⟹ valid Rust. Python's str.startswith/endswith accept a TUPLE of prefixes/suffixes (true if ANY matches). FIX: in the str-method-call dispatch, BEFORE the generic str_method_op 1-arg path, intercept startswith/endswith whose single arg is an ast::Expr::Tuple over a Str receiver → fold into a left-assoc BinOp::Or of StrMethod{StartsWith/EndsWith, [prefix_i]} per element. Empty tuple → Expr::LitBool(false) (Python). Single non-tuple arg falls through to the existing path (unaffected). ZERO new IR (reuses StrMethod + BinOp::Or). rustc rt str_startswith_tuple.py vs python3: url_kind (startswith 2 tuples + fallthrough), is_source (endswith tuple), single_prefix (1-arg form). NOTE: the e2e driver needed r##\"...\"## because a test string contained `\"#` which closed an r#\"...\"# raw string early. FREE CI. SHIPPED v0.1.216 (e2e 277→278)."
