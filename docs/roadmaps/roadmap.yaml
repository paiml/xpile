  title: 'PMAT-679: [Tranche 2] CORRECTNESS sum() of floats with inf no longer NaN'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`sum()` over floats uses Neumaier compensated summation (PMAT-584, matching CPython 3.12+), but once the running total goes NON-FINITE the compensation term computes `inf - inf = NaN`, poisoning `__sc` and the final `__ss + __sc`: xpile returned NaN for `sum([1.0, inf, 2.0])` where Python returns inf. FIX (codegen ONLY, rust ~1917 + ruchy ~1667 Expr::Sum of_float, NO IR change): guard the Neumaier compensation on `__st.is_finite()` — `for &__sx in (..).iter() { let __st = __ss + __sx; if __st.is_finite() { <compensate> } else { __sc = 0.0f64; } __ss = __st; } __ss + __sc`. Once the partial is ±inf/NaN, reset __sc and skip the comp add so the result reflects the (non-finite) running total. The finite catastrophic-cancellation behavior the fold exists for is FULLY preserved (guard fires only on non-finite). Differential-verified vs python3: sum([1.0,inf,2.0])→inf, sum([inf,1.0])→inf, sum([1e308,1e308])→inf (overflow), sum([inf,-inf])→nan (matches), sum([1.0,1e16,1.0,-1e16])→2.0 (cancellation preserved), sum([0.1]*10)→1.0. New e2e sum_float_inf.py rustc-rt. FREE CI. e2e 435->436. SHIPPED v0.1.378. FOUND BY HUNT-V6 (builtins, item A3)."
