  title: 'PMAT-510: [Tranche 2] match statement (literal-dispatch subset) → if/elif/else'
  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Tranche-2 — the match statement (modern Python). First cut: the common literal-dispatch form desugars to an if/elif/else chain, reusing ALL existing if lowering — ZERO new IR, no codegen. NEW desugar_match_to_if(&ast::StmtMatch) -> Result<ast::StmtIf>: requires a plain Name subject (so repeating it across comparisons is side-effect-free); each non-wildcard case must be a literal value pattern (ast::Pattern::MatchValue with is_literal_default value — int/float/str, optionally negated); the LAST case must be the wildcard case _: (ast::Pattern::MatchAs{pattern:None,name:None}, no guard) → exhaustiveness. Folds value cases in reverse over the wildcard body building nested ast::StmtIf with ExprCompare{left:subject, ops:[Eq], comparators:[lit]}; ranges reuse m.range (TextRange is Copy). Rejects guards, captures (case x:), singletons (True/False/None via MatchSingleton), and class/sequence/mapping/or-patterns with clear errors. REUSED IN BOTH POSITIONS: lower_block_stmt ast::Stmt::Match arm → lower_if_stmt(desugar); function terminal path ast::Stmt::Match arm → terminal_if_as_expr(&desugar) → if-expression (each case returns). walk_counts gains a Match arm (merge each case body by max via merge_branch_counts, like if-branches) so a name assigned inside cases is marked mut — fixed the step() let-vs-let-mut bug found in the probe. rustc rt match_stmt.py vs python3: classify (int + case -1 via checked_neg, terminal), grade_points (str patterns → letter == String::from), step (statement-position assignment bodies → let mut result = if/else). FREE CI. SHIPPED v0.1.211 (e2e 273→274). REMAINING: capture patterns, |-patterns, guards, singletons, class/sequence/mapping patterns, non-Name subjects (bind-to-temp)."
- id: PMAT-506J
