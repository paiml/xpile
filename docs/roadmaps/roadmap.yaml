  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-28). max()/min() over a FLOAT sequence (ListMinMax of_float, no default) lowered to `.iter().copied().fold(f64::NEG_INFINITY, f64::max)` / `fold(f64::INFINITY, f64::min)`. An EMPTY sequence (e.g. `max(x/2 for x in xs if x>0)` where the filter excludes all) silently returned the ∓inf sentinel instead of Python's ValueError — a wrong finite-looking value flowing downstream (worse than the int path which at least panics via .max().unwrap()). The fold's f64::max/min also ignore NaN and mishandle signed-zero ties. FIX (rust+ruchy ListMinMax codegen): the float branch (both with- and without-default) now uses a strict-compare reduce `.iter().copied().reduce(|__a, __b| if __b > __a { __b } else { __a })` (cmp `<` for min) -> Option, matching PMAT-601 first-arg-wins (ties keep first, NaN keeps first). The unwrap block (guard removed) then: default -> .unwrap_or(d); float no-default -> .expect(\"...empty sequence (Python ValueError)\"); non-float no-default -> .unwrap() (unchanged). Int/str min/max byte-identical. No new IR. Updated list_minmax_float (fold->reduce shape) + minmax_default (reduce(f64::min)->reduce closure) assertions; runtime values unchanged. New e2e fixture max_empty_float_gen.py rustc-rt + python3 diff (non-empty 3.0/1.0; empty -> fail loud via catch_unwind). FREE CI. e2e 368->369. SHIPPED v0.1.307. Remaining HUNT-5 clean picks: H5-27 comp-var-shadows-bound, H5-12 int('1_000'), H5-24 pop(neg idx), H5-15 NaN spec'd format, H5-23 float//inf, H5-8 unpack-temp hygiene, H5-30 int max/min empty exit-code. Architectural (deferred): dict iteration order (PMAT-537), typed-exceptions H5-16/17."
