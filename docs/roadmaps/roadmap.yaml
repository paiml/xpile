  title: 'PMAT-743: [Tranche 2] CORRECTNESS dict size-change during iteration → RuntimeError'
  status: done
  priority: low
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "Inserting/deleting keys DURING dict iteration (`for k in d: d[k+100]=1`) is a size change Python rejects with `RuntimeError: dictionary changed size during iteration`. PMAT-742's key-materialization (v0.1.442) turned the prior E0502 into a SILENT grow of the snapshot — silent-wrong regression. FIX (NO new behavior IR, one field): `Stmt::ForEach` gains `dict_guard: Option<String>` (#[serde(default)]); the frontend's V12-2 materialize branch sets it to the mutated dict's name; rust+ruchy `emit` a runtime size guard — `{ let __dg_n0 = d.len(); for k in <keys-vec> { <body>; if d.len() != __dg_n0 { panic!(RuntimeError) } } }`. Size-stable value-update (PMAT-742) leaves len unchanged → silent; insert/delete → panic matching Python. escape_stmt escapes dict_guard; collect_idents/has_int_arith use `..` (name already via iter / no arith). Lean refuses dict-iter (`..`). All 6 frontend ForEach constructions + 2 codegen patterns updated for the new field. Verified vs python3 (grow panics ↔ RuntimeError; double_vals==120). New e2e dict_insert_during_iter.py (catch_unwind panic-assert). FREE CI. e2e 508->509. SHIPPED v0.1.443. FOUND BY HUNT-V12 (item V12-8; closes the silent-wrong introduced by PMAT-742)."
- id: PMAT-742
  github_issue: null
  item_type: task
  title: 'PMAT-742: [Tranche 2] CORRECTNESS dict value-update during iteration compiles'
  status: done
