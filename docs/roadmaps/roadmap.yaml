  - "Python `2 ** -1 == 0.5` — an integer raised to a NEGATIVE power is a FLOAT. xpile lowered `int ** int` to the integer `checked_pow` path unconditionally, so `2 ** -1` FAILED to lower ('declared return type F64 but body produces I64'; the int-pow path also explicitly can't represent a negative exponent — it u32::try_from's the exponent). Found by a differential probe. FIX (frontend only, NO new IR, NO inference/codegen change): in BOTH `**` lowering arms (context-aware lower_expr_in_ctx ~9519 + context-free lower_expr ~10645) detect a negative integer-LITERAL exponent from the AST via the existing `extract_step_literal(&b.right)` (handles `UnaryOp(USub, Int)`) — computed BEFORE the operands are moved/lowered (b.left/b.right are moved at the `let lhs/rhs = lower...` lines) — and OR it into the existing float-power condition, routing to `FloatBinOp::Pow` (operands cast via to_f64_operand) which already infers F64 + emits `powf`. So the negative-literal case produces a FloatBinOp (F64) instead of BinOp{Pow} (I64); the inference (6809 BinOp::Pow => I64) is untouched because it no longer sees this case. A VARIABLE/non-literal negative exponent has a runtime-dependent result type (int for >=0, float for <0) static typing can't represent → stays on the integer path (unchanged, still the contract-guarded u32 path). Differential-verified vs python3: 2**-1=0.5, 10**-3=0.001, b**-2 (variable base), 2**-1+2**-2=0.75; regression: 2**10=1024 / 5**0=1 / 2**n stay integer, 2.0**0.5 / 4.0**-0.5 float unaffected. New e2e neg_int_power.py rustc-rt. FREE CI. e2e 394->395. SHIPPED v0.1.335."
