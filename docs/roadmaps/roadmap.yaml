  status: done
  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #11). `s = set()` lowers to an empty Expr::SetLit([]) whose element type infers to the I64 default (unwrap_or(I64), no elements), so codegen emitted an explicit `let mut s: HashSet<i64> = ...`. A subsequent `s.add(Coord(..))` / `s.add(\"x\")` was then an i64-vs-actual type mismatch (rustc E0308) despite clean transpile. NOT struct-specific (the common set()+.add(\"str\") idiom hits it too). FIX (rust+ruchy Stmt::Let codegen): when a binding is *mutable* AND value is an empty SetLit AND ty is the guessed Set(I64), suppress the explicit element-type annotation -> emit `let mut s = std::collections::HashSet::new();` so rustc infers the element type from the later `.insert(...)`. Sound because: empty SetLit emits a bare HashSet::new() (no turbofish), and `mutable` guarantees a later insert/reassign rustc can infer from. Non-empty set literals, immutable empty sets, and explicitly-annotated set[str]/set[T] (ty != Set(I64)) keep their annotation (byte-identical output; set_remove drop_local uses {1,2,3} literal, unaffected). New e2e fixture empty_set_add.py rustc-rt + python3 diff (set()+.add over frozen-dataclass / str / int all dedupe to 2). FREE CI. e2e 358->359. SHIPPED v0.1.297. Remaining HUNT-4 picks: H4-2 round(int,ndigits) E0425, H4-16 dict-comp non-Copy reuse E0382, H4-1+17 C0-sep whitespace (bulletproof, niche), H4-3 f-string radix neg-int, H4-18+19 titlecase (verify to_titlecase std), H4-20 int==float precision, H4-15 float set/dict comp, H4-9 method default params (gnarly), H4-29 chr surrogate."
- id: PMAT-597
