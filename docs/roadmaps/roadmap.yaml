olor::GREEN). FREE CI. SHIPPED v0.1.213 (e2e 275→276). REMAINING: auto(), IntEnum/StrEnum/Flag, enum methods, .name, c.value on a variable (needs match/cast), C(1) value-construction, case C.NAME: match."
