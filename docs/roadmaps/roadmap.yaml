  acceptance_criteria:
  - "A walrus `(t := E)` in an `if` condition (`if (t := total+1) > 10:`) was an OPAQUE `unsupported expression: Discriminant(1)` reject (ast::Expr::NamedExpr unhandled, leaked its internal discriminant). FIX (frontend ONLY, NO IR change): `hoist_walruses(ctx, &mut if_stmt.test)` (called in lower_if_stmt, made `mut if_stmt`) recursively replaces each NamedExpr with a ref to its target Name and returns the hoisted `let mut t = E;` / `t = E;` stmts to emit BEFORE the if (Python leaks t to the enclosing scope → body + following code can read it). The `if` cond evaluates ONCE so hoist is sound, but ONLY in UNCONDITIONAL positions: top-level expr, a SINGLE comparison's operands (gated ops.len()==1), and BinOp/UnaryOp operands. Does NOT descend into BoolOp (and/or short-circuit) or a chained Compare (later operands short-circuit) — a walrus there stays a NamedExpr and hits a NEW clean reject ('walrus … only supported inside an `if` condition … assign on a preceding line'), replacing the Discriminant(1). while-cond walrus also rejects cleanly (re-evaluates each iteration → hoist-once would be wrong). Differential-verified vs python3: `(t:=total+1)>10`, bare `if (t:=total):` (int-truthiness), arith `(x:=a)+5>8`; and-walrus rejects. New e2e walrus_if.py rustc-rt. FREE CI. e2e 444->445. SHIPPED v0.1.387. FOUND BY HUNT-V6 (control-scope, item C9)."
