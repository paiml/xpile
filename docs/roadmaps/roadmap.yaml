- id: PMAT-480
  github_issue: null
  item_type: task
  title: 'PMAT-480: [WATCHED] cuda-oxide (NVlabs pure-Rust->PTX) as a third independent §29 PTX emitter — tracked, NOT scheduled'
  status: blocked
  priority: low
  created: 2026-06-12T00:00:00Z
  acceptance_criteria:
  - "WATCHED BET, not an R-item — must NOT be auto-picked-up by autonomous sessions. cuda-oxide (github.com/NVlabs/cuda-oxide, NVIDIA-Research, experimental/alpha, v0.2.1 2026-06-10) compiles single-source SIMT Rust (#[kernel]) directly to PTX via a fully Rust-native pipeline (Rust -> Stable MIR -> Pliron IR -> LLVM -> PTX). It is the upstream realization of xpile's scaffolded pure-Rust->PTX lane and a categorically-independent third 'general' PTX emitter for the §29 Multi-Emitter Quorum (strengthens the §14.10 anti-correlation guard vs rustc_codegen_nvvm's NVVM path)."
  - "HARDWARE BLOCKER RETIRED 2026-06-12 (per user hardware inventory): Lambda Cloud rents Hopper H100/GH200 (sm_90, full TMA + real thread-block clusters) and Blackwell B200 (sm_100) on-demand, and the local GX10 (NVIDIA GB10 Grace-Blackwell, sm_121) is a real CUDA device — so the §29 Runtime stratum (DiffExec on a real GPU) CAN now execute-verify Hopper/Blackwell PTX. See spec §29 'Runtime-stratum hardware'. (The 'intel' host is an Intel Xeon Mac Pro w/ 2x AMD Radeon Pro W5700X via Vulkan — SPIR-V/WGSL + CPU-rustc-round-trip lane, not PTX.)"
  - "SURVIVING BLOCKERS (3): (1) CONTROLLING — unbuilt consumer: the §29 PTX lane is still scaffolded (PMAT-26X+ real general emitter + PMAT-26Z+ DiffExec engine are pending; path is ScaffoldPtxEmitter / DiffExecResult::NotRun). A third independent emitter cannot precede its consumer. (2) Toolchain pin: LLVM-21 floor is met by bundled llc 21.1.8, but cuda-oxide hard-pins nightly-2026-04-03 + rust-src + rustc-dev while xpile pins stable 1.93.0 — adopting it means a nightly codegen lane xpile has not taken. (3) Alpha churn (v0.2.1, documented index_2d(stride) unsoundness). Minor: sm_121/GB10 is prose-only/unconfirmed as a cuda-oxide target, so local GX10 is least-proven; moot since rented Lambda sm_90/sm_100 are confirmed."
  - "RE-EVALUATE when (a) §29 PMAT-26X+/26Z+ light up a real general emitter + DiffExec engine (now the gating trigger — consumer must exist first), (b) a decision is taken to carry a nightly + rust-src + rustc-dev codegen lane, AND (c) cuda-oxide exits alpha — or at the next SOTA dossier (2026-11-15), whichever is first. See spec §30 'Watched bets' + §29 PMAT-26X+ note + §29 'Runtime-stratum hardware' table."
