  item_type: task
  title: 'PMAT-747: [Tranche 2] CORRECTNESS tag dict/list container-access panics for typed-except (HUNT-V14 #2)'
  status: done
  priority: low
  created: 2026-06-17T00:00:00Z
  acceptance_criteria:
  - "A dict-index miss (`d[k]`), an empty `list.pop()`, and an absent `dict.pop(k)` emitted UNTAGGED native panics (HashMap `Index` 'no entry found for key', `Option::unwrap`). The typed-except re-raise filter (PMAT-731) only re-raises payloads tagged `xpile: <KnownExc>:`, so `try: return d[k] except ValueError: return -1` SILENTLY SWALLOWED the KeyError (returned -1) where Python propagates it. SILENT-WRONG, COMMON (dict/list access in try/except). FIX (both backends): tag each container-access panic. `Expr::DictGet` `d[k]` → `(d).get(&(k)).cloned().unwrap_or_else(|| panic!(\"xpile: KeyError: key not found\"))` (was native `d[&k]` Index); `Expr::ListPop` empty (plain + `xs[i].pop()` l-value forms) → `.pop().expect(\"xpile: IndexError: pop from empty list\")`; `Expr::DictPop` no-default `d.pop(k)` → `.unwrap_or_else(|| panic!(\"xpile: KeyError: key not found\"))`. So `except KeyError`/`except IndexError` catch them and every other typed except re-raises them. In-bounds access byte-identical (`.get().cloned()` returns the same owned value). Continues PMAT-743/744. Nonneg-LITERAL list-index OOB + str-index OOB are follow-ups (variable list-index already tagged by PMAT-744). Verified vs python3 (except KeyError catches dict miss; except IndexError catches empty pop; unrelated except ValueError re-raises/propagates the KeyError; in-bounds unchanged). New e2e container_panic_typed.py; 5 existing string-assertion tests updated to the new emission (runtime unchanged). FREE CI. e2e 512->513. SHIPPED v0.1.447. FOUND BY HUNT-V14 (#2). NEXT V14 picks: #3 str-literal-control-byte-escape (bare CR/CRLF), #4 nf-reassign-immutable (E0384), #6 dc-order-sort-no-ord (E0277), #8 BM-02 str(None) (E0423), #9 BM-01 max/min mixed int+float keeps int-winner type."
