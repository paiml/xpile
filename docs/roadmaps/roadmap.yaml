  - "str methods whose codegen binds `let __s = (<recv>)` (zfill/center/rjust/removeprefix/removesuffix/count/find/rfind/rindex/splitlines) MOVE the receiver into the emitted block; reusing the source var after the call (`len(s.zfill(8)) + len(s)`) was a use-after-move → rustc E0382 (transpile-success→invalid-rust). COMMON. FIX (frontend, generic str-method lowering at the `str_method_op` dispatch): new `str_method_moves_receiver(op)` gates wrapping the receiver in `clone_if_reused_non_copy` (PMAT-588) — clones ONLY when the receiver is a reused non-Copy var, so a single use stays byte-identical and borrow-only methods (.upper()/.startswith()/etc.) are untouched. Verified vs python3: len(s.zfill(8))+len(s)=10, len(s.removeprefix('foo'))+len(s)=9, s.count('a')+len(s)=9, single-use len(s.zfill(8))=8 (no clone). New e2e str_method_move_receiver.py. FREE CI. e2e 522->523. SHIPPED v0.1.456. FOUND BY HUNT-V15 (#9). NEXT V15: #6 CME-1 (instance in f-string E0277 — needs a GENERATED dataclass-repr Display `P(x=1, y=2)`, NOT bare `{:?}` which gives `P { x: 1, y: 2 }`; sizable), #8 isinstance (verbatim → const bool/reject), #5 ONF-4 (Optional flow-narrow into loops), #7 CME-2 (classmethod call inferred ()). DEFER (architectural): #11 SMA-01 [[x]*n]*m aliasing; V14-#9 max/min mixed int+float."
