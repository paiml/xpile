- id: PMAT-619
  github_issue: null
  item_type: task
  title: 'PMAT-619: [Tranche 2] CORRECTNESS 3-arg pow with negative base + negative modulus'
  status: done
  priority: medium
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #7 H7-18, fresh v0.1.315). PMAT-605 re-signed the modpow RESULT for a negative modulus (`if __pmm<0 && __pmr!=0 { __pmr += __pmm }`), but the BASE normalization (`let __t = __pmb0 % __pmm; if __t<0 { __t + __pmm }`) and the per-step `% (__pmm as i128)` reductions still assumed a POSITIVE modulus. For a NEGATIVE base AND negative modulus this pushed values further negative → wrong result: pow(-2,3,-5) gave 3 but Python gives -3 (Python's m<0 result is in (m,0]). FIX (rust+ruchy PowMod codegen, NO new IR): rework the WHOLE modexp on the MAGNITUDE `__pma = (__pmm as i128).abs()` (i128 so |i64::MIN| doesn't overflow): base reduced into [0,|m|) via `(__pmb0 as i128) % __pma` floor-adjusted, square-and-multiply all in i128 mod __pma (no `as i128) * (` casts needed since operands already i128), `1i128 % __pma` seed (handles |m|==1→0); then sign-correct `if __pmm < 0 && __pmr != 0 { __pmr -= __pma; }` (= +m), final `__pmr as i64` (safe: residue in (-|m|,|m|), fits i64). Algorithm verified vs python3 17 cases (pos/neg base × pos/neg mod, exp0, 0**0, |m|==1, large modexp 7269^12345 mod 1e9+7). Extended pow_negative_modulus e2e driver with neg-base cases (mp(-2,3,-5)=-3, mp(-3,2,-7)=-5, mp(-5,3,-11)=-4, mp(-2,3,5)=2, mp(-5,3,11)=7); updated pow_mod assertion (`(__pmm as i128).abs()` + `__pmr * __pmb`) and pow_negative_modulus assertion (`__pmr -= __pma`). FREE CI. e2e stays 379 (extended existing test, no new fn). SHIPPED v0.1.318. **COMPLETES the 3-arg pow correctness story: PMAT-571 (modexp) → 604/605 (neg modulus) → 607 (bool base) → 619 (neg base + neg mod).** Remaining hunt #7: H7-9 d.get-in-fstring→Option-into-format! E0308, H7-11 set[float] E0277, for-loop-var cluster H7-14/16/17, pass-by-ref epic H7-8/13."
- id: PMAT-618
  github_issue: null
