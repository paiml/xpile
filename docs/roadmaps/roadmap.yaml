  acceptance_criteria:
  - "`if x:` over an `Optional[T]` lowered the CONDITION (PMAT-721) but did NOT narrow `x` in the then-body, so using the value there (`if x: return x + \"!\"`) still failed (`x` stayed `Option<String>`). A truthy Optional is necessarily `Some`, so the then-body unwrap is sound (the non-zero/non-empty inner fact is irrelevant to unwrap soundness). FIX (frontend only, NO IR change): new `if_truthy_narrow_target(ctx, test)` (~4783, the truthiness companion to `is_not_none_narrow_target`) detects a bare `if <name>:` over a non-mutable Optional-typed name; `lower_if_stmt` (~4886) OR-combines it with the existing `is not None` narrowing (`is_not_none_narrow_target(...).or_else(|| if_truthy_narrow_target(...))`), so the then-body registers `x` in `narrowed_some` and reads lower to `OptionUnwrap` → `.unwrap()`. The condition is lowered BEFORE narrowing (stays `(x)[.as_ref()].is_some_and(...)`); else-body NOT narrowed; mutable/reassigned names stay un-narrowed (sound, no regression). Differential-verified vs python3: use_after_str(None/''/'hi')=none/none/hi!, use_after_int=-1/-1/105, double_use=0/0/16. New e2e if_truthy_narrow.py rustc-rt. FREE CI. e2e 480->481. SHIPPED v0.1.422. FOUND BY HUNT-V9 (item V9-18 follow-up). FOLLOW-UP: ternary `a if x else b` then-branch narrowing (`len(x) if x else -1` over Optional[list] still needs it — separate from the if-STMT path); V9-19 value-returning `x or default`."
