  acceptance_criteria:
  - "Python `int(s, base)` accepts a base-matching radix PREFIX (`0x`/`0X` for base 16, `0o`/`0O` for 8, `0b`/`0B` for 2) and PEP-515 underscore digit grouping; `int('0xff', 16)` → 255, `int('1_000', 16)` → 4096. xpile lowered `int(s, base)` to `i64::from_str_radix((s).trim(), base)`, but Rust's `from_str_radix` accepts NEITHER a prefix NOR underscores → both forms panicked (the `.expect('xpile: ValueError: ...')` fired) — a panic-mismatch for mainstream hex/oct/bin parsing. FIX (both backends' `Expr::IntFromStrRadix` arm — rust-codegen ~1252, ruchy ~1075, NO IR change): emit a normalizing block instead of the bare `from_str_radix`. Bind `__ri = &(value)` (borrow, no move/temporary-safe), `__rt = __ri.trim()`, peel the optional leading sign (`-`→keep, `+`→drop) into `(__rsgn, __rb)`, then — SPECIALIZED PER RADIX at codegen time (radix is a compile-time u32) — strip the base-matching prefix via `__rb.strip_prefix(\"0x\").or_else(|| strip 0X).unwrap_or(__rb)` (only for radix 2/8/16; other bases skip), then `__rc = format!(\"{}{}\", __rsgn, __rb.replace('_', \"\"))` to drop underscores, and finally `i64::from_str_radix(&__rc, base).expect(...)`. Fixes BOTH int-builtins-1 (prefix) and int-builtins-2 (underscores) from HUNT-V3 in one site. Differential-verified vs python3: 0x/0X/0o/0b prefixes, signed `-0x1a`(-26)/`+0x10`(16), underscore grouping base-16 (`1_000`→4096) and base-10 (`1_000_000`), unprefixed `ff`(255), signed-unprefixed `-1a`(-26). Regression: existing int_from_str_radix e2e driver (unprefixed/signed digit strings) still passes; shape assertions updated `from_str_radix((s).trim(),16)` -> `from_str_radix(&__rc, 16)` + `__rb.strip_prefix(\"0x\")`. New e2e int_radix_prefix.py rustc-rt. FREE CI. e2e 411->412. SHIPPED v0.1.354. FOUND BY HUNT-V3 (int-builtins-1 + int-builtins-2)."
