  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A DEFECT in PMAT-645/646 (starred unpacking): `a, *rest = xs; rest.append(...)` emitted `let rest` (NOT `let mut rest`) -> rustc E0596 (cannot borrow as mutable) — a transpile->invalid-rust for a common pattern (head/tail then mutate the tail). ROOT CAUSE: the mutability pre-walk (compute_mutable_names -> walk_counts) counts plain-Name tuple-Assign targets (PMAT-547) but SKIPPED the Name INSIDE a Starred element, so the star name's BINDING wasn't counted; a later mutation alone (count 1) didn't reach the `count > 1` mutable threshold -> plain `let`. (Prefix names ARE Name elts so they were already counted/correct; only the *star* name was the gap.) FIX (frontend walk_counts, the tuple-Assign-target loop): add an `ast::Expr::Starred(s)` arm that extracts the inner Name and bumps its count, mirroring the plain-Name arm. Now `*rest`'s binding + a later rest.append()/rest.sort() -> count>1 -> mutable -> lower_starred_unpack's `let` emits `let mut`. Differential-verified vs python3: rest.append (14), rest.sort (25), *mid mutated (10). Regression: prefix-mut (17), immutable-star stays plain `let` (no spurious-mut clippy -D-warnings failure), plain tuple unpack unaffected. Extended e2e starred_unpack.py (+ shape assert `let mut rest:` + runtime star_then_mutate). FREE CI. SHIPPED v0.1.346. FOUND BY HUNT-V2 (wwxjud2e6) — the corrected (baked-in fresh binary path, abort-on-version-mismatch) hunt that fixed the stale-binary trap; it surfaced this real defect in just-shipped code + 24 other findings (see project-correctness-hunt-backlog HUNT-V2)."
