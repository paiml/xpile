  - "`if x:` / `while x:` / `assert x` / a ternary condition (`a if x else b`) over an `Optional[T]` value was REJECTED ('condition does not type as bool') — `truthy_condition` (~4178) returned the Optional cond unchanged (its `_ => cond` arm), failing the caller's `!= Bool` check. Plain int/str/list truthiness already worked (PMAT-360/713). Python: None falsy, `Some(v)` truthy iff `v` truthy. FIX (NEW IR node `Expr::OptionTruthy { value, by_ref, body }` in meta-hir + 4-backend wiring): (1) frontend `truthy_condition` `Type::Optional(inner)` arm builds the inner-type truthiness over a bound `__v` via new `optional_inner_truthy_body(inner)` (I64→`__v!=0`, F64→`__v!=0.0`, Bool→`__v`, Str/List/Dict/Set→`Len(__v)!=0`), `by_ref=true` for the non-Copy inners; a truthiness-unsupported inner returns None → passthrough (clean reject). (2) infer_type/infer_type_in_ctx → Bool. (3) rust ~2891 + ruchy ~2478 codegen MIRRORED: `(value)[.as_ref()].is_some_and(|__v| <body>)` — `.as_ref()` only when by_ref; `Expr::Len` emits uniform `.len()` so the str/list body works on `&__v`. (4) lean refuses (Optional deferred). Plus exhaustive-match arms in expr_has_int_arith/escape_expr/collect_idents. Benefits ALL truthy_condition sites: if/while/assert/ternary/comprehension-filter. Differential-verified vs python3: if_int/str/list F/F/T over None/empty/nonempty, ternary -1/-1/100, while_opt 0/1, assert_opt(Some(0)) raises / Some(9)=42; int-truthiness regression (`1 if n else 0`→`if (n!=0)`) intact. New e2e optional_truthiness.py rustc-rt. FREE CI. e2e 478->479. SHIPPED v0.1.420. FOUND BY HUNT-V9 (item V9-18). FOLLOW-UPS: (a) Optional flow-narrowing on `if x:` so the narrowed value is usable in the truthy branch (`if x: return x+...` — narrowing on `if x is not None:` is separate); (b) `not x` over Optional (separate UnOp/not-truthiness path); (c) V9-19 value-returning `x or default` over Optional (needs `x.filter(|v| truthy(v)).unwrap_or(default)`, the V7-5 remainder)."
