  - "KNOWN LIMITATION (correctness): Python dicts preserve insertion order (3.7+) but the transpiler emits std::collections::HashMap, whose iteration order is arbitrary. So order-OBSERVING dict operations diverge from python3 in ORDER (values are correct): list(d.keys()), list(d.values()), list(d.items()), bare `for k in d:` / `for k,v in d.items()` where the body effect is order-dependent. Order-INDEPENDENT ops are unaffected: sum/len/max/min over values, specific-key get/set/in, sorted(d.keys()). Found via a differential python3-vs-rust hunt (list({'z':1,'a':2,'m':3}.keys()) -> py ['z','a','m'] vs rust ['m','z','a']). PROPER FIX is an epic: switch the Dict representation from HashMap to an insertion-ordered map. BLOCKER: the generated Rust compiles STANDALONE via rustc with no external crates (assert_rustc_runs uses bare rustc, no --extern), so indexmap::IndexMap cannot be used directly. Options: (a) emit a minimal Vec-backed ordered-map prelude (struct with Vec<K> order + HashMap index) into every module that uses a dict, then rewrite ALL dict codegen sites (literal construction, get/get_mut/insert/remove/keys/values/items/len/contains/iter/extend/clear, DictGet/DictSet/DictView/DictContains/DictUpdate/IndexAppend(dict)/del) across rust+ruchy codegen; remove must be shift_remove (order-preserving) not swap_remove; (b) Vec<(K,V)> assoc-list (O(n) lookup, simpler but perf regression). Decompose into sub-slices: (1) prelude type + literal/get/set; (2) keys/values/items/iter order; (3) remove/pop/del order; (4) get_mut/IndexAppend. HIGH PRIORITY because it violates the core invariant (transpile-success => matches python3). DO NOT rush in one autonomous firing — risks the 298 passing e2e tests; design first. Deferred 2026-06-14."
