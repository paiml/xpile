- id: PMAT-513
  github_issue: null
  item_type: task
  title: 'PMAT-513: [Tranche 2] Python Enum classes → Rust enums'
  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Tranche-2 — Python Enum classes (very common). class C(Enum): NAME = <int literal> → a Rust enum. Member access C.NAME → C::NAME (Expr::EnumVariant); the compile-time-known C.NAME.value lowers to its discriminant literal. KEY DESIGN: enum-typed values REUSE Type::Struct(name) at use sites (an enum is just a named type — params/returns/locals/equality all work with the bare name) → NO new Type variant, avoiding the ~17-site Type-enum blast radius. NEW IR: Item::Enum{name, variants: Vec<(String,i64)>} + Expr::EnumVariant{enum_name, variant}. CODEGEN: rust/ruchy emit #[derive(Clone,Copy,Debug,PartialEq,Eq)] pub enum C { NAME, ... } (no explicit =disc needed since .value is frontend-resolved) + C::NAME; lean refuses Item::Enum + Expr::EnumVariant (collect_idents: empty arm). FRONTEND: is_enum_class(c) = single base Name 'Enum', no keyword bases; enum_variants(c) parses NAME=<int literal> members (int_literal_value handles USub/UAdd) — auto()/methods/non-int rejected; lower_enum_def→Item::Enum. NEW enums: Rc<HashMap<String,Vec<(String,i64)>>> registry built in the pre-pass (enum classes SKIPPED from the struct-registry scan via `if is_enum_class(c){...continue}`) and threaded through ctx/new()/lower_function_def/lower_top_level_stmt/lower_class_def like struct_properties. lower_top_level_stmt dispatches `ClassDef if is_enum_class` → lower_enum_def BEFORE the struct path (class_def_signature rejects bases). MEMBER ACCESS (bare-Attribute arm, ctx-aware): C.NAME.value (attr=='value' & inner is Attribute(Name(en),variant) & en∈enums) → LitInt(disc) checked FIRST; C.NAME (Name(en)∈enums) → EnumVariant (unknown variant → clean error). infer_type + infer_type_in_ctx EnumVariant → Type::Struct(enum_name). CLIPPY: lower_top_level_stmt hit too_many_arguments(8) → #[allow]; a frontend unit-test `function()` match got an Item::Enum panic arm. rustc rt enum_basic.py vs python3: red_value=1/blue_value=3 (.value), is_go (Signal param + ==Signal::GO), passthrough (Color local + ==Color::GREEN). FREE CI. SHIPPED v0.1.213 (e2e 275→276). REMAINING: auto(), IntEnum/StrEnum/Flag, enum methods, .name, c.value on a variable (needs match/cast), C(1) value-construction, case C.NAME: match."
- id: PMAT-512
  github_issue: null
  item_type: task
  title: 'PMAT-512: [Tranche 2] match |-patterns (case 0 | 1 | 2) → OR of equality tests'
  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Extends the match statement (PMAT-510) with or-patterns. A case whose pattern is ast::Pattern::MatchOr with literal-value alternatives desugars to an OR of equality tests (subject == a0 || subject == a1 || ...) via ast::Expr::BoolOp{op:Or, values}. ZERO new IR (BoolOp/or already lowers to ||). desugar_match_to_if refactored: an `eq` closure builds subject == <expr>; a `literal_value` closure extracts a literal value-pattern comparator (else clean error); the per-case test is `match &case.pattern { MatchOr(po) => BoolOp(Or, po.patterns.map(literal_value).map(eq)), other => eq(literal_value(other)) }`. A plain MatchValue still yields one comparison. Non-literal alternatives / captures / nested-or rejected with a clear message. rustc rt match_or_pattern.py vs python3: day_kind (case 5|6 weekend, case 0|1|2|3|4 weekday, terminal), vowel_score (case \"a\"|\"e\"|\"i\"|\"o\"|\"u\", statement position). FREE CI. SHIPPED v0.1.212 (e2e 274→275). REMAINING match: captures, guards, singletons, class/seq/map patterns, non-Name subjects."
- id: PMAT-510
  github_issue: null
