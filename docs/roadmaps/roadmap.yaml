  title: 'PMAT-597: [Tranche 2] CORRECTNESS standalone format(value[, spec]) builtin'
  status: done
  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #25; structurally identical to the repr() fix PMAT-582). The standalone format(x)/format(x,spec) builtin (distinct from str.format method + %-formatting) had no lowering -> fell through to generic call -> bare `format(...)` call, which rustc REJECTS because Rust's `format` is a MACRO not a fn (E0423). Transpile-success => invalid Rust on a documented builtin. FIX (frontend, REUSING existing machinery — no new IR): (1) factored the f-string field spec-application core (percent-special + translate_format_spec -> Expr::FormatSpec) out of lower_fstring_part_in_ctx into a shared helper `apply_nonempty_format_spec(ctx, value, spec)`. (2) Added a `format` dispatch arm after str()/repr(): format(x) / format(x, \"\") == str(x) (ToStr int/float, bool_to_python_str, str-as-is); format(x, \"<string-literal spec>\") -> apply_nonempty_format_spec. Non-literal or non-string spec rejected cleanly. Inference is post-lowering (the lowered FormatSpec/ToStr types as Str), so no I64 misinference / return-type reject. New e2e fixture format_builtin.py rustc-rt + python3 diff (format(255,\"x\")==\"ff\", format(42,\"05d\")==\"00042\", format(7)==\"7\", format(0.25,\".1%\")==\"25.0%\"). NOTE: format(neg_int, \"x\") inherits the f-string radix-of-negative two's-complement behavior (H4-3, separate open finding) — consistent with f-strings, not regressed here. FREE CI. e2e 357->358. SHIPPED v0.1.296. Remaining HUNT-4 picks: H4-2 round(int,ndigits) E0425, H4-11 empty-set() i64-default E0308, H4-16 dict-comp non-Copy reuse E0382, H4-3 f-string radix neg-int, H4-1+17 C0-sep whitespace, H4-18+19 titlecase, H4-9 method default params (gnarly), H4-15 float set/dict comp, H4-20 int==float precision."
