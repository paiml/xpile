  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #13). `reversed(s)` over a `str` fell through to generic call lowering, emitting a bare `reversed(...)` identifier -> rustc E0425 (reversed is not a Rust fn) — the reversed handler only recognized Type::List. So the textbook `\"\".join(reversed(s))` string-reversal idiom was transpile-success => invalid Rust. FIX (frontend, REUSING existing IR — no new variants): in the reversed handler, when the arg infers to Type::Str, lower to `Expr::Reversed { list: StrChars(s) }` — StrChars materializes the chars as list[str] (Vec<String>), Reversed preserves the list type — so reversed(s) types as List(Str) (matching Python where reversed(s) is an iterator of 1-char strings / list(reversed(s)) is a list of chars) and composes with `\"\".join(...)`, `list(...)`, and `for c in reversed(s)`. The s[::-1] slice form (yields str) keeps its separate StrMethodOp::Reverse lowering. New e2e fixture reversed_str.py rustc-rt + python3 diff (reverse_string(\"hello\")==\"olleh\", first_reversed==\"o\", reversed_len==5). FREE CI. e2e 356->357. SHIPPED v0.1.295. Remaining HUNT-4 picks: H4-25 format(n,spec) builtin E0423 (mirror repr), H4-2 round(int,ndigits) E0425, H4-11 empty-set() i64-default E0308, H4-16 dict-comp non-Copy reuse E0382, H4-3 f-string radix neg-int, H4-9 method default params E0061 (gnarly), D C0-sep whitespace H4-1+17, F titlecase H4-18+19."
- id: PMAT-595
  github_issue: null
  item_type: task
  title: 'PMAT-595: [Tranche 2] CORRECTNESS int sum()/enumerate(start) honor C-PY-INT-ARITH overflow contract'
  status: done
  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, cluster C, findings #14 sum + #28 enumerate — one slice closes both). Integer sum(xs[, start]) emitted bare `.iter().sum::<i64>()` (with `(start) +` prepended) and enumerate(xs, start) emitted bare `__i as i64 + start` — both BYPASS C-PY-INT-ARITH (every other int path: + * abs shl shr use checked_* + a contract-citing expect). Under -O the bare ops silently WRAP (Python promotes to bigint); debug panics with a generic msg. FIX (rust+ruchy codegen): int sum -> checked left fold seeded with start: `(xs).iter().fold(<start|0i64>, |__a, &__x| __a.checked_add(__x).expect(\"xpile: i64 addition overflow; bigint promotion (contract C-PY-INT-ARITH slow path) not yet implemented\"))` (folding the start in makes the seed contract-safe too); enumerate offset -> `(__i as i64).checked_add({start}i64).expect(<contract>)`. Float sum (Neumaier compensated) + start==0 enumerate UNCHANGED. i64 arithmetic now uniformly fail-loud. NO new IR. Updated existing emit-shape assertions (list_comp_expr, generator_expr, sum_start, sum_builtin, enumerate_start, enumerate_start_kwarg). New e2e fixture int_sum_overflow.py: normal cases python3-diff (sum([1,2,3])==6, sum([1,2,3],10)==16, enum start 10 -> last 12); overflow cases (i64::MAX+1 running sum; enumerate start i64::MAX) fail loud via catch_unwind. FREE CI. e2e 355->356. SHIPPED v0.1.294. Remaining HUNT-4 picks: E reversed-str/format builtins H4-13+25, H4-2 round(int,ndigits) E0425, H4-11 empty-set() i64-default E0308, H4-16 dict-comp non-Copy reuse E0382, H4-9 method default params E0061 (gnarly), D C0-sep whitespace H4-1+17."
