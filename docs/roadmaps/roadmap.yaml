  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A non-literal chained assignment `a = b = <expr>` was REJECTED ('only a scalar literal (int/float/bool/str) is supported') — `a = b = n + 1`, `x = y = z = n*2`, float/bool chains all failed. lower_chained_assign (~4702) re-lowered the value PER TARGET, safe only for an independent literal. FIX (frontend ONLY, NO IR change): lower the value ONCE; if it's a COPY scalar (Type::I64|F64|Bool) bind it to a temp `__chain` and copy into each target (`let __chain = EXPR; a = __chain; b = __chain;` — a Copy scalar assigns to several targets without a move, evaluated once); the scalar-LITERAL path stays re-lowered per target (independent + the only way to give each `str` target its own owned String); a non-Copy/aliasing value (str variable, list, dict, set) STILL rejects (would move/alias, diverging from Python's shared-reference semantics). Used a `use_temp` flag (not a boxed closure — clippy 'very complex type'). Differential-verified vs python3: a=b=n+1 (12), x=y=z=n*2 (24), a=b=p*1.5 (6.0), a=b=n>0 (bool), literal regression. Frontend unit test repurposed to assert BOTH the Copy-scalar success AND the non-Copy (list) reject. New e2e chained_assign_scalar.py rustc-rt. FREE CI. e2e 439->440. SHIPPED v0.1.382. FOUND BY HUNT-V6 (control-scope, item C2)."
