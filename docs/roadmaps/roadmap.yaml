  acceptance_criteria:
  - "`s.find(sub, start[, end])` / `s.count(sub, start[, end])` were REJECTED ('expected exactly 1' positional arg). Python searches within the char-slice `s[start:end]`: find returns the CHAR index in the ORIGINAL string (or -1), count the # of non-overlapping occurrences within the slice. FIX: (frontend ~8408) relax the str-method arg-count gate with `allows_start_end = matches!(op, Find | Count)` so find/count accept arity..=arity+2 args, passed through as StrMethod args (other methods keep exact arity); (codegen rust ~1475 + ruchy ~1281, MIRRORED) a `matches!(op, Find|Count) && args.len()>=2` branch char-slices the receiver to a fresh String `s[start:end]` via `.chars().skip(__st).take(__en-__st).collect()`, then find → `__st as i64 + __slice[..__b].chars().count()` / `unwrap_or(-1)`, count → `__slice.matches(&__sub[..]).count()`. start/end are CHAR indices with Python clamping (negative → +len, then `.clamp(0,__len)`); end defaults to __len for the 2-arg form. Fresh-String slice keeps byte→char conversion + `__st` offset correct for non-ASCII. Differential-verified vs python3: in-range, miss (outside slice), negative start (-3), 2-arg (no end), non-ASCII (`café au`.find('au',1)==5). New e2e str_find_count_startend.py rustc-rt. FREE CI. e2e 431->432. SHIPPED v0.1.374. FOUND BY HUNT-V5 (str-methods-3-count/find-start-end). NOTE: rfind/index/rindex start/end NOT extended (separate follow-up; arity stays 1)."
- id: PMAT-674
