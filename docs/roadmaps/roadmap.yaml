  status: done
  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #7). The for-loop enumerate lowering (the `for j,v in enumerate(...)` tuple-target path) read the start index ONLY from the 2nd positional arg (call.args[1]), so `enumerate(xs, start=10)` (keyword spelling) had args.len()==1, fell to the start=0 branch, and silently emitted `+ 0` — output-mismatch (Python yields 10,11,12…; Rust yielded 0,1,2…). FIX (frontend): resolve start from the 2nd positional arg OR a `start=` keyword (int literal, same constraint). Reject unknown enumerate keywords, a positional+keyword start conflict, and any keyword on zip (previously silently ignored). The rust/ruchy codegen already honor a nonzero start (positional form worked) → NO codegen change, no new IR. NOTE: the EXPRESSION-position enumerate (Expr::Enumerate, line ~8797) supports no start at all (neither positional nor keyword) — a separate pre-existing limitation, out of scope. New e2e fixture enumerate_start_kwarg.py rustc-rt + python3 diff (sum of indices 10+11+12==33 for BOTH keyword and positional forms; emitted Rust has `+ 10i64` twice). FREE CI. e2e 354->355. SHIPPED v0.1.293. Remaining HUNT-4 picks: C int-arith overflow H4-14+28 (checked_add, proven), E reversed-str/format builtins H4-13+25, H4-2 round(int,ndigits) E0425, H4-11 empty-set() i64-default E0308, H4-9 method default params E0061 (gnarly: implicit-self offset + AST receiver-type inference), D C0-sep whitespace H4-1+17."
