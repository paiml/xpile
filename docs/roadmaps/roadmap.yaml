  acceptance_criteria:
  - "A bare WIDTH format spec on a str — `f\"{s:5}\"`, `\"{:8}\".format(s)` — was REJECTED ('unsupported format spec :5 for a Str value'). Python LEFT-aligns strings to the width (`f\"{'ab':5}\"` == 'ab   '), and Rust's `{:5}` over a String is ALSO left-aligned (the Display default), so the spec passes through verbatim. FIX (frontend ONLY, translate_format_spec ~11666, NO IR change): add a `*ty == Type::Str && digits_only(spec) && !spec.starts_with('0') && !spec.is_empty()` arm → `Some(spec.to_string())`. CRITICAL: must NOT reuse the integer width path (ints default RIGHT-aligned; str defaults LEFT). A leading-`0` width (`{:05}`) is Python's zero-pad flag which Python REJECTS for a string ('=' alignment not allowed), so only a plain non-zero-leading width is accepted; explicit alignment (`>5`/`<5`/`^5`) was already handled by the align branch. Differential-verified vs python3: left-aligned width (f-string + .format()), explicit right-align regression, overflow (wider-than-width → NO truncation). New e2e str_width_format.py rustc-rt. FREE CI. e2e 438->439. SHIPPED v0.1.381. FOUND BY HUNT-V6 (str-format-methods, item C5)."
