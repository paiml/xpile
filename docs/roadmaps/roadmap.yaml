  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "`len(s.encode())` is a common Python idiom for the UTF-8 BYTE length of a string (`s.encode()` defaults to UTF-8), distinct from `len(s)` which counts Unicode CODE POINTS. `.encode()` is otherwise an unsupported method call, so the whole idiom REJECTED ('method calls are not supported'). FIX (frontend ONLY, the len() intercept ~8829, NO IR change): detect `len(s.encode())` / `len(s.encode(\"utf-8\"))` BEFORE lowering the argument (which would error on the method call) by peeking at the AST — `call.args[0]` is an `ast::Expr::Call` whose func is an `ast::Expr::Attribute{attr:\"encode\"}` with no kwargs and either no args or a single utf-8/utf8 string-literal arg — and route it to `Expr::Len` over the lowered receiver (str-typed). `Expr::Len` codegen emits `.len() as i64` = byte length of a Rust String = Python `len(s.encode())` for UTF-8. The plain-len(str) branch below (StrMethodOp::CharCount → `.chars().count()`) is UNCHANGED — code points. Differential-verified vs python3: café→5 bytes/4 chars, €→3 bytes, ASCII unchanged. New e2e len_encode_bytes.py rustc-rt. FREE CI. e2e 430->431. SHIPPED v0.1.373. FOUND BY HUNT-V5 (encode-bytelen)."
- id: PMAT-673
