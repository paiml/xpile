  title: 'PMAT-740: [Tranche 2] CORRECTNESS (a*b) % m widens product to i128'
  status: done
  priority: low
  created: 2026-06-16T00:00:00Z
  acceptance_criteria:
  - "`(a * b) % m` (modular arithmetic / hashing / `% MOD`) panicked on the intermediate product overflow (`a*b` exceeds i64) even when `(a*b) mod m` fits i64. Python computes it exactly. PANIC-MISMATCH, common. FIX (both codegens' `emit_floor_mod`, NO IR): when the dividend is a `*` tree, widen the whole product AND the floor-mod to i128 via a new `emit_mul_tree_as_i128` helper (recurses nested `*`, each leaf `(<e> as i128)`); the result `(a*b) mod m ∈ (-|m|, |m|) ⊆ i64` so the final `as i64` is exact. Mirrors the 3-arg pow i128 path. Bigint mode already promotes (guard `!mode`); non-overflow case computes the same value; zero-divisor still → ZeroDivisionError. Verified vs python3: mod_mul(i64::MAX,i64::MAX,1e9+7)==737564071 (was panic), floor-mod sign mod_mul(-7,3,5)==4, non-overflow mod_mul(10,20,7)==4. New e2e mod_mul_i128.py (rt). FREE CI. e2e 504->505. SHIPPED v0.1.440. FOUND BY HUNT-V12 (item V12-24; contained extract from the bigint-runtime epic V12-24..30; a bare a*b or unbounded rolling hash still needs the full bigint slow-path)."
