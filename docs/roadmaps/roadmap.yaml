  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, H5-24). `xs.pop(i)` with a RUNTIME negative i (a variable/expr, not a literal) emitted `(xs).remove((i) as usize)`; (-1) as usize = usize::MAX -> Vec::remove panics, where Python pop(i<0) removes from the end (i+len). Literal pop(-1)/pop(-k) already resolved to `len(xs) - k` (PMAT-570); literal pop(0)/pop(2) inline; only the runtime-variable case broke. FIX (frontend pop general case): when the lowered index is NOT an Expr::LitInt, wrap it in a normalize block `Expr::Block { [Let __pidx = i], IfExpr { __pidx < 0 ? Len(recv) + __pidx : __pidx } }` (single-eval). Extended the rust-codegen `expr_mentions_ident` with IfExpr + Block arms so refs_self detects the receiver inside the normalized index (binds __pi before the mutable remove -> no E0502). Non-negative literals keep the inline `(i) as usize`; negative literals keep `len - k` (both byte-identical, zero churn on list_pop/neg_pop_del). NOTE: multi-eval avoided via the Block's single let; a side-effecting pop index is still single-eval. New e2e fixture pop_runtime_negative.py rustc-rt + python3 diff (pop_at([10,20,30,40], -1)=40, -2=30, 0=10, 2=30). FREE CI. e2e 369->370. SHIPPED v0.1.308. Remaining HUNT-5 clean picks: H5-12 int('1_000') underscore, H5-15 NaN spec'd format, H5-27 comp-var-shadows-bound (3-site), H5-23 float//inf, H5-8 unpack-temp hygiene, H5-30 int max/min empty exit-code. Architectural (deferred): dict iteration order (PMAT-537), typed-exceptions H5-16/17."
