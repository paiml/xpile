  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #4, finding #16). A single-generator dict comprehension reusing a non-Copy loop var in BOTH key and value (`{w: w for w in words}`, `{w: w + \"!\" …}`, `{k: len(k) …}`) lowers (lower_dict_comp_in_ctx -> lower_comp_to_map) to a map closure building `Expr::TupleLit([key, value])` = `(w, w)`. The bare-binder key MOVES the String into the tuple before the value can use it -> rustc E0382 despite clean transpile. FIX (frontend): new helper clone_comp_key_if_binder_reused — extract the single-gen binder name from comp.generators[0].target (Name), count its reads across comp.key + comp.value via count_reads_expr (AST), and if the binder is non-Copy (PMAT-588 predicate `!matches!(t, I64|F64|Bool)`) AND read >1x, wrap the lowered key in Expr::Clone. The value then keeps a live binder (`((w).clone(), w)`). Gated on read-count>1 + non-Copy -> Copy-binder (`{x: x*2}`) or single-use-binder comprehensions are BYTE-IDENTICAL (zero churn; clone fires only on previously-failing code), matching the PMAT-588 zero-churn philosophy. Only the single-gen path (the finding); 2-gen path uses distinct binders, left as-is. No new IR. New e2e fixture dict_comp_key_reuse.py rustc-rt + python3 diff (identity dedupe==2, with_suffix==\"a!\", key_lengths==3). All 40 existing comprehension tests unchanged. FREE CI. e2e 359->360. SHIPPED v0.1.298. Remaining HUNT-4 picks: H4-1+17 C0-sep whitespace (bulletproof, niche), H4-2 round(int,ndigits) E0425 (needs IR/algorithm), H4-3 f-string radix neg-int, H4-18+19 titlecase (verify to_titlecase std), H4-20 int==float precision >2^53, H4-15 float set/dict comp, H4-21 d.get annotation Optional, H4-24 max/min signed-zero, H4-29 chr surrogate, H4-9 method default params (gnarly), H4-8 nested-fn mut (architectural)."
