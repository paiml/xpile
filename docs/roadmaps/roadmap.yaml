  - "A float-precision f-string spec (`f\"{x:.2f}\"`, `f\"{x:.0%}\"`) of a NaN printed \"NaN\" (Rust's `format!` float Display) where Python prints \"nan\" — a silent value-divergence (output-mismatch). inf already matched (Rust + Python both \"inf\"/\"-inf\"). FIX (both backends' `Expr::FormatSpec` arm — rust-codegen ~1189, ruchy ~1017, NO IR change): detect a float-precision spec — `rust_spec` (after an optional leading `+`) begins with `.` followed by an ASCII DIGIT — and wrap the emit `{ let __nf = <value>; if __nf.is_nan() { String::from(\"nan\") } else { format!(\"{:<spec>}\", __nf) } }`. A float-precision spec is float-ONLY (translate_format_spec gates `.Nf` on Type::F64 and the percent path emits `.N`), so `.is_nan()` always typechecks. CRITICAL the `.`-after-`+`-or-bare check excludes the `.`-FILL case from PMAT-658 (`{:.^9}` = `.` then an ALIGN char `^`, not a digit), which can apply to a non-float (str) — guarding it would emit `.is_nan()` on a String. Differential-verified vs python3: `{:.2f}` NaN->\"nan\" (was \"NaN\"), inf->\"inf\", 3.14159->\"3.14\", `{:.0%}` NaN->\"nan%\", `{:+.2f}` 3.5->\"+3.50\"; `.`-fill str `{:.^9}` 'xy'->'...xy....' regression untouched. SCOPE: the f-string + percent FormatSpec path. The str.format() METHOD path (lower_str_format builds a single StrFormat with specs embedded inline by arg-index) shares the DEFERRED arg-remap rework with strfmt-1 (.format() radix-neg) and is NOT covered here. Regression: existing fstring_spec assertion updated `format!(\"{:.2}\", x)` -> `format!(\"{:.2}\", __nf)` (the float-precision field now NaN-guards; the int/width/align specs keep the plain form). New e2e format_nan_precision.py rustc-rt. FREE CI. e2e 415->416. SHIPPED v0.1.358. FOUND BY HUNT-V3 (strfmt-3)."
