- id: PMAT-637
  github_issue: null
  item_type: task
  title: 'PMAT-637: [Tranche 2] x or default / x and y return the operand (Python truthiness)'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "Python `x or default` / `x and y` return the OPERAND by truthiness, not a Bool (`0 or 5 == 5`, `\"\" or \"d\" == \"d\"`, `xs or [9,9]`). xpile required BOTH `and`/`or` operands to be Bool (lower_bool_op_in_ctx left-folded BinOp{And/Or}) and REJECTED the ubiquitous default-value idiom ('operands of `and`/`or` must be Bool (no int-truthiness)'). Found by a differential probe. FIX (frontend lower_bool_op_in_ctx, NO new IR): for the common form — EXACTLY two operands, the FIRST a plain variable (`Ident`), both the SAME non-bool type with a defined truthiness (int/str/list/dict/set; float deferred) — lower to `Expr::IfExpr`: `a or b` -> `if <a-truthy> { a.clone() } else { b.clone() }`, `a and b` -> `if <a-truthy> { b.clone() } else { a.clone() }`. New helper bool_op_operand_truthy builds the test: I64 -> `a != 0`, Str/List/Dict/Set -> `Len(a) != 0` (reuses Expr::Len + PMAT-527 container-truthiness shape). KEY: the first operand is an Ident, so it's NEVER MOVED — the condition BORROWS it (truthiness test) and the value branch CLONES it (Expr::Clone) — no use-after-move, no temp needed; the second operand is also cloned (safe for any Clone type incl literals). IfExpr infers its type from then_expr (a.clone()/b → operand type). Bool operands keep the `||`/`&&` fold (guarded by `ta != Type::Bool`), so `a and b` / `a or b or c` / `if x>0 and y>0` are UNCHANGED. Chains (>2 operands), non-Ident first operand, and mixed-type operands fall through to the Bool-only path / reject (unchanged). Context-FREE lower_bool_op (rare positions) left rejecting — safe, no miscompile. Differential-verified vs python3: or_default(0)=5/(7)=7, and_then(0)=0/(3)=99, str_or hi/fallback, list_or 3/18 (empty->[9,9]). Regression: bool_op_var + all bool tests pass. New e2e short_circuit_operand.py rustc-rt. FREE CI. e2e 395->396. SHIPPED v0.1.336. **Future extension: float operands, non-Ident first operand (needs a temp to eval-once), chains (nested fold), mixed-type (common-supertype).**"
