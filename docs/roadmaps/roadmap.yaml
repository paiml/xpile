  - "`any(P(x) for x in xs)` / `all(...)` over a GENERATOR expression must short-circuit like Python's lazy genexpr, but xpile lowered it to `BoolReduce{Map{..}}` → codegen `.map(P).collect::<Vec>().iter().any(..)` — EAGER, evaluating P for EVERY element. A not-yet-needed element that errors (`any(1000//x>5 for x in [1,0])`: x=0 div-by-zero) PANICS at runtime where Python short-circuits at x=1 → True. FIX: add `short_circuit: bool` to Expr::BoolReduce (meta-hir variant), set in the frontend any/all intercept (~9239) iff `call.args[0]` is `ast::Expr::GeneratorExp` (lazy); codegen (rust ~1948 + ruchy ~1688) then FUSES the inner Map's predicate into the any/all closure — `<inner>.iter().cloned().any(|__k| { let <param> = __k.clone(); <body> })` — and Rust any/all short-circuit. A LIST comprehension (`any([P(x) for x in xs])`) is EAGER in Python (short_circuit=false) → keeps `.map().collect().iter().any()` (no new divergence: a skipped-element error still occurs, matching Python's eager list construction). Differential-verified vs python3: `any(1000//x>5 for x in [1,0])`→True (no panic), `all(x>0 and 100//x>0 for x in [5,-1,0])`→False (short-circuits at -1), genexpr truthiness, list-comp stays eager. New e2e any_all_short_circuit.py rustc-rt. FREE CI. e2e 445->446. SHIPPED v0.1.388. FOUND BY HUNT-V7 (item V7-3). (chore: removed stray libg_lib.rlib + .gitignore *.rlib/*.rmeta/*.o.)"
