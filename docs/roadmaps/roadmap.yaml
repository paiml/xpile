  title: 'PMAT-680: [Tranche 2] CORRECTNESS float .Nf format/percent of NaN prints nan'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "A bare float-precision format spec over NaN must print 'nan' (Python), but xpile emitted Rust's 'NaN' for the `.format()` and `%` paths (`\"{:.2f}\".format(nan)`, `\"%.2f\" % nan`, `\"%f\" % nan`). The f-string path already guarded this (PMAT-659 — Expr::FormatSpec codegen NaN-checks a float-precision spec); `.format()`/`%` INLINED the spec into a bare format!, bypassing the guard (DEDUP D2 of str.format-float-NaN + percent-format-float-NaN). FIX (frontend ONLY, NO IR change): route an F64 arg with a spec through Expr::FormatSpec (a separate plain `{}` field carrying the spec) instead of inlining `:{spec}`, so the existing NaN guard fires — exactly as the f-string path does. (a) lower_str_format: F64 arg referenced EXACTLY ONCE → FormatSpec (reuses the PMAT-676 ref-count pre-scan so the in-place arg rewrite is safe; multi-ref keeps the inline embed). (b) lower_percent_format: the `%f` conversion → FormatSpec (% args positional, each used once; spec CORE assembled separately then carried by FormatSpec). FormatSpec emits the identical format!(\"{:spec}\", v) for a non-NaN value → behavior-preserving otherwise. Updated format_spec/percent_format shape assertions to the guarded form (runtime identical). Differential-verified vs python3: .format/%.2f/%f(default prec)/f-string of NaN all → 'nan'; normal values + int specs unchanged. New e2e format_float_nan.py rustc-rt. FREE CI. e2e 436->437. SHIPPED v0.1.379. FOUND BY HUNT-V6 (str-format-methods, item A4). NOTE: width+precision NaN (`{:8.2f}` → '     nan') still deferred — the FormatSpec guard stays scoped to a bare `.N` precision (no width) since width-padding of the literal 'nan' string isn't yet applied."
- id: PMAT-679
