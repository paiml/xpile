  acceptance_criteria:
  - "CORRECTNESS (differential hunt #5, float twin of H5-12). float(\"1_000.5\")==1000.5 and float(\"1.5e1_0\")==1.5e10 in Python (PEP 515), but the float(str) NumCast (from_str, to_float) lowered to `(s).trim().parse::<f64>()`; Rust's f64 FromStr rejects '_' -> runtime panic on valid Python. FIX (rust+ruchy NumCast codegen): validate Python's EXACT rule — every '_' must have an ASCII digit on both sides (which also covers the fractional + exponent parts) — then strip + parse; invalid placements (1_.5, 1.5_, _1.0, 1_e5) still raise ≈ ValueError. No new IR. ALSO fixed a latent E0716 (temporary value dropped while borrowed) in BOTH the new float block and the shipped PMAT-610 int block: they bound the trimmed &str (`let __ps = (expr).trim()`), dropping a temporary-String operand (float(\"inf\"), int(\"1_000\")) at the end of that let while __ps still borrowed it — surfaced via the math_round_overflow fixture (float(\"inf\")) in CI. Both blocks now bind a *reference* first (`let __pf = &(expr); let __ps = __pf.trim()`): temporary lifetime extension keeps a temporary alive for the block, and a reused variable operand is NOT moved (vs binding the value). New e2e fixture float_str_underscore.py (incl. a string-literal/temporary-operand fn) rustc-rt + python3 diff; int_str_underscore.py gains the same temporary guard. Updated str_parse float assertion to the new shape. FREE CI. e2e 371->372. SHIPPED v0.1.310. Remaining HUNT-5 clean picks: H5-15 NaN spec'd format, H5-27 comp-var-shadows-bound (3-site), H5-23 float//inf, H5-8 unpack-temp hygiene, H5-30 int max/min empty msg. Architectural (deferred): dict iteration order (PMAT-537), typed-exceptions H5-16/17."
