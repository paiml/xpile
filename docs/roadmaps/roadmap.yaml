  - "CORRECTNESS (differential hunt #5, H5-11). 3-arg pow(a,b,m) with a NEGATIVE modulus: Python returns a result with the SIGN of m (range (m,0] for m<0); pow(10,2,-3)=-2, pow(2,5,-100)=-68. The modpow square-multiply block (PMAT-571) normalizes the base to a non-negative residue and never re-signs __pmr, so it returned the Euclidean residue (always [0,|m|)) -> silent miscompile. FIX (rust+ruchy PowMod codegen): after the while loop, before the trailing __pmr, insert `if __pmm < 0 && __pmr != 0 { __pmr += __pmm; }` (mirrors the floor-mod sign rule already used for // and %). Positive modulus (common case) unchanged. No new IR. Note: negative-base + negative-modulus base-normalization is a separate untouched edge (flagged cases use positive base). New e2e fixture pow_negative_modulus.py rustc-rt + python3 diff (mp(10,2,-3)=-2, mp(2,5,-100)=-68, mp(7,3,-5)=-2, mp(5,3,-7)=-1; positive mp(10,2,3)=1, mp(2,5,100)=32). FREE CI. e2e 365->366. SHIPPED v0.1.304. Remaining HUNT-5 clean picks: H5-24 pop(neg idx, needs refs_self/single-eval care), H5-13 pow(bool) E0425, H5-27 comp-var-shadows-bound, H5-12 int('1_000') underscore, H5-21+22 math.floor/ceil/trunc saturate, H5-28 max/min empty float-gen, H5-15 NaN spec'd format. TOP architectural: dict iteration order H5-6/7/26 (HashMap->IndexMap), typed-exceptions H5-16/17."
