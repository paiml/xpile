  acceptance_criteria:
  - "Third 503 sub-slice (after 503a raise→panic, 503b value-fallback return-form try). Handles STATEMENT-position `try: x = <expr> except [E]: x = <expr>` (same target both arms) → `let x = match catch_unwind(AssertUnwindSafe(|| <body>)){Ok(v)=>v,Err(_)=><handler>}` (or `x = …` if x already bound). REUSES the 503b Expr::TryCatch — the closure PRODUCES the value, so NO closure-mutation hazard (the assign happens outside the closure). IMPL: lower_assignment_try(ctx, StmtTry) recognizes the shape (orelse+finalbody empty, 1 handler, name None, body+handler each = single [Stmt::Assign] to a Name, same target name), lowers both value exprs ctx-aware, builds Expr::TryCatch, emits Stmt::Let (fresh) or Stmt::Assign (rebind) mirroring lower_assign's tail; wired into lower_block_stmt's NEW ast::Stmt::Try arm (trailing return-form try still goes to terminal_try_as_expr in lower_function_def). **CRITICAL FIX: walk_counts (mutability pre-walk) now descends into Stmt::Try — body + each handler MERGED BY MAX (merge_branch_counts, like if-branches: alternatives, only one runs) + else/finally additive. This marks a reassigned try-target `let mut` EXACTLY when needed and NEVER spuriously (a fresh `let v = <try>` counts v once → non-mut → no unused_mut clippy -D warnings failure).** rustc rt try_except_assign.py vs python3: lookup (fresh binding v, dict KeyError→-1), accumulate (already-bound mut base READ inside both arms so no dead-init warning, IndexError). FREE CI. SHIPPED v0.1.200 (e2e 261→262). REMAINING 503: multi-stmt try bodies, `except E as e` (Rust panic msg ≠ Python exc str — semantically tricky), type-specific dispatch (Rust panics untyped), else/finally."
- id: PMAT-503B
  github_issue: null
  item_type: task
  title: 'PMAT-503b: [exceptions epic] try/except value-with-fallback via catch_unwind'
  status: done
  priority: high
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Second sub-slice of PMAT-503 (after 503a raise→panic v0.1.37). KEY INSIGHT: xpile ALREADY models Python exceptions as Rust PANICS (ZeroDivisionError via floor-div .expect, IndexError via Vec index, KeyError via HashMap index, etc.), so try/except maps coherently to std::panic::catch_unwind. NEW Expr::TryCatch{body,handler} in meta-HIR. `try: return <body> except [E]: return <handler>` → rust/ruchy emit `match ::std::panic::catch_unwind(::std::panic::AssertUnwindSafe(|| <body>)) { Ok(__xpile_try)=>__xpile_try, Err(_)=><handler> }`. Lean REFUSES (no panic model). Inferers: TryCatch types as body. expr_has_int_arith recurses body+handler. FRONTEND: terminal_try_as_expr(ctx, &StmtTry) recognizes the terminal shape — orelse+finalbody empty, exactly 1 handler, handler.name None (no bound exc object), try-body = single [Stmt::Return(expr)], handler-body = single [Stmt::Return(expr)]; both lowered via lower_return_value (so Optional-return wrapping applies); wired into the trailing-stmt match (lower_function_def) next to the if-as-return-expr (terminal_if_as_expr) path; non-matching shapes → clean error. **WHY the RESTRICTED return/return form: it avoids the catch_unwind early-return-in-closure hazard (a `return` inside the closure would return from the CLOSURE not the fn). Body is an EXPRESSION, so it's safe.** rustc rt try_except.py vs python3: safe_div(ZeroDivisionError→-1), safe_index(IndexError→0), safe_lookup(KeyError→-1); the e2e DRIVER installs a no-op panic hook (std::panic::set_hook) so the expected CAUGHT panics don't spam stderr. FREE CI. SHIPPED v0.1.199 (e2e 260→261). REMAINING PMAT-503: multi-stmt try bodies, `except E as e` bound object, exception-type-specific dispatch (hard — Rust panics untyped; would need a typed payload), else/finally. NEXT: a 503c sub-slice OR back to Track-4/other."
