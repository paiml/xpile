  - "A variable bound BEFORE a loop and reassigned ONLY in the loop's `else` clause was emitted `let` (no `mut`) → rustc E0384 ('cannot assign twice to immutable variable'). COMMON idiom: `r=\"found\"; for x in xs: if x==t: break / else: r=\"missing\"; return r`. ROOT: `walk_counts` (the let-vs-let-mut pre-pass, ~522) `While`/`For` arms recursed into the loop `body` ONLY, never the `orelse`, so the else-clause reassign was uncounted → count<2 → plain `let`. FIX (frontend ONLY, NO IR change): both arms now also `for (name,c) in walk_counts(&w.orelse/&f.orelse, in_loop) { *counts.entry(name)+=c }`. The else body runs ONCE on loop-completion (not per-iteration) → uses the ENCLOSING `in_loop` flag, NOT the loop's own `true`. NO spurious `mut`: a name crosses the >1 threshold via the else only when genuinely reassigned (bound before + set in else); clippy -D warnings (rejects unused mut) confirms. Differential-verified vs python3: find_or for-else ('found'/'missing'), scan while-else ('exhausted'/'ok'); existing loop_else (PMAT-687) regression intact. New e2e loop_else_mut.py rustc-rt. FREE CI. e2e 455->456. SHIPPED v0.1.397. FOUND BY HUNT-V8 (item V8-1, highest-EV contained)."
- id: PMAT-697
