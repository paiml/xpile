  title: 'PMAT-506g: [classes epic] dataclass @staticmethod → assoc fn + Class::method call'
  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Seventh classes sub-slice. A class @staticmethod lowers to a plain associated function (no self receiver) inside the impl block, and a call Class.method(args) lowers to Class::method(args). ZERO new IR — reuses Expr::Call with a qualified callee string (emit_call writes callee verbatim → `Class::method(args)`), and a no-self Function emits as `pub fn m(args)` via the existing emit_function path. NEW helper is_staticmethod(m): m.decorator_list contains a bare Name(\"staticmethod\"). MODULE PRE-PASS: a new scan over ClassDef members inserts each @staticmethod into sig_map under the qualified key `Class::method` (FnSig{ret,params,defaults,variadic:None}) BEFORE `let signatures = Rc::new(sig_map)` — so the static call types via the existing Expr::Call signature-table inference (ctx.signatures.get(callee)); presence of the qualified key IS the 'is static' signal (no new Rc registry field needed). class_def_signature skips @staticmethod members from method_returns (they are NOT instance methods → struct_methods stays instance-only). lower_class_def: for a @staticmethod, clears decorator_list (lower_function_def rejects decorators) and lowers with self_type=None, pushing to the same methods vec. CALL SITE (lower_expr_in_ctx_inner Call(Attribute) arm, after the math check, BEFORE the instance-method block): if attr.value is Name(C) with C in ctx.structs → form key C::method; if ctx.signatures has it → Ok(Expr::Call{callee:key,args}); else clean error (instance method reached via class name → 'not a @staticmethod', never emit invalid Class::method without &self). rustc rt dataclass_staticmethod.py vs python3 (add=9, triple=21, boosted=40; instance method boosted() calls MathBox::add + MathBox::triple via the class). Rejection test staticmethod_instance_via_class_rejected.py (Box.get(5) where get is an instance method). FREE CI. SHIPPED v0.1.207 (e2e 268→270). REMAINING 506: @classmethod (needs cls→Self + `cls(...)` alternate-constructor mapping), &mut self mutating methods (caller-mutability inference — the hard one), inheritance."
