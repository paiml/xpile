  title: 'PMAT-575: [Tranche 2] CORRECTNESS left-shift value overflow (C-PY-INT-ARITH contract falsification)'
  status: done
  priority: high
  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS / CONTRACT INTEGRITY (differential hunt #3). `x << n` lowered to `(x).checked_shl(u32::try_from(n)..).expect(..overflow..)`, but checked_shl only returns None when the shift AMOUNT >= 64 — it does NOT detect lost significant bits. So `1i64 << 63` returned Some(i64::MIN) and the overflow .expect() NEVER fired: a silent wrap that FALSIFIES C-PY-INT-ARITH's overflow guarantee (Python << is exact/arbitrary-precision, so the contract promises a panic until bigint promotion, same fail-loud posture as checked add/mul/pow). This is the highest-integrity bug class: a contract that claims overflow detection but silently wraps. FIX: in emit_checked_shift (rust + ruchy codegen), for left-shift in non-bigint mode (`method==checked_shl && !mode`) emit a reversibility check via a block — a shift loses no significant bits iff `(v << n) >> n == v` (arithmetic shift-back, correct for BOTH signs); panic with the bigint-promotion message on mismatch. Right-shift never value-overflows (kept plain); bigint mode is arbitrary-precision and already routes through xpile_bigint::shl (untouched). NO new IR. Valid shifts unaffected incl. -2<<62==i64::MIN (fits exactly). rustc rt left_shift_overflow.py vs python3 (1<<10=1024, 3<<20=3145728, -2<<62=i64::MIN; 1<<63 and 3<<62 now PANIC via catch_unwind, were silent wraps). Existing bits.py + bigint shift tests still green (block still contains the checked_shl substring). FREE CI. e2e 335->336. SHIPPED v0.1.274. NEXT contract-integrity siblings from hunt-3: abs(i64::MIN) wraps (#34, checked_abs), x>>n panics for n>=64 (#36, Python defines it), int(big_float) saturates (#35). Plus sorted()-over-float E0277 (#32), chained-compare double-eval (#12-14), float div-by-zero (#6-8)."
