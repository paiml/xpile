  - "`s.rsplit(sep, maxsplit)` was unsupported (unrecognized str method). Splits from the RIGHT capping at maxsplit splits — common for peeling the last component (`name.rsplit('.', 1)`, `path.rsplit('/', 1)`). FIX (mirrors split(sep,maxsplit)=SplitN; ~8-site ripple): new StrMethodOp::RSplitN (meta-hir); a DEDICATED 2-arg frontend branch (next to the split branch, BEFORE the generic str_method_op path) builds StrMethod{RSplitN, [sep, maxsplit]}; str_method_op maps bare `rsplit`->Split (1-arg form == split); arity RSplitN=2; both inference arms -> List(Str). Codegen (rust+ruchy): `.rsplitn(((maxsplit) as usize).saturating_add(1), &(sep)[..]).map(|c| c.to_string()).collect::<Vec<String>>().into_iter().rev().collect::<Vec<String>>()` — Rust rsplitn yields parts RIGHT-TO-LEFT, so the collected Vec is REVERSED to restore Python's left-to-right order (rsplitn is not DoubleEndedIterator, so collect-then-rev, not .rev() on the iterator). Negative maxsplit = no limit (saturating_add keeps usize::MAX, matching split PMAT-621). Lean refuses via generic StrMethod (no new arm needed — build confirmed exhaustive matches all use wildcards/generic). Differential-verified vs python3: 'a/b/c/d'.rsplit('/',2)->[a/b,c,d], strip-ext rsplit('.',1)[0], neg-maxsplit all parts, bare rsplit==split. Regression: split(sep,maxsplit) unaffected. New e2e str_rsplit_maxsplit.py rustc-rt. FREE CI. e2e 402->403. SHIPPED v0.1.343. Found by a differential probe."
