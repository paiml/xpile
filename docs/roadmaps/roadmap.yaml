  status: done
  priority: medium
  created: 2026-06-13T00:00:00Z
  acceptance_criteria:
  - "Tenth classes sub-slice. A class @property lowers to a read-only &self method; a bare attribute read obj.prop (no parens) lowers to a no-arg Expr::MethodCall (obj).prop(). ZERO new IR (reuses MethodCall). is_property(m): bare @property decorator. NEW struct_properties: Rc<HashMap<String, Vec<String>>> registry (per-struct property NAMES), built in the pre-pass (a separate scan of c.body for @property members, collecting f.name) and threaded through LoweringCtx field + new() + lower_function_def + lower_top_level_stmt + lower_class_def alongside structs/struct_methods/struct_field_defaults. The property's RETURN TYPE lives in struct_methods (a @property is a non-static/non-class FunctionDef, so class_def_signature records it in method_returns automatically → MethodCall typing works). lower_class_def @property branch (after staticmethod): clear decorator_list (lower_function_def rejects decorators), lower as a read-only instance method (self_type=Some), body_assigns_self → reject (properties read-only). BARE-ATTRIBUTE READ ARM (lower_expr_in_ctx_inner ast::Expr::Attribute, the non-Call one): if obj types Struct(sname) and field ∈ struct_properties[sname] → MethodCall{obj, field, []} BEFORE the field-access check; else the existing field lookup. PRECISION: only REGISTERED properties auto-call — a bare access to a non-property method stays a clean 'no such field' error (NOT an invalid Class::method-style call), upholding transpile-success ⟹ valid Rust (a type-blind reuse of struct_methods would turn a bare multi-arg method read into an invalid 0-arg call = transpile-success-but-invalid-Rust). clippy: ps is Vec<String> → ps.contains(&field) not iter().any (manual_contains -D). rustc rt dataclass_property.py vs python3 (area_of(3,4)=12, perimeter_of(3,4)=14, described(3,4)=26; describe() reads self.area + self.perimeter as bare property reads → (self).area()). FREE CI. SHIPPED v0.1.210 (e2e 272→273). REMAINING 506: &mut self mutating methods (HARD — type-aware caller-mutability + by-ref params), inheritance, @property setters."
