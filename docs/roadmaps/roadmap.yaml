  title: 'PMAT-618: [Tranche 2] CORRECTNESS d.get(k) ==/!= value wraps value in Some (fixes E0308)'
  status: done
  priority: high
  created: 2026-06-15T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #7 H7-7, fresh v0.1.315). A no-default `d.get(k)` lowers to Expr::DictGetOpt → `d.get(&(k)).cloned()` : Option<T>. Comparing it to a bare value (`d.get(k) == 5`) emitted `Option<i64> == i64` → rustc E0308 (transpile-success → invalid Rust). Python `d.get(k)` is None when absent (`None == 5` is False, `None != 5` is True), which Rust models EXACTLY as `Option<T> == Some(5)`. FIX (rust+ruchy codegen, NO new IR): in emit_binop, for op ∈ {Eq, NotEq} guarded by `is_dict_get_opt(lhs) ^ is_dict_get_opt(rhs)` (exactly one side is a DictGetOpt), route to emit_opt_eq which emits the Option side as-is and wraps the BARE-VALUE side in `Some(...)`. Both-Option compares (`d.get(a)==d.get(b)`) → guard false → fall through to plain infix (Option==Option already typechecks). SCOPED to ==/!= ONLY: `<`/`>`/etc. on a possibly-None value is a Python TypeError (None < 5 raises), so ordering is intentionally left as-is (the rare valid case where the key is always present can't be proven statically — separate Optional-leak concern). New helpers is_dict_get_opt + emit_opt_eq + emit_opt_eq_operand in BOTH backends. New e2e fixture dict_get_compare.py rustc-rt + python3 diff (present-match true, present-nomatch false, absent false for ==; inverse for !=). FREE CI. e2e 378->379. SHIPPED v0.1.317. RELATED still-open (same Optional-leak root): H7-9 f-string interpolation of d.get(k) no-default → Option into format! E0308 (separate slice). Remaining hunt #7: H7-18 modpow neg-base+neg-mod, H7-11 set[float] E0277, for-loop-var cluster H7-14/16/17, pass-by-ref epic H7-8/13."
