  - "CORRECTNESS (differential hunt #3, three findings: side-effecting middle, equality chain, 4-term). A chained comparison `a OP b OP c` desugars to `(a OP b) && (b OP c) && ..` where each INTERIOR operand is SHARED by two adjacent sub-comparisons. lower_compare_in_ctx CLONED the lowered operand into both -> evaluated TWICE, diverging from Python (evaluates each operand exactly once, L-to-R). `0 < xs.pop() < 100` popped TWICE (wrong result + empty-pop panic for 1-elem list); an expensive middle ran twice. FIX: when ops.len()>=2, bind every operand to a fresh `__cmpN` temp ONCE inside an Expr::Block, then fold the sub-comparisons over the temps. Short-circuit order preserved (&& still stops at first false; only the one-time operand BINDING is hoisted, observable only for side-effecting operands = exactly the bug). Single comparison (ops.len()==1) shares no operand -> stays a plain BinOp, emit UNCHANGED. Per-sub-comparison Set-subset/float-promotion logic factored into new build_chain_cmp helper used by both paths. NO new IR (Expr::Block + Stmt::Let exist; infer_type already returns a block's trailing type). rustc rt chained_compare_side_effect.py vs python3 (pop_in_range([42])=true, pop_in_range([5,200])=false [double-eval gave true], four_term, eq_chain). Existing chained_compare assertion updated to temp form; in_range.py (explicit `and`, not chained) stays plain conjunction. FREE CI. e2e 336->337. SHIPPED v0.1.275. NEXT contained: #36 right-shift n>=64 saturate (emit_checked_shift), #32 sorted()-over-float E0277 (Sorted of_float). Then ownership/borrow cluster (#10/17/23/25-29) + typed-exceptions epic (#18-22)."
