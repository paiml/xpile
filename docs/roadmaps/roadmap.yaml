  created: 2026-06-14T00:00:00Z
  acceptance_criteria:
  - "CORRECTNESS (differential hunt #3 #36; right-shift companion to PMAT-575 left-shift). Python defines `x >> n` for any non-negative n: at n >= bit-width the result saturates to the SIGN FILL (0 for x>=0, -1 for x<0, since >> is arithmetic on signed i64). Rust checked_shr returns None for n>=64 -> the emitted .expect PANICKED where Python returns a value (panic-mismatch). FIX: emit_checked_shift right-shift non-bigint (`method==checked_shr && !mode`) emits a block clamping the amount to 63 when n>=64 (yields exactly the sign fill) and panicking on a NEGATIVE amount (Python ValueError: negative shift count). Left-shift (value-overflow check, PMAT-575) + bigint (xpile_bigint::shr) untouched. Rust+Ruchy. NO new IR. rustc rt right_shift_large_amount.py vs python3 (sh(20,2)=5, sh(5,64)=0, sh(-5,64)=-1, sh(5,100)=0, sh(-1,200)=-1, sh(5,-1) PANICS). bits.py test assertion updated (checked_shr -> `__shr_v >> __shr_amt`). FREE CI. e2e 337->338. SHIPPED v0.1.276. Shift-semantics pair (575 left + 577 right) now complete. NEXT: #34 abs(i64::MIN) overflow (NumBuiltin of_float ripple), #32 sorted-over-float E0277 (Sorted of_float), then ownership/borrow cluster (#10/17/23/25-29 by-ref params) + typed-exceptions epic (#18-22)."
