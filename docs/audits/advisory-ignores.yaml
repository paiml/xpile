# Advisory exemption ledger — the single place an exemption's OWNER and EXPIRY live.
#
# Enforced by crates/xpile/tests/advisory_expiry.rs, under the required
# `workspace-test` context. The gate holds:
#
#   1. every advisory ignored in deny.toml has an entry here
#   2. every entry names a crate, a reason, a person and an owner ticket
#   3. every entry carries a `removed_by` in ISO form, within max_window_days
#   4. no entry is past its `removed_by` — the day one is, the gate goes RED
#   5. no entry is DEAD: removing its ignore must still make `cargo deny` fail
#
# Rule 4 is the point. A standing exemption nobody re-reads is the thing being
# drained, and an exemption with no expiry is that same thing under another name.
#
# Rule 5 is the one this repository needed specifically. "Is this exemption still
# doing anything" cannot be answered from Cargo.lock: in paiml/ruchy the SAME
# advisory (RUSTSEC-2024-0436, paste) is DEAD — removing its ignore leaves
# cargo-deny at exit 0 — while here it is LIVE, because xpile sets
# `[graph] all-features = true` and ruchy does not. A crate in the lock is not a
# crate in the advisory's reachable graph. Only removing the ignore and watching
# the verdict change distinguishes them, and the gate does exactly that.
#
# And it does it PER EXEMPTION. Removing all exemptions at once and seeing
# `advisories FAILED` proves at least one is live, not that each one is; a test
# over a set does not license a claim about its members.
#
# `owner` is a person, not a ticket. An entry with a date and no owner is an
# unowned obligation that expires into a red nobody consumes. The review date IS
# `removed_by`; there is no second date field.
#
# Seven arrive via rustpython-parser (depyler-frontend's Python parser) and
# are unmaintained-ecosystem advisories rather than vulnerabilities. Five of
# them previously read only "# unmaintained ecosystem dep" and named no crate
# (0075, 0080, 0090, 0098, 0100 — a first draft of this file said three, and a
# review lane counted);
# an exemption nobody can identify is one nobody can retire, so the names below
# were recovered from cargo-deny's own output.
#
# The eighth, RUSTSEC-2024-0449 (unsafe-libyaml, PMAT-2172), arrives via
# serde_yaml 0.9, not rustpython-parser. It was not added to a changed tree: the
# advisory-db moved under an unchanged main and turned `ci / gate` red.

max_window_days: 90
ignores:
- id: RUSTSEC-2024-0449
  crate: unsafe-libyaml
  class: unmaintained
  source: deny
  owner: noah
  owner_ticket: PMAT-2172
  removed_by: '2026-11-30'
  reason: 'unsafe-libyaml 0.2.11, reached via serde_yaml 0.9.34+deprecated, which xpile, xpile-contracts,
    xpile-forjar-codegen and the third-party aprender-contracts 0.33.0 all depend on. Unmaintained
    upstream, not a vulnerability. The advisory-db changed under an unchanged tree: main''s gate was
    green on 2026-10-10 and red from PR #2171''s run on 2026-10-13. MEASURED live 2026-10-15:
    removing this ignore alone takes `cargo deny check advisories` from exit 0 to exit 1. Removal
    needs both halves: the in-tree crates off serde_yaml AND an aprender-contracts release without
    it; dropping only the in-tree uses leaves the advisory reachable.'
